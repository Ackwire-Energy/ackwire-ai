<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop wallpaper</title>
<!-- The agents' desktop wallpaper (1280×900), drawn by out/wall.js: render.sh screenshots this page. -->
<style>
@font-face {
  font-family: "Plus Jakarta Sans";
  font-weight: 200 800;
  src: url("../../../apps/web/public/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
}
html, body { margin: 0; overflow: hidden; background: #000; }
.wall { position: relative; width: 1280px; height: 900px; overflow: hidden; }
.wall > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
/* The logo as the app draws it (packages/ui Logo, components.css .ac-logo). */
.logo {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 0.28em;
  font-family: "Plus Jakarta Sans";
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  white-space: nowrap;
}
/* A screen pixel a cell: the 28 cell mark on its square box. */
.logo svg { width: 28px; height: 28px; flex: none; }
.logo .word { display: inline-flex; align-items: baseline; gap: 0.24em; }
</style>
</head>
<body>
<div class="wall"><canvas></canvas></div>
<script src="out/wall.js"></script>
</body>
</html>
