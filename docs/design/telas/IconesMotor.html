<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ícones dos motores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Doto:ROND,wght@100,600&display=swap">
<script>{const q=new URLSearchParams(location.hash.slice(1));document.documentElement.dataset.theme=q.get("theme")||"light";}</script>
<style>
/*
  Prototype: icons for the three engines an agent thinks and works with (ADR 0032):
    Claude Code  (computer brain)  a warm console; a pen nib writes by hand on its screen
    Codex        (computer brain)  a cool terminal over a stacked code block, the code between braces
    Agente       (model brain)     our own pixel agent (from packages/ui/src/agent/engine.js), thinking
  Our own drawings, never the vendors' marks (no starburst, no knot, no Codex logo): each engine is told
  apart by its tool, its temperature (warm / cool / the agent's own color) and what the screen shows.

  Directions (#dir=):
    a  Retrato         pixel portraits on the 48×48 grid, same family as IconesComputador.html
    b  Contorno        line icons on a neutral tile (the 16 px drawing, scaled)
    c  Objeto + agente a smaller pixel console with the agent's tiny pixel self beside it, using it;
                       Agente is the agent alone. In the product the tiny agent wears the agent's own color.
  Below 48 px every direction uses the same 16 px line icons (pixels don't read that small).

  States (#state=): idle (Parado) · working (Trabalhando: the pen writes / the code types / the agent
  looks around and thinks) · off (Indisponível: not installed or computer offline; screen off, desaturated).
  Theme: &theme=light|dark. Example: IconesMotor.html#dir=c&state=working&theme=dark
  Context shown: grid 144/96/48 + 16, the agent page "Motor" selector, the mission "Quem programa" picker,
  chips and the API fallback note, the desktop app's Ferramentas tab, inline text. Phone width: no horizontal scroll.
  Agents come only from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#fff;--sunken:#ebebe7;--line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;
  --agent:#0063d1;--agent-soft:#e3eefd;--cc:#c0603a;--cx:#1d7a82;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 8px 20px -6px rgba(23,23,22,.12),0 0 0 1px var(--line);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --sans:"Onest",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",monospace;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;
  --agent:#5aa8ff;--agent-soft:#11253f;--cc:#e8916b;--cx:#5cc3bd;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --top:inset 0 1px 0 rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
canvas.pt{display:block;image-rendering:pixelated;flex:none}
canvas.av{display:block;flex:none}
.off{filter:grayscale(1);opacity:.5}
@keyframes blinkc{50%{opacity:0}}
@keyframes write{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes look{0%,18%{transform:translate(0,0)}28%,48%{transform:translate(-1.1px,-.3px)}58%,78%{transform:translate(1.1px,-.5px)}88%,100%{transform:translate(0,0)}}

/* Line icons (24 grid, drawn at 16 px; scaled on the tiles of direction B) */
svg.ln{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
svg.ln .acc-cc{stroke:var(--cc)}
svg.ln .acc-cx{stroke:var(--cx)}
svg.ln.agent .bd{stroke:var(--agent)}
svg.ln .eye{fill:var(--agent);stroke:none}
svg.ln .cur{display:none}
svg.ln.working .cur{display:inline;animation:blinkc 1s steps(1) infinite}
svg.ln.working .acc-cc{stroke-dasharray:1;animation:write 1.8s linear infinite}
svg.ln.working .eyes{animation:look 3s ease-in-out infinite}
svg.ln.off{opacity:.45;filter:grayscale(1)}
@media (prefers-reduced-motion:reduce){svg.ln *{animation:none!important}}
.tile{display:grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.26);background:linear-gradient(180deg,var(--raised),color-mix(in srgb,var(--sunken) 60%,var(--raised)));box-shadow:var(--e1),var(--top);color:var(--ink2)}
.tile svg.ln{width:60%;height:60%;stroke-width:var(--sw)}
.tile svg.ln *{vector-effect:non-scaling-stroke}
.tile.off{filter:grayscale(1);opacity:.5}

/* Prototype bar */
.pbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12.5px;color:var(--muted)}
.pbar .lbl{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.pbar .grow{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;height:26px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}

.wrap{max-width:1000px;margin:0 auto;padding:28px 16px 80px;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:300;font-size:40px;letter-spacing:-.03em;line-height:1.05}
.lead{color:var(--muted);max-width:68ch;margin-top:8px}
.card{background:var(--raised);border-radius:20px;box-shadow:var(--e1),var(--top);padding:18px;min-width:0}
.cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:12px}
.muted{color:var(--muted)}

/* Grid of the three */
.stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.eng{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px 16px;border-radius:18px;background:linear-gradient(180deg,var(--plate),transparent);min-width:0}
.eng .big{display:grid;place-items:center;min-height:144px}
.eng .sm{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:wrap}
.eng .sm .l16{display:inline-flex;flex-direction:column;align-items:center;gap:6px;color:var(--faint);font-size:11px}
.eng .sm .l16 .box{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)}
.eng b{font-weight:600}
.eng small{color:var(--muted);font-size:12px;text-align:center;max-width:30ch}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px 2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunken);color:var(--ink2);max-width:100%}
.chip .sep{color:var(--faint);font-weight:500}
.chip .sub{color:var(--muted);font-weight:500}
.chip svg.ln{width:14px;height:14px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.ok svg.ck,.chip svg.ck{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}

/* Agent page: Motor */
.ahead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ahead h3{font-size:16px;font-weight:600}
.ahead p{color:var(--muted);font-size:13px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:box-shadow .15s,transform .15s;min-width:0}
.opt:hover:not([aria-disabled="true"]){box-shadow:var(--e2),var(--top);transform:translateY(-1px)}
.opt[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink),var(--e2)}
.opt[aria-disabled="true"]{cursor:not-allowed;background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.opt .n{font-weight:600;font-size:14.5px}
.opt .d{color:var(--muted);font-size:12.5px;line-height:1.45}
.opt .radio{position:absolute;top:14px;right:14px;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);background:var(--raised)}
.opt[aria-checked="true"] .radio{box-shadow:inset 0 0 0 5px var(--ink)}
.opt[aria-disabled="true"] .radio{display:none}
.opt .foot{margin-top:auto}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.sel{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 12px;border-radius:12px;background:var(--raised);box-shadow:var(--e1),var(--top);font-weight:500;min-width:0}
.sel span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--faint);flex:none}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.note svg.i{width:16px;height:16px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note span{color:var(--ink2)}

/* Mission picker */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.menu{margin-top:6px;padding:6px;border-radius:14px;background:var(--raised);box-shadow:var(--e2),var(--top);display:flex;flex-direction:column;gap:2px}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;min-width:0}
.mi:hover:not([aria-disabled="true"]){background:var(--plate)}
.mi[aria-disabled="true"]{cursor:not-allowed;color:var(--faint)}
.mi .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sunken);flex:none;color:var(--ink2)}
.mi .t{flex:1;min-width:0;display:flex;flex-direction:column}
.mi .t b{font-weight:600;font-size:13.5px}
.mi .t small{color:var(--muted);font-size:12px}
.mi svg.ck{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Message with fallback note */
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .b{min-width:0}
.msg .who{font-weight:600;font-size:13.5px}
.msg .who small{color:var(--faint);font-weight:500;margin-left:6px}
.msg .quiet{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--muted);font-size:12.5px}

/* Desktop app: Ferramentas */
.win{border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:var(--e2);max-width:640px}
.win .tb{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;background:var(--sunken);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted)}
.win .tb i{width:11px;height:11px;border-radius:50%;background:var(--line2)}
.win .tb span{flex:1;text-align:center;margin-right:46px}
.win .in{padding:18px}
.win h2{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.02em}
.win .lead{font-size:13px;margin:4px 0 14px}
.rows{background:var(--raised);border-radius:14px;box-shadow:var(--e1),var(--top)}
.trow{display:flex;align-items:center;gap:14px;padding:14px;border-top:1px solid var(--line);min-width:0}
.trow:first-child{border-top:0}
.trow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.trow .t b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.trow .t small{color:var(--muted);font-size:12.5px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;background:var(--raised);box-shadow:var(--e1),var(--top);white-space:nowrap}
.btn:active{transform:translateY(1px)}
.sw{width:36px;height:22px;border-radius:999px;background:var(--ink);position:relative;flex:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.25)}

.inline{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;color:var(--muted);font-size:13px}
.inline span{display:inline-flex;align-items:center;gap:6px}
.inline svg.ln{color:var(--ink2)}

@media (max-width:820px){.stage,.opts{grid-template-columns:1fr}.eng{flex-direction:row;flex-wrap:wrap;justify-content:center}.two,.fields{grid-template-columns:1fr}}
@media (max-width:820px){.eng{flex-direction:column}}
@media (max-width:520px){h1{font-size:32px}.card{padding:14px}.trow{flex-wrap:wrap}.trow .end{margin-left:62px}.eng .big{min-height:0}}
</style>
</head>
<body>
<div class="pbar"><span class="lbl">Protótipo</span><span class="grow"></span><div class="seg" id="dirs"></div><div class="seg" id="states"></div><div class="seg" id="theme"></div></div>
<main class="wrap" id="root"></main>
<script type="module">
import { drawAgent, idlePose, eyeShapes, inBody, toneAt, bodyTones, bodyPath } from "../../../packages/ui/src/agent/engine.js";

/* ================= Pixel drawing (48×48 grid) ================= */
const N = 48;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const ALU = ["#fbfbf9", "#eeeeea", "#dcdcd7", "#c4c4be", "#a3a39d", "#7d7d77"];
/* Claude Code: warm paper frame, a warm dark screen, clay ink. */
const WARM = ["#fdfaf5", "#f5ede2", "#e8dccb", "#d2c1a9", "#ae977d", "#806b56"];
const WSCR = ["#1d1815", "#251f1a", "#30271f"];
const CLAY = { hi: "#f2a982", mid: "#d4744a", lo: "#9c4b2a", ink: "#3d2215" };
/* Codex: cool slate frame, a cold screen, mint and ice code. */
const COOL = ["#f7f9fb", "#eaeef2", "#d6dde4", "#b9c3cd", "#8f9ba8", "#67737f"];
const COOL_BACK = ["#eef2f5", "#e0e6eb", "#cbd3db", "#b1bbc6", "#8f9ba8", "#67737f"];
const CSCR = ["#0e1317", "#131a1f", "#19232a"];
const MINT = "#6fd6bf", ICE = "#9cc0d8", SLATE = "#5f7b90";
const SKYL = ["#c6e1ff", "#8cc3ff"];

function painter(ctx) {
  const set = (x, y, c) => { if (c && x >= 0 && y >= 0 && x < N && y < N) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); } };
  const ramp = (x0, y0, w, h, tones, f) => {
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      const v = Math.max(0, Math.min(1, f((x - x0) / Math.max(1, w - 1), (y - y0) / Math.max(1, h - 1))));
      const k = v * (tones.length - 1), lo = Math.floor(k);
      set(x, y, tones[Math.min(tones.length - 1, lo + (k - lo > BAYER[(x & 3) + (y & 3) * 4] ? 1 : 0))]);
    }
  };
  const box = (x, y, w, h, c) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(i, j, c); };
  const clear = (...pts) => pts.forEach(([x, y]) => ctx.clearRect(x, y, 1, 1));
  const bits = (x, y, rows, colors) => rows.forEach((r, j) => [...r].forEach((ch, i) => { if (colors[ch]) set(x + i, y + j, colors[ch]); }));
  return { set, ramp, box, clear, bits };
}
function shadow(p, cx, y, w, dark) {
  const c = dark ? "rgba(0,0,0,.55)" : "rgba(23,23,22,.16)";
  for (let x = cx - w; x <= cx + w; x++) for (let j = 0; j < 2; j++) {
    const edge = 1 - Math.abs(x - cx) / w;
    if (edge > BAYER[(x & 3) + ((y + j) & 3) * 4] * (j ? 1.6 : 1)) p.set(x, y + j, c);
  }
}
/* A window: dithered frame, rounded corners, three title dots; returns the screen box. */
function windowFrame(p, x, y, w, h, tones) {
  p.ramp(x, y, w, h, tones, (u, v) => 0.04 + 0.28 * v + 0.08 * u);
  for (let i = x + 1; i < x + w - 1; i++) { p.set(i, y, tones[3]); p.set(i, y + h - 1, tones[4]); }
  for (let j = y + 1; j < y + h - 1; j++) { p.set(x, j, tones[3]); p.set(x + w - 1, j, tones[4]); }
  p.clear([x, y], [x + w - 1, y], [x, y + h - 1], [x + w - 1, y + h - 1]);
  for (const k of [0, 1, 2]) p.set(x + 3 + k * 2, y + 2, tones[3]);
  return { sx: x + 2, sy: y + 5, sw: w - 4, sh: h - 7 };
}
const screenFill = (p, s, tones, state) => p.ramp(s.sx, s.sy, s.sw, s.sh, tones, (u, v) => (state === "off" ? 0.04 : 0.1 + 0.8 * u * v));

/* Claude Code's screen: a prompt, some output, and a line written by hand (it grows while working). */
function ccScreen(p, s, state, t, pen) {
  screenFill(p, s, WSCR, state);
  if (state === "off") return null;
  const x = s.sx + 2, y = s.sy + 2;
  p.set(x, y, CLAY.mid); p.set(x + 1, y + 1, CLAY.mid); p.set(x, y + 2, CLAY.mid);
  p.box(x + 3, y + 1, Math.min(9, s.sw - 9), 1, "rgba(245,237,226,.72)");
  p.box(x, y + 5, Math.min(15, s.sw - 6), 1, "rgba(174,151,125,.55)");
  p.box(x, y + 7, Math.min(11, s.sw - 6), 1, "rgba(174,151,125,.55)");
  if (state === "idle" && t % 1.6 < 0.9) p.box(x + 4 + Math.min(9, s.sw - 9), y, 2, 3, CLAY.mid);
  const base = s.sy + s.sh - 5, full = s.sw - (pen ? 10 : 7);
  const len = state === "working" ? 3 + Math.floor((t * 7) % (full - 2)) : full - 4;
  let tip = [x, base];
  for (let i = 0; i <= len; i++) { const yy = base + Math.round(Math.sin(i * 0.75) * 1.3); p.set(x + i, yy, CLAY.hi); tip = [x + i, yy]; }
  if (!pen && state === "working" && t % 0.5 < 0.3) p.box(tip[0] + 2, base - 1, 1, 3, CLAY.mid);
  return tip;
}
/* A fountain-pen nib (our drawing), tip at column 4 of the last row. */
const NIB = ["...HHH...", "..HgGGH..", "..HgGGH..", "..HgGGH..", "..HgGGH..", ".MMMMMMM.", "MllLLLLLM", "MlLLKLLLM", "MlLLKLLLM", ".MlLKLLM.", ".MlLKLLM.", "..MLKLM..", "..MLKLM..", "...MKM...", "....M...."];
const nib = (p, tx, ty) => p.bits(tx - 4, ty - 14, NIB, { H: "#1d1d1b", G: "#3a3a37", g: "#5a5a55", M: CLAY.lo, L: CLAY.mid, l: CLAY.hi, K: CLAY.ink });

/* Codex's screen: braces, indented code that types in while working, a cursor. */
const BRACE_L = ["..XX", ".X..", ".X..", ".X..", ".X..", "X...", ".X..", ".X..", ".X..", ".X..", "..XX"];
const BRACE_R = BRACE_L.map((r) => [...r].reverse().join(""));
function cxScreen(p, s, state, t) {
  screenFill(p, s, CSCR, state);
  if (state === "off") return;
  const top = s.sy + Math.floor((s.sh - 11) / 2);
  p.bits(s.sx + 2, top, BRACE_L, { X: MINT }); p.bits(s.sx + s.sw - 6, top, BRACE_R, { X: MINT });
  const lines = [[0, 9, ICE], [2, 11, SLATE], [2, 7, MINT], [4, 8, SLATE], [0, 5, ICE]];
  const x0 = s.sx + 8, maxw = s.sw - 16, typed = (t * 3.2) % (lines.length + 2);
  let end = null;
  lines.forEach(([ind, len, c], i) => {
    let L = Math.min(len, maxw - ind);
    if (state === "working") { const k = typed - i; if (k <= 0) return; if (k < 1) L = Math.max(1, Math.round(L * k)); }
    const y = top + 1 + i * 2;
    p.box(x0 + ind, y, L, 1, c); end = [x0 + ind + L + 1, y];
  });
  if (end && (state === "working" || t % 1.6 < 0.9)) p.box(end[0], end[1] - 1, 1, 2, MINT);
}

/* Our pixel agent, from the engine's body, dither and eyes (n odd keeps the eyes symmetric). */
function pixAgent(p, x0, y0, n, color, look) {
  const tones = bodyTones(color);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (inBody((x + 0.5) / n, (y + 0.5) / n)) p.set(x0 + x, y0 + y, tones[toneAt(x, y, n, look.pose.turn)]);
  }
  for (const e of eyeShapes(look.style, look.pose)) {
    const ew = Math.max(1, Math.round(e.w * n)), eh = Math.max(1, Math.round(e.h * n));
    p.box(x0 + Math.round((e.x + e.w / 2) * n - ew / 2), y0 + Math.round((e.y + e.h / 2) * n - eh / 2), ew, eh, "#ffffff");
  }
}
/* Idle: blinks, glances a little. Working: looks around (up toward the thought, to the sides). Off: sleepy. */
function lookFor(state, t, seed = 0, toward = null) {
  if (state === "off") return { style: "sleepy", pose: { turn: [0, 0.2] } };
  const ip = idlePose(t, seed, { active: state === "working", expressions: [] });
  const k = state === "working" ? 0.11 : 0.05;
  let look = [ip.turn[0] * k, ip.turn[1] * k * 0.7];
  let turn = ip.turn.map((v) => v * (state === "working" ? 0.6 : 0.3));
  if (toward) { // keeps its eyes on the tool, glancing back now and then
    const glance = state === "working" && (t + seed) % 4 > 3.2;
    look = glance ? [0.02, -0.02] : [toward[0] * 0.09, toward[1] * 0.05 + (state === "working" ? 0.02 * Math.sin(t * 6) : 0)];
    turn = glance ? [0.1, 0] : toward.map((v) => v * 0.55);
  }
  return { style: "round", pose: { look, turn, blink: ip.blink } };
}
function halo(p, cx, cy, r, dark) {
  for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
    const d = Math.hypot(x - cx, y - cy); if (d > r) continue;
    const k = 1 - d / r;
    if (k * 0.7 > BAYER[(x & 3) + (y & 3) * 4]) p.set(x, y, dark ? (k > 0.6 ? "rgba(47,128,224,.26)" : "rgba(47,128,224,.13)") : (k > 0.6 ? SKYL[1] : SKYL[0]));
  }
}
/* A thought bubble with three dots; while working one dot after the other lights up. */
function bubble(p, x, y, state, t) {
  if (state === "off") return;
  const w = 14, h = 8;
  p.box(x, y, w, h, "#ffffff");
  for (let i = x + 1; i < x + w - 1; i++) { p.set(i, y, ALU[3]); p.set(i, y + h - 1, ALU[4]); }
  for (let j = y + 1; j < y + h - 1; j++) { p.set(x, j, ALU[3]); p.set(x + w - 1, j, ALU[4]); }
  p.clear([x, y], [x + w - 1, y], [x, y + h - 1], [x + w - 1, y + h - 1]);
  p.box(x, y + h + 1, 2, 2, "#ffffff"); p.set(x, y + h + 1, ALU[3]);
  p.set(x - 1, y + h + 4, ALU[4]);
  const on = Math.floor(t * 3) % 3;
  [3, 6, 9].forEach((dx, i) => p.box(x + dx, y + 3, 2, 2, state === "working" && i === on ? "#04203f" : ALU[state === "working" ? 3 : 4]));
}

const DRAW = {
  a: {
    claude(p, state, dark, t) {
      shadow(p, 24, 39, 20, dark);
      const s = windowFrame(p, 4, 7, 37, 31, WARM);
      const tip = ccScreen(p, s, state, t, true);
      const [tx, ty] = tip ?? [27, s.sy + s.sh - 5];
      nib(p, tx, ty - (state === "working" && t % 0.4 < 0.2 ? 1 : 0));
    },
    codex(p, state, dark, t) {
      shadow(p, 24, 40, 20, dark);
      windowFrame(p, 9, 4, 35, 29, COOL_BACK);
      const s = windowFrame(p, 4, 9, 36, 30, COOL);
      cxScreen(p, s, state, t);
    },
    agent(p, state, dark, t, color) {
      if (state !== "off") halo(p, 21, 25, 19, dark);
      shadow(p, 24, 42, 19, dark);
      p.ramp(5, 36, 38, 3, ALU, (u, v) => 0.08 + 0.45 * v + 0.15 * Math.abs(u - 0.5));
      p.box(5, 39, 38, 1, ALU[4]); p.clear([5, 36], [42, 36]);
      p.box(8, 40, 2, 2, ALU[4]); p.box(38, 40, 2, 2, ALU[4]);
      const bob = state === "working" && Math.sin(t * 5) > 0.5 ? -1 : 0;
      pixAgent(p, 10, 15 + bob, 21, color, lookFor(state, t, 1));
      bubble(p, 33, 1, state, t);
    },
  },
  c: {
    claude(p, state, dark, t, color) {
      shadow(p, 23, 40, 21, dark);
      const s = windowFrame(p, 2, 7, 33, 31, WARM);
      ccScreen(p, s, state, t, false);
      const bob = state === "working" && Math.sin(t * 5) > 0.5 ? -1 : 0;
      pixAgent(p, 33, 27 + bob, 13, color, lookFor(state, t, 2, [-1, -0.3]));
    },
    codex(p, state, dark, t, color) {
      shadow(p, 23, 40, 21, dark);
      windowFrame(p, 6, 3, 31, 28, COOL_BACK);
      const s = windowFrame(p, 2, 8, 32, 30, COOL);
      cxScreen(p, s, state, t);
      const bob = state === "working" && Math.sin(t * 5 + 1) > 0.5 ? -1 : 0;
      pixAgent(p, 33, 27 + bob, 13, color, lookFor(state, t, 3, [-1, -0.3]));
    },
    agent(p, state, dark, t, color) {
      if (state !== "off") halo(p, 22, 25, 20, dark);
      shadow(p, 23, 39, 14, dark);
      const bob = state === "working" && Math.sin(t * 5) > 0.5 ? -1 : 0;
      pixAgent(p, 12, 16 + bob, 21, color, lookFor(state, t, 1));
      bubble(p, 33, 2, state, t);
    },
  },
};

/* ================= Line icons (24 grid) ================= */
const f = (n) => +n.toFixed(2);
const agentEyes = (x, y, s) => eyeShapes("round").map((e) => { const w = e.w * s * 1.5, h = e.h * s; return `<rect class="eye" x="${f(x + (e.x + e.w / 2) * s - w / 2)}" y="${f(y + e.y * s)}" width="${f(w)}" height="${f(h)}" rx="${f(w / 2)}"/>`; }).join("");
const LINE = {
  claude: '<rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7 8.6 2.6 2.1L7 12.8"/><path class="cur" d="M11.6 12.8h3"/><path class="acc-cc" pathLength="1" d="M7.2 16.2c.9-1.1 1.8-1.1 2.7 0s1.8 1.1 2.7 0 1.8-1.1 2.7 0 1.4-1 2-.4"/>',
  codex: '<rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 8.6h18"/><path class="acc-cx" d="M10.2 10.8c-1 0-1.4.4-1.4 1.3v.4c0 .6-.3.9-.9.9.6 0 .9.3.9.9v.4c0 .9.4 1.3 1.4 1.3M13.8 10.8c1 0 1.4.4 1.4 1.3v.4c0 .6.3.9.9.9-.6 0-.9.3-.9.9v.4c0 .9-.4 1.3-1.4 1.3"/><path class="cur" d="M11.4 14.9h1.2"/>',
  agent: `<path class="bd" d="${bodyPath(4, 4.5, 16)}"/><g class="eyes">${agentEyes(4, 4.5, 16)}</g>`,
};
const ln = (eng, st = "idle", cls = "") => `<svg class="ln ${eng === "agent" ? "agent" : ""} ${st} ${cls}" viewBox="0 0 24 24" aria-hidden="true">${LINE[eng]}</svg>`;
const I = {
  mac: '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="11" rx="2"/><path d="M10.4 4.5h3.2v.7a.9.9 0 0 1-.9.9h-1.4a.9.9 0 0 1-.9-.9Z"/><path d="M2.5 18.2h19l-.9 1.1a1.6 1.6 0 0 1-1.2.6H4.6a1.6 1.6 0 0 1-1.2-.6Z"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>',
  alert: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4.5 21 19.5H3Z"/><path d="M12 10v4M12 17h.01"/></svg>',
  check: '<svg class="ck" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  dash: '<svg class="ck" viewBox="0 0 24 24"><path d="M7 12h10"/></svg>',
};

/* ================= State ================= */
const q = new URLSearchParams(location.hash.slice(1));
let dir = ["a", "b", "c"].includes(q.get("dir")) ? q.get("dir") : "a";
let state = ["idle", "working", "off"].includes(q.get("state")) ? q.get("state") : "idle";
let pick = "claude";
const DIRS = [["a", "A · Retrato"], ["b", "B · Contorno"], ["c", "C · Objeto + agente"]];
const STATES = [["idle", "Parado"], ["working", "Trabalhando"], ["off", "Indisponível"]];
const ENG = {
  claude: { name: "Claude Code", a: "Console quente; uma pena escreve à mão na tela", b: "Janela com o prompt e uma linha escrita à mão, em argila", c: "O agente usa um console quente, que escreve à mão" },
  codex: { name: "Codex", a: "Terminal frio sobre um bloco de código, entre chaves", b: "Janela com barra de título e o código entre chaves", c: "O agente usa um terminal frio, com o código entre chaves" },
  agent: { name: "Agente", a: "O próprio agente pensando na mesa, pela API", b: "O contorno do agente, na cor dos agentes", c: "Só o agente, pensando: sem ferramenta, pela API" },
};

/* An icon at 144/96/48 px in the current direction. */
function icon(eng, px, st) {
  if (dir === "b") return `<span class="tile ${st === "off" ? "off" : ""}" style="--s:${px}px;--sw:${px >= 144 ? 3.4 : px >= 96 ? 2.6 : 1.8}px">${ln(eng, st)}</span>`;
  return `<span data-pt="${eng}" data-px="${px}" data-st="${st}"></span>`;
}
const live = [];
const DPR = Math.min(2, window.devicePixelRatio || 1);
function hydrate() {
  for (const el of document.querySelectorAll("[data-pt]")) {
    const cv = document.createElement("canvas");
    cv.className = "pt" + (el.dataset.st === "off" ? " off" : ""); cv.width = cv.height = N;
    cv.style.width = cv.style.height = el.dataset.px + "px";
    cv.setAttribute("role", "img"); cv.setAttribute("aria-label", ENG[el.dataset.pt].name);
    live.push({ kind: "pt", cv, eng: el.dataset.pt, st: el.dataset.st, dir });
    el.replaceWith(cv);
  }
  for (const el of document.querySelectorAll("[data-av]")) {
    const s = Number(el.dataset.av), cv = document.createElement("canvas");
    cv.className = "av"; cv.width = cv.height = Math.round(s * DPR); cv.style.width = cv.style.height = s + "px";
    live.push({ kind: "av", cv, s, seed: Math.random() * 5 });
    el.replaceWith(cv);
  }
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now) {
  const t = reduce ? 1.2 : now / 1000, dark = document.documentElement.dataset.theme === "dark";
  for (let i = live.length - 1; i >= 0; i--) {
    const a = live[i];
    if (!a.cv.isConnected) { live.splice(i, 1); continue; }
    const ctx = a.cv.getContext("2d");
    ctx.clearRect(0, 0, a.cv.width, a.cv.height);
    if (a.kind === "pt") DRAW[a.dir][a.eng](painter(ctx), a.st, dark, t, "sky");
    else drawAgent(ctx, 0, 0, a.s * DPR, { color: "sky", cells: 14, pose: idlePose(t, a.seed, { every: 9, expressions: ["happy"] }) });
  }
  setTimeout(() => requestAnimationFrame(frame), 90);
}

/* ================= Page ================= */
function motorCard() {
  const opt = (id, title, desc, foot, st, disabled) => `<button class="opt" role="radio" aria-checked="${pick === id}" ${disabled ? 'aria-disabled="true"' : ""} data-pick="${id}">
      <span class="radio"></span>${icon(id, 48, st)}<span class="n">${title}</span><span class="d">${desc}</span><span class="foot">${foot}</span></button>`;
  const ccSt = state === "off" ? "off" : state;
  const fields = pick === "claude" ? `<div class="fields">
      <div class="field"><label>Computador</label><button class="sel">${I.mac}<span>MacBook do Walter</span>${I.chev}</button></div>
      <div class="field"><label>Modelo</label><button class="sel"><span>Opus · reserva Sonnet</span>${I.chev}</button></div></div>
    <div class="note">${I.alert}<span>A assinatura do Claude Code é pessoal. Responder outras pessoas com ela pode ir contra os termos do provedor. Se o computador ficar offline, o Bento responde pela API.</span></div>`
    : pick === "agent" ? `<div class="fields"><div class="field"><label>Modelo</label><button class="sel"><span>Claude Sonnet · chave da organização</span>${I.chev}</button></div></div>` : "";
  return `<section class="card"><div class="cap">Página do agente · Motor (48 px)</div>
    <div class="ahead"><span data-av="40"></span><div><h3>Motor</h3><p>Com o que o Bento pensa e trabalha.</p></div></div>
    <div class="opts" role="radiogroup" aria-label="Motor">
      ${opt("agent", "Agente", "Pensa pela API, com a chave da organização. Conta no orçamento do Bento.", `<span class="chip">${ln("agent")}Pela API</span>`, "idle")}
      ${opt("claude", "Claude Code", "Trabalha no seu computador, com a sua assinatura do Claude.", state === "off" ? `<span class="chip">${ln("claude", "off")}MacBook do Walter<span class="sep">·</span><span class="sub">offline</span></span>` : `<span class="chip">${ln("claude", ccSt)}MacBook do Walter</span>`, ccSt)}
      ${opt("codex", "Codex", "Não encontrado no MacBook do Walter. Instale para escolher.", `<span class="chip">${ln("codex", "off")}Não encontrado</span>`, "off", true)}
    </div>${fields}</section>`;
}
function render() {
  const th = document.documentElement.dataset.theme;
  const pressed = (list, cur, key) => list.map(([v, l]) => `<button data-${key}="${v}" aria-pressed="${v === cur}">${l}</button>`).join("");
  document.getElementById("dirs").innerHTML = pressed(DIRS, dir, "dir");
  document.getElementById("states").innerHTML = pressed(STATES, state, "st");
  document.getElementById("theme").innerHTML = pressed([["light", "Claro"], ["dark", "Escuro"]], th, "theme");
  const ccSt = state;
  document.getElementById("root").innerHTML = `
    <header><h1>Um ícone por motor</h1>
      <p class="lead">Com o que um agente pensa e trabalha: o Claude Code ou o Codex num computador conectado, ou o próprio agente, pela API. Desenhos nossos, sem as marcas das empresas: cada motor se reconhece pela ferramenta, pela temperatura da tela e pelo que ela mostra.</p></header>
    <section class="card"><div class="cap">Os três, em 144, 96 e 48 px, e o contorno de 16 px</div>
      <div class="stage">${["claude", "codex", "agent"].map((e) => `<div class="eng">
        <div class="big">${icon(e, 144, state)}</div>
        <div class="sm">${icon(e, 96, state)}${icon(e, 48, state)}<span class="l16"><span class="box">${ln(e, state)}</span>16 px</span></div>
        <b>${ENG[e].name}</b><small>${ENG[e][dir]}</small></div>`).join("")}</div>
    </section>
    ${motorCard()}
    <section class="card two">
      <div><div class="cap">Missão · quem programa (16 px)</div>
        <div class="field"><label>Quem programa</label><button class="sel">${ln("claude", ccSt)}<span>Claude Code no MacBook do Walter</span>${I.chev}</button></div>
        <div class="menu" role="listbox" aria-label="Quem programa">
          <button class="mi" role="option" aria-selected="true"><span class="ico">${ln("claude", ccSt)}</span><span class="t"><b>Claude Code</b><small>no MacBook do Walter${state === "off" ? " · offline" : ""}</small></span>${I.check}</button>
          <button class="mi" role="option" aria-disabled="true"><span class="ico">${ln("codex", "off")}</span><span class="t"><b>Codex</b><small>não encontrado no MacBook do Walter</small></span></button>
          <button class="mi" role="option"><span class="ico">${ln("agent")}</span><span class="t"><b>Agente</b><small>o Bento, pela API</small></span></button>
        </div></div>
      <div><div class="cap">Chips e avisos (14–16 px)</div>
        <div class="chips">
          <span class="chip">${ln("claude", ccSt === "working" ? "idle" : ccSt)}Claude Code<span class="sep">·</span><span class="sub">MacBook do Walter</span></span>
          <span class="chip">${ln("claude", "working")}Escrevendo<span class="sep">·</span><span class="sub">MacBook do Walter</span></span>
          <span class="chip">${ln("codex")}Codex<span class="sep">·</span><span class="sub">servidor-build</span></span>
          <span class="chip">${ln("agent")}Agente<span class="sep">·</span><span class="sub">pela API</span></span>
        </div>
        <div class="msg" style="margin-top:18px"><span data-av="28"></span><div class="b"><div class="who">Bento<small>14:02</small></div>
          <div>Corrigi o teste do checkout e abri o PR.</div>
          <div class="quiet">${ln("agent")}<span>Respondi pela API: o Claude Code no MacBook do Walter está offline.</span></div></div></div>
      </div>
    </section>
    <section class="card"><div class="cap">App do computador · Ferramentas (48 px)</div>
      <div class="win"><div class="tb"><i></i><i></i><i></i><span>Ferramentas</span></div><div class="in">
        <h2>Ferramentas</h2><p class="lead">O que os agentes podem rodar neste Mac, sempre dentro das pastas liberadas.</p>
        <div class="rows">
          <div class="trow">${icon("claude", 48, ccSt)}<span class="t"><b>Claude Code ${state === "off" ? `<span class="chip">${I.dash}Sem login</span>` : `<span class="chip ok">${I.check}Encontrado</span>`}</b><small>${state === "off" ? "Instalado, mas sem conta. Entre no Claude Code para os agentes poderem usar." : "Escreve e muda código. Usa a sua conta do Claude neste Mac."}</small></span><span class="end">${state === "off" ? '<button class="btn">Como entrar</button>' : '<span class="sw" role="switch" aria-checked="true" aria-label="Claude Code"></span>'}</span></div>
          <div class="trow">${icon("codex", 48, "off")}<span class="t"><b>Codex <span class="chip">${I.dash}Não encontrado</span></b><small>Não está instalado neste Mac.</small></span><span class="end"><button class="btn">Como instalar</button></span></div>
        </div></div></div>
    </section>
    <section class="card"><div class="cap">Pequeno, junto do texto (16 px)</div>
      <div class="inline"><span>${ln("claude")}Claude Code</span><span>${ln("codex")}Codex</span><span>${ln("agent")}Agente</span><span>${ln("claude", "working")}Claude Code escrevendo</span><span>${ln("codex", "off")}Codex não encontrado</span></div>
    </section>`;
  hydrate();
  history.replaceState(null, "", "#" + new URLSearchParams({ dir, state, theme: th }).toString());
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.dir) { dir = b.dataset.dir; render(); }
  else if (b.dataset.st) { state = b.dataset.st; render(); }
  else if (b.dataset.theme) { document.documentElement.dataset.theme = b.dataset.theme; render(); }
  else if (b.dataset.pick && b.getAttribute("aria-disabled") !== "true") { pick = b.dataset.pick; render(); }
});
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
