<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: Rotinas, redesigned on the approved design system (Proposta 2, Componentes.dc.html).
  The day's rhythm on a horizon (each routine is a lane, runs are pixel ticks, "agora" is a line);
  one tight row per routine with a living agent, the schedule in words, the last runs as a pixel strip
  and a real switch; a details panel (what it does, when, where it delivers, budget, run history,
  silent runs); "Nova rotina" starting from a template; an empty state with a light sky.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

/* ---------- design system bits ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.fc:focus-visible,.seg button:focus-visible,.row:focus-visible,.mi:focus-visible,.sw:focus-visible,.tpl:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b:disabled{opacity:.5;cursor:default;transform:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.ib:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Switch: a track with a tactile knob (custom, never native). */
.sw{position:relative;width:36px;height:22px;border-radius:999px;border:0;padding:0;cursor:pointer;flex:none;background:color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);transition:background .2s var(--out)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 2px 6px -2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:var(--bg)}
.sw:active::after{width:21px}
.sw[aria-checked="true"]:active::after{transform:translateX(11px)}

/* Agents: the engine's body (canvas). */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 49px)}
.app.with-panel{grid-template-columns:64px minmax(0,1fr) 408px}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}
.main{min-width:0;padding:26px 28px 120px;max-width:1120px;width:100%;margin:0 auto}
.panel{display:none;padding:12px 12px 12px 0;position:sticky;top:0;height:100vh;overflow:auto}

.hd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.hd h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.hd p{color:var(--muted);margin-top:6px;max-width:58ch}
.hd .guard{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--faint)}
.hd .acts{display:flex;gap:8px;align-items:center}

/* ---------- horizon: the next hours ---------- */
.hz{position:relative;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:14px 16px 0;margin-bottom:22px;overflow:hidden}
.hz-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hz-h h2{font-size:13px;font-weight:650;color:var(--ink2)}
.hz-h .sub{font-size:12.5px;color:var(--faint)}
.hz-h .grow{flex:1}
.hz-h .legend{display:flex;gap:12px;font-size:12px;color:var(--faint)}
.hz-h .legend span{display:inline-flex;align-items:center;gap:5px}
.hz-body{position:relative;display:grid;grid-template-columns:168px minmax(0,1fr);row-gap:2px;padding-bottom:30px}
.hz-scale{grid-column:2;position:relative;height:18px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.hz-scale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.hz-lab{display:flex;align-items:center;gap:8px;min-width:0;height:30px;padding-right:12px;border:0;background:transparent;cursor:pointer;text-align:left;border-radius:8px}
.hz-lab:hover b{color:var(--ink)}
.hz-lab b{font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s}
.hz-track{position:relative;height:30px;border-radius:8px}
.hz-lane:hover .hz-track{background:color-mix(in srgb,var(--sunken) 50%,transparent)}
.hz-lane{display:contents}
canvas.lane{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hz-nl{position:absolute;top:50%;transform:translate(20px,-50%);font-size:11px;font-weight:650;color:var(--ink2);white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.hz-nl.soon{color:var(--ink)}
/* "Agora": a pixel line (2px on, 2px off) with a tag below. */
.hz-now{position:absolute;top:18px;bottom:22px;width:2px;margin-left:-1px;background:repeating-linear-gradient(180deg,var(--ink) 0 2px,transparent 2px 4px);pointer-events:none;z-index:2}
.hz-now::before{content:"agora";position:absolute;bottom:-20px;left:1px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--bg);background:var(--ink);padding:1px 7px;border-radius:6px}
.hz-key{display:inline-block;width:6px;height:10px;image-rendering:pixelated;vertical-align:-1px}
.hz-past{position:absolute;top:18px;bottom:22px;left:168px;pointer-events:none;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--raised) 30%,transparent))}
canvas.horizon{position:absolute;left:0;right:0;bottom:0;width:100%;height:14px;image-rendering:pixelated;pointer-events:none}

/* ---------- toolbar ---------- */
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:0 1 280px;min-width:0;display:flex;align-items:center;gap:9px;height:36px;padding:0 10px 0 12px;border-radius:12px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);transition:box-shadow .2s var(--out)}
.search:focus-within{box-shadow:var(--e2),0 0 0 1.5px var(--ink)}
.search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.fc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none;transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.fc:hover{box-shadow:var(--e2),var(--top)}
.fc:active{transform:scale(.96)}
.fc .n{font-weight:500;color:var(--faint);font-size:12px}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.fc[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.fc .stack{display:inline-flex}
.fc .stack>*{margin-left:-4px}
.fc .stack>*:first-child{margin-left:0}

/* ---------- routine rows ---------- */
.group{margin-bottom:22px;animation:fi .3s var(--out) both}
.gh{display:flex;align-items:center;gap:8px;margin:0 4px 8px;min-height:24px}
.gh h2{font-size:13px;font-weight:650;color:var(--ink2)}
.gh .n{font-size:12.5px;color:var(--faint)}
.gh .ib{width:28px;height:28px}
.list{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,220px) 136px 124px;align-items:center;gap:16px;padding:14px 12px 14px 16px;border-top:1px solid var(--line);cursor:pointer;outline:none;transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--sunken) 45%,transparent)}
.row.on{background:color-mix(in srgb,var(--sunken) 80%,transparent)}
.row.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.row.new{animation:landed .8s var(--spring) both}
@keyframes landed{0%{opacity:0;transform:translateY(8px) scale(.98)}100%{opacity:1;transform:none}}
.who{display:flex;align-items:center;justify-content:center}
.ti{min-width:0}
.ti b{display:block;font-weight:600;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti small{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;min-width:0}
.ti small .nm{overflow:hidden;text-overflow:ellipsis}
.ti small svg.i{width:13px;height:13px;color:var(--faint)}
.ti .chip{margin-left:2px}
.when{min-width:0;display:flex;gap:9px;align-items:flex-start}
.when .ic{width:28px;height:28px;border-radius:9px;background:var(--sunken);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.when .ic svg.i{width:15px;height:15px}
.when b{display:block;font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.when small.live{color:var(--ink2);font-weight:600}
.when>div{min-width:0}
.hist{display:flex;flex-direction:column;gap:6px;min-width:0}
canvas.runs{display:block;height:20px;image-rendering:pixelated;cursor:default}
.hist small{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.acts .ph{visibility:hidden}
.acts .sw{margin-right:6px}
.row[data-paused] .ti b,.row[data-paused] .when b{color:var(--muted)}
.row[data-paused] canvas.runs{opacity:.5}
.row[data-done] .ti b{color:var(--muted)}
canvas.strip{position:absolute;left:0;right:0;bottom:0;width:100%;height:3px;image-rendering:pixelated;pointer-events:none}

/* ---------- details panel ---------- */
.with-panel .panel{display:block}
.pin{border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:16px;display:flex;flex-direction:column;gap:16px;animation:slidein .32s var(--spring) both;min-height:100%}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;gap:8px}
.ph .grow{flex:1}
.pin h2{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.25;word-break:break-word}
.pin .pm{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:6px}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.pacts .b{flex:1 1 auto}
.ps{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ps h3{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.ps h3 .grow{flex:1}
.prompt{padding:12px 14px;border-radius:14px;background:var(--sunken);font-size:13.5px;line-height:1.55;color:var(--ink2);white-space:pre-wrap}
.sent{font-size:15px;font-weight:600;letter-spacing:-.01em}
.nexts{display:flex;flex-wrap:wrap;gap:6px}
.nexts span{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;background:var(--sunken);font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.nexts span:first-child{background:var(--ink);color:var(--bg);font-weight:600}
.where-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--sunken);font-size:13.5px}
.where-row .ic{width:28px;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.where-row .t{flex:1;min-width:0}
.where-row b{font-weight:600}
.where-row small{display:block;color:var(--faint);font-size:12px}
.optrow{display:flex;align-items:center;gap:12px;font-size:13.5px}
.optrow .t{flex:1;min-width:0}
.optrow small{display:block;color:var(--faint);font-size:12px}
.meter{height:6px;border-radius:6px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:var(--ink)}
.mrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow b{color:var(--ink);font-weight:600}
.vt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vt li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;position:relative;padding:6px 6px 10px 2px;border-radius:12px}
.vt li::before{content:"";position:absolute;left:11px;top:26px;bottom:-6px;width:1.5px;background:var(--line2)}
.vt li:last-child::before{display:none}
.vt .node{width:18px;height:18px;border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--ink2);position:relative;z-index:1}
.vt .node svg.i{width:11px;height:11px;stroke-width:2.4}
.vt .node.ok{background:var(--ink);color:var(--bg)}
.vt .node.failed{background:var(--danger);color:#fff}
.vt .node.skipped{background:var(--warn);color:#fff}
.vt .node.run{background:var(--agent);color:#fff}
.vt .vh{font-weight:600;font-size:13.5px}
.vt .vn{color:var(--muted);font-size:13px;margin-top:1px}
.vt .vw{color:var(--faint);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.vt .b{height:26px;font-size:12px;padding:0 9px;margin-top:6px;margin-left:-9px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.facts dt{color:var(--faint)}
.facts dd{margin:0;color:var(--ink2)}

.mi[aria-checked="true"] .tick{visibility:visible}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.mgroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px 4px}

.dlg-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim);animation:fi .2s var(--out)}
.dlg{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:24px;background:var(--raised);box-shadow:var(--e3),var(--top);animation:popin .28s var(--spring) both;display:flex;flex-direction:column}

.dlg-h .t{flex:1}

.dlg-b{padding:12px 20px 4px;display:flex;flex-direction:column;gap:16px}
.dlg-f{display:flex;align-items:center;gap:8px;padding:16px 20px 20px}
.dlg-f .grow{flex:1}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:16px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);cursor:pointer;transition:transform .2s var(--spring),box-shadow .2s var(--out)}
.tpl:hover{transform:translateY(-2px);box-shadow:var(--e2),var(--top)}
.tpl b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
.tpl small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tpl em{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-style:normal;font-size:12px;font-weight:600;color:var(--ink2)}
.tpl em svg.i{width:13px;height:13px}

.fld>label,.fld>.lb{font-size:13px;font-weight:600;color:var(--ink2)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}

.toast .tt small{display:block;color:var(--muted);font-size:12.5px}
.toast.out{animation:toastout .2s var(--out) both}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}

/* ---------- empty ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 18px 28px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}

.nores{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;text-align:center;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- responsive ---------- */
@media (max-width:1240px){

  .tpls,.grid2{grid-template-columns:minmax(0,1fr)}

  .pin{border-radius:22px 22px 0 0;animation:sheetin .34s var(--spring) both}
  @keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
}

    const lab = n && !r.running && (r.trigger.kind !== "hourly" || soon) ? `<span class="hz-nl${soon ? " soon" : ""}" style="left:max(${pos(n)}%, calc(${pos(NOW)}% + 12px))">${soon ? until(n) : hm(n)}</span>` : "";
    return `<div class="hz-lane"><button class="hz-lab" type="button" data-open="${r.id}" title="${esc(r.name)}">${avHTML(r.agent, 22, r.running ? "run" : "idle")}<b>${esc(r.name)}</b></button><div class="hz-track"><canvas class="lane" data-lane="${r.id}" aria-label="${esc(`${r.name}: ${n ? `próxima ${whenAt(n)}` : "sem execução nas próximas horas"}`)}" role="img"></canvas>${lab}</div></div>`;
  };
  const beyond = lanes.filter((r) => !upcoming(r, 30).some((d) => d <= HZ_TO));
  return `<section class="hz" aria-label="Próximas horas">
    <div class="hz-h"><h2>Próximas 20 horas</h2><span class="sub">${lanes.length} rotinas no relógio${beyond.length ? ` · ${beyond.length} rodam mais tarde` : ""}</span><span class="grow"></span>
      <span class="legend"><span><canvas class="hz-key" data-key="ok"></canvas>respondeu</span><span><canvas class="hz-key" data-key="quiet"></canvas>nada novo</span><span><canvas class="hz-key" data-key="failed"></canvas>falhou</span><span><canvas class="hz-key" data-key="next"></canvas>vai rodar</span></span></div>
    <div class="hz-body"><div></div><div class="hz-scale">${scale.join("")}</div>${lanes.map(lane).join("")}
      <span class="hz-past" style="width:calc((100% - var(--lab, 168px)) * ${pos(NOW) / 100})"></span>
      <span class="hz-now" style="left:calc(var(--lab, 168px) + (100% - var(--lab, 168px)) * ${pos(NOW) / 100})"></span>
    </div>
    <canvas class="horizon" aria-hidden="true"></canvas>
  </section>`;
}

/* ---------- render ---------- */
function visible() {
  const q = S.q.trim().toLowerCase();
  return R.filter((r) =>
    (!S.agents.size || S.agents.has(r.agent)) &&
    (!q || `${r.name} ${AGENTS[r.agent].name} ${r.trigger.text} ${r.target.label}`.toLowerCase().includes(q)));
}
function counts(list) {
  const c = { all: 0, active: 0, paused: 0, event: 0 };
  for (const r of list) { if (isDone(r)) continue; c.all++; if (r.active) c.active++; if (isPaused(r)) c.paused++; if (r.trigger.type === "event") c.event++; }
  return c;
}
const byFilter = (r) => S.filter === "all" || (S.filter === "active" && r.active) || (S.filter === "paused" && isPaused(r)) || (S.filter === "event" && r.trigger.type === "event");

function render() {
  const main = $("#main");
  const head = `<div class="hd"><div><h1>Rotinas</h1><p>Tarefas que os agentes fazem sozinhos, num horário ou quando algo acontece.</p><div class="guard">${I.shield}<span>Cada execução respeita o orçamento do agente. Ações sensíveis continuam pedindo aprovação.</span></div></div>
    <div class="acts"><button class="b b1" type="button" data-new>${I.plus}Nova rotina<span class="kbd">N</span></button></div></div>`;
  if (S.empty) {
    main.innerHTML = head + `<div class="empty"><div class="glow"><canvas class="sky" aria-hidden="true"></canvas><span class="who">${avHTML("theo", 64)}</span></div>
      <b>Nenhuma rotina ainda</b><p>Peça uma tarefa que se repete e o agente cuida dela sozinho. Também dá para criar direto do chat: “todo dia às 9h, resuma o #suporte”.</p>
      <div class="tpls">${TEMPLATES.map(tplHTML).join("")}</div></div>`;
    hydrate(main); return;
  }
  const all = visible();
  const c = counts(all);
  const list = all.filter((r) => !isDone(r) && byFilter(r));
  const done = all.filter(isDone);
  const agentsInUse = [...new Set(R.map((r) => r.agent))];
  const chip = (k, l) => `<button class="fc" type="button" aria-pressed="${S.filter === k}" data-filter="${k}">${l}<span class="n">${c[k]}</span></button>`;
  const agentChip = `<button class="fc" type="button" data-agents aria-pressed="${S.agents.size > 0}" aria-haspopup="menu"><span class="stack">${(S.agents.size ? [...S.agents] : agentsInUse.slice(0, 3)).map((id) => avHTML(id, 18)).join("")}</span>${S.agents.size === 1 ? AGENTS[[...S.agents][0]].name : S.agents.size ? `${S.agents.size} agentes` : "Agentes"}${I.chev}</button>`;
  const active = list.filter((r) => !isPaused(r));
  const paused = list.filter(isPaused);
  const group = (title, rows, extra = "") => rows.length ? `<section class="group"><div class="gh"><h2>${title}</h2><span class="n">${rows.length}</span>${extra}</div><div class="list">${rows.map(rowHTML).join("")}</div></section>` : "";
  main.innerHTML = head + horizonHTML(all) +
    `<div class="tb"><label class="search">${I.search}<input id="q" placeholder="Buscar rotinas" aria-label="Buscar rotinas" autocomplete="off" value="${esc(S.q)}"></label>
      <div class="chips">${chip("all", "Todas")}${chip("active", "Ativas")}${chip("paused", "Pausadas")}${chip("event", "Por evento")}${agentChip}</div></div>` +
    (list.length ? group(S.filter === "paused" ? "Pausadas" : "No ar", S.filter === "paused" ? paused : active) + (S.filter === "paused" ? "" : group("Pausadas", paused)) : `<div class="nores">${I.search}<span>Nenhuma rotina com esses filtros.</span><button class="b b2 sm" type="button" data-clear>Limpar filtros</button></div>`) +
    (done.length && S.filter === "all" ? `<section class="group"><div class="gh"><button class="b bg sm" type="button" data-done-toggle aria-expanded="${S.showDone}">${S.showDone ? I.chev : I.chevr}Concluídas<span class="n" style="color:var(--faint);font-weight:500">${done.length}</span></button></div>${S.showDone ? `<div class="list">${done.map(rowHTML).join("")}</div>` : ""}</section>` : "");
  const q = $("#q");
  q.oninput = () => { S.q = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  // The label column of the horizon shrinks on small screens.
  const hz = $(".hz-body"); if (hz) hz.style.setProperty("--lab", innerWidth <= 980 ? "44px" : "168px");
  hydrate(main);
  S.fresh.clear();
  renderPanel();
}

  hydrate(panel);

/* ---------- menus ---------- */
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(anchor, build, align = "end") {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu glass"; m.setAttribute("role", "menu");
  m.innerHTML = build();
  document.body.append(m); menuEl = m; m._build = build;
  hydrate(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let left = align === "end" ? r.right - mw : r.left;
  left = Math.min(Math.max(12, left), innerWidth - mw - 12);
  let top = r.bottom + 6;
  if (top + mh > innerHeight - 12) top = Math.max(12, r.top - mh - 6);
  m.style.left = left + "px"; m.style.top = top + "px";
  m.querySelector(".mi")?.focus({ preventScroll: true });
}
function refreshMenu() { if (!menuEl) return; menuEl.innerHTML = menuEl._build(); hydrate(menuEl); }
const moreMenu = (r) => () => `
  <button class="mi" type="button" data-m="edit" data-id="${r.id}">${I.edit}<span>Editar</span></button>
  <button class="mi" type="button" data-m="history" data-id="${r.id}">${I.history}<span>Execuções</span><span class="sub">${r.runs.length}</span></button>
  <button class="mi" type="button" data-m="dup" data-id="${r.id}">${I.copy}<span>Duplicar</span></button>
  ${r.trigger.type === "event" ? `<button class="mi" type="button" data-m="hook" data-id="${r.id}">${I.link}<span>Copiar webhook</span></button>` : ""}
  <div class="msep"></div><button class="mi danger" type="button" data-m="del" data-id="${r.id}">${I.trash}<span>Excluir</span></button>`;
const agentMenu = () => `<div class="mgroup">Agentes</div>${Object.keys(AGENTS).map((id) => `<button class="mi" type="button" role="menuitemcheckbox" aria-checked="${S.agents.has(id)}" data-agent="${id}"><span class="box">${I.check}</span>${avHTML(id, 20)}<span>${AGENTS[id].name}</span><span class="sub">${R.filter((r) => r.agent === id && !isDone(r)).length}</span></button>`).join("")}${S.agents.size ? `<div class="msep"></div><button class="mi" type="button" data-agent="__clear">${I.x}<span>Limpar</span></button>` : ""}`;

/* ---------- toasts ---------- */
function toast({ icon = I.check, ok = true, title, sub = "", action, ms = 3600 }) {
  const t = document.createElement("div");
  t.className = "toast glass"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="tic ${ok ? "ok" : ""}">${icon}</span><div class="tt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>${action ? `<button class="b bg sm" type="button">${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { action.run(); dismiss(t); };
  $("#toasts").append(t);
  setTimeout(() => dismiss(t), ms);
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add("out"); setTimeout(() => t.remove(), 200); }

/* ---------- actions ---------- */
function runNow(id) {
  const r = R.find((x) => x.id === id); if (!r || r.running) return;
  r.running = true; render();
  setTimeout(() => {
    r.running = false;
    const quiet = r.quiet && Math.random() < .5;
    r.runs.unshift({ at: new Date(NOW), status: quiet ? "quiet" : "ok", summary: quiet ? "Nada novo" : r.target.type === "dm" ? "Respondeu na DM" : "Resposta postada no canal" });
    render();
    toast(quiet ? { icon: I.minus, ok: false, title: `${AGENTS[r.agent].name} não achou nada novo`, sub: "A rotina ficou em silêncio, como pedido." } : { title: `${AGENTS[r.agent].name} terminou`, sub: r.name, action: { label: "Ver", run: () => {} } });
  }, 3800);
}
function toggle(id) {
  const r = R.find((x) => x.id === id); if (!r) return;
  r.active = !r.active; render();
  toast(r.active ? { icon: I.play, title: "Rotina retomada", sub: (() => { const n = upcoming(r, 1)[0]; return n ? `Próxima ${until(n)}` : r.name; })() } : { icon: I.pause, ok: false, title: "Rotina pausada", sub: "Ela não roda até você ligar de novo.", action: { label: "Desfazer", run: () => { r.active = true; render(); } } });
}

/* ---------- new routine ---------- */
const TEMPLATES = [
  { k: "digest", t: "Resumo diário de um canal", d: "Todo dia útil às 9h, o que aconteceu ontem.", when: "dias úteis às 9h", icon: I.doc, agent: "theo", prompt: "Resuma o que aconteceu ontem no #suporte: pedidos, o que foi resolvido e o que ficou sem resposta." },
  { k: "sentry", t: "Vigiar erros novos", d: "A cada hora, só fala se aparecer erro novo.", when: "a cada hora", icon: I.sentry, agent: "atlas", quiet: true, prompt: "Olhe os erros novos do Sentry desde a última execução. Se houver, resuma e diga onde no código acontece." },
  { k: "prs", t: "Revisar PRs novos", d: "Quando abrir um PR, o agente lê e comenta.", when: "quando abrir um PR", icon: I.pr, agent: "lia", prompt: "Leia o diff do PR novo, aponte riscos e diga o que testar à mão." },

];
const tplHTML = (x) => `<button class="tpl" type="button" data-tpl="${x.k}"><span class="pi">${x.icon}</span><span><b>${esc(x.t)}</b><small>${esc(x.d)}</small><em>${avHTML(x.agent, 18)}${esc(AGENTS[x.agent].name)}</em></span></button>`;
const PHRASES = [
  [/cada hora|de hora em hora/, "A cada hora", "hourly"],
  [/dias? úte?is|seg(unda)? a sex/, "Dias úteis às 09:00", "weekdays"],
  [/sexta/, "Toda sexta às 17:00", "weekly"],
  [/todo dia|diariamente|todos os dias/, "Todo dia às 09:00", "daily"],
  [/segunda/, "Toda segunda às 09:00", "weekly"],
  [/pr\b|pull request/, "Quando abrir um PR no GitHub", "event"],
  [/erro|sentry/, "Quando chegar um erro novo no Sentry", "event"],
];
const parse = (s) => { const v = s.toLowerCase(); for (const [re, text, kind] of PHRASES) if (re.test(v)) return { text, kind }; return null; };
let dlg = null;
function openNew(tplKey) {

          ${p ? `<div class="parse"><span class="okc">${I.check}</span><span>Entendi: <b>${esc(p.text)}</b>${p.kind === "event" ? "" : " · São Paulo"}</span></div>` : `<div class="sug">${["a cada hora", "dias úteis às 9h", "toda sexta às 17h", "quando abrir um PR"].map((s) => `<button type="button" data-sug="${s}">${s}</button>`).join("")}</div>`}

    const s = e.target.closest("[data-sug]"); if (s) { f.when = s.dataset.sug; draw(); $("#fw", dlg).focus(); return; }
    if (e.target.closest("[data-fq]")) { f.quiet = !f.quiet; e.target.closest("[data-fq]").setAttribute("aria-checked", f.quiet); return; }
    const pa = e.target.closest("[data-pick-agent]"); if (pa) { e.stopPropagation(); openMenu(pa, () => Object.keys(AGENTS).map((id) => `<button class="mi" type="button" role="menuitemradio" aria-checked="${f.agent === id}" data-set-agent="${id}">${avHTML(id, 22)}<span>${AGENTS[id].name}</span><span class="sub">${AGENTS[id].role}</span></button>`).join(""), "start"); menuEl.onclick = (ev) => { const b = ev.target.closest("[data-set-agent]"); if (b) { f.agent = b.dataset.setAgent; closeMenu(); draw(); } }; return; }
    if (e.target.closest("[data-create]")) {
      const p = parse(f.when);
      const r = { id: nextId++, agent: f.agent, name: tpl?.t ?? (f.prompt.split(/[.:\n]/)[0].slice(0, 60) || "Nova rotina"), prompt: f.prompt, trigger: p.kind === "event" ? { type: "event", text: p.text, detail: "agentes-chat", icon: /PR/.test(p.text) ? "pr" : "sentry" } : { type: "schedule", kind: p.kind === "daily" ? "weekdays" : p.kind, text: p.text, detail: p.kind === "hourly" ? "no minuto 00" : "" }, target: { type: "channel", label: f.target }, active: true, quiet: f.quiet, runs: [], budget: null };
      R.unshift(r); S.fresh.add(r.id); S.empty = false; $('[data-proto="empty"]').setAttribute("aria-pressed", "false");
      closeNew(); render();
      const n = upcoming(r, 1)[0];
      toast({ title: "Rotina criada", sub: n ? `Primeira execução ${until(n)}` : "Esperando o evento", action: { label: "Abrir", run: () => { S.open = r.id; render(); } } });
    }
  };
  document.body.append(dlg);
  draw();
  (dlg.querySelector("#fp") && !f.prompt ? dlg.querySelector("#fp") : dlg.querySelector(".tpl, #fw"))?.focus();
}
function closeNew() { dlg?.remove(); dlg = null; closeMenu(); }

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  if (dlg && dlg.contains(e.target)) return;
  const t = e.target;
  if (menuEl && !menuEl.contains(t) && !t.closest("[data-more],[data-agents]")) closeMenu();
  if (menuEl && menuEl.contains(t)) {
    const ag = t.closest("[data-agent]");
    if (ag) { const id = ag.dataset.agent; if (id === "__clear") { S.agents.clear(); closeMenu(); } else S.agents.has(id) ? S.agents.delete(id) : S.agents.add(id); render(); refreshMenu(); return; }
    const m = t.closest("[data-m]");
    if (m) {
      const r = R.find((x) => x.id === +m.dataset.id); closeMenu();
      if (m.dataset.m === "edit") toast({ icon: I.edit, ok: false, title: "Editar", sub: "Abre o mesmo diálogo da criação, preenchido." });
      if (m.dataset.m === "history") { S.open = r.id; render(); }
      if (m.dataset.m === "dup") { const c = { ...r, id: nextId++, name: `${r.name} (cópia)`, runs: [], active: false, done: false }; R.splice(R.indexOf(r) + 1, 0, c); S.fresh.add(c.id); render(); toast({ icon: I.copy, title: "Rotina duplicada", sub: "A cópia começa pausada." }); }
      if (m.dataset.m === "hook") toast({ icon: I.link, title: "Webhook copiado", sub: "Chame essa URL para disparar a rotina." });
      if (m.dataset.m === "del") { const i = R.indexOf(r); R.splice(i, 1); if (S.open === r.id) S.open = null; render(); toast({ icon: I.trash, ok: false, title: "Rotina excluída", action: { label: "Desfazer", run: () => { R.splice(i, 0, r); render(); } } }); }
    }
    return;
  }
  const p = t.closest("[data-proto]");
  if (p) {
    if (p.dataset.proto === "empty") { S.empty = !S.empty; S.open = null; p.setAttribute("aria-pressed", S.empty); render(); }
    if (p.dataset.proto === "run") { S.empty = false; $('[data-proto="empty"]').setAttribute("aria-pressed", "false"); runNow(2); }
    return;
  }
  if (t.closest("[data-new]")) return openNew();
  const tp = t.closest("[data-tpl]"); if (tp) return openNew(tp.dataset.tpl);
  const tg = t.closest("[data-toggle]"); if (tg) return toggle(+tg.dataset.toggle);
  const qt = t.closest("[data-quiet]"); if (qt) { const r = R.find((x) => x.id === +qt.dataset.quiet); r.quiet = !r.quiet; render(); return; }
  const rn = t.closest("[data-run]"); if (rn) return runNow(+rn.dataset.run);
  const mo = t.closest("[data-more]"); if (mo) { const r = R.find((x) => x.id === +mo.dataset.more); return menuEl ? closeMenu() : openMenu(mo, moreMenu(r)); }
  const am = t.closest("[data-agents]"); if (am) return menuEl ? closeMenu() : openMenu(am, agentMenu, "start");
  const fl = t.closest("[data-filter]"); if (fl) { S.filter = fl.dataset.filter; render(); return; }
  if (t.closest("[data-clear]")) { S.filter = "all"; S.agents.clear(); S.q = ""; render(); return; }
  if (t.closest("[data-done-toggle]")) { S.showDone = !S.showDone; render(); return; }
  if (t.closest("[data-close]") || t.id === "scrim") { S.open = null; render(); return; }
  if (t.closest("[data-edit]")) return toast({ icon: I.edit, ok: false, title: "Editar", sub: "Abre o mesmo diálogo da criação, preenchido." });
  if (t.closest("[data-goto]")) return toast({ icon: I.open, ok: false, title: "Abre a mensagem no chat" });
  const op = t.closest("[data-open]"); if (op) { const id = +op.dataset.open; S.open = S.open === id ? null : id; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (menuEl) return closeMenu(); if (dlg) return closeNew(); if (S.open) { S.open = null; render(); } return; }
  const typing = e.target.closest?.("input,textarea,[contenteditable]");
  if (!typing && !dlg && (e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); openNew(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("row")) { e.preventDefault(); e.target.click(); }
});
addEventListener("resize", () => { const hz = $(".hz-body"); if (hz) hz.style.setProperty("--lab", innerWidth <= 980 ? "44px" : "168px"); });

/* ---------- theme ---------- */
function seg(el, value, on) {
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });

$("#logo").append(makeAgent("theo", 30));
render();
</script>
