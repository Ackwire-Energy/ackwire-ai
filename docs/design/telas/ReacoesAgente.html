<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reações do agente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: how an agent answers with less than a message (sibling of ThreadContexto.html: same tokens,
  messages, reaction pills, glass toasts and the shared agent engine).
  One thread in #marketing (Ana, Theo the PM agent in amber, and you, Walter). Four ideas, each one a
  scenario in the prototype bar; picking one resets the thread and plays the moment once (Repetir replays).
  1  The face reacts: 👍 on Theo's message -> his avatar next to it goes happy, then hearts (~1.5 s) with a
     little hop, then idle. 👎 -> surprised, then a thoughtful look up and aside. No new message.
  2  Reaction instead of reply: you write "valeu, perfeito!"; Theo does not answer, he leaves 🙌 on your
     message. Same pill as people's reactions, with his mini pixel avatar where a count would be.
  3  Memory mark: when Theo saves something from a person's message, a small mark sits in that message's
     reaction row: Theo (engine, his colors) reading an open pixel book. Same height as the pills, but a
     different shape (squarer, raised, hairline): it is not an emoji anyone can add. Hover = page flip and a
     blink + glass tooltip "Theo guardou isso: ..." (Ver na memória, Corrigir). Click = small popover with
     the saved fact, Corrigir (inline edit) and Esquecer (with Desfazer).
  4  👎 becomes a private question: a small card under the message, only for you ("Só você vê isto"):
     "Quer que o Theo refaça ou explique o que faltou?" + one-line input, Pedir correção / Agora não.
     Sending posts it as your reply to Theo (quoted), and Theo answers with the fix.
  Rules: neutral cards and selection (ink/gray), icon chips without dots, blue only for agent identity,
  no jargon. Agents only via packages/ui/src/agent/engine.js (serve the repo root over http).
  prefers-reduced-motion: everything static (the face still changes, without hop or turn; no page flip).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --plate:rgba(127,127,127,.1);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;
  --page:#fffdf6;--ink-line:#cfc8b6;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --plate:rgba(127,127,127,.14);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);--page:#ebe6d8;--ink-line:#a59e8c;color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum";display:flex;flex-direction:column;height:100vh;height:100dvh}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:14px;line-height:1}

/* ---------- design system bits (verbatim from ThreadContexto.html / Componentes.dc.html) ---------- */
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.seg button:focus-visible,.react:focus-visible,.send:focus-visible,.stp:focus-visible,.mem:focus-visible,.sb-item:focus-visible,.tlink:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.b.danger{color:var(--danger)}
.b:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--raised);box-shadow:var(--e1),var(--top)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.12)}100%{transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:color-mix(in srgb,var(--ink) 10%,transparent)}100%{background:transparent}}
@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
.inp{display:flex;align-items:center;gap:9px;min-height:38px;padding:0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s;min-width:0}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp input{all:unset;flex:1;min-width:0;font-size:14.5px;color:var(--ink)}
.inp input::placeholder{color:var(--faint)}

/* Agents: the engine's body (canvas). People: a circle with the initial. */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .42);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}

/* ---------- prototype bar (not product) ---------- */
.proto{position:relative;z-index:75;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex:none}
.proto b{color:var(--ink);font-weight:650}
.proto .seg button{height:26px;font-size:12px;padding:0 10px}
.steps{display:flex;gap:3px;flex-wrap:wrap}
.stp{height:26px;min-width:26px;padding:0 8px;border-radius:8px;border:0;background:var(--sunken);color:var(--muted);font-size:12px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .18s var(--spring)}
.stp:hover{color:var(--ink)}
.stp:active{transform:scale(.95)}
.stp[aria-current="step"]{background:var(--ink);color:var(--bg)}
.proto .acts{display:flex;gap:6px;flex-wrap:wrap}
.proto .acts .b{height:26px;font-size:12px;padding:0 9px;border-radius:8px}
.proto .now{flex-basis:100%;color:var(--ink2);font-weight:500;font-size:12.5px}
.proto .grow{flex:1}

/* ---------- app frame ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr)}
.apane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.phd{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 18px;border-bottom:1px solid var(--line);min-height:58px;flex:none}
.phd .t{flex:1;min-width:0}
.phd h1{font-size:16px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phd small{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px 18px;min-height:0}
.thread{max-width:760px;margin:0 auto}

/* ---------- sidebar ---------- */
.sb{background:var(--sunken);display:flex;flex-direction:column;gap:16px;padding:14px 12px;overflow-y:auto;border-right:1px solid var(--line);min-height:0}
.org-in{display:flex;align-items:center;gap:10px;padding:4px 6px}
.org-in .lg{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.org-in b{display:block;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.org-in small{display:block;color:var(--muted);font-size:12px}
.sb-group{display:flex;flex-direction:column;gap:1px}
.sb-label{font-size:12px;font-weight:650;color:var(--faint);padding:0 8px 4px}
.sb-item{display:flex;align-items:center;gap:10px;min-height:34px;padding:4px 8px;border-radius:10px;color:var(--ink2);font-size:14.5px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer}
.sb-item:hover{background:var(--plate)}
.sb-item.on{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.sb-item svg.i{color:var(--faint)}
.sb-item small{margin-left:auto;font-size:12px;color:var(--faint)}

/* ---------- messages (ThreadContexto.html) ---------- */
.day{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:650;color:var(--faint);margin:14px 12px 6px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{position:relative;display:flex;gap:12px;padding:10px 12px;border-radius:14px;transition:background .15s;animation:fi .3s var(--out) both}
.msg:hover{background:rgba(127,127,127,.05)}
.msg.flash{animation:flash 1.6s var(--out)}
.msg .av-col{width:34px;flex:none;display:flex;justify-content:center;align-items:flex-start}
.msg .body{flex:1;min-width:0}
.mhdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mt{font-size:12px;color:var(--faint)}
.mx{font-size:14.5px;line-height:1.6;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.mx p+p{margin-top:6px}
.mx b{color:var(--ink);font-weight:650}
.mention{display:inline;white-space:nowrap;font-weight:600;color:var(--ink);background:var(--sunken);padding:1px 6px 1px 3px;border-radius:7px}
.mention .agw{display:inline-flex;vertical-align:-3px;margin-right:4px}
.plan{margin-top:8px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 12px;border-radius:12px;background:var(--sunken);font-size:13.5px;max-width:460px}
.plan span{color:var(--faint);font-weight:600}
.plan .new{color:var(--ink);font-weight:650}
.macts{position:absolute;top:-12px;right:12px;display:none;gap:2px;padding:3px;border-radius:12px;z-index:4}
.macts .ib{width:28px;height:28px;border-radius:8px}
.macts .ib svg.i{width:15px;height:15px}
.msg:hover .macts,.macts:focus-within{display:flex}
.quote{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--faint);margin:2px 0 2px;min-width:0}
.quote svg.i{width:13px;height:13px;flex:none}
.quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.quote b{color:var(--muted);font-weight:600}
.thinking{display:inline-flex;align-items:center;gap:4px;color:var(--faint);font-size:13.5px;height:24px}
.thinking i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:dots 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}

/* ---------- reactions: one pill for everybody (Componentes.dc.html), neutral when it is yours ---------- */
.reacts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.react{height:26px;padding:0 9px;border-radius:999px;border:0;background:var(--sunken);font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:transform .2s var(--spring),background .15s,box-shadow .15s}
.react:hover{transform:translateY(-1px)}
.react.on{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink2)}
.react.add{padding:0 8px;color:var(--faint)}
.react.add svg.i{width:14px;height:14px}
.react.fresh{animation:pop .45s var(--spring) both}
/* An agent's reaction: the count's place holds the agent's mini body. */
.react.ag{padding:0 8px 0 9px;gap:5px}
.react.ag .agw{margin-right:-1px}

/* ---------- the memory mark: same height as a pill, another shape (not an emoji anyone can add) ---------- */
.mem{height:26px;padding:0 5px 0 4px;border-radius:9px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),var(--top);display:inline-flex;align-items:center;gap:2px;cursor:pointer;color:var(--faint);transition:transform .2s var(--spring),box-shadow .15s}
.mem:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--line2),0 4px 10px -4px rgba(0,0,0,.18)}
.mem canvas{display:block}
.mem svg.i{width:11px;height:11px}
.mem.fresh{animation:pop .5s var(--spring) both}
.rsep{width:1px;height:16px;background:var(--line2);margin:0 2px}

/* ---------- floating layer: glass tooltip and the memory popover ---------- */
.float{position:fixed;z-index:80;animation:popin .18s var(--spring) both}
.tip{border-radius:14px;padding:9px 10px 8px 12px;max-width:min(300px,calc(100vw - 24px));font-size:13px;color:var(--ink2)}
.tip p b{color:var(--ink);font-weight:650}
.tip .ta{display:flex;gap:2px;margin:6px -4px 0}
.tip.one{padding:7px 11px}
.pop{width:min(330px,calc(100vw - 24px));border-radius:18px;background:var(--raised);box-shadow:var(--e3),var(--top);padding:14px}
.pop-h{display:flex;align-items:center;gap:10px}
.pop-h .t{flex:1;min-width:0}
.pop-h b{display:block;font-size:14px;font-weight:650}
.pop-h small{display:block;font-size:12px;color:var(--faint)}
.fact{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--sunken);font-size:14px;color:var(--ink)}
.fact small{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:12px;color:var(--faint)}
.fact small svg.i{width:12px;height:12px}
.pop .inp{margin-top:12px}
.pop-f{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pop-f .grow{flex:1}

/* ---------- 👎 -> a private question, only for you ---------- */
.ask{margin-top:10px;max-width:520px;padding:12px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);animation:popin .3s var(--spring) both}
.ask .only{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--faint)}
.ask .only svg.i{width:12px;height:12px}
.ask h3{font-size:14.5px;font-weight:650;letter-spacing:-.01em;margin-top:4px;color:var(--ink)}
.ask form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ask .inp{flex:1 1 220px}
.ask .bt{display:flex;gap:6px}

/* ---------- composer (ThreadContexto.html) ---------- */
.cmpw{padding:0 14px 14px;flex:none}
.composer{max-width:760px;margin:0 auto;border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px}
.composer:focus-within{box-shadow:var(--e3),var(--top)}
.composer input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--ink);height:34px}
.composer input::placeholder{color:var(--faint)}
.send{height:34px;width:34px;border-radius:11px;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:var(--sunken);color:var(--faint);transition:all .25s var(--spring)}
.send.on{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:16px;width:380px;max-width:calc(100vw - 24px);animation:popin .25s var(--spring) both}
.toast .tic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sunken);color:var(--ink2)}
.toast .tt{flex:1;min-width:0}
.toast .tt b{display:block;font-size:14px;font-weight:600}
.toast .tt small{display:block;color:var(--muted);font-size:12.5px}
.toast.out{animation:toastout .2s var(--out) both}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}
.tlink{padding:0;border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink2);cursor:pointer}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{display:none}
  .phd{padding:8px 10px 8px 16px}
  .scroll{padding:6px 4px 16px}
  .msg{gap:10px;padding:10px 12px}
  .msg .av-col{width:28px}
  .cmpw{padding:0 12px 12px}
  .toasts{left:12px;right:12px;bottom:12px;align-items:stretch}
  .toast{width:auto}
  .proto .stp .l{display:none}
  .proto .stp[aria-current="step"] .l{display:inline}
}
</style>
</head>
<body>
<div class="proto" role="region" aria-label="Barra do protótipo">
  <b>Reações do agente</b>
  <div class="steps" id="steps"></div>
  <div class="acts" id="acts"></div>
  <span class="grow"></span>
  <div class="seg" id="theme" role="group" aria-label="Tema">

/* ---------- data ---------- */
const AGENTS = {

function baseThread() {
  return [
    { id: "m1", who: "ana", at: "10:12", html: `<p>${mentionHTML("theo")} bora fechar o calendário do blog de novembro? Uma coisa que aprendi: publicar às terças dá muito mais leitura do que na sexta.</p>`, reacts: [] },
    { id: "m2", who: "theo", at: "10:13", html: `<p>Fechado! Montei novembro com 4 posts, sempre às <b>terças, 9h</b>:</p>`, plan: [["4/11", "Guia de primeiros passos"], ["11/11", "Caso da Padaria Sol"], ["18/11", "Novidades do mês"], ["25/11", "Bastidores do time"]], reacts: [{ e: "🔥", by: ["ana"] }] },
  ];
}

const SCN = [
  { id: 1, l: "O rosto reage", now: "Reaja à mensagem do Theo: com 👍 o rosto dele fica feliz e solta corações; com 👎 ele se surpreende e fica pensativo. Nenhuma mensagem nova.", focus: "m2" },
  { id: 2, l: "Reação em vez de resposta", now: "Você agradece. Em vez de responder “de nada”, o Theo só reage à sua mensagem, com o mesmo botão de reação das pessoas.", focus: null },
  { id: 3, l: "O agente estudando", now: "O Theo guardou algo da mensagem da Ana. A marca do livro mostra isso; passe o mouse para ver o que foi guardado, clique para corrigir ou esquecer.", focus: "m1" },
  { id: 4, l: "👎 vira pergunta", now: "Depois do 👎, só você vê uma pergunta curta. A resposta vira um pedido de correção na thread, e o Theo refaz.", focus: "m2" },
];

const S = { scn: 1, msgs: [], mem: null, ask: null };
const FX = {}; // message id -> { k: "up" | "down", t0 }
const timers = new Set();

/* ---------- agents: the engine, drawn live ---------- */
const live = [];
const seedOf = (id) => [...id].reduce((s, c) => s + c.charCodeAt(0), 0) % 7;
function makeAgent(id, size, msgId) {
  const a = AGENTS[id];
  const w = document.createElement("span");
  w.className = "agw";
  const cv = document.createElement("canvas");
  cv.className = "av";
  const dpr = Math.min(2, devicePixelRatio || 1);

}

function drawLive(tt, now) {
  for (let i = live.length - 1; i >= 0; i--) {

    const ctx = it.cv.getContext("2d"), s = it.cv.width;

    const fx = it.msgId && FX[it.msgId];
    if (fx) {
      const e = (now - fx.t0) / 1000;
      if (e > 1.6) delete FX[it.msgId];

    drawAgent(ctx, (s - inner) / 2, s - inner - hop, inner, { color: it.a.color, eyes: it.a.eyes, cells, pose });

/* ---------- the memory mark: Theo reading an open pixel book (engine body + a few pixels of book) ---------- */
const BOOK = [

  ".PLLLPSPLLLP.",
  ".PLLPPSPLLPP.",
  "CPPPPPSPPPPPC",
  ".CCCCCSCCCCC.",

let lastT = 0;
(function loop(now) {
  if (now - lastT > 40) { lastT = now; const tt = REDUCED ? 2 : now / 1000; drawLive(tt, now); drawMarks(now); }
  requestAnimationFrame(loop);
})(0);

/* ---------- render ---------- */
const nameOf = (id) => AGENTS[id]?.name || PEOPLE[id];

    const mine = r.by.includes(ME), n = r.by.length;
    const who = r.by.map(nameOf).join(", ");
    return `<button class="react${mine ? " on" : ""}${r.fresh ? " fresh" : ""}" type="button" data-react="${m.id}" data-e="${r.e}" aria-pressed="${mine}" aria-label="${r.e} ${n}, ${esc(who)}" title="${esc(who)}"><span class="emo">${r.e}</span>${n}</button>`;
  });

  }

    ? `<span class="rsep" aria-hidden="true"></span><button class="mem${S.mem.fresh ? " fresh" : ""}" type="button" id="memMark" aria-haspopup="dialog" aria-label="${AGENTS[S.mem.a].name} guardou isso na memória: ${esc(S.mem.short)}"><canvas class="mk" data-a="${S.mem.a}" aria-hidden="true"></canvas></button>`
    : "";

  if (!pills.length && !memHtml) return "";

}
function msgHTML(m) {
  const ag = !!AGENTS[m.who];
  const av = ag ? avHTML(m.who, 32, m.id) : ppHTML(PEOPLE[m.who], 32);
  const quote = m.replyTo ? `<div class="quote">${I.reply}<span>Respondendo a <b>${nameOf(m.replyTo.who)}</b> · ${esc(m.replyTo.text)}</span></div>` : "";
  const body = m.thinking ? `<div class="thinking" aria-label="${nameOf(m.who)} está escrevendo"><i></i><i></i><i></i></div>` : `<div class="mx">${m.html}</div>`;
  const plan = m.plan ? `<div class="plan">${m.plan.map(([d, t, nw]) => `<span>${d}</span><div class="${nw ? "new" : ""}">${t}</div>`).join("")}</div>` : "";
  const acts = m.thinking ? "" : `<div class="macts glass"><button class="ib" type="button" data-quick="${m.id}" data-e="👍" aria-label="Reagir com 👍"><span class="emo">👍</span></button><button class="ib" type="button" data-quick="${m.id}" data-e="👎" aria-label="Reagir com 👎"><span class="emo">👎</span></button><button class="ib" type="button" data-addr="${m.id}" aria-label="Reagir">${I.smile}</button><button class="ib" type="button" data-toast="Mais ações" aria-label="Mais ações">${I.more}</button></div>`;
  const ask = S.ask === m.id ? askHTML(m) : "";
  return `<div class="msg" id="msg-${m.id}" data-id="${m.id}">${acts}<div class="av-col">${av}</div><div class="body"><div class="mhdr"><span class="mn">${nameOf(m.who)}</span>${ag ? `<span class="chip">${AGENTS[m.who].role}</span>` : ""}<span class="mt">${m.at}</span></div>${quote}${body}${plan}${m.thinking ? "" : reactsHTML(m)}${ask}</div></div>`;
}
function askHTML(m) {
  const nm = nameOf(m.who);
  return `<div class="ask" role="group" aria-label="Pergunta só para você">
    <span class="only">${I.eyeoff}Só você vê isto</span>
    <h3>Quer que o ${nm} refaça ou explique o que faltou?</h3>
    <form id="askForm" data-msg="${m.id}">
      <label class="inp"><input id="askIn" placeholder="O que faltou? Ex.: incluir a newsletter" aria-label="O que faltou"></label>
      <div class="bt"><button class="b b1 sm" type="submit">Pedir correção</button><button class="b bg sm" type="button" data-askno>Agora não</button></div>
    </form>
  </div>`;
}
function render() {
  $("#thread").innerHTML = `<div class="day">Hoje</div>` + S.msgs.map(msgHTML).join("");
  hydrate($("#thread"));
  for (const m of S.msgs) { m.reacts.forEach((r) => delete r.fresh); if (m.agentReact) delete m.agentReact.fresh; }
  if (S.mem) delete S.mem.fresh;
}
const toBottom = () => requestAnimationFrame(() => { const s = $("#scroll"); s.scrollTo({ top: s.scrollHeight, behavior: REDUCED ? "auto" : "smooth" }); });
function flash(id) { const el = $("#msg-" + id); if (!el) return; el.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }

/* ---------- behaviors ---------- */
const msg = (id) => S.msgs.find((m) => m.id === id);
function toggleReact(id, e) {
  const m = msg(id); if (!m) return;
  const had = m.reacts.find((r) => r.e === e && r.by.includes(ME));
  // 👍 and 👎 are exclusive: picking one takes the other back.
  for (const r of m.reacts) if (["👍", "👎"].includes(r.e) && ["👍", "👎"].includes(e)) r.by = r.by.filter((w) => w !== ME);
  m.reacts = m.reacts.filter((r) => r.by.length);
  if (!had) {
    let r = m.reacts.find((x) => x.e === e);
    if (!r) { r = { e, by: [] }; m.reacts.push(r); }
    r.by.push(ME); r.fresh = true;
    if (AGENTS[m.who] && e === "👍") { FX[id] = { k: "up", t0: performance.now() }; if (S.ask === id) S.ask = null; }
    if (AGENTS[m.who] && e === "👎") { FX[id] = { k: "down", t0: performance.now() }; S.ask = id; }
  } else if (S.ask === id && e === "👎") S.ask = null;
  hideFloat(); render();
  if (S.ask === id && !had) requestAnimationFrame(() => { $("#askIn")?.focus({ preventScroll: true }); $("#msg-" + id)?.querySelector(".ask")?.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" }); });
}
let nextId = 10;
function post(text, extra = {}) {
  const m = { id: "m" + nextId++, who: ME, at: clock(), html: `<p>${extra.mention ? mentionHTML(extra.mention) + " " : ""}${esc(text)}</p>`, reacts: [], replyTo: extra.replyTo };
  S.msgs.push(m); render(); toBottom();
  if (extra.fix) return theoFix();
  if (THANKS.test(text)) {
    // Reaction instead of reply: nothing to add, so Theo only reacts.
    later(1100, () => { m.agentReact = { a: "theo", e: "🙌", fresh: true }; render(); later(320, () => { const el = $(`[data-agtip="${m.id}"]`); if (el) showTip(el, `<b>Theo reagiu</b> em vez de responder`, 2400); }); });
  } else {
    const t = { id: "m" + nextId++, who: "theo", at: clock(), thinking: true, reacts: [] };
    later(500, () => { S.msgs.push(t); render(); toBottom(); });
    later(1900, () => { t.thinking = false; t.html = "<p>Anotado. Se quiser, ajusto o calendário a partir disso.</p>"; render(); toBottom(); });
  }
}
function theoFix() {
  const t = { id: "m" + nextId++, who: "theo", at: clock(), thinking: true, reacts: [] };
  later(600, () => { S.msgs.push(t); render(); toBottom(); });
  later(2200, () => {
    t.thinking = false;
    t.html = "<p>Tem razão, a newsletter ficou de fora. Agora ela entra toda <b>quinta, 10h</b>; os posts continuam às terças:</p>";
    t.plan = [["4/11", "Guia de primeiros passos"], ["6/11", "Newsletter", 1], ["11/11", "Caso da Padaria Sol"], ["13/11", "Newsletter", 1], ["18/11", "Novidades do mês"], ["20/11", "Newsletter", 1], ["25/11", "Bastidores do time"], ["27/11", "Newsletter", 1]];
    render(); toBottom();
  });
}
let clockMin = 14;
const clock = () => `10:${String(clockMin++).padStart(2, "0")}`;
function saveMemory() {
  S.mem = { msg: "m1", a: "theo", fact: FACT0, short: "publicar às terças", fresh: true };
  render();
  later(450, () => { const el = $("#memMark"); if (el && matchMedia("(hover:hover)").matches) { memTip(el); tipTimer = setTimeout(() => { if (!floatEl?.matches(":hover") && !el.matches(":hover")) hideFloat(); }, 3200); } });
}

/* ---------- floating layer (glass tooltip, memory popover) ---------- */
let floatEl = null, floatFor = null, tipTimer = 0;

  hideFloat();
  floatEl = document.createElement("div"); floatEl.className = "float tip glass"; floatEl.dataset.mem = "1"; floatEl.setAttribute("role", "tooltip");
  floatEl.innerHTML = `<p><b>${AGENTS[S.mem.a].name} guardou isso:</b> ${esc(S.mem.short)}</p><div class="ta"><button class="b bg xs" type="button" data-memview>${I.book}Ver na memória</button><button class="b bg xs" type="button" data-memfix>${I.edit}Corrigir</button></div>`;
  document.body.append(floatEl); place(floatEl, anchor); floatFor = anchor;
  floatEl.addEventListener("mouseleave", () => { tipTimer = setTimeout(() => { if (!anchor.matches(":hover")) hideFloat(); }, 200); });
}
function memPop(anchor, editing = false) {
  hideFloat();
  const a = AGENTS[S.mem.a];
  floatEl = document.createElement("div"); floatEl.className = "float pop"; floatEl.setAttribute("role", "dialog"); floatEl.setAttribute("aria-label", "O que o Theo guardou");
  const body = editing
    ? `<label class="inp"><input id="memIn" value="${esc(S.mem.fact)}" aria-label="Corrigir o que foi guardado"></label>
       <div class="pop-f"><span class="grow"></span><button class="b bg xs" type="button" data-memcancel>Cancelar</button><button class="b b1 xs" type="button" data-memsave>${I.check}Salvar</button></div>`
    : `<div class="fact">${esc(S.mem.fact)}<small>${I.thread}Da mensagem da Ana · hoje, 10:12</small></div>
       <div class="pop-f"><button class="b b2 xs" type="button" data-memfix>${I.edit}Corrigir</button><button class="b bg xs danger" type="button" data-memforget>${I.trash}Esquecer</button><span class="grow"></span><button class="b bg xs" type="button" data-memview>Ver na memória</button></div>`;
  floatEl.innerHTML = `<div class="pop-h">${avHTML(S.mem.a, 28)}<div class="t"><b>${a.name} guardou na memória</b><small>Ele vai lembrar disso nas próximas conversas</small></div><button class="ib" type="button" data-popx aria-label="Fechar">${I.x}</button></div>${body}`;
  document.body.append(floatEl); hydrate(floatEl); place(floatEl, anchor, true); floatFor = "pop";
  if (editing) { const i = $("#memIn"); i.focus(); i.select(); }
}

/* ---------- toasts ---------- */
function toast({ icon = I.check, title, sub = "", action }) {
  const el = document.createElement("div");
  el.className = "toast glass"; el.setAttribute("role", "status");
  el.innerHTML = `<span class="tic">${icon}</span><span class="tt"><b>${title}</b>${sub ? `<small>${sub}</small>` : ""}</span>${action ? `<button class="b bg xs" type="button">${action.label}</button>` : ""}<button class="ib" type="button" aria-label="Fechar">${I.x}</button>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 200); };
  const bs = $$("button", el);
  if (action) bs[0].onclick = () => { action.run(); close(); };
  bs[bs.length - 1].onclick = close;
  $("#toasts").append(el); setTimeout(close, 4200);
}

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
  const t = ev.target;
  const q = t.closest("[data-quick]"); if (q) return toggleReact(q.dataset.quick, q.dataset.e);
  const r = t.closest("[data-react]"); if (r) return toggleReact(r.dataset.react, r.dataset.e);
  const add = t.closest("[data-addr]"); if (add) return toast({ icon: I.smile, title: "Escolher reação", sub: "No produto abre o seletor de emojis." });
  const ag = t.closest("[data-agtip]"); if (ag) return showTip(ag, `<b>Theo reagiu</b> em vez de responder`, 2400);
  if (t.closest("#memMark")) return floatFor === "pop" ? hideFloat() : memPop($("#memMark"));
  if (t.closest("[data-memfix]")) return memPop($("#memMark"), true);
  if (t.closest("[data-memcancel]")) return memPop($("#memMark"));
  if (t.closest("[data-memsave]")) return saveFix();
  if (t.closest("[data-memview]")) { hideFloat(); return toast({ icon: I.book, title: "Memória do Theo", sub: "Abre a página do Theo na parte Memória." }); }
  if (t.closest("[data-memforget]")) {
    const prev = S.mem; S.mem = null; hideFloat(); render();
    return toast({ icon: I.trash, title: "Theo esqueceu isso", sub: prev.fact, action: { label: "Desfazer", run: () => { S.mem = { ...prev, fresh: true }; render(); } } });
  }
  if (t.closest("[data-popx]")) return hideFloat();
  if (t.closest("[data-askno]")) { S.ask = null; render(); return; }
  const ts = t.closest("[data-toast]"); if (ts) return toast({ icon: I.more, title: ts.dataset.toast });
  const st = t.closest("[data-scn]"); if (st) return goScn(+st.dataset.scn);
  const ac = t.closest("[data-act]"); if (ac) return ACTS[ac.dataset.act]?.();
  const th = t.closest("[data-th]"); if (th) return setTheme(th.dataset.th);
  if (floatEl && !t.closest(".float")) hideFloat();
});
function saveFix() {
  const v = $("#memIn")?.value.trim(); if (!v) return;
  S.mem.fact = v; S.mem.short = v.replace(/\.$/, "").replace(/^Os posts do blog saem /i, "publicar ").toLowerCase(); hideFloat(); render();
  toast({ icon: I.book, title: "Memória corrigida", sub: "O Theo vai usar a versão nova daqui em diante." });
}
document.addEventListener("mouseover", (ev) => {
  const mk = ev.target.closest?.("#memMark");
  if (mk && floatFor !== "pop" && matchMedia("(hover:hover)").matches) { clearTimeout(tipTimer); memTip(mk); }
});
document.addEventListener("mouseout", (ev) => {
  const mk = ev.target.closest?.("#memMark");
  if (mk && floatFor === mk && !(ev.relatedTarget && ev.relatedTarget.closest?.(".float"))) tipTimer = setTimeout(() => { if (floatFor === mk && !floatEl?.matches(":hover")) hideFloat(); }, 220);
});
document.addEventListener("focusin", (ev) => { const mk = ev.target.closest?.("#memMark"); if (mk && floatFor !== "pop") memTip(mk); });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { if (floatEl) return hideFloat(); if (S.ask) { S.ask = null; render(); } }
  if (ev.key === "Enter" && ev.target.id === "memIn") { ev.preventDefault(); saveFix(); }
});
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (ev.target.id === "composer") {
    const v = $("#cmpIn").value.trim(); if (!v) return;
    $("#cmpIn").value = ""; syncSend(); post(v);
  }
  if (ev.target.id === "askForm") {
    const v = $("#askIn").value.trim() || "explica o que faltou, por favor";
    const m = msg(ev.target.dataset.msg); S.ask = null;
    post(v, { mention: m.who, replyTo: { who: m.who, text: "Montei novembro com 4 posts…" }, fix: true });
  }
});
const syncSend = () => { const on = !!$("#cmpIn").value.trim(); $("#send").className = "send" + (on ? " on" : ""); };
$("#cmpIn").addEventListener("input", syncSend);
$("#send").innerHTML = I.send;
$("#scroll").addEventListener("scroll", () => { if (floatEl) hideFloat(); }, { passive: true });

/* ---------- scenarios (prototype bar) ---------- */
function typeInto(text, done) {
  const i = $("#cmpIn"); i.value = ""; syncSend();
  if (REDUCED) { i.value = text; syncSend(); return later(400, done); }
  [...text].forEach((c, k) => later(40 * k, () => { i.value += c; syncSend(); }));
  later(40 * text.length + 350, done);
}
const ACTS = {
  up: () => { if (msg("m2").reacts.some((r) => r.e === "👍" && r.by.includes(ME))) toggleReact("m2", "👍"); toggleReact("m2", "👍"); },
  down: () => { if (msg("m2").reacts.some((r) => r.e === "👎" && r.by.includes(ME))) toggleReact("m2", "👎"); toggleReact("m2", "👎"); },
  thanks: () => typeInto("valeu, perfeito!", () => $("#composer").requestSubmit()),
  save: () => { S.mem = null; render(); later(250, saveMemory); },
  fill: () => {
    if (!$("#askIn")) { ACTS.down(); }
    later(200, () => { const i = $("#askIn"); if (!i) return; const tx = "faltou a newsletter de quinta"; i.value = ""; if (REDUCED) { i.value = tx; return later(300, () => $("#askForm").requestSubmit()); } [...tx].forEach((c, k) => later(35 * k, () => { if ($("#askIn")) $("#askIn").value += c; })); later(35 * tx.length + 400, () => $("#askForm")?.requestSubmit()); });
  },
  replay: () => goScn(S.scn),
};
const ACT_BTNS = {
  1: [["up", "<span class='emo'>👍</span> Dar joinha"], ["down", "<span class='emo'>👎</span> Não gostei"]],
  2: [["thanks", "Enviar “valeu, perfeito!”"]],
  3: [["save", `${I.book} Theo guarda de novo`]],
  4: [["down", "<span class='emo'>👎</span> Não gostei"], ["fill", "Responder e enviar"]],
};
function goScn(n) {
  clearTimers(); hideFloat();
  for (const k in FX) delete FX[k];
  S.scn = n; S.msgs = baseThread(); S.mem = null; S.ask = null; nextId = 10; clockMin = 14;
  $("#cmpIn").value = ""; syncSend();
  // Scenario 4 and 2 start from a thread where the memory was already saved (it is part of the story).
  if (n !== 3) S.mem = { msg: "m1", a: "theo", fact: FACT0, short: "publicar às terças" };
  render();
  $("#steps").innerHTML = SCN.map((s) => `<button class="stp" type="button" data-scn="${s.id}" ${s.id === n ? 'aria-current="step"' : ""}>${s.id}<span class="l">${s.l}</span></button>`).join("");
  $("#acts").innerHTML = ACT_BTNS[n].map(([a, l]) => `<button class="b b2" type="button" data-act="${a}">${l}</button>`).join("") + `<button class="b bg" type="button" data-act="replay">${I.undo} Repetir</button>`;
  $("#now").textContent = SCN[n - 1].now;
  $("#scroll").scrollTop = 0;
  const sc = SCN[n - 1];
  if (sc.focus) later(250, () => flash(sc.focus));
  if (n === 1) later(900, ACTS.up);
  if (n === 2) later(700, ACTS.thanks);
  if (n === 3) later(800, saveMemory);
  if (n === 4) later(900, ACTS.down);
}

/* ---------- chrome ---------- */
function setTheme(th) {
  document.documentElement.dataset.theme = th; varCache = {};
  $$("#theme button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.th === th)));
}
setTheme(document.documentElement.dataset.theme);
$("#thTitle").innerHTML = `${I.thread}Calendário do blog`;
$("#thSub").textContent = "Thread em #marketing · Ana, Theo e você";
$("#sbChans").innerHTML = [["geral", 0], ["marketing", 1], ["produto", 0]].map(([c, on]) => `<button class="sb-item${on ? " on" : ""}" type="button">${I.hash}<span>${c}</span>${on ? "<small>1 thread</small>" : ""}</button>`).join("");
$("#sbAgents").innerHTML = Object.entries(AGENTS).map(([id, a]) => `<button class="sb-item" type="button">${avHTML(id, 20)}<span>${a.name}</span><small>${a.role}</small></button>`).join("");
hydrate($(".sb"));
goScn(1);
</script>
</body>
</html>
