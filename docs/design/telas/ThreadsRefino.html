<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads: refino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&display=swap">
<script>
  { const h = new URLSearchParams(location.hash.slice(1));
    document.documentElement.dataset.theme = h.get("theme") || "light"; }
</script>
<style>
/*
  Prototype (ThreadsRefino): the Threads list as it is in production (2026-10-19) has problems:
  - the left edge floats: an invisible checkbox column pushes the icon in, and the icon is the same on
    every row (says nothing);
  - titles are the first message ("@theo", "pode fazer sim @theo", "**App Hang…" with raw markdown);
  - "Aberta" on every row is noise; what matters (waiting for you, an agent working) looks the same;
  - wide table columns (count, avatars, state, time) leave holes and push the time to the far edge;
  - no order by what matters, and repeated alerts (Sentry) take one row each.
  Common to all directions:
  - the row leads with who is carrying the thread (the agent from the engine, or a person's initial),
    flush with the page's left edge; the checkbox takes its place on hover or when selecting;
  - a short title the agent writes when the thread opens (first message only as fallback, no markdown);
  - state shows only when it asks for something: "Esperando você", "Trabalhando" (the agent's live
    sweep), "Parece resolvida" (the agent suggests closing, one click); open-and-quiet shows nothing;
  - unread: bold title + "3 novas" (never a dot); read rows in normal weight;
  - one quiet right cluster: participants + time; the count goes to the second line;
  - alerts from the same origin fold into one row ("Sentry · 2 alertas hoje").
  Directions:
  A · Caixa: one list grouped by attention (Esperando você, Trabalhando agora, Hoje, Ontem).
  B · Lista e leitura: a narrow list and a reading pane (summary "Onde parou", the last messages,
      reply and actions) so you triage without leaving the page.
  C · Por canal: the same rows grouped by channel/DM, collapsible, one line each.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root,[data-theme="light"]{
  --bg:#fbfbfa;--pane:#ffffff;--raised:#fff;--sunken:#f3f3f0;--side:#f8f8f6;
  --line:rgba(23,23,22,.07);--line2:rgba(23,23,22,.12);--field-line:rgba(23,23,22,.13);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#6f6f6a;
  --plate:rgba(127,127,127,.1);--plate-soft:rgba(127,127,127,.06);
  --chosen:#ffffff;--chosen-shadow:0 1px 2px rgba(23,23,22,.07),0 0 0 1px rgba(23,23,22,.09);
  --glass:rgba(255,255,255,.82);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.1),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.3),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --ok:#1f7a45;
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0f0f0e;--pane:#151514;--raised:#1c1c1b;--sunken:#0a0a09;--side:#121211;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--field-line:rgba(255,255,255,.14);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8f8f89;
  --plate:rgba(127,127,127,.14);--plate-soft:rgba(127,127,127,.08);
  --chosen:color-mix(in srgb,#fff 7%,var(--raised));--chosen-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.1);
  --glass:rgba(28,28,27,.85);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);
  --e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.08);
  --ok:#5fc48a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
:focus-visible{outline:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)!important}

/* ---------- prototype bar ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--bg);position:relative;z-index:50}
.proto b{color:var(--ink);font-weight:650}
.proto .note{flex-basis:100%;max-width:120ch}
.pseg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.pseg button{height:26px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.pseg button[aria-pressed="true"]{background:var(--chosen);color:var(--ink);box-shadow:var(--chosen-shadow)}

/* ---------- controls (ruler 32/40, radius 30%) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:10px;background:var(--raised);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--e1),var(--top);transition:transform .12s var(--out),box-shadow .12s}
.btn:hover{box-shadow:var(--e2),var(--top)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate);color:var(--ink)}
.btn.icon{width:32px;padding:0}
.btn.sm{height:28px;padding:0 10px;border-radius:8px;font-size:12.5px}
.btn.sm.icon{width:28px;padding:0}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chosen);color:var(--ink);box-shadow:var(--chosen-shadow)}
.seg .n{font-weight:500;color:var(--faint)}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--field-line);color:var(--faint);min-width:0;flex:1;max-width:340px}
.search input{border:0;background:none;outline:none;min-width:0;flex:1;color:var(--ink)}
.chipf{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:0;border-radius:10px;background:transparent;box-shadow:inset 0 0 0 1px var(--field-line);color:var(--ink2);font-size:13px;font-weight:550;cursor:pointer}
.chipf:hover{background:var(--plate-soft)}
.chipf[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.check{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border-radius:5px;background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--line2);cursor:pointer;display:grid;place-items:center;flex:none}
.check:checked{background:var(--ink);box-shadow:none}
.check:checked::after{content:"";width:9px;height:5px;border:2px solid var(--bg);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}

/* ---------- page ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 80px)}
.side{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:550;text-decoration:none}
.side a.on{background:var(--chosen);color:var(--ink);box-shadow:var(--chosen-shadow)}
.side .org{font-weight:650;color:var(--ink);padding:4px 10px 12px;font-size:14px}
.main{min-width:0;padding:34px 40px 80px}
.wrap{max-width:1080px;margin:0 auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.head h1{font-family:var(--display);font-weight:300;font-size:40px;letter-spacing:-.03em;line-height:1.05}
.head p{margin-top:8px;color:var(--muted);max-width:62ch}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:22px 0 18px}
.bar .grow{flex:1}

/* ---------- rows (shared) ---------- */
.list{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.grp{display:flex;align-items:center;gap:8px;padding:16px 4px 8px;font-size:12.5px;font-weight:650;color:var(--muted)}
.grp:first-child{padding-top:0}
.grp .n{font-weight:500;color:var(--faint)}
.grp .i{color:var(--faint)}
.grp button.tog{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer}
.grp button.tog .i{transition:transform .15s}
.grp button.tog[aria-expanded="false"] .i{transform:rotate(-90deg)}

.row{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--sunken) 50%,transparent)}
.row.on{background:color-mix(in srgb,var(--sunken) 85%,transparent)}
.row.picked{background:color-mix(in srgb,var(--ink) 4%,var(--raised))}
.lead{position:relative;width:36px;height:36px}
.lead .tile{width:36px;height:36px;border-radius:11px;background:var(--sunken);display:grid;place-items:center;overflow:hidden;transition:opacity .12s}
.lead .tile.p{background:var(--ink2);color:var(--bg);font-weight:650;font-size:14px}
.lead .check{position:absolute;inset:9px;opacity:0;transition:opacity .12s}
.row:hover .lead .check,.row.picked .lead .check,.selecting .lead .check{opacity:1}
.row:hover .lead .tile,.row.picked .lead .tile,.selecting .lead .tile{opacity:0}
.lead .ring{position:absolute;inset:-3px;border-radius:14px;box-shadow:0 0 0 1.5px var(--agent,var(--ink));opacity:.7;animation:halo 1.6s ease-out infinite;pointer-events:none}
@keyframes halo{0%{opacity:.8;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
.row:hover .lead .ring,.row.picked .lead .ring{display:none}

.tx{min-width:0}
.t1{display:flex;align-items:center;gap:8px;min-width:0}
.ttl{font-size:14.5px;font-weight:500;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread .ttl{font-weight:650}
.new{flex:none;height:20px;padding:0 7px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:650;display:inline-flex;align-items:center}
.t2{display:flex;align-items:center;gap:6px;min-width:0;margin-top:3px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.t2 .where{flex:none;display:inline-flex;align-items:center;gap:3px;color:var(--ink2);font-weight:600}
.t2 .where .i{color:var(--faint)}
.t2 .dot{flex:none;color:var(--faint)}
.t2 .last{min-width:0;overflow:hidden;text-overflow:ellipsis}
.t2 .cnt{flex:none;color:var(--faint)}

/* Fixed columns so tags, avatars and times line up from row to row: tag (right-aligned), people, time. */
.end{display:grid;grid-template-columns:168px 76px 64px;align-items:center;gap:12px;justify-self:end}
.end > :first-child{justify-self:end}
.end .stack{justify-self:start}
.end .acts{grid-column:3;justify-self:end}
.end:not(:has(.st)) > .stack{grid-column:2}
.st{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.st.wait{background:var(--ink);color:var(--bg)}
.st.work{background:var(--plate);color:var(--ink2);position:relative;overflow:hidden}
.st.work canvas{position:absolute;left:0;right:0;bottom:0;height:3px;width:100%;image-rendering:pixelated}
.st.done{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--muted);cursor:pointer;border:0;font:inherit;font-size:12.5px;font-weight:600}
.st.done:hover{background:var(--plate-soft);color:var(--ink)}
.st.closed{color:var(--faint);padding:0}
.stack{display:inline-flex;align-items:center}
.stack > *{margin-left:-6px;border-radius:7px;box-shadow:0 0 0 2px var(--raised);background:var(--sunken);display:grid;place-items:center}
.stack > *:first-child{margin-left:0}
.stack .pp{width:22px;height:22px;border-radius:7px;background:var(--ink2);color:var(--bg);font-size:10.5px;font-weight:650}
.stack .more{width:auto;padding:0 5px;height:22px;font-size:11px;font-weight:600;color:var(--muted)}
.ago{width:64px;text-align:right;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{display:none;gap:2px}
.row:hover .acts{display:flex}
.row:hover .ago{display:none}
.alert{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,#e5484d 14%,transparent);color:#d93d42;flex:none}
.fold{flex:none;height:20px;padding:0 7px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line2);font-size:11.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px}

/* ---------- B: list + reading ---------- */
.split{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
.split .row{grid-template-columns:36px minmax(0,1fr);align-items:start}
.split .row .end{display:flex;grid-column:2;justify-self:start;margin-top:6px;gap:8px}
.split .row .ago{width:auto;position:absolute;right:16px;top:13px}
.split .row:hover .ago{display:block}
.split .row .acts{display:none!important}
/* The narrow list keeps only what asks for something: participants and folds live in the reading pane. */
.split .stack,.split .fold{display:none}
.split .row .end:not(:has(.st)){display:none}
.split .row .t1{padding-right:56px}
.read{position:sticky;top:16px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:22px 24px;min-height:520px;display:flex;flex-direction:column;gap:18px}
.read h2{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.02em;line-height:1.15}
.read .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.read .sum{padding:14px 16px;border-radius:14px;background:var(--sunken)}
.read .sum b{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:4px}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.msg .who{font-size:13px;font-weight:650}
.msg .who small{font-weight:500;color:var(--faint);margin-left:6px}
.msg p{font-size:14px;color:var(--ink2);max-width:72ch}
.reply{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--field-line);color:var(--faint);margin-top:auto}
.reply span{flex:1}
.read .acts2{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- C: by channel ---------- */
.byc .row{padding:9px 16px;grid-template-columns:28px minmax(0,1fr) auto}
.byc .lead,.byc .lead .tile{width:28px;height:28px;border-radius:9px}
.byc .lead .check{inset:5px}
.byc .t1 .ttl{flex:none;max-width:52%}
.byc .t1 .last{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--muted)}
.byc .list + .grp{padding-top:20px}

/* ---------- selection bar + toast ---------- */
.selbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:16px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);box-shadow:var(--e3);font-size:13px;font-weight:600;z-index:40;animation:pop .2s var(--spring)}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px) scale(.97)}to{opacity:1;transform:translate(-50%,0)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--glass);backdrop-filter:blur(16px);box-shadow:var(--e3);font-size:13.5px;z-index:41;animation:pop .2s var(--spring)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}.side{display:none}
  .main{padding:20px 16px 80px}
  .split{grid-template-columns:1fr}.read{display:none}
  .row{grid-template-columns:36px minmax(0,1fr)}
  .row .end{grid-column:2;justify-self:start;gap:8px}
  .row .ago{width:auto}
  .row .acts{display:none!important}
  .row:hover .ago{display:block}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="proto">
  <b>Threads: refino</b>
  <div class="pseg" id="dirs" role="group" aria-label="Direção">
    <button data-v="a" aria-pressed="true">A · Caixa</button>
    <button data-v="b" aria-pressed="false">B · Lista e leitura</button>
    <button data-v="c" aria-pressed="false">C · Por canal</button>
  </div>
  <div class="pseg" id="theme" role="group" aria-label="Tema">
    <button data-v="light">Claro</button><button data-v="dark">Escuro</button>
  </div>
  <span class="note" id="note"></span>
</div>

<div class="shell">
  <nav class="side" aria-label="Navegação (fundo)">
    <div class="org">Viajolo</div>
    <a href="#">Início</a><a href="#">Canais</a><a href="#" class="on">Threads</a><a href="#">Tarefas</a><a href="#">Fórum</a><a href="#">Wiki</a><a href="#">Drive</a><a href="#">Agentes</a>
  </nav>
  <main class="main">
    <div class="wrap">
      <header class="head">
        <div>
          <h1>Threads</h1>
          <p>Os assuntos que saíram dos canais e das DMs. Feche o que se resolveu; arquive o que não importa mais.</p>
        </div>
        <button class="btn" id="newMission"></button>
      </header>
      <div class="bar">
        <div class="seg" id="tabs" role="group" aria-label="Filtro de threads"></div>
        <span class="grow"></span>
        <label class="search"><span id="sIcon"></span><input id="q" placeholder="Buscar threads" aria-label="Buscar threads"></label>
      </div>
      <div class="bar" style="margin-top:-6px">
        <button class="chipf" data-f="channel"></button>
        <button class="chipf" data-f="agent"></button>
        <button class="chipf" data-f="mine" aria-pressed="false"></button>
      </div>
      <div id="view"></div>
    </div>
  </main>
</div>
<div id="float"></div>

<script type="module">
import { drawAgent, idlePose, AGENT_GRADIENTS, mixHex } from "../../../packages/ui/src/agent/engine.js";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const sv = (d, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I = {
  hash: sv('<path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"/>', "i sm"),
  dm: sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>', "i sm"),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  flag: sv('<path d="M5 21V4h11l-2 4 2 4H5"/>'),
  agent: sv('<path d="M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H4V8a4 4 0 0 1 4-4Z"/><path d="M9.5 10.5v2.5M14.5 10.5v2.5"/>', "i sm"),
  person: sv('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>', "i sm"),
  chev: sv('<path d="m7 10 5 5 5-5"/>', "i sm"),
  check: sv('<path d="m5 12.5 4.5 4.5L19 7.5"/>', "i sm"),
  archive: sv('<rect x="3.5" y="4.5" width="17" height="4" rx="1.2"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12h4"/>', "i sm"),
  more: sv('<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>', "i sm"),
  open: sv('<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', "i sm"),
  waiting: sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', "i sm"),
  bolt: sv('<path d="M13 3 5 13.5h6L10 21l8-10.5h-6Z"/>', "i sm"),
  alert: sv('<path d="M12 4 3 19.5h18Z"/><path d="M12 10v4M12 17h.01"/>', "i sm"),
  send: sv('<path d="M12 19V5M6 11l6-6 6 6"/>', "i sm"),
  x: sv('<path d="M6 6l12 12M18 6 6 18"/>', "i sm"),
};

const AGENTS = {
  ada: { name: "Ada", role: "Engenharia", color: "rose", eyes: "round" },
  theo: { name: "Theo", role: "Produto", color: "amber", eyes: "round" },
  atlas: { name: "Atlas", role: "Ops", color: "violet", eyes: "round" },
};
const PEOPLE = { walter: { name: "Walter" } };
const A = (id) => ({ t: "agent", id }), P = (id) => ({ t: "person", id });
const nameOf = (x) => (x.t === "agent" ? AGENTS[x.id].name : PEOPLE[x.id].name);

// What production shows today → what the agent would name it.
const THREADS = [
  { id: 1, title: "Sentry: App Hang no iOS (VIAJOLO-15T)", where: "tech", lead: A("ada"), people: [A("atlas"), A("ada")],
    last: "Ada: Comentei a análise no #31. Não abri PR: é o mesmo travamento do 15Q.", count: 2, ago: "8 min", when: "today",
    unread: 1, alert: true, fold: { n: 2, also: "VIAJOLO-15Q, 8 h atrás" } },
  { id: 2, title: "Acesso do Theo ao Himetrica do viajolo-app", where: "general", lead: A("theo"), people: [P("walter"), A("atlas"), A("ada"), A("theo")],
    last: "Theo: Rodando a consulta de 60 dias por gatilho…", count: 151, ago: "10 min", when: "today", state: "work", unread: 4,
    summary: "Theo ganhou acesso ao Himetrica e está levantando a taxa de loved/negative por gatilho nos últimos 60 dias para o fórum do prompt de review." },
  { id: 3, title: "Números de review que ficaram com o Theo", where: "general", lead: A("theo"), people: [P("walter"), A("ada"), A("atlas"), A("theo")],
    last: "Theo: @Walter, rodei os números que ficaram comigo. Quer que eu abra no fórum?", count: 6, ago: "14 min", when: "today", state: "wait", unread: 2,
    summary: "Theo terminou a contagem (5 negativos em 2 dias, todos logo depois da compra) e pergunta se leva o assunto para o fórum." },
  { id: 4, title: "Feedback negativo: quantos e de quem", where: "general", lead: A("ada"), people: [P("walter"), A("theo"), A("ada")],
    last: "Ada: Fico no aguardo da sua resposta, @Walter: abro o PR ou espero o fórum?", count: 3, ago: "36 min", when: "today", state: "wait",
    summary: "Ada pode abrir agora um PR removendo o gatilho pós-compra; espera você dizer se faz já ou depois do fórum." },
  { id: 6, title: "Rotina de reviews a cada 30 minutos", where: "general", lead: A("theo"), people: [P("walter"), A("theo")],
    last: "Theo: Feito, @Walter. A rotina de reviews agora roda a cada 30 minutos.", count: 2, ago: "ontem", when: "yesterday", state: "done" },
  { id: 7, title: "Como a rotina olha a última hora", where: "general", lead: A("theo"), people: [P("walter"), A("theo")],
    last: "Theo: A cada hora, @Walter. Ela olha a última hora e só avisa se houver novidade.", count: 2, ago: "ontem", when: "yesterday" },
  { id: 8, title: "Fuso horário da equipe: São Paulo", where: "general", lead: A("theo"), people: [P("walter"), A("theo")],
    last: "Theo: Anotado, @Walter. A partir de agora passo os horários em São Paulo.", count: 2, ago: "ontem", when: "yesterday", state: "done" },
  { id: 9, title: "Plano de testes do importador", where: "dm", lead: A("ada"), people: [P("walter"), A("ada")],
    last: "Ada: Separei em três casos; o do Obsidian ainda falha com anexos.", count: 9, ago: "seg", when: "week" },
];

const NOTES = {
  a: "A · Caixa: uma lista só, em grupos pelo que pede atenção (Esperando você → Trabalhando agora → Hoje → Ontem). Linha: quem conduz (agente do motor, alinhado à borda), título curto escrito pelo agente, onde + última fala, e à direita só participantes e hora. 'Aberta' some; 'Parece resolvida' fecha com um clique. Passe o mouse: o checkbox toma o lugar do avatar.",
  b: "B · Lista e leitura: lista estreita à esquerda e um painel de leitura à direita com 'Onde parou' (resumo do agente), as últimas falas, responder ali mesmo e Fechar/Arquivar. Triagem sem sair da página; no celular vira só a lista.",
  c: "C · Por canal: as mesmas linhas, agrupadas por canal/DM (recolhíveis), uma linha cada. Bom para quem pensa por canal; alertas repetidos dobram numa linha só.",
};

let dir = new URLSearchParams(location.hash.slice(1)).get("dir") || "a", tab = "all", sel = 1, picked = new Set(), closed = new Set(), mine = false, q = "";

/* ---------- avatars ---------- */
const live = [];
function agentCanvas(id, size, mode = "idle") {
  const cv = document.createElement("canvas");
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = cv.height = Math.round(size * dpr);
  cv.style.width = cv.style.height = size + "px";
  cv.setAttribute("role", "img");
  cv.setAttribute("aria-label", `${AGENTS[id].name}, agente`);
  live.push({ cv, a: AGENTS[id], seed: id.length + Math.random() * 5, mode, size });
  return cv;
}
const av = (x, size, mode) =>
  x.t === "agent" ? `<span class="avs" data-a="${x.id}" data-s="${size}" data-m="${mode || "idle"}"></span>` : `<span class="pp" style="width:${size}px;height:${size}px">${esc(PEOPLE[x.id].name[0])}</span>`;
function hydrate(root) {
  for (const el of $$(".avs", root)) el.replaceWith(agentCanvas(el.dataset.a, +el.dataset.s, el.dataset.m));
  for (const cv of $$("canvas.sweep", root)) sweeps.push(cv);
}
const sweeps = [];
function frame(t) {
  t /= 1000;
  for (let i = live.length - 1; i >= 0; i--) {
    const it = live[i];
    if (!it.cv.isConnected) { live.splice(i, 1); continue; }
    const ctx = it.cv.getContext("2d"), s = it.cv.width, inner = s * 0.84;
    ctx.clearRect(0, 0, s, s);
    const pose = idlePose(t, it.seed, { every: 14, active: it.mode === "run", expressions: ["happy", "wink"] });
    if (it.mode === "run") { pose.writing = true; pose.expression = undefined; }
    if (it.mode === "wait") pose.turn = [Math.sin(t * .8 + it.seed) * .3, -.2];
    drawAgent(ctx, (s - inner) / 2, s - inner, inner, { color: it.a.color, eyes: it.a.eyes, cells: it.size <= 32 ? 12 : undefined, pose });
  }
  for (let i = sweeps.length - 1; i >= 0; i--) {
    const cv = sweeps[i];
    if (!cv.isConnected) { sweeps.splice(i, 1); continue; }
    const w = 48, ctx = cv.getContext("2d");
    if (cv.width !== w) { cv.width = w; cv.height = 1; }
    const [top, bot] = AGENT_GRADIENTS[cv.dataset.c];
    const c = (t * .5 % 1.6) - .3;
    for (let x = 0; x < w; x++) {
      const d = x / w - c, k = Math.exp(-(d * d) / .02);
      ctx.fillStyle = k > .55 ? bot : k > .2 ? top : mixHex(top, "#ffffff", .55);
      ctx.globalAlpha = .25 + .75 * k;
      ctx.fillRect(x, 0, 1, 1);
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- pieces ---------- */
const whereHTML = (th) => th.where === "dm" ? `<span class="where">${I.dm}Walter e Ada</span>` : `<span class="where">${I.hash}${th.where}</span>`;
function stateHTML(th, inGroup = false) {
  if (closed.has(th.id)) return `<span class="st closed">${I.check}Fechada</span>`;
  // In A the group already says "Esperando você".
  if (th.state === "wait" && inGroup) return "";
  if (th.state === "wait") return `<span class="st wait">${I.waiting}Esperando você</span>`;
  if (th.state === "work") return `<span class="st work">${I.bolt}Trabalhando<canvas class="sweep" data-c="${AGENTS[th.lead.id].color}"></canvas></span>`;
  if (th.state === "done") return `<button class="st done" data-close="${th.id}" title="O agente acha que isso se resolveu">${I.check}Resolvida? Fechar</button>`;
  return "";
}
const leadMode = (th) => (th.state === "work" ? "run" : th.state === "wait" ? "wait" : "idle");
function row(th, opts = {}) {
  const lead = th.lead.t === "agent"
    ? `<span class="tile">${av(th.lead, opts.small ? 24 : 30, leadMode(th))}</span>`
    : `<span class="tile p">${esc(PEOPLE[th.lead.id].name[0])}</span>`;
  const ring = th.state === "work" && !closed.has(th.id) ? `<span class="ring" style="--agent:${AGENT_GRADIENTS[AGENTS[th.lead.id].color][1]}"></span>` : "";
  const ppl = th.people.slice(-3);
  const stack = `<span class="stack" aria-label="${esc(th.people.map(nameOf).join(", "))}">${ppl.map((p) => av(p, 22)).join("")}${th.people.length > 3 ? `<span class="more">+${th.people.length - 3}</span>` : ""}</span>`;
  const fold = th.fold ? `<span class="fold" title="Também: ${esc(th.fold.also)}">${th.fold.n} alertas hoje</span>` : "";
  const icon = th.alert ? `<span class="alert" aria-label="Alerta">${I.alert}</span>` : "";
  const t2 = opts.oneLine ? "" :
    `<div class="t2">${opts.noWhere ? "" : whereHTML(th) + `<span class="dot">·</span>`}<span class="last">${esc(th.last)}</span><span class="dot">·</span><span class="cnt">${th.count} msgs</span></div>`;
  return `<article class="row${th.unread && !closed.has(th.id) ? " unread" : ""}${picked.has(th.id) ? " picked" : ""}${opts.on && sel === th.id ? " on" : ""}" data-id="${th.id}" aria-label="${esc(th.title)}">
    <span class="lead">${lead}${ring}<input type="checkbox" class="check" aria-label="Selecionar ${esc(th.title)}" ${picked.has(th.id) ? "checked" : ""}></span>
    <div class="tx">
      <div class="t1">${icon}<span class="ttl">${esc(th.title)}</span>${th.unread && !closed.has(th.id) ? `<span class="new">${th.unread} nova${th.unread > 1 ? "s" : ""}</span>` : ""}${fold}${opts.oneLine ? `<span class="last">${esc(th.last)}</span>` : ""}</div>
      ${t2}
    </div>
    <div class="end">${stateHTML(th, opts.grouped)}${stack}<span class="ago">${th.ago}</span>
      <span class="acts"><button class="btn ghost sm icon" title="Fechar" data-close="${th.id}">${I.check}</button><button class="btn ghost sm icon" title="Arquivar">${I.archive}</button><button class="btn ghost sm icon" title="Mais ações">${I.more}</button></span>
    </div>
  </article>`;
}

function filtered() {
  return THREADS.filter((th) => {
    if (tab === "working" && th.state !== "work") return false;
    if (tab === "closed" && !closed.has(th.id)) return false;
    if (tab === "all" && closed.has(th.id)) return false;
    if (mine && !th.people.some((p) => p.t === "person")) return false;
    if (q && !(th.title + th.last).toLowerCase().includes(q)) return false;
    return true;
  });
}

/* ---------- views ---------- */
function viewA(list) {
  const groups = [
    { k: "Esperando você", icon: I.waiting, f: (t) => t.state === "wait" && !closed.has(t.id) },
    { k: "Trabalhando agora", icon: I.bolt, f: (t) => t.state === "work" && !closed.has(t.id) },
    { k: "Hoje", f: (t) => t.when === "today" },
    { k: "Ontem", f: (t) => t.when === "yesterday" },
    { k: "Esta semana", f: (t) => t.when === "week" },
  ];
  const used = new Set();
  let html = "";
  for (const g of groups) {
    const items = list.filter((t) => !used.has(t.id) && g.f(t));
    if (!items.length) continue;
    items.forEach((t) => used.add(t.id));
    html += `<div class="grp">${g.icon || ""}${g.k}<span class="n">${items.length}</span></div><div class="list">${items.map((t) => row(t, { grouped: true })).join("")}</div>`;
  }
  return html || `<div class="list" style="padding:40px;text-align:center;color:var(--muted)">Nada por aqui.</div>`;
}
function viewB(list) {
  const th = list.find((t) => t.id === sel) || list[0];
  if (th) sel = th.id;
  const msgs = th ? [
    { who: P("walter"), at: th.ago === "ontem" ? "ontem 18:02" : "09:01", text: "Consegue ver isso pra mim?" },
    { who: th.lead, at: th.ago === "ontem" ? "ontem 18:04" : "09:06", text: th.last.replace(/^\w+: /, "") },
  ] : [];
  const read = th ? `<aside class="read" aria-label="Leitura">
      <div class="meta">${whereHTML(th).replace('class="where"', 'class="where" style="display:inline-flex;gap:3px;align-items:center;font-weight:600;color:var(--ink2)"')}<span>·</span><span>${th.count} mensagens</span><span>·</span><span>${th.people.map(nameOf).join(", ")}</span></div>
      <h2>${esc(th.title)}</h2>
      ${stateHTML(th) ? `<div>${stateHTML(th)}</div>` : ""}
      <div class="sum"><b>Onde parou</b>${esc(th.summary || th.last.replace(/^\w+: /, ""))}</div>
      ${msgs.map((m) => `<div class="msg">${m.who.t === "agent" ? av(m.who, 28) : `<span class="pp" style="width:28px;height:28px;border-radius:9px;background:var(--ink2);color:var(--bg);display:grid;place-items:center;font-weight:650;font-size:12px">W</span>`}<div><div class="who">${nameOf(m.who)}<small>${m.at}</small></div><p>${esc(m.text)}</p></div></div>`).join("")}
      <div class="reply"><span>Responder na thread…</span><button class="btn primary sm icon" aria-label="Enviar">${I.send}</button></div>
      <div class="acts2"><button class="btn sm">${I.open}Abrir thread</button><button class="btn sm" data-close="${th.id}">${I.check}Fechar</button><button class="btn sm ghost">${I.archive}Arquivar</button></div>
    </aside>` : "";
  return `<div class="split"><div class="list">${list.map((t) => row(t, { on: true })).join("")}</div>${read}</div>`;
}
function viewC(list) {
  const by = new Map();
  for (const t of list) { const k = t.where; if (!by.has(k)) by.set(k, []); by.get(k).push(t); }
  let html = "";
  for (const [k, items] of by) {
    const label = k === "dm" ? `${I.dm}Mensagens diretas` : `${I.hash}${k}`;
    html += `<div class="grp"><button class="tog" aria-expanded="true">${I.chev}${label}</button><span class="n">${items.length}</span></div><div class="list">${items.map((t) => row(t, { small: true, oneLine: true })).join("")}</div>`;
  }
  return `<div class="byc">${html}</div>`;
}

function render() {
  const list = filtered();
  $("#view").innerHTML = dir === "a" ? viewA(list) : dir === "b" ? viewB(list) : viewC(list);
  $("#view").classList.toggle("selecting", picked.size > 0);
  hydrate($("#view"));
  $("#note").textContent = NOTES[dir];
  $("#float").innerHTML = picked.size
    ? `<div class="selbar" role="toolbar">${picked.size} selecionada${picked.size > 1 ? "s" : ""}<button class="btn sm" data-bulk="close">${I.check}Fechar</button><button class="btn sm">${I.archive}Arquivar</button><button class="btn ghost sm icon" data-bulk="clear" aria-label="Limpar seleção">${I.x}</button></div>`
    : "";
}

function renderTabs() {
  const counts = { all: THREADS.filter((t) => !closed.has(t.id)).length, working: THREADS.filter((t) => t.state === "work").length, missions: 0, closed: closed.size };
  const T = [["all", "Todas"], ["working", "Com trabalho"], ["missions", "Missões"], ["closed", "Fechadas"], ["archived", "Arquivadas"]];
  $("#tabs").innerHTML = T.map(([v, l]) => `<button data-v="${v}" aria-pressed="${tab === v}">${l}${counts[v] ? ` <span class="n">${counts[v]}</span>` : ""}</button>`).join("");
}

function toast(text, undo) {
  $("#float").innerHTML = `<div class="toast">${text}${undo ? `<button class="btn sm" id="undo">Desfazer</button>` : ""}</div>`;
  if (undo) $("#undo").onclick = () => { undo(); renderTabs(); render(); };
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { if ($(".toast")) $("#float").innerHTML = ""; }, 4000);
}

/* ---------- events ---------- */
$("#view").addEventListener("click", (e) => {
  const close = e.target.closest("[data-close]");
  if (close) {
    const id = +close.dataset.close;
    closed.add(id); renderTabs(); render();
    toast("Thread fechada. Reabre sozinha se alguém responder.", () => closed.delete(id));
    return;
  }
  const tog = e.target.closest(".tog");
  if (tog) {
    const open = tog.getAttribute("aria-expanded") === "true";
    tog.setAttribute("aria-expanded", String(!open));
    tog.closest(".grp").nextElementSibling.hidden = open;
    return;
  }
  const r = e.target.closest(".row");
  if (!r) return;
  const id = +r.dataset.id;
  if (e.target.classList.contains("check")) {
    picked.has(id) ? picked.delete(id) : picked.add(id);
    render(); return;
  }
  if (e.target.closest("button")) return;
  if (picked.size) { picked.has(id) ? picked.delete(id) : picked.add(id); render(); return; }
  sel = id;
  if (dir === "b") render();
});
$("#float").addEventListener("click", (e) => {
  const b = e.target.closest("[data-bulk]");
  if (!b) return;
  if (b.dataset.bulk === "close") { const ids = [...picked]; ids.forEach((i) => closed.add(i)); picked.clear(); renderTabs(); render(); toast(`${ids.length} fechada${ids.length > 1 ? "s" : ""}.`, () => ids.forEach((i) => closed.delete(i))); }
  else { picked.clear(); render(); }
});
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.v; renderTabs(); render(); });
$("#q").addEventListener("input", (e) => { q = e.target.value.trim().toLowerCase(); render(); });
$("[data-f=mine]").addEventListener("click", (e) => { mine = !mine; e.currentTarget.setAttribute("aria-pressed", String(mine)); render(); });
$("#dirs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  dir = b.dataset.v;
  $$("#dirs button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
});
const setTheme = (v) => { document.documentElement.dataset.theme = v; $$("#theme button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === v))); };
$("#theme").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setTheme(b.dataset.v); });
setTheme(document.documentElement.dataset.theme);

$$("#dirs button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === dir)));
$("#newMission").innerHTML = `${I.flag}Nova missão`;
$("#sIcon").innerHTML = I.search;
$("[data-f=channel]").innerHTML = `${I.hash}Canal${I.chev}`;
$("[data-f=agent]").innerHTML = `${I.agent}Agente${I.chev}`;
$("[data-f=mine]").innerHTML = `${I.person}Minhas`;
renderTabs();
render();
</script>
</body>
</html>
