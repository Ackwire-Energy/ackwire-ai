<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navegador do agente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>{const q=new URLSearchParams(location.hash.slice(1));document.documentElement.dataset.theme=q.get("theme")||"dark";}</script>
<style>
/*
  Prototype (ADR 0040, D57): the agent's browser on a connected computer, for approval.
    1. Agente: the "Navegador" section under the agent's computer (switch, why it's off, allowed sites, the
       login line).
    2. Computador: the browser on the machine page (ready / downloading / needs a command) and who uses it
       now, with Ver and Parar.
    3. Pedido no chat: the agent asks a person for help (the approval card family: a fuse to the timeout),
       and its resolved states.
    4. Avisos: the entry under "Esperando você" and the push on the phone.
    5. Tela ao vivo: full screen, web and phone. The agent's instruction, "Você está no controle", Pronto /
       Não consegui (with an optional reason), typing through the app's own field (secure for passwords,
       the phone's password autofill), reconnecting, and someone else in control.
    6. Assistindo: a small live view on the run beside the action log, with Assumir and Parar.
  Only what ADR 0040 builds: JPEG frames, no video, no recording, no window on the computer.
  Tokens: packages/ui/src/styles/tokens.css. Controls follow the 32/40/48 ruler (RefinoUI.html).
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
  Hash: #s=agente|computador|pedido|avisos|ao-vivo|assistindo&theme=dark|light
*/
:root,[data-theme="light"]{
  --bg:#fbfbfa;--raised:#fff;--sunken:#f3f3f0;--side:#f8f8f6;--pane:#fff;
  --glass:rgba(255,255,255,.88);--glass2:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.07);--line2:rgba(23,23,22,.12);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#6f6f6a;
  --agent:#0063d1;--ok:#1f7a45;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --plate:rgba(127,127,127,.1);--plate-soft:rgba(127,127,127,.06);
  --field-bg:#fff;--field-line:rgba(23,23,22,.13);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.1),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.3),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);--scrim:rgba(10,10,10,.32);
  --site-bg:#f6f8fb;--site-card:#fff;--site-ink:#1a1f36;--site-muted:#5b6478;--site-line:#e3e8ee;--site-accent:#5a54d6;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#1c1c1b;--sunken:#0a0a09;--side:#0a0a09;--pane:#0f0f0e;
  --glass:rgba(30,30,28,.86);--glass2:rgba(40,40,38,.6);
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.15);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8f8f89;
  --agent:#5aa8ff;--ok:#5fc48a;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --plate:rgba(127,127,127,.14);--plate-soft:rgba(127,127,127,.08);
  --field-bg:color-mix(in srgb,var(--sunken) 40%,var(--raised));--field-line:rgba(255,255,255,.1);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);
  --e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.08);--scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;
  --ios:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --h-sm:32px;--h-md:40px;--h-lg:48px;--r-sm:10px;--r-md:12px;--r-lg:14px;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background .25s}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:14px;height:14px}
.i.lg{width:20px;height:20px}
canvas.av{display:block;flex:none}

/* ---------- prototype bar ---------- */
.proto{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.proto h1{font:300 20px/1 var(--display);letter-spacing:-.02em;margin-right:auto}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;gap:2px;border-radius:var(--r-md);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{all:unset;cursor:pointer;height:26px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

/* ---------- shared controls (the ruler) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h-md);padding:0 14px;border-radius:var(--r-md);border:0;background:var(--raised);color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:var(--e1),var(--top);transition:transform .2s var(--spring),background-color .15s}
.btn:hover{background:color-mix(in srgb,var(--plate-soft) 100%,var(--raised))}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 86%,#fff),var(--ink));color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate);color:var(--ink)}
.btn.sm{height:var(--h-sm);padding:0 12px;border-radius:var(--r-sm);font-size:13px}
.btn.sm.ico{width:var(--h-sm);padding:0;justify-content:center}
.btn.lg{height:var(--h-lg);padding:0 18px;border-radius:var(--r-lg);font-size:15px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.chip .i{width:13px;height:13px}
.chip.ok{color:var(--ok)}
.chip.warn{color:var(--warn)}
.chip.onair{color:var(--ink2)}
.sw{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:40px;height:24px;border-radius:999px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink);box-shadow:none}
.sw[aria-checked="true"]::after{transform:translateX(16px);background:var(--bg)}
.sw[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.sw:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--plate-soft);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:13px}
.note b{color:var(--ink);font-weight:600}
.note .i{margin-top:2px;color:var(--ink2)}
.code{display:flex;align-items:center;gap:8px;height:var(--h-md);padding:0 6px 0 12px;border-radius:var(--r-md);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.code code{flex:1;min-width:0;font:400 12px/1 var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld{display:flex;align-items:center;gap:8px;height:var(--h-md);padding:0 12px;border-radius:var(--r-md);background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line)}
.fld:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.fld input{all:unset;flex:1;min-width:0;font-size:14px}
.fld input::placeholder{color:var(--faint)}

/* ---------- page layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 120px}
.intro{display:flex;flex-direction:column;gap:6px;margin-bottom:22px;max-width:76ch}
.intro h2{font:300 34px/1.08 var(--display);letter-spacing:-.03em}
.intro p{color:var(--muted);font-size:14px}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px;font-size:12.5px;color:var(--faint)}
.duo{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.duo>.web{flex:1 1 560px;min-width:0}
.pf{display:flex;flex-direction:column;gap:10px;align-items:center;flex:none}
.pf figcaption{font-size:12.5px;color:var(--faint);text-align:center}
.pw{position:relative;flex:none;width:calc(412px * var(--k,.78));height:calc(866px * var(--k,.78))}

/* the web app window */
.win{border-radius:20px;overflow:hidden;background:var(--pane);box-shadow:var(--e3)}
.win .tb{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;background:var(--side);border-bottom:1px solid var(--line)}
.win .tb i{width:11px;height:11px;border-radius:50%;background:var(--line2)}
.win .tb span{margin-left:10px;font-size:12px;color:var(--faint)}
.win .body{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:560px}
.win .side{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.win .side .ws{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;font-weight:650}
.win .side .ws em{width:22px;height:22px;border-radius:7px;background:var(--ink);color:var(--bg);font-style:normal;font-size:12px;display:grid;place-items:center}
.win .side a{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500}
.win .side a[aria-current="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top);font-weight:600}
.win .side a .bdg{margin-left:auto;font-size:11.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.win .side .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:14px 8px 6px}
.win .main{min-width:0;padding:24px 28px 32px;display:flex;flex-direction:column;gap:16px}
.win .main.chat{padding:0;gap:0}

/* cards */
.card{background:var(--raised);border-radius:20px;box-shadow:var(--e1),var(--top);padding:20px;min-width:0}
.ch{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.ch .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ch h3{font-size:16px;font-weight:650;letter-spacing:-.01em}
.ch p{color:var(--muted);font-size:13px}
.ic{width:36px;height:36px;border-radius:11px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--ink2);flex:none}
.rowline{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rowline .t{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowline .t b{font-weight:600}
.rowline .t small{color:var(--muted);font-size:12.5px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2);transition:box-shadow .15s,background .15s}
.opt[aria-checked="true"]{background:var(--sunken);box-shadow:inset 0 2px 5px rgba(0,0,0,.08),inset 0 0 0 1px var(--line)}
.opt .dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);flex:none;margin-top:1px;display:grid;place-items:center}
.opt[aria-checked="true"] .dot{box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.opt .t{display:flex;flex-direction:column;gap:1px}
.opt .t b{font-weight:600}
.opt .t small{color:var(--muted);font-size:12.5px}
.opts{display:flex;flex-direction:column;gap:8px;flex-basis:100%}
.sites{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0 0 30px}
.site{display:inline-flex;align-items:center;gap:6px;height:var(--h-sm);padding:0 6px 0 10px;border-radius:var(--r-sm);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:550}
.site .i{color:var(--muted)}
.site button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--faint)}
.site button:hover{background:var(--plate);color:var(--ink)}
.sites .fld{height:var(--h-sm);border-radius:var(--r-sm);width:200px}
.sites .fld input{font-size:13px}
.off{opacity:.45;pointer-events:none}

/* agent header on the agent page */
.ahead{display:flex;align-items:center;gap:14px}
.ahead .t{display:flex;flex-direction:column;gap:2px}
.ahead h2{font:300 30px/1.05 var(--display);letter-spacing:-.025em}
.ahead small{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:4px}
.tabs a{padding:8px 10px 10px;font-size:13.5px;font-weight:550;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.machine{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.machine .t{flex:1;min-width:0;display:flex;flex-direction:column}
.machine .t b{font-weight:600}
.machine .t small{color:var(--muted);font-size:12.5px}

/* tile (agent in its sky) */
.tile{position:relative;display:grid;place-items:center;overflow:hidden;flex:none;border-radius:30%}
.tile canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.tile canvas.av{position:relative}
.pp{display:grid;place-items:center;border-radius:30%;background:var(--ink2);color:var(--bg);font-weight:650;flex:none}

/* machine page */
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.status .grow{flex:1}
.prog{position:relative;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);flex:1 1 200px}
.prog i{position:absolute;inset:0 auto 0 0;width:42%;background:var(--ink2);border-radius:3px;animation:grow 6s var(--out) infinite}
@keyframes grow{0%{width:8%}100%{width:96%}}
.uses{display:flex;flex-direction:column;margin-top:4px}
.use{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.use .t{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:1px}
.use .t b{font-weight:600}
.use .t small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.use .acts{display:flex;gap:6px;align-items:center}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:var(--plate-soft);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;flex-basis:100%;margin-left:52px}
.confirm .grow{flex:1}

/* ---------- chat ---------- */
.chead{display:flex;align-items:center;gap:10px;height:54px;padding:0 22px;border-bottom:1px solid var(--line)}
.chead b{font-weight:650}
.chead small{color:var(--faint);font-size:12.5px}
.msgs{display:flex;flex-direction:column;gap:16px;padding:20px 22px 28px;max-width:calc(72ch + 60px)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 12px}
.msg>:first-child{grid-row:1 / span 4;grid-column:1}
.msg>:not(:first-child){grid-column:2}
.msg .h{display:flex;align-items:baseline;gap:8px;font-size:13px}
.msg .h b{font-weight:650;font-size:14px}
.msg .h small{color:var(--faint)}
.msg .x{color:var(--ink2);font-size:14.5px;line-height:1.55}
.msg .x+.x{margin-top:4px}
.composer{margin:0 22px 20px;display:flex;align-items:center;gap:10px;height:var(--h-lg);padding:0 8px 0 16px;border-radius:var(--r-lg);background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line);color:var(--faint);font-size:14px}
.composer .grow{flex:1}
.composer .send{width:32px;height:32px;border-radius:10px;background:var(--sunken);display:grid;place-items:center;color:var(--faint)}
.chatcol{display:flex;flex-direction:column;min-height:560px}
.chatcol .msgs{flex:1}

/* the help request card (approval family) */
.rq{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;padding:16px 16px 18px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden;margin-top:4px}
.rq .face{grid-row:1 / span 2;padding-top:2px}
.rq .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
.rq .meta b{color:var(--ink2);font-weight:600}
.rq .meta .grow{flex:1}
.rq h4{font-size:17px;font-weight:650;letter-spacing:-.015em;line-height:1.3;margin-top:2px}
.rq .body{min-height:0;grid-column:2;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.exact{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--sunken)}
.exact .ic{width:32px;height:32px;border-radius:10px;background:var(--raised);box-shadow:var(--e1)}
.exact .t{flex:1;min-width:0}
.exact .t b{display:block;font-size:13.5px;font-weight:600}
.exact .t small{color:var(--muted);font-size:12.5px}
.rq .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rq .acts .grow{flex:1}
.rq .acts .hint{font-size:12px;color:var(--faint)}
.rq .res{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.rq .res .i{color:var(--muted)}
.rq .res.ok .i{color:var(--ok)}
.rq .why{font-size:13px;color:var(--muted);display:flex;gap:10px}
.rq .why::before{content:"";width:3px;border-radius:3px;background:var(--line2);flex:none}
canvas.fuse{position:absolute;left:0;right:0;bottom:0;width:100%;height:4px;image-rendering:pixelated;pointer-events:none}
.rq.settled canvas.fuse{display:none}
.rq.settled{box-shadow:var(--e1)}
.rq.settled h4{color:var(--ink2)}

/* ---------- notifications ---------- */
.nhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nhead h2{font:300 30px/1.05 var(--display);letter-spacing:-.025em;margin-right:auto}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{all:unset;cursor:pointer;height:var(--h-sm);padding:0 12px;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line2)}
.fchip[aria-pressed="true"]{background:var(--sunken);color:var(--ink);box-shadow:inset 0 2px 5px rgba(0,0,0,.08),inset 0 0 0 1px var(--line)}
.gh{display:flex;align-items:center;gap:8px;margin:6px 4px 0;font-size:13px;font-weight:650;color:var(--ink2)}
.gh small{font-weight:500;color:var(--faint);font-size:12.5px}
.nlist{background:var(--raised);border-radius:20px;box-shadow:var(--e1),var(--top);overflow:hidden}
.nrow{display:grid;grid-template-columns:28px 36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}

.phone{position:absolute;left:0;top:0;width:412px;height:866px;transform:scale(var(--k,.78));transform-origin:0 0;border-radius:62px;padding:11px;background:#111110;box-shadow:0 0 0 1.5px #3a3a37,0 40px 90px -30px rgba(0,0,0,.5),0 12px 30px -12px rgba(0,0,0,.3)}
.screen{position:relative;width:390px;height:844px;border-radius:51px;overflow:hidden;background:var(--bg);isolation:isolate;font-family:var(--ios);font-size:17px}

.gb{width:40px;height:40px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink);background:var(--glass2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px -4px rgba(0,0,0,.2),0 0 0 .5px var(--line2)}
.pscroll{position:absolute;inset:0;overflow:hidden;padding:112px 16px 110px;display:flex;flex-direction:column;gap:14px}
.pmsg{display:flex;flex-direction:column;gap:3px}
.pmsg .h{display:flex;align-items:center;gap:8px;font-size:15px}
.pmsg .h b{font-weight:600}
.pmsg .h small{color:var(--faint);font-size:13px}

.pcomp{position:absolute;left:12px;right:12px;bottom:30px;height:48px;border-radius:24px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--line2);display:flex;align-items:center;padding:0 16px;color:var(--faint);font-size:17px;z-index:30}
.screen .rq{grid-template-columns:36px minmax(0,1fr);padding:14px 14px 16px;border-radius:22px}

/* lock screen */
.lock{position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 10%,#3b4a6b,transparent 60%),radial-gradient(90% 60% at 80% 90%,#3a2d4f,transparent 60%),#0d0f16;color:#fff}
.lock .clock{position:absolute;top:110px;left:0;right:0;text-align:center}

.push{position:absolute;left:12px;right:12px;top:330px;display:grid;grid-template-columns:38px minmax(0,1fr);gap:2px 12px;padding:13px 14px;border-radius:24px;background:rgba(60,60,64,.55);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 0 0 .5px rgba(255,255,255,.12)}

.push .top b{font-weight:600}

/* ---------- live view ---------- */
.live{position:relative;display:flex;flex-direction:column;background:var(--bg);min-height:640px}
.lbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--raised);flex-wrap:wrap}

.badge{display:inline-flex;align-items:center;gap:6px;height:var(--h-sm);padding:0 12px;border-radius:var(--r-sm);font-size:13px;font-weight:600;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}

.bview{position:relative;cursor:default}
.lfoot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--raised);flex-wrap:wrap}

.secure{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:var(--h-sm);padding:0 10px;border-radius:var(--r-sm);font-size:13px;font-weight:600;color:var(--muted)}

.sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:fi .2s var(--out)}

.sheet .panel{width:min(520px,100%);margin:0 0 20px;padding:18px;border-radius:22px;background:var(--raised);box-shadow:var(--e3);display:flex;flex-direction:column;gap:12px;animation:up .3s var(--spring)}

.sheet h4{font-size:17px;font-weight:650}
.sheet p{font-size:13px;color:var(--muted)}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.ta{display:flex;min-height:72px;padding:10px 12px;border-radius:var(--r-md);background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line)}
.ta:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ta textarea{all:unset;flex:1;font-size:14px;line-height:1.5;white-space:pre-wrap}
.ta textarea::placeholder{color:var(--faint)}
.sheet .row{display:flex;gap:8px;justify-content:flex-end}
.donebox{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);animation:fi .2s var(--out)}
.donebox .panel{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 30px;border-radius:24px;background:var(--raised);box-shadow:var(--e3);text-align:center;max-width:360px}
.donebox h4{font:300 26px/1.1 var(--display);letter-spacing:-.02em}
.donebox p{color:var(--muted);font-size:13.5px}

/* the fake site (a login page drawn in HTML/CSS) */

.fs{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;color:var(--site-ink);background:var(--site-bg);padding:34px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative}
.fs .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--site-ink)}
.fs .brand i{width:22px;height:22px;border-radius:6px;background:var(--site-accent);display:block}
.fs .box{width:min(380px,100%);background:var(--site-card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 12px 30px -12px rgba(30,40,80,.18);padding:26px 26px 22px;display:flex;flex-direction:column;gap:14px}
.fs h5{font-size:22px;font-weight:700;letter-spacing:-.01em}
.fs label{font-size:13px;font-weight:600;color:var(--site-ink);display:flex;flex-direction:column;gap:6px;cursor:text}
.fs .inp{height:38px;border-radius:6px;border:1px solid var(--site-line);background:#fff;display:flex;align-items:center;padding:0 10px;font-size:14px;color:var(--site-ink);font-weight:400;transition:box-shadow .15s,border-color .15s}
.fs .inp.focus{border-color:var(--site-accent);box-shadow:0 0 0 3px rgba(90,84,214,.25)}
.fs .inp .caret{width:1.5px;height:17px;background:var(--site-ink);margin-left:1px;animation:blinkc 1s steps(2) infinite}
@keyframes blinkc{50%{opacity:0}}
.fs .inp .ph{color:#9aa3b5}
.fs .go{height:40px;border-radius:6px;background:var(--site-accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.fs .row{display:flex;justify-content:space-between;font-size:13px;color:var(--site-accent);font-weight:600}
.fs .fine{font-size:12px;color:var(--site-muted)}
.fs .code6{display:flex;gap:8px}
.fs .code6 span{width:38px;height:44px;border:1px solid var(--site-line);border-radius:6px;display:grid;place-items:center;font-size:18px;font-weight:600;background:#fff}
/* checkout variant */
.fs.co{flex-direction:row;align-items:flex-start;justify-content:center;gap:22px;flex-wrap:wrap}
.fs.co .sum{width:min(240px,100%);display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--site-muted)}
.fs.co .sum b{color:var(--site-ink);font-size:24px;font-weight:700}
.fs.co .line{display:flex;justify-content:space-between}
.cursor{position:absolute;width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 4px rgba(20,20,20,.55);pointer-events:none;transform:translate(-50%,-50%);animation:tap 1.8s var(--out) infinite;z-index:3}

/* the phone live view */
.plive{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}

.work{border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);background:var(--raised);overflow:hidden;margin-top:6px}

.work .wh b{font-weight:600}
.work .wh .grow{flex:1}
.work .wb{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.work .wb.one{grid-template-columns:minmax(0,1fr)}

.mini .scale{width:760px;transform-origin:0 0}

.log{display:flex;flex-direction:column;padding:8px 12px;font-size:13px;max-height:260px;overflow:auto}

.log li:first-child{border-top:0}

.log li small{color:var(--faint);font-size:12px}
.log li.now{color:var(--ink);font-weight:600}
.log li.now .i{color:var(--ink)}
.orbit{image-rendering:pixelated}

.legend{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}

  .pw{--k:.7}
  .duo{justify-content:center}
}

/* ---------- avatars ---------- */
const live = [], skies = [];
function agentEl(id, size, mode = "idle", sky = true) {
  const tile = document.createElement("span");
  tile.className = "tile";
  tile.style.width = tile.style.height = size + "px";
  if (sky) { const c = document.createElement("canvas"); c.className = "sky"; c.dataset.c = AGENTS[id].color; tile.append(c); skies.push(c); }
  const cv = document.createElement("canvas");
  cv.className = "av";
  const dpr = Math.min(2, devicePixelRatio || 1), inner = Math.round(size * .86);
  cv.width = cv.height = Math.round(inner * dpr);
  cv.style.width = cv.style.height = inner + "px";
  cv.setAttribute("role", "img");
  cv.setAttribute("aria-label", `${AGENTS[id].name}, agente`);
  tile.append(cv);
  live.push({ cv, a: AGENTS[id], seed: id.length + Math.random() * 5, mode, size });
  return tile;
}
const av = (id, size, mode, sky = true) => `<span class="avs" data-a="${id}" data-s="${size}" data-m="${mode || "idle"}" data-k="${sky ? 1 : 0}"></span>`;
const pp = (name, size) => `<span class="pp" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px">${esc(name[0])}</span>`;
function hydrate(root) {
  for (const el of $$(".avs", root)) el.replaceWith(agentEl(el.dataset.a, +el.dataset.s, el.dataset.m, el.dataset.k === "1"));
  for (const cv of $$("canvas.fuse", root)) fuses.push(cv);
  for (const cv of $$("canvas.orbit", root)) orbits.push(cv);
  drawSkies();
}

/* ---------- dither ---------- */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const rgb = (h) => { const n = parseInt(h.slice(1, 7), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toHex = (c) => {
  if (c.startsWith("#")) return c.length === 4 ? "#" + [...c.slice(1)].map((x) => x + x).join("") : c.slice(0, 7);
  const m = c.match(/\d+(\.\d+)?/g); if (!m) return "#808080";
  return "#" + m.slice(0, 3).map((v) => (+v | 0).toString(16).padStart(2, "0")).join("");
};
// The agent's pixel sky in its tile: soft tones from the surface into the color's light end.
function drawSkies() {
  const dark = document.documentElement.dataset.theme === "dark";
  for (let i = skies.length - 1; i >= 0; i--) {
    const cv = skies[i];
    if (!cv.isConnected) { skies.splice(i, 1); continue; }
    const [top, bot] = AGENT_GRADIENTS[cv.dataset.c];
    const base = dark ? mixHex(bot, "#0f0f0e", .55) : mixHex(top, "#ffffff", .62);
    const pal = [base, mixHex(base, top, .35), mixHex(base, top, .6), dark ? mixHex(top, bot, .5) : mixHex(top, "#ffffff", .15)].map(rgb);
    const n = 12; cv.width = cv.height = n;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const f = Math.min(1, Math.max(0, (y / n) * .9 + Math.sin(x * .7) * .04));
      const s2 = f * (pal.length - 1), b = s2 | 0, idx = Math.min(pal.length - 1, s2 - b > BAYER[((y & 3) << 2) | (x & 3)] ? b + 1 : b);
      const o = (y * n + x) * 4, c = pal[idx];
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
}
// The fuse: what is left until the timeout, in the agent's tones, with a flickering edge.
const fuses = [];
function drawFuses(t) {
  for (let i = fuses.length - 1; i >= 0; i--) {
    const cv = fuses[i];
    if (!cv.isConnected) { fuses.splice(i, 1); continue; }
    const r = cv.getBoundingClientRect(); if (!r.width) continue;
    const w = Math.max(2, Math.ceil(r.width / 2)), h = 2;
    if (cv.width !== w) { cv.width = w; cv.height = h; }
    const [top, bot] = AGENT_GRADIENTS[cv.dataset.c || "teal"];
    const bg = toHex(cssVar("--raised"));
    const pal = [bg, mixHex(bg, top, .3), mixHex(bg, top, .6), mixHex(top, bot, .5), bot].map(rgb);
    const rem = +cv.dataset.rem;
    const ctx = cv.getContext("2d"), img = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const u = x / w; let f;
      if (u > rem) f = (Math.floor(u * 140) % 3 === 0) ? .12 : 0;
      else { const d = rem - u, edge = Math.exp(-(d * d) / .0006) * (.75 + .25 * Math.sin(t * 9 + u * 40)); f = Math.min(1, .38 + .1 * Math.sin(t * 1.4 - u * 18) + edge); }
      const s2 = f * (pal.length - 1), b = s2 | 0, idx = Math.min(pal.length - 1, s2 - b > BAYER[((y & 3) << 2) | (x & 3)] ? b + 1 : b);
      const o = (y * w + x) * 4, c = pal[idx];
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
}
// The working indicator: a 3×3 pixel orbit (Carregando.html, option A).
const orbits = [];
const RING = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
function drawOrbits(t) {
  for (let i = orbits.length - 1; i >= 0; i--) {
    const cv = orbits[i];
    if (!cv.isConnected) { orbits.splice(i, 1); continue; }
    if (cv.width !== 3) { cv.width = cv.height = 3; }
    const ctx = cv.getContext("2d");
    const [top, bot] = AGENT_GRADIENTS[cv.dataset.c || "teal"];
    ctx.clearRect(0, 0, 3, 3);
    const k = Math.floor(t * 8) % 8;
    for (let j = 0; j < 8; j++) {
      const age = (k - j + 8) % 8;
      if (age > 3) continue;
      ctx.globalAlpha = [1, .55, .3, .15][age];
      ctx.fillStyle = age === 0 ? bot : top;
      ctx.fillRect(RING[j][0], RING[j][1], 1, 1);
    }
    ctx.globalAlpha = 1;
  }
}
const orbit = (c = "teal", size = 15) => `<canvas class="orbit" data-c="${c}" style="width:${size}px;height:${size}px" aria-hidden="true"></canvas>`;

function frame(t) {
  t /= 1000;
  for (let i = live.length - 1; i >= 0; i--) {
    const it = live[i];
    if (!it.cv.isConnected) { live.splice(i, 1); continue; }
    const ctx = it.cv.getContext("2d"), s = it.cv.width;
    ctx.clearRect(0, 0, s, s);
    const inner = s * .9;
    let pose;
    if (it.mode === "done") pose = { expression: "happy", turn: [0, 0], squash: Math.sin(t * 2 + it.seed) * .3 };
    else if (it.mode === "sleep") pose = { expression: "closed", squash: Math.sin(t * 1.2 + it.seed) * .3, turn: [0, .25] };
    else if (it.mode === "wait") { pose = { ...idlePose(t, it.seed, { every: 99, expressions: [] }) }; const g = Math.sin(t * .35 + it.seed * 2); pose.turn = [g > .85 ? .45 : g < -.9 ? -.4 : .05, -.32]; pose.look = [0, -.12]; }
    else { pose = idlePose(t, it.seed, { every: 15, active: it.mode === "run", expressions: ["happy", "wink"] }); if (it.mode === "run") { pose.writing = true; pose.expression = undefined; } }
    drawAgent(ctx, (s - inner) / 2, s - inner, inner, { color: it.a.color, eyes: it.a.eyes, cells: it.size <= 32 ? 12 : undefined, pose });
  }
  drawFuses(t);
  drawOrbits(t);
  requestAnimationFrame(frame);
}

/* ---------- render ---------- */
const SCREENS = { agente: scrAgente, computador: scrComputador, pedido: scrPedido, avisos: scrAvisos, "ao-vivo": scrAoVivo, assistindo: scrAssistindo };
const LEGEND = `<div class="legend">
  <div><b>Quem recebe o pedido</b>Quem pediu a tarefa e o responsável pelo agente. Quem abrir primeiro ajuda; o outro vê quem está ajudando.</div>
  <div><b>O prazo</b>10 min para alguém abrir. Com uma pessoa no controle, sem prazo; se ela sair, o agente espera 2 min. Depois, o agente lê a página de novo.</div>
  <div><b>Onde o texto vai</b>No campo marcado na página (clique nele). O campo do app esconde a senha e aceita as senhas salvas.</div>
</div>`;
function render() {
  $$("#screens button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.s === S.s));
  $$("#theme button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === document.documentElement.dataset.theme));
  const st = $("#stage");
  st.innerHTML = SCREENS[S.s]() + LEGEND;
  hydrate(st);
  setHash();
}

/* ---------- interaction ---------- */
$("#screens").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; S.s = b.dataset.s; render(); scrollTo({ top: 0 }); });
$("#theme").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; document.documentElement.dataset.theme = b.dataset.t; render(); });
const SEGS = { avail: "avail", mstate: "mstate", req: "req", lstate: "live" };
$("#stage").addEventListener("click", (e) => {
  const t = e.target;
  const sb = t.closest(".sub .seg button");
  if (sb) { const key = SEGS[sb.parentElement.id]; S[key] = sb.dataset.v; if (key === "live") { S.sheet = false; S.done = false; } render(); return; }
  const go = t.closest("[data-go]");
  if (go) {
    if (go.dataset.take !== undefined) S.live = "control";
    if (go.dataset.watch) S.live = "watch";
    if (go.dataset.after === "done") S.req = "done";
    if (go.dataset.go === "ao-vivo" && !go.dataset.watch && go.dataset.take === undefined) { S.live = "control"; S.done = false; S.sheet = false; }
    S.s = go.dataset.go; render(); scrollTo({ top: 0 }); return;
  }
  const sw = t.closest("#bsw");
  if (sw && sw.getAttribute("aria-disabled") !== "true") { S.on = !S.on; render(); return; }
  const allow = t.closest("[data-allow]"); if (allow) { S.allow = allow.dataset.allow; render(); return; }
  const rm = t.closest("[data-rm]"); if (rm) { S.sites = S.sites.filter((d) => d !== rm.dataset.rm); render(); return; }
  const cp = t.closest("[data-copy]"); if (cp) { cp.innerHTML = `${I.check}Copiado`; return; }
  const stop = t.closest("[data-stop]"); if (stop) { S.confirming = stop.dataset.stop; render(); return; }
  if (t.closest("[data-cancel]")) { S.confirming = null; render(); return; }
  const yes = t.closest("[data-yes]"); if (yes) { S.stopped.add(yes.dataset.yes); S.confirming = null; render(); return; }
  // live view
  const field = t.closest("[data-field]"); if (field && S.live === "control") { S.focus = field.dataset.field; render(); return; }
  if (t.closest("[data-sec]")) { S.secure = !S.secure; render(); return; }
  if (t.closest("[data-send]")) { sendTyped($("#wtype")); return; }
  const k = t.closest("[data-k]");
  if (k) {
    if (k.dataset.k === "Tab") S.focus = S.focus === "email" ? "pass" : "email";
    if (k.dataset.k === "Back") { if (S.focus === "pass") S.pass = S.pass.slice(0, -1); else S.email = S.email.slice(0, -1); }
    if (k.dataset.k === "Enter") S.done = true;
    render(); return;
  }
  if (t.closest("[data-done]")) { S.done = true; render(); return; }
  if (t.closest("[data-fail]")) { S.sheet = true; render(); return; }
  if (t.closest("[data-sheetx]")) { S.sheet = false; render(); return; }
  const rs = t.closest("[data-reason]"); if (rs) { S.pick = S.pick === rs.dataset.reason ? null : rs.dataset.reason; render(); return; }
  if (t.closest("[data-sendfail]")) { S.reason = $("#why")?.value || ""; S.sheet = false; S.req = "failed"; S.s = "pedido"; render(); return; }
  if (t.closest("[data-reset]")) { Object.assign(S, { live: "control", focus: "pass", pass: "", email: "teste@loja.exemplo", sheet: false, done: false, pick: null, reason: "" }); render(); return; }
  // watching
  if (t.closest("[data-wstop]")) { S.watchConfirm = true; render(); return; }
  if (t.closest("[data-wcancel]")) { S.watchConfirm = false; render(); return; }
  if (t.closest("[data-wyes]")) { S.watchConfirm = false; S.watchStopped = true; render(); return; }
});
function sendTyped(inp) {
  if (!inp || !inp.value) return;
  if (S.focus === "pass") S.pass += inp.value; else if (S.focus === "email") S.email = inp.value;
  inp.value = ""; render();
  const again = $(inp.id ? "#" + inp.id : "#wtype"); again?.focus();
}
$("#stage").addEventListener("keydown", (e) => {
  if (e.target.id === "addsite" && e.key === "Enter" && e.target.value.trim()) { S.sites.push(e.target.value.trim().replace(/^https?:\/\//, "")); render(); $("#addsite")?.focus(); }
  if ((e.target.id === "wtype" || e.target.id === "ptype") && e.key === "Enter") { e.preventDefault(); sendTyped(e.target); }
});
render();
</script>
