<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Barra lateral</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agentes/tokens.css">
<link rel="stylesheet" href="ds/agentes/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Navegação do workspace" style="box-sizing: border-box; width: 272px; height: 100%; min-height: 100%; display: flex; flex-direction: column; gap: 20px; padding: 16px 12px; background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px; overflow-y: auto">
  <div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
    <svg viewBox="0 0 32 32" aria-hidden="true" style="width: 28px; height: 28px; flex: none"><path style="fill: var(--agent)" d="M10 2h12a8 8 0 0 1 8 8v12a8 8 0 0 1-8 8H3.5A1.5 1.5 0 0 1 2 28.5V10a8 8 0 0 1 8-8z"/><path style="fill: var(--on-agent)" d="M11.2 12.5a1.3 1.3 0 0 1 2.6 0v5a1.3 1.3 0 0 1-2.6 0zM18.2 12.5a1.3 1.3 0 0 1 2.6 0v5a1.3 1.3 0 0 1-2.6 0z"/></svg>
    <div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
      <span style="font-weight: 700; font-size: 15px; line-height: 18px">Acme</span>
      <span style="font-size: 12px; line-height: 16px; color: var(--ink-muted)">7 membros · 4 agentes</span>
    </div>
    <button class="ac-btn ac-btn--ghost ac-btn--icon" type="button" aria-label="Buscar no workspace" style="width: 32px; height: 32px">
      <svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.3"></circle><path d="m12.8 12.8 4.2 4.2"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{nav}}" as="item" hint-placeholder-count="3">
      <a href="{{item.href}}" style="{{item.style}}">
        <sc-if value="{{item.isApproval}}" hint-placeholder-val="{{false}}"><svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"></circle><path d="M10 6v4l2.6 1.8"></path></svg></sc-if>
        <sc-if value="{{item.isIssues}}" hint-placeholder-val="{{false}}"><svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3h6a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4H3V7a4 4 0 0 1 4-4z"></path><path d="M7 8h6M7 12h4"></path></svg></sc-if>
        <sc-if value="{{item.isDrive}}" hint-placeholder-val="{{false}}"><svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H8l2 2h4.5A2.5 2.5 0 0 1 17 8.5v5a2.5 2.5 0 0 1-2.5 2.5H3z"></path></svg></sc-if>
        <sc-if value="{{item.isMembers}}" hint-placeholder-val="{{false}}"><svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="7" r="2.8"></circle><path d="M3 16c.6-2.6 2.5-4 5-4s4.4 1.4 5 4M13.5 4.5a2.6 2.6 0 0 1 0 5M15 12.3c1.1.6 1.8 1.9 2 3.7"></path></svg></sc-if>
        <span style="flex: 1">{{item.label}}</span>
        <sc-if value="{{item.count}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; display: inline-grid; place-items: center; border-radius: 999px; background: var(--attention-soft); color: var(--attention); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums">{{item.count}}</span></sc-if>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <span style="padding: 0 8px 4px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-muted)">Canais</span>
    <sc-for list="{{channels}}" as="item" hint-placeholder-count="3">
      <a href="{{item.href}}" style="{{item.style}}">
        <svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true" style="color: var(--ink-muted)"><path d="M8.2 3 6.6 17M13.4 3l-1.6 14M3.5 7.5h13M3 12.5h13"></path></svg>
        <span style="flex: 1">{{item.label}}</span>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <span style="padding: 0 8px 4px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-muted)">Agentes</span>
    <sc-for list="{{agents}}" as="item" hint-placeholder-count="4">
      <a href="{{item.href}}" style="{{item.style}}">
        <span class="{{item.avatarClass}}" aria-hidden="true">{{item.initial}}</span>
        <span style="flex: 1">{{item.label}}</span>
        <span style="font-size: 12px; color: var(--ink-muted)">{{item.role}}</span>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <span style="padding: 0 8px 4px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-muted)">Mensagens diretas</span>
    <sc-for list="{{people}}" as="item" hint-placeholder-count="2">
      <a href="#" style="{{item.style}}">
        <span class="ac-avatar ac-avatar--sm" aria-hidden="true">{{item.initial}}</span>
        <span style="flex: 1">{{item.label}}</span>
      </a>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="NovoAgente.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; border-radius: 6px; border-bottom-left-radius: 2px; border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); font-size: 14px; font-weight: 600; text-decoration: none">
      <svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"></path></svg>
      Criar agente
    </a>
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px">
      <span class="ac-avatar ac-avatar--sm" aria-hidden="true">W</span>
      <span style="flex: 1; font-size: 14px; font-weight: 600">Walter</span>
      <span style="font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums">US$ 18,40 este mês</span>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["eng","aprovacoes","ada","novo","membros","none"],"default":"eng"},"$preview":{"width":272,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'eng';
    const base = 'display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 4px 8px; border-radius: 6px; text-decoration: none; font-size: 15px; ';
    const style = (on, unread) => base + (on
      ? 'background: var(--surface-raised); color: var(--ink); font-weight: 600;'
      : 'color: var(--ink); font-weight: ' + (unread ? '600' : '400') + ';');
    const nav = [
      { label: 'Aprovações', href: 'Aprovacoes.dc.html', isApproval: true, count: 2, style: style(active === 'aprovacoes') },
      { label: 'Issues', href: '#', isIssues: true, count: 0, style: style(false) },
      { label: 'Drive', href: '#', isDrive: true, count: 0, style: style(false) },
      { label: 'Membros', href: 'Membros.dc.html', isMembers: true, count: 0, style: style(active === 'membros') }
    ];
    const channels = [
      { label: 'geral', href: '#', style: style(false) },
      { label: 'eng', href: 'Main.dc.html', style: style(active === 'eng') },
      { label: 'produto', href: '#', style: style(false, true) }
    ];
    const agentAvatar = 'ac-avatar ac-avatar--sm ac-avatar--agent';
    const agents = [
      { label: 'Ada', role: 'Dev', initial: 'A', href: 'Agente.dc.html', avatarClass: agentAvatar + ' ac-avatar--running', style: style(active === 'ada') },
      { label: 'Atlas', role: 'Ops', initial: 'At', href: '#', avatarClass: agentAvatar, style: style(false) },
      { label: 'Theo', role: 'PM', initial: 'T', href: '#', avatarClass: agentAvatar, style: style(false) },
      { label: 'Lia', role: 'Pesquisa', initial: 'L', href: '#', avatarClass: agentAvatar, style: style(false) }
    ];
    const people = [
      { label: 'Marina', initial: 'M', style: style(false) },
      { label: 'João', initial: 'J', style: style(false, true) }
    ];
    return { nav, channels, agents, people, false: false };
  }
}
</script>
</body>
</html>
