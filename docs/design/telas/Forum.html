<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fórum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: Fórum, on the approved design system (Proposta 2) and the line of Rotinas.html / Issues.html.
  List: "Discutindo agora" (live topics with a pixel round track: rounds x agents, finished turns are
  dithered columns in the agent's tones, the current turn is the agent's sprite, future turns are single
  pixels), "Precisa de você" (one-line reason + action) and aligned rows. Topic: header, "A mesa" (speaking
  order, who is writing, who is next, a bigger clickable track), posts by round with stance chips and reply
  references, a streaming live turn, "Onde cada um está" (stance lanes + convergence in pixels), the
  composer, "Concluir". Synthesis as a structured card with issues to approve. "Novo tópico" from templates.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

/* ---------- design system bits ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.fc:focus-visible,.seg button:focus-visible,.tr:focus-visible,.mi:focus-visible,.sw:focus-visible,.tpl:focus-visible,.lv:focus-visible,.ck:focus-visible,.qref:focus-visible,.rl:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b:disabled{opacity:.5;cursor:default;transform:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.ib:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button .n{font-weight:500;color:var(--faint);font-size:12px}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.st-live{color:var(--ink2)}
.chip.st-done svg.i{color:var(--ok)}
.chip.st-stalled{color:var(--ink2)}
.chip.st-stalled svg.i{color:var(--warn)}
.chip.st-canceled{color:var(--faint)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sw{position:relative;width:36px;height:22px;border-radius:999px;border:0;padding:0;cursor:pointer;flex:none;background:color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);transition:background .2s var(--out)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 2px 6px -2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:var(--bg)}

/* Agents: the engine's body (canvas). */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .46);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
canvas.sweep{position:absolute;left:0;right:0;bottom:0;width:100%;height:3px;image-rendering:pixelated;pointer-events:none}
canvas.trk,canvas.lane,canvas.conv{display:block;image-rendering:pixelated}
.cursor{display:inline-block;width:7px;height:14px;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--agent);animation:blinkc 1s steps(2) infinite}
@keyframes blinkc{50%{opacity:0}}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 49px)}
.app.with-panel{grid-template-columns:64px minmax(0,1fr) 380px}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}
.main{min-width:0;padding:26px 28px 120px;max-width:1120px;width:100%;margin:0 auto}
.panel{display:none;padding:12px 12px 12px 0;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;overscroll-behavior:contain}
.with-panel .panel{display:block}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:none;animation:fi .2s var(--out)}

.hd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.hd h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.hd p{color:var(--muted);margin-top:6px;max-width:60ch}
.hd .guard{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--faint)}
.hd .acts{display:flex;gap:8px;align-items:center}
.gh{display:flex;align-items:center;gap:8px;margin:0 4px 8px;min-height:24px}
.gh h2{font-size:13px;font-weight:650;color:var(--ink2)}
.gh .n{font-size:12.5px;color:var(--faint)}
.gh .grow{flex:1}
.group{margin-bottom:22px;animation:fi .3s var(--out) both}
.list{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}

/* ---------- live band ---------- */
.lvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lv{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px 14px 16px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);cursor:pointer;overflow:hidden;border:0;text-align:left;font:inherit;color:inherit;transition:transform .22s var(--spring),box-shadow .2s var(--out)}
.lv:hover{transform:translateY(-2px);box-shadow:var(--e2),var(--top)}
.lv-h{display:flex;gap:12px;align-items:flex-start;min-width:0}
.lv-h .t{min-width:0;flex:1}
.lv-h small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-h small b{color:var(--ink2);font-weight:600}
.lv-h .ti{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.35;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lv-f{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);min-width:0}
.lv-f .grow{flex:1}
.lv-f>span{white-space:nowrap}
.lv-f .nx{flex:0 1 auto}
.lv-f .nx{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rw{font-size:12.5px;color:var(--ink2);font-weight:600}

/* ---------- needs you ---------- */
.nd{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 12px 12px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.nd:first-child{border-top:0}
.nd:hover{background:color-mix(in srgb,var(--sunken) 45%,transparent)}
.nd .ic{width:32px;height:32px;border-radius:10px;background:var(--sunken);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.nd .ic.warn svg{color:var(--warn)}
.nd .t{min-width:0}
.nd b{display:block;font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;min-width:0}
.nd small span{overflow:hidden;text-overflow:ellipsis}
.nd .acts{display:flex;gap:6px}

/* ---------- toolbar ---------- */
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tb .grow{flex:1}
.search{flex:0 1 260px;min-width:0;display:flex;align-items:center;gap:9px;height:36px;padding:0 10px 0 12px;border-radius:12px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);transition:box-shadow .2s var(--out)}
.search:focus-within{box-shadow:var(--e2),0 0 0 1.5px var(--ink)}
.search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--faint)}
.fc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none;transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.fc:hover{box-shadow:var(--e2),var(--top)}
.fc:active{transform:scale(.96)}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.fc .stack{display:inline-flex}
.fc .stack>*{margin-left:-4px}
.fc .stack>*:first-child{margin-left:0}

/* ---------- topic rows (fixed columns) ---------- */
.tr{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 100px 128px 124px 168px;align-items:center;gap:14px;padding:13px 14px 13px 16px;border-top:1px solid var(--line);cursor:pointer;outline:none;transition:background .12s}
.tr:first-child{border-top:0}
.tr:hover{background:color-mix(in srgb,var(--sunken) 45%,transparent)}
.tr.new{animation:landed .8s var(--spring) both}
@keyframes landed{0%{opacity:0;transform:translateY(8px) scale(.98)}100%{opacity:1;transform:none}}
.tr .ti{min-width:0}
.tr .ti b{display:block;font-weight:600;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ti small{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;min-width:0}
.tr .ti small span{overflow:hidden;text-overflow:ellipsis}
.tr .ti small svg.i{width:13px;height:13px;color:var(--faint)}
.tr .ti small.dec{color:var(--ink2)}
.tr .ti small.dec svg.i{color:var(--ok)}
.tr[data-st="canceled"] .ti b{color:var(--muted)}
.who{display:flex;align-items:center}
.who>*{margin-left:-5px;box-shadow:0 0 0 2px var(--raised);border-radius:32% 32% 32% 12%}
.who>.pp{border-radius:50%}
.who>*:first-child{margin-left:0}
.c-trk{overflow:hidden;min-width:0}
.ori{min-width:0;font-size:12.5px}
.ori span{display:flex;align-items:center;gap:6px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ori span svg.i{width:13px;height:13px;color:var(--faint)}
.ori small{display:block;color:var(--faint);font-size:12px;white-space:nowrap}
.nores{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;text-align:center;color:var(--muted)}

/* ---------- topic page ---------- */
.back{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 6px;margin:0 0 10px -6px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.back:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.th{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.th .t{flex:1;min-width:0}
.th h1{font-family:var(--display);font-weight:300;font-size:clamp(28px,3.6vw,38px);letter-spacing:-.03em;line-height:1.08}
.th .goal{color:var(--ink2);margin-top:8px;max-width:64ch;font-size:15px}
.th .goal b{font-weight:600;color:var(--faint);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.meta .lnk{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted);font-size:12.5px}
.meta .lnk:hover{color:var(--ink)}
.meta .lnk b{color:var(--ink2);font-weight:600;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.th .acts{display:flex;gap:6px;align-items:center;flex:none}
.only-narrow{display:none}

.mesa{position:relative;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:14px 16px 12px;margin-bottom:24px;overflow:hidden}
.mesa-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mesa-h h2{font-size:13px;font-weight:650;color:var(--ink2)}
.mesa-h .sub{font-size:12.5px;color:var(--faint)}
.mesa-h .grow{flex:1}
.seats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.seats::-webkit-scrollbar{display:none}
.seat{position:relative;display:flex;align-items:center;gap:10px;min-width:176px;flex:1 1 0;padding:10px 12px 10px 10px;border-radius:14px;background:var(--sunken)}
.seat .no{position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:5px;background:var(--raised);box-shadow:var(--e1);font-size:10.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;z-index:1}
.seat .av0{margin-left:10px}
.seat .t{min-width:0}
.seat b{display:block;font-size:13.5px;font-weight:600}
.seat small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat em{display:flex;align-items:center;gap:4px;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
.seat.cur{background:var(--raised);box-shadow:var(--e2),var(--top)}
.seat.cur em{color:var(--ink);font-weight:600}
.seat .nxt{height:18px;padding:0 6px;font-size:10.5px}
.ppl{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-top:10px;padding:0 2px;font-size:12.5px;color:var(--muted)}
.ppl span{display:inline-flex;align-items:center;gap:6px}
.ppl b{color:var(--ink2);font-weight:600}
.trkwrap{position:relative;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.trkwrap .trk{width:100%;height:auto;cursor:pointer}
.rlabs{position:relative;height:22px;margin-top:4px}
.rl{position:absolute;top:0;height:22px;border:0;border-radius:7px;background:transparent;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer;white-space:nowrap;padding:0;overflow:hidden;text-overflow:ellipsis}
.rl:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.rl.cur{color:var(--ink)}

.rdiv{display:flex;align-items:center;gap:10px;margin:22px 0 10px;scroll-margin-top:18px}
.rdiv span{font-size:12px;font-weight:650;color:var(--ink2);white-space:nowrap}
.rdiv i{flex:1;height:1px;background:var(--line2)}
.rdiv small{font-size:12px;color:var(--faint);white-space:nowrap}
.post{position:relative;display:flex;gap:12px;padding:10px 12px;margin:0 -12px;border-radius:14px;scroll-margin-top:24px;transition:background .3s}
.post:hover{background:rgba(127,127,127,.04)}
.post.flash{animation:flash 1.4s var(--out)}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--ink) 9%,transparent)}100%{background:transparent}}
.post .pc{flex:1;min-width:0}
.phd{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.phd b{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.phd .role{font-size:12.5px;color:var(--faint)}
.phd .tm{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.phd .tm.live{color:var(--ink2);font-weight:600}
.phd .grow{flex:1}
.ptx{font-size:15px;line-height:1.62;margin-top:3px;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.ptx.think{color:var(--muted);font-size:14px}
.qref{display:flex;align-items:center;gap:6px;max-width:100%;margin-top:6px;padding:4px 10px 4px 6px;border:0;border-radius:9px;background:transparent;box-shadow:inset 2px 0 0 var(--line2);cursor:pointer;font-size:12.5px;color:var(--muted);text-align:left}
.qref:hover{background:rgba(127,127,127,.08);color:var(--ink)}
.qref svg.i{width:13px;height:13px;color:var(--faint)}
.qref b{font-weight:600;color:var(--ink2);white-space:nowrap}
.qref span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.post.person .ptx{margin-top:6px;padding:10px 14px;border-radius:4px 14px 14px 14px;background:var(--raised);box-shadow:var(--e1),var(--top)}
.note{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:600;color:var(--ink2)}
.bskip{display:flex;align-items:center;gap:8px;margin:6px 0;padding:6px 0;font-size:13px;color:var(--muted)}
.bskip b{font-weight:600;color:var(--ink2)}
.bskip .tm{margin-left:auto;font-size:12px;color:var(--faint)}
.note svg.i{width:13px;height:13px;color:var(--faint)}
.post .stop{font-size:12px;color:var(--faint);margin-top:4px}
.work{margin-top:10px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;max-width:520px}
.workh{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.workh:hover{background:rgba(127,127,127,.06)}
.workh b{color:var(--ink2);font-weight:600}
.chevw{transition:transform .25s var(--out)}
.work.open .chevw{transform:rotate(90deg)}
.wsteps{display:none;padding:0 0 6px}
.work.open .wsteps{display:block}
.wstep{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 14px;font-size:13px;color:var(--ink2);animation:fi .25s var(--out) both}
.wstep .t{margin-left:auto;font-size:12px;color:var(--faint)}
.tick{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);flex:none}
.tick svg.i{width:10px;height:10px;stroke-width:2.4}
.livep{background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden;margin:6px -12px 0;padding:12px 12px 16px}
.livep:hover{background:var(--raised)}
.stalled{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px;padding:12px 14px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line2)}
.stalled .t{flex:1 1 220px;min-width:0}
.stalled b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.stalled b svg.i{color:var(--warn)}
.stalled small{display:block;font-size:12.5px;color:var(--muted)}
.stalled .acts{display:flex;gap:6px;flex-wrap:wrap}
.closed{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;padding:12px 14px;border-radius:16px;background:var(--sunken);font-size:13.5px;color:var(--muted)}
.closed .t{flex:1 1 220px}

/* Composer: the design system's ("A caixa de mensagem como centro do app"). */
.cmpw{margin-top:26px}
.cmp{border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);transition:box-shadow .2s var(--out);position:relative}
.cmp:focus-within{box-shadow:var(--e3),var(--top)}
.cmp textarea{all:unset;display:block;width:100%;box-sizing:border-box;font-size:15px;line-height:1.5;color:var(--ink);padding:14px 16px 4px;min-height:24px;max-height:180px;overflow:auto;white-space:pre-wrap}
.cmp textarea::placeholder{color:var(--faint)}
.ctools{display:flex;align-items:center;gap:6px;padding:8px 10px 10px 12px}
.cpill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 6px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunken);color:var(--ink2);border:0;cursor:pointer;transition:background .15s}
.cpill:hover{background:rgba(127,127,127,.18)}
.cpill .x{display:inline-flex;margin-left:2px;color:var(--faint)}
.send{margin-left:auto;height:34px;padding:0 12px;border-radius:11px;border:0;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s var(--spring)}
.send.off{background:var(--sunken);color:var(--faint);width:34px;padding:0;justify-content:center;cursor:default}
.send.on{background:var(--ink);color:var(--bg)}
.chint{display:flex;align-items:center;gap:6px;margin:8px 4px 0;font-size:12.5px;color:var(--faint)}
.chint b{color:var(--ink2);font-weight:600}

/* ---------- side: where everyone stands ---------- */
.pin{border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:16px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.pin.in{animation:slidein .32s var(--spring) both}
.post>.agw,.post>.pp,.stalled>.agw{align-self:flex-start}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.pin .ph{display:flex;align-items:center;gap:8px}
.pin .ph h2{font-size:16px;font-weight:650;letter-spacing:-.01em;flex:1}
.ps{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ps h3{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.ps h3 .grow{flex:1}
.cv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--sunken)}
.cv b{display:block;font-size:14px;font-weight:600}
.cv small{display:block;font-size:12px;color:var(--muted)}
.ag{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;align-items:start}
.ag .t b{font-size:13.5px;font-weight:600}
.ag .t .role{font-size:12px;color:var(--faint);margin-left:4px}
.ag .pos{grid-column:2;font-size:13px;color:var(--ink2);line-height:1.45}
.ag .lane-row{grid-column:2;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint)}
.lanekey{font-size:11.5px;color:var(--faint);line-height:1.45}
.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px;align-items:center}
.facts dt{color:var(--faint)}
.facts dd{margin:0;color:var(--ink2);display:flex;align-items:center;gap:8px;min-width:0}

/* ---------- synthesis ---------- */
.syn{margin-top:26px;border-radius:22px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:18px;display:flex;flex-direction:column;gap:18px;scroll-margin-top:18px;animation:fi .4s var(--out) both}
.syn-h{display:flex;gap:12px;align-items:center}
.syn-h .t{flex:1;min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600}
.syn-h b{display:block;font-size:16px;font-weight:650;letter-spacing:-.01em}
.syn-h small{display:block;font-size:12.5px;color:var(--muted)}
.dec{padding:16px 18px;border-radius:16px;background:var(--sunken)}
.dec p{font-family:var(--display);font-weight:300;font-size:clamp(19px,2.2vw,23px);line-height:1.32;letter-spacing:-.015em;color:var(--ink);margin-top:6px}
.ss{display:flex;flex-direction:column;gap:10px}
.ss h3{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.ss h3 .grow{flex:1}
.ss h3 .cnt{text-transform:none;letter-spacing:0;font-weight:500}
.pcr{display:grid;grid-template-columns:132px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45}
.pcr:first-of-type{border-top:0;padding-top:0}
.pcr .w{display:flex;align-items:center;gap:8px;font-weight:600}
.pcr .w small{display:block;font-weight:500;font-size:12px;color:var(--faint)}
.pcr .pro,.pcr .con{display:flex;gap:8px;color:var(--ink2)}
.pcr .pro svg.i,.pcr .con svg.i{width:14px;height:14px;margin-top:2px;color:var(--faint)}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.ol li{display:flex;gap:9px;align-items:flex-start}
.ol .k{width:20px;height:20px;border-radius:7px;background:var(--sunken);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:700}
.ol .k svg.i{width:12px;height:12px}
.ol small{display:block;font-size:12px;color:var(--faint)}
.iss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.iss li{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:10px;font-size:13.5px}
.iss li:hover{background:rgba(127,127,127,.06)}
.iss .tx{flex:1;min-width:0}
.iss .tx small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--faint)}
.iss li.off .tx>span{color:var(--muted)}
.iss .made{font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.iss .made svg.i{width:13px;height:13px;color:var(--ok)}
.ck{width:20px;height:20px;border-radius:7px;border:0;padding:0;flex:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:transparent;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);transition:background .15s,transform .2s var(--spring)}
.ck svg{width:13px;height:13px;stroke-width:2.6}
.ck:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ck:active{transform:scale(.9)}
.ck[aria-checked="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.appr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--sunken)}
.appr .t{flex:1 1 200px;font-size:13px;min-width:0}
.appr .t b{display:flex;align-items:center;gap:6px;font-weight:600}
.appr .t small{color:var(--muted)}
.went{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
.art{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:box-shadow .2s,transform .2s var(--spring);cursor:pointer;border:0;font:inherit;color:inherit;text-align:left;width:100%;min-width:0}
.art:hover{box-shadow:var(--e2),var(--top);transform:translateY(-1px)}
.art .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.art .tt b{font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .tt small{font-size:12.5px;color:var(--faint)}
.thumb{width:38px;height:48px;border-radius:8px;background:linear-gradient(180deg,var(--raised),var(--sunken));box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 7px;flex:none}
.thumb span{height:3px;border-radius:2px;background:var(--line2)}
.wcol{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:12px;background:var(--sunken);font-size:13px;color:var(--ink2);border:0;cursor:pointer;text-align:left;width:100%}
.wrow:hover{background:color-mix(in srgb,var(--sunken) 70%,var(--ink) 6%)}
.wrow .grow{flex:1;min-width:0}
.wrow svg.i{color:var(--muted)}
.wrow small{color:var(--faint);font-size:12px}

/* ---------- new round, versions, comments ---------- */
.pact{margin-left:auto;height:28px;padding:0 10px;font-size:12.5px;opacity:0;transition:opacity .15s}
.post:hover .pact,.pact:focus-visible{opacity:1}
@media (hover:none){.pact{opacity:1}}
.ctog{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink2);min-width:0;margin-left:4px}
.ctog .sw{flex:none}
.ctools{flex-wrap:wrap}
.chg{padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;flex-direction:column;gap:8px}
.chg .ol .k.same{color:var(--faint)}
.chg .ol .k.chd svg.i,.chg .ol .k.add svg.i{color:var(--ink)}
.v1{padding:12px 14px;border-radius:14px;background:var(--sunken);font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.v1 .eyebrow{display:flex;gap:8px}
.vlink{border:0;background:none;padding:0;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.vlink:hover{color:var(--ink)}
.rpick{display:flex;flex-direction:column;gap:4px}
.rpick label{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;font-size:13.5px;cursor:pointer}
.rpick label:hover{background:rgba(127,127,127,.06)}
.rpick small{color:var(--faint);font-size:12px;margin-left:auto}
.qbox{padding:10px 14px;border-radius:4px 14px 14px 14px;background:var(--sunken);font-size:14px;color:var(--ink2)}

/* ---------- seated people, plan synthesis, issue view ---------- */
.seatp .cmp{margin-top:8px}
.seatp .cmp textarea{min-height:48px}
.seatrow{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:2px}
.seatrow .ctog{margin-left:0}
.order li.pp-seat .t small{color:var(--muted)}
.fmt-h{font-size:12px;color:var(--faint);margin-top:2px}
.oline{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--sunken);font-size:13px;color:var(--ink2)}
.oline svg.i{color:var(--muted)}
.forreq{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line2);font-size:14px;color:var(--ink2);line-height:1.5}
.forreq b{font-weight:600}
.inout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.stp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stp li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.stp li:first-child{border-top:0}
.stp .k{width:24px;height:24px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stp .tx b{font-weight:600;color:var(--ink)}
.stp .tx small{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--faint)}
.stp .sz{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}
.igrp{font-size:12px;font-weight:600;color:var(--muted);padding:8px 6px 2px;display:flex;gap:6px;align-items:center}
.igrp .k{width:18px;height:18px;border-radius:6px;background:var(--sunken);font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.iv{max-width:780px}
.ivh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint);flex-wrap:wrap}
.ivh .num{font-variant-numeric:tabular-nums}
.ivt{font-family:var(--display);font-weight:300;font-size:clamp(26px,3.4vw,34px);letter-spacing:-.03em;line-height:1.1;margin:8px 0 14px}
.iprops{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;align-items:center;font-size:13.5px;margin:0 0 16px}
.iprops dt{color:var(--faint);font-size:12.5px}
.iprops dd{margin:0;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.idesc{font-size:14.5px;line-height:1.6;color:var(--ink2);margin-bottom:20px}
.isec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.isec h3{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600}
.act{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.act>li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px}
.act .ev{color:var(--muted)}
.act .ev b{color:var(--ink2);font-weight:600}
.act .when{font-size:12px;color:var(--faint);margin-left:6px}
.act .bubble{margin-top:4px;padding:10px 14px;border-radius:4px 14px 14px 14px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink2);line-height:1.55;font-size:14px}
.act .evdot{width:28px;height:28px;border-radius:9px;background:var(--sunken);color:var(--faint);display:flex;align-items:center;justify-content:center}
.act .evdot svg.i{width:14px;height:14px}
.subl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.subl li{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:10px;font-size:13.5px}
.subl li:hover{background:rgba(127,127,127,.06)}
.subl .num{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;width:38px}
.subl .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subl .who2{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
@media (max-width:720px){.grid2.fit{grid-template-columns:minmax(0,1fr)}.dlg .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.dlg .seg button{padding:0 10px}.inout{grid-template-columns:minmax(0,1fr)}.iprops{grid-template-columns:96px minmax(0,1fr)}}

/* ---------- channel view (agent suggests a topic) ---------- */
.chh{display:flex;align-items:center;gap:10px;padding:0 0 14px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.chh .chn{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:650;letter-spacing:-.01em}
.chh .sub{font-size:13px;color:var(--faint)}
.msgs{max-width:780px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:14px;padding:10px 12px;margin:0 -12px;border-radius:14px}
.msg:hover{background:rgba(127,127,127,.04)}
.msg>.agw,.msg>.pp{align-self:flex-start}
.msg .mc{flex:1;min-width:0}
.mh{display:flex;align-items:baseline;gap:8px}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mt{font-size:12px;color:var(--faint)}
.mx{font-size:15px;line-height:1.62;margin-top:2px;color:var(--ink2)}
.sugc{margin-top:10px;max-width:560px;border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:14px;display:flex;flex-direction:column;gap:10px;animation:fi .3s var(--out) both}
.sg-h{display:flex;align-items:center;gap:10px}
.sg-h .ic{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.sg-h b{font-size:14px;font-weight:650}
.sg-h .sub{font-size:12.5px;color:var(--faint)}
.sg-h .grow{flex:1}
.sg-t{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.3}
.sg-g{font-size:13.5px;color:var(--muted)}
.sg-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sg-m .lb{font-size:12px;color:var(--faint);font-weight:600;margin-right:4px}

function stopTurn(tp) {

  if (L.synth || !isWriting(L)) { tp.live = { agent: who, round: L.round, phase: "stalled", resume: L }; }
  else { nextTurn(tp); const nx = tp.live; tp.live = { agent: nx.synth ? tp.owner : nx.agent, round: nx.round, phase: "stalled", resume: nx }; }
  tp.status = "stalled"; tp.stall = { kind: "stop", text: `Você parou a vez ${ofA(who)}. Ninguém fala até alguém retomar.` };

}
function resume(tp) {
  const r = tp.live?.resume;

  if (r) tp.live = { ...r, phase: "think", wait: r.idle ? Infinity : 1400, shown: 0 }; else nextTurn(tp);
  render();
}

function suggest(text) {
  const s = new Set(["theo"]);
  if (/fila|banco|deploy|api|worker|postgres|migra|servi/i.test(text)) s.add("ada");
  if (/segur|lgpd|sso|log|acesso|chave/i.test(text)) s.add("bruno");
  if (/preç|plano|onboard|pessoa|cliente|página/i.test(text)) s.add("lia");
  if (/métric|dado|churn|funil|uso/i.test(text)) s.add("nina");
  return s;
}

    const ad = t.closest("[data-add]"); if (ad && !ad.disabled) { const k = "a:" + ad.dataset.add, lastA = f.order.map((x) => x[0]).lastIndexOf("a"); f.order.splice(lastA + 1, 0, k); draw(); return; }
    const pp = t.closest("[data-pp]"); if (pp) { const x = pp.dataset.pp; if (f.people.has(x)) { f.people.delete(x); f.order = f.order.filter((k) => k !== "p:" + x); } else f.people.add(x); draw(); return; }
    const du = t.closest("[data-due]"); if (du) { f.due = du.dataset.due || null; draw(); return; }
    if (t.closest("[data-create]")) {
      f.agents = agentsIn();
      const tp = { id: "n" + uid++, title: f.title.trim(), status: "live", goal: f.goal.trim() || "Chegar a uma decisão com prós, contras e próximos passos.", owner: f.agents[0], agents: [...f.agents], people: [...f.people], rounds: f.rounds, round: 1, due: f.due, format: f.format,
        order: f.order.some((k) => k[0] === "p") ? [...f.order] : undefined,
        origin: pre?.origin ?? { type: "forum", text: "Walter abriu direto no fórum" }, requester: pre?.requester, by: ME, last: 0, posts: [], live: null, queue: [] };
      if (pre?.onCreate) { closeDialog(); pre.onCreate(tp); return; }
      startTurn(tp, { agent: tp.owner, round: 1, idle: true, work: W([["Lendo o objetivo e o contexto da organização", ""]], "", 0) });
      TOPICS.unshift(tp); S.fresh.add(tp.id); S.empty = false;
      closeDialog(); openTopic(tp.id);
      toast({ title: "Tópico aberto", sub: `${AGENTS[tp.owner].name} fala primeiro. Todo mundo da organização pode ler.` });
    }
  });
  draw();
  $("#ft", dlg).focus();
}

/* ---------- channel: an agent suggests a topic, a person opens it ---------- */
function openFromSuggestion(base) {
  const tp = base ?? { id: "n" + uid++, title: SUG.title, goal: SUG.goal, agents: [...SUG.agents], rounds: SUG.rounds, due: null };
  Object.assign(tp, { status: "live", owner: tp.agents[0], people: [ME, "marina"], round: 1, origin: { type: "suggest", agent: "theo", ch: "produto", text: "Sugerido pelo Theo em #produto, aberto por Walter" }, by: ME, last: 0, posts: [], live: null });
  tp.queue = tp.agents.map((a) => SUG_SCRIPT.find((q) => q.agent === a)).filter(Boolean).map((q) => ({ ...q }));
  nextTurn(tp);
  TOPICS.unshift(tp); S.fresh.add(tp.id);
  SUG.state = "opened"; SUG.tid = tp.id;
  render();
  toast({ title: "Fórum aberto", sub: `Fica no seu nome. ${AGENTS[tp.agents[0]].name} fala primeiro.`, action: { label: "Ver discussão", run: () => openTopic(tp.id) } });
}
function renderChat() {
  const msg = (who, at, text, extra = "") => `<div class="msg">${avHTML(who, 34)}<div class="mc"><div class="mh"><span class="mn">${esc(nameOf(who))}</span><span class="mt">${at}</span></div><div class="mx">${text}</div>${extra}</div></div>`;
  let card;
  if (SUG.state === "pending") card = `<div class="sugc" aria-label="Sugestão de fórum">
      <div class="sg-h"><span class="ic">${I.talk}</span><b>Vale um fórum?</b><span class="sub">Theo sugere</span><span class="grow"></span><button class="b bg sm" type="button" data-sg-edit>${I.edit}Editar</button></div>
      <div class="sg-t">${esc(SUG.title)}</div><p class="sg-g">${esc(SUG.goal)}</p>
      <div class="sg-m"><span class="lb">A mesa</span>${SUG.agents.map((a, i) => `<span class="sg-a"><span class="no">${i + 1}</span>${avHTML(A(a), 22)}${AGENTS[a].name}</span>`).join("")}<span class="sg-r">${I.talk}${SUG.rounds} rodadas</span></div>
      <div class="sg-f"><button class="b b1 sm" type="button" data-sg-open>${I.talk}Abrir fórum</button><button class="b bg sm" type="button" data-sg-no>Agora não</button></div>
    </div><p class="sg-note">${I.shield}Só uma pessoa pode abrir. Fica no seu nome.</p>`;
  else if (SUG.state === "opened") { const tp = T(SUG.tid); card = `<div class="sugc" aria-label="Fórum aberto">
      <div class="sg-h"><span class="ic">${I.talk}</span><span><b>Fórum aberto</b> <span class="sub">por ${PEOPLE[ME].name}, a partir desta thread</span></span></div>
      <div class="sg-t">${esc(tp.title)}</div>
      <div class="sg-f">${statusChip(tp)}<span class="sub" style="font-size:12.5px;color:var(--faint)">rodada ${tp.round} de ${tp.rounds}</span>${trackHTML(tp, "mid")}<span class="grow"></span><button class="b b2 sm" type="button" data-topic="${tp.id}">Ver discussão${I.chevr}</button></div>
    </div>`; }
  else card = `<p class="sg-note">${I.minus}Walter dispensou a sugestão. <button class="vlink" type="button" data-sg-undo>Desfazer</button></p>`;
  $("#main").innerHTML = `<div class="chh"><span class="chn">${I.hash}produto</span><span class="sub">· thread: senha no cadastro</span></div>
    <div class="msgs">
      ${msg(P("marina"), "10:02", "@Ada @Bruno dá para tirar a senha do cadastro e entrar só por um link no e-mail? Metade das desistências do onboarding é nesse passo.")}
      ${msg(A("ada"), "10:03", "Dá, e é pouco trabalho: o Better Auth já tem link mágico, com expiração e uso único. Eu tiraria a senha já nesta semana.")}
      ${msg(A("bruno"), "10:04", "Discordo de tirar já. Link por e-mail vira alvo de phishing, e quem perde o acesso ao e-mail perde a conta. Precisa de regra antes.")}
      ${msg(A("ada"), "10:05", "O risco é o mesmo da redefinição de senha, que já existe hoje. Não vejo o que muda.")}
      ${msg(A("theo"), "10:06", "Vocês dois têm bons pontos, e isso vai além de um sim ou não. Sugiro levar para o fórum, com a Lia olhando o lado de quem chega:", card)}
    </div>
    <div class="chcomp">Responder na thread…</div>`;
  hydrate($("#main"));
}

/* ---------- issue #142: refined by one agent, evaluated in the forum ---------- */
function openFromIssue(tp) {
  tp.planKey = "i142"; tp.issueRef = 142;
  // The script follows the table as set in the dialog; people seated get their turn where they sit.
  const ord = orderOf(tp), q = [];
  for (let r = 1; r <= tp.rounds; r++) for (const k of ord) {
    if (k[0] === "p") q.push({ person: k.slice(2), round: r });
    else { const sc = ISSUE_SCRIPT.find((x) => x.agent === k.slice(2) && x.round === r); if (sc) q.push({ ...sc, reply: null }); }
  }
  tp.queue = q;
  nextTurn(tp);
  TOPICS.unshift(tp); S.fresh.add(tp.id);
  ISSUE.state = "forum"; ISSUE.tid = tp.id;
  render();
  toast({ title: "Em avaliação no fórum", sub: `O resultado volta para a issue #${ISSUE.n}.`, action: { label: "Ver discussão", run: () => openTopic(tp.id) } });
}
function renderIssue() {
  const tp = ISSUE.tid ? T(ISSUE.tid) : null, plan = PLAN.i142;
  const forumCard = tp ? `<li><span class="evdot">${I.talk}</span><div><span class="ev"><b>Walter</b> levou ao fórum</span><span class="when">${tp.status === "done" ? "hoje" : "agora"}</span>
      <div class="sugc"><div class="sg-h"><span class="ic">${I.talk}</span><span><b>${ended(tp) ? "Avaliado no fórum" : "Em avaliação no fórum"}</b> <span class="sub">${tp.format === "plan" ? "sai um plano" : "sai uma decisão"}</span></span></div>
      <div class="sg-t">${esc(tp.title)}</div>
      <div class="sg-f">${statusChip(tp)}<span style="font-size:12.5px;color:var(--faint)">${ended(tp) ? `${tp.round} rodadas` : `rodada ${tp.round} de ${tp.rounds}`}</span>${trackHTML(tp, "mid")}<span class="grow"></span><button class="b b2 sm" type="button" data-topic="${tp.id}">Ver discussão${I.chevr}</button></div></div></div></li>` : "";
  const planC = ISSUE.subs.length ? `<li>${avHTML(A("theo"), 28)}<div><b style="font-weight:600">Theo</b><span class="when">agora</span><div class="bubble"><b style="font-weight:600">Plano do fórum.</b> Para a Marina: ${esc(plan.forReq)}<br>${ISSUE.subs.length} etapas viraram sub-issues, cada uma com quem faz. O documento completo está no Drive.</div></div></li>` : "";
  $("#main").innerHTML = `<div class="iv">
    <div class="ivh"><span class="num">#${ISSUE.n}</span><span class="chip">${I.issue}${ISSUE.subs.length ? "Em andamento" : "A fazer"}</span><span class="chip">${I.hash}marketing</span></div>
    <h1 class="ivt">${esc(ISSUE.title)}</h1>
    <dl class="iprops"><dt>Pedido de</dt><dd>${avHTML(P("marina"), 20)}Marina <span style="color:var(--faint)">· Marketing</span></dd><dt>Responsável</dt><dd>${avHTML(P(ME), 20)}Walter</dd><dt>Refinou</dt><dd>${avHTML(A("theo"), 20)}Theo <span style="color:var(--faint)">· ${AGENTS.theo.role}</span></dd></dl>
    <p class="idesc">Queria um botão “Entrar com LinkedIn” na landing para captar nome, cargo e empresa sem formulário. Hoje 70% de quem abre o formulário desiste.</p>
    ${ISSUE.subs.length ? `<div class="isec"><h3>Sub-issues · ${ISSUE.subs.length}</h3><ul class="subl">${ISSUE.subs.map((x) => `<li><span class="num">${esc(x.made)}</span><span class="tx">${esc(x.t)}</span><span class="who2">${avHTML(x.who, 18)}${esc(nameOf(x.who))}</span><span class="chip">A fazer</span></li>`).join("")}</ul></div>` : ""}
    <div class="isec"><h3>Atividade</h3><ol class="act">
      <li><span class="evdot">${I.plus}</span><div><span class="ev"><b>Marina</b> abriu a issue no #marketing</span><span class="when">ontem</span></div></li>
      <li>${avHTML(A("theo"), 28)}<div><b style="font-weight:600">Theo</b><span class="when">há 40 min</span><div class="bubble">Refinei: no login básico o LinkedIn entrega nome, e-mail e foto. Cargo e empresa pedem a API de marketing deles, com aprovação. Dá para começar com nome e e-mail e tirar a empresa do domínio. Isso mexe em segurança (OAuth) e no funil. Vale levar ao fórum com Bruno e Lia.</div></div></li>
      ${forumCard}${planC}
    </ol>
    ${tp ? "" : `<div class="appr" style="margin-top:4px"><span class="t"><b>${I.talk}Precisa de mais de uma visão</b><small>O fórum é para quando quem decide pode discordar. O resultado volta para esta issue.</small></span><button class="b b1 sm" type="button" data-evalforum>${I.talk}Avaliar no fórum</button></div>`}
    </div></div>`;
  hydrate($("#main"));
}

/* ---------- navigation ---------- */
function openTopic(id) { S.view = "topic"; S.topic = id; S.sheet = false; S.ask = null; S.draft = ""; closeMenu(); render(); scrollTo(0, 0); syncProto(); }
function goList() { S.view = "list"; S.topic = null; S.sheet = false; render(); scrollTo(0, 0); syncProto(); }
function goPost(id) { const el = document.getElementById("p-" + id); if (!el) return; el.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
function goEl(id) { document.getElementById(id)?.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" }); }

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  if (dlg && dlg.contains(e.target)) return;
  const t = e.target, tp = S.view === "topic" ? T(S.topic) : null;
  if (menuEl && menuEl.contains(t)) {
    const ag = t.closest("[data-agent]");
    if (ag) { const id = ag.dataset.agent; if (id === "__clear") { S.agents.clear(); closeMenu(); } else S.agents.has(id) ? S.agents.delete(id) : S.agents.add(id); render(); refreshMenu(); return; }
    const as = t.closest("[data-askset]"); if (as) { S.ask = as.dataset.askset; closeMenu(); render(); $("#cm")?.focus(); return; }
    const m = t.closest("[data-m]");
    if (m && tp) {
      closeMenu();
      if (m.dataset.m === "link") toast({ icon: I.link, title: "Link copiado", sub: "Quem abrir lê o tópico inteiro." });
      if (m.dataset.m === "people") openParticipants(tp);
      if (m.dataset.m === "wiki") { tp.wiki = true; render(); toast({ icon: I.wiki, title: "Salvo na wiki", sub: `Página “${tp.title}”, com o link para este tópico.` }); }
      if (m.dataset.m === "cancel") openCancel(tp);
    }
    return;
  }
  if (menuEl && !t.closest("[data-agents],[data-tmore],[data-askpick]")) closeMenu();
  if (t.closest("[data-proto]")) {
    const ttp = T(S.topic);
    if (S.view === "topic" && ttp?.live && ttp.status === "live") { const L = ttp.live; if (L.phase === "think" && !L.idle) L.wait = 0; else if (L.phase === "write" || L.phase === "synth") L.shown = L.text.length - 1; else toast({ icon: I.talk, ok: false, title: "Ninguém escrevendo agora", sub: "Escreva um post para começar a próxima rodada." }); }
    else toast({ icon: I.talk, ok: false, title: "Abra um tópico ao vivo", sub: "No protótipo: Ao vivo, no topo." });
    return;
  }
  if (t.closest("[data-new]")) return openNew();
  if (t.closest("[data-sg-open]")) return openFromSuggestion();
  if (t.closest("[data-evalforum]")) return openNew(null, { ...ISSUE_PRE, agents: [...ISSUE_PRE.agents], onCreate: (tp) => openFromIssue(tp) });
  if (t.closest("[data-goissue]")) { S.view = "issue"; S.topic = null; render(); scrollTo(0, 0); syncProto(); return; }
  const mt = t.closest("[data-myturn]"); if (mt) { openTopic(mt.dataset.myturn); setTimeout(() => { const c = $("#cmt"); c?.scrollIntoView({ block: "center" }); c?.focus(); }, 60); return; }
  if (t.closest("[data-sg-no]")) { SUG.state = "dismissed"; render(); return; }
  if (t.closest("[data-sg-undo]")) { SUG.state = "pending"; render(); return; }
  if (t.closest("[data-sg-edit]")) return openNew(null, { title: SUG.title, goal: SUG.goal, agents: [...SUG.agents], rounds: SUG.rounds, onCreate: (tp) => openFromSuggestion(tp) });
  const tpl = t.closest("[data-tpl]"); if (tpl) return openNew(tpl.dataset.tpl);
  // Actions inside "Precisa de você" rows come before opening the row.
  const rv = t.closest("[data-review]"); if (rv) { openTopic(rv.dataset.review); setTimeout(() => goEl("syn-iss"), 60); return; }
  const an = t.closest("[data-answer]"); if (an) { openTopic(an.dataset.answer); setTimeout(() => { const cm = $("#cm"); if (cm) { cm.scrollIntoView({ block: "center" }); cm.focus(); } }, 60); return; }
  const bu = t.closest("[data-budget]"); if (bu) { const a = bu.dataset.budget; toast(S.admin ? { icon: I.coin, ok: false, title: `Abre o orçamento ${ofA(a)}`, sub: "No perfil do agente. Com mais orçamento, ele volta a falar na próxima vez dele." } : { icon: I.flag, title: `Marina foi avisada`, sub: `Ela é a responsável ${ofA(a)} e cuida do orçamento.` }); return; }
  const op = t.closest("[data-topic]"); if (op && !t.closest("button:not([data-topic])")) return openTopic(op.dataset.topic);
  const am = t.closest("[data-agents]"); if (am) return menuEl ? closeMenu() : openMenu(am, agentMenu);
  if (t.closest("[data-clear]")) { S.agents.clear(); S.q = ""; render(); return; }
  if (t.closest("[data-back]")) return goList();
  if (t.closest("[data-sheet]")) { S.sheet = !S.sheet; renderSide(); return; }
  if (t.id === "scrim") { S.sheet = false; renderSide(); return; }
  if (!tp) return;
  const wk = t.closest("[data-work]"); if (wk) { const w = wk.closest(".work"); w.classList.toggle("open"); wk.setAttribute("aria-expanded", w.classList.contains("open")); return; }
  const gp = t.closest("[data-gopost]"); if (gp) return goPost(gp.dataset.gopost);
  const gr = t.closest("[data-goround]"); if (gr) return goEl("r-" + gr.dataset.goround);
  if (t.closest("[data-conclude]")) return openConclude(tp);
  if (t.closest("[data-tmore]")) return menuEl ? closeMenu() : openMenu(t.closest("[data-tmore]"), topicMenu(tp), "end");
  if (t.closest("[data-stop]")) return stopTurn(tp);
  if (t.closest("[data-resume]")) { resume(tp); return toast({ icon: I.play, title: "Tópico retomado", sub: `${AGENTS[tp.live.synth ? tp.owner : tp.live.agent].name} continua a rodada ${tp.round}.` }); }
  if (t.closest("[data-askpick]")) return menuEl ? closeMenu() : openMenu(t.closest("[data-askpick]"), askMenu(tp));
  if (t.closest("[data-askclear]")) { S.ask = null; render(); return; }
  if (t.closest("[data-send]")) return sendPost(tp);
  if (t.closest("[data-seatsend]")) { const v = $("#cmt")?.value.trim(); if (!v) { $("#cmt")?.focus(); return; } return seatTurn(tp, v); }
  if (t.closest("[data-pass]")) return seatTurn(tp, null);
  if (t.closest("[data-moreround]")) { S.more = !S.more; render(); return; }
  if (t.closest("[data-reround]")) { S.reround = !S.reround; render(); return; }
  const rf = t.closest("[data-reround-from]"); if (rf) { const q = tp.posts.find((x) => x.id === rf.dataset.reroundFrom); return openNewRound(tp, { from: q }); }
  if (t.closest("[data-showv1]")) { tp.showV1 = !tp.showV1; render(); return; }
  if (t.closest("[data-participants]")) return openParticipants(tp);
  const ck = t.closest("[data-iss]"); if (ck) { const x = synOf(tp).issues[+ck.dataset.iss]; x.on = !x.on; render(); return; }
  if (t.closest("[data-mkissues]")) {
    const s = synOf(tp), made = s.issues.filter((x) => x.on && !x.made);
    let n = tp.issueRef ? 143 : 141; for (const x of made) x.made = "#" + n++;
    if (tp.issueRef) { ISSUE.subs = s.issues.filter((x) => x.made); ISSUE.state = "planned"; }
    if (s.issues.every((x) => x.made || !x.on)) tp.needs = null;
    render(); toast({ icon: I.issue, title: tp.issueRef ? `${made.length} sub-issues criadas em #${tp.issueRef}` : `${made.length} ${made.length === 1 ? "issue criada" : "issues criadas"}`, sub: `${[...new Set(made.map((x) => nameOf(x.who)))].join(", ")} já ${made.length === 1 ? "recebeu" : "receberam"}.`, action: { label: "Ver issues", run: () => {} } });
    return;
  }
  if (t.closest("[data-wiki]")) { tp.wiki = true; render(); return toast({ icon: I.wiki, title: "Salvo na wiki", sub: `Página “${tp.title}”, com o link para este tópico.` }); }
  if (t.closest("[data-doc]")) return toast({ icon: I.doc, ok: false, title: "Abre o documento no Drive", sub: synOf(tp).doc });
  if (t.closest("[data-origin]")) return toast({ icon: I.open, ok: false, title: "Abre a conversa de origem", sub: tp.origin.text });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (menuEl) return closeMenu(); if (dlg) return closeDialog(); if (S.sheet) { S.sheet = false; renderSide(); return; } if (S.view === "topic") goList(); return; }
  const typing = e.target.closest?.("input,textarea,[contenteditable]");
  if (typing || dlg || e.metaKey || e.ctrlKey) return;
  if (e.key === "n" || e.key === "N") { e.preventDefault(); openNew(); }
  if (e.key === "/" && S.view === "list") { e.preventDefault(); $("#q")?.focus(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".tr,.nd")) { e.preventDefault(); e.target.click(); }
});

/* ---------- segmented / prototype bar ---------- */
function seg(el, value, on) {
  if (!el) return;
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); if (!b) { pill.style.width = "0px"; return; } pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
}
function onProto(v) {
  S.empty = v === "empty";
  if (v === "live") return openTopic("t1");
  if (v === "done") return openTopic("t5");
  if (v === "chat") { S.view = "chat"; S.topic = null; render(); scrollTo(0, 0); return; }
  if (v === "issue") { S.view = "issue"; S.topic = null; render(); scrollTo(0, 0); return; }
  goList();
}
function syncProto() { seg($("#pstate"), S.empty ? "empty" : S.view === "chat" ? "chat" : S.view === "issue" ? "issue" : S.view === "topic" ? ({ t1: "live", t5: "done" })[S.topic] ?? "" : "list", onProto); }
seg($("#prole"), S.admin ? "admin" : "member", (v) => { S.admin = v === "admin"; render(); });
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });

// Live turns already under way when the page opens.
for (const tp of TOPICS) if (tp.live?.shownFrac) tp.live.shown = Math.round(tp.live.text.length * tp.live.shownFrac);
$("#logo").append(makeAgent("theo", 30));
syncProto();
render();
</script>
