<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card trabalhando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;650;700&display=swap">
<script>
  { const h = new URLSearchParams(location.hash.slice(1));
    document.documentElement.dataset.theme = h.get("theme") || "light";
    document.documentElement.dataset.v = h.get("v") || "a"; }
</script>
<style>
/*
  Prototype: the card above the box while an agent works, back from before Mensagens.html, combined with the
  one block in the conversation. Phrases rotate: what he is doing, a light line while he only thinks, and what
  he said between steps.
    A · Card de volta (approved 2026-10-20): the old glass pill (sky strip, orbit, "Theo está lendo a página…") always on, phrases rotate.
    B · Card que conta: a bit taller: the phrase on top, what he said last below; steps and time on the side.
        The block in the conversation keeps only the steps and the answer (no second "pensando" line).
    C · Só o card: the card is the only status; the block shows up when there is something to show (steps,
        words). When he finishes the card says "Pronto" with the green pixel and goes.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root,[data-theme="light"]{
  --side:#f8f8f6;--pane:#ffffff;--raised:#ffffff;--sunken:#f3f3f0;
  --line:rgba(23,23,22,.07);--line2:rgba(23,23,22,.12);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#6f6f6a;
  --plate:rgba(127,127,127,.1);--agent-soft:#e3eefd;--agent:#0063d1;--ok:#1f7a45;
  --glass:rgba(255,255,255,.72);
  --card-shadow:0 0 0 1px rgba(23,23,22,.08),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(23,23,22,.06),0 1px 2px rgba(23,23,22,.06),0 12px 28px -14px rgba(23,23,22,.18);
  --person:#e9e9e5;
}
[data-theme="dark"]{
  --side:#0a0a09;--pane:#0f0f0e;--raised:#1c1c1b;--sunken:#0a0a09;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.15);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8f8f89;
  --plate:rgba(127,127,127,.14);--agent-soft:#11253f;--agent:#5aa8ff;--ok:#5fc48a;
  --glass:rgba(28,28,27,.72);
  --card-shadow:0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.5),0 14px 30px -12px rgba(0,0,0,.75);
  --person:#3a3a37;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--side);color:var(--ink);font:400 14.5px/1.5 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--pane)}
.bar b{font-size:13px;font-weight:650}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--sunken)}
.seg button{height:30px;padding:0 11px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:550;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.again{height:30px;padding:0 12px;border:0;border-radius:9px;background:var(--plate);font-size:13px;font-weight:600}
.note{flex-basis:100%;margin:0;color:var(--muted);font-size:12.5px}

.pane{flex:1;min-height:0;display:flex;flex-direction:column;max-width:860px;width:100%;margin:0 auto;background:var(--pane);border-inline:1px solid var(--line)}
.stream{flex:1;min-height:0;overflow:auto;padding:20px 24px 8px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg--me{background:var(--sunken);margin:0 -12px;padding:10px 12px;border-radius:16px}
.who{display:flex;align-items:center;gap:8px;font-weight:650}
.who time{font-weight:400;color:var(--faint);font-size:13px}
.body{min-width:0;flex:1}
.av{flex:none;border-radius:30%;display:grid;place-items:center;overflow:hidden}
.av--p{background:var(--person);font-weight:650;color:var(--ink2)}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:400;color:var(--muted);font-size:13.5px}
.steps{margin:6px 0 0;padding:2px 0 2px 12px;border-left:2px solid var(--line2);display:grid;gap:3px}
.step{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;animation:in .3s ease both}
.step i{font-style:normal;color:var(--ink2)}
.said{color:var(--ink2);font-size:13.5px;animation:in .3s ease both}
.answer{margin:6px 0 0}
.answer span{animation:fade .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(3px)}}
@keyframes fade{from{opacity:0}}

/* The composer */
.dock{padding:6px 24px 18px;display:flex;flex-direction:column;gap:8px}
.box{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:18px;background:var(--raised);box-shadow:var(--card-shadow)}
.box input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.send{width:34px;height:34px;border:0;border-radius:11px;background:var(--ink);color:var(--pane);display:grid;place-items:center}

/* The card */
.card{position:relative;overflow:hidden;align-self:flex-start;max-width:100%;transition:opacity .25s,transform .25s}
.card[hidden]{display:flex !important;opacity:0;transform:translateY(6px);pointer-events:none;position:absolute}
.sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}
.pill,.tcard{position:relative;overflow:hidden}
.pill > *:not(.sky),.tcard > *:not(.sky){position:relative}
/* A: the pill */
.pill{display:flex;align-items:center;gap:8px;min-height:32px;padding:3px 6px 3px 8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.5);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.06)}
/* B and C: a small card, tato com canto */
.tcard{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:14px 14px 14px 4px;background:var(--raised);box-shadow:var(--card-shadow);min-width:320px}
.tcard .lines{display:grid;min-width:0;flex:1}
.tcard .meta{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12.5px;white-space:nowrap}

/* The rotating phrase: the old one slides up and fades, the new one comes from below. */
.rot{position:relative;display:grid;overflow:hidden;min-width:0}
.rot > span{grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .42s cubic-bezier(.2,.7,.2,1),opacity .42s}
.rot > span.out{transform:translateY(-100%);opacity:0}
.rot > span.pre{transform:translateY(100%);opacity:0}
.rot b{font-weight:650;color:var(--ink)}
.phrase{font-size:13.5px;color:var(--ink2)}
.sub{font-size:12.5px;color:var(--muted)}
.sub q{quotes:"“" "”"}
.shim{background:linear-gradient(90deg,var(--muted) 0%,var(--muted) 40%,var(--ink) 50%,var(--muted) 60%,var(--muted) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.2s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-150% 0}}
.stop{width:28px;height:28px;border:0;border-radius:9px;background:var(--plate);display:grid;place-items:center;color:var(--ink);flex:none}
.done{color:var(--ok);font-weight:600}
@media (prefers-reduced-motion:reduce){.rot > span{transition:none}.shim{animation:none;color:var(--muted)}.step,.said,.answer span{animation:none}}
@media (max-width:600px){.stream{padding:16px}.dock{padding:6px 16px 14px}.tcard{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="bar">
  <b>Card trabalhando</b>
  <div class="seg" id="vseg">
    <button data-v="a">A · Card de volta</button>
    <button data-v="b">B · Card que conta</button>
    <button data-v="c">C · Só o card</button>
  </div>
  <div class="seg" id="tseg"><button data-t="light">Claro</button><button data-t="dark">Escuro</button></div>
  <button class="again" id="again">Rodar de novo</button>
  <p class="note" id="note"></p>
</div>
<div class="pane">
  <div class="stream" id="stream"></div>
  <div class="dock">
    <div class="card" id="card" hidden></div>
    <div class="box"><input placeholder="Mensagem para Theo"><button class="send" aria-label="Enviar" id="send"></button></div>
  </div>
</div>
<script type="module">
import { drawAgent, idlePose, bodyTones } from "../../../packages/ui/src/agent/engine.js";
const $ = (s) => document.querySelector(s);
const html = document.documentElement;
const NOTES = {
  a: "O card de antes, sempre ligado enquanto o Theo trabalha. A frase gira: o que ele faz agora e, enquanto só pensa, frases leves. O bloco na conversa fica como está.",
  b: "O card ganha uma segunda linha com o que o Theo disse por último. Passos e tempo do lado, parar à mão. Na conversa o bloco mostra só os passos e a resposta (sem repetir \"pensando\").",
  c: "O card é o único lugar do estado. O bloco aparece na conversa quando tem algo para mostrar. No fim o card diz \"Pronto\" com o pixel verde e sai.",
};
const THINK = ["Pensando no seu pedido", "Juntando as peças", "Lendo com calma", "Organizando as ideias", "Vendo o melhor caminho"];
const LONG = ["Isso leva um minutinho", "Indo com cuidado", "Conferindo os detalhes", "Quase lá"];
// The run: thinking, browser steps, a line said between steps, writing, done.
const SCRIPT = [
  { at: 0, phase: "thinking" },
  { at: 4200, step: "Abrindo o navegador", doing: "abrindo o navegador" },
  { at: 7000, step: "Lendo a página de viagens", doing: "lendo a página" },
  { at: 9800, said: "Achei a área de viagens. Vou criar uma para Nova York." },
  { at: 10400, step: "Preenchendo o formulário", doing: "preenchendo o formulário" },
  { at: 16600, step: "Conferindo antes de salvar", doing: "conferindo antes de salvar" },
  { at: 19000, phase: "writing" },
  { at: 22600, phase: "done" },
];
const ANSWER = "Pronto: criei a viagem **Nova York** de 12 a 19 de novembro, com você como dono. Quer que eu já adicione os voos?";

let S, gen = 0;
const px = (kind, size) => `<canvas class="px" data-px="${kind}" data-s="${size}" data-born="${performance.now()}" style="width:${size}px;height:${size}px"></canvas>`;
const av = (s, me) => me
  ? `<span class="av av--p" style="width:${s}px;height:${s}px;font-size:${Math.round(s * .42)}px">W</span>`
  : `<span class="av" data-agent style="width:${s}px;height:${s}px"></span>`;

function reset() {
  gen++;
  S = { t0: performance.now(), steps: [], said: null, phase: "thinking", doing: null, words: 0, rotI: 0, rotAt: 0, last: "" };
  $("#stream").innerHTML = `
    <div class="msg msg--me">${av(36, true)}<div class="body"><div class="who">Walter <time>08:03</time></div>abre o navegador aí, cria uma viagem para NY</div></div>
    <div class="msg" id="run">${av(36)}<div class="body"><div class="who">Theo <span class="state" id="hd"></span></div><div class="steps" id="steps" hidden></div><div class="answer" id="ans"></div></div></div>`;
  $("#card").innerHTML = "";
  $("#card").hidden = true;
  play(gen);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function play(g) {
  for (const e of SCRIPT) {
    const wait = S.t0 + e.at - performance.now();
    if (wait > 0) await sleep(wait);
    if (g !== gen) return;
    if (e.phase) S.phase = e.phase;
    if (e.step) { S.steps.forEach((s) => (s.done = true)); S.steps.push({ text: e.step, done: false }); S.doing = e.doing; S.stepAt = performance.now(); }
    if (e.said) S.said = e.said;
    if (e.phase === "writing") { S.steps.forEach((s) => (s.done = true)); S.doing = null; }
    if (e.phase === "done") S.doneAt = performance.now();
    render();
  }
}

/** The phrase on the card now: what he does, a light line while he only thinks, or a long step's aside. */
function phrase(now) {
  if (S.phase === "writing") return "<b>Theo</b> está escrevendo…";
  if (S.phase === "done") return "<b>Theo</b> terminou";
  const v = html.dataset.v;
  // Who it is first, then two light lines, and again (the lines move on each round).
  if (!S.doing) { const k = Math.floor(S.rotI / 3) * 2; return ["<b>Theo</b> está trabalhando…", `${THINK[k % THINK.length]}…`, `${THINK[(k + 1) % THINK.length]}…`][S.rotI % 3]; }
  const long = now - S.stepAt > 3000;
  // A long step alternates with an aside; in A, what he said rotates in too.
  const pool = [`<b>Theo</b> está ${S.doing}…`];
  if (long) pool.push(`${LONG[S.rotI % LONG.length]}…`);
  if (v === "a" && S.said) pool.push(`<b>Theo:</b> ${S.said}`);
  return pool[S.rotI % pool.length];
}
function rotate(el, htmlText, shim) {
  if (el.dataset.now === htmlText) return;
  el.dataset.now = htmlText;
  const old = el.querySelector("span:not(.out)");
  const next = document.createElement("span");
  next.className = `pre${shim ? " shim" : ""}`;
  next.innerHTML = htmlText;
  el.append(next);
  if (old) { old.classList.add("out"); setTimeout(() => old.remove(), 450); }
  requestAnimationFrame(() => requestAnimationFrame(() => next.classList.remove("pre")));
}
const secs = (now) => Math.max(0, Math.floor((now - S.t0) / 1000));

function render() {
  const v = html.dataset.v, now = performance.now();
  // The block in the conversation.
  const hd = $("#hd");
  const word = S.phase === "thinking" ? (S.doing ? "trabalhando" : "pensando") : S.phase === "writing" ? "escrevendo" : "";
  const showHeader = v === "a" && S.phase !== "done";
  const head = showHeader ? `${word}|${secs(now)}` : S.phase;
  if (hd.dataset.k !== head) {
    hd.dataset.k = head;
    hd.innerHTML = showHeader ? `${px("orbit", 13)}<span class="shim">${word}</span><span>· ${secs(now)} s</span>` : S.phase === "done" ? `<time>08:04</time>` : "";
  }
  const steps = $("#steps");
  const rows = S.steps.map((s) => `<div class="step">${px(s.done ? "check" : "orbit", 11)}<i>${s.text}</i></div>`);
  if (S.said) rows.splice(Math.min(2, rows.length), 0, `<div class="said">${S.said}</div>`);
  if (steps.dataset.n !== String(rows.length) + S.steps.filter((s) => s.done).length) {
    steps.dataset.n = String(rows.length) + S.steps.filter((s) => s.done).length;
    steps.innerHTML = rows.join("");
  }
  steps.hidden = rows.length === 0;
  // C: the block shows up once there is something to show.
  $("#run").style.display = v === "c" && rows.length === 0 && S.phase === "thinking" ? "none" : "";
  // The answer, word by word.
  if (S.phase === "writing" || S.phase === "done") {
    const all = ANSWER.replace(/\*\*(.+?)\*\*/g, "$1").split(" ");
    const n = S.phase === "done" ? all.length : Math.min(all.length, Math.floor((now - S.t0 - 19000) / 110));
    const ans = $("#ans");
    while (S.words < n) { const w = document.createElement("span"); w.textContent = (S.words ? " " : "") + all[S.words]; ans.append(w); S.words++; }
  }
  // The card.
  const card = $("#card");
  const doneFor = S.doneAt ? now - S.doneAt : 0;
  const gone = S.phase === "done" && (v !== "c" || doneFor > 1600);
  card.hidden = gone;
  if (gone) return;
  if (card.dataset.v !== v) {
    card.dataset.v = v;
    card.innerHTML = v === "a"
      ? `<div class="pill"><canvas class="sky"></canvas>${av(20)}${px("orbit", 13)}<span class="rot phrase" id="ph"></span><span class="sub" id="tm"></span><button class="stop" aria-label="Parar">${px("stopbtn", 12)}</button></div>`
      : `<div class="tcard"><canvas class="sky"></canvas>${av(28)}<div class="lines"><span class="rot phrase" id="ph"></span><span class="rot sub" id="sd"></span></div><span class="meta" id="tm"></span><button class="stop" aria-label="Parar">${px("stopbtn", 12)}</button></div>`;
    for (const el of card.querySelectorAll("[data-agent]")) el.dataset.agent = "card";
  }
  const ph = $("#ph");
  if (S.phase === "done") rotate(ph, `${px("check", 13)} <span class="done">Pronto</span>`, false);
  else rotate(ph, phrase(now), !S.doing && S.phase === "thinking");
  const tm = $("#tm");
  const n = S.steps.length;
  if (v === "a") tm.textContent = S.phase === "done" ? "" : `· ${secs(now)} s`;
  else tm.textContent = S.phase === "done" ? "" : `${n ? `${n} ${n === 1 ? "passo" : "passos"} · ` : ""}${secs(now)} s`;
  const sd = $("#sd");
  if (sd) {
    const sub = S.phase === "writing" ? "Respondendo na conversa" : S.said ? `<q>${S.said}</q>` : S.doing ? "Usando o navegador" : "Leu sua mensagem";
    rotate(sd, sub, false);
  }
  card.querySelector(".stop").hidden = S.phase === "done";
}

/* ---------- Pixel marks and agents (same as Mensagens.html) ---------- */
const RING = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
const TONES = bodyTones("amber");
function paintPx(cv, now) {
  if (!cv.dataset.ready) { const s = +cv.dataset.s, dpr = Math.min(2, devicePixelRatio || 1); cv.width = cv.height = Math.round(s * dpr); cv.dataset.ready = 1; }
  const ctx = cv.getContext("2d"), w = cv.width, kind = cv.dataset.px;
  ctx.clearRect(0, 0, w, w);
  const n = kind === "stopbtn" ? 2 : 3, cell = w / n, gap = Math.max(1, Math.round(cell * .14));
  const box = (x, y, fill, a) => {
    ctx.fillStyle = fill; ctx.globalAlpha = a;
    const x0 = Math.round(x * cell + gap / 2), y0 = Math.round(y * cell + gap / 2);
    ctx.fillRect(x0, y0, Math.round((x + 1) * cell - gap / 2) - x0, Math.round((y + 1) * cell - gap / 2) - y0);
  };
  const head = Math.floor(now / 110) % 8;
  const shade = (i) => Math.min(3, (((head - i) % 8) + 8) % 8);
  if (kind === "orbit") RING.forEach(([x, y], i) => { const sh = shade(i); box(x, y, TONES[sh], sh === 3 ? .35 : 1); });
  else if (kind === "check") {
    const k = Math.max(0, Math.min(1, (now - +cv.dataset.born) / 160));
    const c = w / 2, half = (cell - gap) * (0.5 + 0.15 * Math.sin(Math.PI * k)) * (k < 1 ? 0.6 + 0.4 * k : 1);
    ctx.fillStyle = getComputedStyle(html).getPropertyValue("--ok").trim(); ctx.globalAlpha = k;
    ctx.fillRect(Math.round(c - half), Math.round(c - half), Math.round(half * 2), Math.round(half * 2));
  } else if (kind === "stopbtn") {
    const ink = getComputedStyle(cv).color, turn = Math.floor(now / 220) % 4;
    [[0, 0], [1, 0], [1, 1], [0, 1]].forEach(([x, y], i) => box(x, y, ink, i === turn ? .55 : 1));
  }
  ctx.globalAlpha = 1;
}
function paintAgent(el, t) {
  let cv = el.firstChild;
  const s = parseFloat(el.style.width);
  if (!cv) { const dpr = Math.min(2, devicePixelRatio || 1); cv = document.createElement("canvas"); cv.width = cv.height = Math.round(s * dpr); cv.style.width = cv.style.height = s + "px"; el.append(cv); el.seed = Math.random() * 9; }
  const busy = S.phase !== "done";
  const pose = idlePose(t, el.seed, { every: busy ? 1e9 : 12, active: busy && S.phase !== "writing" });
  if (S.phase === "writing") pose.writing = true;
  const ctx = cv.getContext("2d"), w = cv.width, inner = w * .84;
  ctx.clearRect(0, 0, w, w);
  drawAgent(ctx, (w - inner) / 2, w - inner + w * .04, inner, { color: "amber", eyes: "round", cells: s <= 24 ? 10 : 12, pose });
}
// The strip behind the card: a soft drift in the agent's color, 3 px cells (like ActivitySky).
function paintSky(cv, t) {
  const r = cv.getBoundingClientRect(), P = 3;
  const W = Math.ceil(r.width / P), H = Math.ceil(r.height / P);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; cv.style.imageRendering = "pixelated"; }
  const ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  const c = ((t * 0.32) % 1.6) - 0.3, dark = html.dataset.theme === "dark";
  const B = [[0, 0], [2, 2], [3, 1], [1, 3], [0, 2], [2, 0], [3, 3], [1, 1]];
  for (let x = 0; x < W; x++) {
    const u = x / W, d = u - c, k = 0.06 + 0.42 * Math.exp(-(d * d) / 0.035);
    for (let y = 0; y < H; y++) {
      const v = y / H, a = k * (1 - v * 0.9);
      const th = (B.findIndex(([bx, by]) => bx === x % 4 && by === y % 4) + .5) / 8;
      if (a * 2.2 > th) { ctx.fillStyle = dark ? TONES[1] : TONES[a > .3 ? 3 : 4]; ctx.globalAlpha = dark ? .3 : .38; ctx.fillRect(x, y, 1, 1); }
    }
  }
}
let lastRot = 0;
function frame(now) {
  for (const cv of document.querySelectorAll("canvas.px")) paintPx(cv, now);
  for (const el of document.querySelectorAll("[data-agent]")) paintAgent(el, now / 1000);
  for (const cv of document.querySelectorAll("canvas.sky")) if (S.phase !== "done") paintSky(cv, now / 1000);
  // Phrases rotate every 2.6 s; the rest repaints on time.
  if (now - lastRot > 2600) { lastRot = now; S.rotI++; }
  render();
  requestAnimationFrame(frame);
}

function setV(v) { html.dataset.v = v; for (const b of document.querySelectorAll("#vseg button")) b.setAttribute("aria-pressed", b.dataset.v === v); $("#note").textContent = NOTES[v]; history.replaceState(null, "", `#v=${v}&theme=${html.dataset.theme}`); reset(); }
function setT(t) { html.dataset.theme = t; for (const b of document.querySelectorAll("#tseg button")) b.setAttribute("aria-pressed", b.dataset.t === t); history.replaceState(null, "", `#v=${html.dataset.v}&theme=${t}`); }
$("#vseg").onclick = (e) => e.target.dataset.v && setV(e.target.dataset.v);
$("#tseg").onclick = (e) => e.target.dataset.t && setT(e.target.dataset.t);
$("#again").onclick = reset;
$("#send").innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`;
setT(html.dataset.theme);
setV(html.dataset.v);
requestAnimationFrame(frame);
</script>
