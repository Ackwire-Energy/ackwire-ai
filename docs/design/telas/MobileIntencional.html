<style>
/*
  Prototype (MobileIntencional): the phone app more intuitive, personal and intentional, on top of the approved
  structure (MobileConversas.html → MobileHomeAgentes.html "Recomendada" → MobileRefinos.html). Nothing here is a
  new direction: same tabs (Conversas, Threads, Agentes, Atividade + Buscar apart), same rows, same strip,
  same composer A. What changes is what each screen says and asks.

  Grounded in the real app (apps/mobile):
    - Greeting says only "N agentes trabalhando agora" (features/chats/Greeting.tsx).
    - Rows of working agents say only "trabalhando…" although the app knows what (agents/work.ts workTitle).
    - Composer suggestions are generic and vanish once the chat has 6 messages (chat/ChatScreen.tsx:604).
    - Agent profile dumps the raw instructions (8 lines), has two buttons that both open the DM
      (Conversar / Tarefa), connector chips with server icons, and nothing personal (AgentProfileScreen.tsx),
      while the web already has "O que a Ada sabe" (GET …/agents/{id}/memories, edit/archive) and levels per app.
    - "Novo" is three equal choices (features/new/NewSheet.tsx); the new-agent form asks the name first.
    - New agent DM: "Diga oi para {{name}}. Pode pedir o que precisar." (i18n chat.emptyAgent).
  EXISTS (web or app): approvals with exact action, traits, "why", fuse, hold to approve, refusal reason;
    agent questions (ask_user); work steps card; diff/artifact cards; receipts with Desfazer/Refazer
    (agent_actions: issue, memory, routine, wiki, thread, channel); memories with edit (keeps history) and
    archive; access levels (Sem acesso / Ler / Ler e escrever); routines; the web's "since your last
    visit" band (client/lib/welcome.ts); "Pedir uma tarefa" (agent profile PromptForm, search action).
  NEW (small), only in captions: personal greeting line, digest on the home, plain "doing" line in rows,
    contextual composer suggestions, "O que fez por você" (agent_actions + artifacts + approvals by you),
    "O que sabe sobre você" on mobile (memories filtered to you), inline actions on Atividade, ask-first "+",
    first asks in a new agent's DM.
  NOT shown (does not exist): voice, share extension, live computer preview, charts, pinned/muted chats,
    swipe on the conversations list, group DMs, web search.

  Views: #view=inicio|conversa|agente|atividade|novo|primeiro&theme=light|dark
  Try: hold "Segure para aprovar", tap Recusar, pick an answer, Desfazer/Refazer, tap a suggestion and
  send, tap a memory, tap the dark strip, pick an agent in Novo. prefers-reduced-motion: static agents.
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--glass:rgba(250,250,248,.72);--glass2:rgba(255,255,255,.62);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;
  --ok:#1f7a45;--warn:#9a5b00;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);--ios:cubic-bezier(.32,.72,0,1);
  --ui:-apple-system,"SF Pro Text",BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --display:"Funnel Display",var(--ui);--dot:"Doto",var(--ui);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --desk:#e6e6e1;--deskink:#151514;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#1b1b1a;--sunken:#262624;--glass:rgba(30,30,28,.7);--glass2:rgba(60,60,56,.5);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;
  --ok:#5fc48a;--warn:#e0a84a;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --desk:#050505;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,h4,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blinkc{50%{opacity:0}}

/* ---------- prototype chrome (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--bg);position:sticky;top:0;z-index:10}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);flex:none;flex-wrap:wrap}
.seg button{font-size:12px;font-weight:600;height:26px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--raised);box-shadow:var(--e1),var(--top)}
.intro{display:flex;flex-wrap:wrap;gap:6px 28px;align-items:baseline;padding:18px 24px 0;max-width:1500px;margin:0 auto;width:100%}
.intro h1{font-family:var(--display);font-weight:300;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.intro p{font-size:13.5px;color:var(--muted);max-width:760px;line-height:1.5}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;flex-wrap:wrap;gap:28px;padding:20px 16px 40px}
.pf{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.pf figcaption{font-size:13px;color:var(--muted);text-align:center;max-width:var(--cw,390px);line-height:1.45}
.pf figcaption b{display:block;color:var(--ink);font-weight:650;font-size:13.5px}
.pw{position:relative;flex:none}

/* ---------- the phone ---------- */
.phone{position:absolute;left:0;top:0;width:412px;height:866px;transform-origin:0 0;border-radius:62px;padding:11px;background:#111110;box-shadow:0 0 0 1.5px #3a3a37,0 40px 90px -30px rgba(0,0,0,.5),0 12px 30px -12px rgba(0,0,0,.3)}
.screen{position:relative;width:390px;height:844px;border-radius:51px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:#000;z-index:95}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:4px 32px 0 46px;font-size:17px;font-weight:600;pointer-events:none;color:var(--ink)}
.sbar.light{color:#fff}
.sbar .r{display:flex;gap:6px;align-items:center}
.sbar svg{height:12px;fill:currentColor}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:96;pointer-events:none}
.homebar.light{background:#fff}

.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:100px;padding-bottom:120px}
.scroll::-webkit-scrollbar{display:none}

/* nav bar (native header): glass round buttons, small title once the large one scrolls away */
.nb{position:absolute;top:0;left:0;right:0;z-index:40;height:100px;padding:54px 16px 0;display:flex;align-items:center;gap:8px;transition:background .2s,box-shadow .2s}
.nb .grow{flex:1}
.nb .t{position:absolute;left:80px;right:80px;bottom:12px;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none}
.nb.solid{background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 1px 0 var(--line)}
.nb.solid .t{opacity:1}
.gb{width:44px;height:44px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink);background:var(--glass2);backdrop-filter:blur(16px) saturate(1.8);-webkit-backdrop-filter:blur(16px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 .5px rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.06),0 4px 12px -4px rgba(0,0,0,.14),0 0 0 .5px var(--line);transition:transform .2s var(--spring)}
:root[data-theme="dark"] .gb{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 12px -4px rgba(0,0,0,.5),0 0 0 .5px var(--line2)}
.gb:active{transform:scale(.9)}
.gb svg.i{width:22px;height:22px;stroke-width:1.9}
.gb.ink{background:var(--ink);color:var(--bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 12px -4px rgba(0,0,0,.4)}
.gb.pill{width:auto;padding:0 16px;border-radius:22px;font-size:17px;font-weight:600}
.gb .pp,.gb .agw{pointer-events:none}
.lt{padding:2px 20px 10px}
.lt h1{font-family:var(--display);font-weight:300;font-size:34px;line-height:41px;letter-spacing:-.02em}
.lt p{color:var(--muted);font-size:15px;margin-top:2px}

/* search field (native, capsule on iOS 26) */
.sf{margin:0 16px 10px;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:20px;background:var(--sunken);color:var(--faint);font-size:17px;border:0;width:calc(100% - 32px);text-align:left;cursor:text}
.sf svg.i{width:19px;height:19px}
.sf .q{flex:1;color:var(--ink);white-space:nowrap;overflow:hidden}
.sf .ph{flex:1}
.sf .caret{display:inline-block;width:2px;height:20px;background:var(--agent);vertical-align:-4px;animation:blinkc 1s steps(1) infinite;margin-left:1px}
.sbx{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
.sbx .sf{margin:0;flex:1;width:auto}

/* ---------- avatars ---------- */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
canvas.orb{display:block;flex:none;image-rendering:pixelated}
.pp{--s:28px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:calc(var(--s) * .4);background:linear-gradient(160deg,#e3e3df,#cfcfca);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3d3d3a,#2a2a28);color:#efefec}
.ch{--s:52px;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .32);background:var(--sunken);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ch svg.i{width:calc(var(--s) * .44);height:calc(var(--s) * .44)}
.avbox{width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex:none;position:relative}

/* ---------- chips, buttons ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:13px;height:13px}
.b{font-size:17px;font-weight:600;height:50px;padding:0 20px;border-radius:25px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring);white-space:nowrap;color:var(--ink);background:transparent;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.b:active{transform:scale(.97)}
.b>span{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b3{background:var(--sunken)}
.b.sm{height:38px;padding:0 15px;font-size:15px;border-radius:19px}
.b.wide{width:100%}
.b.hold::before{content:"";position:absolute;inset:0;z-index:0;transform-origin:left;transform:scaleX(0);background:color-mix(in srgb,var(--bg) 30%,transparent);transition:transform .25s var(--out)}
.b.hold.pressing::before{transform:scaleX(1);transition:transform 1.1s linear}
.b.hold.pressing{transform:scale(.97)}

/* ---------- conversations list ---------- */
.wait{margin:4px 0 6px}
.wait-h{display:flex;align-items:center;gap:8px;padding:0 20px 8px;font-size:15px;font-weight:600;color:var(--ink)}
.wait-h .num{font-size:16px}
.wait-h .grow{flex:1}
.wait-h button{all:unset;cursor:pointer;color:var(--muted);font-weight:500}
.wrail{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.wrail::-webkit-scrollbar{display:none}
.wc{flex:none;width:282px;scroll-snap-align:start;padding:12px 14px;border-radius:22px;background:var(--raised);box-shadow:var(--e1),var(--top);border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .2s var(--spring)}
.wc:active{transform:scale(.98)}
.wc .hd{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:500}
.wc .hd .grow{flex:1}
.wc .hd b{color:var(--ink);font-weight:600}
.wc h4{font-size:16px;font-weight:600;line-height:1.28;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:41px}
.wc .ft{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint)}
canvas.fuse{flex:1;height:6px;border-radius:2px;image-rendering:pixelated;min-width:0;display:block}

.cl{position:relative}
.crw{position:relative;overflow:hidden;touch-action:pan-y}
.cr{position:relative;z-index:1;display:flex;gap:12px;align-items:center;padding:10px 16px 10px 14px;min-height:76px;background:var(--bg);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .32s var(--ios)}
.cr.drag{transition:none}
.cr:active{background:color-mix(in srgb,var(--bg) 92%,var(--ink))}
.crw+.crw .cr::before{content:"";position:absolute;top:0;left:80px;right:0;height:.5px;background:var(--line2)}
.cr .tx{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.cr .l1{display:flex;align-items:baseline;gap:6px}
.cr .l1 b{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.cr .l1 .ico{color:var(--faint);display:inline-flex;align-self:center}
.cr .l1 .ico svg.i{width:14px;height:14px}
.cr .l1 .grow{flex:1}
.cr .l1 time{font-size:15px;color:var(--faint);flex:none}
.cr .l2{display:flex;align-items:flex-start;gap:8px;margin-top:1px}
.cr .l2 p{flex:1;min-width:0;font-size:15px;line-height:20px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cr .l2 p .who{color:var(--ink2)}
.cr .l2 p .dr{color:var(--ink2);font-weight:600}
.cr .work{display:flex;align-items:center;gap:7px;font-size:15px;line-height:20px;color:var(--muted);min-width:0;flex:1}
.cr .work span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .work em{font-style:normal;color:var(--ink2);font-weight:500}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;flex:none;margin-top:-1px}
.badge.soft{background:var(--sunken);color:var(--muted)}
/* tab bar: floating Liquid Glass capsule (iOS 26) */
.tabs{position:absolute;left:22px;right:22px;bottom:26px;z-index:50;height:64px;border-radius:32px;display:flex;align-items:center;padding:4px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 .5px rgba(255,255,255,.35),0 10px 30px -10px rgba(0,0,0,.25),0 0 0 .5px var(--line2)}
:root[data-theme="dark"] .tabs{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 30px -10px rgba(0,0,0,.7),0 0 0 .5px var(--line2)}
.tabs button{all:unset;flex:1;height:56px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink2);cursor:pointer;position:relative}
.tabs button svg.i{width:25px;height:25px;stroke-width:1.8}
.tabs button[aria-current="page"]{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.tabs button[aria-current="page"] svg.i{stroke-width:2.2}
.tabs .badge{position:absolute;top:4px;left:calc(50% + 4px);height:18px;min-width:18px;font-size:12px;padding:0 5px}

/* sky (pull-down header, empty state, agents) */
canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.pull{position:relative;margin-top:-100px;padding:108px 20px 16px;overflow:hidden}
.pull canvas.sky{-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.pull>*:not(canvas){position:relative;z-index:1}
.pull h2{font-family:var(--display);font-weight:300;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.pull p{color:var(--muted);font-size:15px;margin-top:4px}
.crew{display:flex;align-items:flex-end;gap:16px;margin-top:16px;height:60px}
.crew .ag{display:flex;flex-direction:column;align-items:center;gap:3px}
.crew .ag small{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:4px}
.pullhint{display:flex;justify-content:center;padding:2px 0 8px}
.pullhint i{width:36px;height:5px;border-radius:3px;background:var(--line2)}
.emptyc{position:relative;margin:6px 16px 0;border-radius:28px;overflow:hidden;padding:150px 22px 22px;background:var(--raised);box-shadow:var(--e1),var(--top);text-align:center}
.emptyc canvas.sky{-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.emptyc>*:not(canvas){position:relative;z-index:1}
.emptyc .born{position:absolute;top:52px;left:50%;transform:translateX(-50%)}
.emptyc h2{font-family:var(--display);font-weight:300;font-size:28px;line-height:1.12;letter-spacing:-.02em}
.emptyc p{color:var(--muted);font-size:15px;margin:6px 0 18px}
.emptyc .acts{display:flex;flex-direction:column;gap:8px}
.ideas{padding:18px 16px 0}
.ideas h3{font-size:15px;font-weight:600;color:var(--faint);padding:0 4px 8px}
.card{background:var(--raised);border-radius:22px;box-shadow:var(--e1),var(--top);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--line2)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:16px}
.li .tx span{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:var(--faint);width:16px;height:16px}
.tile{width:36px;height:36px;border-radius:11px;background:var(--sunken);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.tile svg.i{width:19px;height:19px}

/* agents tab */
.agsky{position:relative;margin:0 16px;border-radius:26px;overflow:hidden;padding:16px 16px 14px;background:var(--raised);box-shadow:var(--e1),var(--top)}
.agsky canvas.sky{-webkit-mask-image:linear-gradient(transparent,#000 40%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 40%,#000 80%,transparent)}
.agsky .band>*:not(canvas){position:relative;z-index:1}
.agsky>*:not(canvas){position:relative;z-index:1}
.agsky .k{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.agsky .k .num{font-size:15px;color:var(--ink)}
.agsky .band{position:relative;margin:-16px -16px 0;padding:14px 16px 8px}
.agsky .crew{margin-top:8px;justify-content:center;gap:28px;height:52px}
.agsky .lines{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.agsky .lines div{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.agsky .lines b{color:var(--ink);font-weight:600}
.sec-h{display:flex;align-items:center;gap:8px;padding:20px 20px 8px;font-size:15px;font-weight:600;color:var(--faint)}
.sec-h .num{font-size:15px;color:var(--ink)}
.sec-h .grow{flex:1}
.sec-h button{all:unset;cursor:pointer;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.agc{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:14px;border:0;text-align:left;cursor:pointer;transition:transform .2s var(--spring)}
.agc:active{transform:scale(.97)}
.agc .agw{margin-bottom:10px}
.agc b{font-size:16px;font-weight:600}
.agc .role{font-size:14px;color:var(--muted)}
.agc .st{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--faint);margin-top:8px}
.agc .st svg.i{width:14px;height:14px}
.agc.new{align-items:center;justify-content:center;color:var(--muted);font-weight:600;font-size:15px;gap:10px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);min-height:152px}
.agc.new .tile{width:44px;height:44px;border-radius:14px}

/* ---------- sheets ---------- */
.dim{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.3)}
.recede{position:absolute;inset:0;transform:translateY(10px) scale(.92);transform-origin:50% 0;border-radius:38px;overflow:hidden;filter:brightness(.7)}
:root[data-theme="dark"] .recede{filter:brightness(.55)}
.recedebg{position:absolute;inset:0;background:#000;z-index:0}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:70;border-radius:42px;padding:8px 0 22px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:var(--e3),inset 0 1px 0 rgba(255,255,255,.4);}
.sheet.large{left:0;right:0;bottom:0;top:62px;border-radius:38px 38px 0 0;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;padding-bottom:0}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.grab{display:flex;justify-content:center;padding:2px 0 6px}
.grab i{width:36px;height:5px;border-radius:3px;background:var(--line2)}
.shh{display:flex;align-items:center;gap:10px;padding:0 14px 12px;min-height:50px}
.shh h2{flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em}
.shh .sp{width:44px;flex:none}
.shin{flex:1;overflow-y:auto;padding:0 16px 24px;scrollbar-width:none}
.shin::-webkit-scrollbar{display:none}
.big3{display:flex;flex-direction:column;gap:8px}
.bo{display:flex;align-items:center;gap:14px;padding:14px;border-radius:24px;border:0;text-align:left;cursor:pointer;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .2s var(--spring);width:100%;position:relative;overflow:hidden}
.bo:active{transform:scale(.98)}
.bo .tx{flex:1;min-width:0}
.bo .tx b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.bo .tx span{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.bo .chev{color:var(--faint);width:18px;height:18px}
.bo .tw{width:52px;height:52px;border-radius:17px;background:var(--sunken);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none;position:relative;overflow:hidden}
.bo .tw svg.i{width:24px;height:24px}
.bo .tw canvas.sky{border-radius:17px}
.bo .tw .agw{position:relative;z-index:1}
.recent{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 2px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink2);width:58px;flex:none}
.recent .avbox{width:58px;height:58px;border-radius:50%;background:var(--raised);box-shadow:var(--e1),var(--top)}
.shsec{font-size:14px;font-weight:600;color:var(--faint);padding:18px 4px 8px}

.na-sky{position:relative;height:190px;margin:-8px -16px 0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px}
.na-sky canvas.sky{-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.na-sky .agw{position:relative;z-index:1}
.naq{font-family:var(--display);font-weight:300;font-size:32px;line-height:1.1;letter-spacing:-.02em;text-align:center;margin:6px 0 4px}
.nas{text-align:center;color:var(--muted);font-size:15px;margin-bottom:16px}
.ta{display:block;width:100%;min-height:104px;padding:14px 16px;border-radius:22px;background:var(--raised);box-shadow:var(--e2),var(--top);font-size:17px;line-height:1.4;color:var(--ink)}
.ta .caret{display:inline-block;width:2px;height:20px;background:var(--agent);vertical-align:-4px;animation:blinkc 1s steps(1) infinite;margin-left:1px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.sug{height:36px;padding:0 13px;border-radius:18px;border:0;background:var(--sunken);font-size:15px;font-weight:500;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.sug svg.i{width:16px;height:16px;color:var(--muted)}
.fine{font-size:13px;color:var(--faint);text-align:center;margin:14px 8px 0;line-height:1.45}
.shfoot{padding:10px 16px 34px;background:linear-gradient(transparent,var(--bg) 30%)}

.to{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 14px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:16px;min-height:52px}
.to .k{color:var(--faint);margin-right:2px}
.tok{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 4px;border-radius:16px;background:var(--sunken);font-size:15px;font-weight:600}
.tok svg.i{width:14px;height:14px;color:var(--faint)}
.to .caret{display:inline-block;width:2px;height:20px;background:var(--agent);animation:blinkc 1s steps(1) infinite}
.fld{display:flex;align-items:center;gap:10px;margin-top:8px;padding:0 14px;height:50px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:16px}
.fld .k{color:var(--faint)}
.pick .li{min-height:62px}
.pick .li+.li::before{left:66px}
.ck{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--bg)}
.ck svg.i{width:16px;height:16px;stroke-width:2.4}
.ck.on{background:var(--ink);box-shadow:none}

/* keyboard (system, mock) */
.kb{position:absolute;left:0;right:0;bottom:0;z-index:80;padding:8px 4px 34px;background:color-mix(in srgb,var(--sunken) 82%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:11px}
.kb .rw{display:flex;gap:6px;justify-content:center;padding:0 3px}
.kb i{flex:1;max-width:33px;height:42px;border-radius:8px;background:var(--raised);box-shadow:0 1px 0 rgba(0,0,0,.18);font-style:normal;display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--ink)}
.kb i.w{max-width:none;flex:1.6;font-size:15px}
.kb i.sp{max-width:none;flex:5;font-size:15px}
.kb i.g{background:color-mix(in srgb,var(--raised) 55%,var(--sunken))}

/* ---------- search ---------- */
.fls{display:flex;gap:8px;padding:2px 16px 8px;overflow-x:auto;scrollbar-width:none}
.fls::-webkit-scrollbar{display:none}
.fl{height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--sunken);color:var(--ink2);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;flex:none}
.fl svg.i{width:16px;height:16px}
.fl .num{font-size:15px;color:var(--faint)}
.fl[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fl[aria-pressed="true"] .num{color:inherit;opacity:.7}
.rs .li{align-items:flex-start;min-height:0;padding:11px 14px}
.rs .li .tx b{font-size:15px}
.rs .li .tx span{white-space:normal}
.rs .li .tx .snip{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink2);font-size:15px;line-height:20px;margin-top:1px}
.rs .li .tx small{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--faint);margin-top:3px}
.rs mark{background:none;color:var(--ink);font-weight:650;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.rs .li time{font-size:13px;color:var(--faint);flex:none;padding-top:2px}
.rgrp[hidden]{display:none}
.rec .li{min-height:48px;padding:10px 14px}
.rec .li svg.i{color:var(--faint)}
.rec .li .tx b{font-weight:400;font-size:16px}

/* ---------- conversation ---------- */
.chat .scroll{padding-bottom:150px}
.cnb{position:absolute;top:0;left:0;right:0;z-index:40;height:150px;padding:54px 12px 0;display:flex;align-items:flex-start;gap:8px;background:linear-gradient(var(--bg) 86%,color-mix(in srgb,var(--bg) 0%,transparent))}
.cnb .ctr{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;cursor:pointer}
.cnb .ctr .nm{display:flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:12px;background:var(--glass2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 .5px var(--line2);font-size:13px;font-weight:600}
.cnb .ctr .nm svg.i{width:12px;height:12px;color:var(--faint)}
.cnb .ctr .stt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.gb.backn{width:auto;padding:0 14px 0 10px;border-radius:22px;gap:2px}
.backn .num{font-size:17px;color:var(--ink)}
.day{text-align:center;font-size:13px;font-weight:600;color:var(--faint);margin:14px 0 4px}
.msg{display:flex;gap:10px;padding:7px 14px;position:relative}
.msg .body{flex:1;min-width:0}
.msg .who{display:flex;align-items:baseline;gap:7px;font-size:15px}
.msg .who b{font-weight:600}
.msg .who time{font-size:13px;color:var(--faint)}
.msg p{font-size:17px;line-height:1.42;color:var(--ink2);margin-top:1px}
.avslot{width:34px;flex:none;display:flex;justify-content:center;padding-top:2px}
.me{display:flex;justify-content:flex-end;padding:6px 14px 6px 60px}
.me p{padding:9px 14px;border-radius:21px 21px 6px 21px;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:17px;line-height:1.38;color:var(--ink)}
.me .att{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.me .att small{font-size:12.5px;color:var(--faint)}
.photo{width:180px;height:126px;border-radius:18px;background:linear-gradient(170deg,#9ec5e8 0%,#cfe0ea 38%,#e9d8b4 58%,#c9a774 100%);box-shadow:var(--e1);position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.5)}

.rcard{margin-top:8px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.rcard .hd{display:flex;align-items:center;gap:8px;padding:12px 14px 0;font-size:13px;color:var(--muted);font-weight:500}
.rcard .hd svg.i{width:15px;height:15px}
.rcard h4{font-size:17px;font-weight:600;letter-spacing:-.01em;padding:4px 14px 0}
.rcard .acts{display:flex;gap:8px;padding:12px 14px 14px}
.rcard .acts .b{flex:1}

.qcard{margin-top:8px;padding:14px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top)}
.qcard .l{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.qcard .l svg.i{width:15px;height:15px}
.qcard h4{font-size:17px;font-weight:600;line-height:1.3;margin:5px 0 12px;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--sunken);font-size:16px;cursor:pointer;transition:transform .18s var(--spring),background .15s}
.opt:active{transform:scale(.98)}
.opt .rec{margin-left:auto;font-size:13px;color:var(--faint);font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:4px}
.opt .rec svg.i{width:13px;height:13px}
.opt.picked{background:var(--ink);color:var(--bg)}
.opt.picked .rec{color:inherit;opacity:.7}
.opt.other{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--muted)}
.opt.other svg.i{width:17px;height:17px}
.qdone{margin-top:8px;display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:15px;color:var(--muted)}
.qdone b{color:var(--ink);font-weight:600}
.qdone svg.i{width:16px;height:16px;color:var(--ok)}

.acard{margin-top:8px;padding:14px;border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top)}
.acard .l{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.acard .l svg.i{width:15px;height:15px}
.acard .l .grow{flex:1}
.acard h4{font-size:18px;font-weight:600;line-height:1.28;margin:6px 0 10px;letter-spacing:-.015em}
.facts{border-radius:14px;background:var(--sunken);padding:4px 12px;margin-bottom:12px}
.facts div{display:flex;gap:10px;padding:7px 0;font-size:14.5px}
.facts div+div{border-top:.5px solid var(--line2)}
.facts span{color:var(--muted);width:92px;flex:none}
.acard .fw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--faint);margin-bottom:12px}
.acard .acts{display:flex;gap:8px}
.acard .acts .b1{flex:1}
.acard.ok{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);padding:12px 14px}
.acard.ok svg.i{color:var(--ok)}
.acard.ok b{color:var(--ink);font-weight:600}

.cmpw{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:10px 12px 34px;background:linear-gradient(color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 26%)}
.composer{display:flex;align-items:flex-end;gap:6px}
.cbox{flex:1;display:flex;align-items:flex-end;gap:4px;min-height:46px;padding:4px 4px 4px 14px;border-radius:23px;background:var(--raised);box-shadow:var(--e2),var(--top)}
.cbox .t{flex:1;min-width:0;font-size:17px;line-height:22px;padding:8px 0;color:var(--ink)}
.cbox .t .caret{display:inline-block;width:2px;height:20px;background:var(--agent);vertical-align:-4px;animation:blinkc 1s steps(1) infinite;margin-left:1px}
.cbox .t.ph{color:var(--faint)}
.cbtn{width:46px;height:46px;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .25s var(--spring)}
.cbtn:active{transform:scale(.9)}
.cbtn.plus{background:var(--glass2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--e1),var(--top);color:var(--ink2)}
.cbtn.plus.on{transform:rotate(45deg)}
.cbtn.send{width:38px;height:38px;color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 10px -4px rgba(0,0,0,.45)}
.cbtn svg.i{width:21px;height:21px;stroke-width:2}
.tray{display:none;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 2px 10px}
.tray.on{display:grid;animation:fi .25s var(--out) both}
.tray button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.tray .tile{width:54px;height:54px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink2)}
.tray .tile svg.i{width:23px;height:23px}

/* "novo" note: prototype captions only, never product UI */
.nv{display:inline-flex;align-items:center;height:18px;padding:0 7px;margin:0 3px;border-radius:9px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 45%,transparent);vertical-align:1px}
.intro .nvl{display:block;margin-top:6px}

/* artifact (file) card */
.afile{margin-top:8px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden;cursor:pointer}
.afile .top{display:flex;align-items:center;gap:12px;padding:12px 14px}
.afile .top .tx{flex:1;min-width:0}
.afile .top b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.afile .top span{display:block;font-size:13.5px;color:var(--muted)}
.afile .prev{margin:0 10px 10px;padding:12px 14px;border-radius:14px;background:var(--sunken);font-size:14px;line-height:1.45;color:var(--ink2)}
.afile .prev h5{margin:0 0 4px;font-size:15px;font-weight:650;color:var(--ink)}
.afile .prev ul{margin:4px 0 0;padding-left:18px}
.afile .prev li{margin:1px 0}

/* mission report card */
.mrep{margin-top:8px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.mrep .hd{display:flex;align-items:center;gap:8px;padding:12px 14px 0;font-size:13px;color:var(--muted);font-weight:500}
.mrep .hd svg.i{width:15px;height:15px}
.mrep .hd .grow{flex:1}
.mrep h4{font-size:17px;font-weight:600;letter-spacing:-.01em;padding:4px 14px 0}
.mrep .meta{display:flex;align-items:center;gap:8px;padding:6px 14px 0;font-size:13.5px;color:var(--muted)}
.mrep .meta .num{font-size:15px;color:var(--ink)}
.mrep ul{list-style:none;margin:10px 14px 0;padding:4px 12px;border-radius:14px;background:var(--sunken)}
.mrep li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:14.5px;color:var(--ink2);line-height:1.35}
.mrep li+li{border-top:.5px solid var(--line2)}
.mrep li svg.i{width:16px;height:16px;color:var(--ok);margin-top:1px}
.mrep .acts{display:flex;gap:8px;padding:12px 14px 14px}
.mrep .acts .b{flex:1}

/* secret request card */
.scard{margin-top:8px;padding:14px;border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top)}
.scard .l{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.scard .l svg.i{width:15px;height:15px}
.scard h4{font-size:17px;font-weight:600;line-height:1.3;margin:5px 0 4px;letter-spacing:-.01em}
.scard p{font-size:14.5px;color:var(--muted);line-height:1.4;margin:0 0 12px}
.scard .in{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:16px;background:var(--sunken);font-size:17px;color:var(--ink);letter-spacing:.18em;margin-bottom:10px}
.scard .in svg.i{width:18px;height:18px;color:var(--faint);margin-left:auto}
.scard .note{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--faint);margin-bottom:12px}
.scard .note svg.i{width:14px;height:14px}

/* composer actions in the "+" tray */
.tacts{grid-column:1/-1;margin-top:4px;border-radius:20px}
.tray .tacts button.li{all:unset;box-sizing:border-box;display:flex;flex-direction:row;align-items:center;gap:12px;width:100%;min-height:54px;padding:9px 12px;cursor:pointer;position:relative;text-align:left}
.tray .tacts .li .tile{width:34px;height:34px;border-radius:11px;box-shadow:none;background:var(--sunken)}

/* ---------- render ---------- */
function params() {
  const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  return { view: h.get("view") || q.get("view") || "inicio", theme: h.get("theme") || q.get("theme") || document.documentElement.dataset.theme || "light" };
}
function setParams(p) {
  const n = { ...params(), ...p };
  history.replaceState(null, "", `#view=${n.view}&theme=${n.theme}`);
  apply();
}
function fit(n) {
  const W = Math.min(document.documentElement.clientWidth, 1900) - 32, H = window.innerHeight - 210;
  const gap = 28;
  let s = Math.min(1, (W - gap * (n - 1)) / (n * 412), Math.max(.55, H / 866));
  if (s < .55) s = Math.min(1, (W - gap * 2) / (3 * 412));
  if (s < .5) s = Math.min(1, (W - gap) / (2 * 412));
  return Math.max(.4, s);
}
function apply() {
  const { view, theme } = params();
  const V = VIEWS[view] || VIEWS.inicio;
  document.documentElement.dataset.theme = theme; varCache = {};
  $$("#theme button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === theme));
  $("#views").innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button type="button" data-v="${k}" aria-pressed="${k === view}">${v.tab}</button>`).join("");
  $("#vt").textContent = V.title;
  $("#vd").textContent = V.desc;
  const ab = V.phones.filter((p) => p.ab).map((p) => `${p.ab}: ${p.cap}`).join(" · ");
  $("#ab").textContent = ab ? `Variantes: ${ab}` : "";
  const s = fit(V.phones.length);
  $("#stage").innerHTML = V.phones.map((p) => `<figure class="pf" style="--cw:${Math.round(412 * s)}px"><div class="pw" style="width:${412 * s}px;height:${866 * s}px"><div class="phone" style="transform:scale(${s})"><div class="screen" data-s="${p.s}">
      <div class="island"></div>${sbar(false)}${S[p.s]()}<div class="homebar"></div></div></div></div>
      <figcaption><b>${p.ab ? AB(p.ab) : ""}${p.cap}</b>${p.sub}</figcaption></figure>`).join("");
  hydrate($("#stage"));
  wire();
}

/* ---------- interactions ---------- */
function wire() {
  const st = $("#stage");
  for (const sc of $$(".scroll[data-collapse]", st)) {
    const nb = sc.parentElement.querySelector(".nb");
    sc.addEventListener("scroll", () => nb && nb.classList.toggle("solid", sc.scrollTop > 40), { passive: true });
  }
  for (const sc of $$("[data-at]", st)) sc.scrollTop = +sc.dataset.at;
  for (const sc of $$("[data-end]", st)) sc.scrollTop = sc.scrollHeight;
}
const sendInto = (screen, text) => {
  const sc = $(".scroll", screen), box = $("[data-box]", screen), sugs = $("[data-sugs]", screen);
  sugs?.remove();
  box.innerHTML = `<span class="t">${esc(text)}<span class="caret"></span></span><button class="cbtn send" type="button" data-send aria-label="Enviar">${I.send}</button>`;
  box.dataset.text = text;
  sc.style.paddingBottom = "150px";
};
const deliver = (screen) => {
  const sc = $(".scroll", screen), box = $("[data-box]", screen), text = box.dataset.text || "";
  const who = $("[data-cmp]", screen)?.dataset.cmp || "theo";
  box.innerHTML = `<span class="who">${av(who, 22)}</span><span class="t ph">Mensagem para ${nameOf(who)}</span>`;
  sc.insertAdjacentHTML("beforeend", `<div class="me" style="animation:fi .3s var(--out) both"><p>${esc(text)}</p></div><span class="wkp" data-wk>${orb(AGENTS[who].color, 10)}<span><em>${nameOf(who)}</em> está pensando…</span></span>`);
  hydrate(screen); sc.scrollTop = sc.scrollHeight;
  setTimeout(() => {
    $("[data-wk]", screen)?.remove();
    const reply = who === "theo" && /merge/i.test(text) ? agMsg("theo", approvalCard(), "14:06", "fresh")
      : agMsg(who, `<p>${who === "theo" ? "Pedi para o Caio revisar o PR #128. Te aviso quando ele aprovar." : "Combinado. Já começo e te mostro aqui."}</p>`, "agora", "fresh");
    sc.insertAdjacentHTML("beforeend", reply); hydrate(screen); sc.scrollTop = sc.scrollHeight;
  }, REDUCED ? 0 : 900);
};
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-v]"); if (v) return setParams({ view: v.dataset.v });
  const t = e.target.closest("[data-t]"); if (t) return setParams({ theme: t.dataset.t });
  const screen = e.target.closest(".screen");
  const sec = e.target.closest("[data-sec]"); if (sec) { sec.classList.toggle("off"); return; }
  const wt = e.target.closest("[data-wtog]");
  if (wt) { const w = wt.closest("[data-strip]"); w.innerHTML = stripOpen(); hydrate(w); return; }
  const dis = e.target.closest("[data-dismiss]"); if (dis) { dis.closest("[data-digest]").remove(); return; }
  const stp = e.target.closest("[data-steps]"); if (stp) { stp.setAttribute("aria-expanded", stp.getAttribute("aria-expanded") !== "true"); return; }
  const sg = e.target.closest("[data-sug]"); if (sg) { sendInto(screen, sg.dataset.sug); return; }
  const fi = e.target.closest("[data-first]"); if (fi) { sendInto(screen, fi.querySelector("b").textContent); return; }
  const snd = e.target.closest("[data-send]"); if (snd) { deliver(screen); return; }
  const rf = e.target.closest("[data-refuse]"); if (rf) { rf.closest("[data-ap]").classList.add("refusing"); return; }
  const urf = e.target.closest("[data-unrefuse]"); if (urf) { urf.closest("[data-ap]").classList.remove("refusing"); return; }
  const rfd = e.target.closest("[data-refused]");
  if (rfd) { rfd.closest("[data-ap]").outerHTML = `<div class="acard ok" style="margin-top:8px">${I.x}<span><b>Você recusou.</b> O Theo vai lembrar disso da próxima vez.</span></div>`; return; }
  const opt = e.target.closest("[data-opt]");
  if (opt) {
    const q = opt.closest("[data-q]"), label = opt.childNodes[0].textContent.trim();
    q.outerHTML = `<div class="qdone">${I.checkc}Você escolheu <b>${esc(label)}</b></div>`;
    const after = $("[data-after]", screen);
    if (after) {
      after.innerHTML = agMsg("theo", `<p>Combinado. Vou seguir isso daqui em diante.</p>${memReceipt(true, label)}`, "14:12", "fresh");
      hydrate(after);
      const sc = $(".scroll", screen); sc.scrollTop = sc.scrollHeight;
    }
    return;
  }
  const un = e.target.closest("[data-undo]");
  if (un) {
    const r = un.closest("[data-rc]"), done = r.classList.toggle("undone");
    un.textContent = done ? "Refazer" : "Desfazer";
    const sm = $("small", r);
    if (done) { sm.dataset.keep = sm.innerHTML; sm.textContent = "Desfeito por você · agora"; }
    else if (sm.dataset.keep) sm.innerHTML = sm.dataset.keep;
    return;
  }
  const wh = e.target.closest("[data-who]");
  if (wh) {
    $$("[data-who]", screen).forEach((b) => b.setAttribute("aria-pressed", b === wh));
    $("[data-ask] span", screen).textContent = `Pedir ${art2(wh.dataset.who)} ${nameOf(wh.dataset.who)}`;
    return;
  }
  const mem = e.target.closest("[data-mem]");
  if (mem && !$(".fs", screen)) { screen.insertAdjacentHTML("beforeend", fixSheet()); return; }
  const cl = e.target.closest("[data-close]");
  if (cl && screen.dataset.s !== "aFix") { $$(".fs, .dim[data-close]", screen).forEach((x) => x.remove()); return; }
  if (cl) return;
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); setParams({ view: g.dataset.go }); }
});
// hold to approve (1.1 s), then the agent goes on
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest("[data-hold]"); if (!b) return;
  b.classList.add("pressing");
  const tm = setTimeout(() => {
    const card = b.closest("[data-ap]"), screen = b.closest(".screen");
    card.outerHTML = `<div class="acard ok" style="margin-top:8px">${I.checkc}<span><b>Você aprovou.</b> O Theo está fazendo o merge.</span></div>`;
    setTimeout(() => {
      const sc = $(".scroll", screen);
      sc.insertAdjacentHTML("beforeend", agMsg("theo", `<p>Merge feito. O PR #128 está em main e o login com Google voltou no Safari.</p>`, "14:08", "fresh"));
      hydrate(sc); sc.scrollTop = sc.scrollHeight;
    }, REDUCED ? 0 : 700);
  }, 1100);
  const up = () => { clearTimeout(tm); b.classList.remove("pressing"); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); };
  addEventListener("pointerup", up); addEventListener("pointercancel", up);
});
// receipts count down to the end of their undo window
setInterval(() => {
  for (const sm of $$("[data-left]")) {
    if (sm.closest(".undone")) continue;
    const left = Math.max(0, +sm.dataset.left - 1); sm.dataset.left = left;
    const n = $(".num", sm); if (n) n.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  }
}, 1000);
addEventListener("hashchange", apply);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(apply, 150); });
apply();
</script>
