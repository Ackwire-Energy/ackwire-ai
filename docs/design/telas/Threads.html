<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: Threads (sidebar item), with Missões as a preset view of the same list. Sibling of
  ThreadContexto.html, MissaoChat.html, TarefaLonga.html, Missao.html and Rotinas.html: same tokens, sidebar,
  chips, buttons, menus, glass toasts, custom controls and agent engine.
  Need: "preciso ver as threads que existem, poder fechar/arquivar, e ver as missões que existem".
  Ladder (decided): channel conversation -> thread -> mission (a thread with a plan: phases with gates,
  decisions, tasks on the person's computer via Claude Code, .agentes/ files) -> own channel. A long task is
  a thread with work running and no plan. A mission always has a home thread (channel or DM) and can start
  from /mission in any composer, a DM with the agent, or "Nova missão" here. No money anywhere: time and
  progress only.
  The screen: tabs Todas · Com trabalho · Missões · Fechadas · Arquivadas (segmented, with counts), search,
  filters (canal, agente, precisa de você, minhas), sort (atividade recente, agrupar por estado). Rows in
  aligned columns (Rotinas.html): kind tile, title (bold + count chip when unread; never a dot), where it
  lives, last message, progress (messages / running tasks with ticking time / mini pixel phase bar in the
  agent's bodyTones), participants (agents from the engine, running ring when working), state chip with
  icon, time; hover actions + ⋯ menu + multi-select with a floating glass bar (Drive.html).
  Missões tab: bigger cards with the phase horizon (Missao.html drawing), gates, "Esperando você",
  tasks on the computer (online/offline chip), started date, Abrir missão / Abrir thread; "Nova missão"
  dialog (objetivo, agente, onde mora: canal ou DM, computador) creates a card and its home thread.
  Fechar = resolved (reopens when someone replies; in the channel it becomes one line). Arquivar = hidden
  from lists and search, read-only, can be unarchived. With work running, closing/archiving asks
  (Parar e fechar / Deixar terminar e fechar depois / Cancelar). Closing a mission asks Concluída or
  Cancelada and offers to save decisions and lessons to the wiki. Glass toast with Desfazer.
  Details panel (row click): generated summary, origin, participants, phases, pending decisions,
  .agentes/ files, tasks, follow switch; bottom sheet on phone. Empty Fechadas/Arquivadas with a light sky.
  Second view "No canal": #produto header with "Threads (6)" popover; a closed thread is one compact line.
  Neutral selection (ink/gray), brand blue only for agents. Mono only for paths and branches.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --plate:rgba(127,127,127,.1);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --plate:rgba(127,127,127,.14);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum";display:flex;flex-direction:column;height:100vh;height:100dvh}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
code,.mono{font-family:var(--mono);font-size:.84em;letter-spacing:-.01em}

/* ---------- design system bits (verbatim from ThreadContexto.html / Rotinas.html) ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.seg button:focus-visible,.mi:focus-visible,.opt:focus-visible,.sb-item:focus-visible,.stp:focus-visible,.ck:focus-visible,.fc:focus-visible,.row:focus-visible,.mc:focus-visible,.sw:focus-visible,.tsum:focus-visible,.lnk:focus-visible,.pr:focus-visible,.pm:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.b:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button .n{font-weight:500;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.ink{background:var(--ink);color:var(--bg)}
.chip.okc{color:var(--ok)}
.chip.st-work{color:var(--ink2)}
.chip.cn{height:20px;padding:0 7px;font-size:11px;color:var(--ink2);background:color-mix(in srgb,var(--ink) 9%,transparent)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.spin{animation:spin 1.2s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blinkc{50%{opacity:0}}
.hint{font-size:12.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.hint svg.i{width:14px;height:14px}
.inp{display:flex;align-items:center;gap:9px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s;min-width:0}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp input,.inp textarea{all:unset;flex:1;min-width:0;font-size:14.5px;color:var(--ink)}
.inp textarea{padding:10px 0;line-height:1.5;min-height:66px;white-space:pre-wrap}
.inp.ta{align-items:flex-start}
.inp .pre{color:var(--faint);font-weight:600}
.sel{justify-content:space-between;cursor:pointer;border:0;width:100%;text-align:left}
.sel .v{display:flex;align-items:center;gap:9px;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden}
.sel .v small{color:var(--faint);font-size:12.5px}
.sel>svg.i{color:var(--faint)}
/* Switch: a track with a tactile knob (Rotinas.html). */
.sw{position:relative;width:36px;height:22px;border-radius:999px;border:0;padding:0;cursor:pointer;flex:none;background:color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);transition:background .2s var(--out)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 2px 6px -2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:var(--bg)}
.sw:active::after{width:21px}
.sw[aria-checked="true"]:active::after{transform:translateX(11px)}
/* checkbox (ThreadContexto.html) */
.ck{width:18px;height:18px;border-radius:6px;border:0;padding:0;flex:none;background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 30%,transparent);display:inline-flex;align-items:center;justify-content:center;color:transparent;cursor:pointer;transition:background .15s,box-shadow .15s,color .15s,opacity .15s,transform .2s var(--spring)}
.ck svg.i{width:12px;height:12px;stroke-width:2.8}
.ck[aria-checked="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.ck:active{transform:scale(.88)}

/* Agents: the engine's body (canvas). People: a circle with the initial. */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .42);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.stack{display:inline-flex;align-items:center}
.stack>*+*{margin-left:-5px}
.stack .pp{box-shadow:0 0 0 2px var(--raised)}
.stack .more{font-size:11.5px;color:var(--faint);font-weight:600;margin-left:4px}

/* ---------- prototype bar (not product) ---------- */
.proto{position:relative;z-index:30;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex:none}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px;padding:0 10px}
.proto .seg .pill{height:26px}
.proto .lab{font-size:12px;color:var(--faint)}
.steps{display:flex;gap:3px;flex-wrap:wrap}
.stp{height:26px;min-width:26px;padding:0 8px;border-radius:8px;border:0;background:var(--sunken);color:var(--muted);font-size:12px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .18s var(--spring)}
.stp:hover{color:var(--ink)}
.stp:active{transform:scale(.95)}
.stp[aria-current="step"]{background:var(--ink);color:var(--bg)}
.stp .l{display:none}
.stp[aria-current="step"] .l{display:inline}
.proto .now{color:var(--ink2);font-weight:600;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- app frame ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr)}
.app.wp{grid-template-columns:248px minmax(0,1fr) 410px}
.main{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
.main.cvm{overflow:hidden;display:flex;flex-direction:column}
.wrap{container:list / inline-size;max-width:1180px;margin:0 auto;padding:24px 26px 120px}

/* ---------- sidebar (ThreadContexto.html) ---------- */
.sb{position:relative;background:var(--sunken);display:flex;flex-direction:column;gap:16px;padding:14px 12px;overflow-y:auto;border-right:1px solid var(--line);min-height:0}
.org-in{display:flex;align-items:center;gap:10px;padding:4px 6px}
.org-in .tx{min-width:0}
.org-in b{display:block;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.org-in small{display:block;color:var(--muted);font-size:12px}
.sb-jump{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);font-size:13.5px;flex:none;border:0;cursor:pointer;width:100%;text-align:left}
.sb-jump span:not(.kbd){flex:1}
.sb-group{display:flex;flex-direction:column;gap:1px}
.sb-label{font-size:12px;font-weight:650;color:var(--faint);padding:0 8px 4px}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;min-height:34px;padding:4px 8px;border-radius:10px;color:var(--ink2);font-size:14.5px;cursor:pointer;user-select:none;border:0;background:transparent;width:100%;text-align:left}
.sb-item:hover{background:var(--plate)}
.sb-item.on{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.sb-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .meta{font-size:12px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.sb-item .meta svg.i{width:12px;height:12px}
.sb-item svg.i{color:var(--faint)}
.sb-item.on svg.i{color:var(--ink2)}
.sb-item.fresh{animation:popin .35s var(--spring) both}
.sb-item .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink2);font-variant-numeric:tabular-nums}
.sb-item .cnt.ink{background:var(--ink);color:var(--bg)}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.me .tx{flex:1;min-width:0}
.me b{display:block;font-size:13.5px;font-weight:650}
.me small{display:block;font-size:12px;color:var(--muted)}

/* ---------- header and toolbar (Rotinas.html) ---------- */
.hd{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.hd h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.hd p{color:var(--muted);margin-top:6px;max-width:62ch}
.hd .acts{display:flex;gap:8px;align-items:center}
.tabsw{overflow-x:auto;scrollbar-width:none;margin:0 -4px 12px;padding:2px 4px}
.tabsw::-webkit-scrollbar{display:none}
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:0 1 280px;min-width:0;display:flex;align-items:center;gap:9px;height:36px;padding:0 10px 0 12px;border-radius:12px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);transition:box-shadow .2s var(--out)}
.search:focus-within{box-shadow:var(--e2),0 0 0 1.5px var(--ink)}
.search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--faint)}
.search .ib{width:24px;height:24px;border-radius:7px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.fc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none;transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.fc:hover{box-shadow:var(--e2),var(--top)}
.fc:active{transform:scale(.96)}
.fc .n{font-weight:500;color:var(--faint);font-size:12px}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.fc[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.sortb{margin-left:auto}
.note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 4px 14px;font-size:12.5px;color:var(--faint)}
.note svg.i{width:14px;height:14px}
.note b{color:var(--ink2);font-weight:600}

/* ---------- groups and rows (Rotinas.html list) ---------- */
.group{margin-bottom:22px;animation:fi .3s var(--out) both}
.gh{display:flex;align-items:center;gap:8px;margin:0 4px 8px;min-height:24px}
.gh h2{font-size:13px;font-weight:650;color:var(--ink2)}
.gh .n{font-size:12.5px;color:var(--faint)}
.gh svg.i{width:14px;height:14px;color:var(--faint)}
.list{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:18px 32px minmax(0,1fr) 150px 92px 172px 96px;align-items:center;gap:14px;padding:12px 12px 12px 16px;border-top:1px solid var(--line);cursor:pointer;outline:none;transition:background .12s;min-height:66px}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--sunken) 45%,transparent)}
.row.on{background:color-mix(in srgb,var(--sunken) 80%,transparent)}
.row.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.row.picked{background:color-mix(in srgb,var(--ink) 4%,var(--raised))}
.row.new{animation:landed .8s var(--spring) both}
@keyframes landed{0%{opacity:0;transform:translateY(8px) scale(.98)}100%{opacity:1;transform:none}}
.row>.ck{opacity:0}
.row:hover>.ck,.row>.ck:focus-visible,.row>.ck[aria-checked="true"],.selecting .row>.ck{opacity:1}
@media (hover:none){.row>.ck{opacity:1}}
.kd{width:32px;height:32px;border-radius:10px;background:var(--sunken);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.kd svg.i{width:15px;height:15px}
.ti{min-width:0}
.ti b{display:flex;align-items:center;gap:8px;min-width:0}
.ti b .nm{font-weight:500;font-size:14.5px;letter-spacing:-.01em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ti b.un .nm{font-weight:700;color:var(--ink)}
.ti small{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;min-width:0}
.ti small svg.i{width:13px;height:13px;color:var(--faint)}
.ti small .wh{display:inline-flex;align-items:center;gap:4px;color:var(--ink2);font-weight:600;flex:none}
.ti small .sn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ti small .km{display:none}
.row[data-dim] .ti b .nm{color:var(--muted)}
.m2{display:contents}
.pgc,.whoc,.stc{min-width:0}
.whoc .stack{justify-content:flex-start}
.pg{display:flex;flex-direction:column;gap:4px;min-width:0}
.pg small{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pg small b{color:var(--ink2);font-weight:600}
.pg.lt{flex-direction:row;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap}
.pg.lt svg.i{width:14px;height:14px;color:var(--muted)}
.pg.lt small{font-weight:500}
.pg.dim{font-size:12.5px;color:var(--faint);white-space:nowrap}
canvas.pb{display:block;image-rendering:pixelated}
canvas.pb.mini{width:84px;height:18px}
canvas.pb.full{width:100%;height:46px}
.tm{display:flex;justify-content:flex-end;align-items:center;min-width:0}
.ago{font-size:12.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.racts{display:none;gap:1px}
.racts .ib{width:30px;height:30px;border-radius:9px}
.racts .ib svg.i{width:15px;height:15px}
.row:hover .racts,.row:focus-within .racts{display:flex}
.row:hover .ago,.row:focus-within .ago{display:none}
@media (hover:none){
  .racts{display:flex}.racts .qa{display:none}
  .row .ago{display:inline}
  .row:hover .ago,.row:focus-within .ago{display:inline}
}
canvas.strip{position:absolute;left:0;right:0;bottom:0;width:100%;height:3px;image-rendering:pixelated;pointer-events:none}

/* fewer columns as the list gets narrower (container queries on .wrap) */
@container list (max-width:1000px){
  .row{grid-template-columns:18px 32px minmax(0,1fr) 140px 164px 92px}
  .whoc{display:none}
}
/* phone / narrow: rows become stacked cards */
@container list (max-width:740px){
  .list{background:transparent;box-shadow:none;overflow:visible;display:flex;flex-direction:column;gap:8px}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"ti tm" "m m";gap:8px 10px;padding:12px 10px 12px 14px;border-top:0;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
  .row:hover{background:var(--raised)}
  .row.on{background:color-mix(in srgb,var(--sunken) 50%,var(--raised))}
  .row>.ck,.selecting .row>.ck{display:none}
  .selecting .row{grid-template-columns:18px minmax(0,1fr) auto;grid-template-areas:"ck ti tm" "ck m m"}
  .selecting .row>.ck{display:inline-flex;grid-area:ck;align-self:start;margin-top:2px}
  .row>.kd{display:none}
  .ti{grid-area:ti}
  .ti small .km{display:inline-flex}
  .tm{grid-area:tm;align-self:start;gap:2px}
  .m2{grid-area:m;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
  .stc{order:-1}
  .whoc{display:block;margin-left:auto}
  .pg{flex-direction:row;align-items:center;gap:8px}
  .racts{display:flex}.racts .qa{display:none}
  .row .ago,.row:hover .ago,.row:focus-within .ago{display:inline}
  .gh{margin-left:2px}
  .mc-h{flex-wrap:wrap}
  .mc-h .t{flex:1 1 calc(100% - 52px)}
  .mc-h .r{width:100%;padding-left:50px;justify-content:space-between}
}

/* ---------- mission cards (Missões tab) ---------- */
.mcs{display:flex;flex-direction:column;gap:12px}
.mc{position:relative;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:16px 16px 12px;cursor:pointer;outline:none;transition:box-shadow .2s var(--out);overflow:hidden;animation:fi .3s var(--out) both}
.mc:hover{box-shadow:var(--e2),var(--top)}
.mc.on{box-shadow:0 0 0 2px var(--ink),var(--top)}
.mc.new{animation:landed .8s var(--spring) both}
.mc-h{display:flex;align-items:flex-start;gap:12px}
.mc-h .t{flex:1;min-width:0}
.mc-h h3{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:650;letter-spacing:-.015em;line-height:1.3;min-width:0}
.mc-h h3 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-h small{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:2px}
.mc-h .r{display:flex;align-items:center;gap:4px}
.lnk{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:0;font:inherit;color:var(--ink2);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;border-radius:4px}
.lnk:hover{text-decoration-color:var(--ink)}
.lnk svg.i{width:13px;height:13px;color:var(--faint)}
.mc-stage{position:relative;margin-top:12px}
.mc-ph{display:grid;font-size:11.5px;color:var(--faint);padding:2px 0 0}
.mc-ph span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;border-left:1px dashed var(--line2)}
.mc-ph span:first-child{border-left:0;padding-left:0}
.mc-ph span.on{color:var(--ink);font-weight:650}
.mc-ph span.done{color:var(--muted)}
.mc-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 0 0}
.pm{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:999px;background:var(--sunken);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;border:0}
button.pm{cursor:pointer}
button.pm:hover{background:color-mix(in srgb,var(--ink) 10%,var(--sunken))}
.pm svg.i{width:13px;height:13px;color:var(--muted)}
.pm .run{color:var(--agent);display:inline-flex}
.pm small{color:var(--faint);font-weight:500;font-size:12px}
.pm.need{background:var(--ink);color:var(--bg)}
.pm.need svg.i{color:var(--bg)}
.pm.need:hover{background:var(--ink);filter:brightness(1.12)}
.pm .on{color:var(--ok);display:inline-flex;align-items:center;gap:4px;font-weight:600}
.pm .off{color:var(--faint);display:inline-flex;align-items:center;gap:4px;font-weight:600}
.mc-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.mc-f .grow{flex:1}

/* ---------- details panel (Rotinas.html) ---------- */
.panel{display:none;padding:12px 12px 12px 0;min-height:0;overflow:auto}
.app.wp .panel{display:block}
.pin{border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:16px;display:flex;flex-direction:column;gap:16px;animation:slidein .32s var(--spring) both;min-height:100%}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ph .grow{flex:1}
.pin h2{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.25;word-break:break-word}
.pin .pmeta{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.pin .pmeta svg.i{width:13px;height:13px;color:var(--faint)}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.pacts .b{flex:1 1 auto}
.ps{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ps h3{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.ps h3 .grow{flex:1}
.ps h3 .by{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.sumy{margin:0;padding:12px 14px;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--ink2);border-radius:14px;background:var(--sunken);line-height:1.5}
.sumy li{display:flex;gap:8px;align-items:flex-start}
.sumy li svg.i{width:13px;height:13px;color:var(--faint);margin-top:4px}
.where-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--sunken);font-size:13.5px;min-width:0;border:0;text-align:left;color:inherit;width:100%}
button.where-row{cursor:pointer}
button.where-row:hover{background:color-mix(in srgb,var(--ink) 7%,var(--sunken))}
.where-row .ic{width:28px;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.where-row .t{flex:1;min-width:0}
.where-row b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-row small{display:block;color:var(--faint);font-size:12px}
.where-row small code{font-size:10.5px;color:var(--ink2)}
.where-row code.f{font-size:11.5px;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-row .tk{font-size:12px;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.where-row .run{color:var(--agent);display:inline-flex}
.optrow{display:flex;align-items:center;gap:12px;font-size:13.5px}
.optrow .t{flex:1;min-width:0}
.optrow small{display:block;color:var(--faint);font-size:12px}
.ppl{display:flex;flex-direction:column;gap:2px}
.ppl div{display:flex;align-items:center;gap:10px;padding:5px 4px;font-size:13.5px;color:var(--ink2)}
.ppl div .t{flex:1;min-width:0}
.ppl small{color:var(--faint);font-size:12px}
.vt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vt li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;position:relative;padding:5px 6px 9px 2px}
.vt li::before{content:"";position:absolute;left:11px;top:25px;bottom:-5px;width:1.5px;background:var(--line2)}
.vt li:last-child::before{display:none}
.vt .node{width:18px;height:18px;border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--ink2);position:relative;z-index:1}
.vt .node svg.i{width:11px;height:11px;stroke-width:2.4}
.vt .node.ok{background:var(--ink);color:var(--bg)}
.vt .node.now{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.vt .node.gate{background:transparent;color:var(--muted)}
.vt .node.gate svg.i{width:13px;height:13px;stroke-width:1.8}
.vt .vh{font-weight:600;font-size:13.5px}
.vt .vn{color:var(--muted);font-size:12.5px;margin-top:1px}
.vt li.g .vh{font-weight:500;font-size:12.5px;color:var(--muted)}
.vt li.g.wait .vh{color:var(--ink);font-weight:650}
.vt .vw{color:var(--faint);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.facts dt{color:var(--faint)}
.facts dd{margin:0;color:var(--ink2)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--sunken);font-size:13px;color:var(--ink2)}
.banner svg.i{width:15px;height:15px;color:var(--muted);margin-top:2px}
.banner b{display:block;font-weight:650;color:var(--ink)}
.banner small{display:block;color:var(--muted);font-size:12.5px}
.pscrim{position:fixed;inset:0;background:var(--scrim);z-index:34;display:none;animation:fi .2s var(--out)}

/* ---------- multi-select bar (Drive.html) ---------- */
.selbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 14px;border-radius:16px;animation:barin .3s var(--spring) both;max-width:calc(100vw - 24px)}
@keyframes barin{from{opacity:0;transform:translate(-50%,16px) scale(.97)}to{opacity:1;transform:translateX(-50%)}}
.selbar .cnt{font-size:13.5px;color:var(--muted);white-space:nowrap;margin-right:6px}
.selbar .cnt b{color:var(--ink);font-weight:650}
.selbar .vsep{width:1px;height:22px;background:var(--line2);margin:0 4px}
body.hasbar .toasts{bottom:84px}

/* ---------- empty states ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 18px 30px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;animation:fi .3s var(--out) both}
.empty .glow{position:relative;width:100%;height:170px;margin-bottom:-10px}
.empty .glow canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.empty .glow .who{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation:bob 1.8s var(--out) infinite alternate}
@keyframes bob{to{transform:translate(-50%,calc(-50% - 7px))}}
.empty>b{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.03em;line-height:1.15}
.empty>p{color:var(--muted);max-width:50ch}
.empty .q-f{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.nores{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 16px;text-align:center;color:var(--muted);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line)}
.nores b{color:var(--ink);font-weight:650}

/* ---------- channel view (ThreadContexto.html messages) ---------- */
.cv{display:flex;flex-direction:column;min-height:0;flex:1}
.phd{display:flex;align-items:center;gap:8px;padding:10px 14px 10px 18px;border-bottom:1px solid var(--line);min-height:58px;flex:none}
.phd .t{flex:1;min-width:0}
.phd h1{font-size:16px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phd h1 svg.i{color:var(--faint)}
.phd small{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phd .back{display:none}
.phd .b .n{color:var(--faint);font-weight:500}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px 18px;min-height:0}
.day{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:650;color:var(--faint);margin:14px 12px 6px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{position:relative;display:flex;gap:12px;padding:10px 12px;border-radius:14px;transition:background .15s;animation:fi .3s var(--out) both}
.msg:hover{background:rgba(127,127,127,.05)}
.msg .av-col{width:34px;flex:none;display:flex;justify-content:center;align-items:flex-start}
.msg .body{flex:1;min-width:0}
.mhdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mt{font-size:12px;color:var(--faint)}
.mx{font-size:14.5px;line-height:1.6;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.tsum{margin-top:8px;display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;padding:6px 10px 6px 6px;border-radius:12px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;color:var(--muted);cursor:pointer;text-align:left;max-width:100%;transition:box-shadow .15s}
.tsum:hover{box-shadow:var(--e2),var(--top)}
.tsum b{color:var(--ink);font-weight:650}
.tsum .chip{height:20px;font-size:11px}
.tline{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;margin:4px 12px;padding:6px 6px 6px 12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--faint);animation:fi .35s var(--out) both}
.tline>svg.i{width:14px;height:14px}
.tline .t{flex:1 1 220px;min-width:0}
.tline b{color:var(--ink2);font-weight:600}
.tline .acts{display:flex;gap:2px}
.cmpw{padding:0 14px 14px;flex:none;position:relative}
.composer{border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);transition:box-shadow .2s var(--out);position:relative}
.composer:focus-within{box-shadow:var(--e3),var(--top)}
.composer textarea{display:block;width:100%;border:0;outline:none;background:transparent;font-size:15px;color:var(--ink);padding:14px 16px 4px;resize:none;line-height:1.5;min-height:48px;max-height:160px}
.composer textarea::placeholder{color:var(--faint)}
.ctools{display:flex;align-items:center;gap:6px;padding:6px 8px 8px 10px;flex-wrap:wrap}
.send{margin-left:auto;height:34px;padding:0 12px;border-radius:11px;border:0;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s var(--spring);flex:none}
.send.off{background:var(--sunken);color:var(--faint);width:34px;padding:0;justify-content:center}
.send.on{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.send.on .kbd{background:rgba(255,255,255,.18)}

/* ---------- menus, popover, dialog, toasts ---------- */
.menu{position:fixed;z-index:80;min-width:240px;max-width:calc(100vw - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both;max-height:calc(100dvh - 24px);overflow:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.mi:hover,.mi.on{background:rgba(127,127,127,.12)}
.mi .sub{color:var(--faint);font-size:12.5px;margin-left:auto;padding-left:10px;white-space:nowrap}
.mi .box{width:18px;height:18px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1.5px var(--line2);display:inline-flex;align-items:center;justify-content:center;color:transparent}
.mi .box svg{width:12px;height:12px;stroke-width:2.6}
.mi[aria-checked="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.mi .tick{margin-left:auto;color:var(--ink);visibility:hidden}
.mi[aria-checked="true"] .tick{visibility:visible}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.mgroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px 4px}
.pop{width:min(400px,calc(100vw - 24px));padding:8px;background:var(--raised)}
.pop-h{display:flex;align-items:baseline;gap:8px;padding:6px 8px 8px}
.pop-h b{font-size:14px;font-weight:650}
.pop-h small{font-size:12.5px;color:var(--faint)}
.pr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px;border-radius:12px;border:0;background:transparent;text-align:left;cursor:pointer;color:inherit}
.pr:hover{background:rgba(127,127,127,.12)}
.pr .kd{width:28px;height:28px;border-radius:9px}
.pr .kd svg.i{width:14px;height:14px}
.pr b{display:block;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr b.un{font-weight:700;color:var(--ink)}
.pr small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-f{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 4px 2px;border-top:1px solid var(--line);margin-top:6px}
.pop-f .grow{flex:1}
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s var(--out) both}
.dlg{width:min(480px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:22px;background:var(--raised);box-shadow:var(--e3),var(--top);padding:18px;animation:popin .28s var(--spring) both}
.dlg.wide{width:min(560px,100%)}
.dlg-h{display:flex;align-items:flex-start;gap:10px}
.dlg-h .t{flex:1;min-width:0}
.dlg h3{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.dlg-h p{color:var(--muted);font-size:13.5px;margin-top:4px}
.fs{padding:14px 0 0}

/* ---------- actions ---------- */
let snapT = null;
const snap = () => { snapT = JSON.parse(JSON.stringify(S.T)); return snapT; };
const restore = (s) => { S.T = JSON.parse(JSON.stringify(s)); for (const t of S.T) if (t.closing) scheduleFinish(t.id); render(); };
const reopenState = (t) => t.wait ? "wait" : running(t) ? "work" : "open";
function doClose(ids, stop = false) {
  const s = snap(); const Ts = ids.map(byId).filter(Boolean);
  for (const t of Ts) { if (stop || !MACH[t.machine]?.online) t.tasks = []; t.before = t.state; t.state = "closed"; t.closing = null; t.unread = 0; t.at = nowMs(); }
  S.sel.clear(); render();
  const one = Ts.length === 1 ? Ts[0] : null;
  toast({ icon: I.check, title: one ? "Thread fechada" : `${Ts.length} threads fechadas`, sub: one ? `Em ${esc(whereTxt(one.where))} vira uma linha. Reabre se alguém responder.${stop ? " Tarefas paradas." : ""}` : "Reabrem sozinhas se alguém responder.", action: { label: "Desfazer", run: () => restore(s) } });
}
function doArchive(ids, stop = false) {
  const s = snap(); const Ts = ids.map(byId).filter(Boolean);
  for (const t of Ts) { if (stop || !MACH[t.machine]?.online) t.tasks = []; t.before = t.state === "archived" ? t.before : t.state; t.state = "archived"; t.closing = null; t.unread = 0; t.follow = false; }
  S.sel.clear(); render();
  toast({ icon: I.archive, ok: false, title: Ts.length === 1 ? "Thread arquivada" : `${Ts.length} threads arquivadas`, sub: "Fora das listas e da busca. Só leitura.", action: { label: "Desfazer", run: () => restore(s) } });

    last: [D.agent, online ? "Li o objetivo. Montando o plano de fases; te chamo no primeiro portão." : "Li o objetivo. Começo o plano quando o computador voltar."], root: [ME, `/mission ${goal}`],
    tasks: [{ name: "Plano da missão", branch: null, started: nowMs() }], machine: D.machine, follow: true,
    origin: { t: "Começou em Nova missão, na tela de Threads", s: `Walter, ${hm(nowMs())}` }, sumBy: D.agent, sumAt: nowMs(),
    summary: [`Objetivo: ${goal}`, `${a.name} está propondo as fases; o plano chega na thread para você aprovar`],
    files: [[".agentes/mission.md", "Objetivo e fases · escrito pelo servidor"]],
    mission: { phases: [{ name: "Plano", est: 1, n: "em andamento" }, { name: "A definir", est: 3, n: "o plano define" }], cur: 0, ahead: .12, gates: ["future"], planning: true }, fresh: true });
  S.dialog = null; S.view = "list"; viewSeg.set("list"); S.tab = "missions"; tabSeg.set("missions"); S.f = { ch: new Set(), ag: new Set(), need: false, mine: false }; S.q = "";
  render(); $("#main").scrollTop = 0;
  toast({ icon: I.flag, title: "Missão criada", sub: `Thread nova em ${esc(whereTxt(where))}. ${esc(a.name)} ${online ? "começou o plano" : "começa quando o computador voltar"}.`, action: { label: "Abrir thread", run: () => act("openthread", id) } });
}
function moveToChannel() {
  const D = S.dialog, t = byId(D.id), s = snap(), name = D.name, from = whereTxt(t.where);
  if (!S.newCh.includes(name) && !CHANNELS.some((c) => c[0] === name)) S.newCh.push(name);
  t.where = ch(name); t.at = nowMs();
  S.dialog = null; render();
  toast({ icon: I.move, title: `#${name} criado`, sub: `“${esc(t.title)}” é o primeiro assunto. Em ${esc(from)} ficou uma linha com o link.`, action: { label: "Desfazer", run: () => { S.newCh = S.newCh.filter((c) => c !== name); restore(s); } } });
}

/* ---------- live: ticking time ---------- */
setInterval(() => { for (const el of $$("[data-tick]")) el.textContent = dur(nowMs() - +el.dataset.tick); }, 1000);
setInterval(() => { for (const el of $$(".ago")) { const row = el.closest("[data-row]"); const t = row && byId(row.dataset.row); if (t) el.textContent = ago(t.at); } }, 30e3);

/* ---------- segmented controls ---------- */
const SEGS = [];
function seg(el, value, on) {
  const pill = el.querySelector(".pill");
  const place = (anim = true) => {
    const b = el.querySelector(`[data-v="${value}"]`); if (!b || !pill) return;
    if (!anim) pill.style.transition = "none";
    pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`;
    if (!anim) { void pill.offsetWidth; pill.style.transition = ""; }
    for (const x of el.querySelectorAll("button[data-v]")) x.setAttribute("aria-pressed", x === b);
  };
  el.onclick = (e) => { const b = e.target.closest("button[data-v]"); if (!b) return; value = b.dataset.v; place(); on(value); };
  place(false); requestAnimationFrame(() => place(false));
  const api = { set(v) { value = v; place(); }, place };
  if (el.isConnected && !el.closest("#dlgRoot")) SEGS.push(api);
  return api;
}
reset();
const tabSeg = seg($("#tabSeg"), "all", (v) => setTab(v));
const viewSeg = seg($("#viewSeg"), "list", (v) => { S.view = v; S.sel.clear(); closeMenu(); render(); });
const dataSeg = seg($("#dataSeg"), "full", (v) => { S.empty = v === "empty"; S.sel.clear(); render(); });
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });
render();
document.fonts?.ready.then(() => { for (const s of SEGS) s.place(false); });
</script>
</body>
