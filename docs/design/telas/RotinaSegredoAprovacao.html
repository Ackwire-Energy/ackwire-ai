<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotina, segredo e aprovação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&family=Doto:ROND,wght@100,600&display=swap">
<script>{const q=new URLSearchParams(location.hash.slice(1));document.documentElement.dataset.theme=q.get("theme")==="dark"?"dark":"light";}</script>
<style>
/*
  Prototype: Rotina, segredo e aprovação. Three flows grounded in what the app already does, on the
  approved design system (Proposta 2, Componentes.dc.html), web chat and phone. The prototype bar
  says, per state, what EXISTS today and what is NOVO.

  1 Rotina a partir da conversa (#view=routine)
    An agent delivered something useful ("Resumo das vendas de ontem", pixel chart in its tones).
    EXISTS: asking in the chat ("faz isso todo dia útil às 9h") makes the agent create the routine
    (schedule/once; posts here, in a channel or in a DM) and answer with when it runs next; the
    Rotinas page on web (Rotinas.html) with list, detail, history and "Rodar agora". Routines can
    also start on events: a new Sentry error, a GitHub PR opened, an issue created, a deploy done.
    NOVO (pequeno): a quiet "Repetir isso…" on an agent message that opens a sheet prefilled from the
    conversation (what, when: presets or one of the existing events, where it posts) and creates the
    routine through the same routines API; the routine card in the chat after creating it.
    NOVO: a routine detail on the phone (the phone has no routines screen; there the chat card is all).
    states: chat · ask (pedindo no chat) · sheet · created · rotinas
  2 Segredo para o computador do agente (#view=secret)
    EXISTS (web): the agent asks for a key in the chat; only the person asked sees a field; the value
    is sealed in the browser and goes straight into the agent's computer as an environment variable
    (or a file). The agent never sees it. Enviar / Recusar, valid for 15 minutes; then the card turns
    into Entregue · Recusado · Expirou · Cancelado. Others see "Só Ana pode responder".
    NOVO (pequeno): the same card on the phone.
    states: ask · delivered · declined · expired · other
  3 Aprovar um envio (#view=approve)
    EXISTS: sensitive connector actions (here: send an e-mail) wait for approval in the chat, with the
    exact values, neutral risk chips (fora da empresa, não dá para desfazer), a pixel fuse until it
    expires, Aprovar envio / Recusar; on the phone a high-risk action takes a hold to approve
    (Aprovacoes.html). "Detalhes" shows the exact values the tool got.
    NOVO (pequeno): a readable summary of what goes out (para, assunto, first lines) built from those
    values, so anyone can decide without reading the raw fields.
    states: pending · details · approved · refused · expired

  The cloud computer appears only as its portrait (where the agent works); it has no screen.
  Deep links: #view=routine|secret|approve&state=…&device=web|phone&theme=light|dark
  Agents come only from packages/ui/src/agent/engine.js, the cloud computer from
  packages/ui/src/computer/portrait.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.74);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --scr:#fbfbf9;--scr2:#f0f0ec;--scr-ink:#2a2a28;--desk:#dcdcd6;
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;--dot:"Doto",monospace;
  --pb:49px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.7);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.55);--scr:#161615;--scr2:#1e1e1c;--scr-ink:#d6d6d2;--desk:#060605;color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
code,.mono{font-family:var(--mono);font-size:.84em;letter-spacing:-.01em}
.doto{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums}

/* ---------- design system bits ---------- */
.b{position:relative;overflow:hidden;font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent;text-decoration:none;flex:none}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.pre:focus-visible,.sel:focus-visible,.mi:focus-visible,.fc:focus-visible,.seg button:focus-visible,.quiet:focus-visible,.workh:focus-visible,.rrow:focus-visible,.sw:focus-visible,.stp:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.b.lg{height:48px;font-size:15.5px;border-radius:14px;padding:0 20px}
.b:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.b>*{position:relative;z-index:1}
.b1.nudge{animation:nudge 1.6s var(--out) infinite}
@keyframes nudge{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 0 0 0 color-mix(in srgb,var(--ink) 40%,transparent)}70%{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 0 0 8px transparent}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 0 0 0 transparent}}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;font-size:12px;font-weight:600;height:26px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s,background .2s,box-shadow .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--raised);box-shadow:var(--e1),var(--top)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.ink{background:var(--ink);color:var(--bg)}
.chip.okc{color:var(--ok)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
.sw{position:relative;width:38px;height:22px;border-radius:999px;border:0;background:var(--line2);cursor:pointer;flex:none;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:var(--bg)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blinkc{50%{opacity:0}}
.spin{animation:spin 1.2s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}

/* agents and people */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .46);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
canvas.pt{display:block;image-rendering:pixelated;flex:none}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);position:relative;z-index:60;background:var(--bg)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .lbl{white-space:nowrap}
@media (max-width:1640px){.proto .lbl{display:none}}

/* ---------- web app frame ---------- */
.app{display:grid;grid-template-columns:64px 240px minmax(0,1fr);height:calc(100vh - var(--pb));position:relative;overflow:hidden}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}
.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.ws{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.sgrp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:14px 8px 4px}
.sit{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:550;border:0;background:transparent;width:100%;cursor:pointer;text-align:left;white-space:nowrap}
.sit:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.sit[aria-current="page"]{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.sit .hs{width:16px;display:inline-flex;justify-content:center;color:var(--faint);font-weight:500}
.sit .end{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);font-weight:600}
.cnt{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:11.5px;letter-spacing:.04em;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg)}
.cnt.soft{background:var(--sunken);color:var(--ink2)}
.main{position:relative;min-width:0;display:flex;flex-direction:column;overflow:hidden}

/* thread */
.th{padding:14px 24px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);flex:none}
.th-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
.th-in .t{flex:1;min-width:0}
.crumb{font-size:12.5px;color:var(--faint)}
.th h1{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.th .who{display:flex;align-items:center}
.th .who>*{margin-left:-6px;box-shadow:0 0 0 2px var(--bg);border-radius:50%}
.feed{flex:1;overflow:auto;overscroll-behavior:contain}
.feed-in{max-width:860px;margin:0 auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:2px}
.day{display:flex;align-items:center;gap:10px;margin:6px 12px 8px;font-size:12px;color:var(--faint);font-weight:600}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}

/* messages */
.msg{display:flex;gap:14px;padding:10px 12px;border-radius:14px;transition:background .15s;animation:fi .3s var(--out) both;min-width:0}
.msg:hover{background:rgba(127,127,127,.04)}
.msg .mav{width:34px;flex:none;display:flex;justify-content:center;align-items:flex-start;padding-top:2px}
.msg .pp{--s:34px}
.mb{flex:1;min-width:0}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mr{font-size:12px;color:var(--faint)}
.mt{font-size:12px;color:var(--faint)}
.mx{font-size:15px;line-height:1.62;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.mx b{color:var(--ink);font-weight:650}
.macts{display:flex;align-items:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.quiet{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:9px;border:0;background:transparent;color:var(--faint);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.quiet:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.quiet svg.i{width:14px;height:14px}
.quiet.done{color:var(--ink2);background:var(--sunken)}

/* suggestion from the agent */
.sug{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 8px 8px 12px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2);font-size:13.5px;color:var(--ink2);max-width:680px;flex-wrap:wrap;animation:fi .4s .1s var(--out) both}
.sug>svg.i{color:var(--faint)}
.sug .t{flex:1 1 220px;min-width:0}
.sug .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* cards */
.card{margin-top:10px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);position:relative;overflow:hidden;max-width:680px}
.ch{display:flex;align-items:center;gap:10px;padding:12px 12px 0 14px}
.ch .ic{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.ch .t{flex:1;min-width:0}
.ch b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch small{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--faint);font-size:12px}
.ch small .tick{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.cb{padding:12px 14px 14px}

/* sales summary */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:12px;background:var(--sunken);min-width:0}
.stat small{display:block;font-size:11.5px;color:var(--faint);font-weight:600}
.stat b{display:block;font-size:19px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.stat span.up{color:var(--ok)}
.chart{margin-top:10px;border-radius:12px;background:var(--sunken);padding:10px 12px 8px}
.chart canvas{display:block;width:100%;height:72px;image-rendering:pixelated}
.chart .ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px}
.top3{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.top3 li{display:flex;align-items:center;gap:10px;padding:6px 4px;font-size:13.5px;color:var(--ink2);border-bottom:1px solid var(--line)}
.top3 li:last-child{border-bottom:0}
.top3 .n{width:20px;height:20px;border-radius:6px;background:var(--sunken);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:650;color:var(--muted);flex:none}
.top3 .q{margin-left:auto;color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.src{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}

/* routine chip (confirmation) */
.rtn{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:560px;flex-wrap:wrap;animation:popin .3s var(--spring) both}
.rtn .ic{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.rtn .t{flex:1 1 200px;min-width:0}
.rtn b{display:block;font-weight:650;font-size:14px;letter-spacing:-.01em}
.rtn small{display:block;color:var(--muted);font-size:12.5px}
.rtn .nx{display:flex;flex-direction:column;align-items:flex-end;font-size:11.5px;color:var(--faint);font-weight:600}
.rtn .nx b{font-size:13.5px;color:var(--ink)}
.rtn .row{display:flex;gap:6px;width:100%;padding-left:48px;flex-wrap:wrap}

.wk-h{display:flex;align-items:center;gap:10px;padding:12px 12px 0 12px}
.wk-h .t{flex:1;min-width:0}
.wk-h b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-h small{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--faint);font-size:12px}
.wk-h small .tick{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.ptbox{width:34px;height:34px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;flex:none}
.wsteps{padding:0 0 8px}
.wstep{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 16px;font-size:13px;color:var(--ink2);animation:fi .25s var(--out) both;min-width:0}
.wstep>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wstep .t{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap;padding-left:8px;font-variant-numeric:tabular-nums}
.wstep.now{color:var(--ink)}
.wstep.todo{color:var(--faint)}
.wstep.you{color:var(--ink)}
.tk{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);flex:none}
.tk svg.i{width:11px;height:11px;stroke-width:2.4}
.tk.now{background:transparent;color:var(--muted)}
.tk.now svg.i{width:16px;height:16px}
.tk.todo{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.tk.wait{background:var(--sunken);color:var(--ink2)}
.tk.wait svg.i{width:11px;height:11px}
.tk.stop{background:var(--sunken);color:var(--faint)}
canvas.strip{position:absolute;left:0;right:0;bottom:0;width:100%;height:3px;image-rendering:pixelated;pointer-events:none}
.sent{display:flex;align-items:center;gap:12px;padding:12px 12px 14px 14px;flex-wrap:wrap}
.sent .ic{width:34px;height:34px;border-radius:11px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.sent .ic.mute{background:var(--sunken);color:var(--muted)}
.sent .t{flex:1 1 200px;min-width:0}
.sent b{display:block;font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.sent small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas.fuse{position:absolute;left:0;right:0;bottom:0;width:100%;height:4px;image-rendering:pixelated;pointer-events:none}
/* ---------- composer ---------- */
.cwrap{padding:8px 24px 18px;flex:none}
.composer{max-width:812px;margin:0 auto;border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px}
.composer .ph{flex:1;color:var(--faint);font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{height:34px;width:34px;border-radius:11px;border:0;display:inline-flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--faint);flex:none}

/* ---------- sheet (Repetir isso) ---------- */
.scrim{position:absolute;inset:0;z-index:30;background:var(--scrim);animation:fade .2s var(--out) both;display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{width:560px;max-width:100%;max-height:100%;overflow:auto;border-radius:22px;background:var(--raised);box-shadow:var(--e3),var(--top);animation:popin .28s var(--spring) both;display:flex;flex-direction:column}
.sh-h{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 4px 20px}
.sh-h .t{flex:1;min-width:0}
.sh-h h2{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.sh-h p{color:var(--muted);font-size:13.5px;margin-top:4px}
.sh-b{padding:10px 20px 4px;display:flex;flex-direction:column;gap:16px}
.fld>label,.fld>.lab{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--ink2);margin-bottom:7px}
.fld>label small,.fld>.lab small{font-weight:500;color:var(--faint)}
.ta{border-radius:14px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.04);padding:10px 12px;transition:box-shadow .15s}
.ta:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ta textarea{all:unset;field-sizing:content;display:block;width:100%;font-size:14.5px;line-height:1.55;color:var(--ink);min-height:68px;white-space:pre-wrap}
.ta .from{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.pres{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pre{display:flex;align-items:center;gap:9px;min-height:42px;padding:8px 12px;border-radius:12px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;text-align:left;font-size:13.5px;font-weight:600;color:var(--ink2);transition:box-shadow .15s,transform .18s var(--spring)}
.pre:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.pre:active{transform:scale(.98)}
.pre svg.i{color:var(--faint)}
.pre[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.pre[aria-checked="true"] svg.i{color:var(--ink)}
.subrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--sunken)}
.step b{min-width:64px;text-align:center;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.step .ib{width:30px;height:30px;border-radius:9px}
.inp{display:flex;align-items:center;gap:9px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.04);flex:1;min-width:0}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp input{all:unset;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.inp input::placeholder{color:var(--faint)}
.inp svg.i{color:var(--faint)}
.sel{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px 6px 8px;border-radius:12px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;text-align:left;font-size:14px}
.sel:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.sel .ic{width:30px;height:30px;border-radius:9px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.sel .t{flex:1;min-width:0}
.sel b{display:block;font-weight:600;font-size:14px}
.sel small{display:block;color:var(--faint);font-size:12px}
.sel>svg.i{color:var(--faint)}
.opts{margin-top:6px;border-radius:14px;padding:4px;background:var(--raised);box-shadow:var(--e2);animation:popin .2s var(--spring) both}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.mi:hover,.mi.on{background:rgba(127,127,127,.1)}
.mi .sub{color:var(--faint);font-size:12.5px;margin-left:auto;padding-left:10px;white-space:nowrap}
.mi>svg.i{color:var(--muted)}
.tog{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink2)}
.tog .t{flex:1;min-width:0}
.tog small{display:block;color:var(--faint);font-size:12px}
.prev{border-radius:14px;background:var(--sunken);padding:12px 14px}
.prev .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prev small{font-size:12px;color:var(--faint);font-weight:600}
.prev b{font-size:15px;font-weight:650;letter-spacing:-.01em}
.prev .lane{position:relative;margin-top:10px}
.prev .lane canvas{display:block;width:100%;height:14px;image-rendering:pixelated}
.prev .lab{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));font-size:11px;color:var(--faint);margin-top:4px;text-align:center}
.prev .lab span:first-child{color:var(--ink2);font-weight:650}
.prev p{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.prev p svg.i{width:13px;height:13px;color:var(--faint)}
.sh-f{display:flex;align-items:center;gap:8px;padding:14px 20px 18px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--raised) 30%)}
.sh-f .grow{flex:1}

/* ---------- Rotinas ---------- */
.rot{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%;min-height:0}
.rot-l{overflow:auto;padding:22px 28px}
.rot-l h1{font-family:var(--display);font-weight:300;font-size:32px;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.rot-l .lead{color:var(--muted);font-size:13.5px;margin-top:4px}
.rlist{margin-top:18px;display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);border:0;text-align:left;cursor:pointer;width:100%;transition:box-shadow .15s}
.rrow:hover{box-shadow:var(--e2),var(--top)}
.rrow[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink),var(--e1)}
.rrow .t{min-width:0}
.rrow b{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
.rrow small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow canvas{width:120px;height:14px;image-rendering:pixelated;display:block}
.rot-d{border-left:1px solid var(--line);overflow:auto;padding:22px 22px 28px;background:color-mix(in srgb,var(--raised) 50%,var(--bg))}
.rot-d .hd{display:flex;align-items:center;gap:12px}
.rot-d h2{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.rot-d .sec{margin-top:18px}
.rot-d .sec>small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:6px}
.rot-d .what{font-size:14px;color:var(--ink2);line-height:1.6}
.rot-d .kv{display:flex;flex-wrap:wrap;gap:6px}
.origin{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sunken);font-size:13.5px;border:0;width:100%;text-align:left;cursor:pointer}
.origin:hover{background:color-mix(in srgb,var(--sunken) 70%,var(--line2))}
.origin .ic{width:28px;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.origin .t{flex:1;min-width:0}
.origin b{display:block;font-weight:600}
.origin small{display:block;color:var(--faint);font-size:12px}
.hist{display:flex;flex-direction:column}
.hist .hr{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.hist .hr:last-child{border-bottom:0}
.hist .hr .t{flex:1;min-width:0}
.hist .hr small{display:block;color:var(--faint);font-size:12px}
.hist .hr .r{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.hist .hr.fut{color:var(--faint)}
.histstrip{margin:4px 0 8px}
.histstrip canvas{width:100%;height:18px;display:block;image-rendering:pixelated}
.histstrip .ax{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:3px}
.rot-d .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;width:360px;max-width:calc(100vw - 24px);animation:popin .25s var(--spring) both;font-size:13.5px}
.toast .tic{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sunken);color:var(--ink2)}
/* ---------- phone frame ---------- */
.phwrap{display:flex;justify-content:center;align-items:flex-start;padding:28px 16px 40px;min-height:calc(100vh - var(--pb))}
.phone{--sans:-apple-system,"SF Pro Text","SF Pro",system-ui,"Segoe UI",sans-serif;--display:-apple-system,"SF Pro Display",system-ui,sans-serif;font-family:var(--sans);width:390px;height:844px;border-radius:56px;position:relative;overflow:hidden;background:var(--bg);box-shadow:0 0 0 11px #1b1b1a,0 0 0 12px #3a3a38,0 40px 80px -30px rgba(0,0,0,.45);flex:none;font-size:16px}
.phone .scr{position:absolute;inset:0;display:flex;flex-direction:column}
.sbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:16px;font-weight:600;letter-spacing:-.01em;position:relative;z-index:3}
.sbar .isl{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.sbar .ri{display:flex;gap:6px;align-items:center}
.sbar .ri svg{width:18px;height:12px;fill:currentColor}
.pnav{flex:none;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding:2px 8px 8px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent)}
.pnav .back{display:flex;align-items:center;color:var(--ink);border:0;background:transparent;height:40px;padding:0;cursor:pointer}
.pnav .back svg.i{width:24px;height:24px;stroke-width:2}
.pnav .tt{text-align:center;min-width:0}
.pnav .tt b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnav .tt small{display:block;font-size:12px;color:var(--faint)}
.phone .feed-in{padding:10px 4px 16px}
.phone .msg{gap:10px;padding:8px 12px}
.phone .msg .mav{width:30px}
.phone .msg .pp{--s:30px}
.phone .mn{font-size:15px}
.phone .mx{font-size:16px;line-height:1.5}
.phone .card,.phone .rtn,.phone .sug{max-width:none}
.phone .stats{gap:6px}
.phone .stat{padding:8px 10px}
.phone .stat b{font-size:16px}
.phone .cwrap{padding:6px 12px 8px}
.phone .composer{border-radius:22px;padding:6px 6px 6px 14px}
.phone .composer .ph{font-size:16px}
.home{height:30px;flex:none;display:flex;align-items:center;justify-content:center}
.home i{width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.9}
.phone .scrim{align-items:flex-end;padding:0}
.phone .sheet{width:100%;max-height:92%;border-radius:22px 22px 0 0;animation:up .32s var(--out) both}
.phone .sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0;flex:none}
.phone .sh-h{padding:10px 16px 2px 18px}
.phone .sh-h h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em}
.phone .sh-b{padding:10px 16px 4px}
.phone .sh-f{padding:12px 16px 30px}
.phone .sh-f .b{flex:1;height:50px;font-size:16px;border-radius:14px}
.phone .pres{grid-template-columns:minmax(0,1fr)}
.phone .ch small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone .stat small{font-size:11px;white-space:nowrap}
.phone .toasts{position:absolute;left:12px;right:12px;bottom:84px;align-items:stretch}
.phone .toast{width:auto}
.phone .rot-p{flex:1;overflow:auto;padding:4px 16px 24px}
.phone .rot-p h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:2px 0 4px}
.phone .rot-d{border:0;padding:0;background:transparent;overflow:visible}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- responsive (web) ---------- */
@media (max-width:1180px){.rot{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-width:1080px){.app{grid-template-columns:64px minmax(0,1fr)}.side{display:none}}
@media (max-width:820px){.rot{grid-template-columns:minmax(0,1fr)}.rot-d{display:none}}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .th{padding:12px 16px 10px}
  .feed-in{padding:12px 4px 16px}
  .msg{gap:10px;padding:10px 12px}
  .msg .mav{width:30px}.msg .pp{--s:30px}
  .cwrap{padding:8px 12px 12px}
  .rrow{grid-template-columns:auto minmax(0,1fr) auto}
  .rrow canvas{display:none}
  .proto{padding:8px 12px}
  .proto .lbl{display:none}
  .pres{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .stat b{font-size:16px}
}
@media (max-width:440px){
  .phwrap{padding:0;min-height:0}
  .phone{width:100vw;height:calc(100vh - var(--pb));border-radius:0;box-shadow:none}
  .phone .sbar{display:none}
  .phone .ctl-bar{padding-top:12px}
  .phone .home{display:none}
}

/* ---------- prototype bar: what exists vs novo ---------- */
.proto .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex:1 1 100%;order:9;min-width:0}
.proto .st .tg{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--sunken);color:var(--ink2);flex:none}
.proto .st .tg.nv{background:var(--ink);color:var(--bg)}
.proto .st span.tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- secret card ---------- */
.scard{margin-top:10px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:560px;padding:12px 14px 14px;animation:popin .3s var(--spring) both}
.scard .hd{display:flex;align-items:center;gap:10px}
.scard .hd .ic{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.scard .hd .t{flex:1;min-width:0;font-size:14px;color:var(--ink2)}
.scard .hd .t b{color:var(--ink);font-weight:650}
.scard .pur{margin-top:8px;font-size:14px;color:var(--ink2);line-height:1.55}
.scard .tgt{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--sunken);font-size:13px;color:var(--muted)}
.scard .tgt code{color:var(--ink);font-size:.82em}
.scard .tgt b{color:var(--ink2);font-weight:600}
.scard form{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.scard label{font-size:12.5px;font-weight:650;color:var(--ink2)}
.scard label code{font-size:.9em}
.scard .inp{flex:none;min-height:42px}
.scard .inp.bad{box-shadow:inset 0 0 0 1.5px var(--danger)}
.scard .help{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;color:var(--muted)}
.scard .help svg.i{width:13px;height:13px;margin-top:3px;color:var(--faint)}
.scard .err{font-size:12.5px;color:var(--danger);font-weight:600}
.scard .row{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.scard .row .grow{flex:1}
.scard .row .until{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:5px}
.scard .row .until svg.i{width:13px;height:13px}
.scard .line{margin-top:8px;font-size:13px;color:var(--muted)}
.scard.done{padding:10px 12px}
.scard.done .tgt{margin-top:8px}
.chip svg.i.ok{color:var(--ok)}
.chip svg.i.no{color:var(--danger)}
.chip svg.i.w{color:var(--warn)}

/* ---------- approval card (Aprovacoes.html) ---------- */
.aq{position:relative;overflow:hidden;margin-top:10px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:620px;padding:12px 14px 16px;animation:popin .3s var(--spring) both}
.aq .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
.aq .meta b{color:var(--ink2);font-weight:650}
.aq .meta .grow{flex:1}
.aq h3{font-size:16px;font-weight:650;letter-spacing:-.015em;margin-top:6px;line-height:1.3}
.rd{margin-top:10px;border-radius:14px;background:var(--sunken);padding:4px 12px 12px}
.rd .fr{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--line);min-width:0}
.rd .fr small{color:var(--faint);font-size:12.5px;font-weight:600}
.rd .fr span{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd .fr span em{font-style:normal;color:var(--faint)}
.rd .paper{position:relative;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;line-height:1.6;color:var(--ink2);max-height:112px;overflow:hidden}
.rd .paper p+p{margin-top:8px}
.rd .paper.open{max-height:none}
.rd .paper:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:48px;background:linear-gradient(transparent,var(--paper));pointer-events:none}
.rd .from{display:flex;align-items:center;gap:8px;padding:6px 0 4px;font-size:12px;color:var(--faint);font-weight:600}
.rd .from .ic{width:22px;height:22px;border-radius:7px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.rd .from .ic svg.i{width:13px;height:13px}

    <h3>Enviar e-mail para ${MAIL.to}</h3>
    ${readableHTML()}
    <div class="tags"><span class="chip">${I.people}Fora da empresa</span><span class="chip">${I.alert.replace('class="i"', 'class="i w"')}Não dá para desfazer</span></div>
    ${st === "details" ? techHTML() : ""}
    <div class="acts">${approve}<button class="b b2 sm" type="button" data-go="approve:refused">Recusar</button><span class="grow"></span><button class="b bg sm" type="button" data-go="approve:${st === "details" ? "pending" : "details"}" aria-expanded="${st === "details"}">${I.info}${st === "details" ? "Esconder detalhes" : "Detalhes"}</button></div>
    <canvas class="fuse" data-d="fuse" data-c="violet" data-rem=".97" aria-hidden="true"></canvas>
  </div>`;
}
function approveFeed() {
  const st = S.state;
  let h = `<div class="day">Hoje</div>`;
  h += msgH("Walter", "9:38", mx(`<b>@Nina</b> responde a Carla do ticket #4821 explicando o atraso e oferece frete grátis na próxima.`));
  h += msgH("nina", "9:39", mx(`Escrevi a resposta. Enviar e-mail para fora da empresa precisa da sua aprovação:`) + approvalCard(), { mode: st === "pending" || st === "details" ? "wait" : st === "approved" ? "done" : "idle" });
  if (st === "approved") h += msgH("nina", "9:41", mx(`Enviado. Marquei o ticket #4821 como respondido e anotei o cupom no cadastro da Carla.`), { mode: "done" });
  if (st === "refused") h += msgH("nina", "9:40", mx(`Ok, não enviei nada. Me diz o que mudar no texto que eu peço de novo.`));
  if (st === "expired") h += msgH("nina", "ontem", mx(`Ninguém aprovou em 24 horas, então não enviei. Se ainda fizer sentido, me peça de novo.`));
  return h;
}

/* ---------- frames ---------- */
function channelOf() { return S.view === "routine" ? "vendas" : "suporte"; }
function feedHTML() { return S.view === "routine" ? routineFeed() : S.view === "secret" ? secretFeed() : approveFeed(); }
function overlayHTML() { return S.view === "routine" && S.state === "sheet" ? sheetHTML() : ""; }
function sideHTML(ch) {
  const waiting = (S.view === "secret" && S.state === "ask") || (S.view === "approve" && (S.state === "pending" || S.state === "details"));
  const it = (k, label, end = "") => `<button class="sit" type="button" ${k === ch ? 'aria-current="page"' : ""}><span class="hs">#</span>${label}<span class="end">${end}</span></button>`;
  return `<div class="ws">${avHTML("theo", 22)}Loja Exemplo</div>
  <div class="sgrp">Canais</div>${it("geral", "geral")}${it("vendas", "vendas", ch !== "vendas" ? `<span class="cnt">2</span>` : "")}${it("suporte", "suporte", waiting ? avHTML("nina", 16, "wait") : "")}${it("produto", "produto")}
  <div class="sgrp">Agentes</div>${["atlas", "nina", "theo"].map((a) => `<button class="sit" type="button">${avHTML(a, 18)}${AGENTS[a].name}<span class="end">${AGENTS[a].role}</span></button>`).join("")}`;
}
function webHTML() {
  const rot = S.view === "routine" && S.state === "rotinas";
  const ch = channelOf();
  const rail = RAIL_ICONS.map(([k, l, d]) => `<button type="button" aria-label="${l}" ${(rot ? k === "rotinas" : k === "chat") ? 'aria-current="page"' : ""}>${sv(d)}</button>`).join("");
  const main = rot ? rotinasWeb() : `<header class="th"><div class="th-in"><div class="t"><div class="crumb">Canal</div><h1>#${ch}</h1></div><div class="who">${ppHTML("Walter", 26)}${avHTML(ch === "vendas" ? "atlas" : "nina", 26)}</div></div></header>
    <div class="feed" id="feed"><div class="feed-in">${feedHTML()}</div></div>
    <div class="cwrap"><div class="composer"><span class="ph">Escreva para #${ch}…</span><span class="send">${I.send}</span></div></div>`;
  return `<div class="app"><nav class="rail" aria-label="App"><span class="logo">${avHTML("theo", 30)}</span>${rail}</nav><aside class="side">${sideHTML(ch)}</aside>
    <section class="main">${main}${overlayHTML()}</section></div>`;
}
const SBAR = () => `<div class="sbar"><span>9:41</span><span class="isl"></span><span class="ri"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2"/><rect x="24" y="4" width="1.5" height="4" rx=".7" opacity=".4"/></svg></span></div>`;
function phoneHTML() {
  const rot = S.view === "routine" && S.state === "rotinas";
  const ch = channelOf();
  let body;
  if (rot) body = `<div class="pnav"><button class="back" type="button" data-go="routine:created" aria-label="Voltar">${I.chevl}</button><div class="tt"><b>Rotina</b></div><span></span></div><div class="rot-p"><div class="rot-d">${rotinasDetail()}</div></div>`;
  else body = `<div class="pnav"><button class="back" type="button" aria-label="Voltar">${I.chevl}</button><div class="tt"><b>#${ch}</b><small>${ch === "vendas" ? "Atlas e 4 pessoas" : "Nina e 3 pessoas"}</small></div><span></span></div>
    <div class="feed" id="feed"><div class="feed-in">${feedHTML()}</div></div>
    <div class="cwrap"><div class="composer"><span class="ph">Mensagem</span><span class="send">${I.send}</span></div></div>`;
  return `<div class="phwrap"><div class="phone"><div class="scr">${SBAR()}${body}<div class="home"><i></i></div></div>${overlayHTML()}<div class="toasts" id="ptoasts"></div></div></div>`;
}

/* ---------- render ---------- */
addEventListener("resize", () => measure());
function measure() { document.documentElement.style.setProperty("--pb", $("#proto").offsetHeight + "px"); }
function protoBar() {
  const seg = (el, items, cur, key) => { el.innerHTML = items.map(([k, l]) => `<button type="button" data-${key}="${k}" aria-pressed="${k === cur}">${l}</button>`).join(""); };
  seg($("#pv"), VIEWS, S.view, "pv");
  seg($("#ps"), STATES[S.view], S.state, "ps");
  seg($("#pd"), [["web", "Web"], ["phone", "Celular"]], S.device, "pd");
  seg($("#pt"), [["light", "Claro"], ["dark", "Escuro"]], S.theme, "pt");
  const [tag, text, nv] = statusOf();
  $("#pst").innerHTML = `<span class="tg${nv ? " nv" : ""}">${tag}</span><span class="tx" title="${esc(text)}">${esc(text)}</span>`;
}
function writeHash() {
  const h = `view=${S.view}&state=${S.state}&device=${S.device}&theme=${S.theme}`;
  if (location.hash.slice(1) !== h) history.replaceState(null, "", "#" + h);
}
function render(opts = {}) {
  document.documentElement.dataset.theme = S.theme;
  protoBar(); measure(); writeHash();
  const stage = $("#stage");
  const feedOld = $("#feed");
  const keep = opts.keepScroll && feedOld ? feedOld.scrollTop : null;
  stage.innerHTML = S.device === "phone" ? phoneHTML() : webHTML();
  hydrate(stage);
  const feed = $("#feed");
  if (feed) feed.scrollTop = keep != null ? keep : feed.scrollHeight;
}
function go(view, state) {
  if (view !== S.view || state !== S.state) { S.secretErr = ""; if (state === "ask") S.secret = ""; }
  S.view = view; S.state = state;
  render();
}

/* ---------- toasts ---------- */
function toast(t, icon = I.check) {
  const host = S.device === "phone" ? $("#ptoasts") : (document.getElementById("toasts") || (() => { const d = document.createElement("div"); d.id = "toasts"; d.className = "toasts"; document.body.append(d); return d; })());
  if (!host) return;
  const el = document.createElement("div");
  el.className = "toast glass"; el.setAttribute("role", "status");
  el.innerHTML = `<span class="tic">${icon}</span><span>${t}</span>`;
  host.append(el);
  setTimeout(() => el.remove(), 2600);
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button,[data-act],[data-go]");
  if (!b || b.dataset.hold) return;
  const d = b.dataset;
  if (d.pv) { go(d.pv, STATES[d.pv][0][0]); return; }
  if (d.ps) { go(S.view, d.ps); return; }
  if (d.pd) { S.device = d.pd; render(); return; }
  if (d.pt) { S.theme = d.pt; render({ keepScroll: true }); return; }
  if (d.go) { const [v, s] = d.go.split(":"); go(v, s); return; }
  if (d.pre) { saveWhat(); S.r.preset = d.pre; S.r.eventOpen = false; render({ keepScroll: true }); return; }
  if (d.where) { S.r.where = d.where; S.r.whereOpen = false; render({ keepScroll: true }); return; }
  if (d.ev) { S.r.event = d.ev; S.r.eventOpen = false; render({ keepScroll: true }); return; }
  switch (d.act) {
    case "open-sheet": go("routine", "sheet"); break;
    case "close-sheet": go("routine", "chat"); break;
    case "close-sheet-bg": if (e.target === b) go("routine", "chat"); break;
    case "create": { saveWhat(); go("routine", "created"); const nr = nextRuns(); toast(`Rotina criada${nr ? ` · próxima ${nr.first.replace("amanhã, qua 21 out", "amanhã")}` : ""}`, I.repeat); break; }
    case "undo-routine": go("routine", "chat"); toast("Rotina apagada", I.undo); break;
    case "run-now": toast("O Atlas está fazendo o resumo agora", I.play); break;
    case "t-": S.r.time = Math.max(6 * 60, S.r.time - 30); render({ keepScroll: true }); break;
    case "t+": S.r.time = Math.min(20 * 60, S.r.time + 30); render({ keepScroll: true }); break;
    case "where": saveWhat(); S.r.whereOpen = !S.r.whereOpen; S.r.eventOpen = false; render({ keepScroll: true }); break;
    case "event": saveWhat(); S.r.eventOpen = !S.r.eventOpen; S.r.whereOpen = false; render({ keepScroll: true }); break;
    case "body": S.bodyOpen = !S.bodyOpen; render({ keepScroll: true }); break;
    case "secret-send": sendSecret(); break;
  }
});
function saveWhat() { const w = $("#what"); if (w) S.r.what = w.value; }
function sendSecret() {
  const v = $("#sv");
  S.secret = v ? v.value : "";
  if (!S.secret) { S.secretErr = "Digite o valor."; render({ keepScroll: true }); setTimeout(() => $("#sv")?.focus({ preventScroll: true }), 30); return; }
  if (new TextEncoder().encode(S.secret).byteLength > 16384) { S.secretErr = "Grande demais (máximo de 16 KB)."; render({ keepScroll: true }); return; }
  S.secret = ""; go("secret", "delivered"); toast("Entregue no computador da Nina", I.lock);
}
document.addEventListener("keydown", (e) => {
  if (e.target.id === "sv" && e.key === "Enter") { e.preventDefault(); sendSecret(); }
  if (e.key === "Escape" && S.state === "sheet") go("routine", "chat");
});
document.addEventListener("input", (e) => { if (e.target.id === "what") S.r.what = e.target.value; if (e.target.id === "sv") S.secret = e.target.value; });

/* hold to approve (high risk, phone): a fill grows while pressed; let go early and nothing happens */
let holdT = null;
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest("[data-hold]"); if (!b) return;
  b.classList.add("pressing");
  holdT = setTimeout(() => { holdT = null; go("approve", "approved"); toast("Aprovado. A Nina está enviando", I.check); }, 1100);
});
const release = () => { if (holdT) { clearTimeout(holdT); holdT = null; const b = $(".hold.pressing"); if (b) { b.classList.remove("pressing"); toast("Segure até completar para aprovar", I.info); } } };
document.addEventListener("pointerup", release);
document.addEventListener("pointercancel", release);

/* ---------- boot from the hash ---------- */
function fromHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  const v = VIEWS.some(([k]) => k === q.get("view")) ? q.get("view") : "routine";
  const st = STATES[v].some(([k]) => k === q.get("state")) ? q.get("state") : STATES[v][0][0];
  S.view = v; S.state = st;
  S.device = q.get("device") === "phone" ? "phone" : "web";
  S.theme = q.get("theme") === "dark" ? "dark" : "light";
}
addEventListener("hashchange", () => { fromHash(); render(); });
fromHash();
render();
</script>
</body>
</html>
