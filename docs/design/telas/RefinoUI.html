<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refino da UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&display=swap">
<script>
  { const h = new URLSearchParams(location.hash.slice(1));
    document.documentElement.dataset.theme = h.get("theme") || "light"; }
</script>
<style>
/*
  Prototype (RefinoUI): three refinements on the web app, shown on the real chat screen and on a control board.
  1. Light mode less gray: the work area is white, the sidebar is a near-white paper, gray stays only in fields
     and in the chosen state.
  2. Agents inside frames: every avatar (agent and person) is a tile of one shape; the agent stands inside it.
     Three frame options to choose from (neutral, the agent's color, the agent's pixel sky).
  3. One control ruler: 3 heights (32 compact, 40 default, 48 large) and one shape (radius = 30% of the
     height: 10/12/14). Buttons, inputs, selects, search, filters, segmented, icon buttons all follow it, so a
     button next to an input always matches. Pills stay only for labels you don't type in (status, counters,
     mentions).
  "Antes" shows today's app (tokens.css + components.css values) for comparison.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root,[data-theme="light"]{
  --bg:#f4f4f1;--side:#f4f4f1;--pane:#efefec;--raised:#fff;--sunken:#ebebe7;
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#6f6f6a;
  --plate:rgba(127,127,127,.1);--plate-soft:rgba(127,127,127,.06);
  --field-bg:color-mix(in srgb,var(--sunken) 40%,var(--raised));--field-line:transparent;
  --chosen:#ffffff;--chosen-shadow:0 1px 2px rgba(23,23,22,.06),0 0 0 1px var(--line);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.1),0 0 0 1px var(--line);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --ok:#1f7a45;--warn:#9a5b00;--danger:#b42a20;
  --guide:rgba(220,60,40,.45);
}
/* Depois, light: white work area, near-white paper sidebar, gray only in fields and chosen states. */
[data-theme="light"][data-v="depois"]{
  --bg:#fbfbfa;--side:#f8f8f6;--pane:#ffffff;--sunken:#f3f3f0;
  --line:rgba(23,23,22,.07);--line2:rgba(23,23,22,.12);
  --field-bg:#ffffff;--field-line:rgba(23,23,22,.13);
  --chosen:#ffffff;--chosen-shadow:0 1px 2px rgba(23,23,22,.07),0 0 0 1px rgba(23,23,22,.09);
}
[data-theme="dark"]{
  --bg:#0f0f0e;--side:#0f0f0e;--pane:#151514;--raised:#1c1c1b;--sunken:#0a0a09;
  --line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.15);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8f8f89;
  --plate:rgba(127,127,127,.14);--plate-soft:rgba(127,127,127,.08);
  --field-bg:color-mix(in srgb,var(--sunken) 40%,var(--raised));--field-line:transparent;
  --chosen:color-mix(in srgb,#fff 7%,var(--raised));--chosen-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.1);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);
  --e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --top:inset 0 1px 0 rgba(255,255,255,.08);
  --ok:#5fc48a;--warn:#e0a84a;--danger:#f08a80;
  --guide:rgba(255,120,100,.5);
}
[data-theme="dark"][data-v="depois"]{--field-line:rgba(255,255,255,.1)}
:root{
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  /* The ruler. */
  --h-sm:32px;--h-md:40px;--h-lg:48px;
  --r-sm:10px;--r-md:12px;--r-lg:14px;
  --px-sm:12px;--px-md:14px;--px-lg:16px;
  --fs-sm:13px;--fs-md:14px;--fs-lg:15px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background .25s}
button,input{font:inherit;color:inherit}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sm .i,.i.s16{width:16px;height:16px}
.lg>.i{width:20px;height:20px}

/* ---------- prototype bar (built with the new controls) ---------- */
.proto{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.proto h1{font:300 20px/1 var(--display);letter-spacing:-.02em;margin-right:auto}
.proto label{font-size:12px;color:var(--faint);margin-right:-8px}

/* ---------- controls: the ruler ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h-md);padding:0 var(--px-md);border-radius:var(--r-md);border:0;background:var(--raised);color:var(--ink);font-size:var(--fs-md);font-weight:550;white-space:nowrap;cursor:pointer;box-shadow:var(--e1),var(--top);transition:transform .2s var(--spring),background-color .15s,box-shadow .15s}
.btn:hover{background:color-mix(in srgb,var(--plate-soft) 100%,var(--raised))}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.fld:focus-within,.seg button:focus-visible,.tog:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 86%,#fff),var(--ink));color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate-soft);color:var(--ink)}
.btn.icon{width:var(--h-md);padding:0}
.btn.sm{height:var(--h-sm);padding:0 var(--px-sm);border-radius:var(--r-sm);font-size:var(--fs-sm);gap:6px}
.btn.sm.icon{width:var(--h-sm);padding:0}
.btn.lg{height:var(--h-lg);padding:0 var(--px-lg);border-radius:var(--r-lg);font-size:var(--fs-lg);gap:10px}
.btn.lg.icon{width:var(--h-lg);padding:0}
.btn.block{width:100%;justify-content:flex-start}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:var(--plate);color:var(--faint);font-size:11px;font-weight:600}
.sm .kbd{min-width:18px;height:18px;font-size:10.5px;border-radius:5px}

.fld{display:flex;align-items:center;gap:8px;height:var(--h-md);padding:0 var(--px-md);border-radius:var(--r-md);background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line),inset 0 1px 2px rgba(23,23,22,.03);color:var(--faint);font-size:var(--fs-md);min-width:0;transition:box-shadow .15s}
.fld:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.fld input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:inherit}
.fld input::placeholder{color:var(--faint)}
.fld.sm{height:var(--h-sm);padding:0 var(--px-sm);border-radius:var(--r-sm);font-size:var(--fs-sm);gap:6px}
.fld.lg{height:var(--h-lg);padding:0 var(--px-lg);border-radius:var(--r-lg);font-size:var(--fs-lg)}
.fld .end{margin-left:auto;display:flex;gap:3px;align-items:center}
.fld.select{cursor:pointer;color:var(--ink)}
.fld.select .end{color:var(--faint)}

/* Segmented: the track is a field of the same height; items sit 4px inside, radius concentric (outer − 4). */
.seg{display:inline-flex;gap:2px;height:var(--h-md);padding:4px;border-radius:var(--r-md);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:100%;padding:0 12px;border:0;border-radius:calc(var(--r-md) - 4px);background:none;color:var(--muted);font-size:var(--fs-sm);font-weight:550;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--chosen);color:var(--ink);box-shadow:var(--chosen-shadow)}
.seg.sm{height:var(--h-sm);padding:3px;border-radius:var(--r-sm)}
.seg.sm button{padding:0 10px;font-size:12.5px;border-radius:calc(var(--r-sm) - 3px)}

/* Filter toggle: a button of the ruler that can stay pressed (no pill). */
.tog{display:inline-flex;align-items:center;gap:6px;height:var(--h-md);padding:0 var(--px-md);border-radius:var(--r-md);border:0;background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line);color:var(--muted);font-size:var(--fs-sm);font-weight:550;cursor:pointer}
.tog.sm{height:var(--h-sm);padding:0 var(--px-sm);border-radius:var(--r-sm)}
.tog[aria-pressed="true"]{background:var(--sunken);color:var(--ink);box-shadow:inset 0 1px 3px rgba(23,23,22,.12),inset 0 0 0 1px var(--line)}
.tog.lg{height:var(--h-lg);padding:0 var(--px-lg);border-radius:var(--r-lg);font-size:var(--fs-md)}
.seg.lg{height:var(--h-lg);border-radius:var(--r-lg)}
.seg.lg button{padding:0 14px;font-size:var(--fs-md);border-radius:calc(var(--r-lg) - 4px)}
.cnt{font-size:12px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}

/* Labels you don't type in nor press: pills. */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--plate);color:var(--muted);font-size:12px;font-weight:550}
.pill .i{width:14px;height:14px}

/* ---------- Antes: today's values ---------- */
[data-v="antes"] .scr .btn{height:40px;border-radius:12px;padding:0 16px}
[data-v="antes"] .scr .btn.sm{height:32px;border-radius:10px}
[data-v="antes"] .scr .btn.lg{height:56px;border-radius:16px;font-size:15px}
[data-v="antes"] .scr .btn.send{width:44px;height:44px;border-radius:999px;background:var(--plate);box-shadow:none;color:var(--faint)}
[data-v="antes"] .scr .fld{background:transparent;box-shadow:none;padding:0 8px;height:40px}
[data-v="antes"] .scr .fld .kbd{border-radius:6px;min-width:26px;height:26px}
[data-v="antes"] .scr .tools .btn{width:36px;height:36px;border-radius:8px}

/* ---------- avatars: one tile for agents and people ---------- */
.av{position:relative;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s)}
.av canvas{display:block;width:100%;height:100%}
.av.framed{border-radius:calc(var(--s) * .3);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.av.framed::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.55);pointer-events:none}
[data-theme="dark"] .av.framed::after{box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.07)}
.av.fa{background:var(--sunken)}
[data-theme="light"][data-v="depois"] .av.fa{background:#f1f1ee}
.av.person{background:var(--plate);color:var(--muted);font-weight:600;font-size:calc(var(--s) * .42);border-radius:50%}
.av.person.framed{border-radius:calc(var(--s) * .3)}
.av.person img{width:100%;height:100%;object-fit:cover}

/* ---------- screen ---------- */
.tabs{display:flex;justify-content:center;padding:16px 16px 0}
.scr{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 140px);min-height:640px;margin:16px;border-radius:20px;overflow:hidden;background:var(--side);box-shadow:var(--e2);transition:background .25s}
.side{display:flex;flex-direction:column;gap:6px;padding:12px;overflow:auto;min-height:0}
.org{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top)}
.org .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(#3bbf8a,#1f8a5c);display:grid;place-items:center;color:#fff}
.org b{display:block;font-size:15px;line-height:1.2}
.org small{color:var(--muted);font-size:12.5px}
.org .grow{flex:1;min-width:0}
.goto{margin:6px 0 4px}
.nav{display:flex;flex-direction:column;gap:1px}
.it{display:flex;align-items:center;gap:10px;height:var(--h-md);padding:0 10px;border-radius:var(--r-md);color:var(--ink2);font-size:14.5px;cursor:pointer}
.it:hover{background:var(--plate-soft)}
.it .i{color:var(--muted)}
.it .meta{margin-left:auto;color:var(--faint);font-size:12.5px}
.it.on{background:var(--chosen);box-shadow:var(--chosen-shadow);font-weight:600}
.it.on .meta{color:var(--ink2);font-weight:550}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;color:var(--faint);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sec .btn{margin-right:-6px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top)}
.me .grow{flex:1;min-width:0}
.me b{font-size:14.5px;display:block}
.bar{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.bar i{flex:1;height:4px;border-radius:2px;background:var(--plate);position:relative;overflow:hidden}
.bar i::before{content:"";position:absolute;inset:0 84% 0 0;background:var(--ink)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--pane);border-left:1px solid var(--line);transition:background .25s}
[data-v="antes"][data-theme="light"] .main{margin:8px 8px 8px 0;border-radius:18px;border:0}
.head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.head .grow{flex:1;min-width:0}
.head b{font-size:19px;font-weight:650;letter-spacing:-.01em}
.head small{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;color:var(--muted);font-size:13.5px}
.head small .i{width:14px;height:14px}
.feed{flex:1;overflow:auto;padding:16px 28px 8px;min-height:0}
.msg{display:grid;grid-template-columns:40px 1fr;gap:12px;max-width:960px;padding:8px 0}
.msg .who{display:flex;align-items:baseline;gap:8px}
.msg .who b{font-size:15px}
.msg .who time{color:var(--faint);font-size:12.5px}
.msg p,.msg li{font-size:15px;line-height:1.6;color:var(--ink2)}
.msg h4{font-size:15px;margin:10px 0 2px}
.msg ul{padding-left:22px;margin:2px 0}
.msg p+p{margin-top:6px}
.work{margin-top:10px;max-width:640px}
.work .btn{width:100%;justify-content:flex-start;color:var(--ink2)}
.compose{padding:8px 20px 18px}
.box{border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:12px 12px 10px}
.box textarea{display:block;width:100%;min-height:44px;resize:none;border:0;background:none;outline:none;padding:4px 6px;font:15px/1.5 var(--sans);color:var(--ink)}
.box textarea::placeholder{color:var(--faint)}
.box .row{display:flex;align-items:center;gap:6px;margin-top:6px}
.tools{display:flex;align-items:center;gap:2px}
.tools .sep{width:1px;height:16px;background:var(--line2);margin:0 4px}
.box .send{margin-left:auto}
.ctx{display:inline-flex;align-items:center;gap:6px;height:var(--h-sm);padding:0 10px 0 4px;border-radius:var(--r-sm);background:var(--plate-soft);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:550}
[data-v="antes"] .ctx{border-radius:999px;height:30px;background:var(--plate)}

/* ---------- board (the ruler) ---------- */
.board{max-width:1180px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--raised);border-radius:20px;box-shadow:var(--e2);padding:24px}
.card h2{font:300 26px/1.15 var(--display);letter-spacing:-.02em}
.card h3{font-size:15px;font-weight:650;margin-bottom:4px}
.card p.lead{color:var(--muted);max-width:68ch;margin-top:6px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.rule{padding:16px;border-radius:14px;background:var(--plate-soft);box-shadow:inset 0 0 0 1px var(--line)}
.rule .num{font:300 32px/1 var(--display);letter-spacing:-.02em}
.rule .num small{font-size:14px;color:var(--faint)}
.rule p{color:var(--muted);font-size:13.5px;margin-top:8px}
.rule dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-top:10px;font-size:12.5px}
.rule dt{color:var(--faint)}
.lanes{overflow-x:auto}
.lane{position:relative;display:flex;align-items:center;gap:8px;width:max-content;min-width:100%;padding:18px 0 18px 64px;border-top:1px solid var(--line)}
.lane>*{flex:none}
.lane:first-of-type{border-top:0}
.lane .tag{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:15px;font-weight:600;line-height:1;color:var(--ink2);font-variant-numeric:tabular-nums}
.lane .tag small{display:block;font:500 11px var(--sans);margin-top:3px}
.lane.guides::before,.lane.guides::after{content:"";position:absolute;left:56px;right:0;height:0;border-top:1px dashed var(--guide);pointer-events:none;opacity:0;transition:opacity .2s}
.lane.guides::before{top:calc(50% - var(--lh) / 2)}
.lane.guides::after{top:calc(50% + var(--lh) / 2)}
.showguides .lane.guides::before,.showguides .lane.guides::after{opacity:1}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.cmp>div{padding:18px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.cmp .lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--faint);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em}
.old-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.old{display:flex;flex-direction:column;align-items:center;gap:6px}
.old em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--danger);font-variant-numeric:tabular-nums}
.new em{color:var(--ok)}
/* Today's controls, drawn with today's numbers. */
.o-btn{height:40px;padding:0 16px;border-radius:12px;background:var(--raised);box-shadow:var(--e1);display:inline-flex;align-items:center;font-size:14px;font-weight:550}
.o-btn.sm{height:32px;border-radius:10px;padding:0 12px;font-size:13px}
.o-btn.big{height:56px;border-radius:16px;padding:0 20px;gap:10px}
.o-in{height:40px;width:170px;padding:0 14px;border-radius:10px;background:color-mix(in srgb,var(--sunken) 40%,var(--raised));box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;color:var(--faint);font-size:15px}
.o-search{height:36px;width:170px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--sunken) 40%,var(--raised));display:flex;gap:6px;align-items:center;color:var(--faint);font-size:13px}
.o-chip{height:36px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--sunken) 40%,var(--raised));display:flex;align-items:center;font-size:13px;color:var(--muted)}
.o-seg{height:36px;padding:3px;border-radius:12px;background:var(--sunken);display:flex}
.o-seg span{height:30px;padding:0 14px;border-radius:9px;display:flex;align-items:center;font-size:13px;color:var(--muted)}
.o-seg span:first-child{background:var(--raised);color:var(--ink);box-shadow:var(--e1)}
.o-send{width:44px;height:44px;border-radius:999px;background:var(--plate);display:grid;place-items:center;color:var(--faint)}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.fopt{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:box-shadow .15s,background .15s}
.fopt:hover{background:var(--plate-soft)}
.fopt[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--ink)}
.fopt .row{display:flex;align-items:flex-end;gap:12px}
.fopt b{font-size:14.5px}
.fopt p{font-size:13px;color:var(--muted);margin-top:2px}
.list{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.form .grp{display:flex;flex-direction:column;gap:6px}
.form label{font-size:13px;font-weight:550;color:var(--ink2)}

const seedOf = (id) => [...id].reduce((s, c) => s + c.charCodeAt(0), 0) % 7;
const skyCache = new Map();
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* The agent's own pixel sky: a Bayer dither from a soft tone (top) to a light one (bottom). */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function skyOf(color, px, dark) {
  const key = `${color}|${px}|${dark}`;
  if (skyCache.has(key)) return skyCache.get(key);
  const [lt, dp] = AGENT_GRADIENTS[color];
  const base = dark ? "#1c1c1b" : "#ffffff";
  const a = dark ? mixHex(dp, base, .78) : mixHex(lt, base, .86);
  const b = dark ? mixHex(dp, base, .55) : mixHex(lt, base, .62);
  const c = document.createElement("canvas");
  c.width = c.height = px;
  const g = c.getContext("2d");
  const n = Math.max(8, Math.round(px / 4)), cell = px / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const t = Math.min(1, Math.max(0, (y / (n - 1)) * 1.15 - .1));
    g.fillStyle = t * 16 > BAYER[(y % 4) * 4 + (x % 4)] ? b : a;
    g.fillRect(Math.floor(x * cell), Math.floor(y * cell), Math.ceil(cell), Math.ceil(cell));
  }
  skyCache.set(key, c);
  return c;
}

function mount(root) {
  for (const el of $$(".avs", root)) {
    const id = el.dataset.a, size = +el.dataset.s, a = AG[id];

    const w = document.createElement("span");
    const fr = el.dataset.f || S.frame;
    w.className = `av ${framed ? `framed f${fr}` : ""}`;
    w.style.setProperty("--s", size + "px");
    w.setAttribute("role", "img");
    w.setAttribute("aria-label", `${a.name}, agente`);
    const cv = document.createElement("canvas");
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = cv.height = Math.round(size * dpr);
    w.append(cv);
    el.replaceWith(w);
    live.push({ cv, a, size, seed: seedOf(id) + Math.random(), mode: el.dataset.m, framed, fr });
  }
}

function draw(t) {
  const dark = S.theme === "dark";
  for (let i = live.length - 1; i >= 0; i--) {
    const it = live[i];
    if (!it.cv.isConnected) { live.splice(i, 1); continue; }
    const g = it.cv.getContext("2d"), s = it.cv.width;
    g.clearRect(0, 0, s, s);
    const acc = it.size >= 26 && it.a.acc;
    let x, y, inner;
    if (it.framed) {
      if (it.fr === "b") {
        const [lt, dp] = AGENT_GRADIENTS[it.a.color];
        g.fillStyle = dark ? mixHex(dp, "#1c1c1b", .7) : mixHex(lt, "#ffffff", .78);
        g.fillRect(0, 0, s, s);
      } else if (it.fr === "c") {
        g.imageSmoothingEnabled = false;
        g.drawImage(skyOf(it.a.color, s, dark), 0, 0, s, s);
      }
      // Standing in the frame: a little room above for the accessory, feet near the bottom edge.
      inner = s * (acc ? .6 : .66);
      x = (s - inner) / 2;
      y = s - inner - s * (acc ? .1 : .14);
    } else {
      inner = s * (acc ? .74 : .86);
      x = (s - inner) / 2; y = s - inner;
    }
    let pose;
    if (REDUCED) pose = {};
    else if (it.mode === "run") { pose = idlePose(t, it.seed, { active: true, expressions: [] }); pose.writing = true; }
    else pose = idlePose(t, it.seed, { every: 14, expressions: ["happy", "wink"] });
    drawAgent(g, x, y, inner, {
      color: it.a.color, eyes: it.a.eyes, cells: it.size <= 32 ? 12 : undefined, pose,
      after: acc ? (gg, side, frame) => drawAccessory(gg, side, it.a.acc, frame, t, it.mode === "run") : undefined,
    });
  }
}
function loop(ms) { draw(ms / 1000); if (!REDUCED) requestAnimationFrame(loop); }

function msgHTML(m, cont, fs) {
  const a = AG[m.who], pp = P[m.who];
  const nova = S.read === "nova";
  const face = a ? av(m.who, fs, m.run ? "run" : "idle") : person(pp.name, fs, pp.img);
  const body = m.run ? `<p class="pending">${m.html}</p>` : m.md ? `<div class="md">${m.html}</div>` : `<p>${m.html}</p>`;
  const work = m.work ? `<div class="work"><button class="btn">${ic("right", "s16")}See what it did<span class="wmeta">${m.work}</span></button></div>` : "";
  const rx = m.rx ? `<div class="rx">${m.rx.map(([e, n, me]) => `<button class="tog sm rxb" aria-pressed="${!!me}">${e}<span class="cnt">${n}</span></button>`).join("")}<button class="btn ghost sm icon rxadd" aria-label="Reagir">${ic("emoji", "s16")}</button></div>` : "";
  const thr = m.thread ? `<button class="btn ghost sm thr">${m.thread.who.map((w) => (AG[w] ? av(w, 20) : person(P[w].name, 20, P[w].img))).join("")}<b>${m.thread.n} respostas</b><span>${m.thread.last}</span></button>` : "";
  const acts = nova && !m.run ? `<div class="acts" role="toolbar" aria-label="Ações da mensagem">
      <button class="btn ghost sm icon" aria-label="Reagir">${ic("emoji", "s16")}</button>
      <button class="btn ghost sm icon" aria-label="Responder em thread">${ic("reply", "s16")}</button>
      <button class="btn ghost sm icon" aria-label="Mais">${ic("more", "s16")}</button></div>` : "";
  return `<div class="msg ${m.who === "walter" ? "mine" : ""} ${cont ? "cont" : ""}" data-id="${m.id}">
    ${cont ? `<time class="ctime">${hm(m.at)}</time>` : face}<div class="mb">
    ${cont ? "" : `<div class="who"><b>${a ? a.name : pp.name}</b><time>${hm(m.at)}</time></div>`}
    ${body}${work}${rx}${thr}</div>${acts}</div>`;
}
// Grouping: the same author within 5 min continues the message above (name and face once).
function feedHTML() {
  const list = S.place === "dm" ? DM : CH, nova = S.read === "nova", fs = nova ? 32 : 40;
  return `<div class="day"><span>Hoje</span></div>` + list.map((m, i) => {
    const prev = list[i - 1];
    const cont = nova && prev && prev.who === m.who && m.at - prev.at <= 5 && !m.run && !prev.run;
    return msgHTML(m, cont, fs);
  }).join("");
}

/* ---------- render ---------- */
function render() {
  const root = document.documentElement;
  root.dataset.theme = S.theme;
  root.dataset.v = S.v;
  root.dataset.read = S.read;
  for (const seg of $$(".proto .seg,.tabs .seg")) for (const b of $$("button", seg)) b.setAttribute("aria-pressed", String(S[seg.dataset.k] === b.dataset.o));
  // Frames only exist in "Depois": show the frames tab with it on.
  const view = $("#view");
  view.innerHTML = S.tab === "tela" ? screen() : S.tab === "regua" ? ruler() : frames();
  if (S.tab === "molduras" && S.v === "antes") { S.v = "depois"; return render(); }
  mount(view);
  $("#lanes")?.classList.add("showguides");
  setupFeed();
  history.replaceState(null, "", `#v=${S.v}&frame=${S.frame}&theme=${S.theme}&tab=${S.tab}&read=${S.read}&place=${S.place}`);
  if (REDUCED) draw(0);
}
/* ---------- the feed: open at the end; a long answer opens at its start ---------- */
let arriveTimer = 0;
function setupFeed() {
  const feed = $(".feed");
  if (!feed) return;
  feed.scrollTop = feed.scrollHeight;
  feed.addEventListener("scroll", syncJump, { passive: true });
  syncJump();
  clearTimeout(arriveTimer);
  if (S.place === "dm" && DM.at(-1).run) arriveTimer = setTimeout(arrive, 2200);
}
function syncJump() {
  const feed = $(".feed"), j = $(".jump");
  if (!feed || !j) return;
  j.hidden = S.read !== "nova" || feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 48;
}
function arrive() {
  if (S.tab !== "tela" || S.place !== "dm") return;
  const m = DM.at(-1);
  Object.assign(m, { run: false, md: true, html: LISA_2, work: "5 passos · 21 s", at: 1155 });
  const feed = $(".feed"), col = $(".feed .col");
  col.innerHTML = feedHTML();
  mount(col);
  if (REDUCED) draw(0);
  const el = $(`.msg[data-id="${m.id}"]`, col);
  if (S.read === "nova") {
    // Land on the first line of the answer (minus a little air), not on its last paragraph.
    const top = el.getBoundingClientRect().top - feed.getBoundingClientRect().top + feed.scrollTop - 12;
    feed.scrollTo({ top: Math.min(top, feed.scrollHeight), behavior: REDUCED ? "auto" : "smooth" });
    el.classList.add("fresh");
  } else feed.scrollTop = feed.scrollHeight;
  setTimeout(syncJump, 450);
}
function replay() { DM = dmStart(); S.place = "dm"; S.tab = "tela"; render(); }

document.addEventListener("click", (e) => {
  if (e.target.closest("#replay")) return replay();
  const go = e.target.closest("[data-go]");
  if (go) { S.place = go.dataset.go; return render(); }
  if (e.target.closest(".jump")) { const f = $(".feed"); f.scrollTo({ top: f.scrollHeight, behavior: REDUCED ? "auto" : "smooth" }); return; }
  const b = e.target.closest(".proto .seg button,.tabs .seg button");
  if (b) { S[b.parentElement.dataset.k] = b.dataset.o; return render(); }
  const f = e.target.closest(".fopt");
  if (f) { S.frame = f.dataset.frame; return render(); }
  if (e.target.closest("#guides")) { const g = $("#guides"); const on = g.getAttribute("aria-pressed") !== "true"; g.setAttribute("aria-pressed", on); $("#lanes").classList.toggle("showguides", on); return; }
  const s = e.target.closest(".seg button");
  if (s) for (const x of $$("button", s.parentElement)) x.setAttribute("aria-pressed", String(x === s));
  const t = e.target.closest(".tog:not(#guides)");
  if (t) t.setAttribute("aria-pressed", String(t.getAttribute("aria-pressed") !== "true"));
});
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.closest(".fopt")) { e.preventDefault(); e.target.click(); } });
render();
if (!REDUCED) requestAnimationFrame(loop);
</script>
