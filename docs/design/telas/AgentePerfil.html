<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil do agente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Doto:ROND,wght@100,600&display=swap">
<style>
/*
  Prototype: the agent page (view and edit an existing agent), same product as NovoAgente.html.
  Cover: the agent alive on its own-color sky, status, key numbers. Tabs: Visão geral, Instruções,
  Ferramentas e acesso, Memória, Atividade, Configurações. Editing is inline, with one sticky save bar.
  Role-aware: admin (everything, money), responsável (look, access, audience, computer; %), membro (read-only, %).
  Deep links: #tab=visao|instrucoes|acesso|memoria|atividade|config
    &role=admin|owner|member  &theme=light  &dirty=1  &state=idle|working|waiting|paused
    &filter=failed|waiting (atividade)  &q=texto (atividade/acesso/memória)  &sec=modelo|orcamento|... (config)
    &dialog=pause|archive  &changes=1 (opens the list of changes)
  Agents come only from the agent engine (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#fff;--sunken:#ebebe7;--glass:rgba(255,255,255,.72);--line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b4352b;--danger-soft:#fbe6e3;
  --agent:#0063d1;--agent-soft:#e3eefd;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 8px 20px -6px rgba(23,23,22,.12),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sky-ink:#04203f;--sky-ink2:rgba(4,32,63,.74);--sky-glass:rgba(241,248,255,.76);--sky-line:rgba(4,32,63,.12);
  --sans:"Onest",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",monospace;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--glass:rgba(30,30,28,.72);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#ef7c70;--danger-soft:#3a1714;
  --agent:#5aa8ff;--agent-soft:#11253f;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";overflow-x:hidden}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
canvas.av{display:block;flex:none}
:focus-visible{outline:2px solid #3d8bff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell: sidebar | page ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:hidden;padding:18px 12px;display:flex;flex-direction:column;gap:14px;background:var(--sunken);border-right:1px solid var(--line);isolation:isolate}
.side canvas.sky{position:absolute;inset:auto 0 0 0;width:100%;height:22%;image-rendering:pixelated;pointer-events:none;z-index:-1}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:300;font-size:20px;letter-spacing:-.02em;padding:0 6px}
.brand i{font-style:normal;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:.62em;color:var(--muted)}
.find{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:11px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);font-size:13px}
.find .kbd{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--plate);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top);font-weight:600}
.nav a .n{margin-left:auto;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;color:var(--muted)}
.nav a .av{margin:-2px 0}
.nav .agent-slot{width:18px;height:18px;display:grid;place-items:center;flex:none}

.page{min-width:0;display:flex;flex-direction:column;align-items:center;padding:0 clamp(16px,3vw,36px) 120px}
.wrap{width:100%;max-width:1080px}
.topbar{display:flex;align-items:center;gap:10px;height:58px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;min-width:0}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:600}
.back{display:none}
.proto{margin-left:auto;display:flex;align-items:center;gap:8px}
.proto .lbl{font-size:12px;color:var(--faint);font-weight:600}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .18s var(--spring)}
.iconbtn:hover{background:var(--plate);color:var(--ink)}
.iconbtn:active{transform:scale(.94)}

/* ---------- Controls (design system v2, as in NovoAgente) ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:-.005em;background:var(--raised);box-shadow:var(--e1),var(--top);white-space:nowrap;transition:transform .18s var(--spring),box-shadow .18s var(--out),filter .15s,background .15s,color .15s}
.btn:hover{box-shadow:var(--e2),var(--top)}
.btn:active{transform:scale(.97) translateY(.5px)}
.btn.primary{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)),var(--ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{color:#fff;background:linear-gradient(180deg,#c9473c,#a8322a);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px -6px rgba(168,50,42,.6)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:30px}
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.22);opacity:.8;box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)}
.card{background:var(--raised);border-radius:20px;box-shadow:var(--e1),var(--top);padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.label .optl{font-weight:500;color:var(--faint);font-size:12px}
.help{color:var(--muted);font-size:12.5px}
.faint{color:var(--faint)}
.err{color:var(--danger);font-size:12.5px;display:flex;gap:6px;align-items:center}
.input{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s}
.input:focus-within{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.input.bad{box-shadow:inset 0 0 0 1px var(--danger)}
.input input{all:unset;flex:1;min-width:0;height:100%}
.input .pre{color:var(--faint);font-weight:600}
.input.locked{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.input.search{height:38px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint)}
.input.search input{color:var(--ink)}
.input.search:focus-within{box-shadow:var(--e1),0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
textarea.ta{width:100%;min-height:300px;resize:vertical;border:0;border-radius:14px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px;line-height:1.65;font-size:15px;outline:none;display:block}
textarea.ta:focus{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;max-width:100%}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.busy{background:var(--agent-soft);color:var(--agent)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.chip .lg{width:13px;height:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tog{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 10px;border-radius:999px;font-weight:600;font-size:13px;background:var(--raised);color:var(--muted);box-shadow:var(--e1),var(--top);transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.tog:hover{color:var(--ink)}
.tog:active{transform:scale(.96)}
.tog .box{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);transition:background .15s}
.tog .box svg{width:11px;height:11px;stroke-width:2.6;opacity:0}
.tog[aria-pressed="true"]{color:var(--ink);box-shadow:0 0 0 1.5px var(--ink),var(--top)}
.tog[aria-pressed="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.tog[aria-pressed="true"] .box svg{opacity:1}
.tog[aria-disabled="true"]{cursor:default}
.tog .sub{color:var(--faint);font-weight:500;font-size:12px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%}
.seg button{all:unset;position:relative;z-index:1;cursor:pointer;height:30px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:hover{color:var(--ink)}
.seg .pill{position:absolute;top:0;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.seg.lv button[aria-pressed="true"][data-l="write"]{color:var(--bg)}
.seg.lv .pill[data-l="write"]{background:var(--ink)}
.seg.lv .pill[data-l="none"]{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.seg.sm button{height:26px;padding:0 10px;font-size:12.5px}
.seg.sm .pill{height:26px}
.seg .cnt{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;color:var(--faint)}
.sel{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px 10px 12px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);width:100%;transition:transform .2s var(--spring),box-shadow .2s}
.sel:hover{transform:translateY(-1px);box-shadow:var(--e2),var(--top)}
.sel:focus-visible{outline:none;box-shadow:var(--e1),var(--top),0 0 0 2px var(--ink)}
.sel.ro{cursor:default;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.sel.ro:hover{transform:none}
.sel .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.sel .t b{font-weight:600;font-size:14px}
.sel .t span{color:var(--muted);font-size:12px}
.sel .chev{color:var(--faint)}
.menu{position:fixed;z-index:60;min-width:240px;max-height:360px;overflow:auto;border-radius:16px;padding:6px;background:color-mix(in srgb,var(--raised) 92%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3);animation:popin .22s var(--spring) both;transform-origin:top left}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:6px 10px;border-radius:10px}
.mi:hover,.mi[data-active]{background:rgba(127,127,127,.13)}
.mi[aria-disabled="true"]{opacity:.5;cursor:default}
.mi .t{flex:1;display:flex;flex-direction:column;line-height:1.3}
.mi .t span{color:var(--faint);font-size:12.5px}
.mi .ck{opacity:0}
.mi[aria-selected="true"] .ck{opacity:1}
.mi.danger{color:var(--danger)}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.pa{width:30px;height:30px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:650;font-size:12px;background:linear-gradient(160deg,#e9e9e5,#d9d9d4);color:#2a2a28}
:root[data-theme="dark"] .pa{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.pa.sm{width:22px;height:22px;font-size:10px}
.pa.xl{width:40px;height:40px;font-size:14px}
.pa.none{background:var(--plate);color:var(--muted)}
.ib{width:30px;height:30px;border-radius:10px 10px 10px 4px;display:grid;place-items:center;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);flex:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--plate);color:var(--muted);font-size:13px}
.note b{color:var(--ink);font-weight:600}
.note svg{margin-top:2px}
.logo{width:36px;height:36px;border-radius:11px 11px 11px 4px;display:grid;place-items:center;flex:none;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
.logo .ic,.lg{display:inline-block;background:var(--c,var(--ink));-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.logo .ic{width:58%;height:58%}
.meter{height:6px;border-radius:99px;background:var(--plate);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--ink)}
.meter.warn i{background:var(--warn)}

/* ---------- Hero: the agent on its own sky ---------- */
.hero{position:relative}
.cover{position:relative;height:208px;border-radius:24px;overflow:hidden;isolation:isolate;box-shadow:var(--e1)}
.cover canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
.cover .agent{position:absolute;left:44px;bottom:0;cursor:pointer}
.cover .agent canvas{display:block}
.state{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:4px 11px 4px 9px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--sky-ink);background:var(--sky-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--sky-line);max-width:calc(100% - 28px)}
.state .sub{font-weight:500;color:var(--sky-ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state .ico{display:inline-flex;color:#0b5bd3}
.state.waiting .ico{color:#8a5100}
.state.paused .ico{color:var(--sky-ink2)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:3px;border-radius:1px;background:#0b5bd3;animation:bar 1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}
@keyframes bar{0%,100%{height:4px}50%{height:12px}}
.stats{position:absolute;right:14px;bottom:14px;display:flex;gap:8px}
.stat{min-width:132px;padding:10px 14px 11px;border-radius:16px;background:var(--sky-glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 1px var(--sky-line),0 10px 24px -14px rgba(4,32,63,.5);color:var(--sky-ink);display:flex;flex-direction:column;gap:2px}
.stat small{font-size:11.5px;font-weight:600;color:var(--sky-ink2);display:flex;align-items:center;gap:5px}
.stat b{font-family:var(--display);font-weight:300;font-size:27px;letter-spacing:-.02em;line-height:1.05}
.stat b em{font-style:normal;font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--sky-ink2);letter-spacing:0;margin-left:4px}
.stat .meter{background:rgba(4,32,63,.12);height:4px;margin-top:5px}
.stat .meter i{background:var(--sky-ink)}
.ident{display:flex;align-items:flex-end;gap:16px;padding:16px 4px 4px;flex-wrap:wrap}
.ident .who{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:6px}
.ident h1{font-family:var(--display);font-weight:300;font-size:44px;letter-spacing:-.03em;line-height:1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ident h1 .handle{font-family:var(--sans);font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted)}
.ident .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ident .acts{display:flex;gap:8px;align-items:center}
.ident .changed-tag{margin-left:2px}

/* ---------- Tabs (sticky, with a mini identity once the cover scrolls away) ---------- */
.tabsbar{position:sticky;top:0;z-index:20;margin:14px -8px 0;padding:0 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.mini{display:flex;align-items:center;gap:8px;max-width:0;opacity:0;overflow:hidden;transition:max-width .35s var(--out),opacity .25s;white-space:nowrap;font-weight:600}
.stuck .mini{max-width:200px;opacity:1;margin-right:6px}
.mini .av{margin:0}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:48px;padding:0 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .badge{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px;border-radius:999px;background:var(--plate);color:var(--muted);font-family:var(--dot);font-variation-settings:"ROND" 100;font-size:11.5px;font-weight:600}
.tab .badge svg{width:11px;height:11px;stroke-width:2}
.tab .badge.edit{background:var(--ink);color:var(--bg)}
.tab .badge.ask{background:var(--warn-soft);color:var(--warn)}

/* ---------- Views ---------- */

.model .h{display:flex;align-items:center;gap:8px}

.model .d{color:var(--muted);font-size:13px}

.people{display:flex;flex-wrap:wrap;gap:8px}
.pc{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.danger-zone{box-shadow:0 0 0 1px color-mix(in srgb,var(--danger) 35%,transparent)}
.dz{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.dz:first-of-type{border-top:0;padding-top:0}

.dz .t{flex:1 1 260px;min-width:0}
.dz .t b{font-weight:600}

.savebar{position:fixed;left:calc(236px + (100vw - 236px) / 2);bottom:18px;transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:40;width:min(720px,calc(100vw - 236px - 40px));display:flex;gap:8px;align-items:center;padding:10px 10px 10px 16px;border-radius:18px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--e3),var(--top);transition:transform .35s var(--spring),opacity .2s}

}

  const where = [...new Set(ch.map((c) => c.label))];
  const bad = Object.values(e)[0];
  bar.innerHTML = `<span class="hint">${bad ? `<span class="err">${I("info", "sm")}${esc(bad)}</span>` : `${I("pen", "sm")}<b>${ch.length} ${ch.length === 1 ? "alteração" : "alterações"}</b><span>${esc(listNames(where.slice(0, 3)))}${where.length > 3 ? " e mais" : ""}</span>`}</span>
    <button class="btn ghost sm" id="popBtn" aria-expanded="${S.popOpen}" style="height:36px">Ver${I(S.popOpen ? "down" : "up", "sm")}</button>
    <button class="btn ghost" data-discard style="height:36px">Descartar</button>
    <button class="btn primary" data-save style="height:36px" ${bad ? 'aria-disabled="true"' : ""}>Salvar<span class="kbd">⌘S</span></button>`;
  if (S.popOpen) showPop(); else closePop();
}
let pop = null;
function closePop() { pop?.remove(); pop = null; }
function showPop() {
  closePop();
  const ch = changes(); if (!ch.length) return;
  pop = document.createElement("div");
  pop.className = "pop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "Alterações não salvas");
  pop.innerHTML = `<div class="ph"><span>O que mudou</span><span class="help">desde o último salvo</span></div>` + ch.map((c) => `<div class="chg"><span class="ib">${I(c.tab === "instrucoes" ? "text" : c.tab === "acesso" ? "plug" : "pen", "sm")}</span><span class="t" data-jump="${c.key}"><b>${esc(c.label)}</b><span>${c.was ? `<s>${esc(c.was)}</s> → ` : ""}${esc(c.now)}</span></span><button class="undo" data-revert="${c.key}">${I("undo", "sm")}Desfazer</button></div>`).join("");
  document.body.append(pop);
  const r = $("#savebar").getBoundingClientRect();
  const w = Math.min(420, innerWidth - 24);
  pop.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + "px";
  pop.style.bottom = innerHeight - r.top + 8 + "px";
}
function toast(msg) {
  const t = $("#toast");
  t.innerHTML = `${I("check", "sm")}${esc(msg)}`; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2400);
}
function renderDialog() {
  $(".scrim")?.remove();
  if (!S.dialog || !isAdmin()) return;
  const s = S.saved, ga = g(s.name);
  const conf = S.dialog === "pause"
    ? { t: `Pausar ${ga.a} ${s.name}?`, p: `${ga.A} ${s.name} para de responder e as 2 rotinas ficam paradas até alguém retomar. Pedidos em andamento terminam antes. Nada é apagado.`, b: `<button class="btn primary" data-confirm="pause">${I("pause", "sm")}Pausar</button>` }
    : { t: `Arquivar ${ga.a} ${s.name}?`, p: `${ga.A} ${s.name} sai da lista de agentes e dos canais, e as rotinas param. Conversas, memória e histórico ficam guardados; um admin pode restaurar depois.`, b: `<button class="btn danger solid" data-confirm="archive">${I("archive", "sm")}Arquivar</button>` };
  const el = document.createElement("div");
  el.className = "scrim";
  el.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">${esc(conf.t)}</h2><p>${esc(conf.p)}</p><div class="row"><button class="btn ghost" data-close>Cancelar</button>${conf.b}</div></div>`;
  document.body.append(el);
  setTimeout(() => $("[data-close]", el)?.focus());
}

/* ================= Render ================= */
function render(opts = {}) {
  closeMenu();
  renderTabs();
  const v = $("#view");
  const y = scrollY;
  v.innerHTML = VIEWS[S.tab]();
  if (!opts.keepAnim) { v.style.animation = "none"; void v.offsetWidth; v.style.animation = ""; }
  hydrate(v);
  bindInputs();
  renderSavebar();
  renderDialog();
  requestAnimationFrame(() => placePills(document));
  if (opts.keepScroll) scrollTo({ top: y });
  setHash();
}
function full() { renderHero(); renderMini(); renderRoleSeg(); renderSide(); render(); }
function renderRoleSeg() {
  $("#roleSeg").innerHTML = seg("viewas", [["admin", "Admin"], ["owner", "Responsável"], ["member", "Membro"]], S.role, 'aria-label="Ver como"', "sm");
  const dark = document.documentElement.dataset.theme === "dark";
  $("#themeBtn").innerHTML = I(dark ? "sun" : "moon");
  $("#themeBtn").setAttribute("aria-label", dark ? "Usar tema claro" : "Usar tema escuro");
  $("#backBtn").innerHTML = I("left");
  requestAnimationFrame(() => placePills($("#roleSeg")));
}
function renderSide() {
  const nav = $("#sideNav");
  const a = (icon, t, n = "", cur = false) => `<a href="#" data-noop ${cur ? 'aria-current="page"' : ""}>${icon}${t}${n ? `<span class="n">${n}</span>` : ""}</a>`;
  nav.innerHTML = a(I("home", "sm"), "Início") + a(I("inbox", "sm"), "Aprovações", "1") + a(I("issue", "sm"), "Issues") + a(I("folder", "sm"), "Drive") + a(I("routine", "sm"), "Rotinas")
    + `<span class="cap">Canais</span>` + ["engenharia", "incidentes", "produto"].map((c) => a(I("hash", "sm"), c)).join("")
    + `<span class="cap">Agentes</span>` + `<a href="#" data-noop aria-current="page"><span class="agent-slot"><span data-av="hero" data-size="16"></span></span>${esc(S.saved.name)}</a>`
    + Object.entries(OTHER_AGENTS).map(([k, o]) => `<a href="#" data-noop><span class="agent-slot"><span data-av="other:${k}" data-size="16"></span></span>${o.name}</a>`).join("")
    + a(I("plus", "sm"), "Novo agente");
  hydrate(nav);
  $("#findIcon").innerHTML = I("search", "sm");
}
function bindInputs() {
  const typing = () => { R.writingUntil = performance.now() + 700; };
  const soft = () => { renderSavebar(); renderTabs(); };
  const instr = $("#instr");
  if (instr) instr.oninput = () => { S.d.instructions = instr.value; typing(); $("#count").textContent = instr.value.length; const card = instr.closest(".card"); const was = card.classList.contains("changed"); const now = S.d.instructions !== S.saved.instructions; if (was !== now) { render({ keepAnim: true, keepScroll: true }); const t = $("#instr"); t.focus(); t.setSelectionRange(instr.selectionStart, instr.selectionStart); } else soft(); };
  const fName = $("#fName"), fRole = $("#fRole"), fBudget = $("#fBudget");
  const rerenderKeep = (el) => { const pos = el.selectionStart, id = el.id; render({ keepAnim: true, keepScroll: true }); const n = $("#" + id); if (n) { n.focus(); n.setSelectionRange(pos, pos); } };
  if (fName) fName.oninput = () => { S.d.name = fName.value; typing(); $("#heroName").textContent = fName.value || S.saved.name; $("#crumbName").textContent = fName.value || S.saved.name; rerenderKeep(fName); };
  if (fRole) fRole.oninput = () => { S.d.role = fRole.value; rerenderKeep(fRole); };
  if (fBudget) fBudget.oninput = () => { S.d.budget = fBudget.value; rerenderKeep(fBudget); };
  for (const [id, key] of [["accQ", "acesso"], ["memQ", "memoria"], ["runQ", "atividade"]]) {
    const el = $("#" + id); if (el) el.oninput = () => { S.q[key] = el.value; rerenderKeep(el); };
  }
}

/* ================= Actions ================= */
function save() {
  const e = errors(); if (Object.keys(e).length) { toast(Object.values(e)[0]); return; }
  const n = changes().length; if (!n) return;
  S.saved = clone(S.d); S.popOpen = false; S.showDiff = false;
  react("happy", 1600, true);
  toast(`Alterações ${g(S.saved.name).da} ${S.saved.name} salvas.`);
  renderHero(); renderMini(); renderSide(); render({ keepScroll: true, keepAnim: true });
}
function discard() { S.d = clone(S.saved); S.popOpen = false; renderHero(); renderMini(); render({ keepScroll: true, keepAnim: true }); }
function goSection(id) {
  S.sec = id;
  if (S.tab !== "config") { S.tab = "config"; render(); }
  else render({ keepAnim: true, keepScroll: true });
  requestAnimationFrame(() => $("#sec-" + id)?.scrollIntoView({ behavior: "smooth", block: "start" }));
}
function setTab(id) { if (!TABS.some((t) => t.id === id)) return; S.tab = id; render(); const top = $("#tabsbar").offsetTop; if (scrollY > top) scrollTo({ top }); }
function look(k, v, expr = "happy", hop = true) { S.d.look[k] = v; react(expr, 1100, hop); render({ keepAnim: true, keepScroll: true }); }

document.addEventListener("click", (e) => {
  if (openMenu && !e.target.closest(".menu") && !e.target.closest("#ownerSel, #keySel, #machineSel, #moreBtn, #pcMenu")) closeMenu();
  if (pop && !e.target.closest(".pop") && !e.target.closest("#popBtn") && !e.target.closest("[data-revert]")) { S.popOpen = false; closePop(); $("#popBtn")?.setAttribute("aria-expanded", "false"); }
  const jump = e.target.closest("[data-jump]");
  if (jump) { const c = changes().find((x) => x.key === jump.dataset.jump); S.popOpen = false; closePop(); if (c.sec) goSection(c.sec); else setTab(c.tab); return; }
  const el = e.target.closest("button, a"); if (!el) return;
  const d = el.dataset;
  if (el.tagName === "A" && el.getAttribute("href") === "#") e.preventDefault();
  if (d.tab) return setTab(d.tab);
  if (d.goto) return goSection(d.goto);
  if ("noop" in d) { el.animate([{ transform: "scale(.97)" }, { transform: "none" }], { duration: 200 }); return; }
  if (el.id === "heroAgent") { react("happy", 1200, true); return; }
  if (el.id === "themeBtn") { const dark = document.documentElement.dataset.theme !== "dark"; document.documentElement.dataset.theme = dark ? "dark" : "light"; renderRoleSeg(); setHash(); return; }
  if (d.viewas) { S.role = d.viewas; S.d = clone(S.saved); S.popOpen = false; S.dialog = null; renderRoleSeg(); renderHero(); renderMini(); render({ keepAnim: true }); return; }
  if ("edit" in d) return goSection("identidade");
  if (el.id === "moreBtn") {
    if (openMenu?.btn === el) return closeMenu();
    const items = [
      { value: "open", label: "Abrir no #engenharia", lead: I("hash", "sm") },
      { value: "mem", label: "Ver memória", lead: I("book", "sm") },
      { value: "runs", label: "Ver execuções", lead: I("pulse", "sm") },
      { value: "copy", label: `Copiar @${S.saved.handle}`, lead: I("copy", "sm") },
      ...(isAdmin() ? [{ sep: true }, { value: "identity", label: "Editar nome e cargo", lead: I("pen", "sm") }, S.paused ? { value: "resume", label: "Retomar", lead: I("play", "sm") } : { value: "pause", label: "Pausar", lead: I("pause", "sm") }, { value: "archive", label: "Arquivar", lead: I("archive", "sm"), danger: true }] : []),
    ];
    return showMenu(el, items, undefined, (v) => {
      if (v === "mem") return setTab("memoria");
      if (v === "runs") return setTab("atividade");
      if (v === "identity") { goSection("identidade"); return setTimeout(() => $("#fName")?.focus(), 350); }
      if (v === "copy") return toast(`@${S.saved.handle} copiado.`);
      if (v === "resume") return resume();
      if (v === "pause" || v === "archive") { S.dialog = v; return renderDialog(); }
      toast("Abrindo #engenharia…");
    }, "right");
  }
  if (el.id === "pcMenu") {
    if (openMenu?.btn === el) return closeMenu();
    const on = S.pc === "running";
    return showMenu(el, [on ? { value: "stop", label: "Desligar", lead: I("power", "sm") } : { value: "start", label: "Ligar", lead: I("play", "sm") }, { sep: true }, { value: "remove", label: "Apagar o PC", sub: "Apaga os arquivos; um novo é criado quando precisar", lead: I("trash", "sm"), danger: true }], undefined, (v) => {
      if (v === "remove") return toast(`PC ${g(S.saved.name).da} ${S.saved.name} apagado.`);
      S.pc = v === "stop" ? "stopped" : "running"; toast(`PC ${g(S.saved.name).da} ${S.saved.name} ${v === "stop" ? "desligado" : "ligado"}.`); render({ keepAnim: true, keepScroll: true });
    }, "right");
  }
  if (el.id === "popBtn") { S.popOpen = !S.popOpen; el.setAttribute("aria-expanded", String(S.popOpen)); S.popOpen ? showPop() : closePop(); renderSavebar(); return; }
  if (d.revert) { revert(d.revert); if (d.revert === "look" || d.revert === "name") { renderHero(); renderMini(); } render({ keepAnim: true, keepScroll: true }); return; }
  if ("save" in d) return save();
  if ("discard" in d) return discard();
  if (d.dialog) { S.dialog = d.dialog; return renderDialog(); }
  if ("close" in d) { S.dialog = null; return renderDialog(); }
  if (d.confirm) {
    S.dialog = null; renderDialog();
    if (d.confirm === "pause") { S.paused = true; toast(`${g(S.saved.name).A} ${S.saved.name} está pausad${g(S.saved.name).a}.`); }
    else toast(`${g(S.saved.name).A} ${S.saved.name} foi arquivad${g(S.saved.name).a}. Dá para restaurar em Agentes.`);
    renderHero(); render({ keepAnim: true, keepScroll: true }); return;
  }
  if ("resume" in d) return resume();
  if ("showdiff" in d) { S.showDiff = !S.showDiff; return render({ keepAnim: true, keepScroll: true }); }
  if (d.tip != null) { const t = TIPS[Number(d.tip)]; S.d.instructions = S.d.instructions.replace(/\s+$/, "") + "\n" + t.text; render({ keepAnim: true, keepScroll: true }); const ta = $("#instr"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); return; }
  if (d.lv) { const [id, l] = d.lv.split(":"); if (l === "custom") return; S.d.levels[id] = l; if (l === "write") react("star", 900); return render({ keepAnim: true, keepScroll: true }); }
  if (d.all) { for (const c of CONNECTORS) S.d.levels[c.id] = d.all; return render({ keepAnim: true, keepScroll: true }); }
  if (d.af) { S.accFilter = d.af; return render({ keepAnim: true, keepScroll: true }); }
  if (d.mt) { S.memTab = d.mt; return render({ keepAnim: true, keepScroll: true }); }
  if (d.rf) { S.runFilter = d.rf; S.runsShown = 9; return render({ keepAnim: true, keepScroll: true }); }
  if ("moreruns" in d) { S.runsShown += 6; return render({ keepAnim: true, keepScroll: true }); }
  if (d.skill) { const k = S.d.skills; k.includes(d.skill) ? k.splice(k.indexOf(d.skill), 1) : k.push(d.skill); return render({ keepAnim: true, keepScroll: true }); }
  if (d.prop) {
    if (d.prop === "accept") { S.proposal = "accepted"; const lines = S.saved.instructions.split("\n"); lines.splice(PROPOSAL.after, 0, PROPOSAL.add); S.saved.instructions = lines.join("\n"); const dl = S.d.instructions.split("\n"); if (S.d.instructions === SAVED0.instructions || true) { dl.splice(PROPOSAL.after, 0, PROPOSAL.add); S.d.instructions = dl.join("\n"); } react("happy", 1600, true); toast("Mudança aceita. As instruções foram atualizadas."); }
    else if (d.prop === "refuse") { S.proposal = "refused"; toast(`Proposta recusada. ${g(S.saved.name).A} ${S.saved.name} guardou o motivo.`); }
    else { S.d.instructions = S.d.instructions.split("\n").toSpliced(PROPOSAL.after, 0, PROPOSAL.add).join("\n"); S.showDiff = true; setTab("instrucoes"); toast("A linha proposta entrou no rascunho. Ajuste e salve."); return; }
    renderTabs(); return render({ keepAnim: true, keepScroll: true });
  }
  if (d.color) return look("color", d.color);
  if (d.eyes) return look("eyes", d.eyes, "wink", false);
  if (d.acc) return look("accessory", d.acc, "happy", d.acc !== "none");
  if ("shuffle" in d) { const pick = (o) => { const k = Object.keys(o); return k[Math.floor(Math.random() * k.length)]; }; S.d.look = { color: pick(COLORS), eyes: pick(EYES), accessory: pick(ACCS) }; react("dizzy", 1000, true); return render({ keepAnim: true, keepScroll: true }); }
  if (d.model) { if (el.getAttribute("aria-disabled")) return; S.d.model = d.model; react(d.model === "opus" ? "star" : "happy", 800); return render({ keepAnim: true, keepScroll: true }); }

  if (d.aud) { S.d.audience = d.aud; return render({ keepAnim: true, keepScroll: true }); }
  if (d.person) { if (el.getAttribute("aria-disabled")) return; const p = S.d.people; p.includes(d.person) ? p.splice(p.indexOf(d.person), 1) : p.push(d.person); return render({ keepAnim: true, keepScroll: true }); }
  if (d.ch) { const c = S.d.channels; c.includes(d.ch) ? c.splice(c.indexOf(d.ch), 1) : c.push(d.ch); return render({ keepAnim: true, keepScroll: true }); }
  if (el.id === "ownerSel") { if (openMenu?.btn === el) return closeMenu(); return showMenu(el, OWNER_ITEMS, S.d.owner, (v) => { S.d.owner = v; S.d.people = S.d.people.filter((p) => p !== v); render({ keepAnim: true, keepScroll: true }); }); }
  if (el.id === "keySel") { if (openMenu?.btn === el) return closeMenu(); return showMenu(el, KEYS.map((k) => ({ value: k.id, label: k.label, sub: k.d, lead: `<span class="ib">${I("key", "sm")}</span>` })), S.d.key, (v) => { S.d.key = v; render({ keepAnim: true, keepScroll: true }); }); }
  if (el.id === "machineSel") {
    if (openMenu?.btn === el) return closeMenu();
    const list = MACHINES.filter((m) => isAdmin() || m.id === "cloud" || m.by === viewer() || m.id === S.d.machine);
    return showMenu(el, list.map((m) => ({ value: m.id, label: m.label, sub: m.d, lead: `<span class="ib">${I(m.id === "cloud" ? "cloud" : "computer", "sm")}</span>` })), S.d.machine, (v) => { S.d.machine = v; render({ keepAnim: true, keepScroll: true }); });
  }
});
function resume() { S.paused = false; toast(`${g(S.saved.name).A} ${S.saved.name} voltou a trabalhar.`); react("happy", 1400, true); renderHero(); render({ keepAnim: true, keepScroll: true }); }
document.addEventListener("keydown", (e) => {
  if (openMenu && openMenu.key(e)) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); return; }
  if (e.key === "Escape") {
    if (S.dialog) { S.dialog = null; renderDialog(); return; }
    if (S.popOpen) { S.popOpen = false; closePop(); renderSavebar(); return; }
  }
  if (e.target.getAttribute?.("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const i = TABS.findIndex((t) => t.id === S.tab), n = TABS[(i + (e.key === "ArrowRight" ? 1 : -1) + TABS.length) % TABS.length];
    setTab(n.id); $(`#tab-${n.id}`).focus();
  }
});
/* The tabs bar shows a mini identity once the cover is out of view. */
new IntersectionObserver(([en]) => $("#tabsbar").classList.toggle("stuck", !en.isIntersecting), { threshold: 0 }).observe($("#hero"));
let lastW = innerWidth;
addEventListener("resize", () => {
  const crossed = [640, 900].some((b) => (lastW <= b) !== (innerWidth <= b));
  lastW = innerWidth;
  if (crossed) renderHero();
  placePills();
  if (S.popOpen) showPop();
});

/* ================= Deep links ================= */
function setHash() {
  const q = new URLSearchParams();
  q.set("tab", S.tab);
  if (S.role !== "admin") q.set("role", S.role);
  if (document.documentElement.dataset.theme === "light") q.set("theme", "light");
  if (S.state !== "working" || S.paused) q.set("state", S.paused ? "paused" : S.state);
  history.replaceState(null, "", "#" + q.toString());
}
function fromHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme") === "light" ? "light" : "dark";
  if (TABS.some((t) => t.id === q.get("tab"))) S.tab = q.get("tab");
  if (["admin", "owner", "member"].includes(q.get("role"))) S.role = q.get("role");
  const st = q.get("state");
  if (st === "paused") S.paused = true; else if (["idle", "working", "waiting"].includes(st)) S.state = st;
  if (q.get("filter")) { if (S.tab === "acesso") S.accFilter = q.get("filter"); else S.runFilter = q.get("filter"); }
  if (q.get("q")) { const k = S.tab === "acesso" ? "acesso" : S.tab === "memoria" ? "memoria" : "atividade"; S.q[k] = q.get("q"); }
  if (q.get("sec")) S.sec = q.get("sec");
  if (q.get("mem")) S.memTab = q.get("mem");
  if (q.get("dirty") === "1" && S.role !== "member") {
    if (S.role === "admin") {
      S.d.instructions = S.d.instructions.replace("Nunca faz merge sozinha: pede revisão de uma pessoa.", "Nunca faz merge sozinha: pede revisão de uma pessoa.\nEm PR que mexe em frete, marca a Marina como revisora.");
      S.d.model = "haiku"; S.d.budget = "80";
    }
    S.d.levels.github = "read"; S.d.levels.cloudflare = "read";
    S.d.look.accessory = S.role === "owner" ? "cap" : S.d.look.accessory;
    if (q.get("diff") === "1") S.showDiff = true;
  }
  if (q.get("changes") === "1") S.popOpen = true;
  if (["pause", "archive"].includes(q.get("dialog"))) S.dialog = q.get("dialog");
}
fromHash();
full();
if (S.tab === "config" && S.sec && S.sec !== "identidade") setTimeout(() => { const el = $("#sec-" + S.sec); if (el) scrollTo(0, el.getBoundingClientRect().top + scrollY - 64); }, 80);
document.fonts?.ready.then(() => placePills());
new ResizeObserver(() => placePills()).observe($("#view"));
</script>
