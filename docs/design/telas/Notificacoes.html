<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notificações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
<style>
/*
  Prototype: Notificações, on the approved design system (Proposta 2) and the line of Aprovacoes.html.
  One inbox for everything that involves me. On top, "Esperando você": what blocks an agent or a decision
  (an agent's question, my turn at a forum table, an approval). Those agents look up at you while they wait.
  Below, the rest by day, grouped by conversation (a thread with several replies is one item that expands;
  reactions to my messages are one quiet item per message and burst). Each item: who, source chip, snippet
  with my mention highlighted, time, unread bar. Inline actions on hover/focus: Responder (mini composer in
  place), Feito (exits), Lembrar depois (frosted menu), Abrir. Keys: J/K, E, R, Enter, Esc.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- design system bits ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{position:relative;overflow:hidden;font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.nb:focus-visible,.mi:focus-visible,.sug button:focus-visible,.more:focus-visible,.seg button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b:disabled{opacity:.45;cursor:default;transform:none;filter:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button:hover{color:var(--ink2)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button .n{font-weight:500;font-size:12px;color:var(--faint);min-width:10px;text-align:left}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.ink{color:var(--ink2)}
.chip .w{color:var(--warn)}.chip .ok{color:var(--ok)}.chip .no{color:var(--danger)}
.chip.late{background:var(--warn-soft);color:var(--warn)}
.chip canvas.orb{width:12px;height:12px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.mono{font-family:"Martian Mono",ui-monospace,monospace;font-size:11.5px}

/* Agents: the engine's body (canvas). People: neutral initials. */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .42);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
canvas.orb{display:inline-block;flex:none;image-rendering:pixelated}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}

/* ---------- app frame (same rail as the other screens) ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 49px)}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}
.rail .badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rail .badge.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.35)}}
.main{min-width:0;padding:26px 28px 120px;max-width:860px;width:100%;margin:0 auto}

.hd{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.hd h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.hd p{color:var(--muted);margin-top:6px;max-width:60ch}
.hd .acts{display:flex;gap:6px;align-items:center}

/* ---------- toolbar ---------- */
.tb{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:18px}
.segwrap{max-width:100%;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.segwrap::-webkit-scrollbar{display:none}
.keys{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--faint);white-space:nowrap}
.keys .sep{width:10px}

/* ---------- section heads ---------- */
.sh{display:flex;align-items:center;gap:8px;margin:0 4px 10px}
.sh h2{font-size:13px;font-weight:650;color:var(--ink2)}
.sh .n{font-size:12.5px;color:var(--faint)}
.grow{flex:1}

/* ---------- "Esperando você": what blocks an agent or a decision ---------- */
.wait{position:relative;border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top);margin-bottom:28px}
.wh{display:flex;align-items:center;gap:12px;padding:14px 16px 13px}
.wh .faces{display:flex;flex:none}
.wh .faces>*{margin-left:-6px;transition:transform .2s var(--spring)}
.wh .faces>*:first-child{margin-left:0}
.wh .faces>*:hover{transform:translateY(-3px)}
.wh .t{flex:1;min-width:0}
.wh h2{font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.wh h2 .n{font-size:12.5px;font-weight:500;color:var(--faint)}
.wh small{display:block;font-size:13px;color:var(--muted)}
.wi{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 14px;padding:14px 16px 16px;border-top:1px solid var(--line);outline:none;overflow:hidden;cursor:pointer;transition:background .15s}
.wi:last-child{border-radius:0 0 20px 20px}
.wi:hover{background:color-mix(in srgb,var(--sunken) 35%,transparent)}
.wi.cur{background:color-mix(in srgb,var(--sunken) 70%,transparent)}
.wi.unread::before,.ni.unread::before{content:"";position:absolute;left:5px;top:16px;width:3px;height:20px;border-radius:3px;background:var(--ink)}
.wi .face{grid-row:1 / span 3;padding-top:2px}
.wi .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);min-width:0}
.wi .meta b{color:var(--ink2);font-weight:600}
.wi h3{font-size:16px;font-weight:650;letter-spacing:-.015em;line-height:1.35;margin-top:3px}
.wi .ctx{font-size:13.5px;color:var(--muted);margin-top:2px}
.wi .body{grid-column:2;display:flex;flex-direction:column;gap:12px;margin-top:10px;min-width:0}
.wi .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wi .acts .ib{width:34px}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.sug button{height:30px;padding:0 12px;border-radius:999px;border:0;background:var(--sunken);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:background .15s,transform .18s var(--spring)}
.sug button:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.sug button:active{transform:scale(.96)}
/* forum seats */
.seats{display:flex;flex-wrap:wrap;gap:6px}
.seat{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:var(--sunken);font-size:12.5px;color:var(--muted);white-space:nowrap}
.seat b{font-weight:600;color:var(--ink2)}
.seat svg.i{width:12px;height:12px}
.seat.me{background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.quote{display:flex;gap:10px;font-size:13.5px;color:var(--ink2);line-height:1.5;min-width:0}
.quote::before{content:"";width:3px;border-radius:3px;background:var(--line2);flex:none}
.quote span{min-width:0}
/* approval: the exact action, briefly */
.exact{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--sunken);min-width:0}
.exact .ic{width:32px;height:32px;border-radius:10px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.exact .t{flex:1;min-width:0}
.exact .t b{display:block;font-size:13.5px;font-weight:600}
.exact .kv{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--muted)}
.exact .kv b{display:inline;font-weight:600;color:var(--ink2);font-size:12.5px}
canvas.fuse{position:absolute;left:0;right:0;bottom:0;width:100%;height:4px;image-rendering:pixelated;pointer-events:none}
.resolved{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2);animation:fi .25s var(--out)}

/* ---------- day groups and items ---------- */
.day{margin-bottom:22px}
.list{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top)}
.ni{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:0 12px;padding:12px 16px 13px;border-top:1px solid var(--line);outline:none;cursor:pointer;transition:background .12s}
.ni:first-child{border-top:0;border-radius:20px 20px 0 0}
.ni:last-child{border-radius:0 0 20px 20px}
.ni:only-child{border-radius:20px}
.ni:hover{background:color-mix(in srgb,var(--sunken) 40%,transparent)}
.ni.cur{background:color-mix(in srgb,var(--sunken) 75%,transparent)}
.ni .who{padding-top:1px}
.ni .c{min-width:0}
.l1{display:flex;align-items:center;gap:6px;min-width:0;font-size:13.5px;color:var(--muted)}
.l1 .what{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .what b{color:var(--ink);font-weight:600}
.ni:not(.unread) .l1 .what b{font-weight:550}
.l1 .tm{margin-left:auto;padding-left:8px;font-size:12px;color:var(--faint);white-space:nowrap;flex:none}
.snip{margin-top:3px;font-size:14px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ni:not(.unread) .snip{color:var(--muted)}
.men{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink);font-weight:600;border-radius:6px;padding:0 4px;margin:0 -1px}
.snip b{font-weight:600;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.replied{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted);min-width:0}
.replied svg.i{width:13px;height:13px;color:var(--ok)}
.replied span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* group: stacked faces, expand */
.stk{position:relative;width:32px;height:32px;display:block}
.stk>*:first-child{position:absolute;left:0;top:0}
.stk>*:nth-child(2){position:absolute;right:-2px;bottom:-2px;border-radius:50%;box-shadow:0 0 0 2px var(--raised)}
.stk>.agw:nth-child(2){border-radius:8px;background:var(--raised)}
.more{display:inline-flex;align-items:center;gap:4px;margin-top:6px;height:26px;padding:0 8px 0 6px;margin-left:-6px;border:0;border-radius:8px;background:transparent;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.more:hover{background:rgba(127,127,127,.12)}
.more svg.i{width:14px;height:14px;transition:transform .25s var(--spring)}
.more[aria-expanded="true"] svg.i{transform:rotate(180deg)}
.reps{margin-top:8px;display:flex;flex-direction:column;border-radius:14px;background:var(--sunken);animation:fi .25s var(--out)}
.rep{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 10px;padding:9px 12px;border-top:1px solid var(--line)}
.rep:first-child{border-top:0}
.rep .rh{display:flex;gap:8px;align-items:baseline;font-size:13px}
.rep .rh b{font-weight:600}
.rep .rh small{font-size:11.5px;color:var(--faint)}
.rep p{font-size:13.5px;color:var(--ink2);line-height:1.5}
/* reactions: quieter */
.ni.rx{padding-top:10px;padding-bottom:11px}
.ni.rx .l1{font-size:13px}
.ni.rx .l1 .what b{font-weight:550}
.emo{position:relative;display:block;width:32px;height:32px;flex:none}
.emo span:nth-child(2){left:10px;top:10px}
.emo span{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--sunken);box-shadow:0 0 0 2px var(--raised);display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
.ni.rx .quote{margin-top:4px;font-size:13px;color:var(--muted)}
.ni.rx .quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* mission / routine steps as a pixel strip */
.steprow{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12.5px;color:var(--muted)}
canvas.track{display:block;image-rendering:pixelated}

/* inline actions: appear on hover / focus (a small floating bar on desktop, a row on phones) */
.na{position:absolute;right:10px;top:7px;display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--raised);box-shadow:var(--e2),var(--top);opacity:0;pointer-events:none;transform:translateY(3px);transition:opacity .15s,transform .2s var(--spring);z-index:2}
.ni:hover .na,.ni:focus-within .na,.ni.cur .na{opacity:1;pointer-events:auto;transform:none}
.ni.replying .na{opacity:0;pointer-events:none}
.nb{position:relative;width:30px;height:30px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:background .15s,color .15s,transform .18s var(--spring)}
.nb:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.nb:active{transform:scale(.92)}
.nb .lb{display:none}
.nb[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:5px 8px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--bg);background:var(--ink);box-shadow:var(--e2);pointer-events:none;animation:fi .15s var(--out);z-index:5}

/* the mini composer, opened in place */
.cmp{margin-top:10px;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--line2);animation:fi .22s var(--out);cursor:auto}
.cmp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cmp textarea{all:unset;display:block;width:100%;min-height:44px;max-height:180px;font-size:14px;line-height:1.5;padding:2px 4px;white-space:pre-wrap;overflow-y:auto;color:var(--ink)}
.cmp textarea::placeholder{color:var(--faint)}
.cmp .row{display:flex;align-items:center;gap:8px}
.cmp .hint{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:4px}

/* exit and entrance */
.leaving{animation:leave .26s var(--out) both;pointer-events:none}
@keyframes leave{to{opacity:0;transform:translateX(28px)}}
.collapse{transition:height .26s var(--out),padding .26s var(--out),border-color .26s;overflow:hidden;border-top-color:transparent !important}
.ni.new,.wi.new{animation:landed .8s var(--spring) both}
.ni.new::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1.5px var(--ink);opacity:0;animation:ring 2.4s var(--out) .2s}
@keyframes ring{15%{opacity:.5}100%{opacity:0}}

      : `<div class="seats">${x.seats.map(seat).join("")}</div>
        <div class="quote"><span><b>${esc(nameOf(x.last[0]))}:</b> ${esc(x.last[1])}</span></div>
        ${S.reply === x.id ? composerHTML(x) : `<div class="acts"><button class="b b1 sm" type="button" data-act="reply" data-id="${x.id}">${I.forum}Falar na mesa</button><button class="b b2 sm" type="button" data-act="pass" data-id="${x.id}">${I.skip}Passar a vez</button><span class="grow"></span>${tail}</div>`}`;
  } else {
    const l = TTL - x.m;
    meta = `<b>${ag.name}</b><span>quer fazer um merge</span>${srcChip(x)}<span>${when(x.m)}</span><span class="grow"></span><span class="chip${l <= 180 ? " late" : ""}">${I.clock}${l <= 180 ? `expira em ${left(l)}` : `${left(l)} para decidir`}</span>`;
    h3 = `<h3>${esc(x.title)}</h3>`;
    body = `<div class="exact"><span class="ic">${I.github}</span><div class="t"><b>${esc(x.conn)}</b><div class="kv">${x.action.map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div></div></div>
      <div class="acts"><button class="b b1 sm" type="button" data-act="open" data-id="${x.id}">${I.shield}Decidir em Aprovações</button><span class="grow"></span>${tail}</div>`;
  }
  return `<article class="${cls}" tabindex="0" data-n="${x.id}" data-wait aria-label="${esc(ag.name)}: ${esc(x.title)}"><span class="face">${avHTML(x.who[0], 40, mode)}</span>
    <div class="meta">${meta}</div><div>${h3}</div><div class="body">${body}</div>${x.kind === "approval" ? `<canvas class="fuse" data-r="${x.id}" aria-hidden="true"></canvas>` : ""}</article>`;
}

/* ---------- render ---------- */
function counts() {
  const L = live();
  return Object.fromEntries(Object.entries(FILTER).map(([k, fn]) => [k, S.empty ? 0 : L.filter(fn).length]));
}
function chrome() {
  const L = S.empty ? [] : live(), c = counts();
  const unread = L.filter((x) => x.unread).length, waiting = L.filter((x) => x.wait).length;
  for (const b of $$("#filters button")) b.querySelector(".n").textContent = c[b.dataset.v] || "";
  segPlace($("#filters"));
  const badge = $("#badge"); const before = badge.textContent;
  badge.textContent = unread || ""; badge.style.display = unread ? "" : "none";
  if (before && +before < unread) { badge.classList.remove("bump"); void badge.offsetWidth; badge.classList.add("bump"); }
  document.title = unread ? `(${unread}) Notificações` : "Notificações";
  $("#sum").textContent = !L.length ? "Nada novo por aqui." : [waiting ? `${waiting} ${waiting === 1 ? "coisa esperando" : "coisas esperando"} você` : "", unread ? `${unread} não ${unread === 1 ? "lida" : "lidas"}` : "tudo lido", S.snoozed ? `${S.snoozed} para mais tarde` : ""].filter(Boolean).join(" · ");
  $("#readall").disabled = !unread;
}
function render() {
  const list = $("#list");
  const L = S.empty ? [] : live();
  const V = L.filter(FILTER[S.f]);
  const W = V.filter((x) => x.wait).sort((a, b) => ["question", "forum", "approval"].indexOf(a.kind) - ["question", "forum", "approval"].indexOf(b.kind));
  const R = V.filter((x) => !x.wait).sort((a, b) => a.m - b.m);
  let html = "";
  if (!L.length) {
    html = `<div class="calm"><div class="glow"><canvas class="sky" aria-hidden="true"></canvas><span class="who">${avHTML("lia", 48, "rest")}</span></div>
      <b>Tudo em dia</b><p>Nada esperando você. Quando alguém te chamar ou um agente precisar de uma resposta, aparece aqui.</p>
      <button class="b bg sm" type="button" data-act="seedone">${I.check}Ver o que já foi feito</button></div>`;
  } else if (!V.length) {
    html = `<div class="nores">${S.f === "wait" ? `${avHTML("lia", 32, "done")}<span>Ninguém está esperando você. Os agentes seguem trabalhando.</span>` : S.f === "unread" ? `${I.check}<span>Tudo lido.</span>` : `${I.check}<span>Nada aqui por enquanto.</span>`}</div>`;
  } else {
    if (W.length) {
      const ags = [...new Set(W.map((x) => x.who[0]))];
      html += `<section class="wait" aria-label="Esperando você"><div class="wh"><span class="faces">${ags.map((a) => avHTML(a, 30, "wait")).join("")}</span>
        <div class="t"><h2>Esperando você<span class="n">${W.length}</span></h2><small>${esc(names(ags, 3))} ${ags.length > 1 ? "estão parados" : `está ${AGENTS[ags[0]].pr === "ela" ? "parada" : "parado"}`} até você responder.</small></div></div>
        ${W.map(waitHTML).join("")}</section>`;
    }
    for (const d of ["Hoje", "Ontem", "Esta semana"]) {
      const xs = R.filter((x) => dayOf(x.m) === d); if (!xs.length) continue;
      const un = xs.filter((x) => x.unread).length;
      html += `<section class="day"><div class="sh"><h2>${d}</h2><span class="n">${un ? `${un} não ${un === 1 ? "lida" : "lidas"}` : xs.length}</span></div><div class="list">${xs.map(rowHTML).join("")}</div></section>`;
    }
    if (S.f === "all") html += `<div class="foot">${I.check}Itens marcados como feitos saem daqui. Nada some sem você.</div>`;
  }
  list.innerHTML = html;
  hydrate(list);
  S.fresh.clear();
  chrome();
  if (S.reply) { const ta = $(`#ta-${S.reply}`); if (ta && document.activeElement !== ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); grow(ta); } }
}
const grow = (ta) => { ta.style.height = "auto"; ta.style.height = Math.min(180, ta.scrollHeight) + "px"; };

/* ---------- actions ---------- */
const byId = (id) => N.find((x) => x.id === id);
const elOf = (id) => $(`[data-n="${id}"]`);
function setCur(id, focus = false) {
  S.cur = id;
  for (const el of $$("[data-n]")) el.classList.toggle("cur", el.dataset.n === id);
  const el = elOf(id);
  if (el && focus) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" }); }
}
function markRead(id) {
  const x = byId(id); if (!x || !x.unread) return;
  x.unread = false; elOf(id)?.classList.remove("unread"); chrome();
  const day = elOf(id)?.closest(".day"); if (day) { const xs = $$("[data-n]", day).map((e) => byId(e.dataset.n)); const un = xs.filter((y) => y.unread).length; $(".sh .n", day).textContent = un ? `${un} não ${un === 1 ? "lida" : "lidas"}` : xs.length; }
}
// Exit: slide out, then fold the space so the list closes up smoothly.
function leave(id, then) {
  const el = elOf(id);
  const next = () => { const all = $$("[data-n]"); const i = all.findIndex((e) => e.dataset.n === id); const nb = all[i + 1] || all[i - 1]; return nb?.dataset.n ?? null; };
  const nextId = next();
  const finish = () => { then(); if (S.cur === id) { S.cur = nextId; } render(); if (S.cur && document.activeElement === document.body) elOf(S.cur)?.focus({ preventScroll: true }); };
  if (!el || REDUCED) return finish();
  el.style.height = el.offsetHeight + "px";
  el.classList.add("leaving");
  setTimeout(() => { el.classList.add("collapse"); el.style.height = "0px"; el.style.paddingTop = el.style.paddingBottom = "0px"; }, 180);
  setTimeout(finish, 450);
}
function done(id) {
  const x = byId(id); if (!x) return;
  if (S.reply === id) S.reply = null;
  leave(id, () => { x.gone = "done"; x.unread = false; });
  const sub = x.kind === "question" ? `${nameOf(x.who[0])} continua esperando; a pergunta segue na thread.` : x.kind === "approval" ? "O pedido continua em Aprovações." : "Saiu da sua caixa.";
  toast({ icon: I.check, title: "Marcado como feito", sub, action: { label: "Desfazer", run: () => { x.gone = null; S.fresh.add(id); render(); } } });
}
function snooze(id, label) {
  const x = byId(id); if (!x) return;
  if (S.reply === id) S.reply = null;
  leave(id, () => { x.gone = "snooze"; S.snoozed++; });
  toast({ icon: I.clock, ok: false, title: `Volto a avisar ${label}`, sub: x.title || stripTxt(x.text || x.quote || ""), action: { label: "Desfazer", run: () => { x.gone = null; S.snoozed--; S.fresh.add(id); render(); } } });
}
const stripTxt = (s) => s.replace(/\*\*/g, "");
function openItem(id) {
  const x = byId(id); if (!x) return;
  markRead(id);
  toast({ icon: x.kind === "approval" ? I.shield : I.open, ok: false, title: `Abrindo ${destOf(x)}`, sub: "No app, leva direto para a mensagem.", ms: 2200 });
}
function startReply(id) {
  const x = byId(id); if (!x || !canReply(x)) return x?.kind === "approval" ? toast({ icon: I.shield, ok: false, title: "Esse pedido se decide em Aprovações", sub: "Abra para ver a ação exata e aprovar.", ms: 2600 }) : undefined;
  S.reply = id; S.cur = id; markRead(id); render();
}
function send(id) {
  const x = byId(id); const ta = $(`#ta-${id}`); const text = ta?.value.trim();
  if (!text) { ta?.focus(); return; }
  S.sending = id; S.drafts[id] = text; render();
  setTimeout(() => {
    S.sending = null; S.reply = null; delete S.drafts[id]; x.unread = false;
    if (x.wait) {
      S.resolving = id; render();
      const face = $(`[data-n="${id}"] .face`); burst(face, AGENTS[x.who[0]].color);
      toast({ icon: x.kind === "forum" ? I.forum : I.reply, title: x.kind === "forum" ? "Sua fala entrou na rodada 2" : `${nameOf(x.who[0])} recebeu sua resposta`, sub: text });
      setTimeout(() => leave(id, () => { S.resolving = null; x.wait = false; x.gone = x.kind === "forum" ? "done" : null; if (!x.gone) { x.kind = "thread"; x.topic = "Release 2.4.1"; x.text = x.title; x.replied = text; x.m = 0; x.reply = false; x.verb = ""; S.fresh.add(id); } }), 1700);
      return;
    }
    x.replied = text; render();
    toast({ icon: I.reply, title: "Resposta enviada", sub: `em ${destOf(x)}`, action: { label: "Ver", run: () => openItem(id) } });
  }, 650);
}
function pass(id) {
  const x = byId(id);
  leave(id, () => { x.gone = "done"; x.unread = false; });
  toast({ icon: I.skip, ok: false, title: "Você passou a vez", sub: `A rodada segue com o Atlas. O ${nameOf(x.who[0])} avisa quando sair a síntese.` });
}
function readAll() {
  const was = live().filter((x) => x.unread);
  if (!was.length) return;
  for (const x of was) x.unread = false;
  render();
  toast({ icon: I.check, title: `${was.length} marcadas como lidas`, sub: "O que espera você continua no topo.", action: { label: "Desfazer", run: () => { for (const x of was) x.unread = true; render(); } } });
}
function add(x) { if (S.empty) { S.empty = false; segSet($("#pstate"), "normal"); } N.unshift(x); S.fresh.add(x.id); render(); }
// A reaction that lands within the window joins the same item instead of making a new one.
function react(id, who, emo) {
  const x = byId(id); if (!x || x.gone) return;
  if (!x.who.includes(who)) x.who.push(who);
  if (!x.emo.includes(emo)) x.emo.push(emo);
  x.unread = true; x.m = 0; x.span += 3;
  render();
  const el = elOf(id); if (el && !REDUCED) { el.classList.add("pulse"); setTimeout(() => el.classList.remove("pulse"), 800); }
}

/* ---------- menus ---------- */
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(anchor, html) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu glass"; m.setAttribute("role", "menu"); m.innerHTML = html;
  document.body.append(m); menuEl = m;
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = Math.min(Math.max(12, r.right - mw), innerWidth - mw - 12) + "px";
  m.style.top = (r.bottom + 6 + mh > innerHeight - 12 ? r.top - mh - 6 : r.bottom + 6) + "px";
  m.querySelector(".mi")?.focus();
}
function snoozeMenu(anchor, id) {
  openMenu(anchor, `<div class="mh">Lembrar de novo</div>
    <button class="mi" type="button" role="menuitem" data-snz="em 1 hora" data-id="${id}">${I.hour}<span>Em 1 hora</span><small>${hhmm(NOW + 60)}</small></button>
    <button class="mi" type="button" role="menuitem" data-snz="amanhã às 9h" data-id="${id}">${I.sun}<span>Amanhã às 9h</span><small>sáb</small></button>
    <button class="mi" type="button" role="menuitem" data-snz="na próxima semana" data-id="${id}">${I.cal}<span>Próxima semana</span><small>seg, 9:00</small></button>`);
}

/* ---------- toasts ---------- */
function toast({ icon = I.check, ok = true, title, sub = "", action, ms = 4200 }) {
  const t = document.createElement("div");
  t.className = "toast glass"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="tic ${ok ? "ok" : ""}">${icon}</span><div class="tt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>${action ? `<button class="b bg sm" type="button">${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { action.run(); dismiss(t); };
  $("#toasts").append(t);
  setTimeout(() => dismiss(t), ms);
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add("out"); setTimeout(() => t.remove(), 200); }

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target;
  if (menuEl && menuEl.contains(t)) { const s = t.closest("[data-snz]"); closeMenu(); if (s) snooze(s.dataset.id, s.dataset.snz); return; }
  if (menuEl && !t.closest('[data-act="snooze"]')) closeMenu();
  const p = t.closest("[data-proto]");
  if (p) { if (p.dataset.proto === "arrive") { const nx = INCOMING.shift(); if (nx) nx(); else toast({ icon: I.check, ok: false, title: "Sem mais notificações na fila do protótipo" }); } return; }
  if (t.closest("#readall")) return readAll();
  if (t.closest("[data-prefs]")) return toast({ icon: I.gear, ok: false, title: "Preferências de notificação", sub: "O que avisa, por onde (app, email) e horário de silêncio.", ms: 2600 });
  const a = t.closest("[data-act]");
  if (a) {
    e.stopPropagation();
    const id = a.dataset.id, act = a.dataset.act;
    if (act === "reply") return startReply(id);
    if (act === "done") return done(id);
    if (act === "snooze") { if (menuEl) return closeMenu(); return snoozeMenu(a, id); }
    if (act === "open") return openItem(id);
    if (act === "pass") return pass(id);
    if (act === "send") return send(id);
    if (act === "cancel") { S.reply = null; return render(); }
    if (act === "sug") { S.drafts[id] = a.dataset.v; return startReply(id); }
    if (act === "expand") { S.open.has(id) ? S.open.delete(id) : S.open.add(id); markRead(id); S.cur = id; render(); elOf(id)?.focus({ preventScroll: true }); return; }
    if (act === "seedone") return toast({ icon: I.check, ok: false, title: "Feitas nos últimos 30 dias", sub: "Abre a lista do que você já resolveu.", ms: 2400 });
    return;
  }
  if (t.closest(".cmp,button,a,textarea,input")) return;
  const row = t.closest("[data-n]");
  if (row) { setCur(row.dataset.n); markRead(row.dataset.n); const x = byId(row.dataset.n); if (x?.reps && x.reps.length > 1 && !S.open.has(x.id) && !row.matches(".wi")) { S.open.add(x.id); render(); elOf(x.id)?.focus({ preventScroll: true }); } }
});
document.addEventListener("input", (e) => { const ta = e.target.closest?.(".cmp textarea"); if (ta) { S.drafts[ta.id.slice(3)] = ta.value; grow(ta); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (menuEl) return closeMenu(); if (S.reply) { const id = S.reply; S.reply = null; render(); elOf(id)?.focus({ preventScroll: true }); } return; }
  const typing = e.target.closest?.("input,textarea,[contenteditable]");
  if (typing) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && S.reply) { e.preventDefault(); send(S.reply); } return; }
  if (menuEl && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); const it = $$(".mi", menuEl); const i = it.indexOf(document.activeElement); it[(i + (e.key === "ArrowDown" ? 1 : -1) + it.length) % it.length].focus(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest?.("button") && (e.key === "Enter" || e.key === " ")) return;
  const items = $$("[data-n]");
  const curEl = e.target.closest?.("[data-n]") || (S.cur && elOf(S.cur));
  const k = e.key.toLowerCase();
  if (k === "j" || k === "k" || e.key === "ArrowDown" && curEl || e.key === "ArrowUp" && curEl) {
    e.preventDefault();
    const i = items.indexOf(curEl), down = k === "j" || e.key === "ArrowDown";
    const n = items[i < 0 ? 0 : Math.max(0, Math.min(items.length - 1, i + (down ? 1 : -1)))];
    if (n) setCur(n.dataset.n, true);
    return;
  }
  const id = curEl?.dataset.n; if (!id) return;
  if (k === "e") { e.preventDefault(); done(id); }
  else if (k === "r") { e.preventDefault(); startReply(id); }
  else if (e.key === "Enter") { e.preventDefault(); openItem(id); }
});

/* ---------- segmented controls ---------- */
function segPlace(el) {
  const pill = el.querySelector(".pill"), b = el.querySelector('[aria-pressed="true"]');
  if (!b) return; pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`;
}
function segSet(el, value) { for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x.dataset.v === value); segPlace(el); }
function seg(el, value, on) {
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; segSet(el, b.dataset.v); on(b.dataset.v); };
  segSet(el, value); requestAnimationFrame(() => segPlace(el));
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });
seg($("#pstate"), "normal", (v) => { S.empty = v === "empty"; S.reply = null; S.cur = null; render(); });
seg($("#filters"), S.f, (v) => { S.f = v; S.cur = null; render(); });
document.fonts?.ready.then(() => { segPlace($("#filters")); segPlace($("#theme")); segPlace($("#pstate")); });
addEventListener("resize", () => segPlace($("#filters")));

$("[data-prefs]").innerHTML = I.gear;
$("#logo").append(makeAgent("lia", 30));
render();
// Live feel: a mention lands a few seconds in; then a reaction joins its burst instead of making a new item.
if (!new URLSearchParams(location.search).has("still")) {
  setTimeout(() => { if (!S.empty) INCOMING.shift()?.(); }, 6000);
  setTimeout(() => { if (!S.empty && INCOMING.length === 2) INCOMING.shift()?.(); }, 13000);
}
const qs = new URLSearchParams(location.search);
if (qs.get("state") === "empty") { S.empty = true; segSet($("#pstate"), "empty"); render(); }
if (qs.get("cur")) setCur(qs.get("cur"));
if (qs.get("reply")) startReply(qs.get("reply"));
if (qs.get("expand")) { S.open.add(qs.get("expand")); render(); }
</script>
</body>
