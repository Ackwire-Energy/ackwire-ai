<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de conectores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&display=swap">
<script>
  { const h = new URLSearchParams(location.hash.slice(1));
    document.documentElement.dataset.theme = h.get("theme") || "light"; }
</script>
<style>
/*
  Prototype (CatalogoConectores): the "Adicionar conector" dialog, redone on the design language
  (RefinoUI tokens, ruler 32/40/48 radius 30%, neutral surfaces, frosted layers, tactile buttons).
  Today's problems: 9 category pills wrap to two lines, every card repeats "Um clique", descriptions
  are cut, the grid has no hierarchy (what's connected, what's suggested), "Another MCP server" is jargon.
  Three directions:
  A · Lista: categories as a list on the left (with counts), rows on the right; one quiet "Conectar".
  B · Galeria: suggestions on top with the brand's own pixel sky, then compact tiles; one-line filters.
  C · Busca e detalhe: search first, a grouped list, and a detail pane that says what agents could do
      before you connect.
  All: how it connects only when it isn't one click ("Precisa de senha", "Chave de API"); connected
  marked with a check on the icon; "Não achou?" connects any service by its address.
  Brand icons: apps/web/public/connectors (Simple Icons, CC0), drawn as a mask in the brand color.
*/
:root,[data-theme="light"]{
  --bg:#fbfbfa;--pane:#ffffff;--raised:#fff;--sunken:#f3f3f0;--side:#f8f8f6;
  --line:rgba(23,23,22,.07);--line2:rgba(23,23,22,.12);--field-line:rgba(23,23,22,.13);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#6f6f6a;
  --plate:rgba(127,127,127,.1);--plate-soft:rgba(127,127,127,.06);
  --chosen:#ffffff;--chosen-shadow:0 1px 2px rgba(23,23,22,.07),0 0 0 1px rgba(23,23,22,.09);
  --glass:rgba(255,255,255,.8);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.1),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.3),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --ok:#1f7a45;--scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0f0f0e;--pane:#151514;--raised:#1c1c1b;--sunken:#0a0a09;--side:#121211;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--field-line:rgba(255,255,255,.14);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8f8f89;
  --plate:rgba(127,127,127,.14);--plate-soft:rgba(127,127,127,.08);
  --chosen:color-mix(in srgb,#fff 7%,var(--raised));--chosen-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.1);
  --glass:rgba(28,28,27,.82);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);
  --e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.08);
  --ok:#5fc48a;--scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)!important}

/* ---------- prototype bar ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--bg);position:relative;z-index:50}
.proto b{color:var(--ink);font-weight:650}
.proto .note{flex-basis:100%;max-width:120ch}
.pseg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.pseg button{height:26px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.pseg button[aria-pressed="true"]{background:var(--chosen);color:var(--ink);box-shadow:var(--chosen-shadow)}

/* ---------- page behind ---------- */
.page{max-width:960px;margin:0 auto;padding:36px 16px;filter:saturate(.9)}
.page h1{font-family:var(--display);font-weight:300;font-size:40px;letter-spacing:-.03em}
.page .ghost{height:64px;border-radius:16px;background:var(--raised);box-shadow:var(--e1);margin-top:10px}

/* ---------- shared bits ---------- */
.scrim{position:fixed;inset:0;top:var(--protoH,0);background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px 16px;z-index:30;animation:fade .2s var(--out)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
.dlg{background:var(--pane);border-radius:24px;box-shadow:var(--e3),var(--top);display:flex;flex-direction:column;overflow:hidden;max-height:100%;animation:pop .24s var(--out);width:100%}
.ib{width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:var(--plate);color:var(--ink)}
.ib:active{transform:scale(.94)}
.b{font-size:13px;font-weight:600;height:32px;padding:0 12px;border-radius:10px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform .18s var(--spring),box-shadow .18s var(--out),filter .15s,background .15s;color:var(--ink);background:transparent;flex:none}
.b:active{transform:scale(.97)}
.b svg.i{width:14px;height:14px}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.b.lg{height:40px;padding:0 16px;font-size:14px;border-radius:12px}
.search{position:relative;flex:1;min-width:0}
.search svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:40px;border-radius:12px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--field-line);padding:0 12px 0 36px;font-size:14px}
.search input:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.search input::placeholder{color:var(--faint)}
.search.big input{height:48px;border-radius:14px;font-size:16px;padding-left:42px}
.search.big svg.i{left:14px;width:18px;height:18px}
.search .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.kbd{font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--plate);color:var(--muted)}
.how{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.how svg.i{width:12px;height:12px}
.done{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.done svg.i{width:14px;height:14px;color:var(--ok)}
.new{font-size:11px;font-weight:650;padding:1px 6px;border-radius:6px;background:var(--plate);color:var(--ink2);margin-left:6px;vertical-align:1px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:650;margin-bottom:4px}

/* connector icon: a neutral tile, the brand mark in its color */
.ci{--s:40px;position:relative;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .3);flex:none;display:grid;place-items:center;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line),var(--top)}
.ci i{width:calc(var(--s) * .5);height:calc(var(--s) * .5);background:var(--c,var(--ink));-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.ci .mono{font-weight:700;font-size:calc(var(--s) * .4);color:var(--ink2)}
.ci svg.i{width:calc(var(--s) * .5);height:calc(var(--s) * .5);color:var(--ink2)}
.ci .ok{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:7px;background:var(--ok);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--pane)}
.ci .ok svg.i{width:11px;height:11px;stroke-width:2.4;color:#fff}

/* ---------- A · Lista ---------- */
.A{max-width:900px;height:min(680px,100%)}
.A .hd{display:flex;align-items:center;gap:12px;padding:18px 18px 14px 22px;border-bottom:1px solid var(--line)}
.A .hd h2{font-size:18px;font-weight:650;letter-spacing:-.015em;white-space:nowrap}
.A .body{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0;flex:1}
.A nav{background:var(--side);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.A nav .sep{height:1px;background:var(--line);margin:8px 6px}
.A nav button{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font-size:14px;cursor:pointer;text-align:left;width:100%}
.A nav button:hover{background:var(--plate-soft)}
.A nav button[aria-current="true"]{background:var(--chosen);box-shadow:var(--chosen-shadow);color:var(--ink);font-weight:600}
.A nav button svg.i{color:var(--muted)}
.A nav button .n{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.A .list{overflow-y:auto;padding:6px 10px 16px}
.A .sh{position:sticky;top:0;z-index:1;background:color-mix(in srgb,var(--pane) 92%,transparent);backdrop-filter:blur(8px);font-size:12.5px;font-weight:650;color:var(--muted);padding:12px 10px 6px}
.A .row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer;transition:background .12s}
.A .row:hover,.A .row:focus-within{background:var(--plate-soft)}
.A .row .t{flex:1;min-width:0}
.A .row .t b{font-weight:600;font-size:14.5px}
.A .row .t p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.A .row .r{display:flex;align-items:center;gap:10px}
.A .row .go{opacity:0;transition:opacity .12s}
.A .row:hover .go,.A .row:focus-within .go{opacity:1}
@media (hover:none){.A .row .go{opacity:1}}
.A .other{display:flex;align-items:center;gap:12px;margin:10px 10px 0;padding:14px;border-radius:16px;background:var(--side);box-shadow:inset 0 0 0 1px var(--line)}
.A .other .t{flex:1}
.A .other .t b{font-weight:600}
.A .other .t p{font-size:13px;color:var(--muted)}

/* ---------- B · Galeria ---------- */
.B{max-width:960px;height:min(720px,100%)}
.B .hd{padding:24px 28px 0}
.B .hd .l1{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.B .hd h2{font-family:var(--display);font-weight:300;font-size:30px;letter-spacing:-.03em;flex:1;white-space:nowrap}
.B .hd .search{max-width:340px}
.B .filters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 18px;margin:0 -2px}
.B .filters::-webkit-scrollbar{display:none}
.B .filters button{height:32px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.B .filters button:hover{color:var(--ink);background:var(--plate-soft)}
.B .filters button[aria-pressed="true"]{background:var(--chosen);color:var(--ink);box-shadow:var(--chosen-shadow)}
.B .filters button .n{font-weight:500;color:var(--faint);font-size:12px}
.B .scroll{overflow-y:auto;padding:24px 28px 32px;border-top:1px solid var(--line)}
.B h3{font-size:13px;font-weight:650;color:var(--ink2);margin:0 2px 12px}
.B .feat+h3{margin-top:32px}
.B .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.B .fc{position:relative;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden;cursor:pointer;text-align:left;border:0;padding:0;display:flex;flex-direction:column;transition:box-shadow .18s,transform .2s var(--spring)}
.B .fc:hover{box-shadow:var(--e2),var(--top);transform:translateY(-2px)}
.B .fc canvas{display:block;width:100%;height:72px;image-rendering:pixelated}
.B .fc .ci{position:absolute;left:20px;top:48px;--s:48px;box-shadow:inset 0 0 0 1px var(--line),var(--e1)}
.B .fc .tx{padding:34px 20px 20px}
.B .fc .tx b{font-weight:650;font-size:15px}
.B .fc .tx p{font-size:13px;line-height:18px;height:36px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.B .fc .tx .ft{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.B .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
/* Tiles: one shape. Icon and name on top (name on one line, "Novo" at the right), the description always
   two lines tall, the footer (Conectado / how it connects) always at the bottom, even when empty. */
.B .grid{grid-auto-rows:1fr}
.B .tile{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);cursor:pointer;border:0;text-align:left;height:100%;transition:box-shadow .15s,transform .2s var(--spring)}
.B .tile:hover{box-shadow:var(--e2),var(--top);transform:translateY(-1px)}
.B .tile:active{transform:scale(.98)}
.B .tile .th{display:flex;align-items:center;gap:10px;min-width:0}
.B .tile .th b{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.B .tile .th .new{margin-left:0;flex:none}
.B .tile p{font-size:12.5px;line-height:18px;height:36px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.B .tile .tf{margin-top:auto;height:18px;display:flex;align-items:center}
.B .tile .tf .how,.B .tile .tf .done{margin:0}
.B .tile.other{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.B .tile.other:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}

/* ---------- B+C ---------- */
.D{max-width:1080px;height:min(740px,100%)}
.D .dbody{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;flex:1;border-top:1px solid var(--line)}
.D[data-open="true"] .dbody{grid-template-columns:minmax(0,1fr) 340px}
.D .dbody .scroll{border-top:0;min-height:0}
.D[data-open="true"] .feat{grid-template-columns:repeat(3,1fr)}
.D .tile[aria-pressed="true"],.D .fc[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--ink),var(--top)}
.D .detail{position:relative;padding:22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;background:var(--side);border-left:1px solid var(--line);animation:slide .24s var(--out)}
@keyframes slide{from{opacity:0;transform:translateX(12px)}}
.D .detail .dx{position:absolute;top:12px;right:12px}
.D .detail .ci{--s:56px}
.D .detail h3{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.025em;line-height:1.1}
.D .detail .d{color:var(--muted);font-size:14px}
.D .detail h4{font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:6px}
.D .caps{display:flex;flex-direction:column;gap:6px}
.D .cap{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2)}
.D .cap svg.i{width:14px;height:14px;color:var(--muted)}
.D .detail .act{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.D .detail .act .how{justify-content:center}
@media (max-width:760px){.D[data-open="true"] .dbody{grid-template-columns:1fr}.D .detail{position:absolute;inset:auto 0 0 0;max-height:70%;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:var(--e3)}}

/* ---------- C · Busca e detalhe ---------- */
.C{max-width:880px;height:min(600px,100%)}
.C .top{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.C .body{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;flex:1}
.C .list{overflow-y:auto;padding:6px 8px 12px;border-right:1px solid var(--line)}
.C .gh{font-size:12px;font-weight:650;color:var(--faint);padding:12px 10px 4px}
.C .it{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border-radius:12px;cursor:pointer}
.C .it .ci{--s:28px}
.C .it .ci .ok{width:14px;height:14px;border-radius:5px;right:-3px;bottom:-3px}
.C .it .ci .ok svg.i{width:9px;height:9px}
.C .it .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.C .it .nm small{color:var(--faint);font-size:12.5px;margin-left:6px}
.C .it[aria-selected="true"]{background:var(--chosen);box-shadow:var(--chosen-shadow)}
.C .it:not([aria-selected="true"]):hover{background:var(--plate-soft)}
.C .detail{padding:22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;background:var(--side)}
.C .detail .ci{--s:56px}
.C .detail h3{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.025em;line-height:1.1}
.C .detail .d{color:var(--muted);font-size:14px}
.C .detail h4{font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:6px}
.C .caps{display:flex;flex-direction:column;gap:6px}
.C .cap{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2)}
.C .cap svg.i{width:14px;height:14px;color:var(--muted)}
.C .detail .act{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.C .detail .act .how{justify-content:center}
.C .foot{display:flex;align-items:center;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.C .foot span{display:inline-flex;align-items:center;gap:5px}
.C .foot .grow{flex:1}
.C .foot a{color:var(--ink2);font-weight:600;text-decoration:none;cursor:pointer}
.C .foot a:hover{text-decoration:underline}

@media (max-width:760px){
  .A .body{grid-template-columns:1fr}.A nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.A nav button{width:auto;flex:none}.A nav .sep{display:none}
  .B .feat{grid-template-columns:1fr}.B .hd .l1{flex-wrap:wrap}.B .hd .search{max-width:none;flex-basis:100%}
  .C .body{grid-template-columns:1fr}.C .detail{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="proto" id="proto">
  <b>Adicionar conector</b>
  <div class="pseg" data-k="v"><button data-o="a">A · Lista</button><button data-o="b">B · Galeria</button><button data-o="c">C · Busca e detalhe</button><button data-o="d">B+C</button></div>
  <div class="pseg" data-k="theme"><button data-o="light">Claro</button><button data-o="dark">Escuro</button></div>
  <p class="note" id="note"></p>
</div>
<div class="page" aria-hidden="true"><h1>Conectores</h1><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div></div>
<div class="scrim" id="scrim"></div>

<script type="module">
import { AGENT_GRADIENTS, mixHex } from "../../../packages/ui/src/agent/engine.js";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  return `<span class="ci" style="--s:${s}px">${inner}${x.conn ? `<span class="ok" aria-label="Conectado">${I.check}</span>` : ""}</span>`;
}
const how = (x) => (x.how ? `<span class="how">${x.how === "Chave de API" ? I.key : I.lock}${x.how}</span>` : "");
const status = (x) => (x.conn ? `<span class="done">${I.check}Conectado</span>` : how(x));

/* ---------- B ---------- */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function paintBand(cv, color) {
  const w = 60, hh = 12; cv.width = w; cv.height = hh;
  const g = cv.getContext("2d"), dark = S.theme === "dark";
  const [lt, dp] = AGENT_GRADIENTS[color] ?? AGENT_GRADIENTS.sky;
  const base = dark ? "#1c1c1b" : "#ffffff";
  const tones = dark ? [mixHex(dp, base, .45), mixHex(dp, base, .62), mixHex(dp, base, .8), base] : [mixHex(lt, base, .35), mixHex(lt, base, .55), mixHex(lt, base, .78), base];
  for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) {
    const t = y / (hh - 1) * (tones.length - 1) + BAYER[(y % 4) * 4 + (x % 4)] / 16 - .5;
    g.fillStyle = tones[Math.max(0, Math.min(tones.length - 1, Math.round(t)))];
    g.fillRect(x, y, 1, 1);
  }
}

/* ---------- render ---------- */
function render(keepFocus) {
  document.documentElement.dataset.theme = S.theme;
  for (const s of $$(".proto .pseg")) for (const b of $$("button", s)) b.setAttribute("aria-pressed", String(S[s.dataset.k] === b.dataset.o));
  $("#note").innerHTML = NOTES[S.v];
  document.documentElement.style.setProperty("--protoH", $("#proto").offsetHeight + "px");
  $("#scrim").innerHTML = S.v === "a" ? A() : S.v === "b" ? B() : S.v === "d" ? D() : Cview();
  for (const cv of $$("canvas[data-band]")) paintBand(cv, cv.dataset.band);
  history.replaceState(null, "", `#v=${S.v}&theme=${S.theme}`);
  if (keepFocus) { const q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  else if (S.v === "c") $("#q")?.focus();
}
document.addEventListener("click", (e) => {
  const p = e.target.closest(".proto .pseg button");
  if (p) { S[p.parentElement.dataset.k] = p.dataset.o; if (p.parentElement.dataset.k === "v") { S.cat = "all"; S.q = ""; S.sel = S.o === "d" ? null : S.sel; if (S.v === "d") S.sel = null; else S.sel ??= "db"; } return render(); }
  const c = e.target.closest("[data-cat]");
  if (c) { S.cat = c.dataset.cat; return render(); }
  const pk = e.target.closest("[data-pick]");
  if (pk && S.v === "d") { S.sel = S.sel === pk.dataset.pick ? null : pk.dataset.pick; return render(); }
  if (e.target.closest("[data-unpick]")) { S.sel = null; return render(); }
  const s = e.target.closest("[data-sel]");
  if (s) { S.sel = s.dataset.sel; return render(); }
});
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; render(true); } });
document.addEventListener("keydown", (e) => {
  if (S.v === "d" && e.key === "Escape" && S.sel) { S.sel = null; return render(); }
  if (S.v !== "c" || !["ArrowDown", "ArrowUp"].includes(e.key)) return;
  e.preventDefault();
  const items = shown(); const i = items.findIndex((x) => x.id === S.sel);
  const n = items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length];
  if (n) { S.sel = n.id; render(true); $(`[data-sel="${n.id}"]`)?.scrollIntoView({ block: "nearest" }); }
});
render();
</script>
