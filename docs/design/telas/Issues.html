<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: Issues, on the approved design system (Proposta 2) and the line of Rotinas.html.
  "Agentes trabalhando agora": the agents on issues right now, live (writing eyes, the step they are on,
  a dithered sweep in their light tones). A board by status (drag cards between columns) or a list;
  every card says who has it (a living agent or a person), its acceptance criteria as pixel cells in
  the assignee's tones, priority, due date and linked PR. A details panel: status, who, criteria the
  agent ticks live, the agent's work as steps, the PR with "merge asks for approval", activity and a
  comment box. "Nova issue" with criteria read from "-" lines and an agent to hand it to.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
/*
  Prototype: Rotinas, redesigned on the approved design system (Proposta 2, Componentes.dc.html).
  The day's rhythm on a horizon (each routine is a lane, runs are pixel ticks, "agora" is a line);
  one tight row per routine with a living agent, the schedule in words, the last runs as a pixel strip
  and a real switch; a details panel (what it does, when, where it delivers, budget, run history,
  silent runs); "Nova rotina" starting from a template; an empty state with a light sky.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

/* ---------- design system bits ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.fc:focus-visible,.seg button:focus-visible,.row:focus-visible,.mi:focus-visible,.sw:focus-visible,.tpl:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b:disabled{opacity:.5;cursor:default;transform:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.ib:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Switch: a track with a tactile knob (custom, never native). */
.sw{position:relative;width:36px;height:22px;border-radius:999px;border:0;padding:0;cursor:pointer;flex:none;background:color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);transition:background .2s var(--out)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 2px 6px -2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:var(--bg)}
.sw:active::after{width:21px}
.sw[aria-checked="true"]:active::after{transform:translateX(11px)}

/* Agents: the engine's body (canvas). */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 49px)}
.app.with-panel{grid-template-columns:64px minmax(0,1fr) 408px}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}
.main{min-width:0;padding:26px 28px 120px;max-width:1120px;width:100%;margin:0 auto}
/* Fixed beside the board: it stays put while the page scrolls and scrolls on its own. */
.panel{display:none;padding:12px 12px 12px 0;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;overscroll-behavior:contain}

.hd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.hd h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.hd p{color:var(--muted);margin-top:6px;max-width:58ch}
.hd .guard{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--faint)}
.hd .acts{display:flex;gap:8px;align-items:center}

/* ---------- toolbar ---------- */
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:0 1 280px;min-width:0;display:flex;align-items:center;gap:9px;height:36px;padding:0 10px 0 12px;border-radius:12px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);transition:box-shadow .2s var(--out)}
.search:focus-within{box-shadow:var(--e2),0 0 0 1.5px var(--ink)}
.search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.fc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none;transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.fc:hover{box-shadow:var(--e2),var(--top)}
.fc:active{transform:scale(.96)}
.fc .n{font-weight:500;color:var(--faint);font-size:12px}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.fc[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.fc .stack{display:inline-flex}
.fc .stack>*{margin-left:-4px}
.fc .stack>*:first-child{margin-left:0}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:80;min-width:220px;max-width:calc(100vw - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.mi:hover,.mi.on{background:rgba(127,127,127,.12)}
.mi .sub{color:var(--faint);font-size:12.5px;margin-left:auto;padding-left:10px}
.mi.danger{color:var(--danger)}
.mi .box{width:18px;height:18px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1.5px var(--line2);display:inline-flex;align-items:center;justify-content:center;color:transparent}
.mi .box svg{width:12px;height:12px;stroke-width:2.6}
.mi[aria-checked="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.mi .tick{margin-left:auto;color:var(--ink);visibility:hidden}
.mi[aria-checked="true"] .tick{visibility:visible}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.mgroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px 4px}

/* ---------- dialog ---------- */
.dlg-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim);animation:fi .2s var(--out)}
.dlg{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:24px;background:var(--raised);box-shadow:var(--e3),var(--top);animation:popin .28s var(--spring) both;display:flex;flex-direction:column}
.dlg-h{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 6px}
.dlg-h .t{flex:1}
.dlg-h h2{font-size:20px;font-weight:650;letter-spacing:-.02em}
.dlg-h p{color:var(--muted);font-size:13.5px;margin-top:2px}
.dlg-b{padding:12px 20px 4px;display:flex;flex-direction:column;gap:16px}
.dlg-f{display:flex;align-items:center;gap:8px;padding:16px 20px 20px}
.dlg-f .grow{flex:1}
.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;border-radius:16px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);cursor:pointer;transition:transform .2s var(--spring),box-shadow .2s var(--out)}
.tpl:hover{transform:translateY(-2px);box-shadow:var(--e2),var(--top)}
.tpl b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
.tpl small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tpl em{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-style:normal;font-size:12px;font-weight:600;color:var(--ink2)}
.tpl em svg.i{width:13px;height:13px}
.tpl.blank{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);align-items:center}
.tpl.blank:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tpl .pi{width:34px;height:34px;border-radius:11px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lb{font-size:13px;font-weight:600;color:var(--ink2)}
.fld .hint{font-size:12px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.inp{display:flex;align-items:center;gap:9px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp input,.inp textarea{all:unset;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.inp textarea{padding:10px 0;line-height:1.5;min-height:66px;white-space:pre-wrap}
.inp.ta{align-items:flex-start}
.sel{justify-content:space-between;cursor:pointer;border:0;width:100%;text-align:left}
.sel .v{display:flex;align-items:center;gap:9px;min-width:0;font-size:14px}
.sel svg.chev{color:var(--faint)}
.parse{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px 2px 0}
.parse b{color:var(--ink);font-weight:600}
.parse .okc{width:18px;height:18px;border-radius:6px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.parse .okc svg.i{width:11px;height:11px;stroke-width:2.6}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.sug button{height:28px;padding:0 10px;border-radius:999px;border:0;background:var(--sunken);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.sug button:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent)}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:16px;width:360px;max-width:calc(100vw - 24px);animation:popin .25s var(--spring) both}
.toast .tic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sunken);color:var(--ink2)}
.toast .tic.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.toast .tt{flex:1;min-width:0}
.toast .tt b{display:block;font-size:14px;font-weight:600}
.toast .tt small{display:block;color:var(--muted);font-size:12.5px}
.toast.out{animation:toastout .2s var(--out) both}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}

/* ---------- empty ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 18px 28px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.empty .glow{position:relative;width:100%;height:220px;margin-bottom:-14px}
.empty .glow canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.empty .glow .who{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation:bob 1.8s var(--out) infinite alternate}
@keyframes bob{to{transform:translate(-50%,calc(-50% - 8px))}}
.empty>b{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.03em}
.empty>p{color:var(--muted);max-width:46ch}
.empty .tpls{width:100%;max-width:620px;margin-top:14px;text-align:left}
.nores{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;text-align:center;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}


/* ---------- people ---------- */
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .46);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.mono{font-family:"Martian Mono",ui-monospace,monospace;font-size:12px}

/* The agent-at-work sweep: a thin dithered line along the bottom of whatever holds it (card, row, panel box). */
canvas.sweep{position:absolute;left:0;right:0;bottom:0;width:100%;height:3px;image-rendering:pixelated;pointer-events:none}
/* ---------- agents working now ---------- */
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:22px}
.wk{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 14px 16px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);cursor:pointer;overflow:hidden;border:0;text-align:left;font:inherit;color:inherit;transition:transform .22s var(--spring),box-shadow .2s var(--out)}
.wk:hover{transform:translateY(-2px);box-shadow:var(--e2),var(--top)}
.wk .t{min-width:0;flex:1}
.wk b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);margin-bottom:2px}
.wk .step{display:block;margin-top:4px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .step::after{content:"";display:inline-block;width:6px;height:12px;margin-left:3px;vertical-align:-2px;border-radius:2px;background:var(--agent);animation:blinkc 1s steps(2) infinite}
.wk.wait .step::after{display:none}
.wk.wait .step{color:var(--warn);font-weight:600}
@keyframes blinkc{50%{opacity:0}}
.wk canvas.sweep{position:absolute;left:0;right:0;bottom:0;width:100%;height:4px;image-rendering:pixelated}
.now-h{display:flex;align-items:center;gap:8px;margin:0 4px 8px}

.appr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--raised);box-shadow:var(--e1)}

.appr .t b{display:block;font-weight:600}

.art .ic{width:28px;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.art .t{flex:1;min-width:0}
.art b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art small{display:block;color:var(--faint);font-size:12px}

.act .ev{color:var(--muted)}

.act .when{font-size:12px;color:var(--faint);margin-left:6px}

.composer textarea{all:unset;flex:1;min-width:0;font-size:14px;line-height:1.5;padding:7px 0;min-height:22px;max-height:140px;white-space:pre-wrap;overflow:auto}

}

    <div class="top"><span>#${it.n}</span>${it.labels[0] ? `<span>· ${esc(it.labels[0])}</span>` : ""}<span class="grow"></span>${priChip(it)}${dueChip(it)}</div>
    <div class="ti">${esc(it.title)}</div>
    ${critHTML(it)}
    <div class="foot">${it.who ? avHTML(it.who, 22, m) : `<span class="pp" style="--s:22px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--faint)">?</span>`}${footTxt}<span class="grow"></span>${prChip(it)}</div>
    ${it.who?.t === "agent" && it.work && it.status !== "done" ? `<canvas class="sweep" data-a="${it.who.id}" ${it.work.wait ? "data-wait" : ""} aria-hidden="true"></canvas>` : ""}
  </article>`;
}

/* ---------- filters ---------- */
function visible() {
  const q = S.q.trim().toLowerCase();
  return ISSUES.filter((i) =>
    (S.who === "all" || (S.who === "agents" && i.who?.t === "agent") || (S.who === "people" && i.who?.t === "person") || (S.who === "mine" && i.who?.t === "person" && i.who.id === "walter") || (S.who === "none" && !i.who)) &&
    (!q || `#${i.n} ${i.title} ${nameOf(i.who)} ${i.labels.join(" ")}`.toLowerCase().includes(q)));
}

/* ---------- render ---------- */
function render() {
  const main = $("#main");
  const open = ISSUES.filter((i) => i.status !== "done" && i.status !== "canceled");
  const head = `<div class="hd"><div><h1>Issues</h1><p>${open.length} abertas · ${open.filter((i) => i.who?.t === "agent").length} com agentes · ${open.filter((i) => !i.who).length} sem responsável</p></div>

      <canvas class="sweep" data-a="${it.who.id}" ${it.work.wait ? "data-wait" : ""} aria-hidden="true"></canvas>

    </button>`).join("")}</div>` : "";
  const list = visible();

}

/* ---------- drag between columns ---------- */
function wireDrag() {
  for (const card of $$(".card")) {
    card.ondragstart = (e) => { e.dataTransfer.setData("text/plain", card.dataset.open); e.dataTransfer.effectAllowed = "move"; requestAnimationFrame(() => card.classList.add("dragging")); };
    card.ondragend = () => card.classList.remove("dragging");
  }
  for (const col of $$(".col")) {
    col.ondragover = (e) => { e.preventDefault(); col.classList.add("drop"); };
    col.ondragleave = (e) => { if (!col.contains(e.relatedTarget)) col.classList.remove("drop"); };
    col.ondrop = (e) => { e.preventDefault(); col.classList.remove("drop"); setStatus(+e.dataTransfer.getData("text/plain"), col.dataset.col); };
  }
}
function setStatus(n, st) {
  const it = ISSUES.find((x) => x.n === n); if (!it || it.status === st) return;
  const was = it.status; it.status = st;
  it.act.push({ who: P("walter"), ev: `mudou o status para ${ST[st]}`, m: 0 });
  if (st === "done" && it.work) it.work = null;
  // Moving an unstarted agent issue to "Em andamento" asks the agent to start.
  if (st === "in_progress" && it.who?.t === "agent" && !it.work) startWork(it);
  S.fresh.add(n); render();
  toast({ icon: ST_ICON[st].replace('class="st"', 'class="i"'), title: `#${n} em ${ST[st]}`, sub: it.title, action: { label: "Desfazer", run: () => { it.status = was; render(); } } });
}

      ${it.work.wait ? "" : `<canvas class="sweep" data-a="${it.who.id}" aria-hidden="true"></canvas>`}</div>` : ""}

      <div class="last">Último passo: <b>${esc(it.stalled.last)}</b>${it.stalled.reason ? `<br>Motivo: <b>${esc(it.stalled.reason)}</b>` : ""}</div>
      <div class="acts2"><button class="b b1 sm" type="button" data-resume>${I.play}Pedir para continuar</button><button class="b b2 sm" type="button" data-pick="who">Passar para outro</button></div></div>` : ""}
    ${sug && it.status !== "done" ? `<div class="ask"><b>Passar para um agente</b><p>O agente lê o código, comenta o plano aqui e abre um PR. O merge continua pedindo sua aprovação.</p>
      <div class="agents">${Object.keys(AGENTS).map((id) => `<button class="ag${id === sug ? " sug" : ""}" type="button" data-ask="${id}">${avHTML(A(id), 24)}${AGENTS[id].name}<small>${id === sug ? "costuma pegar essas" : AGENTS[id].role}</small></button>`).join("")}</div></div>` : ""}
    ${it.desc ? `<div class="ps"><h3>Descrição</h3><div class="desc">${esc(it.desc)}</div></div>` : ""}

      <ul class="cl">${it.crit.map((c, k) => `<li class="${c.done ? "done" : ""}${S.ticked === `${it.n}:${k}` ? " fresh" : ""}"><button class="ck" type="button" role="checkbox" aria-checked="${c.done}" data-crit="${k}" aria-label="${esc(c.text)}">${I.check}</button><span class="tx">${esc(c.text)}</span>${c.by ? `<span class="by">${avHTML(A(c.by), 14)}${AGENTS[c.by].name}</span>` : ""}</li>`).join("")}</ul></div>

function send(it) {
  const cm = $("#cm"), v = cm.value.trim(); if (!v) return;
  it.act.push({ who: P("walter"), text: v, m: 0 });
  const mention = Object.keys(AGENTS).find((id) => v.toLowerCase().includes("@" + AGENTS[id].name.toLowerCase()));
  render();
  if (mention) setTimeout(() => { it.act.push({ who: A(mention), text: "Vi aqui. Vou olhar e respondo nesta issue.", m: 0 }); render(); }, 1400);
}

/* ---------- agent work ---------- */
function startWork(it, resumed = false) {
  const ag = AGENTS[it.who.id];
  it.work = { steps: ["Lendo a issue e o código relacionado", "Escrevendo o plano na issue", "Implementando", "Rodando os testes", "Abrindo o PR"], cur: 0, started: 0 };
  it.stalled = null;
  it.act.push({ who: it.who, ev: resumed ? "voltou a trabalhar" : "começou a trabalhar", m: 0 });
  if (it.status !== "in_progress") { it.status = "in_progress"; it.act.push({ who: it.who, ev: `foi para Em andamento quando ${ag.The.toLowerCase()} ${ag.name} começou`, m: 0, auto: true }); }
}
function stepAll() {
  for (const it of working()) {
    if (it.work.wait) continue;
    const open = it.crit.findIndex((c) => !c.done);
    if (open >= 0 && Math.random() < .7) { it.crit[open].done = true; it.crit[open].by = it.who.id; S.ticked = `${it.n}:${open}`; }
    if (it.work.cur < it.work.steps.length - 1) it.work.cur++;
    else if (it.crit.every((c) => c.done)) {
      it.pr = it.pr || { n: 413 + Math.floor(Math.random() * 9), title: it.title, add: 40 + Math.floor(Math.random() * 120), del: Math.floor(Math.random() * 30), checks: "ok", merge: "ask" };
      it.work.steps.push("Esperando sua aprovação para o merge"); it.work.cur = it.work.steps.length - 1; it.work.wait = true; it.status = "in_review";
      it.act.push({ who: it.who, ev: `ligou o PR #${it.pr.n}` , m: 0 }, { who: it.who, ev: "foi para Em revisão quando o PR foi ligado", m: 0, auto: true });
      toast({ icon: I.shield, ok: false, title: `${AGENTS[it.who.id].name} pede aprovação`, sub: `Merge do PR #${it.pr.n} · #${it.n}`, action: { label: "Ver", run: () => { S.open = it.n; render(); } } });
    }
  }
  render();
  setTimeout(() => { S.ticked = null; }, 900);
}

/* ---------- menus ---------- */
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(anchor, build, align = "start") {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu glass"; m.setAttribute("role", "menu");
  m.innerHTML = build();
  document.body.append(m); menuEl = m; m._build = build;
  hydrate(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let left = align === "end" ? r.right - mw : r.left;
  left = Math.min(Math.max(12, left), innerWidth - mw - 12);
  let top = r.bottom + 6;
  if (top + mh > innerHeight - 12) top = Math.max(12, r.top - mh - 6);
  m.style.left = left + "px"; m.style.top = top + "px";
  m.querySelector(".mi")?.focus({ preventScroll: true });
}

  pri: (it) => ["high", "normal", "low"].map((p) => `<button class="mi" type="button" role="menuitemradio" aria-checked="${it.pri === p}" data-set="pri:${p}">${PRI[p].icon}<span>${PRI[p].label}</span><span class="tick">${I.check}</span></button>`).join(""),
  due: (it) => [["hoje", 0], ["amanhã", 1], ["sexta", (5 - NOW.getDay() + 7) % 7 || 7], ["próxima semana", 7]].map(([l, d]) => `<button class="mi" type="button" data-set="due:${d}">${I.cal}<span>${l[0].toUpperCase() + l.slice(1)}</span></button>`).join("") + `<div class="msep"></div><button class="mi" type="button" data-set="due:none">${I.x}<span>Sem prazo</span></button>`,
  more: (it) => `<button class="mi" type="button" data-m="page">${I.open}<span>Abrir página da issue</span></button><button class="mi" type="button" data-m="link">${I.link}<span>Copiar link</span></button><button class="mi" type="button" data-m="chat">${I.chat}<span>Ver no #${esc(it.ch)}</span></button><div class="msep"></div><button class="mi danger" type="button" data-m="cancel">${I.trash}<span>Cancelar issue</span></button>`,
};
function applySet(it, v) {
  const [k, a, b] = v.split(":");
  if (k === "status") return setStatus(it.n, a);
  if (k === "who") {
    it.who = a === "none" ? null : { t: a, id: b };
    it.work = null;
    it.act.push({ who: P("walter"), ev: a === "none" ? "tirou o responsável" : `passou para ${nameOf(it.who)}`, m: 0 });
    if (it.who?.t === "agent" && it.status !== "done") { startWork(it); toast({ icon: I.agent, title: `${AGENTS[b].The} ${AGENTS[b].name} começou`, sub: "Vai comentar o plano na issue." }); }
  }
  if (k === "pri") it.pri = a;
  if (k === "due") { if (a === "none") it.due = null; else { const d = new Date(NOW); d.setDate(d.getDate() + +a); it.due = d; } }
  render();
}

/* ---------- toasts ---------- */
function toast({ icon = I.check, ok = true, title, sub = "", action, ms = 3800 }) {
  const t = document.createElement("div");
  t.className = "toast glass"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="tic ${ok ? "ok" : ""}">${icon}</span><div class="tt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>${action ? `<button class="b bg sm" type="button">${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { action.run(); dismiss(t); };
  $("#toasts").append(t);
  setTimeout(() => dismiss(t), ms);
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add("out"); setTimeout(() => t.remove(), 200); }

/* ---------- new issue ---------- */
let dlg = null;
function openNew() {
  closeMenu(); dlg?.remove();
  dlg = document.createElement("div"); dlg.className = "dlg-wrap";
  const f = { title: "", desc: "", who: null, pri: "normal", due: null };
  const crits = () => f.desc.split("\n").map((l) => l.match(/^\s*[-*]\s*(?:\[[ x]?\]\s*)?(.+)$/)?.[1]?.trim()).filter(Boolean);
  const sugFor = () => /checkout|frete|erro|bug|api|banco|deploy/i.test(f.title + f.desc) ? "lia" : /relat|dados|churn|csv|métric/i.test(f.title + f.desc) ? "nina" : /alerta|sentry|monitor/i.test(f.title + f.desc) ? "atlas" : null;
  const draw = () => {
    const cs = crits(), sug = sugFor();
    dlg.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">
      <div class="dlg-h"><div class="t"><h2 id="dt">Nova issue</h2><p>Quem pegar, pessoa ou agente, aparece no quadro com o progresso.</p></div><button class="ib" type="button" data-x aria-label="Fechar">${I.x}</button></div>
      <div class="dlg-b">
        <div class="fld"><label for="nt">Título</label><div class="inp"><input id="nt" placeholder="Ex.: Confirmação do agendamento por WhatsApp" value="${esc(f.title)}" autocomplete="off"></div></div>
        <div class="fld"><label for="nd">Descrição e critérios de aceite</label><div class="inp ta"><textarea id="nd" rows="4" placeholder="O que precisa acontecer.&#10;- Um critério por linha começando com “-”">${esc(f.desc)}</textarea></div>
          ${cs.length ? `<div class="critprev"><span class="h">${cs.length} ${cs.length === 1 ? "critério de aceite" : "critérios de aceite"}</span>${cs.map((c) => `<div>${esc(c)}</div>`).join("")}</div>` : `<span class="hint">Linhas começando com “-” viram critérios de aceite.</span>`}</div>
        <div class="fld"><span class="lb">Responsável</span><div class="whopick">${Object.keys(AGENTS).map((id) => `<button type="button" aria-pressed="${f.who?.id === id}" data-fw="agent:${id}">${avHTML(A(id), 24)}${AGENTS[id].name}${id === sug ? "<small>sugerido</small>" : ""}</button>`).join("")}${Object.keys(PEOPLE).slice(0, 2).map((id) => `<button type="button" aria-pressed="${f.who?.id === id}" data-fw="person:${id}">${avHTML(P(id), 24)}${PEOPLE[id].name}</button>`).join("")}</div>
          ${f.who?.t === "agent" ? `<span class="sugline">${I.shield}${AGENTS[f.who.id].The} ${AGENTS[f.who.id].name} começa assim que a issue for criada. Merge e deploy pedem sua aprovação.</span>` : ""}</div>
        <div class="grid2">
          <div class="fld"><span class="lb">Prioridade</span><div class="duechips">${["high", "normal", "low"].map((p) => `<button type="button" aria-pressed="${f.pri === p}" data-fp="${p}">${PRI[p].label}</button>`).join("")}</div></div>
          <div class="fld"><span class="lb">Prazo</span><div class="duechips">${[["Sem", null], ["Hoje", 0], ["Amanhã", 1], ["Sexta", 7]].map(([l, d]) => `<button type="button" aria-pressed="${f.due === d}" data-fd="${d}">${l}</button>`).join("")}</div></div>
        </div>
      </div>
      <div class="dlg-f"><span class="grow" style="font-size:12.5px;color:var(--faint)">Também dá para criar do chat: “@Lia abre uma issue pra isso”.</span><button class="b bg sm" type="button" data-x>Cancelar</button><button class="b b1 sm" type="button" data-create ${f.title.trim() ? "" : "disabled"}>${f.who?.t === "agent" ? `Criar e passar ${AGENTS[f.who.id].to} ${AGENTS[f.who.id].name}` : "Criar issue"}</button></div></div>`;
    hydrate(dlg);
    const nt = $("#nt", dlg), nd = $("#nd", dlg);
    nt.oninput = () => { f.title = nt.value; $("[data-create]", dlg).disabled = !f.title.trim(); };
    nt.onblur = () => draw();
    nd.oninput = () => { const before = crits().length; f.desc = nd.value; if (crits().length !== before) { const p = nd.selectionStart; draw(); const n = $("#nd", dlg); n.focus(); n.setSelectionRange(p, p); } };
  };
  dlg.onclick = (e) => {
    if (e.target === dlg || e.target.closest("[data-x]")) return closeNew();
    const w = e.target.closest("[data-fw]"); if (w) { const [t, id] = w.dataset.fw.split(":"); f.who = f.who?.id === id ? null : { t, id }; return draw(); }
    const p = e.target.closest("[data-fp]"); if (p) { f.pri = p.dataset.fp; return draw(); }
    const d = e.target.closest("[data-fd]"); if (d) { f.due = d.dataset.fd === "null" ? null : +d.dataset.fd; return draw(); }
    if (e.target.closest("[data-create]")) {
      const lines = f.desc.split("\n");
      const it = { n: nextNum++, title: f.title.trim(), status: "todo", pri: f.pri, who: f.who, due: f.due === null ? null : (() => { const x = new Date(NOW); x.setDate(x.getDate() + f.due); return x; })(), labels: [], ch: "produto", src: "criada por Walter",
        desc: lines.filter((l) => !/^\s*[-*]/.test(l)).join("\n").trim(), crit: crits().map((c) => C(c)), work: null, pr: null, arts: [], act: [{ who: P("walter"), ev: "criou a issue", m: 0 }], sug: sugFor() };
      ISSUES.unshift(it); S.fresh.add(it.n); S.empty = false; $('[data-proto="empty"]').setAttribute("aria-pressed", "false");
      closeNew(); render();
      toast({ title: `Issue #${it.n} criada`, sub: it.title, action: { label: "Abrir", run: () => { S.open = it.n; render(); } } });
      if (it.who?.t === "agent") setTimeout(() => { startWork(it); S.fresh.add(it.n); render(); toast({ icon: I.agent, title: `${AGENTS[it.who.id].The} ${AGENTS[it.who.id].name} começou #${it.n}`, sub: "Vai comentar o plano na issue." }); }, 1600);
    }
  };
  document.body.append(dlg); draw(); $("#nt", dlg).focus();
}
function closeNew() { dlg?.remove(); dlg = null; }

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  if (dlg && dlg.contains(e.target)) return;
  const t = e.target;
  const it = ISSUES.find((x) => x.n === S.open);
  if (menuEl && menuEl.contains(t)) {
    const s = t.closest("[data-set]"); if (s && it) { closeMenu(); applySet(it, s.dataset.set); return; }
    const m = t.closest("[data-m]"); if (m && it) { closeMenu();
      if (m.dataset.m === "cancel") return setStatus(it.n, "canceled");
      toast({ icon: m.dataset.m === "link" ? I.link : I.open, ok: m.dataset.m === "link", title: { page: "Abre /issues/" + it.n, link: "Link copiado", chat: "Abre a mensagem no canal" }[m.dataset.m] }); }
    return;
  }
  if (menuEl && !t.closest("[data-pick],[data-pmore]")) closeMenu();
  const p = t.closest("[data-proto]");
  if (p) {
    if (p.dataset.proto === "empty") { S.empty = !S.empty; S.open = null; p.setAttribute("aria-pressed", S.empty); render(); }
    if (p.dataset.proto === "step") { S.empty = false; stepAll(); }
    if (p.dataset.proto === "crash") {
      const w = working().find((i) => !i.work.wait); if (!w) return toast({ icon: I.waiting, ok: false, title: "Nenhum agente rodando agora" });
      w.stalled = { m: 0, last: w.work.steps[w.work.cur], reason: "O orçamento do mês do agente acabou" }; w.work = null;
      w.act.push({ who: w.who, ev: "parou: a execução falhou (orçamento do mês)", m: 0 });
      S.empty = false; render(); toast({ icon: I.waiting, ok: false, title: `${AGENTS[w.who.id].name} parou em #${w.n}`, sub: "A issue segue Em andamento, marcada como parada." });
    }
    return;
  }
  if (t.closest("[data-new]")) return openNew();
  const wh = t.closest("[data-who]"); if (wh) { S.who = wh.dataset.who; render(); return; }
  const pk = t.closest("[data-pick]"); if (pk && it && pickMenus[pk.dataset.pick]) return menuEl ? closeMenu() : openMenu(pk, () => pickMenus[pk.dataset.pick](it));
  if (t.closest("[data-pmore]") && it) return menuEl ? closeMenu() : openMenu(t.closest("[data-pmore]"), () => pickMenus.more(it), "end");
  const ck = t.closest("[data-crit]"); if (ck && it) { const c = it.crit[+ck.dataset.crit]; c.done = !c.done; c.by = null; render(); return; }
  const ask = t.closest("[data-ask]"); if (ask && it) return applySet(it, `who:agent:${ask.dataset.ask}`);
  if (t.closest("[data-stop]") && it) { it.act.push({ who: P("walter"), ev: `parou ${AGENTS[it.who.id].The.toLowerCase()} ${AGENTS[it.who.id].name}`, m: 0 }); it.stalled = { m: 0, last: it.work.steps[it.work.cur], reason: "Você parou a execução" }; it.work = null; render(); return toast({ icon: I.stop, ok: false, title: "Trabalho parado", sub: "A issue continua Em andamento; dá para pedir para continuar." }); }
  if (t.closest("[data-resume]") && it) { startWork(it, true); it.work.steps = ["Relendo a issue e o que já foi feito", ...it.work.steps.slice(1)]; render(); return toast({ icon: I.agent, title: `${AGENTS[it.who.id].The} ${AGENTS[it.who.id].name} voltou para #${it.n}`, sub: "Continua de onde parou." }); }
  if (t.closest("[data-approve]") && it) { it.pr.merge = "merged"; it.work = null; it.status = "done"; it.act.push({ who: P("walter"), ev: `aprovou o merge do PR #${it.pr.n}`, m: 0 }, { who: P("walter"), ev: "foi para Feito quando o merge foi aprovado", m: 0, auto: true }); S.fresh.add(it.n); render(); return toast({ icon: I.check, title: `Merge do PR #${it.pr.n} aprovado`, sub: `#${it.n} foi para Feito.` }); }
  if (t.closest("[data-deny]") && it) { it.work.wait = false; it.work.steps.push("Ajustando depois da sua resposta"); it.work.cur = it.work.steps.length - 1; it.status = "in_progress"; it.act.push({ who: P("walter"), ev: "recusou o merge", m: 0 }); render(); return; }
  if (t.closest("[data-send]") && it) return send(it);
  const mt = t.closest("[data-mention]"); if (mt) { const cm = $("#cm"); cm.value = (cm.value ? cm.value + " " : "") + "@" + AGENTS[mt.dataset.mention].name + " "; cm.focus(); cm.oninput(); return; }
  if (t.closest("[data-close]") || t.id === "scrim") { S.open = null; render(); return; }
  const op = t.closest("[data-open]"); if (op) { const n = +op.dataset.open; S.open = S.open === n ? null : n; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (menuEl) return closeMenu(); if (dlg) return closeNew(); if (S.open) { S.open = null; render(); } return; }
  const typing = e.target.closest?.("input,textarea,[contenteditable]");
  if (typing || dlg || e.metaKey || e.ctrlKey) return;
  if (e.key === "n" || e.key === "N") { e.preventDefault(); openNew(); }
  if (e.key === "/") { e.preventDefault(); $("#q")?.focus(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".card,.lr")) { e.preventDefault(); e.target.click(); }
});

/* ---------- theme / segmented ---------- */
function seg(el, value, on) {
  if (!el) return;
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); if (!b) return; pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });

$("#logo").append(makeAgent("theo", 30));
render();
</script>
</body>
</html>
