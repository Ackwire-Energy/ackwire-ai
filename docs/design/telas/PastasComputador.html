<style>
/*
  Prototype: which folders of a connected computer the agents may use, and which tools run there.
  The rule (approved): permissions live ON THE MACHINE. The site only SHOWS what is allowed and REDUCES it
  (remove a folder, turn a tool off). To GRANT more (a folder, Claude Code, Codex, commands) the site shows the
  exact command to run on that computer, with a copy button. Only the person who connected the computer can
  grant; the server can never widen access. Two layers, like connectors: (1) the computer: folders + tools;
  (2) per agent: which of those folders it uses. Default = nothing extra: each agent only has its own folder
  (~/agentes/<agent>-<id>). An agent that needs a folder posts a card in chat with the prefilled command; when
  the computer reports the new access, the card turns into "Liberado" and the work continues by itself.

  The CLI on the computer (commands and flags in English; the interactive picker speaks the person's language):
    agentes-runner folders                                   interactive picker (arrows, space, enter)
    agentes-runner folders list                              what is allowed and which agents use it
    agentes-runner folders allow <path> [--agent <handle>]…  allow a folder (optionally for agents right away)
    agentes-runner folders remove <path> [--agent <handle>]  remove it (for everyone, or for one agent)
    agentes-runner tools                                     interactive on/off for the tools
    agentes-runner tools list | enable <tool> | disable <tool>   tool = claude | codex | commands
  `agentes-runner pair …` ends with the same folder picker (enter with nothing ticked = skip).

  Views (prototype bar on top; every state is a deep link):
    #view=computer   Configurações → Computadores → MacBook do Walter
                     &role=owner|admin (admin = Marina, not the one who connected: read-only)
                     &dialog=change|remove   &codex=on   &removed=1
    #view=pair       after "Conectar um computador": the folder question mirrored live from the Terminal
                     &state=waiting|picking|done
    #view=agent      agent page (Bento) → Ferramentas e acesso → "Pastas no computador"
                     &role=admin|member   &state=saved|dirty|pending   &dialog=other
    #view=chat       #conteudo: Bento needs viajolo-v5
                     &state=ask|waiting|done|inapp   &role=owner|other   &scope=project|folder
    #view=terminal   the interactive `agentes-runner folders` (keyboard works: ↑ ↓ space enter esc)
                     &state=folders|agents|done
    Everywhere: &theme=light|dark
  Agents come only from packages/ui/src/agent/engine.js (serve the repo root over http).
  Base: AgentePerfil.html / RepositoriosAgente.html (tokens and components), TarefaLonga.html (chat), Carregando.html
  (pixel orbit). Mono only for commands and paths.
*/
:root{
  --bg:#f4f4f1;--raised:#fff;--sunken:#ebebe7;--glass:rgba(255,255,255,.72);--line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b4352b;--danger-soft:#fbe6e3;
  --agent:#0063d1;--agent-soft:#e3eefd;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 8px 20px -6px rgba(23,23,22,.12),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sky-ink:#04203f;--sky-ink2:rgba(4,32,63,.74);--sky-glass:rgba(241,248,255,.76);--sky-line:rgba(4,32,63,.12);
  --term:#141413;--term-ink:#d6d6d2;--term-dim:#8b8b85;--term-ok:#5fc48a;--term-sel:rgba(255,255,255,.08);
  --sans:"Onest",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",monospace;--mono:"Martian Mono",ui-monospace,monospace;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--glass:rgba(30,30,28,.72);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#ef7c70;--danger-soft:#3a1714;
  --agent:#5aa8ff;--agent-soft:#11253f;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --term:#080807;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";overflow-x:hidden}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
canvas.av{display:block;flex:none}
canvas.orbit{display:inline-block;flex:none;image-rendering:pixelated;vertical-align:middle}
:focus-visible{outline:2px solid #3d8bff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes blinkc{50%{opacity:0}}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- Prototype bar (not product) ---------- */
.pbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pbar .lbl{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.pbar .grow{flex:1}
.views{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.views::-webkit-scrollbar{display:none}
.stp{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 6px;border-radius:999px;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none;transition:background .15s,color .15s}
.stp .n{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--sunken);color:var(--faint)}
.stp:hover{background:var(--plate);color:var(--ink)}
.stp[aria-current="step"]{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.stp[aria-current="step"] .n{background:var(--ink);color:var(--bg)}
.pbar .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- Shell: sidebar | page ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app.bare{grid-template-columns:minmax(0,1fr)}
.app.bare .side{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);overflow:hidden;padding:18px 12px;display:flex;flex-direction:column;gap:14px;background:var(--sunken);border-right:1px solid var(--line);isolation:isolate}
.side canvas.sky{position:absolute;inset:auto 0 0 0;width:100%;height:22%;image-rendering:pixelated;pointer-events:none;z-index:-1}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:300;font-size:20px;letter-spacing:-.02em;padding:0 6px}
.brand i{font-style:normal;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:.62em;color:var(--muted)}
.find{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:11px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);font-size:13px}
.find .kbd{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--plate);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top);font-weight:600}
.nav a .n{margin-left:auto;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;color:var(--muted)}
.nav .agent-slot{width:18px;height:18px;display:grid;place-items:center;flex:none}
.page{min-width:0;display:flex;flex-direction:column;align-items:center;padding:0 clamp(16px,3vw,36px) 120px}
.wrap{width:100%;max-width:1080px}
.topbar{display:flex;align-items:center;gap:10px;height:58px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;min-width:0;flex-wrap:nowrap;overflow:hidden}
.crumbs a{text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .18s var(--spring)}
.iconbtn:hover{background:var(--plate);color:var(--ink)}
.iconbtn:active{transform:scale(.94)}

/* ---------- Controls (design system v2, from AgentePerfil) ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:-.005em;background:var(--raised);box-shadow:var(--e1),var(--top);white-space:nowrap;transition:transform .18s var(--spring),box-shadow .18s var(--out),filter .15s,background .15s,color .15s,opacity .15s}
.btn:hover{box-shadow:var(--e2),var(--top)}
.btn:active{transform:scale(.97) translateY(.5px)}
.btn.primary{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)),var(--ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-disabled="true"]{opacity:.45;cursor:default;transform:none;filter:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{color:#fff;background:linear-gradient(180deg,#c9473c,#a8322a);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px -6px rgba(168,50,42,.6)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.btn.icon{width:40px;padding:0}
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.22);opacity:.8;box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)}
.card{background:var(--raised);border-radius:20px;box-shadow:var(--e1),var(--top);padding:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.label{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.help{color:var(--muted);font-size:12.5px}
.faint{color:var(--faint)}
.input{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s}
.input:focus-within{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.input input{all:unset;flex:1;min-width:0;height:100%}
.input.mono input{font-family:var(--mono);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;max-width:100%}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.busy{background:var(--agent-soft);color:var(--agent)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tog{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 10px;border-radius:999px;font-weight:600;font-size:13px;background:var(--raised);color:var(--muted);box-shadow:var(--e1),var(--top);transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s;flex:none}
.tog:hover{color:var(--ink)}
.tog:active{transform:scale(.96)}
.tog .box{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);transition:background .15s}
.tog .box svg{width:11px;height:11px;stroke-width:2.6;opacity:0}
.tog[aria-pressed="true"]{color:var(--ink);box-shadow:0 0 0 1.5px var(--ink),var(--top)}
.tog[aria-pressed="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.tog[aria-pressed="true"] .box svg{opacity:1}
.tog.sm{height:30px;font-size:12.5px;padding:0 11px 0 8px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%}
.seg button{all:unset;position:relative;z-index:1;cursor:pointer;height:30px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:hover{color:var(--ink)}
.seg .pill{position:absolute;top:0;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.seg.sm button{height:26px;padding:0 10px;font-size:12.5px}
.seg.sm .pill{height:26px}
.seg.xs button{height:24px;padding:0 9px;font-size:12px}
.seg.xs .pill{height:24px}
.menu{position:fixed;z-index:60;min-width:220px;border-radius:16px;padding:6px;background:color-mix(in srgb,var(--raised) 92%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3);animation:popin .22s var(--spring) both}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:6px 10px;border-radius:10px}
.mi:hover{background:rgba(127,127,127,.13)}
.mi.danger{color:var(--danger)}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.pa{width:30px;height:30px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:650;font-size:12px;background:linear-gradient(160deg,#e9e9e5,#d9d9d4);color:#2a2a28}
:root[data-theme="dark"] .pa{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.pa.sm{width:22px;height:22px;font-size:10px}
.ib{width:30px;height:30px;border-radius:10px 10px 10px 4px;display:grid;place-items:center;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);flex:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--plate);color:var(--muted);font-size:13px}
.note b{color:var(--ink);font-weight:600}
.note svg{margin-top:2px}
.logo{width:36px;height:36px;border-radius:11px 11px 11px 4px;display:grid;place-items:center;flex:none;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
.logo.soft{background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;min-width:0}
.ch .act{margin-left:auto;display:flex;gap:6px;align-items:center}
.ch .help{margin-left:auto}
.eyebrow{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap}
.readonly{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:13px;margin-bottom:14px}
.readonly svg{margin-top:2px}
.readonly b{color:var(--ink);font-weight:600}
.crow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap;min-width:0}
.crow:first-child{border-top:0;padding-top:2px}
.crow:last-child{padding-bottom:2px}
.crow .t{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.crow .n{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crow .d{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.crow .end{display:flex;gap:6px;align-items:center;margin-left:auto}
.crow.nw{flex-wrap:nowrap}
.crow.nw .t{flex:1 1 auto}
.crow .under{flex-basis:100%;padding-left:48px;display:flex;flex-direction:column;gap:8px}
.crow.changed{margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:12px;background:var(--plate);border-top-color:transparent}
.crow.changed + .crow{border-top-color:transparent}
.crow.gone{opacity:.55}
.more{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--muted);margin-top:12px}
.more:hover{color:var(--ink)}
.kv{display:flex;flex-direction:column;gap:12px}
.kv > div{display:flex;flex-direction:column;gap:3px}
.kv .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.kv .v{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kv .v span{font-weight:500;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--ink);color:var(--bg);white-space:nowrap}
.tag svg{width:11px;height:11px;stroke-width:2.2}
.undo{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);padding:2px 6px;border-radius:7px}
.undo:hover{background:var(--plate);color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0}
.who .avs{display:inline-flex;align-items:center}
.who .avs{gap:3px}

/* ---------- Paths and commands (the only mono on the page) ---------- */
.path{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--ink2);overflow-wrap:anywhere;border-radius:6px;padding:1px 4px;margin:0 -4px;transition:background .15s}
.path:hover{background:var(--plate)}
code{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:6px;background:var(--sunken);color:var(--ink2);white-space:nowrap}
code.wrap{white-space:normal;overflow-wrap:anywhere}
.cmd{display:flex;align-items:flex-start;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);min-width:0}

/* ---------- Computer page ---------- */
.cfg{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}

.mhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.mhead .big{width:56px;height:56px;border-radius:17px 17px 17px 6px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--e2),var(--top);color:var(--ink2);flex:none}

.mhead .t{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px}

.tools .crow .logo svg{width:18px;height:18px}

.honest svg{color:var(--warn);margin-top:2px}

/* ---------- Agent page (from AgentePerfil, trimmed) ---------- */
.cover{position:relative;height:190px;border-radius:24px;overflow:hidden;isolation:isolate;box-shadow:var(--e1)}
.cover canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
.state{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:4px 11px 4px 9px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--sky-ink);background:var(--sky-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--sky-line);max-width:calc(100% - 28px)}
.state .sub{font-weight:500;color:var(--sky-ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ident{display:flex;align-items:flex-end;gap:16px;padding:16px 4px 4px;flex-wrap:wrap}
.ident .whoami{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:6px}
.ident h1{font-family:var(--display);font-weight:300;font-size:44px;letter-spacing:-.03em;line-height:1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ident h1 .handle{font-family:var(--sans);font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted)}
.ident .acts{display:flex;gap:8px;align-items:center}
.tabsbar{position:sticky;top:45px;z-index:20;margin:14px -8px 0;padding:0 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:48px;padding:0 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.view{padding-top:22px;animation:fi .3s var(--out) both}
.pend{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--sunken);margin-top:4px}
.waitline{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.shimmer{background:linear-gradient(90deg,var(--faint) 0%,var(--ink2) 50%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}

/* ---------- Pairing step ---------- */
.pair{max-width:980px;margin:0 auto;padding-top:8px}
.prog{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.prog .ps{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 7px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--faint)}

.prog .ps.done{color:var(--muted)}
.prog .ps.done .n{background:var(--ok-soft);color:var(--ok)}
.prog .ps.on{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}

.prog .sep{width:14px;height:1px;background:var(--line2)}
.pair h1{font-family:var(--display);font-weight:300;font-size:46px;letter-spacing:-.03em;line-height:1.05;max-width:22ch}

.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;margin-top:24px;align-items:start}
.mirror .crow .logo{width:32px;height:32px}
.mempty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 12px 22px;color:var(--muted);font-size:13.5px}

.pfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.pfoot .help{margin-right:auto}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--faint)}

.term .scr{font-family:var(--mono);font-size:12px;line-height:1.85;padding:14px 16px 16px;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;min-height:340px}

.term .ln{display:block;min-height:1.85em}
.term .dim{color:var(--term-dim)}
.term .b{color:#fff}
.term .ok{color:var(--term-ok)}
.term .q{color:#fff}
.term .it{display:flex;gap:10px;margin:0 -8px;padding:0 8px;border-radius:6px}

.term .it .ptr{width:1ch;flex:none;color:#fff}
.term .it .bx{flex:none}
.term .it .bx.on{color:var(--term-ok)}
.term .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term .it.here .nm{color:#fff}
.term .it .mt{color:var(--term-dim);flex:none}
.term .grp{color:var(--term-dim);margin-top:4px}
.term .caret{display:inline-block;width:.6em;height:1.1em;background:var(--term-ink);vertical-align:-.2em;animation:blinkc 1s steps(1) infinite}
.term.compact .scr{font-size:11.5px;min-height:300px;padding:12px 14px}
.tpage{max-width:1080px;margin:0 auto;padding:28px 0 0}

.tpage h1{font-family:var(--display);font-weight:300;font-size:40px;letter-spacing:-.03em;line-height:1.05}
.cli{display:flex;flex-direction:column}
.cli .c{display:flex;flex-direction:column;gap:3px;padding:11px 0;border-top:1px solid var(--line)}
.cli .c:first-child{border-top:0;padding-top:0}
.cli .c:last-child{padding-bottom:0}
.cli .c code{align-self:flex-start;background:transparent;padding:0;font-size:11px;color:var(--ink);white-space:normal;overflow-wrap:anywhere}
.cli .c span{font-size:12.5px;color:var(--muted)}

/* ---------- Chat (from TarefaLonga / Componentes) ---------- */
.thread{min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - 45px)}
.th{position:sticky;top:45px;z-index:10;padding:14px 24px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--line)}
.th-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.th h1{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.03em;line-height:1.1;display:flex;align-items:center;gap:6px}
.th h1 .hs{color:var(--faint)}
.th .help{margin-left:auto}
.feed{flex:1;width:100%;max-width:860px;margin:0 auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:14px;padding:10px 12px;border-radius:14px;transition:background .15s;animation:fi .3s var(--out) both;min-width:0}
.msg:hover{background:rgba(127,127,127,.05)}
.msg .mav{width:34px;flex:none;display:flex;justify-content:center;padding-top:2px}
.msg .pa{width:34px;height:34px;font-size:13px}
.mb{flex:1;min-width:0}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mr{font-size:12px;color:var(--faint)}
.mx{font-size:15px;line-height:1.62;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.mx b{color:var(--ink);font-weight:650}
.mx .at{font-weight:600;color:var(--ink)}
.gap{display:flex;align-items:center;gap:10px;margin:12px 12px;font-size:12px;color:var(--faint);font-weight:600}
.gap::before,.gap::after{content:"";flex:1;height:1px;background:var(--line)}
.ask{margin-top:10px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:620px;overflow:hidden;animation:popin .3s var(--spring) both}
.ask-h{display:flex;align-items:center;gap:12px;padding:14px 14px 0 14px}
.ask-h .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ask-h b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.ask-h small{color:var(--muted);font-size:12.5px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ask-b{display:flex;flex-direction:column;gap:10px;padding:12px 14px 0}
.ask-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px 14px;margin-top:12px;border-top:1px solid var(--line)}
.ask-f .hint{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.ask.done .ask-b{display:none}
.ask.done .ask-f{margin-top:12px}
.wk-last{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--sunken);min-width:0;max-width:620px}
.wk-last .tx{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);min-width:0}
.cur{display:inline-block;width:7px;height:13px;background:var(--agent);vertical-align:-2px;animation:blinkc 1s steps(1) infinite;flex:none}
.composer{max-width:812px;width:calc(100% - 48px);margin:0 auto 18px;border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;color:var(--faint);position:sticky;bottom:14px}
.composer span{flex:1}

/* ---------- Dialog, toast, savebar ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,10,9,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .2s both;overflow-y:auto}
.dialog{width:min(520px,100%);border-radius:22px;background:var(--raised);box-shadow:var(--e3),var(--top);padding:20px;display:flex;flex-direction:column;gap:14px;animation:popin .25s var(--spring) both;max-height:calc(100vh - 32px);overflow-y:auto}
.dialog.sm{width:min(440px,100%)}
.dialog h2{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.02em;line-height:1.15}

.dialog .foot{display:flex;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:flex-end}
.dialog .foot .help{margin-right:auto;display:inline-flex;gap:8px;align-items:center}
.dialog .dh{display:flex;align-items:flex-start;gap:12px}
.dialog .dh .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;top:58px;transform:translate(-50%,-20px);opacity:0;z-index:80;display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13.5px;box-shadow:var(--e3);transition:transform .35s var(--spring),opacity .2s;pointer-events:none;max-width:calc(100vw - 24px)}
.toast.on{transform:translate(-50%,0);opacity:1}
.savebar{position:fixed;left:calc(236px + (100vw - 236px) / 2);bottom:18px;transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:40;width:min(640px,calc(100vw - 236px - 40px));display:flex;gap:8px;align-items:center;padding:10px 10px 10px 16px;border-radius:18px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--e3),var(--top);transition:transform .35s var(--spring),opacity .2s}
.savebar.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.savebar .hint{margin-right:auto;display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.savebar .hint b{font-weight:600;white-space:nowrap}
.savebar .hint span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt3{display:flex;flex-direction:column;gap:10px}
.agpick{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .app{grid-template-columns:1fr}

}

}

  .mhead .acts{width:100%}

  .crow .under{padding-left:0}
  .crow .t{flex-basis:160px}
  .cover{height:140px;border-radius:20px}
  .state .sub{display:none}
  .ident{padding-top:12px;gap:12px}
  .ident h1{font-size:34px;gap:8px}
  .ident .acts{width:100%}
  .ident .acts .btn.primary{flex:1}
  .tabsbar{margin:12px -16px 0;padding:0 8px}
  .tab{height:44px;padding:0 10px;font-size:13.5px}
  .pair h1{font-size:34px}
  .pfoot .help{flex-basis:100%}
  .pfoot .btn{flex:1}
  .term .scr{font-size:11px;padding:12px;min-height:0}
  .term .it .mt{display:none}
  .tpage{padding-top:18px}
  .tpage h1{font-size:30px}
  .th{padding:12px 16px 10px}
  .th .help{display:none}
  .feed{padding:12px 4px 20px}
  .msg{gap:10px;padding:10px 8px}
  .msg .mav{width:30px}
  .msg .pa{width:30px;height:30px}
  .composer{width:calc(100% - 32px)}
  .ask-f .hint{flex-basis:100%;margin-right:0}
  .ask-h small svg{display:none}
  .savebar{bottom:10px;width:calc(100vw - 20px);padding:8px 8px 8px 12px}
  .savebar .hint span{display:none}
  .savebar .btn.primary{flex:1}
  .dialog{padding:18px 16px}
  .dialog .foot .help{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

const orbit = (color = "amber", size = 14) => `<canvas class="orbit" data-color="${color}" data-size="${size}" aria-hidden="true"></canvas>`;
const RING = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function drawOrbit(cv, now) {
  const ctx = cv.getContext("2d"), cell = cv.width / 3, gap = Math.max(1, Math.round(cell * 0.14));
  const tn0 = bodyTones(cv.dataset.color), tn = Array.isArray(tn0) ? tn0 : Object.values(tn0);
  const dark = document.documentElement.dataset.theme === "dark";
  const faint = mixHex(tn[tn.length - 1] ?? "#999999", dark ? "#000000" : "#ffffff", dark ? 0.55 : 0.45);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const head = reduce ? 0 : Math.floor(now / 110) % 8;
  RING.forEach(([x, y], i) => {
    const age = (head - i + 8) % 8;

/* ================= Skies (agent page cover; sidebar horizon) ================= */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);

const SPR = spriteGrid(9);
function paintSky(cv, t, o) {

  const PX = 4, W = Math.ceil(r.width / PX), H = Math.ceil(r.height / PX);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; cv._img = null; }

  const img = cv._img || (cv._img = c.createImageData(W, H)), d = img.data;
  const pal = o.palette.map((p) => (Array.isArray(p) ? p : rgb(p))), n = pal.length - 1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

    const k = f * n, lo = Math.floor(k), col = pal[Math.min(n, lo + (k - lo > BAYER[(x & 3) + (y & 3) * 4] ? 1 : 0))];

      if (o.avoid && Math.abs((sp.x * (W - 9) + 4.5) / W - o.avoid[0]) < o.avoid[2]) continue;
      const ox = Math.round(sp.x * (W - 9)), oy = Math.round(sp.y * H), blink = (t + sp.b) % 4 < 0.12;
      for (let j = 0; j < 9; j++) for (let i2 = 0; i2 < 9; i2++) {

function coverSky(t) {

/* A path the computer already allows needs no command: it is picked on this page (layer 2). */

document.addEventListener("click", async (e) => {

});
document.addEventListener("input", (e) => {
  if (e.target.id === "allowPath") { S.allowPath = e.target.value; $("#allowCmd").innerHTML = cmdBlock(allowCmd(S.allowPath.trim() || "~/caminho/da/pasta", S.allowAgents)); }
  if (e.target.id === "otherPath") { S.otherPath = e.target.value; $("#otherCmd").innerHTML = otherCmd(); $("[data-pending]").toggleAttribute("hidden", Boolean(grantedAt(S.otherPath))); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.dialog) { S.dialog = null; render({ keepScroll: true }); return; }
  if (document.activeElement?.id === "scr") termKey(e);
});
addEventListener("hashchange", () => { fromHash(); render(); scrollTo(0, 0); });
addEventListener("resize", () => placePills());
fromHash();
render();
document.fonts?.ready.then(() => placePills());
</script>
