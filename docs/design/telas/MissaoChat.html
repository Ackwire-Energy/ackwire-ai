<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missão no chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: the CHAT side of a mission (sibling of Missao.html, same mission, same data and tokens).
  The chat is where you talk and decide; the Missões page is where you see the whole. Deciding in one
  updates the other. You only talk to Dev (the manager agent): Claude Code sessions never talk to the
  person, they show up as collapsed, expandable work steps inside Dev's messages (live last line, the
  brand-blue cursor while streaming). Detection: Dev PROPOSES a mission, never creates one silently;
  small requests get normal replies. Explicit paths: the /mission command in the composer and
  "Transformar em missão" in a message's ⋯ menu.
  Guided story (prototype bar, steps 1..10, "Próximo"; every step is also reachable from the UI):
  1 #produto: the ask, Dev thinks, then a mission proposal card (phases with gates, computer, parallel
    tasks, stop-at-gates switch, duration; Criar missão / Ajustar / Só responder aqui). No budget: the
    executor runs on the person's own plan; a mission is a thread with a plan.
  2 "Missão App mobile criada · thread" in the channel; the thread opens with the pinned live mission
    card (horizon in pixel/dither in Dev's tones, phase, tasks, pending, time, Abrir missão).
  3 three days later: Dev's message with work steps, 1 session done and 3 running in parallel, one voice.
  4 blocking decision with phone mockups; picking stamps the card, Dev replies, pending count drops.
  5 provisional decisions batch. 6 gate review package (approve advances the horizon; ask for changes inline).
  7 a new request mid-mission is folded in (queued task, or a decision when it conflicts).
  8 daily digest. 9 a second thread with Dev on another subject, its own Claude Code session.
  10 /mission in the composer and "Transformar em missão" on a conversation that grew.
  Sidebar with "Missões" (badge = what waits for you) is context only. Mono only for branches, paths, logs.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --plate:rgba(127,127,127,.1);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --plate:rgba(127,127,127,.14);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum";display:flex;flex-direction:column;height:100vh;height:100dvh}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
code,.mono{font-family:var(--mono);font-size:.84em;letter-spacing:-.01em}

/* ---------- design system bits (verbatim from Missao.html) ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.fc:focus-visible,.seg button:focus-visible,.mi:focus-visible,.sw:focus-visible,.opt:focus-visible,.art:focus-visible,.tsum:focus-visible,.workh:focus-visible,.ws-t:focus-visible,.prc:focus-visible,.sb-item:focus-visible,.react:focus-visible,.send:focus-visible,.stp:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.b:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.ink{background:var(--ink);color:var(--bg)}
.chip.okc{color:var(--ok)}
.chip.dang{color:var(--danger)}
.chip.wrn{color:var(--warn)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sw{position:relative;width:36px;height:22px;border-radius:999px;border:0;padding:0;cursor:pointer;flex:none;background:color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);transition:background .2s var(--out)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 2px 6px -2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:var(--bg)}
.sw:active::after{width:21px}
.sw[aria-checked="true"]:active::after{transform:translateX(11px)}
.spin{animation:spin 1.2s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blinkc{50%{opacity:0}}

/* Agents: the engine's body (canvas). People: a circle with the initial. */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .42);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex:none}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}
.steps{display:flex;gap:3px;flex-wrap:wrap}
.stp{height:26px;min-width:26px;padding:0 8px;border-radius:8px;border:0;background:var(--sunken);color:var(--muted);font-size:12px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .18s var(--spring)}
.stp:hover{color:var(--ink)}
.stp:active{transform:scale(.95)}
.stp[aria-current="step"]{background:var(--ink);color:var(--bg)}
.stp .l{display:none}
.stp[aria-current="step"] .l{display:inline}
.proto .now{color:var(--ink2);font-weight:600}

/* ---------- app frame ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr)}
.app.th{grid-template-columns:248px minmax(0,1fr) minmax(0,1.2fr)}
.apane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.thpane{border-left:1px solid var(--line);display:none}
.app.th .thpane{display:flex}
.phd{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 18px;border-bottom:1px solid var(--line);min-height:58px;flex:none}
.phd .t{flex:1;min-width:0}
.phd h1{font-size:16px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phd h1 svg.i{color:var(--faint)}
.phd small{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phd .back{display:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px 18px;min-height:0;scroll-behavior:auto}

/* ---------- sidebar (from CeuNoApp.html) ---------- */
.sb{position:relative;background:var(--sunken);display:flex;flex-direction:column;gap:16px;padding:14px 12px;overflow-y:auto;border-right:1px solid var(--line);min-height:0}
.org-in{display:flex;align-items:center;gap:10px;padding:4px 6px}
.org-in .tx{min-width:0}
.org-in b{display:block;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.org-in small{display:block;color:var(--muted);font-size:12px}
.sb-jump{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);font-size:13.5px;flex:none;border:0;cursor:pointer;width:100%;text-align:left}
.sb-jump span{flex:1}
.sb-group{display:flex;flex-direction:column;gap:1px}
.sb-label{font-size:12px;font-weight:650;color:var(--faint);padding:0 8px 4px}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;min-height:34px;padding:4px 8px;border-radius:10px;color:var(--ink2);font-size:14.5px;cursor:pointer;user-select:none;border:0;background:transparent;width:100%;text-align:left}
.sb-item:hover{background:var(--plate)}
.sb-item.on{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.sb-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .meta{font-size:12px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.sb-item .meta svg.i{width:12px;height:12px}
.sb-item svg.i{color:var(--faint)}
.sb-item.on svg.i{color:var(--ink2)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.me .tx{flex:1;min-width:0}
.me b{display:block;font-size:13.5px;font-weight:650}
.me small{display:block;font-size:12px;color:var(--muted)}

/* ---------- messages (Componentes.dc.html) ---------- */
.day{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:650;color:var(--faint);margin:14px 12px 6px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{position:relative;display:flex;gap:12px;padding:10px 12px;border-radius:14px;transition:background .15s;animation:fi .3s var(--out) both}
.msg:hover{background:rgba(127,127,127,.05)}
.msg.flash{animation:flash 1.4s var(--out)}
@keyframes flash{0%{background:color-mix(in srgb,var(--ink) 9%,transparent)}100%{background:transparent}}
.msg .av-col{width:34px;flex:none;display:flex;justify-content:center}
.msg .body{flex:1;min-width:0}
.mhdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mt{font-size:12px;color:var(--faint)}
.mx{font-size:14.5px;line-height:1.6;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.mx p+p{margin-top:6px}
.mx b{color:var(--ink);font-weight:650}
.mention{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink);background:var(--sunken);padding:0 6px 0 3px;border-radius:7px;vertical-align:1px;line-height:1.5}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--faint);font-size:13.5px}
.curs{display:inline-block;width:7px;height:15px;background:var(--agent);vertical-align:-2px;margin-left:2px;animation:blinkc 1s steps(1) infinite}
.macts{position:absolute;top:-12px;right:12px;display:none;gap:2px;padding:3px;border-radius:12px;z-index:4}
.macts .ib{width:28px;height:28px;border-radius:8px}
.macts .ib svg.i{width:15px;height:15px}
.msg:hover .macts,.macts.show{display:flex}
.wake{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted)}
.wake svg.i{width:12px;height:12px}
.sysline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint);padding:4px 12px 4px 58px}
.sysline svg.i{width:13px;height:13px}
.sysline b{color:var(--ink2);font-weight:600}

/* work steps inside a message */
.work{margin-top:10px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;max-width:640px}
.workh{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:0;background:transparent;font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.workh:hover{background:rgba(127,127,127,.06)}
.workh strong{color:var(--ink2);font-weight:600}
.workh .grow{flex:1}
.chevx{transition:transform .25s var(--out);flex:none;color:var(--faint)}
.chevx.open{transform:rotate(90deg)}
.wlist{border-top:1px solid var(--line)}
.wstep{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:start;gap:10px;padding:9px 14px 9px 14px;font-size:13px;color:var(--ink2);animation:fi .25s var(--out) both;border-top:1px solid var(--line)}
.wstep:first-child{border-top:0}
.wstep:hover{background:rgba(127,127,127,.05)}
.wstep .wi{width:20px;height:20px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--ink2);margin-top:1px}
.wstep .wi svg.i{width:12px;height:12px;stroke-width:2.2}
.wstep .wi.done{background:var(--ink);color:var(--bg)}
.wstep .wi.run{color:var(--agent);background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--agent) 30%,transparent)}
.wstep .wi.fail{color:var(--danger)}
.ws-t{display:block;min-width:0;width:100%;padding:0;border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ws-t b{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.ws-t b>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ws-t b svg.i{width:13px;height:13px;color:var(--faint);flex:none;transition:transform .2s var(--out)}
.ws-t[aria-expanded="true"] b svg.i{transform:rotate(90deg)}
.wstep .wline{display:flex;align-items:center;gap:6px;min-width:0;margin-top:2px;font-size:12.5px;color:var(--muted)}
.wstep .wline>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wstep .wline.fresh>span:first-child{animation:fi .35s var(--out)}
.wstep .wline .curs{height:11px;width:6px;flex:none;margin-left:0}
.wstep .br{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:11px;color:var(--faint);min-width:0}
.wstep .br svg.i{width:11px;height:11px;flex:none}
.wstep .br code{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ws-r{display:flex;align-items:center;gap:6px;padding-top:1px}
.wstep .wd{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.wstep .wd.live{color:var(--ink2);font-weight:600}
.prc{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:0;border-radius:999px;background:var(--sunken);font:inherit;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;cursor:pointer}
.prc:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.prc svg.i{width:12px;height:12px;color:var(--muted)}
.sx{margin:0 14px 10px 44px;padding:10px 12px;border-radius:12px;background:var(--sunken);display:flex;flex-direction:column;gap:8px;animation:fi .25s var(--out) both;min-width:0}
.sx h4{margin:0;display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:650;color:var(--ink2)}
.sx h4 span{font-weight:500;color:var(--faint)}
.sx ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;min-width:0}
.sx li{min-width:0}
.sx li code{display:block;font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx .more{align-self:flex-start;padding:0;border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.sx .more:hover{color:var(--ink)}
.sx .none{font-size:12.5px;color:var(--faint)}
.sx .log{margin:0;background:var(--raised)}
.sx-f{display:flex;gap:6px;flex-wrap:wrap}
.log{margin:0 14px 10px 44px;padding:10px 12px;border-radius:12px;background:var(--sunken);font-family:var(--mono);font-size:10.5px;line-height:1.8;color:var(--ink2);max-height:200px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.log .ln{display:block;animation:fi .25s var(--out) both}
.log .cmd{color:var(--ink)}
.log .dim{color:var(--faint)}
.log .okl{color:var(--ok)}
.log .err{color:var(--danger)}
.log .cur{display:inline-block;width:7px;height:12px;background:var(--agent);vertical-align:-2px;animation:blinkc 1s steps(1) infinite}
.wfoot{display:flex;align-items:center;gap:7px;padding:8px 14px 10px;font-size:12px;color:var(--faint);border-top:1px solid var(--line)}
.wfoot svg.i{width:13px;height:13px}

/* artifact card with thumbnail + reactions */
.artc{margin-top:10px;display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:440px;transition:box-shadow .2s,transform .2s var(--spring);cursor:pointer;border:0;text-align:left;width:100%}
.artc:hover{box-shadow:var(--e2),var(--top);transform:translateY(-1px)}
.artc .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.artc .tt b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artc .tt small{font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artc .tt small code{font-size:10.5px}
.thumb{width:44px;height:54px;border-radius:8px;background:linear-gradient(180deg,var(--raised),var(--sunken));box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 7px;flex:none}
.thumb span{height:3px;border-radius:2px;background:var(--line2)}
.thumb span.a{background:color-mix(in srgb,var(--ok) 55%,transparent)}
.thumb span.r{background:color-mix(in srgb,var(--danger) 50%,transparent)}
.arts-row{display:flex;gap:8px;flex-wrap:wrap;max-width:640px}
.arts-row .artc{flex:1 1 220px;margin-top:10px}
.reacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.react{height:26px;padding:0 9px;border-radius:999px;border:0;background:var(--sunken);font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:transform .2s var(--spring),background .15s,box-shadow .15s}
.react:hover{transform:translateY(-1px)}
.react svg.i{width:13px;height:13px}
.react.on{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

/* thread summary under a channel message */
.tsum{margin-top:8px;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:12px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;color:var(--muted);cursor:pointer;text-align:left;max-width:100%;transition:box-shadow .15s,transform .2s var(--spring)}
.tsum:hover{box-shadow:var(--e2),var(--top)}
.tsum.on{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tsum .who{display:flex}
.tsum .who>*+*{margin-left:-6px}
.tsum .who .pp{box-shadow:0 0 0 2px var(--raised)}
.tsum b{color:var(--ink);font-weight:650}
.tsum .tx{min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tsum .tx code{font-size:10.5px;color:var(--ink2)}
.tsum svg.i{width:13px;height:13px}
.tsum .run{color:var(--agent)}
.tsum .sep{color:var(--line2)}

/* ---------- generic card (neutral) ---------- */
.card{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:16px;position:relative;margin-top:10px;max-width:680px}
.q-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.q-h{display:flex;gap:12px;align-items:flex-start}
.q-h .t{flex:1;min-width:0}
.q-h h3{font-size:16.5px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.q-h p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:70ch}
.q-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.q-f .grow{flex:1}
.hint{font-size:12.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.hint svg.i{width:14px;height:14px}
.stamp{position:absolute;inset:0;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--raised) 86%,transparent);font-weight:650;font-size:15px;animation:fi .2s var(--out) both;z-index:2}
.stamp .ok{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
.card.flash,.prop.flash{animation:cflash 1.4s var(--out)}
@keyframes cflash{0%{box-shadow:0 0 0 2px var(--ink),var(--top)}100%{box-shadow:var(--e1),var(--top)}}

/* options (decisions) */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.opt{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:10px;border-radius:16px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;transition:box-shadow .18s var(--out),transform .2s var(--spring),background .15s}
.opt:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.opt:active{transform:scale(.985)}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:color-mix(in srgb,var(--sunken) 40%,var(--raised))}
.opt .top{display:flex;align-items:flex-start;gap:10px}
.opt .rd{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px;box-shadow:inset 0 0 0 1.5px var(--line2);transition:box-shadow .2s var(--spring)}
.opt[aria-checked="true"] .rd{box-shadow:inset 0 0 0 5.5px var(--ink)}
.opt b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.opt .othumb{display:flex;justify-content:center;padding:10px 0 0;border-radius:12px;background:var(--sunken);overflow:hidden;height:112px}
.why{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sunken);font-size:13.5px;color:var(--ink2)}
.why .k{font-size:12px;font-weight:650;color:var(--faint);padding-top:1px;white-space:nowrap}
.why .k.ag{display:flex;align-items:flex-start;gap:6px}
.decided{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.decided .ok{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.decided .t{flex:1;min-width:0}
.decided b{display:block;font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.decided small{display:block;color:var(--muted);font-size:12.5px}
.decided small code{font-size:10.5px}

/* proposal card */
.prop{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);margin-top:10px;max-width:640px;position:relative;overflow:hidden;animation:popin .32s var(--spring) both}
.prop-h{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 4px}
.prop-h .t{flex:1;min-width:0}
.prop-h h3{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.prop-h p{color:var(--muted);font-size:13.5px;margin-top:4px}
.prop-b{padding:10px 16px 2px;display:flex;flex-direction:column;gap:12px}
.pf{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:13.5px}
.pf>.k{font-size:12.5px;font-weight:650;color:var(--faint)}
.pf>.v{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink2)}
.pf>.v small{color:var(--faint);font-size:12.5px}
.pf .inp{flex:1}
.phs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.phs .pc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:10px;background:var(--sunken);font-size:13px;font-weight:600;color:var(--ink2);animation:fi .2s var(--out) both}
.phs .pc .n{color:var(--faint);font-weight:500;font-size:12px}
.phs .pc button{width:20px;height:20px;border-radius:6px;border:0;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.phs .pc button:hover{background:rgba(127,127,127,.15);color:var(--ink)}
.phs .pc button svg.i{width:12px;height:12px}
.phs .gt{color:var(--faint);display:inline-flex}
.phs .gt svg.i{width:13px;height:13px}
.phs .pc input{all:unset;width:9ch;font-size:13px;font-weight:600}
.where-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--sunken);font-size:13.5px;min-width:0;border:0;text-align:left;color:inherit}
button.where-row{cursor:pointer}
.where-row .ic{width:28px;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.where-row .t{flex:1;min-width:0}
.where-row b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-row b code{font-weight:400}
.where-row small{display:block;color:var(--faint);font-size:12px}
.whyp{display:flex;align-items:flex-start;gap:8px;margin:12px 16px 0;padding:10px 12px;border-radius:14px;background:var(--sunken);font-size:13px;color:var(--ink2)}
.whyp svg.i{width:14px;height:14px;color:var(--faint);margin-top:3px}
.prop-f{display:flex;flex-wrap:wrap;align-items:center;gap:26px 8px;padding:14px 16px 34px}
.prop-f .grow{flex:1}
.cta{position:relative;display:inline-flex}
.cta small{position:absolute;left:2px;top:100%;margin-top:5px;font-size:11.5px;color:var(--faint);white-space:nowrap}
.inp{display:flex;align-items:center;gap:9px;min-height:36px;padding:0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s;min-width:0}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp input,.inp textarea{all:unset;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.inp textarea{padding:9px 0;line-height:1.5;min-height:60px;white-space:pre-wrap}
.inp.ta{align-items:flex-start}
.created{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:640px;animation:popin .3s var(--spring) both}
.created .fl{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.created .t{flex:1;min-width:0}
.created b{display:block;font-weight:650;font-size:14.5px}
.created small{display:block;color:var(--faint);font-size:12.5px}

/* gate review package */
.gl{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-top:14px}
.gl ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink2)}
.gl li{display:flex;gap:9px;align-items:flex-start}
.gl li svg.i{width:15px;height:15px;color:var(--faint);margin-top:2px}
.shots{display:flex;gap:8px;justify-content:center;align-items:flex-end;padding:12px 8px 0;border-radius:16px;background:var(--sunken);overflow:hidden;height:168px}
.gfacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gfacts .where-row{flex:1 1 200px}
.adj{margin-top:12px;display:flex;flex-direction:column;gap:8px;animation:fi .25s var(--out) both}

/* provisional decisions */
.plist{margin-top:12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border-top:1px solid var(--line);transition:background .15s}
.prow:first-child{border-top:0}
.prow .ic{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.prow.done .ic{background:var(--ink);color:var(--bg)}
.prow b{display:block;font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.prow small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.prow .acts{display:flex;gap:6px}
.prow.taking{animation:rowtaken .6s var(--out)}
@keyframes rowtaken{0%{background:transparent}40%{background:color-mix(in srgb,var(--sunken) 80%,transparent)}100%{background:transparent}}

/* folded request */
.fold{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);margin-top:12px}
.fold .ic{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.fold b{display:block;font-weight:650;font-size:14px}
.fold small{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:2px}
.fold small code{font-size:10.5px;color:var(--ink2)}
canvas.slots{height:12px;image-rendering:pixelated;vertical-align:middle}

/* digest */
.digest{display:flex;flex-direction:column;gap:10px}
.digest .blk{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:13.5px;color:var(--ink2);padding-top:10px;border-top:1px solid var(--line)}
.digest .blk:first-child{border-top:0;padding-top:0}
.digest .blk .k{font-size:12px;font-weight:650;color:var(--faint);padding-top:1px}
.digest .blk ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.digest .blk button{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.digest .blk button:hover{text-decoration-color:var(--ink)}
.digest .blk s{color:var(--faint)}

/* ---------- pinned live mission card ---------- */
.pinned{position:sticky;top:-8px;z-index:6;margin:0 2px 6px;border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:12px 14px 0;overflow:hidden}
.pin-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pin-h .t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pin-h .t b{font-weight:650;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
.pin-h .t .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600}
.pin-stage{position:relative;height:46px;margin-top:6px}
canvas.mh{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pin-ph{display:grid;font-size:11.5px;color:var(--faint);padding:2px 0 0}
.pin-ph span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;border-left:1px dashed var(--line2)}
.pin-ph span:first-child{border-left:0;padding-left:0}
.pin-ph span.cur{color:var(--ink);font-weight:650}
.pin-ph span.done{color:var(--muted)}
.pin-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0 12px}
.pm{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:999px;background:var(--sunken);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;border:0}
button.pm{cursor:pointer}
button.pm:hover{background:color-mix(in srgb,var(--ink) 10%,var(--sunken))}
.pm svg.i{width:13px;height:13px;color:var(--muted)}
.pm .run{color:var(--agent)}
.pm small{color:var(--faint);font-weight:500;font-size:12px}
.pm .bar{width:40px;height:5px;border-radius:5px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.pm .bar i{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .5s var(--out)}
.pm.bump{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.08)}}
.pinned.min .pin-stage,.pinned.min .pin-ph{display:none}
.pinned.min .pin-m{padding-top:6px}
canvas.horizon{position:absolute;left:0;right:0;bottom:0;width:100%;height:10px;image-rendering:pixelated;pointer-events:none}
.skip{display:flex;justify-content:center;margin:14px 0 4px}
.older{display:flex;align-items:center;gap:8px;margin:6px 12px;padding:8px 12px;border-radius:12px;background:transparent;border:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.older:hover{background:var(--plate);color:var(--ink)}
.older svg.i{width:14px;height:14px}

/* fake phone screens (verbatim from Missao.html) */
.phone{--w:108px;width:var(--w);height:calc(var(--w) * 2.05);flex:none;border-radius:calc(var(--w) * .16) calc(var(--w) * .16) 0 0;background:#151514;padding:calc(var(--w) * .035) calc(var(--w) * .035) 0;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
.phone .scr{width:100%;height:100%;border-radius:calc(var(--w) * .13) calc(var(--w) * .13) 0 0;background:#fbfbf9;overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:calc(var(--w) * .062);color:#2a2a28;line-height:1.3}
:root[data-theme="dark"] .phone{background:#2c2c2a}
:root[data-theme="dark"] .phone .scr{background:#141413;color:#d6d6d2}
.phone .isl{width:32%;height:calc(var(--w) * .06);border-radius:99px;background:#151514;margin:calc(var(--w) * .04) auto calc(var(--w) * .03)}
:root[data-theme="dark"] .phone .isl{background:#000}
.phone .ttl{font-weight:700;font-size:calc(var(--w) * .095);padding:0 9% 4%;letter-spacing:-.02em}
.phone .rw{display:flex;align-items:center;gap:6%;padding:3.5% 9%}
.phone .rw .ln{flex:1}
.phone .ln{display:block;height:calc(var(--w) * .03);border-radius:3px;background:color-mix(in srgb,currentColor 18%,transparent)}
.phone .ln.s{width:55%}
.phone .ln.m{width:75%}
.phone .lns{display:flex;flex-direction:column;gap:calc(var(--w) * .025);flex:1}
.phone .hashc{width:calc(var(--w) * .1);height:calc(var(--w) * .1);border-radius:30%;background:color-mix(in srgb,currentColor 12%,transparent);flex:none}
.phone .tabs{margin-top:auto;display:flex;justify-content:space-around;padding:5% 6% 9%;border-top:1px solid color-mix(in srgb,currentColor 10%,transparent)}
.phone .tabs i{width:calc(var(--w) * .085);height:calc(var(--w) * .085);border-radius:28%;background:color-mix(in srgb,currentColor 22%,transparent)}
.phone .tabs i.on{background:currentColor}
.phone .bub{max-width:72%;padding:4% 6%;border-radius:calc(var(--w) * .06);margin:2% 7%;background:color-mix(in srgb,currentColor 9%,transparent);display:flex;flex-direction:column;gap:calc(var(--w) * .02)}
.phone .bub.me{align-self:flex-end;background:#151514;color:#fbfbf9}
:root[data-theme="dark"] .phone .bub.me{background:#efefec;color:#141413}
.phone .bub .ln{background:color-mix(in srgb,currentColor 30%,transparent)}
.phone .agl{display:flex;align-items:flex-start;gap:4%;padding:0 7%;margin-top:2%}
.phone .agl .bub{margin:0}
.phone .cur{display:inline-block;width:calc(var(--w) * .03);height:calc(var(--w) * .06);background:var(--agent);animation:blinkc 1s steps(1) infinite;vertical-align:middle}
.phone .cmp{margin:auto 7% 8%;height:calc(var(--w) * .13);border-radius:99px;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}
.phone .drw{position:absolute;inset:0;display:flex}
.phone .drw .pane{width:68%;height:100%;background:color-mix(in srgb,#ebebe7 90%,transparent);padding-top:22%;display:flex;flex-direction:column;box-shadow:6px 0 14px -6px rgba(0,0,0,.3)}
:root[data-theme="dark"] .phone .drw .pane{background:#0a0a09}
.phone .drw .dim{flex:1;background:rgba(0,0,0,.18)}
.phone .sky{position:relative;height:44%;margin:0 6%;border-radius:calc(var(--w) * .08);overflow:hidden;display:flex;align-items:center;justify-content:center}
.phone .sky canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.phone .sky .agw{position:relative}
.phone .btn{margin:auto 9% 10%;height:calc(var(--w) * .13);border-radius:calc(var(--w) * .04);background:#151514}
:root[data-theme="dark"] .phone .btn{background:#efefec}
.phone .apr{margin:4% 7%;padding:6%;border-radius:calc(var(--w) * .06);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 14%,transparent);display:flex;flex-direction:column;gap:calc(var(--w) * .03)}

  $("#app").classList.toggle("th", !!S.thread);

  const c = $("#chanScroll"), t = $("#thScroll");
  if (c && cs != null) c.scrollTop = cs;
  if (t && ts != null && prevThread === S.thread) t.scrollTop = ts;
  else if (t && prevThread !== S.thread) t.scrollTop = t.scrollHeight;
  render.lastThread = S.thread;
  for (const el of $$("[data-pseg]")) seg(el, String(S[el.dataset.pseg]), (v) => { S[el.dataset.pseg] = +v; });
  for (const ta of $$("[data-ta]")) autosize(ta);
  if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus({ preventScroll: true }); if (selS != null && f.setSelectionRange) try { f.setSelectionRange(selS, selS); } catch {} } }
  const adj = $("#adj"); if (adj) adj.oninput = () => { S.adjText = adj.value; };
  renderSteps();

}
function autosize(ta) { ta.style.height = "auto"; ta.style.height = Math.min(160, ta.scrollHeight) + "px"; }
function scrollToEl(id, where = "center", flash = true) {
  const el = document.getElementById(id); if (!el) return;
  const sc = el.closest(".scroll"); if (!sc) return;
  const pin = sc.querySelector(".pinned"), off = pin && !pin.contains(el) ? pin.offsetHeight + 8 : 0;
  const er = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
  let top = sc.scrollTop + er.top - sr.top - off - 8;
  if (where === "center") top -= Math.max(0, (sc.clientHeight - off - er.height) / 2);
  if (where === "end") top = sc.scrollHeight;
  sc.scrollTo({ top, behavior: REDUCED ? "auto" : "smooth" });
  if (flash && el.classList.contains("card")) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}
const toBottom = () => requestAnimationFrame(() => { const t = $("#thScroll"); t?.scrollTo({ top: t.scrollHeight, behavior: REDUCED ? "auto" : "smooth" }); });

/* ---------- menus ---------- */
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(anchor, html, align = "end") {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu glass"; m.setAttribute("role", "menu");
  m.innerHTML = html;
  document.body.append(m); menuEl = m;
  hydrate(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let left = align === "end" ? r.right - mw : r.left;
  left = Math.min(Math.max(12, left), innerWidth - mw - 12);
  let top = r.bottom + 6;
  if (top + mh > innerHeight - 12) top = Math.max(12, r.top - mh - 6);
  m.style.left = left + "px"; m.style.top = top + "px";
  m.querySelector(".mi")?.focus({ preventScroll: true });
}

/* ---------- toasts ---------- */
function toast({ icon = I.check, ok = true, title, sub = "", action, ms = 3800 }) {
  const t = document.createElement("div");
  t.className = "toast glass"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="tic ${ok ? "ok" : ""}">${icon}</span><div class="tt"><b>${esc(title)}</b>${sub ? `<small>${sub}</small>` : ""}</div>${action ? `<button class="b bg sm" type="button">${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { action.run(); dismiss(t); };
  $("#toasts").append(t);
  setTimeout(() => dismiss(t), ms);
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add("out"); setTimeout(() => t.remove(), 200); }

/* ---------- Dev replies: think (looks around), write (dashes, cursor), then the message ---------- */
let mid = 0;
function devReply(list, m, delay = 900) {
  const msg = { id: "x" + (++mid), who: "dev", at: new Date(nowMs()), mode: "think", ...m };
  const html = msg.html; msg.html = undefined; const card = msg.card; msg.card = undefined;
  list.push(msg); render(); toBottom();
  setTimeout(() => { msg.mode = "write"; msg.html = html; render(); toBottom(); }, REDUCED ? 0 : delay);
  setTimeout(() => { msg.mode = m.mode || "idle"; msg.card = card; render(); toBottom(); }, REDUCED ? 0 : delay + 600);
  return msg;
}
function personMsg(list, text, extra = {}) { list.push({ id: "x" + (++mid), who: "walter", at: new Date(nowMs()), text, ...extra }); }
function bumpPin() { requestAnimationFrame(() => { for (const el of $$("#pinned .pm")) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } }); }

/* ---------- story actions ---------- */
function sendAsk() {
  S.drafts.chan = ""; S.proposal = "thinking"; S.slashCh = null; S.missionPill = false; render();
  const c = $("#chanScroll"); c.scrollTo({ top: c.scrollHeight });
  setTimeout(() => { S.proposal = "writing"; render(); c.scrollTo({ top: c.scrollHeight }); }, REDUCED ? 0 : 1700);
  setTimeout(() => { S.proposal = "card"; render(); requestAnimationFrame(() => scrollToEl("prop", "start", false)); }, REDUCED ? 0 : 2500);
}
function createMission() {
  const p = $("#prop");
  if (p && !REDUCED) p.insertAdjacentHTML("beforeend", `<div class="stamp"><span class="ok">${I.flag}</span>Missão criada</div>`);
  setTimeout(() => {
    S.proposal = "created"; S.adjusting = false; S.step = 2; S.thread = "mission"; render();
    toast({ icon: I.flag, title: "Missão App mobile criada", sub: "Ela mora numa thread em #produto, com o plano fixado no topo. Dev já está no plano da fase 1." });
  }, REDUCED ? 0 : 600);
}
function toFriday(step) {
  if (S.story !== "friday") {
    const keep = { phases: S.phases, slots: S.slots, stopGates: S.stopGates };
    reset("friday"); Object.assign(S, keep); S.proposal = "created";
  }
  S.step = step; S.coach = false; S.slashCh = null; S.sugs = step === 7;
}
function goStep(n) {
  closeMenu();
  if (n === 1) { reset("fresh"); render(); setTimeout(() => $("#ta-chan")?.focus(), 50); return; }
  if (n === 2) { reset("fresh"); S.proposal = "created"; S.step = 2; S.thread = "mission"; render(); return; }
  toFriday(n);
  const target = { 3: ["msg-f10", "start"], 4: ["card-d1", "center"], 5: ["card-prov", "center"], 6: ["card-gate", "center"], 8: ["card-digest", "center"] }[n];
  if (n <= 8) { S.thread = "mission"; S.open["w-now"] = n === 3 || S.open["w-now"]; }
  if (n === 7) { S.drafts.mission = S.drafts.mission || "adiciona dark mode também"; S.open["w-now"] = false; }
  if (n === 9) { S.thread = "billing"; S.open["w-rv"] = true; S.flashBilling = true; }
  if (n === 10) { S.thread = null; S.coach = true; S.drafts.chan = "/mi"; S.slashCh = "chan"; }
  render(); S.flashBilling = false;
  if (target) requestAnimationFrame(() => requestAnimationFrame(() => scrollToEl(target[0], target[1] === "start" ? "start" : "center", true)));
  if (n === 7) { toBottom(); setTimeout(() => { const ta = $("#ta-mission"); ta?.focus(); }, 60); }
  if (n === 10) { const c = $("#chanScroll"); c.scrollTop = c.scrollHeight; setTimeout(() => $("#ta-chan")?.focus(), 60); }
}

function decide(id) {
  const d = D.find((x) => x.id === id), k = S.pick[id]; if (!d || !k) return;
  const opt = d.options.find((o) => o.k === k);
  const card = $(`#card-${id}`);
  if (card && !REDUCED) card.insertAdjacentHTML("beforeend", `<div class="stamp"><span class="ok">${I.check}</span>Tomada: ${esc(opt.t)}</div>`);
  setTimeout(() => {
    d.status = "taken"; d.by = "Walter"; d.choice = opt.t; d.thumb = opt.thumb; d.date = new Date(nowMs());
    const waiting = TASKS.find((t) => t.waitFor === id && t.state === "wait");
    if (waiting) { waiting.state = "queue"; waiting.waitFor = null; }
    S.step = 4; render(); bumpPin();
    devReply(TAIL, { wake: "você respondeu", html: `<p>${d.reply(opt.t)}</p>` });
  }, REDUCED ? 0 : 600);
}
function approveProv(ids) {
  for (const id of ids) $(`[data-prow="${id}"]`)?.classList.add("taking");
  setTimeout(() => {
    for (const id of ids) { const d = D.find((x) => x.id === id); d.status = "taken"; d.by = "Walter"; }
    S.step = 5; render(); bumpPin();
    devReply(TAIL, { wake: "você respondeu", html: ids.length > 1 ? `<p>Valeu. As ${ids.length} viraram decisões tomadas em <code>docs/decisoes.md</code>; as próximas sessões já começam sabendo.</p>` : `<p>Anotado: ${esc(D.find((x) => x.id === ids[0]).title.toLowerCase())} fica. Está em <code>docs/decisoes.md</code>.</p>` });
  }, REDUCED ? 0 : 450);
}
function changeProv(id, alt) {
  const d = D.find((x) => x.id === id);
  const from = d.choice; d.choice = alt; d.status = "taken"; d.by = "Walter"; d.changed = true;
  S.step = 5; render(); bumpPin();
  devReply(TAIL, { wake: "você respondeu", html: `<p>Troquei ${esc(from)} por <b>${esc(alt)}</b> e anotei em <code>docs/decisoes.md</code>. Ajusto o que já tinha feito na sessão de “Cliente da API e sessão”; custa uns 20 min.</p>` });
}
function approveGate() {
  const card = $("#card-gate");
  if (card && !REDUCED) card.insertAdjacentHTML("beforeend", `<div class="stamp"><span class="ok">${I.check}</span>Portão 2 aprovado</div>`);
  setTimeout(() => {
    S.gates[1] = "ok"; S.cur = 2; S.ahead = .3; S.step = 6; render(); bumpPin();
    devReply(TAIL, { wake: "você respondeu", html: "<p>Fiz o merge do PR #431. A fase <b>Base do app</b> começou; o que eu tinha adiantado em branches entra na fila de revisão. Sigo sem parar até o portão 3.</p>" });
    toast({ icon: I.flag, title: "Fase 3 · Base do app começou", sub: "O horizonte avançou aqui e na página da missão." });
  }, REDUCED ? 0 : 600);
}
function sendGateAdjust() {
  const txt = S.adjText.trim() || "O composer precisa de anexos.";
  S.gateAdj = false; S.gates[1] = "adjust"; S.adjText = "";
  personMsg(TAIL, txt); render();
  devReply(TAIL, { wake: "você respondeu", html: "<p>Entendi. Vou refazer os protótipos e volto com um pacote novo neste mesmo portão. Nada entra na main até lá.</p>" });
  setTimeout(() => { S.gates[1] = "wait"; render(); devReply(TAIL, { wake: "tarefa terminou", html: "<p>Pacote novo pronto: ajustei os protótipos e atualizei o PR #431. O portão está esperando você de novo.</p>" }); }, 6500);
}
function sendInThread(text) {
  S.drafts.mission = ""; S.sugs = false;
  personMsg(TAIL, text); render(); toBottom();
  if (/dark|escuro/i.test(text)) {
    const t = { id: "t8", name: "Dark mode", slug: "dark-mode", state: "queue", phase: 3 };
    setTimeout(() => {
      TASKS.push(t);
      devReply(TAIL, { wake: "você respondeu", html: `<p>Encaixei: virou a tarefa <b>Dark mode</b> na fase Telas (aguardando vaga, ${running().length} de ${MISSION.machine.slots} vagas ocupadas). Não abri uma sessão solta: entra na fila e começa quando abrir uma vaga.</p>`, card: () => foldHTML({ kind: "task", task: "t8" }) }, 1100);
      setTimeout(bumpPin, 1800);
    }, 200);
    return;
  }
  if (/google|login/i.test(text)) {
    const d = { id: "d11", status: "pending", blocking: true, phase: 2, title: "Login com Google: entra na v1?",
      ctx: "Conflita com uma decisão pendente: “Login no app: só link mágico ou também senha?”. Google no celular pede expo-auth-session e uma tela a mais.",
      blocks: "Conflita com “Login no app”", options: [{ k: "v1", t: "Google e link mágico na v1", d: "~3 h a mais em “Cliente da API e sessão”." }, { k: "v2", t: "Deixar para a v2", d: "Fica anotado no plano; nada muda agora.", rec: true }],
      why: "A v1 é responder e aprovar; quem entra por convite já usa link mágico. Google ajuda no cadastro, que no app ainda não existe.",
      impact: "Se entrar na v1, a sessão de login ganha ~3 h e o portão 3 atrasa meio dia.",
      reply: (c) => `Fechado: ${esc(c.toLowerCase())}. Anotei em <code>docs/decisoes.md</code>.` };
    D.push(d);
    devReply(TAIL, { wake: "você respondeu", html: "<p>Esse eu não encaixo sozinho: mexe numa decisão que ainda está com você. Virou uma decisão:</p>", card: () => decCardHTML(d) }, 1100);
    setTimeout(bumpPin, 1800);
    return;
  }
  devReply(TAIL, { wake: "você respondeu", html: "<p>Anotei na missão. Entra como contexto para as próximas sessões e eu aviso se mudar o plano.</p>" });
}
function sendChan(text) {
  if (S.missionPill || /^\/mission\b/i.test(text)) {
    S.missionPill = false; S.drafts.chan = ""; S.slashCh = null;
    toast({ icon: I.flag, ok: false, title: "Dev vai propor a missão", sub: "Com /mission ele pula a pergunta e já mostra a proposta para você ajustar." });
    render(); return;
  }
  if (S.story === "fresh" && S.proposal === "none" && /@dev/i.test(text) && text.length >= 40) return sendAsk();
  S.drafts.chan = ""; S.slashCh = null;
  personMsg(CHTAIL, text); render();
  const c = $("#chanScroll"); c.scrollTo({ top: c.scrollHeight });
  const m = { id: "x" + (++mid), who: "dev", at: new Date(nowMs()), mode: "think" };
  CHTAIL.push(m); render(); c.scrollTo({ top: c.scrollHeight });
  setTimeout(() => { m.mode = "idle"; m.html = "<p>Isso é rápido, respondo aqui mesmo: sem missão. Se crescer, uso ⋯ › Transformar em missão.</p>"; render(); c.scrollTo({ top: c.scrollHeight }); }, REDUCED ? 0 : 1200);
}

/* ---------- events ---------- */
document.addEventListener("input", (e) => {
  const ta = e.target.closest?.("[data-ta]");
  if (ta) {
    const ch = ta.dataset.ta; S.drafts[ch] = ta.value; autosize(ta);
    const wantSlash = ta.value.startsWith("/") && !ta.value.includes(" ");
    const send = $(`[data-send="${ch}"]`), has = ta.value.trim().length > 0;
    if ((S.slashCh === ch) !== wantSlash) { S.slashCh = wantSlash ? ch : null; render(); return; }
    if (send && send.classList.contains("on") !== has) { send.className = `send ${has ? "on" : "off"}`; send.innerHTML = `${has ? `<span>Enviar</span><span class="kbd">↵</span>` : ""}${I.send}`; }
    return;
  }
  const pn = e.target.closest?.("[data-phname]"); if (pn) S.phases[+pn.dataset.phname] = pn.value;
});
document.addEventListener("keydown", (e) => {
  const ta = e.target.closest?.("[data-ta]");
  if (ta && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $(`[data-send="${ta.dataset.ta}"]`)?.click(); return; }
  if (e.key === "Escape") { if (menuEl) return closeMenu(); if (S.slashCh) { S.slashCh = null; render(); return; } if (S.thread) { S.thread = null; render(); } }
});
function send(ch) {
  const text = (S.drafts[ch] || "").trim(); if (!text) return;
  if (ch === "chan") return sendChan(text);
  if (ch === "mission") { S.step = 7; return sendInThread(text); }
  S.drafts.billing = ""; personMsg(TAIL, text, { ch: "billing" }); render(); toBottom();
  devReply(TAIL, { ch: "billing", html: "<p>Anoto na revisão. Ponho isso no resumo do PR quando a sessão terminar.</p>" });
}
document.addEventListener("click", (e) => {
  const t = e.target;
  if (menuEl && !menuEl.contains(t) && !t.closest("[data-mmore],[data-change]")) closeMenu();
  if (menuEl && menuEl.contains(t)) {
    const m = t.closest("[data-m]"); if (!m) return; closeMenu();
    const k = m.dataset.m;
    if (k === "convert") { S.coach = false; render(); return toast({ icon: I.flag, title: "Dev vai ler a conversa", sub: "Ele lê as 14 respostas e posta uma proposta de missão na thread. Nada é criado sem você aprovar." }); }
    if (k.startsWith("alt:")) { const [, id, i] = k.split(":"); const d = D.find((x) => x.id === id); return changeProv(id, d.alt[+i]); }
    return toast({ icon: I.open, ok: false, title: m.textContent.trim() });
  }
  if (t.closest("[data-next]")) {
    if (S.step === 1 && S.proposal === "none") return sendAsk();
    if (S.step === 1 && S.proposal === "card") return createMission();
    if (S.step === 1 && (S.proposal === "thinking" || S.proposal === "writing")) return;
    return goStep(Math.min(STEPS.length, S.step + 1));
  }
  const sg = t.closest("[data-step-go]"); if (sg) return goStep(+sg.dataset.stepGo);
  const hr = t.closest("[data-href]"); if (hr) { location.href = hr.dataset.href; return; }
  const sn = t.closest("[data-send]"); if (sn) return send(sn.dataset.send);
  const cmd = t.closest("[data-cmd]");
  if (cmd) {
    if (cmd.dataset.cmd === "missao") { S.missionPill = true; S.drafts.chan = ""; S.slashCh = null; S.step = 10; render(); $("#ta-chan")?.focus(); return; }
    S.slashCh = null; S.drafts.chan = ""; render(); return toast({ icon: I.open, ok: false, title: `/${cmd.dataset.cmd}` });
  }
  if (t.closest("[data-unpill]")) { S.missionPill = false; render(); return; }
  const sug = t.closest("[data-sug]"); if (sug) { S.step = 7; return sendInThread(sug.dataset.sug); }
  if (t.closest("[data-create]")) return createMission();
  if (t.closest("[data-adjust]")) { S.adjusting = !S.adjusting; render(); return; }
  if (t.closest("[data-decline]")) { S.proposal = "declined"; render(); return; }
  if (t.closest("[data-psw]")) { S.stopGates = !S.stopGates; render(); return; }
  const rm = t.closest("[data-rmph]"); if (rm) { if (S.phases.length > 1) S.phases.splice(+rm.dataset.rmph, 1); render(); return; }
  if (t.closest("[data-addph]")) { S.phases.push(`Fase ${S.phases.length + 1}`); S.adjusting = true; render(); return; }
  const ot = t.closest("[data-open-thread]"); if (ot) { S.thread = S.thread === ot.dataset.openThread ? null : ot.dataset.openThread; if (S.thread === "billing" && S.story === "friday") S.step = 9; S.open["w-rv"] = true; render(); return; }
  if (t.closest("[data-close-thread]")) { S.thread = null; render(); return; }
  const wk = t.closest("[data-work]"); if (wk) { S.open[wk.dataset.work] = !S.open[wk.dataset.work]; render(); return; }
  const wl = t.closest("[data-wlog]"); if (wl) { S.logs[wl.dataset.wlog] = !S.logs[wl.dataset.wlog]; render(); return; }
  const wo = t.closest("[data-wout]"); if (wo) { S.outs[wo.dataset.wout] = !S.outs[wo.dataset.wout]; render(); return; }
  const wm = t.closest("[data-wmore]"); if (wm) { S.more[wm.dataset.wmore] = !S.more[wm.dataset.wmore]; render(); return; }
  if (t.closest("[data-pinmin]")) { S.pinMin = !S.pinMin; render(); return; }
  if (t.closest("[data-goto-need]")) {
    const first = pending()[0] ? `card-${pending()[0].id}` : S.gates[1] === "wait" ? "card-gate" : "card-prov";
    return scrollToEl(first, "center", true);
  }
  const gt = t.closest("[data-goto]"); if (gt) { S.step = +gt.dataset.step || S.step; renderSteps(); return scrollToEl(gt.dataset.goto, "center", true); }
  const pk = t.closest("[data-pick]");
  if (pk) {
    S.pick[pk.dataset.pick] = pk.dataset.k;
    const card = pk.closest("[data-need]");
    if (card) {
      for (const o of $$(".opt[data-pick]", card)) o.setAttribute("aria-checked", o.dataset.k === pk.dataset.k);
      const d = D.find((x) => x.id === pk.dataset.pick), btn = $("[data-decide]", card);
      btn.disabled = false; btn.innerHTML = `${I.check}Decidir: ${esc(d.options.find((o) => o.k === pk.dataset.k).t)}`;
    }
    return;
  }
  const dc = t.closest("[data-decide]"); if (dc) return decide(dc.dataset.decide);
  const ap = t.closest("[data-approve]"); if (ap) return approveProv([ap.dataset.approve]);
  if (t.closest("[data-approve-all]")) return approveProv(provs().filter((d) => ["d3", "d4", "d5", "d6"].includes(d.id)).map((d) => d.id));
  const ch = t.closest("[data-change]");
  if (ch) { const d = D.find((x) => x.id === ch.dataset.change); return openMenu(ch, `<div class="mgroup">Trocar ${esc(d.choice)} por</div>${d.alt.map((a, i) => `<button class="mi" type="button" data-m="alt:${d.id}:${i}">${I.refresh}<span>${esc(a)}</span></button>`).join("")}`); }
  if (t.closest("[data-gate-ok]")) return approveGate();
  if (t.closest("[data-adj]")) { S.gateAdj = true; render(); $("#adj")?.focus(); return; }
  if (t.closest("[data-adj-cancel]")) { S.gateAdj = false; render(); return; }
  if (t.closest("[data-adj-send]")) return sendGateAdjust();
  if (t.closest("[data-like]")) { S.liked = !S.liked; render(); return; }
  const mm = t.closest("[data-mmore]");
  if (mm) {
    const conv = mm.dataset.mmore === "c5" || mm.dataset.mmore === "c3" || mm.dataset.mmore === "c1";
    return openMenu(mm, `<button class="mi" type="button" data-m="reply">${I.thread}<span>Responder na thread</span></button>
      <button class="mi" type="button" data-m="link">${I.link}<span>Copiar link</span></button>
      <button class="mi" type="button" data-m="issue">${I.issue}<span>Criar issue</span></button>
      ${conv ? `<div class="msep"></div><button class="mi" type="button" data-m="convert">${I.flag}<span>Transformar em missão</span><span class="sub">Dev propõe</span></button>` : ""}`);
  }
  if (t.closest("[data-react]")) return toast({ icon: I.smile, ok: false, title: "Reagir" });
  const ts = t.closest("[data-toast]"); if (ts) return toast({ icon: I.open, ok: false, title: ts.dataset.toast });
});

/* ---------- theme ---------- */
function seg(el, value, on) {
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); if (!b) return; pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });

reset("fresh");
render();
</script>
