<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configurações da missão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: the mission thread's ⋯ menu and "Configurações da missão" (sibling of ThreadContexto.html,
  MissaoChat.html and TarefaLonga.html: same tokens, buttons, menus, glass toasts and agent engine).
  Body rhythm: spacing 8/12/16/24, body text 14px, meta 13px, few boxes.
  Problem: the header ⋯ mixed actions (Pausar, Parar, Compartilhar) with a setting ("Pedir aprovação de
  comandos" as three radio rows in a menu), and missions asked for approval too often.
  Answer:
  1  The ⋯ menu only has actions: Pausar/Retomar, Parar, Compartilhar, Fechar missão, and
     "Configurações da missão…" (with the current autonomy as a hint). Each action says what it does.
  2  "Configurações da missão" is a centered dialog (DetailsDialog look: eyebrow, display title, close,
     own scroll, ~720px; bottom sheet on phone). Sections:
     - Autonomia: a vertical list of three radio rows (title + one short line; "Recomendado" inline on the
       middle one), one quiet example line that follows the selection, a plain "always asks you" line and
       a one-line stat ("14 liberados automaticamente · 3 perguntados · 0 bloqueados"). Each row leads with
       a 44px pixel illustration (engine Theo + glyph: "?" bubble, shield, bolt with trail); the selected
       one is alive, the others static and dimmed; reduced motion = static.
     - O que já foi liberado: the mission's "Aprovar sempre" rules, who/when, remove (×) with Desfazer.
       Tapping "Aprovar sempre" on a card in the thread adds a rule here.
     - Padrão do agente: "Usar como padrão" for the agent's next missions (does not touch existing ones).
     - "Mais opções" (collapsed): Quem faz o trabalho + computador (locked with the reason once the mission
       started; the prototype bar switches to "Ainda não começou" to show it editable) and Recuperação.
  Plain language for non-technical people: no internal model names, no jargon; mono only in the
  "já liberado" list (and the approval card in the thread, which shows the real command).
  Saving: autosave everywhere. Every change applies at once and shows a glass toast "Salvo" (removals carry
  Desfazer). The footer only says so and has "Pronto"; there is no Cancelar.
  Neutral selection (ink/gray); brand blue only for agent identity. Mono only for commands.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http). Theo = amber.
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --plate:rgba(127,127,127,.1);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --plate:rgba(127,127,127,.14);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum";display:flex;flex-direction:column;height:100vh;height:100dvh}
h1,h2,h3,h4,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
code,.mono{font-family:var(--mono);font-size:.84em;letter-spacing:-.01em}

/* ---------- design system bits (verbatim from ThreadContexto.html) ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.seg button:focus-visible,.mi:focus-visible,.opt:focus-visible,.sb-item:focus-visible,.send:focus-visible,.stp:focus-visible,.sw:focus-visible,.exr:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.b:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.ib[aria-expanded="true"]{background:rgba(127,127,127,.14);color:var(--ink)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.ink{background:var(--ink);color:var(--bg)}
.chip.okc{color:var(--ok)}
.chip.dang{color:var(--danger)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.spin{animation:spin 1.2s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blinkc{50%{opacity:0}}
.hint{font-size:12.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.hint svg.i{width:14px;height:14px}
/* switch (Forum.html) */
.sw{position:relative;width:36px;height:22px;border-radius:999px;border:0;padding:0;cursor:pointer;flex:none;background:color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);transition:background .2s var(--out)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 2px 6px -2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:var(--bg)}

/* Agents: the engine's body (canvas). People: a circle with the initial. */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .42);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}

/* ---------- prototype bar (not product) ---------- */
.proto{position:relative;z-index:75;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex:none}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px;padding:0 10px}
.proto .seg .pill{height:26px}
.proto .lab{font-size:12px;color:var(--faint)}

/* ---------- app frame ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr)}
.apane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px 18px;min-height:0}
.sb{position:relative;background:var(--sunken);display:flex;flex-direction:column;gap:16px;padding:14px 12px;overflow-y:auto;border-right:1px solid var(--line);min-height:0}
.org-in{display:flex;align-items:center;gap:10px;padding:4px 6px}
.org-in b{display:block;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.org-in small{display:block;color:var(--muted);font-size:12px}
.org-in .lg{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.sb-group{display:flex;flex-direction:column;gap:1px}
.sb-label{font-size:12px;font-weight:650;color:var(--faint);padding:0 8px 4px}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;min-height:34px;padding:4px 8px;border-radius:10px;color:var(--ink2);font-size:14.5px;cursor:pointer;user-select:none;border:0;background:transparent;width:100%;text-align:left}
.sb-item:hover{background:var(--plate)}
.sb-item.on{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.sb-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item svg.i{color:var(--faint)}

/* ---------- mission header (ThreadContexto App mobile / the real header) ---------- */
.mhd{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);min-height:62px;flex:none}
.mhd .back{display:none}
.mhd .t{flex:1;min-width:0}
.mhd h1{font-size:16px;font-weight:650;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhd .meta{display:flex;align-items:center;gap:6px;margin-top:3px;min-width:0;overflow:hidden}
.mhd .meta .chip{height:22px}
.xm{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 6px;border-radius:999px;background:var(--sunken);font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.xm svg.i{width:13px;height:13px;color:var(--muted)}
.parts{display:flex;align-items:center;padding:0 4px}
.parts>*+*{margin-left:-6px}
.parts .pp{box-shadow:0 0 0 2px var(--bg)}
.st-run svg.i{color:var(--ink2)}

/* ---------- thread content (trimmed from ThreadContexto) ---------- */
.day{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:650;color:var(--faint);margin:14px 12px 6px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{position:relative;display:flex;gap:12px;padding:10px 12px;border-radius:14px;animation:fi .3s var(--out) both}
.msg:hover{background:rgba(127,127,127,.05)}
.msg .av-col{width:34px;flex:none;display:flex;justify-content:center;align-items:flex-start}
.msg .body{flex:1;min-width:0}
.mhdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mt{font-size:12px;color:var(--faint)}
.mx{font-size:14.5px;line-height:1.6;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.evt{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;margin:4px 12px 4px 58px;font-size:12.5px;color:var(--faint);animation:fi .35s var(--out) both}
.evt>svg.i{width:13px;height:13px;align-self:flex-start;margin-top:3px}
.evt>span{flex:0 1 auto;min-width:0}
.evt b{color:var(--ink2);font-weight:600}
.evt code{font-size:10.5px;color:var(--ink2)}
.tlink{padding:0;border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink2);cursor:pointer}
.tlink:hover{text-decoration:underline;text-underline-offset:2px}
.card{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:16px;position:relative;margin-top:10px;max-width:640px;animation:popin .3s var(--spring) both}
.q-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.q-h h3{font-size:16px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.q-h p{color:var(--muted);font-size:13.5px;margin-top:4px}
.cmdl{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--sunken);font-family:var(--mono);font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.q-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.q-f .grow{flex:1}
.decided{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.decided .ok{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.decided .t{flex:1;min-width:0}
.decided b{display:block;font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.decided small{display:block;color:var(--muted);font-size:12.5px}
.decided small code{font-size:10.5px}
.cmpw{padding:0 14px 14px;flex:none}
.composer{border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top)}
.composer textarea{display:block;width:100%;border:0;outline:none;background:transparent;font-size:15px;color:var(--ink);padding:14px 16px 4px;resize:none;line-height:1.5;min-height:48px}
.composer textarea::placeholder{color:var(--faint)}
.ctools{display:flex;align-items:center;gap:6px;padding:6px 8px 8px 10px}
.send{margin-left:auto;height:34px;width:34px;border-radius:11px;border:0;display:inline-flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--faint);flex:none}
.closed-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13.5px;color:var(--ink2)}
.closed-bar .t{flex:1;min-width:0}

/* ---------- menu: actions only ---------- */
.menu{position:fixed;z-index:80;width:300px;max-width:calc(100vw - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:6px 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.mi:hover,.mi.on{background:rgba(127,127,127,.12)}
.mi>svg.i{color:var(--muted);align-self:flex-start;margin-top:2px}
.mi .tx{flex:1;min-width:0}
.mi .tx>span{display:block;font-weight:500}
.mi .tx small{display:block;font-size:12px;color:var(--faint);line-height:1.4;margin-top:1px}
.mi .sub{color:var(--faint);font-size:12.5px;margin-left:auto;padding-left:10px;white-space:nowrap;align-self:center}
.mi.dz>svg.i,.mi.dz .tx>span{color:var(--danger)}
.msep{height:1px;margin:6px 8px;background:var(--line)}

/* ---------- dialog (DetailsDialog look): eyebrow + display title, own scroll, 720px ---------- */
.scrim{position:fixed;inset:0;z-index:85;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s var(--out) both}
.dlg{outline:none;width:min(720px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;border-radius:22px;background:var(--raised);box-shadow:var(--e3),var(--top);animation:popin .28s var(--spring) both;overflow:hidden}
.dlg-h{display:flex;align-items:flex-start;gap:10px;padding:20px 16px 14px 22px;border-bottom:1px solid var(--line);flex:none}
.dlg-h .t{flex:1;min-width:0}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.dlg h2{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.dlg-h p{color:var(--muted);font-size:13.5px;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dlg-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 22px 8px}
.dlg-f{display:flex;align-items:center;gap:10px;padding:12px 16px 14px 22px;border-top:1px solid var(--line);flex:none}
.dlg-f .grow{flex:1}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--faint);min-width:0}
.saved svg.i{width:14px;height:14px}
.saved.flash{animation:fi .3s var(--out)}

/* Dialog body: one rhythm (8/12/16/24), two text sizes (body 14px, meta 13px), few boxes. */
.sec{padding:24px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:20px}
.sec-h{margin-bottom:12px}
.sec-h h3{font-size:15px;font-weight:650;letter-spacing:-.015em}
.sec-h p{font-size:13px;color:var(--muted);margin-top:2px;max-width:62ch}

/* radio rows (autonomy, who does the work): full width, same height, one left edge; neutral selection */
.rlist{display:flex;flex-direction:column;gap:8px}
.ropt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border-radius:14px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;text-align:left;color:inherit;transition:box-shadow .18s var(--out),background .15s,transform .2s var(--spring)}
.ropt:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.ropt:active{transform:scale(.993)}
.ropt:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--ink),0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent)}

.ropt .rd{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--line2);transition:box-shadow .2s var(--spring)}
.ropt[aria-checked="true"] .rd{box-shadow:inset 0 0 0 5.5px var(--ink)}
.ropt .tx{flex:1;min-width:0}
.ropt .ttl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650;letter-spacing:-.01em}
.ropt .ttl svg.i{width:16px;height:16px;color:var(--muted)}
.ropt .ln{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.rec{font-size:12px;font-weight:600;color:var(--faint)}
.rec::before{content:"·";margin-right:8px}
/* autonomy illustrations: a pixel Theo + a glyph (bubble "?", shield, bolt + trail) in his tones.
   Selected = alive (blink, glyph animates); others static and dimmed. Selection itself = row outline. */
.ill-row{padding-left:12px}
.ill{width:44px;height:44px;flex:none;image-rendering:pixelated;transition:opacity .2s var(--out),filter .2s var(--out)}
.ropt[aria-checked="false"] .ill{opacity:.5;filter:saturate(.55)}
.ropt[aria-checked="false"]:hover .ill{opacity:.8}
.lockd .ropt{cursor:default}
.lockd .ropt:not([aria-checked="true"]){opacity:.45}
.lockd .ropt:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.lockd .ropt[aria-checked="true"]:hover{box-shadow:inset 0 0 0 2px var(--ink)}

/* quiet lines under a list: example, always-blocked, stat, lock reason */
.note{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.note+.note{margin-top:8px}
.note svg.i{width:14px;height:14px;color:var(--faint);margin-top:3px}
.note b{color:var(--ink2);font-weight:600}
.note.ex{animation:fi .25s var(--out) both}
.note.stat{color:var(--faint)}

/* grouped list (rules, computer): one container, hairline rows */
.list{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 8px 8px 16px;border-top:1px solid var(--line);animation:fi .25s var(--out) both}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0}
.li .ttl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.li .ttl svg.i{color:var(--muted)}
.li code{display:block;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ln{display:block;font-size:13px;color:var(--faint);margin-top:1px}
.li.pad{padding-right:16px}
.li.out{animation:ruleout .2s var(--out) both}
@keyframes ruleout{to{opacity:0;transform:translateX(8px)}}
.empty{padding:16px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--muted)}
.empty b{display:block;color:var(--ink2);font-weight:600;font-size:14px}

/* "Mais opções": advanced bits, collapsed by default */
.moreb{display:flex;align-items:center;gap:12px;padding:8px 12px;margin:-8px -12px;width:calc(100% + 24px);border:0;border-radius:14px;background:transparent;text-align:left;cursor:pointer;color:inherit}
.moreb:hover{background:rgba(127,127,127,.06)}
.moreb:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ink)}
.moreb .t{flex:1;min-width:0}
.moreb b{display:block;font-size:15px;font-weight:650;letter-spacing:-.015em}
.moreb small{display:block;font-size:13px;color:var(--muted)}
.moreb .chev{color:var(--faint);transition:transform .25s var(--out)}

#moreBody{animation:fi .25s var(--out) both}
#moreBody .sec:first-child{border-top:0;padding-top:24px}
#moreBody .sec:last-child{padding-bottom:0}

/* setting rows (switch, agent default): no box */
.row{display:flex;align-items:center;gap:16px}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:600}
.row small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.row label{cursor:pointer}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:16px;width:380px;max-width:calc(100vw - 24px);animation:popin .25s var(--spring) both}
.toast .tic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sunken);color:var(--ink2)}
.toast .tic.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.toast .tt{flex:1;min-width:0}
.toast .tt b{display:block;font-size:14px;font-weight:600}
.toast .tt small{display:block;color:var(--muted);font-size:12.5px}
.toast .tt small code{font-size:10.5px}
.toast.out{animation:toastout .2s var(--out) both}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .opt .ex{margin-top:2px}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{display:none}
  .hide-s{display:none !important}
  .mhd{padding:8px 6px 8px 4px;gap:6px}
  .mhd .back{display:inline-flex}
  .parts{display:none}
  .scroll{padding:6px 4px 16px}
  .msg{gap:10px}
  .msg .av-col{width:28px}
  .evt{margin-left:12px;flex-wrap:nowrap;align-items:flex-start}
  .evt .tlink{flex:none}
  .cmpw{padding:0 10px 10px}
  .card{padding:14px}
  .scrim{align-items:flex-end;padding:0}
  .dlg{width:100%;max-height:92dvh;border-radius:22px 22px 0 0;animation:sheetin .32s var(--out) both}
  .dlg-h{padding:10px 10px 12px 18px;position:relative}
  .dlg-h::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:4px;background:var(--line2)}
  .dlg-h .t{padding-top:10px}
  .dlg h2{font-size:24px}
  .dlg-b{padding:0 18px 8px}
  .dlg-f{padding:10px 12px calc(12px + env(safe-area-inset-bottom)) 18px}
  .exg{grid-template-columns:minmax(0,1fr)}
  .row{align-items:flex-start}
  .toasts{right:12px;left:12px;bottom:12px;align-items:stretch}
  .toast{width:auto}
}
</style>
</head>

/* ---------- data ---------- */
const AGENTS = {
  theo: { name: "Theo", color: "amber", eyes: "round" },

const TITLE = "Carrossel Paris para o Instagram";
const COMPUTER = "mac";
const MODES = {

const EXECUTORS = {
  claude: { name: "Claude Code", icon: () => I.executorClaude, text: "Planeja e faz no computador." },
  codex: { name: "Codex", icon: () => I.executorCodex, text: "Faz no computador.", exp: true },

const RULES0 = [
  { id: "r1", cmd: "python3 *", who: "Walter", when: "hoje, 10:42", used: 6 },
  { id: "r2", cmd: "swift build *", who: "Walter", when: "hoje, 11:05", used: 3 },

// what happened in this mission so far: 14 low-risk commands passed automatically, 3 asked, 0 blocked
const STAT0 = { auto: 14, asked: 3, blocked: 0 };

let S;
function reset(keep = {}) {
  S = {
    started: true, state: "run", menu: false, dialog: false,
    mode: "risky", agentDefault: "always", rules: RULES0.map((r) => ({ ...r })),
    executor: "claude", resume: true, more: false, stat: { ...STAT0 }, card: "open",

/* ---------- avatars (engine) ---------- */
const live = [];
const seedOf = (id) => [...id].reduce((s, c) => s + c.charCodeAt(0), 0) % 7;

  w.className = "agw" + (mode === "run" ? " run" : "");

  cv.className = "av";

  always: [".xxxxxxx.", "xxxwwwxxx", "xxwxxxwxx", "xxxxxwwxx", "xxxxwxxxx", "xxxxxxxxx", "xxxxwxxxx", ".xxxxxxx.", "..xx.....", "..x......"],

/* ---------- render: sidebar, header, thread ---------- */

  if (S.card === "no") return `<div class="card"><div class="decided"><span class="ok">${I.x}</span><span class="t"><b>Recusado</b><small>O Claude Code vai seguir sem apagar nada</small></span></div></div>`;

function threadHTML() {

  return `<div class="day">Hoje</div>

      <div class="mx">Combinado. O Claude Code no ${COMPUTER} recorta as 10 fotos, aplica as legendas e gera o preview. Te chamo quando tiver algo para ver.</div></div></div>

function composerHTML() {

function render() {
  $("#sb").innerHTML = sidebarHTML();
  $("#pane").innerHTML = headerHTML() + `<div class="scroll" id="scroll">${threadHTML()}</div>` + composerHTML();

/* ---------- menu: actions only ---------- */
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; S.menu = false; $("[data-more]")?.setAttribute("aria-expanded", "false"); }
function menuHTML() {
  const item = (act, icon, label, sub, cls = "", side = "") => `<button class="mi ${cls}" type="button" role="menuitem" data-act="${act}">${icon}<span class="tx"><span>${label}</span>${sub ? `<small>${sub}</small>` : ""}</span>${side ? `<span class="sub">${side}</span>` : ""}</button>`;
  const rows = [];
  if (S.state === "run") rows.push(item("pause", I.pause, "Pausar", "Nada novo começa; o que está rodando termina."));
  if (S.state === "paused") rows.push(item("resume", I.play, "Retomar", "As tarefas da fila voltam a andar."));
  if (S.state !== "closed") rows.push(item("stop", I.stop, "Parar agora", "Interrompe as tarefas rodando e pausa a missão."));
  rows.push(item("share", I.share, "Compartilhar…", "Chamar alguém para ver ou decidir."));
  rows.push(S.state === "closed" ? item("reopen", I.refresh, "Reabrir missão", "Volta para pausada; você decide quando seguir.") : item("close", I.archive, "Fechar missão", "Termina a missão; nada mais roda.", "dz"));
  rows.push(`<div class="msep"></div>`);
  rows.push(item("cfg", I.sliders, "Configurações da missão…", "", "", esc(MODES[S.mode].short)));
  return rows.join("");
}
function openMenu(anchor, kb = true) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu glass"; m.setAttribute("role", "menu"); m.setAttribute("aria-label", "Ações da missão");
  m.innerHTML = menuHTML();
  document.body.append(m); menuEl = m; S.menu = true; anchor.setAttribute("aria-expanded", "true");
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let left = Math.min(Math.max(12, r.right - mw), innerWidth - mw - 12);
  let top = r.bottom + 6;
  if (top + mh > innerHeight - 12) top = Math.max(12, r.top - mh - 6);
  m.style.left = left + "px"; m.style.top = top + "px";
  if (kb) m.querySelector(".mi")?.focus({ preventScroll: true });
}

/* ---------- dialog ---------- */
const MODE_LINE = {
  always: "Pede sua aprovação antes de cada coisa.",
  risky: "Faz o simples sozinho e pergunta no resto.",
  never: "Faz tudo sozinho, exceto publicar.",
};
const MODE_EX = {
  always: "Ex.: até abrir a pasta das fotos espera você.",
  risky: "Ex.: recortar as fotos da pasta segue sozinho; apagar arquivos fora dela pergunta.",
  never: "Ex.: recorta, apaga e organiza sem parar; publicar ainda pede você.",
};
function autonomyHTML() {
  const row = (k) => `<button class="ropt ill-row" type="button" role="radio" aria-checked="${S.mode === k}" tabindex="${S.mode === k ? 0 : -1}" data-mode="${k}"><canvas class="ill" data-ill="${k}" aria-hidden="true"></canvas><span class="tx"><span class="ttl">${MODES[k].name}${k === "risky" ? `<span class="rec">Recomendado</span>` : ""}</span><span class="ln">${MODE_LINE[k]}</span></span></button>`;
  return `<section class="sec" aria-labelledby="secA">
    <div class="sec-h"><h3 id="secA">Autonomia</h3><p>Quando a missão para e pergunta a você.</p></div>
    <div class="rlist" role="radiogroup" aria-labelledby="secA">${row("always")}${row("risky")}${row("never")}</div>
    <p class="note ex" aria-live="polite">${I.spark}<span>${MODE_EX[S.mode]}</span></p>
    <p class="note">${I.lock}<span>Publicar e mexer na versão principal sempre pedem você.</span></p>
    <p class="note stat">${I.clock}<span>Nesta missão: ${S.stat.auto} liberados automaticamente · ${S.stat.asked} perguntados · ${S.stat.blocked} bloqueados</span></p>
  </section>`;
}
function rulesHTML() {
  const list = S.rules.length
    ? `<div class="list">${S.rules.map((r) => `<div class="li" data-rule="${r.id}"><span class="tx"><code>${esc(r.cmd)}</code><span class="ln">${esc(r.who)} · ${esc(r.when)}</span></span><button class="ib" type="button" data-rm="${r.id}" aria-label="Remover ${esc(r.cmd)}">${I.x}</button></div>`).join("")}</div>`
    : `<div class="empty"><b>Nada liberado ainda</b>Ao tocar em “Aprovar sempre” num pedido, ele aparece aqui.</div>`;
  return `<section class="sec" aria-labelledby="secR">
    <div class="sec-h"><h3 id="secR">O que já foi liberado</h3><p>Marcado com “Aprovar sempre”. Não pergunta mais nesta missão.</p></div>
    ${list}
  </section>`;
}
function executorHTML() {
  const locked = S.started;
  const opt = (k) => { const e = EXECUTORS[k]; return `<button class="ropt" type="button" role="radio" aria-checked="${S.executor === k}" ${locked ? `aria-disabled="true"` : ""} data-exec="${k}"><span class="rd" aria-hidden="true"></span><span class="tx"><span class="ttl">${e.icon()}${esc(e.name)}${e.exp ? `<span class="rec">Em teste</span>` : ""}</span><span class="ln">${esc(e.text)}</span></span></button>`; };
  return `<section class="sec" aria-labelledby="secE">
    <div class="sec-h"><h3 id="secE">Quem faz o trabalho</h3><p>Quem faz as tarefas e em qual computador.</p></div>
    <div class="${locked ? "lockd" : ""}"><div class="rlist" role="radiogroup" aria-labelledby="secE">${opt("claude")}${opt("codex")}${opt("agent")}</div>
      <div class="list" style="margin-top:8px"><div class="li pad"><span class="tx"><span class="ttl">${I.laptop}${COMPUTER}</span><span class="ln">MacBook do Walter</span></span><span class="chip okc">${I.check}Online</span>${locked ? "" : `<button class="b bg xs" type="button" data-toast="Escolher outro computador">Trocar</button>`}</div></div></div>
    <p class="note">${locked ? I.lock : I.clock}<span>${locked ? "Não dá para trocar depois que a missão começa." : "Dá para trocar até a missão começar."}</span></p>
  </section>`;
}
function recoveryHTML() {
  return `<section class="sec" aria-labelledby="secV">
    <div class="sec-h"><h3 id="secV">Se o computador desligar</h3></div>
    <div class="row"><span class="t"><label for="swResume"><b>Retomar sozinho quando ele voltar</b></label><small>Desligado, você decide no chat.</small></span>
      <button class="sw" id="swResume" type="button" role="switch" aria-checked="${S.resume}" data-resume></button></div>
  </section>`;
}
function defaultHTML() {
  const isDef = S.agentDefault === S.mode;
  return `<section class="sec" aria-labelledby="secD">
    <div class="sec-h"><h3 id="secD">Próximas missões do Theo</h3></div>
    <div class="row"><span class="t"><b>Começar com “${esc(MODES[S.mode].name)}”</b><small>${isDef ? "Já é o padrão do Theo." : `Hoje começam com “${esc(MODES[S.agentDefault].name)}”. As atuais não mudam.`}</small></span>
      ${isDef ? `<span class="chip">${I.check}Padrão</span>` : `<button class="b b2 sm" type="button" data-default>Usar como padrão</button>`}</div>
  </section>`;
}
function bodyHTML() {
  return autonomyHTML() + rulesHTML() + defaultHTML() + `<section class="sec more">
    <button class="moreb" type="button" aria-expanded="${S.more}" data-more-opts aria-controls="moreBody"><span class="t"><b>Mais opções</b><small>Quem faz o trabalho e o que fazer se o computador desligar</small></span>${I.chevd}</button>
    <div id="moreBody" ${S.more ? "" : "hidden"}>${executorHTML()}${recoveryHTML()}</div></section>`;
}
function dialogHTML() {
  return `<div class="scrim" data-scrim><div class="dlg" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <div class="dlg-h"><div class="t"><span class="eyebrow">Missão</span><h2 id="dlgT">Configurações</h2><p>${avHTML("theo", 18)}<span>${esc(TITLE)}</span></p></div><button class="ib" type="button" data-dlg-close aria-label="Fechar">${I.x}</button></div>
    <div class="dlg-b" id="dlgB">${bodyHTML()}</div>
    <div class="dlg-f"><span class="saved" id="saved">${I.check}<span>As mudanças valem na hora para esta missão</span></span><span class="grow"></span><button class="b b1 sm" type="button" data-dlg-close>Pronto</button></div>
  </div></div>`;
}
function renderDialog(keepScroll = true) {
  const root = $("#dlgRoot");
  if (!S.dialog) { root.innerHTML = ""; return; }
  const had = root.firstElementChild, y = had ? $("#dlgB")?.scrollTop : 0;
  if (!had) { root.innerHTML = dialogHTML(); hydrate(root); $(".dlg", root)?.focus({ preventScroll: true }); return; }
  // re-render the body only (no pop-in animation), keeping scroll
  $("#dlgB").innerHTML = bodyHTML();
  hydrate($("#dlgB"));
  if (keepScroll) $("#dlgB").scrollTop = y;
}
function openDialog() { closeMenu(); S.dialog = true; renderDialog(); }
function closeDialog() { S.dialog = false; renderDialog(); render(); }
function saved(title, sub = "", action) {
  toast({ title, sub, action });
  const el = $("#saved"); if (el) { el.innerHTML = `${I.check}<span>Salvo agora</span>`; el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}

/* ---------- toasts (glass) ---------- */
function toast({ icon = I.check, ok = true, title, sub = "", action, ms = 3800 }) {
  const el = document.createElement("div");
  el.className = "toast glass"; el.setAttribute("role", "status");
  el.innerHTML = `<span class="tic ${ok ? "ok" : ""}">${icon}</span><div class="tt"><b>${esc(title)}</b>${sub ? `<small>${sub}</small>` : ""}</div>${action ? `<button class="b b2 sm" type="button" data-ta>${action.label === "Desfazer" ? I.undo : ""}${esc(action.label)}</button>` : ""}`;
  if (action) el.querySelector("[data-ta]").onclick = () => { action.run(); dismiss(el); };
  $("#toasts").append(el);
  setTimeout(() => dismiss(el), ms);
}
function dismiss(el) { if (!el.isConnected) return; el.classList.add("out"); setTimeout(() => el.remove(), 200); }

/* ---------- actions ---------- */
function act(a) {
  closeMenu();
  if (a === "cfg") return openDialog();
  if (a === "pause") { S.state = "paused"; render(); return toast({ icon: I.pause, ok: false, title: "Missão pausada", sub: "Nada novo começa; o que estava rodando termina.", action: { label: "Desfazer", run: () => { S.state = "run"; render(); } } }); }
  if (a === "resume") { S.state = "run"; render(); return toast({ icon: I.play, title: "Missão retomada", sub: "A fila voltou a andar." }); }
  if (a === "stop") { const was = S.state; S.state = "paused"; render(); return toast({ icon: I.stop, ok: false, title: was === "run" ? "2 tarefas paradas" : "Nada rodando para parar", sub: "A missão ficou pausada. Retome quando quiser.", action: { label: "Retomar", run: () => act("resume") } }); }
  if (a === "share") return toast({ icon: I.share, ok: false, title: "Compartilhar", sub: "Abre o diálogo de compartilhar (já existe no app)." });
  if (a === "close") { const was = S.state; S.state = "closed"; render(); return toast({ icon: I.archive, ok: false, title: "Missão fechada", sub: "Nada mais roda. A conversa fica para ler.", action: { label: "Desfazer", run: () => { S.state = was; render(); } } }); }
  if (a === "reopen") { S.state = "paused"; render(); return toast({ icon: I.refresh, title: "Missão reaberta", sub: "Está pausada; retome quando quiser." }); }
}

document.addEventListener("click", (e) => {
  const tg = e.target;
  const more = tg.closest("[data-more]");
  if (more) { if (menuEl) closeMenu(); else openMenu(more, e.detail === 0); return; }
  if (menuEl && !tg.closest(".menu")) closeMenu();
  const a = tg.closest("[data-act]"); if (a) return act(a.dataset.act);
  if (tg.closest("[data-open-cfg]")) return openDialog();
  if (tg.closest("[data-scrim]") && !tg.closest(".dlg")) return closeDialog();
  if (tg.closest("[data-dlg-close]")) return closeDialog();
  const md = tg.closest("[data-mode]");
  if (md) {
    if (S.mode === md.dataset.mode) return;
    const prev = S.mode; S.mode = md.dataset.mode; renderDialog();
    return saved("Salvo", `Autonomia: ${esc(MODES[S.mode].name)}`, { label: "Desfazer", run: () => { S.mode = prev; renderDialog(); } });
  }
  const rm = tg.closest("[data-rm]");
  if (rm) {
    const i = S.rules.findIndex((r) => r.id === rm.dataset.rm); if (i < 0) return;
    const r = S.rules[i], row = rm.closest(".li");
    row.classList.add("out");
    setTimeout(() => { S.rules.splice(S.rules.indexOf(r), 1); renderDialog(); }, 180);
    return saved("Salvo", `“${esc(r.cmd)}” volta a ser conferido a cada vez`, { label: "Desfazer", run: () => { S.rules.splice(Math.min(i, S.rules.length), 0, r); renderDialog(); } });
  }
  const ex = tg.closest("[data-exec]");
  if (ex) {
    if (S.started) return toast({ icon: I.lock, ok: false, title: "Travado", sub: "Com a missão em andamento, quem faz o trabalho não muda." });
    if (S.executor === ex.dataset.exec) return;
    S.executor = ex.dataset.exec; renderDialog(); render();
    return saved("Salvo", `Quem faz o trabalho: ${esc(EXECUTORS[S.executor].name)}`);
  }
  if (tg.closest("[data-more-opts]")) { S.more = !S.more; renderDialog(); if (S.more) $("#moreBody")?.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" }); return; }
  if (tg.closest("[data-resume]")) { S.resume = !S.resume; renderDialog(); return saved("Salvo", S.resume ? "Retoma sozinho quando o computador voltar" : "Quando o computador voltar, você decide no chat"); }
  if (tg.closest("[data-default]")) { const prev = S.agentDefault; S.agentDefault = S.mode; renderDialog(); return saved("Padrão do Theo atualizado", `Próximas missões: ${esc(MODES[S.mode].name)}`, { label: "Desfazer", run: () => { S.agentDefault = prev; renderDialog(); } }); }
  const cd = tg.closest("[data-card]");
  if (cd) {
    S.card = cd.dataset.card;
    if (S.card === "always" && !S.rules.some((r) => r.id === "r4")) S.rules.unshift({ id: "r4", cmd: "rm -r ~/Desktop/paris-rascunhos/*", who: "Walter", when: "agora", used: 1 });
    render();
    if (S.card === "always") toast({ icon: I.repeat, title: "Aprovado sempre", sub: "Aparece em Configurações da missão › O que já foi liberado.", action: { label: "Ver", run: openDialog } });
    return;
  }
  const t = tg.closest("[data-toast]"); if (t) return toast({ icon: I.spark, ok: false, title: t.dataset.toast, sub: "Fora do escopo deste protótipo." });
  if (tg.closest("[data-reset]")) { reset({ started: S.started }); closeMenu(); render(); }
});
document.addEventListener("keydown", (e) => {
  // radio groups: arrows move and select (roving tabindex on the autonomy rows)
  const rg = e.target.closest?.("[role=radiogroup]");
  if (rg && ["ArrowDown", "ArrowUp", "ArrowRight", "ArrowLeft"].includes(e.key)) {
    const items = $$("[role=radio]:not([aria-disabled=true])", rg), i = items.indexOf(e.target.closest("[role=radio]"));
    if (i < 0) return;
    e.preventDefault();
    const nx = items[(i + (e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : items.length - 1)) % items.length];
    const key = nx.dataset.mode || nx.dataset.exec; nx.click();
    requestAnimationFrame(() => $(`[role=radio][data-${nx.dataset.mode ? "mode" : "exec"}="${key}"]`)?.focus());
    return;
  }
  if (e.key !== "Escape") return;
  if (menuEl) { const b = $("[data-more]"); closeMenu(); b?.focus(); return; }
  if (S.dialog) closeDialog();
});
addEventListener("resize", closeMenu);

/* ---------- segmented controls ---------- */
function seg(el, value, on) {
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); if (!b) return; pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
  document.fonts?.ready.then(place);
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });
seg($("#startSeg"), "run", (v) => { S.started = v === "run"; render(); });

reset();
render();
// deep links for review: #menu opens the ⋯ menu, #config opens the dialog
if (location.hash === "#config") openDialog();
if (location.hash === "#menu") requestAnimationFrame(() => openMenu($("[data-more]"), false));
</script>
