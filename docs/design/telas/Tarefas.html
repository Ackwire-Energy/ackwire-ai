<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: Tarefas (was "Issues"), on Issues.html (approved) + the RefinoUI refinements
  (light mode less gray: white work area, #f8f8f6 sidebar, white fields with a hairline; control ruler
  32/40/48 with radius 30% of the height; pills only for labels you don't press).
  One board per organization, seen as Quadro or Lista. Custom columns, each one inside a fixed stage
  (A fazer, Em andamento, Em revisão, Feito; Canceladas hidden by default). Status still moves on its own:
  an agent starts -> first column of Em andamento; work ready to check -> first column of Em revisão;
  approval -> first column of Feito. People drag cards between any columns, including inside a stage.
  Column editing lives behind each column's "..." and "Mais opções". Adding a column asks one question:
  the stage. Columns of the same stage sit under a quiet stage header when the board is customized.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#ffffff;--side:#f8f8f6;--col:#f7f7f5;--raised:#ffffff;--sunken:#f3f3f0;--glass:rgba(255,255,255,.8);
  --line:rgba(23,23,22,.07);--line2:rgba(23,23,22,.12);
  --field-bg:#ffffff;--field-line:rgba(23,23,22,.13);
  --chosen:#ffffff;--chosen-shadow:0 1px 2px rgba(23,23,22,.07),0 0 0 1px rgba(23,23,22,.09);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#6f6f6a;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);
  /* The ruler: 32 compact, 40 default, 48 large; radius 30% of the height. */
  --h-sm:32px;--h-md:40px;--h-lg:48px;--r-sm:10px;--r-md:12px;--r-lg:14px;
  --cw:248px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--side:#0a0a09;--col:#0b0b0a;--raised:#191918;--sunken:#0a0a09;--glass:rgba(30,30,28,.7);
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);
  --field-bg:#151514;--field-line:rgba(255,255,255,.1);
  --chosen:color-mix(in srgb,#fff 7%,#191918);--chosen-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.1);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8f8f89;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

/* ---------- controls (the ruler) ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:var(--h-md);padding:0 16px;border-radius:var(--r-md);border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.tog:focus-visible,.seg button:focus-visible,.lr:focus-visible,.mi:focus-visible,.stg:focus-visible,.dest:focus-visible,.addrow:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:var(--h-sm);padding:0 12px;font-size:13px;border-radius:var(--r-sm);gap:7px}
.b:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.ib{width:var(--h-sm);height:var(--h-sm);border-radius:var(--r-sm);border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.ib.framed{background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line)}
.seg{display:inline-flex;height:var(--h-sm);padding:3px;border-radius:var(--r-sm);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:100%;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:calc(100% - 6px);border-radius:7px;background:var(--chosen);box-shadow:var(--chosen-shadow);transition:transform .32s var(--spring),width .32s var(--spring)}
/* Filter toggle: a button of the ruler that can stay pressed (no pill). */
.tog{display:inline-flex;align-items:center;gap:7px;height:var(--h-sm);padding:0 12px;border-radius:var(--r-sm);border:0;background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none;transition:background .15s,color .15s,box-shadow .15s}
.tog:hover{color:var(--ink)}
.tog .n{font-weight:500;color:var(--faint);font-size:12px}
.tog[aria-pressed="true"]{background:var(--sunken);color:var(--ink);box-shadow:inset 0 1px 3px rgba(23,23,22,.12),inset 0 0 0 1px var(--line)}
.tog .chev{color:var(--faint)}
/* Labels you don't press: pills. */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Agents: the engine's body (canvas). */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px;border-bottom:1px dashed var(--line2);font-size:12.5px;color:var(--muted);background:var(--side)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:650;color:var(--faint);padding:2px 6px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line2)}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 53px)}
.app.with-panel{grid-template-columns:64px minmax(0,1fr) 408px}
.rail{background:var(--side);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--chosen);color:var(--ink);box-shadow:var(--chosen-shadow)}
.rail svg.i{width:19px;height:19px}
.main{min-width:0;padding:26px 28px 120px;max-width:1440px;width:100%;margin:0 auto}
.panel{display:none;padding:12px 12px 12px 0;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;overscroll-behavior:contain}

.hd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.hd h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.hd p{color:var(--muted);margin-top:6px;max-width:58ch}
.hd .acts{display:flex;gap:8px;align-items:center}

/* ---------- toolbar ---------- */
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:0 1 260px;min-width:0;display:flex;align-items:center;gap:8px;height:var(--h-sm);padding:0 8px 0 10px;border-radius:var(--r-sm);background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line);color:var(--faint);transition:box-shadow .15s}
.search:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:13.5px}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.tb .end{display:flex;gap:6px;align-items:center;margin-left:auto}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:80;min-width:230px;max-width:calc(100vw - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.mi:hover:not(:disabled),.mi.on{background:rgba(127,127,127,.12)}
.mi:disabled{opacity:.42;cursor:default}
.mi .sub{color:var(--faint);font-size:12.5px;margin-left:auto;padding-left:10px}
.mi.danger{color:var(--danger)}
.mi .box{width:18px;height:18px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1.5px var(--line2);display:inline-flex;align-items:center;justify-content:center;color:transparent}
.mi .box svg{width:12px;height:12px;stroke-width:2.6}
.mi[aria-checked="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.mi .tick{margin-left:auto;color:var(--ink);visibility:hidden}
.mi[aria-checked="true"] .tick{visibility:visible}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.mgroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px 4px}
.mnote{font-size:12px;color:var(--faint);padding:2px 10px 6px;max-width:250px;line-height:1.4}

/* ---------- dialog ---------- */
.dlg-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim);animation:fi .2s var(--out)}
.dlg{width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:24px;background:var(--raised);box-shadow:var(--e3),var(--top);animation:popin .28s var(--spring) both;display:flex;flex-direction:column}
.dlg.narrow{width:min(480px,100%)}
.dlg-h{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 6px}
.dlg-h .t{flex:1;min-width:0}
.dlg-h h2{font-size:20px;font-weight:650;letter-spacing:-.02em}
.dlg-h p{color:var(--muted);font-size:13.5px;margin-top:2px}
.dlg-b{padding:12px 20px 4px;display:flex;flex-direction:column;gap:16px}
.dlg-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 20px 20px}
.dlg-f .grow{flex:1 1 160px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lb{font-size:13px;font-weight:600;color:var(--ink2)}
.fld .hint{font-size:12px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.inp{display:flex;align-items:center;gap:9px;min-height:var(--h-md);padding:0 12px;border-radius:var(--r-md);background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line),inset 0 1px 2px rgba(0,0,0,.03);transition:box-shadow .15s}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp input,.inp textarea{all:unset;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.inp textarea{padding:10px 0;line-height:1.5;min-height:66px;white-space:pre-wrap}
.inp.ta{align-items:flex-start}
/* Stage choice: the one question when adding a column. */
.stgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stg{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:var(--r-lg);border:0;background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line);cursor:pointer;color:var(--ink);transition:box-shadow .15s,transform .18s var(--spring)}
.stg:hover{box-shadow:inset 0 0 0 1px var(--line2),var(--e1)}
.stg:active{transform:scale(.98)}
.stg[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.stg .st{margin-top:2px}
.stg>span{min-width:0}
.stg b{display:block;font-size:14px;line-height:20px;font-weight:600}
.stg small{display:block;font-size:12.5px;color:var(--muted);line-height:18px;margin-top:2px}
.explain{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-md);background:var(--sunken);font-size:13px;color:var(--ink2);line-height:1.45}
.explain svg.i{margin-top:2px;color:var(--muted)}
.dests{display:flex;flex-direction:column;gap:10px}
.dests .sg{display:flex;flex-direction:column;gap:6px}
.dests .sg>span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--faint)}
.dests .sg>span .st{width:14px;height:14px}
.dests .row{display:flex;flex-wrap:wrap;gap:6px}
.dest{height:var(--h-sm);padding:0 12px;border-radius:var(--r-sm);border:0;background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.dest[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.critprev{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:12px;background:var(--sunken);font-size:13px;color:var(--ink2)}
.critprev .h{font-size:12px;color:var(--faint);font-weight:600}
.critprev div{display:flex;align-items:center;gap:8px}
.critprev div::before{content:"";width:12px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line2);flex:none}
.whopick{display:flex;flex-wrap:wrap;gap:6px}
.whopick button{display:inline-flex;align-items:center;gap:8px;height:var(--h-md);padding:0 12px 0 8px;border-radius:var(--r-md);border:0;background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line);font:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.whopick button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.whopick button small{font-weight:500;color:var(--faint)}
.sugline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{height:var(--h-sm);padding:0 12px;border-radius:var(--r-sm);border:0;background:var(--field-bg);box-shadow:inset 0 0 0 1px var(--field-line);font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--sunken);color:var(--ink);box-shadow:inset 0 1px 3px rgba(23,23,22,.12),inset 0 0 0 1px var(--line)}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:16px;width:380px;max-width:calc(100vw - 24px);animation:popin .25s var(--spring) both}
.toast .tic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sunken);color:var(--ink2)}
.toast .tic .st{width:16px;height:16px;color:var(--ink2)}
.toast .tt{flex:1;min-width:0}
.toast .tt b{display:block;font-size:14px;font-weight:600}
.toast .tt small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.out{animation:toastout .2s var(--out) both}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}

/* ---------- empty ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 18px 28px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.empty .glow{position:relative;width:100%;height:220px;margin-bottom:-14px}
.empty .glow canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.empty .glow .who{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation:bob 1.8s var(--out) infinite alternate}
@keyframes bob{to{transform:translate(-50%,calc(-50% - 8px))}}
.empty>b{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.03em}
.empty>p{color:var(--muted);max-width:46ch}
.nores{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;text-align:center;color:var(--muted)}

/* ---------- people ---------- */
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .46);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}

/* The agent-at-work sweep: a thin dithered line along the bottom of whatever holds it. */
canvas.sweep{position:absolute;left:0;right:0;bottom:0;width:100%;height:3px;image-rendering:pixelated;pointer-events:none}
/* ---------- agents working now ---------- */
.now{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:22px}
.wk{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 14px 16px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);cursor:pointer;overflow:hidden;border:0;text-align:left;font:inherit;color:inherit;transition:transform .22s var(--spring),box-shadow .2s var(--out)}
.wk:hover{transform:translateY(-2px);box-shadow:var(--e2),var(--top)}
.wk .t{min-width:0;flex:1}

.wk .step{display:block;margin-top:4px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.now-h{display:flex;align-items:center;gap:8px;margin:0 4px 8px}

/* ---------- board ---------- */
/* The board scrolls sideways inside its own box; the page never does. */
.boardwrap{overflow-x:auto;overscroll-behavior-x:contain;margin:0 -6px;padding:2px 6px 10px;scrollbar-width:thin}
.board{display:flex;gap:12px;align-items:flex-start;min-width:min-content}
.board.grouped{gap:20px}
.stage{display:flex;flex-direction:column;gap:8px;flex:var(--n) 1 0;min-width:calc(var(--n) * var(--cw) + (var(--n) - 1) * 12px)}

.sh{display:flex;align-items:center;gap:7px;height:30px;padding:0 6px;border-bottom:1px solid var(--line2);color:var(--muted)}

.cols{display:flex;gap:12px;align-items:flex-start}

.ch .grow{flex:1}
.ch .rn{flex:1;min-width:0;height:var(--h-sm);padding:0 10px;border-radius:var(--r-sm);border:0;outline:none;background:var(--field-bg);box-shadow:inset 0 0 0 1.5px var(--ink);font-size:13px;font-weight:650;color:var(--ink)}
.st{width:16px;height:16px;flex:none;color:var(--muted);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cards{display:flex;flex-direction:column;gap:8px;min-height:24px}
.insline{height:3px;margin:-3px 4px;border-radius:2px;background:var(--ink);opacity:.55}
.card{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);cursor:grab;outline:none;overflow:hidden;transition:transform .22s var(--spring),box-shadow .2s var(--out),opacity .15s}

.card .top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.card .top .grow{flex:1}
.card .ti{font-weight:600;font-size:14px;letter-spacing:-.01em;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.card .foot{display:flex;align-items:center;gap:6px;min-width:0}

.card .foot .grow{flex:1}
.card[data-stage="done"] .ti,.card[data-stage="canceled"] .ti{color:var(--muted)}
.chip.due.late{background:var(--warn-soft);color:var(--warn)}

.ps h3 .cnt{text-transform:none;letter-spacing:0;font-weight:500}

.desc{font-size:14px;line-height:1.6;color:var(--ink2);white-space:pre-wrap}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cl li{display:flex;align-items:flex-start;gap:10px;padding:6px;border-radius:10px;font-size:13.5px}

.cl li.fresh{animation:tick .9s var(--spring)}
@keyframes tick{0%{background:color-mix(in srgb,var(--agent) 14%,transparent)}100%{background:transparent}}
.cl .tx{flex:1;min-width:0;padding-top:1px}
.cl .by{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--faint);white-space:nowrap;padding-top:2px}
.ck{width:20px;height:20px;border-radius:6px;border:0;padding:0;flex:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:transparent;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);transition:background .15s,transform .2s var(--spring)}

.work{border-radius:16px;background:var(--sunken);padding:12px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.work .wh{display:flex;align-items:center;gap:10px}
.work .wh b{font-size:13.5px;font-weight:600}
.work .wh small{display:block;font-size:12px;color:var(--muted)}
.work .wh .grow{flex:1}
.work.stall{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.work .last{font-size:12.5px;color:var(--muted)}
.work .last b{font-size:12.5px;color:var(--ink2);font-weight:600}
.work .acts2{display:flex;flex-wrap:wrap;gap:6px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:2px 0}
.steps li .dot{width:16px;height:16px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--raised);color:var(--ink2)}
.steps li .dot svg{width:10px;height:10px;stroke-width:2.6}
.steps li.cur{color:var(--ink);font-weight:600}
.steps li.cur .dot{background:var(--agent);color:#fff}
.ask{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1.5px var(--line2)}
.ask b{font-size:14px;font-weight:600}
.ask p{font-size:13px;color:var(--muted)}

.ask .b1 span.l{overflow:hidden;text-overflow:ellipsis}

.art{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--sunken);font-size:13.5px}
.art .ic{width:28px;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}

<script type="module">
import { drawAgent, idlePose, AGENT_GRADIENTS, mixHex, bodyTones } from "../../../packages/ui/src/agent/engine.js";

const live = [];

function makeAgent(id, size, opts = {}) {
  const a = AGENTS[id];

  const cv = document.createElement("canvas");
  cv.className = "av";
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = cv.height = Math.round(size * dpr);
  cv.style.width = cv.style.height = size + "px";
  cv.setAttribute("role", "img");
  cv.setAttribute("aria-label", `${a.name}, agente`);
  w.append(cv);
  live.push({ cv, a, size, seed: seedOf(id) + Math.random(), mode: opts.mode || "idle" });
  return w;
}
const avHTML = (actor, size = 20, mode = "idle") =>

function drawLive(t) {
  for (let i = live.length - 1; i >= 0; i--) {
    const it = live[i];
    if (!it.cv.isConnected) { live.splice(i, 1); continue; }
    const ctx = it.cv.getContext("2d"), s = it.cv.width;
    ctx.clearRect(0, 0, s, s);

    let pose;
    if (it.mode === "done") pose = { expression: "happy", turn: [0, 0] };
    else if (it.mode === "sleep") pose = { expression: "closed", squash: Math.sin(t * 1.2 + it.seed) * .3, turn: [0, .25] };

function send(it) {

/* ---------- agent work (status moves on its own) ---------- */
// Returns the column name when the task had to move.
function startWork(it, resumed = false) {
  const ag = AGENTS[it.who.id];
  it.work = { steps: [resumed ? "Relendo a tarefa e o que já foi feito" : "Lendo a tarefa e o que já existe", "Escrevendo o plano na tarefa", "Fazendo", "Conferindo o resultado", "Entregando para conferir"], cur: 0, started: 0 };
  it.stalled = null;
  it.act.push({ who: it.who, ev: resumed ? "voltou a trabalhar" : "começou a trabalhar", m: 0 });
  if (stageOf(it) !== "in_progress") return autoMove(it, "in_progress", (c) => `foi para ${c} quando ${ag.The.toLowerCase()} ${ag.name} começou`);
  return null;
}
function agentStarts(it, resumed = false) {
  let moved = null;
  flip([it.n], () => { moved = startWork(it, resumed); });
  const ag = AGENTS[it.who.id];
  toast({ icon: I.agent, title: `${ag.name} ${resumed ? "voltou" : "começou"}${moved ? ` · movida para ${moved}` : ""}`, sub: `#${it.n} · ${it.title}`, action: { label: "Ver", run: () => { S.open = it.n; render(); } } });
}
function stepAll() {
  const moved = [];
  flip(working().map((i) => i.n), () => {
    for (const it of working()) {
      if (it.work.wait) continue;
      const open = it.crit.findIndex((c) => !c.done);
      if (open >= 0 && Math.random() < .7) { it.crit[open].done = true; it.crit[open].by = it.who.id; S.ticked = `${it.n}:${open}`; }
      if (it.work.cur < it.work.steps.length - 1) it.work.cur++;
      else if (it.crit.every((c) => c.done)) {
        it.pr = it.pr || { n: 413 + Math.floor(Math.random() * 9), title: it.title, add: 40 + Math.floor(Math.random() * 120), del: Math.floor(Math.random() * 30), checks: "ok", merge: "ask" };
        it.work.steps.push("Esperando sua aprovação para o merge"); it.work.cur = it.work.steps.length - 1; it.work.wait = true;
        it.act.push({ who: it.who, ev: `ligou o PR #${it.pr.n}`, m: 0 });
        moved.push([it, autoMove(it, "in_review", (c) => `foi para ${c} quando o trabalho ficou pronto para conferir`)]);
      }
    }
  });
  for (const [it, c] of moved) toast({ icon: I.shield, ok: false, title: `${AGENTS[it.who.id].name} terminou · movida para ${c}`, sub: `O merge do PR #${it.pr.n} espera sua aprovação.`, action: { label: "Ver", run: () => { S.open = it.n; render(); } } });
  setTimeout(() => { S.ticked = null; }, 900);
}

    cn.onkeydown = (e) => { if (e.key === "Enter" && f.name.trim() && f.stage) { e.preventDefault(); create(); } };
  };

      <div class="dlg-h"><div class="t"><h2 id="dt">Excluir a coluna ${esc(c.name)}?</h2><p>${n ? `${nm} ${n === 1 ? "está" : "estão"} nela. Para onde ${n === 1 ? "ela vai" : "elas vão"}?` : "A coluna está vazia. Nenhuma tarefa muda de lugar."}</p></div><button class="ib" type="button" data-x aria-label="Fechar">${I.x}</button></div>
      ${n ? `<div class="dlg-b"><div class="dests" role="radiogroup" aria-label="Destino das tarefas">${STAGES.map((st) => { const cs = colsOf(st).filter((x) => x.id !== id); return cs.length ? `<div class="sg"><span>${stIcon(st)}${STN[st]}</span><div class="row">${cs.map((x) => `<button class="dest" type="button" role="radio" aria-checked="${dest === x.id}" data-dest="${x.id}">${esc(x.name)}</button>`).join("")}</div></div>` : ""; }).join("")}</div>
        ${dc.stage !== c.stage ? `<p class="explain">${I.auto}<span>${n === 1 ? "Essa tarefa passa" : "Essas tarefas passam"} de ${STN[c.stage]} para ${STN[dc.stage]}.</span></p>` : ""}</div>` : ""}
      <div class="dlg-f"><span class="grow"></span><button class="b bg sm" type="button" data-x>Cancelar</button><button class="b b1 sm" type="button" data-delcol>${I.trash}${n ? `Excluir e mover para ${esc(dc.name)}` : "Excluir coluna"}</button></div></div>`;
  };
  d.onclick = (e) => {
    if (e.target === d || e.target.closest("[data-x]")) return closeDlg();
    const b = e.target.closest("[data-dest]"); if (b) { dest = b.dataset.dest; draw(); $(`[data-dest="${dest}"]`, d).focus(); return; }
    if (e.target.closest("[data-delcol]")) {
      const arr = COLS(), at = arr.indexOf(c), dn = colById(dest).name;
      for (const it of items) { setCol(it, dest); if (stageOf(it) === "done") it.work = null; }
      arr.splice(at, 1);
      closeDlg(); render();
      toast({ icon: I.trash, ok: false, title: `Coluna ${c.name} excluída`, sub: n ? `${nm} ${n === 1 ? "foi" : "foram"} para ${dn}` : "", action: { label: "Desfazer", run: () => { arr.splice(at, 0, c); for (const it of items) setCol(it, id); render(); } } });
    }
  };
  draw();
}

// New task (in a given column, or the first of A fazer).
function openNew(colId = null) {
  const d = newDlg();
  const f = { title: "", desc: "", who: null, pri: "normal", due: null, col: colId && colById(colId)?.stage === "todo" ? colId : firstCol("todo").id };
  const crits = () => f.desc.split("\n").map((l) => l.match(/^\s*[-*]\s*(?:\[[ x]?\]\s*)?(.+)$/)?.[1]?.trim()).filter(Boolean);
  const sugFor = () => /checkout|frete|erro|bug|site|banco|página/i.test(f.title + f.desc) ? "lia" : /relat|dados|cancel|planilha|métric/i.test(f.title + f.desc) ? "nina" : /alerta|painel|monitor/i.test(f.title + f.desc) ? "atlas" : null;
  const whoButtons = () => { const sug = sugFor(); return Object.keys(AGENTS).map((id) => `<button type="button" aria-pressed="${f.who?.id === id}" data-fw="agent:${id}">${avHTML(A(id), 24)}${AGENTS[id].name}${id === sug ? "<small>sugerido</small>" : ""}</button>`).join("") + Object.keys(PEOPLE).slice(0, 2).map((id) => `<button type="button" aria-pressed="${f.who?.id === id}" data-fw="person:${id}">${avHTML(P(id), 24)}${PEOPLE[id].name}</button>`).join(""); };
  const draw = () => {
    const cs = crits(), multi = colsOf("todo").length > 1;
    d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="nt-h">
      <div class="dlg-h"><div class="t"><h2 id="nt-h">Nova tarefa</h2><p>Quem pegar, pessoa ou agente, aparece no quadro com o progresso.</p></div><button class="ib" type="button" data-x aria-label="Fechar">${I.x}</button></div>
      <div class="dlg-b">
        <div class="fld"><label for="nt">Título</label><div class="inp"><input id="nt" placeholder="Ex.: Confirmação do agendamento por WhatsApp" value="${esc(f.title)}" autocomplete="off"></div></div>
        <div class="fld"><label for="nd">O que precisa acontecer</label><div class="inp ta"><textarea id="nd" rows="4" placeholder="Descreva a tarefa.&#10;- Cada linha com “-” vira um critério de aceite">${esc(f.desc)}</textarea></div>
          ${cs.length ? `<div class="critprev"><span class="h">${cs.length} ${cs.length === 1 ? "critério de aceite" : "critérios de aceite"}</span>${cs.map((c) => `<div>${esc(c)}</div>`).join("")}</div>` : `<span class="hint">Linhas começando com “-” viram critérios de aceite.</span>`}</div>
        <div class="fld"><span class="lb">Responsável</span><div class="whopick">${whoButtons()}</div>
          ${f.who?.t === "agent" ? `<span class="sugline">${I.shield}${AGENTS[f.who.id].The} ${AGENTS[f.who.id].name} começa assim que a tarefa for criada. O que for sensível pede sua aprovação.</span>` : ""}</div>
        ${multi ? `<div class="fld"><span class="lb">Coluna</span><div class="opts">${colsOf("todo").map((c) => `<button type="button" aria-pressed="${f.col === c.id}" data-fc="${c.id}">${esc(c.name)}</button>`).join("")}</div></div>` : ""}
        <div class="grid2">
          <div class="fld"><span class="lb">Prioridade</span><div class="opts">${["high", "normal", "low"].map((p) => `<button type="button" aria-pressed="${f.pri === p}" data-fp="${p}">${PRI[p].label}</button>`).join("")}</div></div>
          <div class="fld"><span class="lb">Prazo</span><div class="opts">${[["Sem", null], ["Hoje", 0], ["Amanhã", 1], ["Sexta", 7]].map(([l, x]) => `<button type="button" aria-pressed="${f.due === x}" data-fd="${x}">${l}</button>`).join("")}</div></div>
        </div>
      </div>
      <div class="dlg-f"><span class="grow" style="font-size:12.5px;color:var(--faint)">Também dá para pedir no chat: “Lia, cria uma tarefa para isso”.</span><button class="b bg sm" type="button" data-x>Cancelar</button><button class="b b1 sm" type="button" data-create ${f.title.trim() ? "" : "disabled"}>${f.who?.t === "agent" ? `Criar e passar ${AGENTS[f.who.id].to} ${AGENTS[f.who.id].name}` : "Criar tarefa"}</button></div></div>`;
    hydrate(d);
    const nt = $("#nt", d), nd = $("#nd", d);
    // Update only the "sugerido" hint while typing, never the whole dialog (keeps focus and clicks).
    nt.oninput = () => { const was = sugFor(); f.title = nt.value; $("[data-create]", d).disabled = !f.title.trim(); if (sugFor() !== was) { const wp = $(".whopick", d); wp.innerHTML = whoButtons(); hydrate(wp); } };
    nd.oninput = () => { const before = crits().length; f.desc = nd.value; if (crits().length !== before) { const p = nd.selectionStart; draw(); const x = $("#nd", d); x.focus(); x.setSelectionRange(p, p); } };
  };
  d.onclick = (e) => {
    if (e.target === d || e.target.closest("[data-x]")) return closeDlg();
    const w = e.target.closest("[data-fw]"); if (w) { const [t, id] = w.dataset.fw.split(":"); f.who = f.who?.id === id ? null : { t, id }; return draw(); }
    const p = e.target.closest("[data-fp]"); if (p) { f.pri = p.dataset.fp; return draw(); }
    const c = e.target.closest("[data-fc]"); if (c) { f.col = c.dataset.fc; return draw(); }
    const x = e.target.closest("[data-fd]"); if (x) { f.due = x.dataset.fd === "null" ? null : +x.dataset.fd; return draw(); }
    if (e.target.closest("[data-create]")) {
      const lines = f.desc.split("\n");
      const it = { n: nextNum++, title: f.title.trim(), col: f.col, mem: { [S.board]: f.col }, pri: f.pri, who: f.who, due: f.due === null ? null : (() => { const y = new Date(NOW); y.setDate(y.getDate() + f.due); return y; })(), labels: [], ch: "produto", src: "criada por Walter",
        desc: lines.filter((l) => !/^\s*[-*]/.test(l)).join("\n").trim(), crit: crits().map((t) => C(t)), work: null, pr: null, arts: [], act: [{ who: P("walter"), ev: "criou a tarefa", m: 0 }], sug: sugFor() };
      const top = TASKS.findIndex((i) => i.col === f.col);
      TASKS.splice(top < 0 ? 0 : top, 0, it); S.fresh.add(it.n); S.empty = false; $('[data-proto="empty"]').setAttribute("aria-pressed", "false");
      closeDlg(); render();
      toast({ title: `Tarefa #${it.n} criada`, sub: `Em ${colById(it.col).name} · ${it.title}`, action: { label: "Abrir", run: () => { S.open = it.n; render(); } } });
      if (it.who?.t === "agent") setTimeout(() => agentStarts(it), 1600);
    }
  };
  draw(); $("#nt", d).focus();
}

/* ---------- prototype: switch the example board ---------- */
function switchBoard(v) {
  if (v === S.board) return;
  const stages = new Map(TASKS.map((i) => [i, stageOf(i)]));
  S.board = v; S.renaming = null; closeMenu();
  for (const it of TASKS) {
    const st = stages.get(it);
    if (st === "canceled") { it.col = "canceled"; continue; }
    const m = it.mem[v];
    it.col = m && colById(m)?.stage === st ? m : firstCol(st).id;
    it.mem[v] = it.col;
  }
  render();
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  if (dlg && dlg.contains(e.target)) return;
  const t = e.target;
  const it = T(S.open);
  if (menuEl && menuEl.contains(t)) {
    const cm = t.closest("[data-cm]:not(:disabled)");
    if (cm) {
      closeMenu();
      const [k, id] = cm.dataset.cm.split(":");
      if (k === "rename") { S.renaming = id; render(); return; }
      if (k === "add") return openAddCol(id);
      if (k === "del") return openDelCol(id);
      if (k === "left" || k === "right") {
        const arr = COLS(), c = colById(id), sib = colsOf(c.stage), j = sib.indexOf(c) + (k === "left" ? -1 : 1);
        const a = arr.indexOf(c), b = arr.indexOf(sib[j]); [arr[a], arr[b]] = [arr[b], arr[a]];
        render(); return;
      }
    }
    const mo = t.closest("[data-mo]");
    if (mo) { closeMenu(); if (mo.dataset.mo === "add") return openAddCol(); S.showCanceled = !S.showCanceled; render(); return; }
    const ch = t.closest("[data-chv]"); if (ch) { closeMenu(); S.ch = ch.dataset.chv; render(); return; }
    const s = t.closest("[data-set]"); if (s && it) { closeMenu(); applySet(it, s.dataset.set); return; }
    const m = t.closest("[data-m]:not(:disabled)"); if (m && it) { closeMenu();
      if (m.dataset.m === "cancel") return moveCard(it.n, "canceled");
      toast({ icon: m.dataset.m === "link" ? I.link : I.open, title: { page: "Abre a página da tarefa #" + it.n, link: "Link copiado", chat: "Abre a mensagem no canal" }[m.dataset.m] }); }
    return;
  }
  const anchor = t.closest("[data-pick],[data-pmore],[data-colmenu],[data-more],[data-chan]");
  if (menuEl) { const was = menuEl._anchor; closeMenu(); if (anchor && was === anchor) return; }
  const p = t.closest("[data-proto]");
  if (p) {
    if (p.dataset.proto === "empty") { S.empty = !S.empty; S.open = null; p.setAttribute("aria-pressed", S.empty); render(); }
    if (p.dataset.proto === "step") { S.empty = false; stepAll(); }
    if (p.dataset.proto === "start") {
      S.empty = false;
      const w = TASKS.find((i) => i.who?.t === "agent" && !i.work && stageOf(i) === "todo");
      if (!w) return toast({ icon: I.waiting, ok: false, title: "Nenhum agente com tarefa esperando em A fazer" });
      S.view = "board"; render(); agentStarts(w);
    }
    if (p.dataset.proto === "crash") {
      const w = working().find((i) => !i.work.wait); if (!w) return toast({ icon: I.waiting, ok: false, title: "Nenhum agente rodando agora" });
      w.stalled = { m: 0, last: w.work.steps[w.work.cur], reason: "O orçamento do mês do agente acabou" }; w.work = null;
      w.act.push({ who: w.who, ev: "parou: o orçamento do mês acabou", m: 0 });
      S.empty = false; render(); toast({ icon: I.waiting, ok: false, title: `${AGENTS[w.who.id].name} parou em #${w.n}`, sub: "A tarefa fica na mesma coluna, marcada como parada." });
    }
    return;
  }
  const nw = t.closest("[data-new]"); if (nw) return openNew(nw.dataset.new || null);
  const wh = t.closest("[data-who]"); if (wh) { S.who = wh.dataset.who; render(); return; }
  const openAt = (el, build, align) => { openMenu(el, build, align); menuEl._anchor = el; };
  if (anchor?.matches("[data-colmenu]")) return openAt(anchor, () => colMenu(anchor.dataset.colmenu), "end");
  if (anchor?.matches("[data-more]")) return openAt(anchor, moreMenu, "end");
  if (anchor?.matches("[data-chan]")) return openAt(anchor, chanMenu);
  if (anchor?.matches("[data-pick]") && it && pickMenus[anchor.dataset.pick]) return openAt(anchor, () => pickMenus[anchor.dataset.pick](it));
  if (anchor?.matches("[data-pmore]") && it) return openAt(anchor, () => pickMenus.more(it), "end");
  const ck = t.closest("[data-crit]"); if (ck && it) { const c = it.crit[+ck.dataset.crit]; c.done = !c.done; c.by = null; render(); return; }
  const ask = t.closest("[data-ask]"); if (ask && it) return applySet(it, `who:agent:${ask.dataset.ask}`);
  if (t.closest("[data-stop]") && it) { it.act.push({ who: P("walter"), ev: `parou ${AGENTS[it.who.id].The.toLowerCase()} ${AGENTS[it.who.id].name}`, m: 0 }); it.stalled = { m: 0, last: it.work.steps[it.work.cur], reason: "Você parou" }; it.work = null; render(); return toast({ icon: I.stop, ok: false, title: "Trabalho parado", sub: "A tarefa fica na mesma coluna; dá para pedir para continuar." }); }
  if (t.closest("[data-resume]") && it) return agentStarts(it, true);
  if (t.closest("[data-approve]") && it) {
    let c;
    flip([it.n], () => { it.pr.merge = "merged"; it.work = null; it.act.push({ who: P("walter"), ev: `aprovou o merge do PR #${it.pr.n}`, m: 0 }); c = autoMove(it, "done", (x) => `foi para ${x} quando o merge foi aprovado`); });
    return toast({ icon: I.check, title: `Aprovado · movida para ${c}`, sub: `#${it.n} · ${it.title}` });
  }
  if (t.closest("[data-deny]") && it) {
    let c;
    flip([it.n], () => { it.work.wait = false; it.work.steps.push("Ajustando depois da sua resposta"); it.work.cur = it.work.steps.length - 1; it.act.push({ who: P("walter"), ev: "recusou o merge", m: 0 }); c = autoMove(it, "in_progress", (x) => `voltou para ${x} para ajustar`); });
    return toast({ icon: I.undo, ok: false, title: `Voltou para ${c}`, sub: `${AGENTS[it.who.id].name} vai ajustar e entregar de novo.` });
  }
  if (t.closest("[data-send]") && it) return send(it);
  const mt = t.closest("[data-mention]"); if (mt) { const cm = $("#cm"); cm.value = (cm.value ? cm.value + " " : "") + "@" + AGENTS[mt.dataset.mention].name + " "; cm.focus(); cm.oninput(); return; }
  if (t.closest("[data-close]") || t.id === "scrim") { S.open = null; render(); return; }
  const op = t.closest("[data-open]"); if (op && !t.closest(".flying")) { const n = +op.dataset.open; S.open = S.open === n ? null : n; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (menuEl) return closeMenu(); if (dlg) return closeDlg(); if (S.open) { S.open = null; render(); } return; }
  const typing = e.target.closest?.("input,textarea,[contenteditable]");
  if (typing || dlg || e.metaKey || e.ctrlKey) return;
  if (e.key === "n" || e.key === "N") { e.preventDefault(); openNew(); }
  if (e.key === "/") { e.preventDefault(); $("#q")?.focus(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".card,.lr")) { e.preventDefault(); e.target.click(); }
});

/* ---------- theme / segmented ---------- */
function seg(el, value, on) {
  if (!el) return;
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); if (!b) return; pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
  document.fonts?.ready.then(place);
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });
seg($("#bd"), S.board, switchBoard);

$("#logo").append(makeAgent("theo", 30));
render();
</script>
