<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: the Drive, redesigned on the approved design system (Proposta 2, Componentes.dc.html).
  Grid of real previews (default) or a refined list; who made it (agents from the engine vs people);
  quick filters; grouping; details panel with versions and where it was shared; multi-select with a
  floating bar; whole-page drop + upload toast; empty state with a light sky; trash with restore.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
.sr{position:absolute;left:-9999px}

/* ---------- design system bits ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.chip:focus-visible,.seg button:focus-visible,.card:focus-visible,.lr:focus-visible,.ck:focus-visible,.mi:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.danger{color:var(--danger)}
.b.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger)}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.ib.b2{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.ib.b2:hover{box-shadow:var(--e2),var(--top)}
.split{display:inline-flex;border-radius:12px;box-shadow:var(--e1),var(--top);background:var(--raised)}
.split .b{box-shadow:none;background:transparent;border-radius:0}
.split .b:first-child{border-radius:12px 0 0 12px}
.split .b:last-child{border-radius:0 12px 12px 0;padding:0 10px;border-left:1px solid var(--line)}
.split .b:hover{background:rgba(127,127,127,.08)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.seg.icons button{width:34px;padding:0;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* People: a circle with the initial. Agents: the engine's body (canvas). */
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .46);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 49px)}
.app.with-panel{grid-template-columns:64px minmax(0,1fr) 392px}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}
.main{min-width:0;padding:26px 28px 140px}

.hd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.hd h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.05;display:flex;align-items:center;gap:12px}
.hd p{color:var(--muted);margin-top:6px;max-width:60ch}
.hd .acts{display:flex;gap:8px;align-items:center}
.hd .cnt{font-size:12px;color:var(--faint);font-weight:600}

.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 280px;min-width:0;display:flex;align-items:center;gap:9px;height:40px;padding:0 10px 0 12px;border-radius:12px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);transition:box-shadow .2s var(--out)}
.search:focus-within{box-shadow:var(--e2),0 0 0 1.5px var(--ink)}
.search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:14.5px}
.search input::placeholder{color:var(--faint)}
.tb .r{display:flex;gap:8px;align-items:center;margin-left:auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px 14px}
.chips::-webkit-scrollbar{display:none}
.fc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none;transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.fc:hover{box-shadow:var(--e2),var(--top)}
.fc:active{transform:scale(.96)}
.fc .n{font-weight:500;color:var(--faint);font-size:12px}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.fc[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.fc:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.summary{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:-4px 0 14px}

/* ---------- groups + grid ---------- */
.group{margin-bottom:26px;animation:fi .3s var(--out) both}
.gh{display:flex;align-items:center;gap:10px;margin:0 2px 10px;min-height:24px}
.gh h2{font-size:13px;font-weight:650;letter-spacing:-.005em;color:var(--ink2)}
.gh .n{font-size:12.5px;color:var(--faint)}
.gh .stack{display:flex;align-items:center;margin-left:2px}
.gh .stack>*{margin-left:-5px;box-shadow:0 0 0 2px var(--bg);border-radius:50%}
.gh .stack>.agw{border-radius:32% 32% 32% 12%}
.gh .stack>*:first-child{margin-left:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.card{position:relative;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:7px;cursor:pointer;transition:transform .22s var(--spring),box-shadow .2s var(--out);outline:none;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:var(--e2),var(--top)}
.card.on,.card.sel{box-shadow:0 0 0 2px var(--ink),var(--e2)}
.card.new{animation:landed .9s var(--spring) both}
@keyframes landed{0%{opacity:0;transform:translateY(10px) scale(.96)}100%{opacity:1;transform:none}}
.cb{padding:10px 6px 4px;min-width:0}
.ct{font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12.5px;color:var(--muted);min-width:0}
.cm .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cm .sep{color:var(--faint)}
.cm .r{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--faint);white-space:nowrap;flex:none}
.kb{position:absolute;top:15px;right:15px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--glass);backdrop-filter:blur(10px) saturate(1.5);-webkit-backdrop-filter:blur(10px) saturate(1.5);box-shadow:0 0 0 1px var(--line),0 2px 6px -2px rgba(0,0,0,.15);pointer-events:none}
.kb svg.i{width:13px;height:13px}
.ck{position:absolute;top:15px;left:15px;width:24px;height:24px;border-radius:8px;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:transparent;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1.5px var(--line2),0 2px 6px -2px rgba(0,0,0,.2);opacity:0;transform:scale(.85);transition:opacity .15s,transform .2s var(--spring),background .15s,color .15s;z-index:2}
.ck svg{width:14px;height:14px;stroke-width:2.4}
.card:hover .ck,.card:focus-within .ck,.selecting .ck,.ck[aria-pressed="true"]{opacity:1;transform:none}
.ck[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.ck:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
@media (hover:none){.ck{opacity:1;transform:none}}

/* ---------- previews (scale with the box: container units) ---------- */
.pv{position:relative;aspect-ratio:4/3;border-radius:12px;background:var(--sunken);overflow:hidden;container-type:inline-size;isolation:isolate}
.pv>svg.full,.pv>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sheetbox{position:absolute;left:8%;right:8%;top:10%;bottom:-6%;background:var(--paper);border-radius:2.6cqw 2.6cqw 0 0;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line),0 10px 24px -14px rgba(0,0,0,.25);overflow:hidden}
.paper{left:16%;right:16%;padding:7cqw 6.5cqw;display:flex;flex-direction:column;gap:2.3cqw}
.ln{display:block;height:1.45cqw;border-radius:1cqw;background:var(--line2);flex:none}
.ln.h{height:3cqw;width:64%;background:color-mix(in srgb,var(--ink) 72%,transparent);margin-bottom:.8cqw}
.ln.s{width:38%;background:color-mix(in srgb,var(--faint) 45%,transparent)}
.ln.caret{position:relative;overflow:visible;animation:typing 2.4s steps(14) infinite}
.ln.caret::after{content:"";position:absolute;right:-1.4cqw;top:-1cqw;width:.7cqw;height:3.4cqw;border-radius:.4cqw;background:var(--agent);animation:blinkc 1s steps(2) infinite}
@keyframes typing{0%{width:8%}100%{width:70%}}
@keyframes blinkc{50%{opacity:0}}
.bars{display:flex;align-items:flex-end;gap:1.8cqw;height:14cqw;padding:2cqw 2.4cqw;background:var(--sunken);border-radius:1.8cqw;margin:.8cqw 0;flex:none}
.bars i{flex:1;background:color-mix(in srgb,var(--ink) 52%,transparent);border-radius:.7cqw .7cqw 0 0}
.bars i:last-child{background:var(--ink)}
.todo{display:flex;align-items:center;gap:2cqw}
.todo b{width:2.6cqw;height:2.6cqw;border-radius:.8cqw;box-shadow:inset 0 0 0 .35cqw var(--line2);flex:none}
.todo b.x{background:color-mix(in srgb,var(--ink) 70%,transparent);box-shadow:none}
.todo .ln{flex:1}
.sheetbox.tbl table{width:100%;border-collapse:collapse;font-size:3.5cqw;line-height:1.2}
.tbl th{background:var(--sunken);color:var(--muted);font-weight:600;text-align:left;padding:2.2cqw 3cqw;white-space:nowrap}
.tbl td{padding:2.3cqw 3cqw;border-top:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl .bar{display:inline-block;height:1.6cqw;border-radius:1cqw;background:color-mix(in srgb,var(--ink) 40%,transparent);vertical-align:middle}
.sheetbox.code{font-family:var(--mono);font-size:3cqw;line-height:1.85}
.code .fh{display:flex;justify-content:space-between;gap:2cqw;padding:1.6cqw 3cqw;background:var(--sunken);color:var(--muted);white-space:nowrap}
.code .fh span{overflow:hidden;text-overflow:ellipsis}
.code .fh em{font-style:normal;font-family:var(--sans);font-weight:600;flex:none}
.code .fh em .a{color:var(--ok)} .code .fh em .d{color:var(--danger)}
.code .l{padding:0 3cqw;white-space:pre;overflow:hidden;color:var(--ink2)}
.code .l.a{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.code .l.d{background:color-mix(in srgb,var(--danger) 11%,transparent)}
.code .l.c{color:var(--faint)}
.dg{position:absolute;inset:0;width:100%;height:100%}
.dg .n{fill:var(--paper);stroke:var(--line2);stroke-width:1.1}
.dg .n.root{stroke:color-mix(in srgb,var(--ink) 55%,transparent);stroke-width:1.4}
.dg .e{fill:none;stroke:var(--faint);stroke-width:1.1;opacity:.8}
.dg .t{fill:var(--line2)}
.dg .t.k{fill:color-mix(in srgb,var(--ink) 60%,transparent)}
.dg .ok{fill:var(--ok-soft);stroke:color-mix(in srgb,var(--ok) 45%,transparent)}
.browser{left:7%;right:7%}
.browser .bt{height:7.5cqw;background:var(--sunken);display:flex;align-items:center;gap:1.2cqw;padding:0 2.6cqw}
.browser .bt i{width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--line2)}
.browser .bt .url{margin-left:2cqw;flex:1;height:4cqw;border-radius:2cqw;background:var(--paper);font-size:2.4cqw;color:var(--faint);display:flex;align-items:center;padding:0 2.2cqw;white-space:nowrap;overflow:hidden}
.browser .hero{padding:6cqw 6cqw 3cqw;display:flex;flex-direction:column;align-items:center;gap:2.4cqw;text-align:center}
.browser .hero b{font-family:var(--display);font-weight:300;font-size:6.4cqw;letter-spacing:-.03em;line-height:1.05;color:var(--ink)}
.browser .hero .in{display:flex;gap:1.4cqw;margin-top:1cqw}
.browser .hero .in span{width:26cqw;height:5cqw;border-radius:1.6cqw;box-shadow:inset 0 0 0 .3cqw var(--line2)}
.browser .hero .in em{width:14cqw;height:5cqw;border-radius:1.6cqw;background:var(--ink)}
.browser .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;padding:2cqw 6cqw}
.browser .feat span{height:11cqw;border-radius:1.8cqw;background:var(--sunken)}
.pdfback{left:20%;right:12%;top:6%;opacity:.7}
.pdf{left:14%;right:18%;padding:7cqw 6cqw;display:flex;flex-direction:column;gap:2.1cqw}
.pdf .ln.h{align-self:center;width:52%}
.pdf .ln.s{align-self:center;width:30%;margin-bottom:2cqw}
.pdf .sig{margin-top:3cqw;display:flex;gap:5cqw}
.pdf .sig div{flex:1;border-top:.3cqw solid var(--line2);position:relative;height:6cqw}
.pdf .sig svg{position:absolute;left:5%;bottom:1.2cqw;width:80%;height:6cqw;fill:none;stroke:var(--ink2);stroke-width:1.4}
.tag{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--line);color:var(--ink2)}
.vid .play{position:absolute;left:50%;top:50%;width:15cqw;height:15cqw;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
.vid .play svg{width:42%;height:42%;fill:#fff;margin-left:6%}

.gen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gen .doc{position:relative;width:30cqw;height:38cqw;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.gen .doc svg{position:absolute;inset:0;width:100%;height:100%}
.gen .doc svg path.f{fill:var(--paper);stroke:var(--line2);stroke-width:1}
.gen .doc svg path.c{fill:var(--sunken);stroke:var(--line2);stroke-width:1}
.gen .doc b{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-weight:700;font-size:6cqw;letter-spacing:.04em;color:var(--ink2)}
.gen .doc .rows{position:absolute;left:18%;right:18%;top:30%;display:flex;flex-direction:column;gap:2.4cqw}

canvas.strip{position:absolute;left:0;right:0;bottom:0;width:100%;height:10px;image-rendering:pixelated;z-index:2}

.pv.sm .tag,.pv.sm .dur,.pv.sm .kb{display:none}

/* ---------- list ---------- */
.lt{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.lr{display:grid;grid-template-columns:40px minmax(0,2.4fr) minmax(0,1.2fr) minmax(0,1fr) 108px 40px;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s;outline:none;position:relative}

.lr.on,.lr.sel{background:color-mix(in srgb,var(--sunken) 85%,transparent)}
.lr.on::before,.lr.sel::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.lr.head{cursor:default;border-top:0;padding-top:10px;padding-bottom:10px;font-size:12px;font-weight:600;color:var(--faint);background:transparent}
.lr.head:hover{background:transparent}
.lr.gr{cursor:default;grid-template-columns:1fr;padding:14px 16px 6px;background:transparent}
.lr.gr:hover{background:transparent}
.lr.gr .gh{margin:0}
.lr .ck{position:static;opacity:1;transform:none;justify-self:center;background:transparent;backdrop-filter:none;box-shadow:inset 0 0 0 1.5px var(--line2)}
.lr .ck[aria-pressed="true"]{background:var(--ink);box-shadow:none}

.lr .nmc .t{min-width:0}
.lr .nmc .t b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.lr .nmc small{display:flex;align-items:center;gap:5px;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden}
.lr .who{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;color:var(--ink2)}
.lr .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .where,.lr .when{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .when{font-variant-numeric:tabular-nums}
.lr .mob{display:none}

/* ---------- details panel ---------- */
.panel{position:sticky;top:0;height:calc(100vh);overflow-y:auto;padding:14px 14px 14px 0;display:none}
.with-panel .panel{display:block}
.pin{border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:14px;display:flex;flex-direction:column;gap:14px;animation:slidein .32s var(--spring) both;min-height:100%}

.ph{display:flex;align-items:center;gap:8px}

.pin h2{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.25;margin-top:2px;word-break:break-word}

.author{display:flex;gap:12px;align-items:center}
.author b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.author small{display:block;color:var(--muted);font-size:12.5px}
.vt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vt li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;position:relative;padding:6px 6px 10px 2px;border-radius:12px}

.where-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--sunken);font-size:13.5px}

.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:none;animation:fi .2s var(--out)}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:60;min-width:220px;max-width:calc(100vw - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both;transform-origin:top left}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}

/* ---------- selection bar ---------- */
.selbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 14px;border-radius:16px;animation:barin .3s var(--spring) both;max-width:calc(100vw - 24px)}
@keyframes barin{from{opacity:0;transform:translate(-50%,16px) scale(.97)}to{opacity:1;transform:translateX(-50%)}}

.selbar .cnt b{color:var(--ink);font-weight:650}
.selbar .vsep{width:1px;height:22px;background:var(--line2);margin:0 4px}

/* ---------- drop overlay ---------- */
.drop{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);animation:fi .18s var(--out) both}
.drop[hidden]{display:none}
.drop-in{width:100%;height:100%;border-radius:28px;border:2px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.drop-ic{width:76px;height:76px;border-radius:24px;background:var(--raised);box-shadow:var(--e3),var(--top);display:flex;align-items:center;justify-content:center;color:var(--ink);animation:bob 1.6s var(--out) infinite alternate;margin-bottom:8px}
.drop-ic svg{width:32px;height:32px}
@keyframes bob{to{transform:translateY(-8px)}}
.drop-in b{font-family:var(--display);font-weight:300;font-size:clamp(26px,4vw,36px);letter-spacing:-.03em}
.drop-in span{color:var(--muted);max-width:44ch}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:16px;width:360px;max-width:calc(100vw - 24px);animation:popin .25s var(--spring) both}
.toast .ti{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sunken);color:var(--ink2)}
.toast .ti.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.toast .tt{flex:1;min-width:0}
.toast .tt b{display:block;font-size:14px;font-weight:600}
.toast .tt small{display:block;color:var(--muted);font-size:12.5px}
.toast.out{animation:toastout .2s var(--out) both}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}
.up{flex-direction:column;align-items:stretch;gap:8px;padding:12px}
.up .uh{display:flex;align-items:center;gap:10px}
.up .uh b{flex:1;font-size:14px;font-weight:600}
.urow{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.urow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow .pc{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.urow .trk{grid-column:2 / 4;height:4px;border-radius:4px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.urow .trk i{display:block;height:100%;border-radius:4px;background:var(--ink);transition:width .25s var(--out)}
.urow.done .trk i{background:var(--ok)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ink);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- empty + trash ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 18px 40px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.empty .glow{position:relative;width:100%;height:220px;margin-bottom:-14px}
.empty .glow canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.empty .glow .who{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation:bob 1.8s var(--out) infinite alternate;cursor:pointer}
.empty b{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.03em}
.empty p{color:var(--muted);max-width:44ch}
.empty .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.nores{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 16px;text-align:center;color:var(--muted)}
.nores .ic{width:52px;height:52px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);display:flex;align-items:center;justify-content:center;color:var(--faint)}
.note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--muted);font-size:13.5px;margin-bottom:14px}
.note b{color:var(--ink)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .nmc{display:flex;align-items:center;gap:12px;min-width:0}
.trow .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .t small{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden}
.trow.gone{animation:toastout .25s var(--out) both}

/* ---------- responsive ---------- */
@media (max-width:1180px){.app.with-panel{grid-template-columns:64px minmax(0,1fr) 352px}}
@media (max-width:980px){
  .app.with-panel{grid-template-columns:64px minmax(0,1fr)}
  .panel{position:fixed;top:12px;right:12px;bottom:12px;width:min(400px,calc(100vw - 24px));height:auto;padding:0;z-index:35}
  .pin{min-height:0;box-shadow:var(--e3)}
  .with-panel ~ .scrim{display:block}
  .lr{grid-template-columns:40px minmax(0,2.4fr) minmax(0,1.2fr) 96px 40px}
  .lr .where{display:none}
}
@media (max-width:720px){
  .app,.app.with-panel{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding:18px 16px 140px}
  .hd{align-items:flex-start}
  .hd .acts{width:100%}
  .hd .acts .b1{margin-left:auto}
  .hd .acts .kbd{display:none}
  .tb .r{margin-left:0;width:100%;justify-content:space-between}
  .search .kbd{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{border-radius:16px;padding:5px}
  .kb{top:11px;right:11px;padding:0 6px;font-size:0;gap:0}
  .kb svg.i{width:13px;height:13px}
  .ck{top:11px;left:11px}
  .cm .sep,.cm .ch{display:none}
  .lr{grid-template-columns:34px minmax(0,1fr) 34px;gap:10px;padding:8px 8px}
  .lr .who,.lr .where,.lr .when,.lr.head{display:none}
  .lr .mob{display:inline}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88vh}
  .pin{border-radius:22px 22px 0 0;animation:sheetin .34s var(--spring) both}

  .selbar{left:12px;right:12px;transform:none;bottom:12px;animation:fi .25s var(--out) both}

  .proto .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

const I = {

  $("#selbar").innerHTML = n && !S.trash ? `<div class="selbar glass" role="toolbar" aria-label="Seleção">
    <span class="cnt"><b>${n}</b> ${n === 1 ? "selecionado" : "selecionados"}</span>
    <button class="b bg sm" type="button" data-act="seldl">${I.download}<span class="lbl">Baixar</span></button>
    <button class="b bg sm" type="button" data-act="sellink">${I.link}<span class="lbl">Copiar links</span></button>
    <button class="b bg sm danger" type="button" data-act="seldel">${I.trash}<span class="lbl">Mover para lixeira</span></button>
    <span class="vsep"></span><button class="ib" type="button" data-act="selclear" aria-label="Limpar seleção">${I.x}</button><span class="kbd" style="margin-right:6px">esc</span></div>` : "";
}
function render() { renderHead(); if (!S.trash && !S.empty) renderTools(); renderContent(); renderPanel(); renderSelbar(); }

/* ---------- menus ---------- */
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(anchor, build) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu glass"; m.setAttribute("role", "menu");
  m.innerHTML = build();
  document.body.append(m); menuEl = m; m._anchor = anchor; m._build = build;
  hydrate(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let left = Math.min(Math.max(12, r.left), innerWidth - mw - 12), top = r.bottom + 6;
  if (top + mh > innerHeight - 12) top = Math.max(12, r.top - mh - 6);
  m.style.left = left + "px"; m.style.top = top + "px";
  m.querySelector(".mi")?.focus({ preventScroll: true });
}
function refreshMenu() { if (!menuEl) return; const sc = menuEl.scrollTop; menuEl.innerHTML = menuEl._build(); hydrate(menuEl); menuEl.scrollTop = sc; }
const box = `<span class="box">${I.check}</span>`;
const channelMenu = () => `<div class="mgroup">Canais</div>${[...CHANNELS, "none"].map((c) => { const n = ITEMS.filter((it) => (it.ch ?? "none") === c).length; return `<button class="mi" type="button" role="menuitemcheckbox" aria-checked="${S.channels.has(c)}" data-ch="${c}">${box}<span>${c === "none" ? "Sem canal" : "#" + c}</span><span class="sub">${n}</span></button>`; }).join("")}${S.channels.size ? `<div class="msep"></div><button class="mi" type="button" data-ch="__clear">${I.x}Limpar</button>` : ""}`;
const arrangeMenu = () => `<div class="mgroup">Agrupar por</div>${[["date", "Data", I.clock], ["channel", "Canal", I.hash], ["who", "Quem fez", I.people], ["none", "Sem grupos", I.layers]].map(([v, l, ic]) => `<button class="mi" type="button" role="menuitemradio" aria-checked="${S.group === v}" data-group="${v}">${ic}<span>${l}</span><span class="tick">${I.check}</span></button>`).join("")}<div class="msep"></div><div class="mgroup">Ordenar por</div>${[["recent", "Mais recentes"], ["name", "Nome"], ["kind", "Tipo"]].map(([v, l]) => `<button class="mi" type="button" role="menuitemradio" aria-checked="${S.sort === v}" data-sort="${v}"><span style="width:16px"></span><span>${l}</span><span class="tick">${I.check}</span></button>`).join("")}`;
const formatsMenu = (it) => () => {
  const f = it.kind === "document" ? [["PDF", ""], ["Word (.docx)", ""], ["Markdown", ""]] : it.kind === "table" ? [["Planilha (.csv)", ""], ["PDF", ""]] : it.kind === "diff" ? [["Patch (.diff)", ""]] : it.kind === "html" ? [["HTML", ""], ["PDF", ""]] : it.kind === "diagram" ? [["PNG", ""], ["SVG", ""]] : [["Original", it.meta.split("·").pop().trim()]];
  return `<div class="mgroup">Baixar como</div>${f.map(([l, s]) => `<button class="mi" type="button" data-fmt="${l}">${I.download}<span>${l}</span>${s ? `<span class="sub">${s}</span>` : ""}</button>`).join("")}`;
};
const moreMenu = (it) => () => `<button class="mi" type="button" data-m="open">${I.open}<span>Abrir</span><span class="kbd">↵</span></button>
  ${it.ch ? `<button class="mi" type="button" data-m="channel">${I.hash}<span>Ver em #${it.ch}</span></button>` : ""}
  <button class="mi" type="button" data-m="link">${I.link}<span>Copiar link</span></button>
  <button class="mi" type="button" data-m="rename">${I.rename}<span>Renomear</span></button>
  <button class="mi" type="button" data-m="versions">${I.history}<span>Versões</span><span class="sub">${it.v}</span></button>
  <div class="msep"></div><button class="mi danger" type="button" data-m="trash">${I.trash}<span>Mover para lixeira</span></button>`;

/* ---------- toasts ---------- */
function toast({ icon = I.check, ok = true, title, sub = "", action, ms = 3600 }) {
  const t = document.createElement("div");
  t.className = "toast glass"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="ti ${ok ? "ok" : ""}">${icon}</span><div class="tt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>${action ? `<button class="b bg sm" type="button">${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { action.run(); dismiss(t); };
  $("#toasts").append(t);
  setTimeout(() => dismiss(t), ms);
  return t;
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add("out"); setTimeout(() => t.remove(), 200); }
const copyLink = (ids) => { try { navigator.clipboard?.writeText(ids.map((id) => `https://agentes.chat/acme/drive?artifact=${id}`).join("\n")).catch(() => {}); } catch {} toast({ icon: I.link, title: ids.length > 1 ? `${ids.length} links copiados` : "Link copiado", sub: "Só quem está no workspace consegue abrir." }); };

/* ---------- upload ---------- */
function upload(files) {
  if (!files.length) return;
  if (S.trash || S.empty) { S.trash = false; S.empty = false; $('[data-proto="empty"]').setAttribute("aria-pressed", "false"); render(); }
  const t = document.createElement("div");
  t.className = "toast glass up"; t.setAttribute("role", "status");
  const head = () => `<div class="uh"><span class="spin"></span><b>Enviando ${files.length} ${files.length === 1 ? "arquivo" : "arquivos"}</b><button class="ib" type="button" aria-label="Fechar">${I.x}</button></div>`;
  t.innerHTML = head() + files.map((f, i) => `<div class="urow" data-i="${i}">${f.sub === "image" ? I.image : I.file}<span class="nm">${esc(f.name)}</span><span class="pc">0%</span><span class="trk"><i style="width:0"></i></span></div>`).join("");
  t.querySelector(".ib").onclick = () => dismiss(t);
  $("#toasts").append(t);
  const prog = files.map(() => 0);
  const timer = setInterval(() => {
    let all = true;
    files.forEach((f, i) => {
      if (prog[i] >= 100) return;
      prog[i] = Math.min(100, prog[i] + 6 + Math.random() * 16 / (1 + i * .4));
      const row = t.querySelector(`[data-i="${i}"]`);
      row.querySelector("i").style.width = prog[i] + "%";
      row.querySelector(".pc").textContent = prog[i] >= 100 ? "pronto" : Math.round(prog[i]) + "%";
      if (prog[i] >= 100) { row.classList.add("done"); addUploaded(f); } else all = false;
    });
    if (all) {
      clearInterval(timer);
      t.querySelector(".uh").innerHTML = `<span class="ti ok" style="width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)">${I.check.replace('class="i"', 'class="i sm"')}</span><b>${files.length === 1 ? "No Drive" : `${files.length} arquivos no Drive`}</b><button class="b bg sm" type="button">Ver</button>`;
      t.querySelector(".b").onclick = () => { const first = ITEMS[0]; S.open = first.id; render(); dismiss(t); };
      setTimeout(() => dismiss(t), 5000);
    }
  }, 160);
}
function addUploaded(f) {
  const it = { id: nextId++, title: f.name, kind: "file", sub: f.sub, pv: f.sub === "image" ? "img-up" : f.sub === "pdf" ? "pdf-contract" : "gen-up", url: f.url, by: P("walter"), ch: null, age: 0, v: 1, meta: `${f.ext} · ${f.size}` };
  if (f.sub === "image" && !f.url) it.pv = "img-logo";
  ITEMS.unshift(it); S.fresh.add(it.id);
  setTimeout(() => S.fresh.delete(it.id), 1200);
  renderTools(); renderContent();
}
const fmtSize = (b) => (b > 1e6 ? (b / 1e6).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB");
function fromFiles(list) {
  return [...list].map((f) => {
    const ext = (f.name.split(".").pop() || "").toUpperCase();
    const sub = f.type.startsWith("image/") ? "image" : ext === "PDF" ? "pdf" : f.type.startsWith("video/") ? "video" : "file";
    return { name: f.name, sub, ext, size: fmtSize(f.size), url: sub === "image" ? URL.createObjectURL(f) : null };
  });
}
const DEMO_FILES = [{ name: "briefing-cliente.pdf", sub: "pdf", ext: "PDF", size: "840 KB" }, { name: "moodboard.png", sub: "image", ext: "PNG", size: "1,6 MB" }, { name: "precos-2027.xlsx", sub: "file", ext: "XLSX", size: "64 KB" }];

/* ---------- actions ---------- */
const byId = (id) => ITEMS.find((x) => x.id === +id);
function toTrash(ids) {
  const moved = ITEMS.filter((it) => ids.includes(it.id));
  ITEMS = ITEMS.filter((it) => !ids.includes(it.id));
  TRASH = [...moved.map((it) => ({ ...it, del: "Walter", delAge: 0, left: 30 })), ...TRASH];
  if (ids.includes(S.open)) S.open = null;
  ids.forEach((id) => S.sel.delete(id));
  render();
  toast({ icon: I.trash, ok: false, title: moved.length > 1 ? `${moved.length} itens na lixeira` : "Movido para a lixeira", sub: "Fica lá por 30 dias.", action: { label: "Desfazer", run: () => restore(moved.map((m) => m.id), true) } });
}
function restore(ids, quiet) {
  const back = TRASH.filter((it) => ids.includes(it.id));
  TRASH = TRASH.filter((it) => !ids.includes(it.id));
  for (const it of back) { const { del, delAge, left, ...rest } = it; ITEMS.push({ ...rest, age: rest.age ?? 60 }); S.fresh.add(it.id); setTimeout(() => S.fresh.delete(it.id), 1200); }
  render();
  if (!quiet) toast({ icon: I.restore, title: back.length > 1 ? "Itens restaurados" : "Restaurado", sub: back.length === 1 ? back[0].title : "", action: { label: "Ver no Drive", run: () => { S.trash = false; S.open = back[0].id; render(); } } });
}
function openItem(it) { toast({ icon: I.open, ok: false, title: `Abrindo ${it.title}`, sub: "No app, abre o visualizador em tela cheia." }); }
function select(id, on) { on ?? (on = !S.sel.has(id)); on ? S.sel.add(id) : S.sel.delete(id); renderContent(); renderSelbar(); }
function setOpen(id) { S.open = S.open === id ? null : id; renderContent(); renderPanel(); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("button,[data-id],[data-act]");
  if (menuEl && !e.target.closest(".menu")) { const a = menuEl._anchor; closeMenu(); if (el && a === el) return; }
  if (!el) return;
  const d = el.dataset;
  // prototype bar
  if (d.proto === "drop") { showDrop(true); setTimeout(() => { showDrop(false); upload(DEMO_FILES); }, 1500); return; }
  if (d.proto === "empty") { S.empty = !S.empty; el.setAttribute("aria-pressed", String(S.empty)); S.trash = false; S.open = null; S.sel.clear(); render(); return; }
  if (el.closest("#theme") && d.v) { setTheme(d.v); return; }
  if (el.closest("#who") && d.v) { S.who = d.v; renderTools(); renderContent(); return; }
  if (el.closest("#view") && d.v) { S.view = d.v; renderTools(); renderContent(); return; }
  if (d.kind) { S.kinds.has(d.kind) ? S.kinds.delete(d.kind) : S.kinds.add(d.kind); renderTools(); renderContent(); return; }
  // menus
  if (d.ch) { if (d.ch === "__clear") S.channels.clear(); else S.channels.has(d.ch) ? S.channels.delete(d.ch) : S.channels.add(d.ch); renderTools(); renderContent(); refreshMenu(); return; }
  if (d.group) { S.group = d.group; renderTools(); renderContent(); refreshMenu(); return; }
  if (d.sort) { S.sort = d.sort; renderContent(); refreshMenu(); return; }
  if (d.fmt) { closeMenu(); toast({ icon: I.download, title: `Baixando como ${d.fmt}`, sub: byId(S.open)?.title }); return; }
  if (d.m) {
    const it = menuEl?._item; closeMenu(); if (!it) return;
    if (d.m === "open") openItem(it);
    if (d.m === "link") copyLink([it.id]);
    if (d.m === "trash") toTrash([it.id]);
    if (d.m === "channel") toast({ icon: I.hash, ok: false, title: `Indo para #${it.ch}`, sub: "Na mensagem onde o arquivo apareceu." });
    if (d.m === "rename") toast({ icon: I.rename, ok: false, title: "Renomear", sub: "Abre um diálogo com o nome selecionado." });
    if (d.m === "versions") { S.open = it.id; renderContent(); renderPanel(); }
    return;
  }
  if (d.restore) { const row = el.closest(".trow"); row.classList.add("gone"); setTimeout(() => restore([+d.restore]), 220); return; }
  if (d.ver) { toast({ icon: I.history, ok: false, title: `Versão ${d.ver}`, sub: "Abre esta versão no visualizador, com a opção de restaurar." }); return; }
  // checkbox
  if (d.ck !== undefined) { const id = +el.closest("[data-id]").dataset.id; select(id); return; }
  if (d.more !== undefined) { const it = byId(el.closest("[data-id]").dataset.id); openMenu(el, moreMenu(it)); menuEl._item = it; return; }
  switch (d.act) {
    case "channels": return openMenu(el, channelMenu);
    case "arrange": return openMenu(el, arrangeMenu);
    case "upload": return $("#file").click();
    case "trash": S.trash = true; S.open = null; S.sel.clear(); return render();
    case "back": S.trash = false; return render();
    case "clear": S.q = ""; $("#q").value = ""; S.kinds.clear(); S.channels.clear(); S.who = "all"; renderTools(); return renderContent();
    case "close": S.open = null; renderContent(); return renderPanel();
    case "open": return openItem(byId(S.open));
    case "download": return toast({ icon: I.download, title: "Baixando", sub: byId(S.open).title });
    case "formats": { openMenu(el, formatsMenu(byId(S.open))); return; }
    case "link": return copyLink([S.open]);
    case "pmore": { const it = byId(S.open); openMenu(el, moreMenu(it)); menuEl._item = it; return; }
    case "seldl": return toast({ icon: I.download, title: `Baixando ${S.sel.size} itens`, sub: "Vão juntos num .zip." });
    case "sellink": return copyLink([...S.sel]);
    case "seldel": return toTrash([...S.sel]);
    case "selclear": S.sel.clear(); renderContent(); return renderSelbar();
    case "poke": { const l = live.find((x) => x.cv.isConnected && x.cv.closest(".glow")); if (l) l.joy = performance.now() / 1000 + 1.4; return; }
    case "ask": return toast({ icon: I.chat, ok: false, title: "Abre a conversa com o Theo", sub: "“Monta um relatório da semana”" });
  }
  // a card or row
  if (d.id && (el.classList.contains("card") || el.classList.contains("lr"))) {
    const id = +d.id;
    if (e.shiftKey || e.metaKey || e.ctrlKey || S.sel.size) return select(id);
    setOpen(id);
  }
});
document.addEventListener("dblclick", (e) => { const c = e.target.closest(".card,.lr"); if (c && !e.target.closest("button")) openItem(byId(c.dataset.id)); });
$("#scrim").addEventListener("click", () => { S.open = null; renderContent(); renderPanel(); });
$("#q").addEventListener("input", (e) => { S.q = e.target.value; renderContent(); });
$("#file").addEventListener("change", (e) => { upload(fromFiles(e.target.files)); e.target.value = ""; });

const typing = () => /INPUT|TEXTAREA/.test(document.activeElement?.tagName || "");
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); if (S.trash || S.empty) { S.trash = false; S.empty = false; render(); } $("#q").focus(); $("#q").select(); return; }
  if (e.key === "Escape") {
    if (menuEl) return closeMenu();
    if (!$("#drop").hidden) return showDrop(false);
    if (typing() && S.q) { S.q = ""; $("#q").value = ""; return renderContent(); }
    if (typing()) return document.activeElement.blur();
    if (S.sel.size) { S.sel.clear(); renderContent(); return renderSelbar(); }
    if (S.open) { S.open = null; renderContent(); return renderPanel(); }
    return;
  }
  if (typing()) return;
  if (mod && e.key.toLowerCase() === "a" && !S.trash && !S.empty) { e.preventDefault(); visible().forEach((it) => S.sel.add(it.id)); renderContent(); return renderSelbar(); }
  if (e.key === "/" && !S.trash) { e.preventDefault(); $("#q").focus(); return; }
  if (e.key.toLowerCase() === "u" && !mod && !S.trash) { $("#file").click(); return; }
  const focused = document.activeElement?.closest?.(".card,.lr");
  if (e.key === "Enter" && focused && !document.activeElement.matches("button")) { e.preventDefault(); return setOpen(+focused.dataset.id); }
  if (e.key === " " && focused && !document.activeElement.matches("button")) { e.preventDefault(); return select(+focused.dataset.id); }
  if (e.key === "Enter" && S.open && !document.activeElement.matches("button")) return openItem(byId(S.open));
  if ((e.key === "Delete" || e.key === "Backspace") && S.sel.size) return toTrash([...S.sel]);
});
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $("#qk").textContent = "Ctrl K";

/* ---------- drop ---------- */
let depth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
function showDrop(on) { $("#drop").hidden = !on; if (!on) depth = 0; }
addEventListener("dragenter", (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth++; showDrop(true); });
addEventListener("dragover", (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
addEventListener("dragleave", (e) => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) showDrop(false); });
addEventListener("drop", (e) => { if (!hasFiles(e)) return; e.preventDefault(); showDrop(false); upload(fromFiles(e.dataTransfer.files)); });

/* ---------- theme ---------- */
function setTheme(v) {
  document.documentElement.dataset.theme = v;
  varCache = {};
  $$("#theme button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  placePill($("#theme"));
}
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
addEventListener("resize", () => $$(".seg").forEach(placePill));
$("#logo").append(makeAgent("theo", 30));
document.fonts?.ready.then(() => $$(".seg").forEach(placePill));
// Direct links for review: #lista, #vazio, #lixeira, #escuro, #item=3, #sel, #soltar
const H = location.hash.slice(1).split(",");
if (H.includes("lista")) S.view = "list";
if (H.includes("vazio")) { S.empty = true; $('[data-proto="empty"]').setAttribute("aria-pressed", "true"); }
if (H.includes("lixeira")) S.trash = true;
if (H.includes("escuro")) setTheme("dark");
if (H.includes("sel")) [2, 3, 4].forEach((i) => S.sel.add(i));
if (H.includes("soltar")) showDrop(true);
const HI = H.find((x) => x.startsWith("item="));
if (HI) S.open = +HI.slice(5);
render();
</script>
</body>
</html>
