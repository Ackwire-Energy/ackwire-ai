<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Doto:ROND,wght@100,600&family=Martian+Mono:wght@400&display=swap">
<script>{const q=new URLSearchParams(location.hash.slice(1));document.documentElement.dataset.theme=q.get("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}</script>
<style>
/*
  Prototype: the desktop app for a connected computer (today `agentes-runner`, a terminal tool).
  It lives in the macOS menu bar / Windows tray. The runner keeps being the same code: the app runs it as a
  bundled single binary (no Node or Bun needed), shows what the agents are doing on this computer, pauses them,
  installs updates, and is THE place where access is granted. "Permissions only widen on the machine" holds:
  a click in this app is a click on the machine. The terminal command stays for servers without a screen.
  Several organizations on one computer (ADR 0036): one runner per organization, each with its own folders,
  tasks and token; the popover groups "Agora" by organization, Preferences lists them (add, leave), Folders and
  Activity switch by organization; pause and tools are for the whole computer.
  No internal names in the UI: never "runner", "MCP", "protocol"; the app is just "agentes".

  Views (prototype bar on top; every state is a deep link):
    #view=tray       the menu bar popover   &state=working|idle|paused|offline|update   &os=mac|win
    #view=ask        an agent asks for a folder: system notification + the request in the popover
                     &state=ask|done
    #view=welcome    first run: sign in (code confirmed in the browser), folders, tools, done
                     &state=hello|code|folders|tools|done|org (org = connecting another organization)
    #view=prefs      Preferences window   &tab=geral|pastas|ferramentas|atualizacoes|atividade|avancado
                     &state=update (an update is waiting)
    Everywhere: &theme=light|dark   &os=mac|win
  Agents come only from packages/ui/src/agent/engine.js (serve the repo root over http).
  Base: PastasComputador.html (tokens, folders, tools), Carregando.html (pixel orbit), OnboardingV2.html (sky as horizon).
  Mono only for commands and paths.
*/
:root{
  --bg:#f4f4f1;--raised:#fff;--sunken:#ebebe7;--glass:rgba(255,255,255,.74);--line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b4352b;--danger-soft:#fbe6e3;
  --agent:#0063d1;--agent-soft:#e3eefd;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 8px 20px -6px rgba(23,23,22,.12),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --mbar:rgba(246,246,243,.62);--mbar-ink:#151514;
  --sans:"Onest",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",monospace;--mono:"Martian Mono",ui-monospace,monospace;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--glass:rgba(28,28,26,.74);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#ef7c70;--danger-soft:#3a1714;
  --agent:#5aa8ff;--agent-soft:#11253f;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --mbar:rgba(20,20,19,.55);--mbar-ink:#efefec;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";overflow-x:hidden}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
canvas.av{display:block;flex:none}
canvas.orbit{display:inline-block;flex:none;image-rendering:pixelated;vertical-align:middle}
:focus-visible{outline:2px solid #3d8bff;outline-offset:2px}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popup{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes look{0%,40%{transform:translateX(0)}50%,90%{transform:translateX(1.2px)}}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- Prototype bar (not product) ---------- */
.pbar{position:sticky;top:0;z-index:90;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pbar .lbl{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.pbar .grow{flex:1}
.views{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.views::-webkit-scrollbar{display:none}
.stp{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 6px;border-radius:999px;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.stp .n{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--sunken);color:var(--faint)}
.stp:hover{background:var(--plate);color:var(--ink)}
.stp[aria-current="step"]{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.stp[aria-current="step"] .n{background:var(--ink);color:var(--bg)}
.pbar .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- Controls (design system v2) ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:12px;font-weight:600;font-size:13.5px;letter-spacing:-.005em;background:var(--raised);box-shadow:var(--e1),var(--top);white-space:nowrap;transition:transform .18s var(--spring),box-shadow .18s var(--out),filter .15s,background .15s,color .15s,opacity .15s}
.btn:hover{box-shadow:var(--e2),var(--top)}
.btn:active{transform:scale(.97) translateY(.5px)}
.btn.primary{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)),var(--ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{color:#fff;background:linear-gradient(180deg,#c9473c,#a8322a);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px -6px rgba(168,50,42,.6)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.btn.xs{height:26px;padding:0 9px;font-size:12px;border-radius:8px;gap:5px}
.btn.lg{height:44px;padding:0 20px;font-size:14.5px;border-radius:14px}
.btn[aria-disabled="true"]{opacity:.45;cursor:default;transform:none;filter:none}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .18s var(--spring)}
.iconbtn:hover{background:var(--plate);color:var(--ink)}
.iconbtn:active{transform:scale(.94)}
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.18);color:var(--faint);box-shadow:inset 0 -1px 0 rgba(0,0,0,.1)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;max-width:100%}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.help{color:var(--muted);font-size:12.5px}
.faint{color:var(--faint)}
.n-dot{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600}
/* Switch (custom, never native). */
.sw{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:40px;height:24px;border-radius:999px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.08);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.06);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink);box-shadow:none}
.sw[aria-checked="true"]::after{transform:translateX(16px);background:var(--bg)}
.sw[aria-disabled="true"]{opacity:.4;cursor:default}
/* Checkbox row (custom). */
.ck{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;transition:background .15s}
.ck:hover{background:var(--plate)}
.ck .box{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);flex:none;transition:background .15s}
.ck .box svg{width:12px;height:12px;stroke-width:2.6;opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s var(--spring)}
.ck[aria-checked="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.ck[aria-checked="true"] .box svg{opacity:1;transform:none}
.ck .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ck .t b{font-weight:600}
.ck .t small{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%}
.seg button{all:unset;position:relative;z-index:1;cursor:pointer;height:28px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:hover{color:var(--ink)}
.seg .pill{position:absolute;top:0;left:0;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.seg.xs button{height:24px;padding:0 9px;font-size:12px}
.seg.xs .pill{height:24px}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.stepper button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.stepper button:hover{background:var(--raised);color:var(--ink);box-shadow:var(--e1)}
.stepper output{min-width:28px;text-align:center;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:15px}
.input{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s;min-width:0}
.input:focus-within{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.input input{all:unset;flex:1;min-width:0;height:100%}
code,.path{font-family:var(--mono);font-size:11px;color:var(--ink2)}
code{padding:1px 5px;border-radius:6px;background:var(--sunken);white-space:nowrap}
.path{overflow-wrap:anywhere}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:14px;background:var(--plate);color:var(--muted);font-size:12.5px}
.note b{color:var(--ink);font-weight:600}
.note svg{margin-top:2px}
.honest{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink2)}
.honest svg{color:var(--warn);margin-top:2px}
.logo{width:34px;height:34px;border-radius:11px 11px 11px 4px;display:grid;place-items:center;flex:none;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
.logo.soft{background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.org{width:20px;height:20px;border-radius:6px 6px 6px 2px;flex:none;display:inline-grid;place-items:center;font-weight:700;font-size:10.5px;background:var(--ink);color:var(--bg);letter-spacing:-.02em}
.org.md{width:30px;height:30px;font-size:13px;border-radius:9px 9px 9px 3px}
.org.sm{width:16px;height:16px;font-size:9px;border-radius:5px 5px 5px 2px}
.ohead{display:flex;align-items:center;gap:8px;padding:6px 8px 2px;font-size:12.5px;font-weight:650;color:var(--ink2)}
.ohead .n-dot{font-size:12px;color:var(--muted)}
.ohead .r{margin-left:auto;font-size:12px;font-weight:500;color:var(--faint)}
.pa{width:28px;height:28px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:650;font-size:11.5px;background:linear-gradient(160deg,#e9e9e5,#d9d9d4);color:#2a2a28}
:root[data-theme="dark"] .pa{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}

/* ---------- Desktop (fake OS around the app) ---------- */
.desk{position:relative;height:calc(100vh - 45px);min-height:640px;overflow:hidden;isolation:isolate}
.desk canvas.wall{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
.mbar{position:absolute;top:0;left:0;right:0;height:28px;display:flex;align-items:center;gap:16px;padding:0 10px 0 16px;background:var(--mbar);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);color:var(--mbar-ink);font-size:13px;font-weight:500;z-index:5}
.mbar .app{font-weight:700}
.mbar .menus{display:flex;gap:16px;opacity:.85}
.mbar .grow{flex:1}
.mbar .sys{display:flex;align-items:center;gap:4px}
.mbar .sys > span{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 6px;border-radius:5px;white-space:nowrap}
.tray{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;height:22px;min-width:30px;padding:0 6px;border-radius:5px;color:var(--mbar-ink);position:relative}
.tray:hover,.tray[aria-expanded="true"]{background:rgba(127,127,127,.24)}
.tray svg{width:18px;height:18px}
.tray .eyes{animation:none}
.tray.working .eyes{animation:look 2.4s ease-in-out infinite}
/* Windows: taskbar at the bottom. */
.tbar{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--mbar);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);color:var(--mbar-ink);z-index:5;box-shadow:0 -1px 0 var(--line)}
.tbar .ap{width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
.tbar .ap i{width:20px;height:20px;border-radius:5px;background:rgba(127,127,127,.35)}
.tbar .ap.start i{background:none;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.tbar .ap.start i b{background:#3d8bff;border-radius:1px}
.tbar .sys{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;gap:2px;font-size:12px}
.tbar .sys .clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;padding:0 8px}
.tbar .tray{height:36px;min-width:34px}
.stage{position:absolute;inset:28px 0 0 0;display:grid;place-items:center;padding:24px 16px}
.os-win .stage{inset:0 0 48px 0}

/* ---------- Popover (the app in the menu bar) ---------- */
.pop{position:absolute;top:34px;width:360px;max-width:calc(100% - 16px);border-radius:18px;padding:6px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:var(--e3),var(--top);animation:popin .25s var(--spring) both;z-index:10;max-height:calc(100% - 48px);overflow-y:auto;scrollbar-width:none}
.pop::-webkit-scrollbar{display:none}
.os-win .pop{top:auto;bottom:56px;animation-name:popup}
.ph{display:flex;align-items:center;gap:10px;padding:8px 8px 10px}
.ph .t{flex:1;min-width:0;display:flex;flex-direction:column}
.ph .t b{font-weight:650;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .t small{color:var(--muted);font-size:12px}
.psec{padding:4px 2px}
.psec + .psec{border-top:1px solid var(--line);margin-top:2px;padding-top:6px}
.pcap{display:flex;align-items:center;gap:6px;padding:4px 8px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.pcap .n-dot{font-size:12px;letter-spacing:0;color:var(--muted)}
.pcap .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px}
.job{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;position:relative;min-width:0}
.job:hover{background:rgba(127,127,127,.12)}
.job .avw{width:28px;display:flex;justify-content:center;flex:none}
.job .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.job .t b{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;min-width:0}
.job .t b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .t small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.job .t small code{font-size:10.5px;padding:0 4px;background:var(--plate)}
.job .end{display:flex;align-items:center;gap:4px;flex:none;color:var(--faint);font-size:12px}
.job .stop{display:none}
.job:hover .stop{display:grid}
.job:hover .since{display:none}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:5px 8px;border-radius:10px;font-size:13.5px;font-weight:500}
.mi:hover{background:rgba(127,127,127,.13)}
.mi svg{color:var(--muted)}
.mi .r{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--faint);font-size:12px}
.mi.danger{color:var(--danger)}
.mi.danger svg{color:var(--danger)}
.sub{margin:2px 0 4px 26px;display:flex;flex-direction:column;animation:fi .2s var(--out) both}
.sub .mi{font-size:13px;min-height:30px}
.empty{display:flex;align-items:center;gap:12px;padding:10px 8px 12px}
.empty .t{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.empty .t b{color:var(--ink);font-weight:600}
.banner{margin:2px 2px 6px;padding:12px;border-radius:14px;background:var(--raised);box-shadow:var(--e1),var(--top);display:flex;flex-direction:column;gap:10px;animation:fi .25s var(--out) both}
.banner .bh{display:flex;gap:10px;align-items:flex-start}
.banner .bh .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.banner .bh b{font-weight:650;font-size:13.5px}
.banner .bh small{font-size:12.5px;color:var(--muted)}
.banner .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ================= Agents (only from the engine) ================= */
const DPR = Math.min(2, devicePixelRatio || 1);

  cv.className = "av";
  const w = size * (1 + RCH.left + RCH.right), h = size * (1 + RCH.top + RCH.bottom);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.style.margin = `${-size * RCH.top}px ${-size * RCH.right}px ${-size * RCH.bottom}px ${-size * RCH.left}px`;
  live.push({ cv, look, size, seed, opts });

}
function drawOne(a, t, pose) {
  const c = a.cv.getContext("2d"), s = a.size * DPR, L = a.look;
  c.clearRect(0, 0, a.cv.width, a.cv.height);

    after: L.accessory && L.accessory !== "none" ? (cx, side, frame) => drawAccessory(cx, side, L.accessory, frame, t, a.opts.mode === "writing") : undefined,
  });
}
function poseFor(a, t) {
  const m = a.opts.mode;
  if (m === "writing") return { writing: true, turn: [0.3 + 0.08 * Math.sin(t * 0.7 + a.seed), 0.18], squash: Math.sin(t * 5 + a.seed) * 0.1 };
  if (m === "waiting") { const p = idlePose(t, a.seed, { every: 7, expressions: ["closed"] }); p.turn = [-0.5, -0.3]; return p; }
  if (m === "sleep") return { expression: "closed", turn: [0, 0.15] };
  if (m === "happy") return { expression: "happy", turn: [0.2, 0] };
  return idlePose(t, a.seed, { every: 11, expressions: ["happy", "wink"] });
}
function hydrate(root) {
  for (const el of $$("[data-av]", root)) {
    const id = el.dataset.av, size = Number(el.dataset.size || 20);
    const look = id === "brand" ? { color: "sky", eyes: "round" } : AGENTS[id].look;
    el.replaceWith(avatar(look, size, Math.random() * 5, { mode: el.dataset.mode }));
  }
  for (const cv of $$("canvas.orbit", root)) {
    const size = Number(cv.dataset.size || 14);
    cv.style.width = cv.style.height = size + "px"; cv.width = cv.height = Math.round(size * DPR);
  }
}
const av = (id, size = 20, mode = "") => `<span data-av="${id}" data-size="${size}" ${mode ? `data-mode="${mode}"` : ""}></span>`;
const orbit = (color = "sky", size = 14) => `<canvas class="orbit" data-color="${color}" data-size="${size}" aria-hidden="true"></canvas>`;

  const ctx = cv.getContext("2d"), cell = cv.width / 3, gap = Math.max(1, Math.round(cell * 0.14));
  const tn0 = bodyTones(cv.dataset.color), tn = Array.isArray(tn0) ? tn0 : Object.values(tn0);
  const dark = document.documentElement.dataset.theme === "dark";
  const faint = mixHex(tn[tn.length - 1] ?? "#999999", dark ? "#000000" : "#ffffff", dark ? 0.55 : 0.45);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const head = reduce ? 0 : Math.floor(now / 110) % 8;

    ctx.fillStyle = age === 0 ? tn[0] : age === 1 ? tn[Math.min(1, tn.length - 1)] : age === 2 ? tn[Math.min(2, tn.length - 1)] : faint;

}

/* ================= Skies: the desktop wallpaper and the welcome horizon ================= */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const rgb = (h) => { const n = parseInt(h.slice(1, 7), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
function ramp(c) {
  const [top, bot] = AGENT_GRADIENTS[c] ?? AGENT_GRADIENTS.sky, deep = mixHex(bot, "#000000", 0.42);
  return [deep, mixHex(deep, bot, 0.5), bot, mixHex(bot, top, 0.5), top, mixHex(top, "#ffffff", 0.4), mixHex(top, "#ffffff", 0.7), mixHex(top, "#ffffff", 0.9)];
}
function paintSky(cv, t, o) {
  const r = cv.getBoundingClientRect(); if (!r.width || !r.height) return;
  const PX = o.px || 4, W = Math.ceil(r.width / PX), H = Math.ceil(r.height / PX);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; cv._img = null; }
  const c = cv.getContext("2d");
  const img = cv._img || (cv._img = c.createImageData(W, H)), d = img.data;
  const pal = o.palette.map((p) => (Array.isArray(p) ? p : rgb(p))), n = pal.length - 1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {

}
function wall(t) {
  const cv = $("#wall"); if (!cv) return;

  const pal = dark ? ramp("sky").slice(0, 5) : ramp("sky");
  paintSky(cv, t, { px: 6, palette: pal, base: (u, v, t2) => {
    const dx = (u - 0.3) * 1.4, dy = (v - 1.05) * 1.1;

  const cv = $("#hz"); if (!cv || !cv.offsetParent) return;

  const sky = ["#a6cfff", "#78b4ff", "#4b93ff", "#2b74e6"].map(rgb);
  const tones = [surface, ...[0.18, 0.4, 0.65].map((k) => surface.map((v, i) => Math.round(v + (sky[0][i] - v) * k))), ...sky];

      if (!a.cv.isConnected) { live.splice(i, 1); continue; }
      drawOne(a, t, poseFor(a, t));

    for (const cv of $$("canvas.orbit")) drawOrbit(cv, now);

  }
  requestAnimationFrame(frame);

function popBody() {

  if (st === "paused") top = `<div class="banner"><div class="bh"><span class="logo soft">${I("pause")}</span><span class="t"><b>Pausado até 16:24</b><small>Nenhum agente, de nenhuma organização, começa nada novo neste ${osWord()}. Se alguém pedir, o agente avisa no chat que você pausou.</small></span></div><div class="acts"><button class="btn sm primary" data-act="resume">${I("play", "sm")}Retomar agora</button><button class="btn sm ghost" data-act="plus1">+1 hora</button></div></div>`;

      ? `<div class="empty">${av("dev", 26, "sleep")}<span class="t"><b>Tudo parado</b><span>O build do site terminou antes da pausa.</span></span></div>`

  } else {
    const list = st === "offline" ? jobs.filter((j) => j.bg) : jobs;
    /* Grouped by organization: each one is its own runner on this computer. */
    now = S.orgs.map((o) => {
      const mine = list.filter((j) => AGENTS[j.agent].org === o);
      return `<div class="ohead">${orgTile(o, "sm")}${ORGS[o].name}${mine.length ? ` <span class="n-dot">${mine.length}</span>` : ""}${mine.length ? "" : `<span class="r">${st === "offline" ? "Esperando a conexão" : "Nada agora"}</span>`}</div>${mine.map(jobRow).join("")}`;
    }).join("");
  }
  const count = st === "idle" || st === "paused" ? 0 : st === "offline" ? jobs.filter((j) => j.bg).length : jobs.length;
  const pauseItem = st === "paused"
    ? `<button class="mi" data-act="resume">${I("play", "sm")}Retomar os agentes</button>`
    : `<button class="mi" data-act="pausemenu" aria-expanded="${S.pauseMenu}">${I("pause", "sm")}Pausar os agentes<span class="r">${I(S.pauseMenu ? "down" : "right", "sm")}</span></button>
       ${S.pauseMenu ? `<div class="sub"><button class="mi" data-pause="1h">Por 1 hora</button><button class="mi" data-pause="tomorrow">Até amanhã às 9h</button><button class="mi" data-pause="manual">Até eu retomar</button><span class="help" style="padding:4px 8px 2px">O que já está rodando termina normalmente.</span></div>` : ""}`;

  return `${top}
    <div class="psec"><div class="pcap">Agora${count ? ` <span class="n-dot">${count}</span>` : ""}<span class="r">${count ? `<button class="undo" data-act="openchat">Ver tudo ${I("external", "sm")}</button>` : ""}</span></div>${now}</div>
    <div class="psec">
      ${pauseItem}

      <button class="mi" data-act="openweb">${I("external", "sm")}Abrir agentes.chat<span class="r"><span class="kbd">${isWin() ? "Ctrl" : "⌘"}</span><span class="kbd">O</span></span></button>
      <button class="mi" data-act="prefs">${I("settings", "sm")}Preferências…<span class="r">${S.view === "tray" && S.state === "update" ? I("download", "sm") : ""}<span class="kbd">${isWin() ? "Ctrl" : "⌘"}</span><span class="kbd">,</span></span></button>
    </div>
    <div class="psec"><button class="mi" data-act="quit">${I("power", "sm")}Sair do agentes<span class="r"><span class="kbd">${isWin() ? "Alt" : "⌘"}</span><span class="kbd">${isWin() ? "F4" : "Q"}</span></span></button></div>`;

  const st = (s) => s === "run" ? orbit("sky", 12) : s === "ok" ? `<span style="color:var(--ok)">${I("ok", "sm")}</span>` : s === "fail" ? `<span style="color:var(--danger)">${I("fail", "sm")}</span>` : s === "no" ? `<span class="faint">${I("dash", "sm")}</span>` : "";
  return `<div class="head"><div><h2>Atividade</h2><p class="lead">Tudo o que os agentes fizeram neste ${osWord()}.</p></div><button class="btn sm" data-act="diag">${I("copy", "sm")}Copiar diagnóstico</button></div>
    <div style="margin-bottom:12px;overflow-x:auto;scrollbar-width:none">${seg("aorg", opts, S.actOrg, 'aria-label="Organização"', "xs")}</div>
    <div class="card pad"><div class="act">${clean.map((e) => e.day ? `<div class="day">${e.day}</div>` : `<div class="ev"><span class="tm">${e.tm}</span><span class="avw">${e.person ? `<span class="pa" style="width:20px;height:20px;font-size:9.5px">W</span>` : av(e.agent, 18)}</span><span class="tx">${e.tx}${S.actOrg === "all" && orgOf(e) ? `<small>${ORGS[orgOf(e)].name}</small>` : ""}${e.cmd ? `<small><code>${esc(e.cmd)}</code></small>` : ""}</span><span class="st">${st(e.st)}</span></div>`).join("")}</div></div>`;
}
function tabAvancado() {
  const step = (key, v, label) => `<span class="stepper" role="group" aria-label="${label}"><button data-step-dec="${key}" aria-label="Menos">${I("minus", "sm")}</button><output>${v}</output><button data-step-inc="${key}" aria-label="Mais">${I("plus", "sm")}</button></span>`;
  return `<div class="head"><div><h2>Avançado</h2><p class="lead">Só mexa se o ${osWord()} estiver lento ou pesado. O padrão serve para quase todo mundo. Os limites valem para cada organização.</p></div><button class="btn sm ghost" data-act="defaults">Voltar ao padrão</button></div>
    <div class="ctitle">Trabalhos longos</div>
    <div class="card">
      <div class="crow"><span class="t"><b>Ao mesmo tempo</b><small>Quantos trabalhos longos rodam juntos, como builds e testes.</small></span>${step("maxTasks", S.maxTasks, "Trabalhos ao mesmo tempo")}</div>
      <div class="crow"><span class="t"><b>Tempo máximo de cada um</b><small>Depois disso o trabalho para e o agente avisa.</small></span>${seg("taskmax", [["1h", "1 h"], ["4h", "4 h"], ["8h", "8 h"]], S.taskMax, 'aria-label="Tempo máximo"', "xs")}</div>
    </div>
    <div class="ctitle">Claude Code</div>
    <div class="card">
      <div class="crow"><span class="t"><b>Conversas abertas</b><small>Mais conversas abertas respondem mais rápido e usam mais memória.</small></span>${step("brainMax", S.brainMax, "Conversas abertas")}</div>
      <div class="crow"><span class="t"><b>Fechar conversa parada depois de</b></span>${seg("idle", [["5", "5 min"], ["10", "10 min"], ["30", "30 min"]], S.brainIdle, 'aria-label="Fechar depois de"', "xs")}</div>
    </div>
    <div class="ctitle">Pasta dos agentes</div>
    <div class="card"><div class="crow"><span class="logo soft">${I("folder")}</span><span class="t"><b>agentes</b><small><span class="path">~/agentes</span> · uma pasta por organização dentro dela</small></span><button class="btn sm" data-act="movefolder">Mudar…</button></div></div>`;
}
function viewPrefs() {
  const body = { geral: tabGeral, pastas: tabPastas, ferramentas: tabFerramentas, atualizacoes: tabUpdates, atividade: tabAtividade, avancado: tabAvancado }[S.tab]();
  const updDot = S.state === "update" && S.installing !== 2;
  const nav = TABS.map(([id, t, ic]) => `<button data-tab="${id}" aria-current="${S.tab === id}">${I(ic, "sm")}${t}${id === "pastas" ? `<span class="n-dot">${S.folders.length}</span>` : id === "atualizacoes" && updDot ? `<span class="badge" title="Versão nova">${I("download", "sm")}</span>` : ""}</button>`).join("");
  $("#float").innerHTML = "";
  $("#stage").innerHTML = winChrome("Preferências", `<div class="prefs"><nav class="pnav" aria-label="Seções"><div class="who">${av("brand", 26)}<span class="t"><b>${esc(machineName())}</b><small>${orgsLabel()}</small></span></div>${nav}</nav><div class="pbody" id="pbody">${body}</div></div>`);
}

/* ================= Render ================= */
function render() {
  renderBar(); renderOS();
  if (S.view === "tray" || S.view === "ask") viewPop();
  else if (S.view === "welcome") viewWelcome();
  else viewPrefs();
  hydrate(document.body);
  placePills(); placePop();
  writeHash();
}
function dialog(html) { $("#layer").innerHTML = `<div class="scrim" data-scrim><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`; hydrate($("#layer")); }
const closeDialog = () => { $("#layer").innerHTML = ""; };

/* ================= Interaction ================= */
let codeTimer = 0;
function go(view, state) {
  S.view = view; resetFor(view);
  S.state = state ?? STATES[view][0][0];
  render();
}
function setStep(st) {
  S.state = st; clearTimeout(codeTimer);
  if (st === "org") codeTimer = setTimeout(() => { if (S.view === "welcome" && S.state === "org") { go("tray", "working"); toast("Conectado. Agora são 3 organizações neste " + osWord()); } }, 3600);
  if (st === "code") codeTimer = setTimeout(() => { if (S.view === "welcome" && S.state === "code") { toast("Conectado à Acme"); setStep("folders"); } }, 3200);
  render();
}
function install() {
  S.installing = 1; S.progress = 8; render();
  const tick = () => {
    S.progress = Math.min(100, S.progress + 23);
    const bar = $(".bar i"); if (bar) bar.style.width = S.progress + "%";
    if (S.progress < 100) setTimeout(tick, 420);
    else setTimeout(() => { S.installing = 2; if (S.view === "tray") S.state = "working"; render(); toast("Atualizado para a " + MACHINE.next); }, 350);
  };
  setTimeout(tick, 420);
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, a, [data-act], [data-scrim]");
  if (!el) { if (S.dropFor && !e.target.closest(".drop")) { S.dropFor = null; render(); } return; }
  const d = el.dataset;
  if (el.tagName === "A") e.preventDefault();
  if (d.scrim !== undefined && e.target === el) return closeDialog();
  if (d.view) return go(d.view);
  if (d.state !== undefined && el.closest(".pbar")) { S.view === "welcome" ? setStep(d.state) : (resetFor(S.view), S.state = d.state, render()); return; }
  if (d.os) { S.os = d.os; render(); return; }
  if (el.id === "themeBtn") { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; render(); return; }
  if (d.step) return setStep(d.step);
  if (d.tab) { S.tab = d.tab; S.dropFor = null; render(); $("#pbody")?.scrollTo(0, 0); return; }
  if (d.sw) {
    if (d.sw === "tool:codex") return;
    const [k, sub] = d.sw.split(":");
    if (sub) S.tools[sub] = !S.tools[sub]; else S[k] = !S[k];
    if (d.sw === "tool:commands" && S.tools.commands && S.view === "prefs") toast("Comandos ligados");
    render(); return;
  }
  if (d.pick) { S.picks.has(d.pick) ? S.picks.delete(d.pick) : S.picks.add(d.pick); render(); return; }
  if (d.askfor) { S.askFor = d.askfor; render(); return; }
  if (d.aorg) { S.actOrg = d.aorg; render(); return; }
  if (d.porg) { S.prefOrg = d.porg; S.dropFor = null; render(); return; }
  if (d.leaveok) { const o = d.leaveok; S.orgs = S.orgs.filter((x) => x !== o); S.folders = S.folders.filter((f) => f.org !== o); if (S.actOrg === o) S.actOrg = "all"; closeDialog(); render(); toast("Saiu da " + ORGS[o].name); return; }
  if (!d.act) {
    if (d.pause) { S.state = "paused"; S.pauseMenu = false; render(); toast(d.pause === "1h" ? "Pausado por 1 hora" : d.pause === "tomorrow" ? "Pausado até amanhã às 9h" : "Pausado até você retomar", "pause"); return; }
    if (d.stop) { S.stopped.add(d.stop); render(); toast("Parado. O agente avisa no chat.", "stop"); return; }
    if (d.drop) { S.dropFor = S.dropFor === d.drop ? null : d.drop; render(); return; }
    if (d.fa) { const [fid, aid] = d.fa.split(":"); const f = S.folders.find((x) => x.id === fid); f.agents = f.agents.includes(aid) ? f.agents.filter((x) => x !== aid) : [...f.agents, aid]; render(); return; }
    if (d.rmfolder) { const f = S.folders.find((x) => x.id === d.rmfolder); dialog(`<h2>Remover ${esc(f.name)}?</h2><p>${f.agents.length ? esc(listNames(f.agents.map((a) => AGENTS[a].name))) + " deixa" + (f.agents.length > 1 ? "m" : "") + " de usar esta pasta na hora." : "Nenhum agente usa esta pasta."} Nada é apagado.</p><div class="foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger solid" data-rmok="${f.id}">Remover</button></div>`); return; }
    if (d.rmok) { S.folders = S.folders.filter((x) => x.id !== d.rmok); closeDialog(); render(); toast("Pasta removida"); return; }
    if (d.close !== undefined) return closeDialog();
    if (d.stepInc || d.stepDec) { const k = d.stepInc || d.stepDec; S[k] = Math.max(1, Math.min(8, S[k] + (d.stepInc ? 1 : -1))); render(); return; }
    if (d.taskmax) { S.taskMax = d.taskmax; render(); return; }
    if (d.idle) { S.brainIdle = d.idle; render(); return; }
    return;
  }
  switch (d.act) {
    case "toggle": if (S.view === "tray" || S.view === "ask") { S.open = S.notif && S.view === "ask" && S.state === "ask" ? true : !S.open; S.notif = false; S.pauseMenu = false; render(); } else go("tray"); break;
    case "pausemenu": S.pauseMenu = !S.pauseMenu; render(); break;
    case "resume": S.state = "working"; render(); toast("Agentes de volta", "play"); break;
    case "plus1": toast("Pausado até 17:24", "pause"); break;
    case "install": install(); break;
    case "later": S.state = "working"; render(); toast("Instala hoje à noite, se nada estiver rodando", "clock"); break;
    case "changes": S.view = "prefs"; S.tab = "atualizacoes"; S.state = "update"; render(); break;
    case "openchat": toast("Abrindo a conversa no navegador…", "external"); break;
    case "openweb": toast("Abrindo agentes.chat…", "external"); break;
    case "prefs": { const upd = S.view === "tray" && S.state === "update"; S.view = "prefs"; S.state = upd ? "update" : ""; S.tab = upd ? "atualizacoes" : "geral"; resetFor("prefs"); render(); break; }
    case "quit": dialog(`<h2>Sair do agentes?</h2><p>Os agentes não conseguem usar este ${osWord()} com o app fechado. O que já está rodando termina e manda o resultado quando você abrir de novo.</p><div class="foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" data-close>Sair</button></div>`); break;
    case "allow": S.view = "ask"; S.state = "done"; S.notif = false; S.open = true; render(); toast(S.askFor === "all" ? "Liberada para todos os agentes" : "Liberada para o Bento"); break;
    case "deny": S.notif = false; S.open = false; render(); toast("Recusado. O Bento avisa no chat.", "x"); break;
    case "undoAsk": S.state = "ask"; S.notif = false; render(); break;
    case "opentray": S.notif = false; S.open = true; render(); break;
    case "closenotif": S.notif = false; render(); break;
    case "otherfolder": toast("Abre o seletor de pastas do sistema", "folder"); if (S.view === "welcome") { S.picks.add("notas"); render(); } break;
    case "signin": setStep("code"); break;
    case "addorg": S.view = "welcome"; setStep("org"); break;
    case "cancelorg": go("tray", "working"); break;
    case "leaveorg": { const o = d.org; dialog(`<h2>Sair da ${ORGS[o].name} neste ${osWord()}?</h2><p>Os agentes da ${ORGS[o].name} param de usar este ${osWord()} na hora. As pastas em <span class="path">${ORGS[o].dir}</span> ficam no disco. As outras organizações continuam.</p><div class="foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger solid" data-leaveok="${o}">Sair da ${ORGS[o].name}</button></div>`); break; }
    case "finish": go("tray", "idle"); toast("O agentes está na barra de menus"); break;
    case "addfolder": if (!S.folders.some((f) => f.id === "notas")) { S.folders.push({ id: "notas", org: S.orgs.includes(S.prefOrg) ? S.prefOrg : S.orgs[0], name: "Notas", path: "~/Documents/Notas", agents: [], fresh: true }); S.dropFor = "notas"; render(); toast("Escolha quais agentes usam Notas", "folder"); } break;
    case "disconnect": dialog(`<h2>Desconectar este ${osWord()}?</h2><p>Os agentes param de usá-lo na hora e o que estiver rodando é interrompido. Suas pastas e arquivos ficam. Para voltar, entre de novo.</p><div class="foot"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger solid" data-close>Desconectar</button></div>`); break;
    case "howcodex": toast("Abre o guia de instalação do Codex", "external"); break;
    case "checknow": toast(S.state === "update" ? "Versão " + MACHINE.next + " pronta para instalar" : "Você já está na versão mais nova", S.state === "update" ? "download" : "check"); break;
    case "diag": toast("Diagnóstico copiado, sem senhas nem arquivos"); break;
    case "defaults": Object.assign(S, { maxTasks: 3, taskMax: "4h", brainMax: 3, brainIdle: "10" }); render(); toast("Padrão de volta"); break;
    case "movefolder": toast("Abre o seletor de pastas do sistema", "folder"); break;
  }
});
document.addEventListener("input", (e) => { if (e.target.id === "nameIn") S.name = e.target.value; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("#layer").innerHTML) closeDialog(); else if (S.dropFor) { S.dropFor = null; render(); } else if (S.pauseMenu) { S.pauseMenu = false; render(); } } });
addEventListener("resize", () => { placePills(); placePop(); });
addEventListener("hashchange", () => { const th = new URLSearchParams(location.hash.slice(1)).get("theme"); if (th) document.documentElement.dataset.theme = th; readHash(); resetFor(S.view); render(); });

readHash(); resetFor(S.view);
if (S.view === "ask" && S.state === "done") S.notif = false;
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
