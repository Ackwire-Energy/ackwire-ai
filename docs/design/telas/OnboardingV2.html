<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Doto:ROND,wght@100,600&display=swap">
<style>
/*
  Prototype: onboarding v2. Seven steps on a left rail: Workspace → Contexto → Trazer seus agentes
  (OpenMausBot team file / GitHub link, OpenBot agents.yaml) → Agentes e chave → Computador
  (cloud VM or this computer, live pairing) → Time (link, bulk emails, domain) → Pronto.
  Agents come from the agent engine (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#fff;--sunken:#ebebe7;--line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 8px 20px -6px rgba(23,23,22,.12),0 0 0 1px var(--line);
  --sans:"Onest",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",monospace;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
/* The rail is the app's sidebar: its surface, the steps, and the sky only as a horizon rising from the bottom (no edge). */
.rail{position:sticky;top:0;height:100vh;overflow:hidden;padding:26px 18px;display:flex;flex-direction:column;gap:20px;background:var(--sunken);border-right:1px solid var(--line);isolation:isolate}
.rail canvas.sky{position:absolute;inset:auto 0 0 0;width:100%;height:46%;image-rendering:pixelated;pointer-events:none;z-index:-1}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:300;font-size:22px;letter-spacing:-.02em}
.guide{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.guide canvas{display:block;align-self:center}
.bubble{padding:11px 13px;border-radius:14px 14px 14px 4px;background:var(--raised);box-shadow:var(--e2);font-size:13px;line-height:1.45;color:var(--ink2)}
.bubble b{color:var(--ink);font-weight:600}
.themebar{position:fixed;top:14px;right:18px;z-index:5}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;position:relative}
.steps li button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:var(--muted);font-weight:500}
.steps li button[aria-current="step"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1);font-weight:600}
.steps .n{width:24px;height:24px;border-radius:8px 8px 8px 3px;display:grid;place-items:center;font-family:var(--dot);font-variation-settings:"ROND" 100;font-size:13px;font-weight:600;background:var(--plate);flex:none}
.steps li[data-done] .n{background:var(--ink);color:var(--bg)}
.brand i{font-style:normal;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:.62em;color:var(--muted)}
.ic img{width:26px;height:26px;border-radius:7px;display:block}
.steps .opt{margin-left:auto;font-size:11px;color:var(--faint)}
.main{padding:40px clamp(18px,5vw,64px) 120px;max-width:860px;width:100%}
.eyebrow{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,42px);letter-spacing:-.03em;line-height:1.08;margin:8px 0 8px}
.lead{color:var(--muted);max-width:62ch;margin-bottom:24px}
.card{background:var(--raised);border-radius:20px;box-shadow:var(--e1);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-weight:600;font-size:13px}
.help{color:var(--muted);font-size:12.5px}
input[type=text],input[type=email],textarea,select{font:inherit;color:var(--ink);background:var(--sunken);border:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;background:var(--raised);box-shadow:var(--e1);white-space:nowrap}
.btn:hover{box-shadow:var(--e2)}
.btn.primary{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)),var(--ink));box-shadow:0 6px 14px -6px rgba(0,0,0,.45)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.btn:focus-visible,.choice:focus-visible,.steps button:focus-visible{outline:2px solid #3d8bff;outline-offset:2px}
.foot{position:fixed;left:280px;right:0;bottom:0;display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px clamp(18px,5vw,64px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.foot .hint{margin-right:auto;color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;background:var(--raised);box-shadow:var(--e1);position:relative}
.choice[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.choice b{font-size:15px}
.choice span{color:var(--muted);font-size:13px}
.choice .tag{position:absolute;top:12px;right:12px}
.ic{width:38px;height:38px;border-radius:12px 12px 12px 4px;display:grid;place-items:center;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:4px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px;border-radius:18px;border:1.5px dashed var(--line2);text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{background:var(--plate)}
.found{display:flex;flex-direction:column;gap:2px}
.frow{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .t{flex:1;min-width:0}
.frow .d{color:var(--muted);font-size:12.5px}
.group-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 4px;display:flex;gap:8px;align-items:center}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--plate);color:var(--muted);font-size:13px}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.agentc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--raised);box-shadow:var(--e1)}
.agentc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.agentc .t{display:flex;flex-direction:column}
.agentc .d{color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:var(--plate)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1)}
.cmd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#111110;color:#e8e8e4;font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow-x:auto}
.cmd code{flex:1;white-space:nowrap}
.cmd .btn{background:#2a2a28;color:#efefec;box-shadow:none}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.machine{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--ok-soft);color:var(--ok)}
.machine b{color:var(--ink)}
.emails{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);min-height:46px;align-items:center}
.emails input{all:unset;flex:1;min-width:180px;padding:4px 6px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 4px;border-radius:999px;background:var(--raised);box-shadow:var(--e1);font-size:13px}
.pchip .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:linear-gradient(160deg,#e9e9e5,#d9d9d4);color:#2a2a28}
.pchip select{all:unset;cursor:pointer;font-size:12px;color:var(--muted);padding:0 4px}
.pchip button{all:unset;cursor:pointer;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.pchip.bad{box-shadow:0 0 0 1px #d0473c;color:#b4352b}
.switch{display:flex;gap:12px;align-items:flex-start}
.switch input{margin-top:3px}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox input{flex:1}
.done{display:flex;flex-direction:column;gap:18px}
.welcome{position:relative;overflow:hidden;border-radius:24px;min-height:220px;padding:24px;color:#04203f;isolation:isolate}
.welcome > canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
.welcome h2{font-family:var(--display);font-weight:300;font-size:30px;letter-spacing:-.02em}
.welcome p{color:rgba(4,32,63,.82);max-width:52ch;margin-top:6px}
.crew{display:flex;gap:10px;margin-top:16px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.summary .card{padding:14px}
.summary b{display:block;font-size:22px;font-family:var(--display);font-weight:300}
canvas.av{display:block;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:12px}
@media (max-width:820px){.shell{grid-template-columns:1fr}.rail{position:relative;height:auto;padding:16px;gap:12px}.guide{display:none}.steps{flex-direction:row;overflow-x:auto}.steps .t,.steps .opt{display:none}.foot{left:0}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><canvas class="av" id="brandMark" width="52" height="52" style="width:26px;height:26px"></canvas><span>agentes<i>.chat</i></span></div>
    <ol class="steps" id="steps"></ol>
    <div class="guide"><p class="bubble" id="bubble" role="status"></p><canvas id="guide"></canvas></div>
    <canvas class="sky" id="railSky"></canvas>
  </aside>
  <main class="main" id="main"></main>
  <div class="seg themebar" id="theme" role="group" aria-label="Tema"><button data-v="light">Claro</button><button data-v="dark">Escuro</button></div>
</div>
<div class="foot" id="foot"></div>

<script type="module">
import { drawAgent, idlePose, drawAccessory, ACCESSORY_REACH, AGENT_GRADIENTS } from "../../../packages/ui/src/agent/engine.js";

const STEPS = [
  { id: "workspace", t: "Workspace" },
  { id: "context", t: "Contexto" },
  { id: "import", t: "Trazer seus agentes", opt: true },
  { id: "agents", t: "Agentes e chave" },
  { id: "computer", t: "Computador", opt: true },
  { id: "team", t: "Time", opt: true },
  { id: "done", t: "Pronto" },
];
const PRESETS = [
  { id: "theo", name: "Theo", role: "PM", desc: "Organiza tarefas, resume conversas e cuida do fórum.", look: { color: "indigo", eyes: "round", accessory: "cap" } },
  { id: "ada", name: "Ada", role: "Dev", desc: "Programa em branches, revisa PRs e investiga bugs.", look: { color: "green", eyes: "wide", accessory: "headphones" } },
  { id: "lia", name: "Lia", role: "Pesquisa", desc: "Pesquisa mercado, concorrentes e feedback.", look: { color: "rose", eyes: "dots", accessory: "flower" } },
  { id: "atlas", name: "Atlas", role: "Ops", desc: "Vigia erros, filas e deploys.", look: { color: "amber", eyes: "round", accessory: "antenna" } },
];
/* What an OpenMausBot team file (Share team…) or an OpenBot agents.yaml would give us. */
const IMPORTS = {
  mausbot: {
    source: "OpenMausBot", file: "time-produto.md",
    agents: [
      { name: "Mira", role: "Growth", desc: "Instruções, foto e 3 skills", look: { color: "violet", eyes: "happy", accessory: "party" } },
      { name: "Dex", role: "Engenharia", desc: "Instruções e 2 skills", look: { color: "teal", eyes: "round", accessory: "headset" } },
      { name: "Bo", role: "Suporte", desc: "Instruções e foto", look: { color: "amber", eyes: "dots", accessory: "beanie" } },
    ],
    routines: ["Resumo diário às 9h (Mira)", "Triagem de bugs toda segunda (Dex)"],
    skills: ["seo-audit", "release-notes", "pr-review", "tone-of-voice", "faq-writer"],
    channels: ["#lançamentos (chat em grupo de Mira e Dex)"],
    apps: ["GitHub", "Notion", "Gmail"],
    left: "Histórico das conversas, memória, chaves e o modelo de cada bot não vêm no arquivo do time.",
  },
  openbot: {
    source: "OpenBot", file: "agents.yaml",
    agents: [
      { name: "Ledger", role: "Finanças", desc: "Prompt do sistema e responsabilidades", look: { color: "graphite", eyes: "wide", accessory: "hat" } },
      { name: "Scout", role: "Pesquisa", desc: "Prompt do sistema", look: { color: "sky", eyes: "round", accessory: "antenna" } },
    ],
    routines: ["Fechamento semanal (Ledger, a cada 7 dias)"],
    skills: [],
    channels: [],
    apps: ["Stripe", "Linear"],
    left: "Memória e conversas ficam no banco do OpenBot (sem exportação). Credenciais nunca saem; você conecta de novo aqui.",
  },
};

const S = {
  step: 0, done: new Set(),
  org: "Acme", tz: "America/Sao_Paulo", logo: false,
  context: "",
  importFrom: null, importState: "idle", importPick: {},
  presets: new Set(["ada"]), provider: "anthropic", key: "",
  computer: null, pairing: "idle",
  emails: [{ e: "marina@acme.com.br", role: "member" }, { e: "joao@acme.com.br", role: "admin" }], domain: true,
};
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const I = {
  check: '<svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  upload: '<svg class="i" viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 20h14"/></svg>',
  link: '<svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  cloud: '<svg class="i" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9Z"/></svg>',
  laptop: '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 2"/></svg>',
  info: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
};

/* ---------- Agents from the engine ---------- */
const live = [];
function avatar(look, size = 36, seed = Math.random() * 5) {
  const cv = document.createElement("canvas");
  cv.className = "av";
  const R = ACCESSORY_REACH, dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(size * (1 + R.left + R.right) * dpr);
  cv.height = Math.round(size * (1 + R.top + R.bottom) * dpr);
  cv.style.width = size * (1 + R.left + R.right) + "px";
  cv.style.height = size * (1 + R.top + R.bottom) + "px";
  cv.style.margin = `${-size * R.top}px ${-size * R.right}px ${-size * R.bottom}px ${-size * R.left}px`;
  live.push({ cv, look, size, seed });
  return cv;
}
function draw(t) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  for (let i = live.length - 1; i >= 0; i--) {
    const a = live[i];
    if (!a.cv.isConnected) { live.splice(i, 1); continue; }
    const g = a.cv.getContext("2d"), s = a.size * dpr, R = ACCESSORY_REACH;
    g.clearRect(0, 0, a.cv.width, a.cv.height);
    drawAgent(g, R.left * s, R.top * s, s, {
      color: a.look.color, eyes: a.look.eyes, cells: a.size <= 28 ? 8 : 16, pose: idlePose(t, a.seed, { every: 10 }),
      after: a.look.accessory ? (c, side, frame) => drawAccessory(c, side, a.look.accessory, frame, t) : undefined,
    });
  }
}
let last = 0;
(function loop(now) { if (now - last > 40) { last = now; draw(now / 1000); drawSkies(now / 1000); } requestAnimationFrame(loop); })(0);
drawAgent($("#brandMark").getContext("2d"), 0, 0, 52, { color: "sky", cells: 10 });

/* ---------- A little dithered sky (rail and the welcome) ---------- */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const SKY = ["#0a3f9c", "#0f56c4", "#2b74e6", "#4b93ff", "#78b4ff", "#a6cfff", "#cfe6ff", "#eef7ff"].map((h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; });
function sky(cv, t, field) {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const P = 4, W = Math.ceil(r.width / P), H = Math.ceil(r.height / P);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const g = cv.getContext("2d"), img = g.createImageData(W, H), n = SKY.length - 1;
  const bg = getComputedStyle(document.body).backgroundColor.match(/\d+/g).map(Number);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const f = field(x / W, y / H, t);
    const i = (y * W + x) * 4;
    if (f < 0) { img.data[i + 3] = 0; continue; }
    const k = Math.max(0, Math.min(n, f * n)), lo = Math.floor(k);
    const c = SKY[Math.min(n, lo + (k - lo > BAYER[(x & 3) + (y & 3) * 4] ? 1 : 0))];
    img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}
/* The rail's sky: light at the top (calm behind the steps), deep at the bottom, a light halo behind the guide; pixel agents rising. */
const sprites = Array.from({ length: 3 }, (_, i) => ({ x: i % 2 ? 0.78 + Math.random() * 0.1 : 0.04 + Math.random() * 0.1, y: 0.6 + Math.random() * 0.4, k: 1, v: 0.012 + Math.random() * 0.02, b: Math.random() * 5 }));
const SPRITE = [".XXXXXXX.", "XXXXXXXXX", "XXXXXXXXX", "XXXoXoXXX", "XXXoXoXXX", "XXXXXXXXX", "XXXXXXXXX", "XXXXXXXXX", "XXXXXXXX."];
function railSky(t) {
  const cv = $("#railSky"), r = cv.getBoundingClientRect(); if (!r.width) return;
  const P = 4, W = Math.ceil(r.width / P), H = Math.ceil(r.height / P);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const surface = getComputedStyle($(".rail")).backgroundColor.match(/\d+/g).slice(0, 3).map(Number);
  // Tones from the rail's surface into the sky (like the app's sidebar horizon).
  const sky = ["#a6cfff", "#78b4ff", "#4b93ff", "#2b74e6", "#0f56c4"].map((h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; });
  const tones = [surface, ...[0.18, 0.4, 0.65].map((k) => surface.map((v, i) => Math.round(v + (sky[0][i] - v) * k))), ...sky];
  const g = cv.getContext("2d"), img = g.createImageData(W, H), n = tones.length - 1;
  const p = 0.72 + 0.25 * (S.done.size / (STEPS.length - 1));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const u = x / W, v = y / H;
    const top = 1 - p * (0.82 + 0.18 * Math.sin(u * 4 + t * 0.5));
    const e = Math.max(0, Math.min(1, (v - top) / (1 - top)));
    const f = e * e * (3 - 2 * e) * 0.95;
    const kk = f * n, lo = Math.floor(kk);
    const c = tones[Math.min(n, lo + (kk - lo > BAYER[(x & 3) + (y & 3) * 4] ? 1 : 0))];
    const i = (y * W + x) * 4; img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
  }
  for (const sp of sprites) {
    sp.y -= sp.v * 0.04; if (sp.y < 0.5) { sp.y = 1.05; }
    const ox = Math.round(sp.x * W), oy = Math.round(sp.y * H), blink = (t + sp.b) % 4 < 0.12;
    for (let j = 0; j < 9; j++) for (let i2 = 0; i2 < 9; i2++) {
      const ch = SPRITE[j][i2]; if (ch === ".") continue;
      const X = ox + i2, Y = oy + j;
      if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
      const o = (Y * W + X) * 4, col = ch === "o" && !blink ? [255, 255, 255] : [4, 32, 63];
      img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2];
    }
  }
  g.putImageData(img, 0, 0);
}

function drawGuide(t) {
  const cv = $("#guide"), size = 84, R = ACCESSORY_REACH, dpr = Math.min(2, devicePixelRatio || 1);
  const W = Math.round(size * (1 + R.left + R.right) * dpr), H = Math.round(size * (1 + R.top + R.bottom) * dpr);
  if (cv.width !== W) { cv.width = W; cv.height = H; cv.style.width = W / dpr + "px"; cv.style.height = H / dpr + "px"; cv.style.marginTop = -size * R.top * 0.5 + "px"; cv.style.marginBottom = -size * R.bottom * 0.7 + "px"; }
  const g = cv.getContext("2d"), s = size * dpr, now = performance.now();
  g.clearRect(0, 0, W, H);
  const pose = now < GUIDE.typingUntil ? { writing: true, turn: [0.55, 0.1] } : idlePose(t, 0.7, { every: 12 });
  if (now >= GUIDE.typingUntil) pose.turn = [0.5 + 0.15 * Math.sin(t * 0.6), 0.08 + 0.06 * Math.sin(t * 0.9)];
  if (now < GUIDE.happyUntil) pose.expression = "happy";
  drawAgent(g, R.left * s, R.top * s, s, { color: GUIDE.look.color, eyes: GUIDE.look.eyes, cells: 16, pose,
    after: (c, side, frame) => drawAccessory(c, side, GUIDE.look.accessory, frame, t) });
}

  if ("next" in d) { GUIDE.happyUntil = performance.now() + 1600; S.done.add(S.step); if (S.step === 0) S.org = $("#org")?.value || S.org; if (S.step === 1) S.context = $("#ctx")?.value ?? ""; return go(S.step + 1); }
  if ("back" in d) return go(S.step - 1);
  if ("logo" in d) { S.logo = !S.logo; return render(); }
  if ("site" in d) { S.context = "A Acme faz software de gestão de estoque para varejo (lojas físicas e e-commerce). Atendemos em português. Valores: clareza com o cliente, entregas semanais."; return render(); }
  if (d.src) { S.importFrom = d.src; S.importState = "idle"; return render(); }
  if ("file" in d) { S.importState = "reading"; render(); setTimeout(() => { S.importState = "ready"; render(); }, 900); return; }
  if (d.preset) { S.presets.has(d.preset) ? S.presets.delete(d.preset) : S.presets.add(d.preset); return render(); }
  if (d.prov) { S.provider = d.prov; return render(); }
  if (d.comp) { S.computer = d.comp; S.pairing = "idle"; return render(); }
  if ("paired" in d) { S.pairing = "connected"; return render(); }
  if ("copy" in d) { el.textContent = "Copiado"; setTimeout(() => (el.textContent = "Copiar"), 1400); return; }
  if (d.rm != null) { S.emails.splice(Number(d.rm), 1); return render(); }
  if (el.closest("#theme") && d.v) { document.documentElement.dataset.theme = d.v; [...el.parentElement.children].forEach((b) => b.setAttribute("aria-pressed", String(b === el))); }
});

// Dark by default, like the landing.
const dark = true;
document.documentElement.dataset.theme = dark ? "dark" : "light";
document.querySelector(`#theme [data-v="${dark ? "dark" : "light"}"]`).setAttribute("aria-pressed", "true");
// Direct links: #import (or a step id), #import:mausbot to land on a read file.
const h = location.hash.slice(1).split(":");
const at = STEPS.findIndex((s) => s.id === h[0]);
if (at >= 0) { for (let i = 0; i < at; i++) S.done.add(i); S.step = at; }
if (h[1] && IMPORTS[h[1]]) { S.importFrom = h[1]; S.importState = "ready"; }
if (h[1] === "cloud" || h[1] === "mine") S.computer = h[1];
render();
</script>
