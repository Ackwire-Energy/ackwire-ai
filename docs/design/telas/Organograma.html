<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipe de agentes</title>
<!-- The app's own fonts, tokens and components. -->
<link rel="stylesheet" href="../../../apps/web/node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="../../../apps/web/src/fonts.css">

<style>
/*
  Prototype (Organograma): "who does what" among the org's agents, for people.
  Same data the agents get from find_agent: name, @, role, "chame para", what it can do (human groups),
  responsible person, live status. Grouped by responsible person (agents.ownerUserId); no agent hierarchy.
  Alive: recent consultations between agents (one agent asking another) light up their line.
  Approved direction: Céu (round 1 also had Mapa and Diretório).
  Deep links: #theme=light|dark&a=<agent>.
*/
:root{
  --font-sans:"Onest Variable",Onest,"Segoe UI",system-ui,sans-serif;
  --font-display:"Funnel Display",var(--font-sans);
}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
.ac-icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}

/* ---------- prototype chrome (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-muted);background:var(--bg);position:sticky;top:0;z-index:50}
.proto b{color:var(--ink)}
.proto .grow{flex:1}

/* ---------- page ---------- */
.page{max-width:1240px;margin:0 auto;padding:24px 24px 48px;display:flex;flex-direction:column;gap:20px}
.hd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hd .tx{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.hd h1{font-family:var(--font-display);font-weight:300;font-size:40px;line-height:44px;letter-spacing:-.03em}
.hd p{color:var(--ink-muted);font-size:14px;line-height:20px;max-width:60ch}
.hd .acts{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--control-h-md);padding:0 16px;border-radius:var(--control-r-md);border:1px solid var(--line-strong);background:var(--raised);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .25s var(--spring),background-color .15s,box-shadow .15s}
.btn:hover{background:var(--surface)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.btn.sm{height:var(--control-h-sm);padding:0 12px;border-radius:var(--control-r-sm);font-size:13px;gap:6px}
.btn.sm .ac-icon{width:16px;height:16px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--action) 88%,#fff),var(--action));border-color:var(--action);color:var(--on-action);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.12)}
.btn.primary:hover{background:var(--action)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.icon{width:var(--control-h-md);padding:0}
.btn.sm.icon{width:var(--control-h-sm)}

.card{background:var(--raised);border-radius:var(--radius-section);box-shadow:var(--e1),var(--top)}

/* tiles: agents (Céu frame via engine) and people (neutral) */
.av{position:relative;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:30%;overflow:hidden}
.av canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.av::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.55);pointer-events:none}
[data-theme=dark] .av::after{box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.07)}
.pp{position:relative;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:30%;background:linear-gradient(170deg,var(--sunken),color-mix(in srgb,var(--sunken) 70%,var(--ink) 12%));color:var(--ink);font-weight:650;font-size:calc(var(--s) * .4)}
.pp::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--line);pointer-events:none}

/* chips: neutral, with an icon */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--sunken);font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink)}
.chip .ac-icon{width:14px;height:14px;color:var(--ink-muted)}
.chip.quiet{background:transparent;color:var(--ink-muted);padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-muted);white-space:nowrap}
.status .ac-icon{width:14px;height:14px}
.status.run{color:var(--ink)}
canvas.spin{width:14px;height:14px;image-rendering:pixelated;flex:none}
.handle{color:var(--ink-muted);font-weight:500}
.muted{color:var(--ink-muted)}
.eyebrow{font-size:12px;font-weight:600;color:var(--ink-muted);letter-spacing:.01em}

/* the strip of what agents asked each other */
.feed{display:flex;flex-direction:column}
.feed-hd{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.feed-hd h2{font-size:14px;font-weight:650;flex:1}
.fi{display:flex;gap:10px;padding:10px 16px;align-items:flex-start;border-radius:12px;transition:background-color .6s}
.fi.new{background:var(--sunken)}
.fi .pair{display:flex;align-items:center;flex:none;padding-top:1px}
.fi .pair .av + .ac-icon{width:12px;height:12px;color:var(--ink-muted);margin:0 2px}
.fi .tx{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:18px}
.fi .q{color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fi time{font-size:12px;color:var(--ink-muted)}
.fi.live time{color:var(--ink);font-weight:600}

/* ---------- details (side panel, expanded row, sky card) ---------- */
.det{display:flex;flex-direction:column;gap:18px}
.det-hd{display:flex;gap:14px;align-items:center}
.det-hd .tx{min-width:0;display:flex;flex-direction:column;gap:4px}
.det-hd h3{font-family:var(--font-display);font-weight:300;font-size:30px;line-height:34px;letter-spacing:-.02em}
.det-sec{display:flex;flex-direction:column;gap:8px}
.det-sec .call{font-size:15px;line-height:22px}
.owner{display:flex;align-items:center;gap:10px}
.owner .tx{display:flex;flex-direction:column;font-size:13px;line-height:18px}
.det-acts{display:flex;gap:8px;flex-wrap:wrap}
.mini{display:flex;flex-direction:column;gap:6px}
.mini-i{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px}
.mini-i .ac-icon{width:14px;height:14px;margin-top:2px;color:var(--ink-muted)}
.mini-i span{min-width:0}

.v{display:none}
[data-view=ceu] .v-ceu{display:flex}

/* ---------- C: Céu ---------- */
.v-ceu{flex-direction:column;gap:16px}
.skybox{position:relative;height:620px;border-radius:var(--radius-section);overflow:hidden;box-shadow:var(--e1),var(--top)}
.skybox>canvas{position:absolute;inset:0;width:100%;height:100%}
.skybox>canvas.sky{image-rendering:pixelated}
.skybox>canvas.ag{cursor:pointer}
.skylabel{position:absolute;transform:translate(-50%,0);display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 4px;border-radius:10px;background:color-mix(in srgb,var(--raised) 90%,transparent);box-shadow:0 1px 2px rgba(0,0,0,.12);font-size:12px;font-weight:650;pointer-events:none;white-space:nowrap;color:var(--ink)}
.skylabel .pp{--s:20px;font-size:10px}
.skytag{position:absolute;transform:translate(-50%,0);display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:7px;background:color-mix(in srgb,var(--raised) 82%,transparent);font-size:11px;font-weight:650;color:var(--ink);pointer-events:none;white-space:nowrap;box-shadow:0 1px 2px rgba(0,20,60,.18)}
.skytag canvas.spin{width:10px;height:10px}
.skycard{position:absolute;box-sizing:border-box;left:16px;bottom:16px;width:360px;max-width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;padding:18px;border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top);display:none;z-index:2;transform:translateZ(0)}
.skycard .det{gap:14px}
.skycard .det-hd h3{font-size:26px;line-height:30px}
.skycard[data-on]{display:block;animation:rin .3s var(--out)}
.skycard .x{position:absolute;top:10px;right:10px}
.skyhint{position:absolute;right:16px;top:16px;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:10px;background:color-mix(in srgb,var(--raised) 90%,transparent);font-size:12px;font-weight:600;color:var(--ink)}
.skyhint .ac-icon{width:14px;height:14px}
.ceu-feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px}
.ceu-feed .fi{border-radius:14px}

@media (prefers-reduced-motion:reduce){
  .skycard[data-on]{animation:none}
}
@media (max-width:1000px){
  .ceu-feed{grid-template-columns:1fr}
}
@media (max-width:720px){
  .page{padding:16px 16px 40px;gap:16px}
  .hd h1{font-size:32px;line-height:36px}
  .hd .acts .btn span.l{display:none}
  .skybox{height:600px}
  .skycard{left:8px;right:8px;bottom:8px;width:auto;max-width:none}
  .skyhint{top:auto;bottom:12px;right:12px}
}
</style>
</head>
<body>
<div class="proto" role="region" aria-label="Controles do protótipo (não é produto)">
  <b>Equipe de agentes · Céu (aprovado)</b>
  <span class="grow"></span>
  <div class="ac-seg ac-seg--sm" id="theme" role="radiogroup" aria-label="Tema"><span class="ac-seg__pill" aria-hidden="true"></span><button class="ac-seg__item" role="radio" data-v="light">Claro</button><button class="ac-seg__item" role="radio" data-v="dark">Escuro</button></div>
</div>

<main class="page">
  <header class="hd">
    <div class="tx">
      <h1>Equipe</h1>
      <p id="sub"></p>
    </div>
    <div class="acts">
      <button class="btn"><span data-icon="share"></span><span class="l">Exportar organograma</span></button>
      <button class="btn primary"><span data-icon="plus"></span><span class="l">Novo agente</span></button>
    </div>
  </header>

  <section class="v v-ceu" aria-label="A equipe no céu">
    <div class="skybox" id="skybox">
      <canvas class="sky" id="skyCv"></canvas>
      <canvas class="ag" id="agCv" role="img" aria-label="Agentes agrupados por pessoa responsável; toque num agente para ver detalhes"></canvas>
      <div id="skyLabels"></div>
      <span class="skyhint"><span data-icon="pulse"></span><span id="skyHint">Toque num agente</span></span>
      <div class="skycard" id="skycard" role="dialog" aria-label="Detalhes do agente"></div>
    </div>
    <div class="card"><div class="feed-hd"><span data-icon="pulse"></span><h2>Conversas entre agentes</h2><span class="muted" style="font-size:12px">últimas 24 h</span></div><div class="ceu-feed" id="feedC"></div></div>
  </section>
</main>

<script type="module">
import { drawAgent, idlePose, drawAccessory, mixHex, bodyTones, AGENT_GRADIENTS } from "../../../packages/ui/src/agent/engine.js";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const root = document.documentElement;
const dark = () => root.dataset.theme === "dark";

/* ---------- icons (our set) ---------- */
const ICONS = {
  plus: '<path d="M10 4.5v11M4.5 10h11"/>',
  search: '<circle cx="8.8" cy="8.8" r="5.3"/><path d="m12.8 12.8 4.2 4.2"/>',

  ask: '<path d="M4 4.5h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H9l-4 3v-3H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z"/><path d="M8.3 8.2a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.5-.7 1v.3M10 12.6h.01"/>',
  globe: '<circle cx="10" cy="10" r="7"/><path d="M3 10h14M10 3a10.5 10.5 0 0 1 0 14M10 3a10.5 10.5 0 0 0 0 14"/>',
};
const icon = (n) => `<svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true">${ICONS[n] || ""}</svg>`;
const paint = (r = document) => { for (const el of $$("[data-icon]", r)) el.outerHTML = icon(el.dataset.icon); };

/* ---------- the org (fake data, pt-BR) ---------- */
const PEOPLE = {
  walter: { name: "Walter", area: "Produto" },
  marina: { name: "Marina", area: "Marketing" },
  rafael: { name: "Rafael", area: "Engenharia" },
  clara: { name: "Clara", area: "Financeiro" },
};
// What it can do: human groups (from the agent's permissions), each with its icon.
const CAN = {
  arquivos: ["Arquivos", "drive"], github: ["GitHub", "code"], agenda: ["Agenda", "calendar"], rotinas: ["Rotinas", "routines"],
  issues: ["Issues", "issues"], wiki: ["Wiki", "book"], computador: ["Computador", "laptop"], email: ["Email", "mail"],
  planilhas: ["Planilhas", "table"], erros: ["Erros em produção", "alert"], intercom: ["Atendimento", "chat"], forum: ["Fórum", "forum"], web: ["Pesquisa na web", "globe"],
};
const A = {

    call: "Campanhas, posts para redes sociais e emails de lançamento.", can: ["arquivos", "agenda", "rotinas", "web"], tags: "marketing campanha post instagram linkedin email newsletter lançamento anúncio" },

    call: "Artigos do blog, SEO e revisão de qualquer texto antes de publicar.", can: ["arquivos", "wiki", "web"], tags: "blog artigo seo texto revisão conteúdo google" },

    call: "Bugs, pull requests e dúvidas sobre como o código funciona.", can: ["github", "computador", "issues", "arquivos"], tags: "bug código pull request pr app login erro programação feature",

    call: "Métricas, painéis e qualquer número do produto ou das vendas.", can: ["planilhas", "arquivos", "rotinas"], tags: "métricas números dados painel dashboard vendas receita taxa relatório" },

const IDS = Object.keys(A);
// Recent consultations: who asked whom, when, what.
let ASKS = [
  { from: "dev", to: "atlas", min: 10, q: "Como o staging é publicado depois do merge?", a: "Pelo fluxo automático da main; leva uns 6 minutos." },
  { from: "theo", to: "nina", min: 25, q: "Qual foi a taxa de abertura do email de setembro?", a: "41%, 6 pontos acima de agosto." },
  { from: "sol", to: "dev", min: 64, q: "O erro “sessão expirada” no app já tem correção?", a: "Sim, entra na versão 2.4 hoje." },
  { from: "ada", to: "sol", min: 130, q: "Quais as 3 reclamações mais comuns desta semana?", a: "Login, exportar PDF e lentidão no celular." },
  { from: "cora", to: "nina", min: 60 * 20, q: "Quanto gastamos com servidores em setembro?", a: "R$ 4.380, 12% a menos que agosto." },
  { from: "lia", to: "theo", min: 60 * 23, q: "Qual o tom da campanha de outubro?", a: "Leve, com foco em times pequenos." },
];
const LIVE_ASKS = [
  { from: "ada", to: "atlas", q: "A versão 2.4 sai hoje ou amanhã?", a: "Hoje à tarde, se o staging passar." },
  { from: "theo", to: "lia", q: "Pode revisar o texto do post de lançamento?", a: "Revisado; mudei o título e duas frases." },
  { from: "nina", to: "dev", q: "O evento de cadastro está sendo enviado no app novo?", a: "Está, desde ontem às 18h." },
  { from: "sol", to: "atlas", q: "Teve instabilidade no servidor agora há pouco?", a: "Sim, 2 minutos às 14h10; já normalizou." },
  { from: "cora", to: "ada", q: "Quais assinaturas de ferramentas o time ainda usa?", a: "Sete; duas sem uso há 60 dias." },

let liveI = 0;

const ago = (m) => m < 1 ? "agora" : m < 60 ? `há ${m} min` : m < 60 * 24 ? `há ${Math.round(m / 60)} h` : "ontem";
const byOwner = () => Object.keys(PEOPLE).map((p) => [p, IDS.filter((id) => A[id].owner === p)]);

/* ---------- agents drawn by the engine, in the Céu frame ---------- */
const live = [];
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const skyCache = new Map();
function tileSky(color, px, dk) {
  const key = `${color}|${px}|${dk}`;
  if (skyCache.has(key)) return skyCache.get(key);

  const a = dk ? mixHex(dp, base, .78) : mixHex(lt, base, .86), b = dk ? mixHex(dp, base, .55) : mixHex(lt, base, .62);
  const c = document.createElement("canvas"); c.width = c.height = px;
  const g = c.getContext("2d"), n = Math.max(8, Math.round(px / 4)), cell = px / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {

}
const seedOf = (id) => [...id].reduce((s, c) => s + c.charCodeAt(0), 0) % 7;
const av = (id, size) => `<span class="avs" data-a="${id}" data-s="${size}"></span>`;
const pp = (p, size) => `<span class="pp" style="--s:${size}px" role="img" aria-label="${PEOPLE[p].name}">${PEOPLE[p].name[0]}</span>`;
function mount(r = document) {
  for (const el of $$(".avs", r)) {
    const id = el.dataset.a, size = +el.dataset.s, a = A[id];
    const w = document.createElement("span");
    w.className = "av"; w.style.setProperty("--s", size + "px");
    w.setAttribute("role", "img"); w.setAttribute("aria-label", `${a.name}, agente`);

    cv.dataset.c = el.dataset.c; cv.setAttribute("aria-hidden", "true"); el.replaceWith(cv); spins.push(cv);
  }
}
function drawTiles(t) {
  const dk = dark();
  for (let i = live.length - 1; i >= 0; i--) {
    const it = live[i];
    if (!it.cv.isConnected) { live.splice(i, 1); continue; }
    const a = A[it.id], g = it.cv.getContext("2d"), s = it.cv.width;
    g.clearRect(0, 0, s, s); g.imageSmoothingEnabled = false;

    drawAgent(g, (s - inner) / 2, s - inner - s * (acc ? .1 : .14), inner, {
      color: a.color, eyes: a.eyes, cells: it.size <= 32 ? 12 : undefined, pose,

}
/* the 3×3 pixel orbit, in the agent's own tones */
const spins = [];
const RING = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
let head = 0;
function drawSpins() {
  for (let i = spins.length - 1; i >= 0; i--) {
    const cv = spins[i];

    const tones = bodyTones(cv.dataset.c, dark()), g = cv.getContext("2d");
    g.clearRect(0, 0, 3, 3);
    RING.forEach(([x, y], k) => {
      const d = Math.min(3, ((head - k) % 8 + 8) % 8);
      g.globalAlpha = [1, .7, .45, .2][d];
      g.fillStyle = d === 0 ? tones[3] : tones[1];

}
const statusHTML = (id) => A[id].run
  ? `<span class="status run"><span class="spinx" data-c="${A[id].color}"></span>Trabalhando agora</span>`
  : `<span class="status">${icon("moon")}Livre</span>`;
const canChips = (id) => `<div class="chips">${A[id].can.map((c) => `<span class="chip">${icon(CAN[c][1])}${CAN[c][0]}</span>`).join("")}</div>`;

/* ---------- shared details ---------- */
const asksOf = (id) => ASKS.filter((x) => x.from === id || x.to === id).slice(0, 3);
function detailsHTML(id, { compact = false, brief = false } = {}) {
  const a = A[id], o = PEOPLE[a.owner], asks = brief ? [] : asksOf(id);
  return `<div class="det">
    ${compact ? "" : `<div class="det-hd">${av(id, 64)}<div class="tx"><h3>${a.name}</h3><span class="muted">@${a.handle} · ${a.role}${brief ? ` · de ${o.name}` : ""}</span>${statusHTML(id)}</div></div>`}
    ${a.run && !compact ? `<div class="mini-i">${icon("pulse")}<span>${a.run}</span></div>` : ""}
    <div class="det-sec"><span class="eyebrow">Chame para</span><p class="call">${a.call}</p></div>
    <div class="det-sec"><span class="eyebrow">O que pode fazer</span>${canChips(id)}</div>
    ${brief ? "" : `<div class="det-sec"><span class="eyebrow">Responsável</span><div class="owner">${pp(a.owner, 32)}<div class="tx"><b>${o.name}</b><span class="muted">${o.area}</span></div></div></div>`}
    ${asks.length ? `<div class="det-sec"><span class="eyebrow">Conversou com</span><div class="mini">${asks.map((x) => {
      const other = x.from === id ? x.to : x.from, verb = x.from === id ? `Perguntou a ${A[other].name}` : `${A[other].name} perguntou`;
      return `<div class="mini-i">${icon("ask")}<span><b>${verb}</b> · <span class="muted">${ago(x.min)}</span><br><span class="muted">${x.q}</span></span></div>`;
    }).join("")}</div></div>` : ""}
    <div class="det-acts"><button class="btn primary sm">${icon("chat")}Conversar</button><button class="btn sm">${icon("edit")}Editar</button></div>
  </div>`;
}
function feedHTML(limit = 5) {
  return ASKS.slice(0, limit).map((x, i) => `<div class="fi${x.min < 1 ? " live" : ""}${x.fresh ? " new" : ""}">
    <span class="pair">${av(x.from, 24)}${icon("arrowRight")}${av(x.to, 24)}</span>
    <span class="tx"><span><b>${A[x.from].name}</b> perguntou a <b>${A[x.to].name}</b> · <time>${ago(x.min)}</time></span><span class="q">${x.q}</span></span>
  </div>`).join("");
}

/* ---------- hot lines: a consultation lights its pair for a few seconds ---------- */
const hotUntil = new Map();
const hotPairs = []; // {from,to,t0}
function pulse() {
  const s = LIVE_ASKS[liveI++ % LIVE_ASKS.length];
  for (const x of ASKS) x.fresh = false;
  ASKS.forEach((x) => (x.min += 1));
  ASKS.unshift({ ...s, min: 0, fresh: true });
  ASKS = ASKS.slice(0, 8);
  const now = performance.now();
  hotUntil.set(s.from, now + 3200); hotUntil.set(s.to, now + 3200);
  hotPairs.push({ from: s.from, to: s.to, t0: now });
  renderFeeds();
  $("#skyHint").textContent = `${A[s.from].name} perguntou a ${A[s.to].name}`;
}

/* ---------- C: Céu ---------- */
const SKY_TONES = ["#0a3f9c", "#0f56c4", "#2b74e6", "#4b93ff", "#78b4ff", "#a6cfff", "#cfe6ff", "#eef7ff"];
const PX = 4;
let skySel = null, spots = [];
const u32 = (h) => { const n = parseInt(h.slice(1, 7), 16); return ((255 << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | (n >> 16)) >>> 0; };
const hash2 = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
function layoutSky() {
  const box = $("#skybox"), W = box.clientWidth, H = box.clientHeight, narrow = W < 640;
  const x0 = skySel && !narrow ? (16 + 360 + 40) / W : 0, fit = (u) => x0 + (u - .06) / .88 * (1 - x0 - .04);
  const owners = byOwner();
  // clusters: 4 across on wide screens, 2×2 on phones
  const centers = narrow
    ? [[.27, .34], [.73, .3], [.3, .76], [.72, .72]]
    : [[.14, .36], [.38, .26], [.62, .42], [.86, .3]].map(([u, v]) => [x0 ? fit(u) : u, v]);
  const prev = new Map(spots.map((s) => [s.id, s]));
  spots = []; let labels = "";
  owners.forEach(([p, ids], i) => {
    const [cx, cy] = centers[i], n = ids.length, R = narrow ? 52 : 70;
    labels += `<span class="skylabel" data-cx="${cx * W}" style="left:${cx * W}px;top:${cy * H - (n > 1 ? R * .7 : 0) - 70}px">${pp(p, 20)}${PEOPLE[p].name}</span>`;
    ids.forEach((id, k) => {
      const ang = n === 1 ? 0 : (-Math.PI / 2) + (k / n) * Math.PI * 2 + i;
      const r = n === 1 ? 0 : R;
      const tx = cx * W + Math.cos(ang) * r, ty = cy * H + Math.sin(ang) * r * .7, old = prev.get(id);
      spots.push({ id, tx, ty, x: old ? old.x : tx, y: old ? old.y : ty, ph: old ? old.ph : Math.random() * 6 });
      labels += `<span class="skytag" data-tag="${id}"></span>`;
    });
  });
  $("#skyLabels").innerHTML = labels;
  mount($("#skyLabels"));
}
const skyState = { w: 0, h: 0 };
function drawSky(t) {
  const cv = $("#skyCv"), box = $("#skybox");
  if (root.dataset.view !== "ceu" || !box.clientWidth) return;
  const w = Math.ceil(box.clientWidth / PX), h = Math.ceil(box.clientHeight / PX);
  if (w !== skyState.w || h !== skyState.h) { skyState.w = w; skyState.h = h; cv.width = w; cv.height = h; skyState.ctx = cv.getContext("2d"); skyState.img = skyState.ctx.createImageData(w, h); skyState.buf = new Uint32Array(skyState.img.data.buffer); }
  const dk = dark();
  const tones = dk ? ["#04112b", "#071c45", "#0a2b66", "#0e3d8c", "#1452b0", "#2b74e6", "#4b93ff", "#78b4ff"] : SKY_TONES;
  const pal = tones.map(u32), L = pal.length - 1, buf = skyState.buf;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = y / h, u = x / w;
    let f = dk ? .15 + v * .35 : .25 + v * .55; // lighter toward the horizon
    f += .08 * Math.sin(u * 6 + t * .15) * Math.sin(v * 4 - t * .1);
    // soft glow under each cluster
    for (const s of spots) { const dx = (x * PX - s.x) / 160, dy = (y * PX - s.y) / 120; f += .16 * Math.exp(-(dx * dx + dy * dy)); }

    const s2 = f * L, b = s2 | 0, idx = s2 - b > (BAYER[((y & 3) << 2) | (x & 3)] + .5) / 16 ? b + 1 : b;
    buf[y * w + x] = pal[idx > L ? L : idx];
  }
  // consultation lines: pixel lines between agents; recent ones faint, live ones bright with a traveling pixel
  const now = performance.now(), pos = (id) => spots.find((s) => s.id === id);
  const plot = (x0, y0, x1, y1, col, dashed, head) => {
    x0 = Math.round(x0 / PX); y0 = Math.round(y0 / PX); x1 = Math.round(x1 / PX); y1 = Math.round(y1 / PX);

      const hx = Math.round(x0 + (x1 - x0) * head), hy = Math.round(y0 + (y1 - y0) * head);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const X = hx + dx, Y = hy + dy; if (X >= 0 && Y >= 0 && X < w && Y < h) buf[Y * w + X] = u32("#ffffff"); }

    const a = pos(x.from), b = pos(x.to); if (!a || !b) continue;

  }

}
function drawSkyAgents(t) {
  const cv = $("#agCv"), box = $("#skybox");
  if (root.dataset.view !== "ceu" || !box.clientWidth) return;
  const dpr = Math.min(2, devicePixelRatio || 1), W = Math.round(box.clientWidth * dpr), H = Math.round(box.clientHeight * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const g = cv.getContext("2d"); g.clearRect(0, 0, W, H);
  const size = (innerWidth <= 720 ? 40 : 48) * dpr, now = performance.now();
  for (const s of spots) {
    const k = REDUCED ? 1 : .14; s.x += (s.tx - s.x) * k; s.y += (s.ty - s.y) * k;
    const a = A[s.id], hot = hotUntil.get(s.id) > now, run = !!a.run || hot;
    const bob = REDUCED ? 0 : Math.sin(t * 1.2 + s.ph) * 2 * dpr;
    const x = s.x * dpr - size / 2, y = s.y * dpr - size / 2 + bob;

    if (REDUCED) pose = {};

    else pose = idlePose(t, seedOf(s.id) + s.ph, { every: 10, expressions: ["happy", "wink"] });
    drawAgent(g, x, y, size, { color: a.color, eyes: a.eyes, cells: 12, pose,
      after: a.acc ? (gg, side, frame) => drawAccessory(gg, side, a.acc, frame, t, run) : undefined });
    const tag = $(`.skytag[data-tag="${s.id}"]`);
    if (tag) { tag.style.left = s.x + "px"; tag.style.top = (s.y + size / dpr / 2 + 2 + bob / dpr) + "px"; const want = run ? "run" : "idle"; if (tag.dataset.st !== want) { tag.dataset.st = want; tag.innerHTML = run ? `<span class="spinx" data-c="${a.color}"></span>${a.name}` : a.name; mount(tag); } }
  }
}
function renderSkyCard() {
  const card = $("#skycard");
  if (!skySel) { card.removeAttribute("data-on"); card.innerHTML = ""; return; }
  card.setAttribute("data-on", "");
  card.innerHTML = `<button class="btn ghost sm icon x" data-close aria-label="Fechar">${icon("close")}</button>${detailsHTML(skySel, { brief: true })}`;
  mount(card);
}
$("#agCv").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = spots.find((s) => Math.hypot(s.x - x, s.y - y) < 30);
  skySel = hit ? (skySel === hit.id ? null : hit.id) : null;
  renderSkyCard(); layoutSky();
});
$("#agCv").addEventListener("mousemove", (e) => {
  const r = e.currentTarget.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  e.currentTarget.style.cursor = spots.some((s) => Math.hypot(s.x - x, s.y - y) < 30) ? "pointer" : "default";
});

/* ---------- feeds, header, events ---------- */
function renderFeeds() {
  $("#feedC").innerHTML = feedHTML(6);
  mount($("#feedC"));
  const working = IDS.filter((id) => A[id].run).length;
  $("#sub").textContent = `${IDS.length} agentes, agrupados por quem cuida de cada um. ${working} trabalhando agora.`;
}
function placePills(r = document) {
  for (const s of $$(".ac-seg", r)) {
    const on = $(".ac-seg__item[data-on]", s), pill = $(".ac-seg__pill", s);
    if (on && pill) { pill.style.setProperty("--x", `${on.offsetLeft}px`); pill.style.setProperty("--w", `${on.offsetWidth}px`); }
  }
}
function setSeg(id, v) { for (const b of $$(`#${id} .ac-seg__item`)) { const on = b.dataset.v === v; b.toggleAttribute("data-on", on); b.setAttribute("aria-checked", String(on)); } placePills($(`#${id}`)); }
function syncHash() { location.hash = `theme=${root.dataset.theme}${skySel ? `&a=${skySel}` : ""}`; }
function setTheme(v) { root.dataset.theme = v; setSeg("theme", v); syncHash(); }

document.addEventListener("click", (e) => {
  const seg = e.target.closest(".proto .ac-seg__item");
  if (seg) { setTheme(seg.dataset.v); return; }
  if (e.target.closest("#skycard [data-close]")) { skySel = null; renderSkyCard(); layoutSky(); return; }
});
addEventListener("resize", layoutSky);

/* ---------- boot ---------- */
paint();
{ const h = new URLSearchParams(location.hash.slice(1)); if (h.get("a") && A[h.get("a")]) skySel = h.get("a"); }
renderFeeds(); renderSkyCard();
setSeg("theme", root.dataset.theme); requestAnimationFrame(layoutSky);
document.fonts?.ready.then(() => placePills());

let lastT = 0, lastS = 0, lastO = 0;
(function loop(now) {
  if (now - lastT > 40) { lastT = now; drawTiles(REDUCED ? 2 : now / 1000); drawSkyAgents(REDUCED ? 2 : now / 1000); }
  if (now - lastS > 90) { lastS = now; drawSky(REDUCED ? 0 : now / 1000); }
  if (now - lastO > 110 && !REDUCED) { lastO = now; head = (head + 1) % 8; drawSpins(); }
  requestAnimationFrame(loop);
})(0);
if (REDUCED) drawSpins();
setTimeout(function tick() { pulse(); setTimeout(tick, 6500); }, 2500);
</script>
