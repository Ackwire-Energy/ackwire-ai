<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Issues</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/agentes/tokens.css">
<link rel="stylesheet" href="ds/agentes/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; display: flex; flex-wrap: wrap; min-height: 900px; height: 100vh; background: var(--surface); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 22px">
  <dc-import name="Sidebar" active="issues" hint-size="272px,100%" style="flex: 0 0 272px"></dc-import>

  <main style="flex: 999 1 560px; min-width: 0; height: 100%; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 20px 24px 12px">
      <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.015em">Issues</h1>
        <span style="font-size: 13px; color: var(--ink-muted)">{{openCount}} abertas · {{agentCount}} com agentes</span>
      </div>
      <label for="iss-q" style="position: relative; display: flex; flex: 0 1 260px">
        <svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true" style="position: absolute; left: 10px; top: 8px; color: var(--ink-muted)"><circle cx="8.8" cy="8.8" r="5.3"></circle><path d="m12.8 12.8 4.2 4.2"></path></svg>
        <input id="iss-q" class="ac-input" placeholder="Buscar issues" aria-label="Buscar issues" value="{{q}}" onChange="{{onQ}}" style="padding-left: 36px">
      </label>
      <div role="group" aria-label="Visualização" style="display: flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden">
        <button type="button" onClick="{{showBoard}}" aria-pressed="{{boardPressed}}" style="{{boardBtn}}">Quadro</button>
        <button type="button" onClick="{{showList}}" aria-pressed="{{listPressed}}" style="{{listBtn}}">Lista</button>
      </div>
      <button class="ac-btn ac-btn--primary" type="button" onClick="{{openNew}}">
        <svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"></path></svg>Nova issue
      </button>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 12px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isBoard}}" hint-placeholder-val="{{true}}">
      <div style="flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(4, minmax(260px, 1fr)); gap: 12px; padding: 4px 24px 24px">
        <sc-for list="{{columns}}" as="col" hint-placeholder-count="4">
          <section aria-label="{{col.label}}" style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
            <div style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 8px">
              <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-muted)">{{col.label}}</span>
              <span style="font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums">{{col.count}}</span>
            </div>
            <sc-for list="{{col.items}}" as="i" hint-placeholder-count="2">
              <a href="Issue.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none">
                <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums">#{{i.number}}<sc-if value="{{i.hasPr}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 4px"><svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true" style="width: 14px; height: 14px"><path d="M6 3v14M14 9v8M6 7a3 3 0 0 0 3 3h2a3 3 0 0 1 3 3"></path></svg>PR #{{i.pr}}</span></sc-if><span style="margin-left: auto">{{i.due}}</span></span>
                <span style="font-weight: 600; line-height: 20px">{{i.title}}</span>
                <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
                  <sc-if value="{{i.isHigh}}" hint-placeholder-val="{{false}}"><span class="ac-chip" style="margin-left: 0"><svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5"></path></svg>Alta</span></sc-if>
                  <sc-for list="{{i.labels}}" as="l" hint-placeholder-count="1"><span class="ac-chip" style="margin-left: 0; background: var(--surface-sunken)">{{l}}</span></sc-for>
                  <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-muted)"><span class="{{i.avatarClass}}" aria-hidden="true">{{i.initial}}</span>{{i.assignee}}</span>
                </span>
              </a>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
      <div style="flex: 1; min-height: 0; overflow: auto; padding: 4px 24px 24px">
        <div style="display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-raised)">
          <sc-for list="{{flat}}" as="i" hint-placeholder-count="6">
            <a href="Issue.dc.html" style="{{i.rowStyle}}">
              <span style="flex: 0 0 56px; font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums">#{{i.number}}</span>
              <span style="flex: 1 1 280px; min-width: 0; font-weight: 500">{{i.title}}</span>
              <span class="ac-chip" style="margin-left: 0">{{i.statusLabel}}</span>
              <span style="flex: 0 0 140px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-muted)"><span class="{{i.avatarClass}}" aria-hidden="true">{{i.initial}}</span>{{i.assignee}}</span>
              <span style="flex: 0 0 64px; text-align: right; font-size: 13px; color: var(--ink-muted)">{{i.due}}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </main>

  <sc-if value="{{creating}}" hint-placeholder-val="{{false}}">
    <div onClick="{{closeNew}}" style="position: absolute; inset: 0; background: rgba(10, 10, 10, 0.4)"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="new-title" onKeyDown="{{dialogKey}}" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 16px; padding: 20px; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--overlay)">
      <h2 id="new-title" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 650">Nova issue</h2>
      <div class="ac-field">
        <label class="ac-field__label" for="ni-title">Título</label>
        <input id="ni-title" class="ac-input" value="{{draftTitle}}" onChange="{{onTitle}}" placeholder="Ex.: Confirmação do agendamento por WhatsApp">
      </div>
      <div class="ac-field">
        <label class="ac-field__label" for="ni-desc">Descrição e critérios de aceite</label>
        <textarea id="ni-desc" class="ac-input" rows="5" style="height: auto; padding: 10px 12px; line-height: 22px; resize: vertical" placeholder="O que precisa acontecer e como saber que ficou pronto."></textarea>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div class="ac-field">
          <label class="ac-field__label" for="ni-who">Responsável</label>
          <dc-import name="Select" trigger-id="ni-who" options="{{assigneeOptions}}" value="none" hint-size="100%,36px"></dc-import>
        </div>
        <div class="ac-field">
          <label class="ac-field__label" for="ni-pri">Prioridade</label>
          <dc-import name="Select" trigger-id="ni-pri" options="{{priorityOptions}}" value="normal" hint-size="100%,36px"></dc-import>
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <button class="ac-btn" type="button" onClick="{{closeNew}}">Cancelar</button>
        <button class="ac-btn ac-btn--primary" type="button" onClick="{{create}}" disabled="{{cannotCreate}}">Criar issue</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'board', filter: 'all', q: '', creating: false, draftTitle: '',
      items: [
        { number: 128, title: 'Login devolve 401 depois do deploy das 9h', status: 'in_review', who: 'Ada', agent: true, pr: 42, labels: ['bug'], high: true, due: 'hoje' },
        { number: 131, title: 'Confirmação do agendamento por WhatsApp', status: 'todo', who: 'Marina', agent: false, labels: ['produto'], high: true, due: '24 out' },
        { number: 129, title: 'Timeout no agendamento em horários de pico', status: 'in_progress', who: 'Ada', agent: true, pr: 44, labels: ['bug'], due: '18 out' },
        { number: 127, title: 'Resumo semanal de erros do Sentry no #eng', status: 'done', who: 'Atlas', agent: true, labels: ['ops'], due: '' },
        { number: 132, title: 'Tabela de concorrentes atualizada', status: 'todo', who: 'Lia', agent: true, labels: ['pesquisa'], due: '30 out' },
        { number: 130, title: 'Revisar textos do onboarding', status: 'in_progress', who: 'João', agent: false, labels: ['produto'], due: '' },
        { number: 126, title: 'Organizar o roadmap do trimestre', status: 'done', who: 'Theo', agent: true, labels: [], due: '' }
      ] };
  }
  renderVals() {
    const s = this.state;
    const STATUS = [['todo', 'A fazer'], ['in_progress', 'Em andamento'], ['in_review', 'Em revisão'], ['done', 'Feito']];
    const label = Object.fromEntries(STATUS);
    const q = (s.q || '').toLowerCase();
    const pass = (i) => (s.filter === 'all' || (s.filter === 'agents' && i.agent) || (s.filter === 'mine' && i.who === 'Walter') || (s.filter === 'people' && !i.agent))
      && (!q || (i.title + ' #' + i.number).toLowerCase().includes(q));
    const decorate = (i, idx) => ({ ...i, initial: i.who[0], assignee: i.who, hasPr: !!i.pr, isHigh: !!i.high, statusLabel: label[i.status],
      avatarClass: 'ac-avatar ac-avatar--sm' + (i.agent ? ' ac-avatar--agent' : ''),
      rowStyle: 'display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; color: var(--ink); text-decoration: none;' + (idx ? ' border-top: 1px solid var(--line);' : '') });
    const visible = s.items.filter(pass);
    const pill = (on) => 'font: inherit; font-size: 13px; font-weight: 600; height: 30px; padding: 0 12px; border-radius: 999px; cursor: pointer; color: var(--ink); border: 1px solid ' + (on ? 'var(--ink)' : 'var(--line)') + '; background: ' + (on ? 'var(--surface-sunken)' : 'var(--surface-raised)') + ';';
    const seg = (on) => 'font: inherit; font-size: 13px; font-weight: 600; height: 34px; padding: 0 12px; border: 0; cursor: pointer; color: var(--ink); background: ' + (on ? 'var(--surface-sunken)' : 'var(--surface-raised)') + ';';
    const F = [['all', 'Todas'], ['agents', 'Com agentes'], ['people', 'Com pessoas'], ['mine', 'Minhas']];
    return {
      theme: (this.props.tema ?? 'claro') === 'escuro' ? 'dark' : 'light',
      openCount: s.items.filter((i) => i.status !== 'done').length,
      agentCount: s.items.filter((i) => i.status !== 'done' && i.agent).length,
      q: s.q, onQ: (e) => this.setState({ q: e.target.value }),
      isBoard: s.view === 'board', isList: s.view === 'list',
      boardPressed: s.view === 'board' ? 'true' : 'false', listPressed: s.view === 'list' ? 'true' : 'false',
      boardBtn: seg(s.view === 'board'), listBtn: seg(s.view === 'list'),
      showBoard: () => this.setState({ view: 'board' }), showList: () => this.setState({ view: 'list' }),
      filters: F.map(([id, l]) => ({ label: l, pressed: s.filter === id ? 'true' : 'false', style: pill(s.filter === id), pick: () => this.setState({ filter: id }) })),
      columns: STATUS.map(([id, l]) => { const items = visible.filter((i) => i.status === id).map(decorate); return { label: l, count: items.length, items }; }),
      flat: visible.map(decorate),
      creating: s.creating, openNew: () => this.setState({ creating: true, draftTitle: '' }), closeNew: () => this.setState({ creating: false }),
      dialogKey: (e) => { if (e.key === 'Escape') this.setState({ creating: false }); },
      draftTitle: s.draftTitle, onTitle: (e) => this.setState({ draftTitle: e.target.value }),
      cannotCreate: !(s.draftTitle || '').trim(),
      create: () => { const t = (s.draftTitle || '').trim(); if (!t) return; this.setState({ creating: false, items: [{ number: 133, title: t, status: 'todo', who: 'Sem responsável', agent: false, labels: [], due: '' }].concat(s.items) }); },
      assigneeOptions: [{ value: 'none', label: 'Sem responsável' }, { value: 'walt', label: 'Walter' }, { value: 'joa', label: 'João' }, { value: 'ada', label: 'Ada', desc: 'Agente · Dev' }, { value: 'lia', label: 'Lia', desc: 'Agente · Pesquisa' }],
      priorityOptions: [{ value: 'low', label: 'Baixa' }, { value: 'normal', label: 'Normal' }, { value: 'high', label: 'Alta' }]
    };
  }
}
</script>
</body>
</html>
