<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menus em tela cheia</title>
<!-- The app's own fonts, tokens and components: nothing invented here. -->
<link rel="stylesheet" href="../../../apps/web/node_modules/@fontsource-variable/onest/index.css">
<link rel="stylesheet" href="../../../apps/web/src/fonts.css">
<link rel="stylesheet" href="../../../packages/ui/src/styles/index.css">
<script>
  { const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
    document.documentElement.dataset.theme = h.get("theme") || q.get("theme") || "light"; }
</script>
<style>
/*
  Prototype (MenuOverlay), round 4: direction B ("Tela cheia"), built only from the design system.
  - Fonts and tokens are the app's (Onest, Funnel Display for the workspace name like the wordmark, Doto for
    counters), loaded from apps/web and packages/ui/src/styles.
  - Rows are our menu items (.ac-menu__item with .ac-menu__label, .ac-menu__desc, .ac-menu__hint), counters are
    .ac-countchip, theme/language are .ac-seg, shortcuts are .ac-kbd, icons are our set (packages/ui icons).
  - Pixels: agents from packages/ui engine.js, the workspace's pixel sky (soft tones) only under the workspace,
    the budget is the sidebar's own bar (.sidebar__usage look).
  What's new is only the stage: full screen, the app behind blurred, the card growing into the header (FLIP),
  rows coming in one after another. Same options as today's WorkspaceMenu / AccountMenu (Sidebar.tsx);
  switching workspace moves from the account menu to the workspace one.
  Deep links: #theme=light|dark&open=org|me. Keys: Esc closes, 1–6 opens, ↑↓ move.
*/
:root{
  --font-sans:"Onest Variable",Onest,"Segoe UI",system-ui,sans-serif;
  --font-display:"Funnel Display",var(--font-sans);
  --font-dot:"Doto",var(--font-mono);
}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,p{margin:0}
.ac-icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--font-dot);font-variation-settings:"ROND" 100;font-weight:600;font-variant-numeric:tabular-nums}
canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}

/* ---------- prototype chrome (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-muted);background:var(--bg);position:relative;z-index:200}
.proto b{color:var(--ink)}
.proto .grow{flex:1}

/* ---------- the app behind (a stand-in for the real shell) ---------- */
.app{flex:1;display:flex;gap:12px;min-height:0;padding:12px;transition:filter .5s var(--out),transform .55s var(--out)}
body[data-open] .app{filter:blur(22px) saturate(1.15);transform:scale(.96)}
.side{width:280px;flex:none;display:flex;flex-direction:column;gap:10px}
.slot{position:relative;border:0;display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:var(--radius-section);background:var(--surface-raised);box-shadow:var(--e1),var(--top);text-align:left;font:inherit;color:var(--ink);cursor:pointer;overflow:hidden;transition:box-shadow .2s,transform .25s var(--spring)}
.slot:hover{box-shadow:var(--e2),var(--top)}
.slot:active{transform:scale(.98)}
.slot:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.slot[data-hidden]{visibility:hidden}
.slot>*:not(canvas){position:relative}
.slot canvas.sky{left:auto;width:55%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%)}
.slot .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.slot .nm{font-size:16px;font-weight:650}
.slot .mt{font-size:13px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .ac-icon{color:var(--ink-muted)}
.grow-col{flex:1}
.page{flex:1;border-radius:var(--radius-section);background:var(--surface-raised);box-shadow:var(--e1),var(--top);padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.page .line{height:12px;border-radius:6px;background:var(--surface-sunken)}
.mark{flex:none;display:grid;place-items:center;border-radius:var(--radius-md);color:#fff;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.photo{flex:none;display:grid;place-items:center;border-radius:var(--radius-md);color:#fff;font-weight:650;background:linear-gradient(160deg,#8fb6ea,#3f6fb0)}
.usage{display:flex;align-items:center;gap:var(--space-2)}
.usage-track{flex:1;height:4px;border-radius:var(--radius-full);background:var(--surface-sunken);overflow:hidden}
.usage-bar{display:block;height:100%;border-radius:var(--radius-full);background:var(--ink-muted)}
.usage-value{font-size:12px;color:var(--ink-muted);font-variant-numeric:tabular-nums}

/* ---------- the full-screen menu ---------- */
.ov{position:fixed;inset:0;z-index:100;display:none}
.ov[data-on]{display:block}
.ov-scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .45s var(--out)}
.ov[data-in] .ov-scrim{opacity:1}
.ov-close{position:absolute;top:56px;right:24px;z-index:3;opacity:0;transform:scale(.85);transition:opacity .25s,transform .4s var(--spring)}
.ov[data-in] .ov-close{opacity:1;transform:none}
.ov-sheet{position:absolute;inset:0;overflow:auto;padding:88px 24px 56px}
.ov-sheet canvas.sky{position:fixed;top:auto;height:34%;-webkit-mask-image:linear-gradient(transparent,#000 80%);mask-image:linear-gradient(transparent,#000 80%);opacity:0;transition:opacity .9s var(--out) .15s}
.ov[data-in] .ov-sheet canvas.sky{opacity:1}
.ov-wrap{position:relative;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

.ov-hd{display:flex;align-items:center;gap:var(--space-4)}
.ov-hd .mark,.ov-hd .photo{width:64px;height:64px;border-radius:var(--radius-lg);font-size:24px}
.ov-hd .tx{min-width:0;display:flex;flex-direction:column;gap:6px}
.ov-hd h1{font-family:var(--font-display);font-weight:300;font-size:48px;line-height:52px;letter-spacing:var(--track-tighter,-.03em)}
.ov-hd .meta{display:flex;align-items:center;gap:var(--space-2);font-size:14px;line-height:24px;color:var(--ink-muted)}
.crew{display:inline-flex;align-items:center;gap:4px;margin-left:var(--space-2)}
.agw{display:inline-grid;place-items:center;flex:none}

/* our dropdown, at full screen: the same surface and items, larger */
.ov .ac-menu{position:relative;max-height:none;overflow:visible;padding:var(--space-2);border-radius:var(--radius-section);box-shadow:var(--e2),var(--top)}
.ov .ac-menu__item{align-items:center;gap:var(--space-3);padding:12px 14px;border-radius:var(--radius-md);font-size:15px;line-height:20px;opacity:0;transform:translateY(6px)}
.ov .ac-menu__item>.ac-icon{width:20px;height:20px;margin:0;color:var(--ink-muted)}
.ov .ac-menu__item:hover>.ac-icon,.ov .ac-menu__item:focus-visible>.ac-icon{color:var(--ink)}
.ov .ac-menu__label{flex:1}
.ov .ac-menu__label .ttl{display:flex;align-items:center;gap:var(--space-2)}
.ov .ac-menu__hint{margin-left:auto;display:flex;align-items:center;gap:var(--space-2);font-size:13px;color:var(--ink-muted)}
.ov .ac-menu__item .ac-kbd{visibility:hidden}
.ov .ac-menu__item:hover .ac-kbd,.ov .ac-menu__item:focus-visible .ac-kbd{visibility:visible}
.ov .ac-menu__item.static{cursor:default}
.ov .ac-menu__item.static:hover{background:transparent}
.ov .ac-menu__item.static .ac-kbd{visibility:hidden!important}
.ov[data-in] .ac-menu__item{animation:rin .5s var(--out) both;animation-delay:calc(110ms + var(--k,0) * 35ms)}
@keyframes rin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ov .usage{width:120px}

/* workspaces: the same list; the mark sits where the icon goes */
.ov .ws-item .mark{width:32px;height:32px;border-radius:var(--radius-sm);font-size:13px;margin:-6px -6px -6px -6px}
.ov .ws-item.new .mark{background:transparent;color:var(--ink-muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.ov .ws-item.new .mark .ac-icon{width:16px;height:16px}
.ov .ws-item.new{color:var(--ink-muted)}
.ov .ac-menu .ac-menu__heading{padding:6px 14px 4px}

@media (prefers-reduced-motion:reduce){
  .app,.ov-scrim,.ov-close,.ov-sheet canvas.sky{transition:none!important}
  .ov[data-in] .ac-menu__item{animation:none;opacity:1;transform:none}
}
@media (max-width:720px){
  .page{display:none}.side{width:100%}
  .ov-sheet{padding:76px 12px 40px}
  .ov-hd h1{font-size:36px;line-height:40px}
  .crew{display:none}
}
</style>
</head>
<body>
<div class="proto" role="region" aria-label="Controles do protótipo (não é produto)">
  <b>Menus em tela cheia · rodada 4</b>
  <span>Clique no cartão do workspace ou no seu.</span>
  <span class="grow"></span>
  <div class="ac-seg ac-seg--sm" id="theme" role="radiogroup" aria-label="Tema"><span class="ac-seg__pill" aria-hidden="true"></span><button class="ac-seg__item" role="radio" data-v="light">Claro</button><button class="ac-seg__item" role="radio" data-v="dark">Escuro</button></div>
</div>

<div class="app" id="app">
  <aside class="side">
    <button class="slot" id="orgCard" aria-haspopup="dialog" aria-label="Menu do workspace Viajolo">
      <canvas class="sky" data-surf="--surface-raised" data-d=".35" data-cy=".55" data-px="3"></canvas>
      <span class="mark" style="width:40px;height:40px;background:#4f9a74">T</span>
      <span class="tx"><span class="nm">Viajolo</span><span class="mt">2 membros · 4 agentes</span></span>
      <span data-icon="chevronDown"></span>
    </button>
    <div class="grow-col"></div>
    <button class="slot" id="meCard" aria-haspopup="dialog" aria-label="Sua conta: Walter. O workspace usou 16% do orçamento deste mês">
      <span class="photo" style="width:36px;height:36px">W</span>
      <span class="tx"><span class="nm" style="font-size:14px">Walter</span><span class="usage"><span class="usage-track"><span class="usage-bar" style="width:16%"></span></span><span class="usage-value">16%</span></span></span>
      <span data-icon="preference"></span>
    </button>
  </aside>
  <main class="page" aria-hidden="true">
    <span class="line" style="width:30%"></span><span class="line" style="width:70%"></span><span class="line" style="width:55%"></span><span class="line" style="width:62%"></span>
  </main>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="ov-scrim" data-close></div>
  <button class="ac-btn ac-btn--ghost ac-btn--icon ov-close" data-close aria-label="Fechar"><span data-icon="close"></span></button>
  <div class="ov-sheet" id="sheet"></div>
</div>

<script type="module">
import { drawAgent, idlePose, drawAccessory, mixHex, AGENT_GRADIENTS } from "../../../packages/ui/src/agent/engine.js";

const icon = (n) => `<svg class="ac-icon" viewBox="0 0 20 20" aria-hidden="true">${ICONS[n] || ""}</svg>`;
const paint = (r = document) => { for (const el of $$("[data-icon]", r)) el.outerHTML = icon(el.dataset.icon); };
paint();

/* ---------- agents (shared engine) and the pixel sky ---------- */
const AGENTS = {
  theo: { name: "Theo", color: "amber", eyes: "round", acc: "cap" },
  dev: { name: "Dev", color: "sky", eyes: "round", acc: "headset" },
  nina: { name: "Nina", color: "green", eyes: "dots", acc: "bow" },
  iris: { name: "Iris", color: "rose", eyes: "round", acc: "flower" },

const live = [];
function makeAgent(id, size, mode) {
  const a = AGENTS[id], w = document.createElement("span");
  w.className = "agw";
  const cv = document.createElement("canvas"), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = cv.height = Math.round(size * dpr); cv.style.width = cv.style.height = size + "px";

  w.append(cv);

  return w;
}
function drawLive(t) {
  for (let i = live.length - 1; i >= 0; i--) {
    const it = live[i];
    if (!it.cv.isConnected) { live.splice(i, 1); continue; }

const cssVar = (n) => getComputedStyle(root).getPropertyValue(n).trim();
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const u32 = (h) => { const n = parseInt(h.slice(1, 7), 16); return ((255 << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | (n >> 16)) >>> 0; };
const hexOf = (v) => { const s = cssVar(v); if (s.startsWith("#") && s.length >= 7) return s.slice(0, 7); const m = s.match(/\d+(\.\d+)?/g) || [255, 255, 255]; return "#" + m.slice(0, 3).map((x) => Math.round(+x).toString(16).padStart(2, "0")).join(""); };

const soft = (v, depth) => { const [top, bot] = AGENT_GRADIENTS.sky; const bg = hexOf(v); return [bg, mixHex(bg, top, .14 * depth), mixHex(bg, top, .3 * depth), mixHex(bg, top, .5 * depth), mixHex(bg, bot, .55 * depth)]; };

    const w0 = d.cv.offsetWidth, h0 = d.cv.offsetHeight; if (!w0) continue;

  if (now - lastA > 40) { lastA = now; drawLive(REDUCED ? 2 : now / 1000); }
  if (now - lastS > 110) { lastS = now; drawSkies(REDUCED ? 0 : now / 1000); }
  requestAnimationFrame(loop);
})(0);

/* ---------- our menu items, at full screen ---------- */
let k = 0;
const count = (n) => `<span class="ac-countchip">${n}</span>`;
const item = (n, ic, label, { desc = "", hint = "", c = null, danger = false } = {}) =>
  `<button class="ac-menu__item${danger ? " ac-menu__item--danger" : ""}" role="menuitem" style="--k:${k++}" data-n="${n}">${icon(ic)}<span class="ac-menu__label"><span class="ttl">${label}${c === null ? "" : count(c)}</span>${desc ? `<span class="ac-menu__desc">${desc}</span>` : ""}</span><span class="ac-menu__hint">${hint}<kbd class="ac-kbd">${n}</kbd></span></button>`;
const seg = (name, value, opts) =>
  `<div class="ac-seg ac-seg--sm" role="radiogroup" aria-label="${name}" data-pick="${name}"><span class="ac-seg__pill" aria-hidden="true"></span>${opts.map(([v, l]) => `<button class="ac-seg__item" role="radio" data-v="${v}"${v === value ? " data-on" : ""} aria-checked="${v === value}">${l}</button>`).join("")}</div>`;
const pickItem = (ic, label, name, value, opts) =>
  `<div class="ac-menu__item static" role="group" aria-label="${label}" style="--k:${k++}">${icon(ic)}<span class="ac-menu__label">${label}</span><span class="ac-menu__hint">${seg(label, value, opts)}<kbd class="ac-kbd" aria-hidden="true"></kbd></span></div>`;
const ORGS = { viajolo: ["Viajolo", "#4f9a74"], himetrica: ["Himetrica", "#3a6fd8"], horta: ["Horta", "#b8862f"] };
// Workspaces: the same menu items, the mark in place of the icon; the current one says so.
const ws = (id, meta, here) =>
  `<button class="ac-menu__item ws-item" role="menuitemradio" aria-checked="${here}" style="--k:${k++}"><span class="mark" style="background:${ORGS[id][1]}">${ORGS[id][0][0]}</span><span class="ac-menu__label">${ORGS[id][0]}<span class="ac-menu__desc">${meta}</span></span><span class="ac-menu__hint">${here ? "Você está aqui" : ""}</span></button>`;

function orgMenu() {
  k = 0;
  return `
    <canvas class="sky" data-surf="--bg" data-d=".5" data-cy="1.1" data-px="4"></canvas>
    <div class="ov-wrap">
      <header class="ov-hd">
        <span class="mark" style="background:#4f9a74">T</span>
        <span class="tx">
          <h1 id="ovTitle">Viajolo</h1>
          <span class="meta">2 membros · 4 agentes<span class="crew"><span class="avs" data-a="theo" data-s="24"></span><span class="avs" data-a="dev" data-s="24" data-m="run"></span><span class="avs" data-a="nina" data-s="24"></span><span class="avs" data-a="iris" data-s="24"></span></span></span>
        </span>
      </header>
      <div class="ac-menu" role="menu" aria-label="Workspace Viajolo">
        ${item(1, "plus", "Convidar pessoas", { desc: "Por email ou link" })}
        ${item(2, "members", "Membros", { c: 2 })}
        ${item(3, "plug", "Conectores", { c: 6 })}
        ${item(4, "agent", "Acesso dos agentes")}
        ${item(5, "book", "Skills", { c: 3 })}
        ${item(6, "settings", "Configurações")}
      </div>
      <div class="ac-menu" role="menu" aria-label="Seus workspaces">
        <span class="ac-menu__heading">Seus workspaces</span>
        ${ws("viajolo", "2 membros · 4 agentes", true)}
        ${ws("himetrica", "5 membros · 7 agentes", false)}
        ${ws("horta", "1 membro · 1 agente", false)}
        <span class="ac-menu__separator" role="separator"></span>
        <button class="ac-menu__item ws-item new" role="menuitem" style="--k:${k++}"><span class="mark">${icon("plus")}</span><span class="ac-menu__label">Novo workspace</span><span class="ac-menu__hint"></span></button>
      </div>
    </div>`;
}

function meMenu() {
  k = 0;
  const pref = root.dataset.pref || root.dataset.theme;
  return `
    <div class="ov-wrap">
      <header class="ov-hd">
        <span class="photo">W</span>
        <span class="tx">
          <h1 id="ovTitle">Walter</h1>
          <span class="meta">@walter · walter@acme.example</span>
        </span>
      </header>
      <div class="ac-menu" role="menu" aria-label="Sua conta">
        ${item(1, "person", "Perfil", { desc: "Nome, foto e @" })}
        ${item(2, "clock", "Fuso horário", { hint: "São Paulo" })}
        ${pickItem("bulb", "Tema", "theme", pref, [["system", "Sistema"], ["light", "Claro"], ["dark", "Escuro"]])}
        ${pickItem("globe", "Idioma", "lang", "pt", [["pt", "Português"], ["en", "English"]])}
        ${item(3, "wallet", "Orçamento de Viajolo", { desc: "Este mês", hint: `<span class="usage"><span class="usage-track"><span class="usage-bar" style="width:16%"></span></span><span class="usage-value">16%</span></span>` })}
        <span class="ac-menu__separator" role="separator"></span>
        ${item(4, "arrowRight", "Sair", { danger: true })}
      </div>
    </div>`;
}

/* the segmented pill follows the chosen item, like Segmented.tsx */
function placePills(r = document) {
  for (const s of $$(".ac-seg", r)) {
    const on = $(".ac-seg__item[data-on]", s), pill = $(".ac-seg__pill", s);
    if (on && pill) { pill.style.setProperty("--x", `${on.offsetLeft}px`); pill.style.setProperty("--w", `${on.offsetWidth}px`); }
  }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".ac-seg__item"); if (!b) return;
  const s = b.closest(".ac-seg");
  for (const x of $$(".ac-seg__item", s)) { const on = x === b; x.toggleAttribute("data-on", on); x.setAttribute("aria-checked", String(on)); }
  placePills(s);
  if (s.id === "theme") setTheme(b.dataset.v);
  if (s.dataset.pick === "theme") { root.dataset.pref = b.dataset.v; setTheme(b.dataset.v === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : b.dataset.v, true); }
});

/* ---------- open / close: the card grows into the header ---------- */
const ov = $("#ov"), sheet = $("#sheet");
let opener = null;
function open(kind, from) {
  opener = from;
  sheet.innerHTML = kind === "org" ? orgMenu() : meMenu();
  hydrate(sheet);
  ov.dataset.on = "1";
  document.body.dataset.open = kind;
  $("#app").inert = true;
  const a = from.getBoundingClientRect();
  from.dataset.hidden = "1";
  requestAnimationFrame(() => {
    ov.dataset.in = "1";
    placePills(sheet);
    const target = $(".ov-hd", sheet), b = target.getBoundingClientRect();
    if (!REDUCED) {
      target.animate([
        { transform: `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width},${a.height / b.height})`, transformOrigin: "0 0", opacity: .3 },
        { transform: "none", transformOrigin: "0 0", opacity: 1 },
      ], { duration: 600, easing: "cubic-bezier(.3,1.2,.4,1)" });
    }
    $(".ac-menu__item", sheet)?.focus({ preventScroll: true, focusVisible: false });
  });
}
function close() {
  if (!ov.dataset.on) return;
  delete ov.dataset.in;
  const from = opener;
  const done = () => {
    delete ov.dataset.on; sheet.innerHTML = "";
    $("#app").inert = false;
    if (from) { delete from.dataset.hidden; from.focus({ preventScroll: true }); }
  };
  delete document.body.dataset.open;
  if (REDUCED || !from) return done();
  const a = from.getBoundingClientRect(), target = $(".ov-hd", sheet), b = target.getBoundingClientRect();
  for (const el of $$(".ac-menu,canvas.sky", sheet)) el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" });
  target.animate([
    { transform: "none", transformOrigin: "0 0", opacity: 1 },
    { transform: `translate(${a.left - b.left}px,${a.top - b.top}px) scale(${a.width / b.width},${a.height / b.height})`, transformOrigin: "0 0", opacity: 0 },
  ], { duration: 320, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" }).onfinish = done;
}
$("#orgCard").addEventListener("click", (e) => open("org", e.currentTarget));
$("#meCard").addEventListener("click", (e) => open("me", e.currentTarget));
ov.addEventListener("click", (e) => { if (e.target.closest("[data-close]")) close(); });
sheet.addEventListener("click", (e) => { if (e.target === sheet || e.target.classList.contains("ov-wrap")) close(); });
document.addEventListener("keydown", (e) => {
  if (!ov.dataset.on) return;
  if (e.key === "Escape") { e.preventDefault(); close(); return; }
  const items = $$("button.ac-menu__item[data-n]", sheet);
  if (/^[1-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey) items.find((x) => x.dataset.n === e.key)?.focus();
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const i = items.indexOf(document.activeElement);
    items[i < 0 ? 0 : Math.min(items.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)))]?.focus();
    e.preventDefault();
  }
});

/* ---------- prototype controls ---------- */
function setTheme(v, keepPill) {
  root.dataset.theme = v;
  const s = $("#theme");
  for (const x of $$(".ac-seg__item", s)) { const on = x.dataset.v === v; x.toggleAttribute("data-on", on); x.setAttribute("aria-checked", String(on)); }
  placePills(s);
  history.replaceState(null, "", `#theme=${v}`);
}
const want = new URLSearchParams(location.hash.slice(1)).get("open");
setTheme(root.dataset.theme);
document.fonts?.ready.then(() => placePills());
if (want) setTimeout(() => open(want, $(want === "org" ? "#orgCard" : "#meCard")), 300);
</script>
</body>
</html>
