<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<!--
  The share image (Open Graph, 1200×630), drawn by the agent engine. Regenerate apps/web/public/og.png:
    python3 -m http.server 8765 --bind 127.0.0.1   (from the repo root)
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=apps/web/public/og.png http://127.0.0.1:8765/docs/design/telas/OG.html
-->
<style>
@font-face { font-family: "Funnel Display"; font-weight: 300 800; src: url("../../../apps/web/src/fonts/funnel-display-latin.woff2") format("woff2"); }
@font-face { font-family: "Doto"; font-weight: 100 900; src: url("../../../apps/web/src/fonts/doto-latin.woff2") format("woff2"); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0b0a; }
.card { position: absolute; inset: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 1200px; height: 630px; image-rendering: pixelated; }
.copy { position: absolute; left: 72px; top: 74px; width: 610px; color: #04203f; }
.brand { display: flex; align-items: center; gap: 12px; font-family: "Funnel Display", sans-serif; font-weight: 300; font-size: 34px; letter-spacing: -0.02em; }
.brand i { font-style: normal; font-family: "Doto", monospace; font-variation-settings: "ROND" 100; font-weight: 600; font-size: 0.62em; color: rgba(4, 32, 63, 0.7); margin-left: 2px; }
h1 { margin: 54px 0 0; font-family: "Funnel Display", sans-serif; font-weight: 300; font-size: 76px; line-height: 1.02; letter-spacing: -0.035em; }
.chip { position: absolute; left: 72px; bottom: 66px; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; background: rgba(241, 248, 255, 0.78); box-shadow: 0 0 0 1px rgba(4, 32, 63, 0.14); color: #04203f; font-family: "Doto", monospace; font-variation-settings: "ROND" 100; font-weight: 600; font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
  <canvas id="sky" width="300" height="158"></canvas>
  <canvas id="agent" width="1200" height="630"></canvas>
  <div class="copy">
    <div class="brand"><canvas id="mark" width="80" height="80" style="position:static;width:40px;height:40px"></canvas><span>agentes<i>.chat</i></span></div>
    <h1>Your team and your agents, in the same conversation.</h1>
  </div>
  <div class="chip">Early access · agentes.chat</div>
</div>
<script type="module">
import { drawAgent, spriteGrid, spriteBody } from "../../../packages/ui/src/agent/engine.js";

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const SKY = ["#0a3f9c", "#0f56c4", "#2b74e6", "#4b93ff", "#78b4ff", "#a6cfff", "#cfe6ff", "#eef7ff"];
const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

/* The sky at 4 px per pixel: light behind the text (calm), deep blue at the bottom right, a light halo behind the giant. */
const P = 4, W = 300, H = 158;
const GX = 905 / P, GY = 330 / P, GR = 300 / P;
const sky = document.getElementById("sky").getContext("2d");
const img = sky.createImageData(W, H);
const cols = SKY.map(rgb), n = cols.length - 1;
const calm = new Float32Array(W * H);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const u = x / W, v = y / H;
  let f = 0.86 - 0.42 * u - 0.48 * v + 0.14 * Math.exp(-((u - 0.18) ** 2 + (v - 0.2) ** 2) / 0.03) - 0.2 * Math.exp(-((u - 0.95) ** 2 + (v - 1) ** 2) / 0.05);
  // Calm behind the copy (left), fading out.
  const dx = Math.max(0, x - 700 / P), dy = 0;
  const textCalm = Math.max(0, 1 - Math.hypot(dx, dy) / 26) * (x < 720 / P ? 1 : 1);
  const q = Math.max(0, Math.min(1, (GR - Math.hypot(x - GX, y - GY)) / (GR * 0.45)));
  const halo = q * q * (3 - 2 * q);
  const k = Math.max(textCalm * 0.85, halo);
  calm[y * W + x] = k;
  f = f * (1 - k) + (6 / 7) * k;
  const kk = Math.max(0, Math.min(n, f * n)), lo = Math.floor(kk);
  const c = cols[Math.min(n, lo + (kk - lo > BAYER[(x & 3) + (y & 3) * 4] ? 1 : 0))];
  const i = (y * W + x) * 4; img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
}
/* A few pixel agents from the engine, outside the calm zones. */
const sprite = spriteGrid(9), body = rgb(spriteBody("sky"));
for (const [sx, sy, k] of [[262, 20, 1], [286, 92, 1], [150, 10, 1], [196, 140, 1]]) {
  for (let j = 0; j < 9; j++) for (let i = 0; i < 9; i++) {
    const ch = sprite[j][i]; if (ch === ".") continue;
    for (let a = 0; a < k; a++) for (let b = 0; b < k; b++) {
      const X = sx + i * k + a, Y = sy + j * k + b;
      if (X < 0 || Y < 0 || X >= W || Y >= H || calm[Y * W + X] > 0.3) continue;
      const c = ch === "o" ? [255, 255, 255] : body, o = (Y * W + X) * 4;
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2];
    }
  }
}
sky.putImageData(img, 0, 0);

/* The giant: the engine's agent, deep tones, a slight turn toward the text and a crown. */
const g = document.getElementById("agent").getContext("2d");
g.filter = "drop-shadow(0 40px 50px rgba(0, 30, 90, 0.5))";
drawAgent(g, 905 - 165, 330 - 150, 330, { color: "sky", cells: 26, deep: true, pose: { turn: [-0.35, 0.05] } });
g.filter = "none";

/* The mark next to the name. */
drawAgent(document.getElementById("mark").getContext("2d"), 0, 0, 80, { color: "sky", cells: 12 });
</script>
</body>
</html>
