<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Doto:ROND,wght@100,600&family=Martian+Mono:wght@400&display=swap">
<script>{const q=new URLSearchParams(location.hash.slice(1));document.documentElement.dataset.theme=q.get("theme")||"light";}</script>
<style>
/*
  Prototype: Settings → Computadores, one section for the two places agents work, so the concepts stop
  mixing (today "Sandbox" configures only the cloud computer, and nothing says so).
    1. Onde os agentes trabalham: the two kinds side by side, with their portraits (IconesComputador.html,
       approved): Na nuvem (ready, started when an agent needs it, sees nothing of yours) and
       No seu computador (a Mac/PC/server of yours through the app; only the folders you allow).
    2. Computador na nuvem: the old "Sandbox" settings, now labeled as cloud-only, with a note that your
       own computers follow what you allow in the app, on the computer itself.
    3. Seus computadores: the connected list and the download.
    4. Qual computador cada agente usa: every agent and its computer, changeable here.
  States (#state=both|cloudonly, #theme=light|dark): with a connected computer, or none yet.
  Agents come from packages/ui/src/agent/engine.js; portraits are an inline copy of the approved drawings
  until packages/ui/src/computer/portrait.js exists (then import it).
*/
:root{
  --bg:#f4f4f1;--raised:#fff;--sunken:#ebebe7;--line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 8px 20px -6px rgba(23,23,22,.12),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);--spring:cubic-bezier(.34,1.4,.5,1);
  --sans:"Onest",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",monospace;--mono:"Martian Mono",ui-monospace,monospace;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
canvas.pt,canvas.av{display:block;flex:none}
canvas.pt{image-rendering:pixelated}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
.pbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12.5px;color:var(--muted)}
.pbar .lbl{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.pbar .grow{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;height:26px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1120px;margin:0 auto;padding:24px 16px 120px}
.subnav{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:2px}
.subnav .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:2px 10px 8px}
.subnav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13.5px}
.subnav a[aria-current="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top);font-weight:600}
.subnav a.gone{text-decoration:line-through;opacity:.5}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:300;font-size:40px;letter-spacing:-.03em;line-height:1.05}
.lead{color:var(--muted);max-width:64ch;margin-top:8px;font-size:14.5px}
.card{background:var(--raised);border-radius:20px;box-shadow:var(--e1),var(--top);padding:20px;min-width:0}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ch .t{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.ch h2{font-size:16px;font-weight:650;letter-spacing:-.01em}
.ch p{color:var(--muted);font-size:13px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:12px;font-weight:600;font-size:13.5px;background:var(--raised);box-shadow:var(--e1),var(--top);white-space:nowrap;transition:transform .18s var(--spring)}
.btn:active{transform:scale(.97)}
.btn.primary{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)),var(--ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 6px 14px -6px rgba(0,0,0,.45)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip .n{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:13px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--plate);color:var(--muted);font-size:13px}
.note b{color:var(--ink);font-weight:600}
.note svg{margin-top:2px}

/* 1. The two kinds */
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kind{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);position:relative;overflow:hidden}
.kind .pic{display:flex;justify-content:center;padding:6px 0 2px;border-radius:14px;background:linear-gradient(180deg,var(--plate),transparent)}
.kind h3{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.kind ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;color:var(--ink2);font-size:13.5px}
.kind li{display:flex;gap:8px;align-items:flex-start}
.kind li svg{color:var(--ok);margin-top:2px}
.kind .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.kind .foot .grow{flex:1}

/* 2. Cloud settings */
.sw{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:40px;height:24px;border-radius:999px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink);box-shadow:none}
.sw[aria-checked="true"]::after{transform:translateX(16px);background:var(--bg)}
.rowline{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rowline:first-of-type{border-top:0}
.rowline .t{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowline .t b{font-weight:600}
.rowline .t small{color:var(--muted);font-size:12.5px}
.opts{display:flex;flex-direction:column;gap:8px;flex-basis:100%}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2);transition:box-shadow .15s,background .15s}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--plate)}
.opt .dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);flex:none;margin-top:1px;display:grid;place-items:center}
.opt[aria-checked="true"] .dot{box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.opt .t{display:flex;flex-direction:column;gap:1px}
.opt .t b{font-weight:600}
.opt .t small{color:var(--muted);font-size:12.5px}
.domains{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 0 30px}
.domains code{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;background:var(--sunken);color:var(--ink2)}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--sunken)}
.stepper button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.stepper button:hover{background:var(--raised);color:var(--ink)}
.stepper output{min-width:64px;text-align:center;font-weight:600;font-size:13.5px}
.ck{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:600}
.ck .box{width:18px;height:18px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line2);display:grid;place-items:center}
.ck[aria-checked="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.ck .box svg{width:12px;height:12px;stroke-width:2.6;opacity:0}
.ck[aria-checked="true"] .box svg{opacity:1}
.off{opacity:.45;pointer-events:none}

/* 3. Your computers, 4. who uses which */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0;padding-top:2px}
.item .t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t .n{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.item .t small{color:var(--muted);font-size:12.5px}
.empty{display:flex;align-items:center;gap:16px;padding:6px 0}
.empty .t{display:flex;flex-direction:column;gap:4px}
.empty b{font-weight:600}
.empty span{color:var(--muted);font-size:13px}
.uses{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:999px;background:var(--sunken);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.uses svg{color:var(--muted)}
.menu{position:absolute;z-index:30;min-width:240px;border-radius:16px;padding:6px;background:color-mix(in srgb,var(--raised) 94%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--e3)}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;font-size:13.5px}
.mi:hover{background:var(--plate)}
.mi small{color:var(--muted);font-size:12px;margin-left:auto}
.mi[aria-checked="true"]{font-weight:650}
.savebar{position:sticky;bottom:16px;display:flex;gap:8px;align-items:center;padding:10px 10px 10px 16px;border-radius:18px;background:color-mix(in srgb,var(--raised) 80%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--e3)}
.savebar span{margin-right:auto;font-size:13.5px;font-weight:600}
@media (max-width:900px){.app{grid-template-columns:1fr}.subnav{display:none}.kinds{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="pbar"><span class="lbl">Protótipo</span><span class="grow"></span><div class="seg" id="states"></div><div class="seg" id="theme"></div></div>
<div class="app">
  <nav class="subnav" aria-label="Seções das configurações" id="subnav"></nav>
  <main class="main" id="root"></main>
</div>
<div id="layer"></div>
<script type="module">
import { drawAgent, idlePose, drawAccessory, ACCESSORY_REACH } from "../../../packages/ui/src/agent/engine.js";
/* ================= Pixel portraits (48×48 grid) ================= */
const N = 48;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
const ALU = ["#fbfbf9", "#eeeeea", "#dcdcd7", "#c4c4be", "#a3a39d", "#7d7d77"];
const GRAPHITE = ["#3a3a37", "#262624", "#161615"];
const SKY = ["#0a2f5e", "#0b4590", "#0063d1", "#2f80e0", "#5ea0ee", "#8cc3ff", "#c6e1ff"];
const NIGHT = ["#141413", "#1b1b1a", "#222220"];

function painter(ctx) {
  const set = (x, y, c) => { if (c && x >= 0 && y >= 0 && x < N && y < N) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); } };
  /* A dithered ramp across a box: `f(x, y)` from 0 to 1 picks between the tones (ordered dither). */
  const ramp = (x0, y0, w, h, tones, f) => {
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      const v = Math.max(0, Math.min(1, f((x - x0) / Math.max(1, w - 1), (y - y0) / Math.max(1, h - 1))));
      const k = v * (tones.length - 1), lo = Math.floor(k);
      set(x, y, tones[Math.min(tones.length - 1, lo + (k - lo > BAYER[(x & 3) + (y & 3) * 4] ? 1 : 0))]);
    }
  };
  const box = (x, y, w, h, c) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(i, j, c); };
  const clear = (...pts) => pts.forEach(([x, y]) => ctx.clearRect(x, y, 1, 1));
  return { set, ramp, box, clear };
}
/* A soft floor shadow: sparse dither that fades out to the sides. */
function shadow(p, cx, y, w, dark) {
  const c = dark ? "rgba(0,0,0,.55)" : "rgba(23,23,22,.16)";
  for (let x = cx - w; x <= cx + w; x++) for (let j = 0; j < 2; j++) {
    const edge = 1 - Math.abs(x - cx) / w;
    if (edge > BAYER[(x & 3) + ((y + j) & 3) * 4] * (j ? 1.6 : 1)) p.set(x, y + j, c);
  }
}
/* What a screen shows: our sky (deep at the top, the horizon glowing at the bottom), dark when off. */
function screen(p, x, y, w, h, state, t = 0) {
  if (state === "offline") { p.ramp(x, y, w, h, NIGHT, (u, v) => 0.2 + 0.6 * u * v); return; }
  p.ramp(x, y, w, h, SKY, (u, v) => 0.1 + 0.85 * v * v + 0.06 * Math.sin(u * 6 + t));
  if (state === "paused") for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if ((i + j) % 2) p.set(i, j, "rgba(20,20,19,.55)");
}
/* The brand's pixel agent: a 5×4 deep body with white eyes (they close while paused). */
function agent(p, x, y, state, t = 0) {
  const body = "#04203f", bob = state === "online" && Math.sin(t * 2) > 0.3 ? -1 : 0;
  p.box(x, y + bob, 5, 4, body); p.set(x + 4, y + 3 + bob, null);
  const closed = state !== "online" || t % 4 > 3.85;
  if (closed) { p.set(x + 1, y + 2 + bob, "#fff"); p.set(x + 3, y + 2 + bob, "#fff"); }
  else { p.set(x + 1, y + 1 + bob, "#fff"); p.set(x + 1, y + 2 + bob, "#fff"); p.set(x + 3, y + 1 + bob, "#fff"); p.set(x + 3, y + 2 + bob, "#fff"); }
}

const DRAW = {
  mac(p, state, dark, t) {
    shadow(p, 24, 37, 21, dark);
    // Lid: a graphite bezel with rounded corners, the screen inside.
    p.box(7, 6, 34, 26, GRAPHITE[2]); p.clear([7, 6], [40, 6]);
    screen(p, 9, 8, 30, 22, state, t);
    if (state !== "offline") { p.box(9, 8, 30, 1, "rgba(255,255,255,.55)"); agent(p, 22, 18, state, t); }
    p.box(22, 8, 4, 2, GRAPHITE[2]); // the notch
    // Hinge and base: brushed aluminum, the thumb scoop in the front, rounded ends.
    p.box(7, 32, 34, 1, ALU[5]);
    p.ramp(3, 33, 42, 3, ALU, (u, v) => 0.15 + 0.55 * v + 0.15 * Math.abs(u - 0.5));
    p.box(20, 33, 8, 1, ALU[3]);
    p.clear([3, 35], [44, 35]);
    p.box(5, 36, 38, 1, ALU[5]);
  },
  windows(p, state, dark, t) {
    shadow(p, 24, 42, 14, dark);
    // A light monitor: rounded frame with a thin edge, a deeper chin with a power light.
    p.ramp(4, 5, 40, 28, ALU, (u, v) => 0.05 + 0.25 * v);
    for (let x = 5; x < 43; x++) { p.set(x, 5, ALU[3]); p.set(x, 32, ALU[4]); }
    for (let y = 6; y < 32; y++) { p.set(4, y, ALU[3]); p.set(43, y, ALU[4]); }
    p.clear([4, 5], [43, 5], [4, 32], [43, 32]);
    screen(p, 6, 7, 36, 22, state, t);
    if (state !== "offline") {
      // A window over the sky, and the taskbar with its start mark.
      p.box(11, 10, 17, 11, "#ffffff"); p.box(11, 10, 17, 2, "#dfe3e8");
      p.set(25, 10, ALU[4]); p.set(26, 10, ALU[4]);
      for (const r of [14, 16, 18]) p.box(13, r, r === 18 ? 8 : 12, 1, "#c9ced6");
      p.box(6, 26, 36, 3, "rgba(236,240,245,.92)");
      p.box(8, 27, 2, 1, GRAPHITE[0]); p.box(11, 27, 2, 1, GRAPHITE[0]);
      p.box(15, 27, 3, 1, ALU[4]); p.box(19, 27, 3, 1, ALU[4]);
      agent(p, 32, 16, state, t);
    }
    p.set(39, 30, state === "offline" ? ALU[4] : state === "paused" ? "#e0a84a" : "#5fc48a");
    // Neck and foot.
    p.ramp(21, 33, 6, 6, ALU, (u) => 0.25 + 0.4 * u);
    p.ramp(13, 39, 22, 3, ALU, (u, v) => 0.1 + 0.45 * v + 0.15 * Math.abs(u - 0.5));
    p.clear([13, 41], [34, 41]);
  },
  linux(p, state, dark, t) {
    shadow(p, 24, 43, 13, dark);
    // A server tower: light body shaded from the left, a darker side edge.
    p.ramp(13, 3, 22, 40, ALU, (u, v) => 0.05 + 0.35 * u + 0.1 * v);
    for (let y = 4; y < 42; y++) { p.set(13, y, ALU[3]); p.set(34, y, ALU[5]); }
    for (let x = 14; x < 34; x++) { p.set(x, 3, ALU[3]); p.set(x, 42, ALU[5]); }
    p.clear([13, 3], [34, 3], [13, 42], [34, 42]);
    // Two drive bays with slots and a light each.
    for (const y of [7, 11]) {
      p.box(16, y, 16, 3, ALU[2]); p.box(16, y, 16, 1, ALU[1]); p.box(18, y + 1, 9, 1, ALU[4]);
      const on = state === "online" && ((t * 3 + y) % 2 > 0.7);
      p.set(30, y + 1, state === "offline" ? ALU[4] : on ? "#5fc48a" : "#2f7a4f");
    }
    // A small status screen: a prompt on black (the terminal, Linux's face).
    p.box(16, 17, 16, 7, state === "offline" ? NIGHT[1] : "#141413");
    if (state !== "offline") {
      p.set(18, 19, "#5fc48a"); p.set(19, 20, "#5fc48a"); p.set(18, 21, "#5fc48a");
      if (state === "online" ? t % 1 > 0.5 : true) p.box(21, 21, 3, 1, "#5fc48a");
      p.box(21, 19, 7, 1, "rgba(95,196,138,.45)");
    }
    // Vents.
    for (let y = 27; y < 36; y += 2) for (let x = 16; x < 32; x += 2) p.set(x, y, ALU[4]);
    // Power button and light.
    p.box(22, 38, 3, 2, ALU[3]); p.set(23, 38, ALU[5]);
    p.set(27, 39, state === "offline" ? ALU[4] : state === "paused" ? "#e0a84a" : "#5fc48a");
  },
};

/* The cloud: a union of circles over a flat bottom, shaded light at the top, outlined, floating. */
function cloud(p, state, dark, t) {
  const bob = state === "online" ? Math.round(Math.sin(t * 1.4)) : 0;
  shadow(p, 24, 42, state === "online" && bob < 0 ? 11 : 13, dark);
  const blobs = [[13, 28, 6.5], [21, 21, 8], [30, 18, 9], [38, 26, 6.5], [25, 25, 8]];
  const inside = (x, y) => (y <= 35 && y >= 9 && x >= 7 && x <= 42 && (y >= 27 ? y <= 34 && x >= 9 && x <= 40 : false)) ||
    blobs.some(([cx, cy, r]) => (x - cx) ** 2 + (y - cy) ** 2 <= r * r);
  for (let y = 6; y < 38; y++) for (let x = 4; x < 46; x++) {
    if (!inside(x, y)) continue;
    const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
    if (edge) { p.set(x, y + bob, y > 30 ? ALU[5] : ALU[4]); continue; }
    const v = (y - 9) / 26, k = Math.min(1, 0.02 + 0.55 * v * v) * (ALU.length - 2);
    const lo = Math.floor(k);
    p.set(x, y + bob, ALU[Math.min(ALU.length - 2, lo + (k - lo > BAYER[(x & 3) + (y & 3) * 4] ? 1 : 0))]);
  }
  // A screen set in the cloud: graphite bezel, our sky, the agent.
  p.box(17, 19 + bob, 15, 10, GRAPHITE[2]);
  p.clear([17, 19 + bob], [31, 19 + bob], [17, 28 + bob], [31, 28 + bob]);
  screen(p, 18, 20 + bob, 13, 8, state, t);
  if (state !== "offline") agent(p, 22, 22 + bob, state, t);
  // The status light, low on the right.
  p.set(36, 31 + bob, state === "offline" ? ALU[4] : state === "paused" ? "#e0a84a" : "#5fc48a");
}
DRAW.cloud = cloud;

const live = [];
function portrait(os, scale, state) {
  const cv = document.createElement("canvas");
  cv.className = "pt"; cv.width = cv.height = N;
  cv.style.width = cv.style.height = N * scale + "px";
  live.push({ cv, os, state });
  return cv;
}
function frame(now) {
  const t = now / 1000, dark = document.documentElement.dataset.theme === "dark";
  for (let i = live.length - 1; i >= 0; i--) {
    const a = live[i];
    if (!a.cv.isConnected) { live.splice(i, 1); continue; }
    const ctx = a.cv.getContext("2d");
    ctx.clearRect(0, 0, N, N);
    DRAW[a.os](painter(ctx), a.state, dark, t);
  }
  setTimeout(() => requestAnimationFrame(frame), 90);
}


/* ================= Agents (only from the engine) ================= */
const DPR = Math.min(2, devicePixelRatio || 1), RCH = ACCESSORY_REACH;
const AGENTS = {
  dev: { name: "Dev", look: { color: "indigo", eyes: "wide", accessory: "headphones" } },
  bento: { name: "Bento", look: { color: "amber", eyes: "round", accessory: "cap" } },
  ada: { name: "Ada", look: { color: "green", eyes: "happy", accessory: "none" } },
  atlas: { name: "Atlas", look: { color: "violet", eyes: "round", accessory: "antenna" } },
};
const avs = [];
function avatar(id, size) {
  const cv = document.createElement("canvas"); cv.className = "av";
  const w = size * (1 + RCH.left + RCH.right), h = size * (1 + RCH.top + RCH.bottom);
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + "px"; cv.style.height = h + "px";
  cv.style.margin = `${-size * RCH.top}px ${-size * RCH.right}px ${-size * RCH.bottom}px ${-size * RCH.left}px`;
  avs.push({ cv, id, size, seed: Math.random() * 5 });
  return cv;
}
function drawAvatars(t) {
  for (let i = avs.length - 1; i >= 0; i--) {
    const a = avs[i]; if (!a.cv.isConnected) { avs.splice(i, 1); continue; }
    const c = a.cv.getContext("2d"), s = a.size * DPR, L = AGENTS[a.id].look;
    c.clearRect(0, 0, a.cv.width, a.cv.height);
    drawAgent(c, RCH.left * s, RCH.top * s, s, {
      color: L.color, eyes: L.eyes, cells: 10, pose: idlePose(t, a.seed, { every: 11, expressions: ["happy", "wink"] }),
      after: L.accessory !== "none" ? (cx, side, f) => drawAccessory(cx, side, L.accessory, f, t, false) : undefined,
    });
  }
}
const tick = () => { drawAvatars(performance.now() / 1000); setTimeout(() => requestAnimationFrame(tick), 60); };

/* ================= Page ================= */
const I = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const P = {

  download: '<path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  users: '<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.7-3 2.8-4.6 5.5-4.6s4.8 1.6 5.5 4.6"/>',
  plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8ZM12 17v4"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>',
  wallet: '<rect x="4" y="9" width="16" height="11" rx="2.5"/><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v4"/>',
  computer: '<rect x="3.5" y="4.5" width="17" height="11.5" rx="2.5"/><path d="M8.5 20h7M12 16v4"/>',
  shield: '<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z"/>',
  cloud: '<path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.5 9.6 4.5 4.5 0 0 0 7 18.5Z"/><rect x="9.5" y="11.6" width="6" height="4" rx=".8"/>',
  mac: '<rect x="4" y="4.5" width="16" height="11" rx="2"/><path d="M10.4 4.5h3.2v.7a.9.9 0 0 1-.9.9h-1.4a.9.9 0 0 1-.9-.9Z"/><path d="M2.5 18.2h19l-.9 1.1a1.6 1.6 0 0 1-1.2.6H4.6a1.6 1.6 0 0 1-1.2-.6Z"/>',
  linux: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 8.6h18"/><path d="m7.2 12 2.6 2.1-2.6 2.1M12 16.3h4.6"/>',
};
const q = new URLSearchParams(location.hash.slice(1));
const S = {
  state: q.get("state") === "cloudonly" ? "cloudonly" : "both",
  cloudOn: true, net: "allowlist", minutes: 120, timeout: 60, approval: false, dirty: false,
  uses: { dev: "mac", bento: "cloud", ada: "cloud", atlas: "cloud" }, menu: null,
};
const MACHINES = [
  { id: "mac", kind: "mac", name: "MacBook do Walter", state: "online", d: "macOS · versão 0.9.0 · conectado agora · Conectado por Walter" },
  { id: "srv", kind: "linux", name: "servidor-build", state: "offline", d: "Linux · versão 0.9.0 · visto há 2 h · Conectado por Walter" },
];
const machines = () => (S.state === "both" ? MACHINES : []);
const slot = (kind, scale, state = "online") => `<span data-pt="${kind}" data-scale="${scale}" data-state="${state}"></span>`;
const avSlot = (id, size) => `<span data-av="${id}" data-size="${size}"></span>`;
const usesLabel = (u) => (u === "cloud" ? "Nuvem" : MACHINES.find((m) => m.id === u)?.name ?? "Nuvem");
const usesIcon = (u) => (u === "cloud" ? "cloud" : MACHINES.find((m) => m.id === u)?.kind ?? "cloud");
const count = (k) => Object.values(S.uses).filter((u) => (k === "cloud" ? u === "cloud" : u !== "cloud")).length;

function render() {
  const th = document.documentElement.dataset.theme;
  document.getElementById("states").innerHTML = [["both", "Com computador conectado"], ["cloudonly", "Só a nuvem"]].map(([v, l]) => `<button data-state="${v}" aria-pressed="${v === S.state}">${l}</button>`).join("");
  document.getElementById("theme").innerHTML = [["light", "Claro"], ["dark", "Escuro"]].map(([v, l]) => `<button data-theme="${v}" aria-pressed="${v === th}">${l}</button>`).join("");
  document.getElementById("subnav").innerHTML = `<span class="cap">Configurações</span>` + [["Geral", "settings"], ["Membros", "users"], ["Conectores", "plug"], ["Chaves de API", "key"], ["Computadores", "computer", true], ["Orçamento e uso", "wallet"]]
    .map(([t, ic, on]) => `<a href="#" ${on ? 'aria-current="true"' : ""}>${I(ic, "sm")}${t}</a>`).join("") + `<a href="#" class="gone" title="Juntou com Computadores">${I("code", "sm")}Sandbox</a>`;
  const ms = machines();
  const netOpt = (v, title, d) => `<button class="opt" role="radio" aria-checked="${S.net === v}" data-net="${v}"><span class="dot"></span><span class="t"><b>${title}</b><small>${d}</small></span></button>`;
  document.getElementById("root").innerHTML = `
    <header><h1>Computadores</h1>
      <p class="lead">Onde os agentes rodam código e mexem em arquivos. Cada agente usa um: o computador na nuvem, que já vem pronto, ou um computador seu.</p></header>

    <section class="kinds" aria-label="Onde os agentes trabalham">
      <div class="kind">
        <div class="pic">${slot("cloud", 2)}</div>
        <h3>Na nuvem</h3>
        <ul><li>${I("check", "sm")}Pronto para usar, sem instalar nada.</li><li>${I("check", "sm")}A gente liga quando um agente precisa e desliga depois.</li><li>${I("check", "sm")}Não vê nada do seu computador.</li></ul>
        <div class="foot"><span class="chip"><span class="n">${count("cloud")}</span> agentes usam</span><span class="grow"></span><a class="btn ghost sm" href="#nuvem">Ajustar ${I("down", "sm")}</a></div>
      </div>
      <div class="kind">
        <div class="pic">${slot("mac", 2, ms.length ? "online" : "offline")}</div>
        <h3>No seu computador</h3>
        <ul><li>${I("check", "sm")}Um Mac seu, pelo app agentes (Windows e Linux pelo Terminal).</li><li>${I("check", "sm")}Os agentes usam só as pastas que você liberar nele.</li><li>${I("check", "sm")}Usa o Claude Code e as ferramentas que já estão lá.</li></ul>
        <div class="foot">${ms.length ? `<span class="chip ok">${I("check", "sm")}<span class="n">${ms.length}</span> conectados</span><span class="chip"><span class="n">${count("mine")}</span> agente usa</span>` : `<span class="chip">Nenhum conectado</span>`}<span class="grow"></span><button class="btn ${ms.length ? "ghost" : "primary"} sm">${I("download", "sm")}Baixar o app para Mac</button></div>
      </div>
    </section>

    <section class="card" id="nuvem">
      <div class="ch">${slot("cloud", 1)}<div class="t"><h2>Computador na nuvem</h2><p>Internet, tempo de uso e aprovação. Valem só para ele.</p></div></div>
      <div class="note">${I("info", "sm")}<span>Nos seus computadores, quem decide o que os agentes podem fazer é o <b>app agentes</b>, no próprio computador. Estas regras não mudam nada lá.</span></div>
      <div class="rowline" style="margin-top:6px"><div class="t"><b>Os agentes podem usar o computador na nuvem</b><small>Desligado, só quem tem um computador seu consegue rodar código.</small></div><button class="sw" role="switch" aria-checked="${S.cloudOn}" data-sw="cloudOn" aria-label="Usar o computador na nuvem"></button></div>
      <div class="${S.cloudOn ? "" : "off"}">
        <div class="rowline"><div class="t"><b>Internet</b><small>O que o computador na nuvem acessa lá fora.</small></div>
          <div class="opts">${netOpt("blocked", "Sem internet", "O mais seguro: ele não acessa nada fora.")}
            ${netOpt("allowlist", "Só os sites liberados", "Pacotes e as APIs que os agentes usam.")}
            ${S.net === "allowlist" ? `<div class="domains"><code>pypi.org</code><code>registry.npmjs.org</code><code>api.github.com</code><button class="btn ghost sm">${I("plus", "sm")}Adicionar site</button></div>` : ""}
            ${netOpt("open", "Qualquer site", "Chaves e segredos continuam fora dele.")}</div></div>
        <div class="rowline"><div class="t"><b>Tempo de uso por dia</b><small>Somando todos os agentes da organização.</small></div>
          <span class="stepper"><button data-step="minutes:-30" aria-label="Menos">${I("minus", "sm")}</button><output>${S.minutes} min</output><button data-step="minutes:30" aria-label="Mais">${I("plus", "sm")}</button></span></div>
        <div class="rowline"><div class="t"><b>Tempo máximo de cada comando</b><small>Um comando que passar disso é parado.</small></div>
          <span class="stepper"><button data-step="timeout:-30" aria-label="Menos">${I("minus", "sm")}</button><output>${S.timeout} s</output><button data-step="timeout:30" aria-label="Mais">${I("plus", "sm")}</button></span></div>
        <div class="rowline"><button class="ck" role="checkbox" aria-checked="${S.approval}" data-sw="approval"><span class="box">${I("check")}</span>Pedir aprovação antes de rodar código</button></div>
      </div>
    </section>

    <section class="card">
      <div class="ch"><div class="t"><h2>Seus computadores</h2><p>Conectados pelo app agentes. As pastas e ferramentas de cada um se liberam no próprio computador.</p></div><button class="btn sm">${I("download", "sm")}Baixar o app para Mac</button></div>
      ${ms.length ? `<div class="list">${ms.map((m) => `<div class="item">${slot(m.kind, 1, m.state)}<div class="t"><span class="n">${m.name} ${m.state === "online" ? `<span class="chip ok">${I("check", "sm")}Online</span>` : `<span class="chip">Offline</span>`}</span><small>${m.d}</small></div></div>`).join("")}</div>`
        : `<div class="empty">${slot("mac", 2, "offline")}<div class="t"><b>Nenhum computador seu ainda</b><span>Instale o app agentes no seu Mac e entre com a sua conta. Os agentes passam a usar as pastas que você liberar nele.</span></div></div>`}
    </section>

    <section class="card">
      <div class="ch"><div class="t"><h2>Qual computador cada agente usa</h2><p>Um por agente. Também dá para trocar na página de cada agente.</p></div></div>
      <div class="list">${Object.entries(AGENTS).map(([id, a]) => `<div class="item">${avSlot(id, 30)}<div class="t"><span class="n">${a.name}</span></div>
        <button class="uses" data-menu="${id}" aria-haspopup="menu">${`<svg class="i sm" viewBox="0 0 24 24">${P[usesIcon(S.uses[id])]}</svg>`}${usesLabel(S.uses[id])}${I("down", "sm")}</button></div>`).join("")}</div>
    </section>
    ${S.dirty ? `<div class="savebar"><span>Alterações no computador na nuvem</span><button class="btn ghost sm" data-act="discard">Descartar</button><button class="btn primary sm" data-act="save">Salvar</button></div>` : ""}`;
  for (const el of document.querySelectorAll("[data-pt]")) el.replaceWith(portrait(el.dataset.pt, Number(el.dataset.scale), el.dataset.state));
  for (const el of document.querySelectorAll("[data-av]")) el.replaceWith(avatar(el.dataset.av, Number(el.dataset.size)));
  history.replaceState(null, "", "#" + new URLSearchParams({ state: S.state, theme: th }).toString());
}
function openMenu(btn, id) {
  const r = btn.getBoundingClientRect();
  const opts = [["cloud", "Nuvem", "pronto"], ...machines().map((m) => [m.id, m.name, m.state === "online" ? "online" : "offline"])];
  document.getElementById("layer").innerHTML = `<div class="menu" role="menu" style="top:${r.bottom + scrollY + 6}px;left:${Math.max(8, r.right + scrollX - 260)}px">${opts.map(([v, l, s]) => `<button class="mi" role="menuitemradio" aria-checked="${S.uses[id] === v}" data-pick="${id}:${v}"><svg class="i sm" viewBox="0 0 24 24">${P[usesIcon(v)]}</svg>${l}<small>${s}</small></button>`).join("")}</div>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, a");
  if (!e.target.closest(".menu") && !e.target.closest("[data-menu]")) document.getElementById("layer").innerHTML = "";
  if (!b) return;
  const d = b.dataset;
  if (b.tagName === "A" && b.getAttribute("href") === "#") e.preventDefault();
  if (d.state) { S.state = d.state; render(); }
  else if (d.theme) { document.documentElement.dataset.theme = d.theme; render(); }
  else if (d.sw) { S[d.sw] = !S[d.sw]; S.dirty = true; render(); }
  else if (d.net) { S.net = d.net; S.dirty = true; render(); }
  else if (d.step) { const [k, v] = d.step.split(":"); S[k] = Math.max(k === "minutes" ? 0 : 5, S[k] + Number(v)); S.dirty = true; render(); }
  else if (d.menu) openMenu(b, d.menu);
  else if (d.pick) { const [id, v] = d.pick.split(":"); S.uses[id] = v; document.getElementById("layer").innerHTML = ""; render(); }
  else if (d.act) { S.dirty = false; render(); }
});
render();
requestAnimationFrame(frame);
tick();
</script>
