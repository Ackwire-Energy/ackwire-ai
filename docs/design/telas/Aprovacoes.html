<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprovações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: Aprovações, on the approved design system (Proposta 2) and the line of Issues.html.
  The agents who are waiting on you, live (they look up at you while they wait). Each request is a card
  with the exact action it is bound to (tool, target, values), why the agent wants it, its risk in
  neutral chips (production, irreversible), and a pixel fuse along the bottom that burns down to the
  expiry in the agent's tones. Approve (high risk: hold to approve), or refuse with a reason the agent
  learns from. After approving, the card runs (sweep, writing eyes) and lands in the history with its
  result. A details panel: the exact action, why, how the run got here, a preview (diff, commits,
  email, records), who may decide and the agent's track record as a pixel strip.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

/* ---------- design system bits ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{position:relative;overflow:hidden;font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.fc:focus-visible,.rq:focus-visible,.hr:focus-visible,.mi:focus-visible,.sug button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b:disabled{opacity:.5;cursor:default;transform:none}
.b>*{position:relative;z-index:1}
/* Hold to approve (high risk): a fill grows while pressed; let go early and nothing happens. */
.b.hold::before{content:"";position:absolute;inset:0;z-index:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 22%,transparent),color-mix(in srgb,var(--bg) 34%,transparent));transition:transform .25s var(--out)}
.b.hold.pressing::before{transform:scaleX(1);transition:transform 1.1s linear}
.b.hold.pressing{transform:scale(.97)}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.ink{color:var(--ink2)}
.chip .w{color:var(--warn)}.chip .ok{color:var(--ok)}.chip .no{color:var(--danger)}
.chip.late{background:var(--warn-soft);color:var(--warn)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Agents: the engine's body (canvas). */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .46);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.mono{font-family:"Martian Mono",ui-monospace,monospace;font-size:11.5px}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 49px)}
.app.with-panel{grid-template-columns:64px minmax(0,1fr) 440px}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}
.rail .badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.main{min-width:0;padding:26px 28px 120px;max-width:920px;width:100%;margin:0 auto}
.panel{display:none;padding:12px 12px 12px 0;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;overscroll-behavior:contain}

.hd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.hd h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.hd p{color:var(--muted);margin-top:6px;max-width:60ch}
.hd .guard{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--faint)}

/* ---------- toolbar ---------- */
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{flex:0 1 260px;min-width:0;display:flex;align-items:center;gap:9px;height:36px;padding:0 10px 0 12px;border-radius:12px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);transition:box-shadow .2s var(--out)}
.search:focus-within{box-shadow:var(--e2),0 0 0 1.5px var(--ink)}
.search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.fc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none;transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.fc:hover{box-shadow:var(--e2),var(--top)}
.fc:active{transform:scale(.96)}
.fc .n{font-weight:500;color:var(--faint);font-size:12px}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.fc[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.fc svg.i{width:14px;height:14px}

/* ---------- section heads ---------- */
.sh{display:flex;align-items:center;gap:8px;margin:0 4px 10px}
.sh h2{font-size:13px;font-weight:650;color:var(--ink2)}
.sh .n{font-size:12.5px;color:var(--faint)}
.sh .grow{flex:1}

/* ---------- the waiting agents: who is looking at you ---------- */
.waiters{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top)}
.waiters .faces{display:flex}
.waiters .faces>*{margin-left:-6px;transition:transform .2s var(--spring)}
.waiters .faces>*:first-child{margin-left:0}
.waiters .faces>*:hover{transform:translateY(-3px)}
.waiters .t{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
.waiters .t b{color:var(--ink);font-weight:600}

/* ---------- request cards ---------- */
.rqs{display:flex;flex-direction:column;gap:12px;margin-bottom:30px}
.rq{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;padding:16px 16px 18px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);cursor:pointer;outline:none;overflow:hidden;transition:transform .22s var(--spring),box-shadow .2s var(--out),opacity .3s,max-height .45s var(--out)}
.rq:hover{box-shadow:var(--e2),var(--top)}
.rq.on{box-shadow:0 0 0 2px var(--ink),var(--e2)}
.rq.new{animation:landed .8s var(--spring) both}
@keyframes landed{0%{opacity:0;transform:translateY(-10px) scale(.97)}100%{opacity:1;transform:none}}
.rq.leaving{animation:leave .5s var(--out) both}
@keyframes leave{to{opacity:0;transform:translateX(24px) scale(.98)}}
.rq .face{grid-row:1 / span 2;padding-top:2px}
.rq .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);min-width:0}
.rq .meta b{color:var(--ink2);font-weight:600}
.rq .meta .grow{flex:1}
.rq h3{font-size:17px;font-weight:650;letter-spacing:-.015em;line-height:1.3;margin-top:2px}
.rq .body{grid-column:2;display:flex;flex-direction:column;gap:12px;margin-top:8px}
/* The exact action, as the agent will run it. */
.exact{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--sunken)}
.exact .ic{width:32px;height:32px;border-radius:10px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.exact .t{flex:1;min-width:0}
.exact .t b{display:block;font-size:13.5px;font-weight:600}
.exact .kv{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--muted)}
.exact .kv span b{display:inline;font-weight:600;color:var(--ink2);font-size:12.5px}
.why{display:flex;gap:10px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.why::before{content:"";width:3px;border-radius:3px;background:var(--line2);flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.rq .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rq .acts .grow{flex:1}
.rq .acts .hint{font-size:12px;color:var(--faint)}
/* The fuse: a pixel line along the bottom that burns down to the expiry, in the agent's tones. */
canvas.fuse{position:absolute;left:0;right:0;bottom:0;width:100%;height:4px;image-rendering:pixelated;pointer-events:none}
canvas.sweep{position:absolute;left:0;right:0;bottom:0;width:100%;height:4px;image-rendering:pixelated;pointer-events:none}
/* Running after approval / just refused */
.rq.running .acts,.rq.refusing .acts{display:none}
.runline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-weight:600}
.runline::after{content:"";display:inline-block;width:6px;height:12px;border-radius:2px;background:var(--agent);animation:blinkc 1s steps(2) infinite}
@keyframes blinkc{50%{opacity:0}}
/* Refuse: an inline reason the agent reads and learns from. */
.refuse{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line2);animation:fi .25s var(--out)}
.refuse label{font-size:13px;font-weight:600;color:var(--ink2)}
.refuse .ta{display:flex;align-items:flex-start;min-height:40px;padding:0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2)}
.refuse .ta:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.refuse textarea{all:unset;flex:1;min-width:0;font-size:14px;line-height:1.5;padding:9px 0;min-height:44px;white-space:pre-wrap}
.refuse textarea::placeholder{color:var(--faint)}
.refuse .learn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.refuse .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.refuse .row .grow{flex:1}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.sug button{height:28px;padding:0 10px;border-radius:999px;border:0;background:var(--sunken);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.sug button:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 10%,transparent)}

/* ---------- history ---------- */
.hgroup{margin-bottom:18px}
.hlist{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.hr{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;outline:none;transition:background .12s}
.hr:first-child{border-top:0}
.hr:hover{background:color-mix(in srgb,var(--sunken) 45%,transparent)}
.hr.on{background:color-mix(in srgb,var(--sunken) 80%,transparent)}
.hr.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.hr.new{animation:landed .7s var(--spring) both}
.hr .tt{min-width:0}
.hr .tt b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .tt small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr .lesson{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--ink2)}
.hr .lesson svg.i{width:13px;height:13px;color:var(--faint)}
.hr .r{display:flex;align-items:center;gap:8px}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:80;min-width:220px;max-width:calc(100vw - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.mi:hover{background:rgba(127,127,127,.12)}
.msep{height:1px;margin:6px 8px;background:var(--line)}

/* ---------- details panel ---------- */
.with-panel .panel{display:block}
.pin{border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top);display:flex;flex-direction:column;animation:slidein .32s var(--spring) both;min-height:100%;position:relative}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.pin .scroll{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.ph{display:flex;align-items:center;gap:8px}
.ph .grow{flex:1}
.pwho{display:flex;align-items:center;gap:12px}
.pwho b{display:block;font-size:14px;font-weight:600}
.pwho small{display:block;font-size:12.5px;color:var(--muted)}
.pin h2{font-size:21px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.ps{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ps h3{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.ps h3 .grow{flex:1}
.ps h3 .cnt{text-transform:none;letter-spacing:0;font-weight:500}
.props{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin:0}
.props dt{color:var(--faint);font-size:12.5px;padding-top:1px}
.props dd{margin:0;color:var(--ink);word-break:break-word}
.bound{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.bound svg.i{margin-top:2px;color:var(--ink2)}
.bubble{padding:10px 12px;border-radius:4px 14px 14px 14px;background:var(--sunken);color:var(--ink2);line-height:1.55;font-size:13.5px}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2);text-decoration:none;border-radius:8px;padding:2px 4px;margin:-2px -4px}
.lnk:hover{background:rgba(127,127,127,.1)}
.lnk svg.i{width:13px;height:13px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:2px 0}

.steps li.cur{color:var(--ink);font-weight:600}
.steps li.cur .dot{background:var(--ink);color:var(--bg)}
.steps li .tm{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:500}

.files{display:flex;flex-direction:column;border-radius:14px;background:var(--sunken);overflow:hidden}
.files .f{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px}
.files .f:first-child{border-top:0}
.files .f .mono{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.files .add{color:var(--ok);font-weight:600}.files .del{color:var(--danger);font-weight:600}
.files .f .bar{display:inline-flex;gap:1px}
.files .f .bar i{width:6px;height:6px;border-radius:1.5px;background:var(--line2)}
.files .f .bar i.a{background:var(--ok)}.files .f .bar i.d{background:var(--danger)}
.files .f .who{display:inline-flex;align-items:center;gap:6px;color:var(--muted);flex:none}
.mail{border-radius:14px;background:var(--paper);box-shadow:var(--e1);overflow:hidden}
.mail .mh{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;grid-template-columns:44px 1fr;gap:2px 8px}
.mail .mh b{color:var(--ink);font-weight:600}
.mail .mb{padding:12px;font-size:13px;color:var(--ink2);line-height:1.55}
.mail .mb h4{margin:0 0 6px;font-size:15px;letter-spacing:-.01em}
.recs{border-radius:14px;background:var(--sunken);overflow:hidden;font-size:12.5px}
.recs .rr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 70px;gap:10px;padding:7px 12px;border-top:1px solid var(--line);color:var(--ink2)}
.recs .rr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recs .rr:first-child{border-top:0;color:var(--faint);font-weight:600;font-size:11.5px}
.recs .more{padding:7px 12px;border-top:1px solid var(--line);color:var(--faint)}
.deciders{display:flex;flex-direction:column;gap:8px}
.deciders .d{display:flex;align-items:center;gap:10px;font-size:13.5px}
.deciders .d small{color:var(--faint);font-size:12.5px}
canvas.track{display:block;image-rendering:pixelated}
.trackrow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.trackrow b{color:var(--ink2);font-weight:600}

.outcome small{display:block;font-size:12.5px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:none;animation:fi .2s var(--out)}

.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}

.toast .tt{flex:1;min-width:0}
.toast .tt b{display:block;font-size:14px;font-weight:600}
.toast .tt small{display:block;color:var(--muted);font-size:12.5px}
.toast.out{animation:toastout .2s var(--out) both}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}

/* ---------- empty ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:0 18px 28px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-bottom:30px}

.empty .glow canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.empty .glow .who{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:10px;animation:bob 1.8s var(--out) infinite alternate}
@keyframes bob{to{transform:translate(-50%,calc(-50% - 8px))}}
.empty>b{font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.03em}
.empty>p{color:var(--muted);max-width:50ch}
.nores{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;text-align:center;color:var(--muted)}

/* burst: pixels in the agent's tones when an approval lands */
canvas.burst{position:fixed;z-index:95;pointer-events:none;image-rendering:pixelated}

@media (max-width:720px){

  @keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .toast{width:auto}
}

    body += Pv.length ? `${S.f === "all" ? `<div class="sh"><h2>Esperando você</h2><span class="n">${Pv.length}</span></div>` : ""}<div class="rqs">${Pv.map(cardHTML).join("")}</div>`
      : S.q ? "" : `<div class="empty"><div class="glow"><canvas class="sky" aria-hidden="true"></canvas><span class="who">${avHTML("lia", 56, "done")}</span></div><b>Tudo decidido</b><p>Os agentes seguem trabalhando. Quando um precisar de você, aparece aqui e no canal.</p></div>`;
  }
  if (S.f === "pending") body += histHTML(D.filter(match).slice(0, 3), true);
  else body += histHTML(Dv, false);
  if (!Pv.length && !Dv.length && S.q) body = `<div class="nores">${I.search}<span>Nenhum pedido com “${esc(S.q)}”.</span></div>`;
  main.innerHTML = head + tools + waitersHTML + body;
  const q = $("#q");
  q.oninput = () => { S.q = q.value; const p = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  hydrate(main);
  wireHold(main);
  S.fresh.clear();
  if (S.refusing) $(`#rs-${S.refusing}`)?.focus();
  renderPanel();
}
function histHTML(list, recent = false) {
  if (!list.length) return "";
  if (recent) return `<div class="sh"><h2>Decididos há pouco</h2><span class="grow"></span><button class="b bg sm" type="button" data-f="all">Ver histórico</button></div><div class="hlist">${list.map(rowHTML).join("")}</div>`;
  const groups = [["Hoje", (r) => r.dm < 600], ["Ontem", (r) => r.dm >= 600 && r.dm < 2880], ["Antes", (r) => r.dm >= 2880]];
  return groups.map(([l, fn]) => { const xs = list.filter(fn); return xs.length ? `<section class="hgroup"><div class="sh"><h2>${l}</h2><span class="n">${xs.length}</span></div><div class="hlist">${xs.map(rowHTML).join("")}</div></section>` : ""; }).join("");
}

/* ---------- details panel ---------- */
function previewHTML(r) {
  const p = r.preview; if (!p) return "";
  if (p.t === "diff") { const add = p.files.reduce((s, f) => s + f[1], 0), del = p.files.reduce((s, f) => s + f[2], 0);
    return `<div class="ps"><h3>O que muda<span class="grow"></span><span class="cnt">${p.files.length} arquivos · <span style="color:var(--ok)">+${add}</span> <span style="color:var(--danger)">−${del}</span></span></h3><div class="files">${p.files.map(([f, a, d]) => { const n = Math.round((a / (a + d || 1)) * 5); return `<div class="f"><span class="mono">${esc(f)}</span><span class="add">+${a}</span><span class="del">−${d}</span><span class="bar" aria-hidden="true">${Array.from({ length: 5 }, (_, k) => `<i class="${a + d === 0 ? "" : k < n ? "a" : "d"}"></i>`).join("")}</span></div>`; }).join("")}</div><a class="lnk" href="#">${I.open}Abrir o PR no GitHub</a></div>`; }
  if (p.t === "commits") return `<div class="ps"><h3>O que sobe<span class="grow"></span><span class="cnt">${p.rows.length} ${p.rows.length === 1 ? "commit" : "commits"}</span></h3><div class="files">${p.rows.map(([sha, msg, who]) => `<div class="f"><span class="mono" style="flex:none;color:var(--faint)">${sha}</span><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(msg)}</span><span class="who">${AGENTS[who] ? avHTML(who, 18) : ppHTML(who, 18)}</span></div>`).join("")}</div></div>`;
  if (p.t === "email") return `<div class="ps"><h3>O email</h3><div class="mail"><div class="mh"><span>De</span><b>${esc(r.action[1][1])}</b><span>Para</span><span>${esc(r.action[0][1])}</span><span>Assunto</span><b>${esc(p.subject)}</b></div><div class="mb">${esc(p.body)}</div></div><div style="display:flex;gap:8px"><button class="b b2 sm" type="button" data-test>${I.mail}Me mandar um teste</button><button class="b bg sm" type="button">${I.open}Abrir no Drive</button></div></div>`;
  if (p.t === "rows") return `<div class="ps"><h3>O que será apagado<span class="grow"></span><span class="cnt">${p.rows.length + p.more} contatos</span></h3><div class="recs"><div class="rr">${p.head.map((h) => `<span>${h}</span>`).join("")}</div>${p.rows.map((row) => `<div class="rr">${row.map((c) => `<span>${esc(c)}</span>`).join("")}</div>`).join("")}<div class="more">e mais ${p.more}</div></div><button class="b b2 sm" type="button" style="align-self:flex-start">Baixar a lista completa (CSV)</button></div>`;
  return "";
}
function renderPanel() {
  const app = $("#app"), panel = $("#panel");
  const r = REQ.find((x) => x.id === S.open);
  app.classList.toggle("with-panel", !!r);
  if (!r) { panel.innerHTML = ""; return; }
  const ag = AGENTS[r.agent], isP = r.status === "pending", run = r.status === "running";
  const ok = [...r.track].filter((b) => b === "1").length;
  const owner = PEOPLE[ag.owner];
  panel.innerHTML = `<div class="pin"><div class="scroll">
    <div class="ph"><div class="pwho">${avHTML(r.agent, 40, modeOf(r))}<div><b>${esc(ag.name)} ${esc(r.verb)}</b><small>${esc(ag.role)} · #${esc(r.ch)} · ${ago(r.m)}</small></div></div><span class="grow"></span><button class="ib" type="button" data-pmore aria-label="Mais ações">${I.more}</button><button class="ib" type="button" data-close aria-label="Fechar">${I.x}</button></div>
    <div><h2>${esc(r.title)}</h2>${isP ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${expChip(r)}${r.tags.map(tagHTML).join("")}</div>` : ""}</div>
    ${!isP && !run ? outcomeHTML(r) : ""}
    ${run ? `<div class="outcome" style="position:relative;overflow:hidden"><span class="oi">${I.play}</span><div><b>Executando</b><small>Aprovado por você agora. ${ag.The} ${ag.name} roda exatamente a ação abaixo.</small></div><canvas class="sweep" data-a="${r.agent}" aria-hidden="true"></canvas></div>` : ""}
    <div class="ps"><h3>A ação exata</h3>
      <div class="exact" style="background:transparent;padding:0"><span class="ic">${CONNECTOR_ICON[r.conn]}</span><div class="t"><b>${esc(CONN_LABEL[r.conn])}</b></div></div>
      <dl class="props">${r.action.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      <div class="bound">${I.lock}<span>A aprovação vale só para esta ação, com estes valores. Se ${ag.The.toLowerCase()} ${ag.name} mudar qualquer coisa, ${ag.pr} precisa pedir de novo.</span></div></div>
    ${r.why ? `<div class="ps"><h3>Por que</h3><div class="bubble">${esc(r.why)}</div>${r.from ? `<a class="lnk" href="#">${r.from.t === "issue" ? I.issue : I.chat}${esc(r.from.label)}</a>` : ""}</div>` : ""}
    ${previewHTML(r)}
    ${r.steps.length ? `<div class="ps"><h3>Como chegou aqui</h3><ol class="steps">${r.steps.map(([s, tm], k) => `<li class="${k === r.steps.length - 1 && isP ? "cur" : ""}"><span class="dot">${k === r.steps.length - 1 && isP ? I.shield : I.check}</span>${esc(s)}<span class="tm">${esc(tm)}</span></li>`).join("")}</ol><a class="lnk" href="#">${I.hash}Ver a conversa no #${esc(r.ch)}</a></div>` : ""}
    <div class="ps"><h3>Histórico ${ag.to === "à" ? "da" : "do"} ${esc(ag.name)} com ${esc(KIND_LABEL[r.kind].toLowerCase())}</h3>
      <div class="trackrow"><canvas class="track" data-r="${r.id}" role="img" aria-label="${ok} de ${r.track.length} aprovados"></canvas><span><b>${ok} de ${r.track.length}</b> aprovados</span></div></div>
    <div class="ps"><h3>Quem pode decidir</h3><div class="deciders">
      <div class="d">${ppHTML("walter", 26)}<span>Você <small>· admin</small></span></div>
      <div class="d">${ppHTML(ag.owner, 26)}<span>${esc(owner.name)} <small>· responsável ${ag.to === "à" ? "pela" : "pelo"} ${esc(ag.name)}${owner.admin ? ", admin" : ""}</small></span></div>
      <small style="color:var(--faint);font-size:12.5px">Quem decidir primeiro vale. O pedido também está no #${esc(r.ch)}.</small></div></div>
  </div>
  ${isP ? `<div class="dbar">${S.refusing === r.id ? refuseHTML(r) : `<div class="row"><button class="b b2" type="button" data-refuse="${r.id}">Recusar<span class="kbd">R</span></button>${holdBtn(r, "")}</div><div class="note">${r.risk === "high" ? "Alto risco: segure o botão para confirmar." : "Aprovar roda a ação na hora."}</div>`}</div>` : ""}
  </div>`;
  hydrate(panel);
  wireHold(panel);
}
function outcomeHTML(r) {
  const ag = AGENTS[r.agent];
  if (r.status === "done") return `<div class="outcome"><span class="oi" style="color:var(--ok)">${I.check}</span><div><b>Aprovado por ${esc(nameOfP(r.by))} ${ago(r.dm)}</b><small>${esc(r.result ?? "Feito.")}</small></div></div>`;
  if (r.status === "refused") return `<div class="outcome"><span class="oi" style="color:var(--danger)">${I.x}</span><div><b>Recusado por ${esc(nameOfP(r.by))} ${ago(r.dm)}</b><small>${r.reason ? `“${esc(r.reason)}”` : "Sem motivo."}</small>${r.lesson ? `<span class="lesson">${I.bulb}<span>${esc(ag.name)} guardou: ${esc(r.lesson)}</span></span>` : ""}</div></div>`;
  if (r.status === "expired") return `<div class="outcome"><span class="oi" style="color:var(--warn)">${I.clock}</span><div><b>Expirou sem decisão</b><small>${ag.The} ${ag.name} foi ${ag.pr === "ela" ? "avisada" : "avisado"} e não fez nada.</small><div style="margin-top:10px"><button class="b b2 sm" type="button" data-again="${r.id}">${I.repeat}Pedir de novo</button></div></div></div>`;
  return `<div class="outcome"><span class="oi">${I.ban}</span><div><b>Cancelado</b><small>A execução parou antes da decisão.</small></div></div>`;
}

/* ---------- decisions ---------- */
function approve(id) {
  const r = REQ.find((x) => x.id === id); if (!r || r.status !== "pending") return;
  const el = $(`[data-rq="${id}"] .face`) || $(".pwho");
  burst(el, AGENTS[r.agent].color);
  r.status = "running"; S.refusing = null; render();
  const ag = AGENTS[r.agent];
  setTimeout(() => {
    r.status = "done"; r.by = "walter"; r.dm = 0;
    r.result = { deploy: "Deploy da 2.4.1 no ar em 1 min 12 s. Sem erro novo.", merge: "Merge feito (squash 8f3a2c1). A #128 foi para Feito.", email: "Envio começou: 1.240 na fila, 98% entregues em 3 min.", delete: "312 contatos apagados. O relatório de churn foi refeito.", rollback: "Rollback feito em 38 s. Erro voltou para 0,5%." }[r.kind];
    const card = $(`[data-rq="${id}"]`);
    const done = () => { S.fresh.add(id); render(); toast({ title: `${KIND_LABEL[r.kind]} feito`, sub: r.result, action: { label: "Ver", run: () => { S.open = id; render(); } } }); };
    if (card) { card.classList.add("leaving"); setTimeout(done, 450); } else done();
  }, 2300);
  toast({ icon: I.play, title: `${ag.The} ${ag.name} está executando`, sub: r.title });
}
function refuse(id, reason) {
  const r = REQ.find((x) => x.id === id); if (!r) return;
  const ag = AGENTS[r.agent];
  r.status = "refused"; r.by = "walter"; r.dm = 0; r.reason = reason || null;
  r.lesson = reason ? lessonOf(r, reason) : null;
  S.refusing = null;
  const card = $(`[data-rq="${id}"]`);
  const done = () => { S.fresh.add(id); render(); toast({ icon: I.x, ok: false, title: `Recusado. ${ag.The} ${ag.name} foi ${ag.pr === "ela" ? "avisada" : "avisado"}`, sub: r.lesson ? `Guardou: ${r.lesson}` : "Sem motivo, nada para aprender desta vez." }); };
  if (card) { card.classList.add("leaving"); setTimeout(done, 450); } else done();
}
function lessonOf(r, reason) {
  const k = { deploy: "deploy em produção", merge: "merge", email: "envio de email", delete: "exclusão de dados", rollback: "rollback" }[r.kind] ?? "esse tipo de ação";
  return `antes de pedir ${k}: ${reason.charAt(0).toLowerCase() + reason.slice(1).replace(/\.$/, "")}.`;
}

/* ---------- hold to approve ---------- */
function wireHold(root) {
  for (const b of $$("[data-hold]", root)) {
    let timer = null;
    const start = (e) => { if (e.button > 0) return; e.preventDefault?.(); b.classList.add("pressing"); b.querySelector("span:last-child").textContent = "Segure…"; timer = setTimeout(() => { timer = null; b.classList.remove("pressing"); approve(b.dataset.hold); }, 1100); };
    const stop = () => { if (!timer) return; clearTimeout(timer); timer = null; b.classList.remove("pressing"); b.querySelector("span:last-child").textContent = "Segure para aprovar"; };
    b.onpointerdown = start; b.onpointerup = stop; b.onpointerleave = stop; b.onpointercancel = stop;
    b.onkeydown = (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.stopPropagation(); start(e); } };
    b.onkeyup = (e) => { if (e.key === " " || e.key === "Enter") stop(); };
    b.onclick = (e) => { e.stopPropagation(); if (e.detail > 0 && !timer && b.isConnected) toast({ icon: I.shield, ok: false, title: "Segure o botão para aprovar", sub: "Ação de alto risco: um clique sozinho não basta.", ms: 2200 }); };
  }
}

/* ---------- menus ---------- */
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(anchor, html) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu glass"; m.setAttribute("role", "menu"); m.innerHTML = html;
  document.body.append(m); menuEl = m;
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth;
  m.style.left = Math.min(Math.max(12, r.right - mw), innerWidth - mw - 12) + "px"; m.style.top = r.bottom + 6 + "px";
}

/* ---------- toasts ---------- */
function toast({ icon = I.check, ok = true, title, sub = "", action, ms = 4200 }) {
  const t = document.createElement("div");
  t.className = "toast glass"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="tic ${ok ? "ok" : ""}">${icon}</span><div class="tt"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</div>${action ? `<button class="b bg sm" type="button">${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { action.run(); dismiss(t); };
  $("#toasts").append(t);
  setTimeout(() => dismiss(t), ms);
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add("out"); setTimeout(() => t.remove(), 200); }

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target;
  const r = REQ.find((x) => x.id === S.open);
  if (menuEl && menuEl.contains(t)) { const m = t.closest("[data-m]"); closeMenu(); if (m) toast({ icon: m.dataset.m === "link" ? I.link : I.hash, title: { link: "Link copiado", chat: "Abre o pedido no canal", agent: "Abre o perfil do agente" }[m.dataset.m] }); return; }
  if (menuEl && !t.closest("[data-pmore]")) closeMenu();
  const p = t.closest("[data-proto]");
  if (p) {
    if (p.dataset.proto === "empty") { S.empty = !S.empty; S.open = null; p.setAttribute("aria-pressed", S.empty); render(); }
    if (p.dataset.proto === "arrive") {
      const nx = INCOMING.shift(); if (!nx) return toast({ icon: I.shield, ok: false, title: "Sem pedidos novos na fila do protótipo" });
      S.empty = false; $('[data-proto="empty"]').setAttribute("aria-pressed", "false");
      REQ.unshift(nx); S.fresh.add(nx.id); S.f = "pending"; render();
      toast({ icon: I.shield, ok: false, title: `${AGENTS[nx.agent].name} ${nx.verb}`, sub: nx.title, action: { label: "Ver", run: () => { S.open = nx.id; render(); } } });
    }
    if (p.dataset.proto === "hour") {
      for (const x of REQ) {
        if (x.status === "pending") { x.m += 60; if (x.m >= TTL) { x.status = "expired"; x.dm = 0; x.m = TTL; S.fresh.add(x.id); toast({ icon: I.clock, ok: false, title: `O pedido ${AGENTS[x.agent].to === "à" ? "da" : "do"} ${AGENTS[x.agent].name} expirou`, sub: `${x.title}. ${AGENTS[x.agent].The} ${AGENTS[x.agent].name} foi ${AGENTS[x.agent].pr === "ela" ? "avisada" : "avisado"} e não fez nada.` }); } }
        else if (x.dm != null) x.dm += 60;
      }
      render();
    }
    return;
  }
  const f = t.closest("[data-f]"); if (f) { S.f = f.dataset.f; S.open = null; render(); return; }
  if (t.closest("[data-approve]")) { e.stopPropagation(); return approve(t.closest("[data-approve]").dataset.approve); }
  if (t.closest("[data-hold]")) return;
  const rf = t.closest("[data-refuse]"); if (rf) { S.refusing = rf.dataset.refuse; render(); $(`#panel #rs-${S.refusing}`)?.focus(); return; }
  if (t.closest("[data-cancel-refuse]")) { S.refusing = null; render(); return; }
  const sg = t.closest("[data-sug]"); if (sg) { const ta = sg.closest(".refuse").querySelector("textarea"); ta.value = sg.dataset.sug; ta.focus(); return; }
  const cr = t.closest("[data-confirm-refuse]"); if (cr) { const ta = cr.closest(".refuse").querySelector("textarea"); return refuse(cr.dataset.confirmRefuse, ta.value.trim()); }
  if (t.closest(".refuse")) return;
  const ag = t.closest("[data-again]"); if (ag) { const x = REQ.find((y) => y.id === ag.dataset.again); x.status = "pending"; x.m = 0; x.dm = null; x.cta = x.cta || `Aprovar ${KIND_LABEL[x.kind].toLowerCase()}`; x.verb = x.verb.replace("quis", "quer"); S.fresh.add(x.id); S.f = "pending"; render(); return toast({ icon: I.repeat, title: `Pedido de volta para ${AGENTS[x.agent].The.toLowerCase()} ${AGENTS[x.agent].name}`, sub: `${AGENTS[x.agent].pr === "ela" ? "Ela" : "Ele"} confere se ainda faz sentido e pede de novo.` }); }
  if (t.closest("[data-test]")) return toast({ icon: I.mail, title: "Teste enviado para o seu email", sub: "Só para você; os clientes não recebem." });
  if (t.closest("[data-pmore]")) { if (menuEl) return closeMenu(); openMenu(t.closest("[data-pmore]"), `<button class="mi" type="button" data-m="chat">${I.hash}<span>Ver no #${esc(r.ch)}</span></button><button class="mi" type="button" data-m="agent">${avHTML(r.agent, 18)}<span>Perfil ${AGENTS[r.agent].to === "à" ? "da" : "do"} ${AGENTS[r.agent].name}</span></button><button class="mi" type="button" data-m="link">${I.link}<span>Copiar link</span></button>`); return hydrate(menuEl); }
  if (t.closest("[data-close]") || t.id === "scrim") { S.open = null; S.refusing = null; render(); return; }
  if (t.closest("button,a,textarea,input")) { if (!t.closest("[data-open]")) return; }
  const op = t.closest("[data-open]"); if (op) { const id = op.dataset.open; S.open = S.open === id && !t.closest("button") ? null : id; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (menuEl) return closeMenu(); if (S.refusing) { S.refusing = null; return render(); } if (S.open) { S.open = null; render(); } return; }
  const typing = e.target.closest?.("input,textarea,[contenteditable]");
  if (typing) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && S.refusing) refuse(S.refusing, e.target.value.trim()); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const cards = $$(".rq");
  const cur = e.target.closest?.(".rq") || (S.open && $(`[data-rq="${S.open}"]`));
  if (e.key === "/") { e.preventDefault(); return $("#q")?.focus(); }
  if (e.key === "j" || e.key === "k") { e.preventDefault(); const i = cards.indexOf(cur); const n = cards[Math.max(0, Math.min(cards.length - 1, i < 0 ? 0 : i + (e.key === "j" ? 1 : -1)))]; n?.focus(); if (S.open && n) { S.open = n.dataset.rq; render(); $(`[data-rq="${S.open}"]`)?.focus(); } return; }
  const id = cur?.dataset.rq || S.open; const r = REQ.find((x) => x.id === id);
  if (!r || r.status !== "pending") { if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".hr")) { e.preventDefault(); e.target.click(); } return; }
  if (e.key === "a" || e.key === "A") { e.preventDefault(); if (r.risk === "high") { S.open = r.id; render(); $("#panel [data-hold]")?.focus(); toast({ icon: I.shield, ok: false, title: "Alto risco: segure o botão", sub: "Segure espaço ou o botão por um segundo.", ms: 2400 }); } else approve(r.id); }
  if (e.key === "r" || e.key === "R") { e.preventDefault(); S.refusing = r.id; render(); ($(`#panel #rs-${r.id}`) || $(`#rs-${r.id}`))?.focus(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".rq")) { e.preventDefault(); e.target.click(); }
});

/* ---------- theme / segmented ---------- */
function seg(el, value, on) {
  if (!el) return;
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); if (!b) return; pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });

$("#logo").append(makeAgent("lia", 30));
render();
