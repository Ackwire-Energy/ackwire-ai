<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarefa longa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: Tarefa longa (one long task in a chat thread), on the approved design system (Proposta 2,
  Componentes.dc.html). The lighter sibling of Missao.html: no mission, no phases, no gates. In #produto
  Walter asks "@dev refaz a tela de onboarding do web com o Claude Code no meu Mac, quero algo mais leve".
  Dev drives Claude Code on "MacBook do Walter" as a background command (minutes); Dev is woken when it
  finishes and never blocks the thread. One Claude Code session per thread (claude -p --resume <thread>),
  so every iteration continues the same context.
  The page is a guided story (prototype bar: steps + "Próximo"):
    1 Pedido: the request and Dev's live work card (computer, session, ticking time, branch, the last
      streamed line with the agent's cursor, expandable steps, "Parar"); "te aviso quando terminar".
    2 Iteração 1: a notification-like reply with a result card (fake web onboarding screens in CSS,
      summary, diff stats, preview link, quick reply chips; free text in the composer).
    3 Iteração 2: feedback, "continuando a sessão", a version strip (v1 · v2) and a compare toggle
      (one version, side by side, before/after slider).
    4 Pedido no meio: a message sent mid-run is queued for this run ("na fila desta rodada"); the work
      card offers "Incluir nesta rodada" (default) or "Depois desta". No parallel run.
    5 Pergunta: iteração 3 plus one inline question with choices (ask_user style); a single, low-key
      "Transformar em missão" hint (also in ⋯), linking to Missao.html.
    6 Aprovado: PR #440, merge as a human approval card, versions saved to the Drive, total time, the
      session kept for later adjustments. No cost here: Claude Code runs on the person's own plan.
  The thread header carries a compact state (iteração, tempo); the sidebar shows #produto with the
  agent's running ring. Mono only for branches, paths, commands, logs. Agents come from
  packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --scr:#fbfbf9;--scr-ink:#2a2a28;
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);--scr:#141413;--scr-ink:#d6d6d2;color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
code,.mono{font-family:var(--mono);font-size:.84em;letter-spacing:-.01em}

/* ---------- design system bits (same as Missao.html) ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent;text-decoration:none}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.fc:focus-visible,.seg button:focus-visible,.mi:focus-visible,.opt:focus-visible,.art:focus-visible,.vs:focus-visible,.workh:focus-visible,.sit:focus-visible,.react:focus-visible,.pill:focus-visible,.send:focus-visible,.ba .hd:focus-visible,.stp:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.b:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.seg.sm button{height:26px;font-size:12px;padding:0 10px;gap:6px}
.seg.sm .pill{height:26px}
.seg.sm svg.i{width:13px;height:13px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.ink{background:var(--ink);color:var(--bg)}
.chip.okc{color:var(--ok)}
.chip.wrn{color:var(--warn)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes blinkc{50%{opacity:0}}
.spin{animation:spin 1.2s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}

/* Agents: the engine's body (canvas). People: a circle with the initial. */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .46);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);position:relative;z-index:20;background:var(--bg)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.steps::-webkit-scrollbar{display:none}
.stp{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 6px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none;transition:background .15s,color .15s}
.stp .n{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--sunken);color:var(--faint)}
.stp:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.stp[aria-current="step"]{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.stp[aria-current="step"] .n,.stp.past .n{background:var(--ink);color:var(--bg)}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:64px 248px minmax(0,1fr);min-height:calc(100vh - 49px)}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
.rail .logo{margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}

/* sidebar (context only) */
.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:1px;position:sticky;top:0;height:100vh;overflow:auto}
.ws{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;font-weight:650;font-size:15px;letter-spacing:-.01em}
.ws .grow{flex:1}
.sgrp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:14px 8px 4px}
.sit{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:550;border:0;background:transparent;width:100%;cursor:pointer;text-align:left;white-space:nowrap}
.sit:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.sit[aria-current="page"]{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.sit .hs{width:16px;display:inline-flex;justify-content:center;color:var(--faint);font-weight:500}
.sit .end{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);font-weight:600}
.sit.unread{color:var(--ink);font-weight:650}

/* ---------- thread ---------- */
.thread{min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - 49px)}
.th{position:sticky;top:0;z-index:10;padding:14px 24px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--line)}
.th-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.crumb{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--faint)}
.crumb button{border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;padding:2px 6px;border-radius:7px;margin-left:-6px}
.crumb button:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.th h1{font-family:var(--display);font-weight:300;font-size:clamp(22px,3vw,28px);letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.th .acts{display:flex;gap:6px;align-items:center;grid-row:1 / 3;grid-column:2}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;grid-column:1 / -1}
.mc{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 8px;border-radius:999px;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;max-width:100%;min-width:0}
.mc svg.i{width:14px;height:14px;color:var(--muted)}
.mc .sep{color:var(--faint);font-weight:500}
.mc small{font-weight:500;color:var(--faint);font-size:12px}
.mc .tx{overflow:hidden;text-overflow:ellipsis}
.mc.state{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mc.state svg.i{color:var(--bg)}
.feed{flex:1;width:100%;max-width:860px;margin:0 auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:2px}

/* messages (Componentes.dc.html) */
.msg{display:flex;gap:14px;padding:10px 12px;border-radius:14px;transition:background .15s;animation:fi .3s var(--out) both;min-width:0}
.msg:hover{background:rgba(127,127,127,.05)}
.msg .mav{width:34px;flex:none;display:flex;justify-content:center;padding-top:2px}
.msg .pp{--s:34px}
.mb{flex:1;min-width:0}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mr{font-size:12px;color:var(--faint)}
.mt{font-size:12px;color:var(--faint)}
.mx{font-size:15px;line-height:1.62;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.mx b{color:var(--ink);font-weight:650}
.mx .at{font-weight:600;color:var(--ink)}
.mx code{font-size:12px;padding:1px 5px;border-radius:6px;background:var(--sunken)}
.mnote{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted)}
.mnote svg.i{width:12px;height:12px}
.qmark{display:inline-flex;align-items:center;gap:6px;margin-top:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--ink2);animation:popin .25s var(--spring) both}
.qmark svg.i{width:13px;height:13px}
.replies{display:flex;align-items:center;gap:10px;margin:6px 12px 6px 60px;font-size:12.5px;color:var(--faint);font-weight:600}
.replies::after{content:"";flex:1;height:1px;background:var(--line)}
.gap{display:flex;align-items:center;gap:10px;margin:12px 12px;font-size:12px;color:var(--faint);font-weight:600}
.gap::before,.gap::after{content:"";flex:1;height:1px;background:var(--line)}
.gap svg.i{width:13px;height:13px}
.later{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.later svg.i{width:14px;height:14px;color:var(--faint)}
.think .mx{color:var(--faint);font-size:14px}
.shimmer{background:linear-gradient(90deg,var(--faint) 0%,var(--ink2) 50%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.reacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.react{height:26px;padding:0 9px;border-radius:999px;border:0;background:var(--sunken);font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:transform .2s var(--spring),background .15s,color .15s}
.react:hover{transform:translateY(-1px)}
.react.on{background:var(--ink);color:var(--bg)}
.react svg.i{width:13px;height:13px}

/* ---------- the live work card ---------- */
.wk{margin-top:10px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden;position:relative;max-width:640px}
.wk-h{display:flex;align-items:center;gap:10px;padding:12px 12px 0 14px}
.wk-h .ic{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.wk-h .t{flex:1;min-width:0}
.wk-h b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-h small{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--faint);font-size:12px}
.wk-h small .tick{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.wk-m{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0 54px}
.wk-m code{font-size:10.5px;color:var(--ink2)}
.wk-last{display:flex;align-items:center;gap:8px;margin:10px 14px 0;padding:8px 10px;border-radius:10px;background:var(--sunken);min-width:0}
.wk-last .tx{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);min-width:0}
.wk-last.fresh .tx{animation:fi .35s var(--out)}
.cur{display:inline-block;width:7px;height:13px;background:var(--agent);vertical-align:-2px;animation:blinkc 1s steps(1) infinite;flex:none}
.workh{display:flex;align-items:center;gap:10px;width:100%;margin-top:6px;padding:9px 14px;border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.workh:hover{background:rgba(127,127,127,.06)}
.workh b{color:var(--ink2);font-weight:600}
.workh .chev{transition:transform .25s var(--out)}
.workh[aria-expanded="true"] .chev{transform:rotate(90deg)}
.wsteps{padding:0 0 6px}
.wstep{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 16px;font-size:13px;color:var(--ink2);animation:fi .25s var(--out) both;min-width:0}
.wstep>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wstep .t{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap;padding-left:8px}
.wstep.now{color:var(--ink)}
.wstep.todo{color:var(--faint)}
.tk{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);flex:none}
.tk svg.i{width:11px;height:11px;stroke-width:2.4}
.tk.now{background:transparent;color:var(--muted)}
.tk.now svg.i{width:16px;height:16px}
.tk.todo{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.wk-q{margin:4px 12px 0;padding:10px 12px;border-radius:12px;background:var(--sunken);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;animation:popin .28s var(--spring) both}
.wk-q .t{flex:1 1 180px;min-width:0;font-size:13px;color:var(--ink2)}
.wk-q .t b{font-weight:650;color:var(--ink)}
.wk-q .t small{display:block;color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-q .ic{width:26px;height:26px;border-radius:8px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.wk-f{display:flex;align-items:center;gap:6px;padding:8px 12px 14px 14px;flex-wrap:wrap}
.wk-f .grow{flex:1}
.wk-f .hint{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.wk-f .hint svg.i{width:13px;height:13px}
.wk.done .wk-f{padding-top:2px}
.wk.mini{max-width:460px}
.wk.mini .wk-h{padding:10px 12px 10px 12px}
canvas.strip{position:absolute;left:0;right:0;bottom:0;width:100%;height:3px;image-rendering:pixelated;pointer-events:none}
.log{margin:0 12px 6px;padding:12px 14px;border-radius:12px;background:var(--sunken);font-family:var(--mono);font-size:11px;line-height:1.8;color:var(--ink2);max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.log .ln{display:block;animation:fi .25s var(--out) both}
.log .cmd{color:var(--ink)}
.log .dim{color:var(--faint)}
.log .okl{color:var(--ok)}

/* ---------- result card (an iteration) ---------- */
.card{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:16px;position:relative;margin-top:10px;max-width:720px}
.rs-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rs-h .grow{flex:1}
.card h3{font-size:16.5px;font-weight:650;letter-spacing:-.015em;line-height:1.3;margin-top:10px}
.card .lead{color:var(--muted);font-size:13.5px;margin-top:3px}
.vstrip{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding:2px}
.vstrip::-webkit-scrollbar{display:none}
.vs{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:12px;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;flex:none;text-align:left;transition:box-shadow .15s,transform .18s var(--spring)}
.vs:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.vs:active{transform:scale(.97)}
.vs[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.vs .th2{width:62px;border-radius:7px;overflow:hidden;flex:none}
.vs b{display:block;font-size:13px;font-weight:650}
.vs small{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap}
.vs .arrow{color:var(--faint);align-self:center}
.stage{margin-top:12px;border-radius:16px;background:var(--sunken);padding:14px;position:relative;overflow:hidden}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.shot{min-width:0;display:flex;flex-direction:column;gap:6px}
.shot small{font-size:11.5px;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:6px}
.sbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ba{position:relative;max-width:520px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize;--p:50%}
.ba .lay{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.ba .hd{position:absolute;top:-6px;bottom:-6px;left:var(--p);width:0;outline:none;border:0;padding:0;background:transparent;cursor:ew-resize}
.ba .hd::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--ink);border-radius:2px}
.ba .hd::after{content:"";position:absolute;top:50%;left:-14px;width:28px;height:28px;margin-top:-14px;border-radius:10px;background:var(--raised);box-shadow:var(--e2),var(--top)}
.ba .hd svg.i{position:absolute;top:50%;left:-8px;margin-top:-8px;z-index:1;color:var(--ink2)}
.ba .hd:focus-visible::after{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.ba .tag{position:absolute;top:8px;z-index:2;pointer-events:none}
.ba .tag.l{left:8px}
.ba .tag.r{right:8px}
.stage .cap{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--faint)}
.stage .cap .grow{flex:1}
.sum{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--ink2)}
.sum li{display:flex;gap:9px;align-items:flex-start}
.sum li svg.i{width:15px;height:15px;color:var(--faint);margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.where-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--sunken);font-size:13.5px;min-width:0;flex:1 1 220px;border:0;text-align:left;cursor:pointer;transition:background .15s}
button.where-row:hover{background:color-mix(in srgb,var(--sunken) 70%,var(--line2))}
.where-row .ic{width:28px;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.where-row .t{flex:1;min-width:0}
.where-row b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-row small{display:block;color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-row small code{font-size:10.5px}
.where-row>svg.i{color:var(--faint)}
.dstat{font-variant-numeric:tabular-nums}
.dstat .a{color:var(--ok);font-weight:650}
.dstat .r{color:var(--danger);font-weight:650}
.qr-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}
.qr-row .hint{font-size:12.5px;color:var(--faint);margin-left:4px}
.fc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none;transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.fc:hover{box-shadow:var(--e2),var(--top)}
.fc:active{transform:scale(.96)}
.fc svg.i{width:14px;height:14px;color:var(--muted)}
.mhint{display:flex;align-items:center;gap:10px;margin:8px 0 0;padding:8px 8px 8px 12px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--muted);max-width:720px;flex-wrap:wrap;animation:fi .4s var(--out) both}
.mhint>svg.i{color:var(--faint)}
.mhint .t{flex:1 1 240px;min-width:0}

/* fake web onboarding screens: everything in container units so they scale to any slot */
.web{container-type:inline-size;width:100%;aspect-ratio:16/10;border-radius:9px;background:var(--scr);color:var(--scr-ink);box-shadow:0 0 0 1px var(--line2),0 10px 24px -14px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;position:relative}
.web .wbar{height:5.2cqw;display:flex;align-items:center;gap:1.2cqw;padding:0 3cqw;background:color-mix(in srgb,currentColor 6%,transparent);flex:none}
.web .wbar i{width:1.6cqw;height:1.6cqw;border-radius:.5cqw;background:color-mix(in srgb,currentColor 20%,transparent)}
.web .wbar .url{margin-left:4cqw;height:2.4cqw;width:38%;border-radius:2cqw;background:color-mix(in srgb,currentColor 9%,transparent)}
.web .wpg{flex:1;display:flex;flex-direction:column;padding:var(--pad,4cqw 12cqw 3cqw);gap:var(--gap,1.6cqw);position:relative;min-height:0}
.web .v2{--pad:5cqw 17cqw 4cqw;--gap:2.4cqw}
.web .v3{--pad:5cqw 21cqw 4cqw;--gap:3.2cqw}
.web .wstp{display:flex;gap:1.2cqw;position:relative;z-index:1}
.web .wstp i{flex:1;height:.9cqw;border-radius:1cqw;background:color-mix(in srgb,currentColor 12%,transparent)}
.web .wstp i.on{background:currentColor}
.web .wt{height:3.2cqw;width:52%;border-radius:.8cqw;background:color-mix(in srgb,currentColor 78%,transparent);position:relative;z-index:1}
.web .v3 .wt{height:3.6cqw}
.web .wl{height:1.3cqw;border-radius:1cqw;background:color-mix(in srgb,currentColor 16%,transparent);position:relative;z-index:1}
.web .wl.s{width:62%}
.web .wl.m{width:80%}
.web .wi{height:5.6cqw;border-radius:1.4cqw;box-shadow:inset 0 0 0 .3cqw color-mix(in srgb,currentColor 16%,transparent);display:flex;align-items:center;padding:0 2cqw;flex:none}
.web .wi::before{content:"";height:1.2cqw;width:34%;border-radius:1cqw;background:color-mix(in srgb,currentColor 18%,transparent)}
.web .wrow{display:flex;gap:1.6cqw}
.web .wrow .wi{flex:1}
.web .wg{display:grid;grid-template-columns:repeat(var(--c,3),minmax(0,1fr));gap:1.2cqw}
.web .wg i{height:var(--th,5.4cqw);border-radius:1.4cqw;box-shadow:inset 0 0 0 .3cqw color-mix(in srgb,currentColor 12%,transparent);display:flex;align-items:center;gap:1cqw;padding:0 1.4cqw}
.web .wg i::before{content:"";width:2.4cqw;height:2.4cqw;border-radius:.7cqw;background:color-mix(in srgb,currentColor 22%,transparent);flex:none}
.web .wg i::after{content:"";height:1cqw;flex:1;border-radius:1cqw;background:color-mix(in srgb,currentColor 14%,transparent)}
.web .wimp{height:7cqw;border-radius:1.4cqw;border:.3cqw dashed color-mix(in srgb,currentColor 22%,transparent);display:flex;align-items:center;gap:1.4cqw;padding:0 2cqw;flex:none}
.web .wimp::before{content:"";width:3cqw;height:3cqw;border-radius:.8cqw;background:color-mix(in srgb,currentColor 26%,transparent)}
.web .wimp::after{content:"";height:1.2cqw;width:40%;border-radius:1cqw;background:color-mix(in srgb,currentColor 18%,transparent)}
.web .wb{margin-top:auto;height:5.6cqw;width:30%;border-radius:1.4cqw;background:currentColor;align-self:flex-start;flex:none}
.web .wb.ghost{width:14%;height:4cqw;align-self:flex-end;background:transparent;box-shadow:inset 0 0 0 .25cqw color-mix(in srgb,currentColor 12%,transparent)}
.web .wlinks{display:flex;gap:2cqw}
.web .wlinks i{height:1.1cqw;width:12%;border-radius:1cqw;background:color-mix(in srgb,currentColor 12%,transparent)}
.web .wsky{position:absolute;left:0;right:0;top:0;height:34%;overflow:hidden}
.web .wsky canvas.wsk{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.web .wsky .agw{position:absolute;right:10%;top:28%}
.web .wsky canvas.av{width:7cqw !important;height:7cqw !important}
.web .hassky{padding-top:13cqw}
.web.sm .wpg{padding:3cqw 10cqw}

/* ---------- inline question (ask_user) ---------- */
.q-tags{display:flex;flex-wrap:wrap;gap:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}
.opt{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border-radius:16px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;transition:box-shadow .18s var(--out),transform .2s var(--spring),background .15s}
.opt:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.opt:active{transform:scale(.985)}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:color-mix(in srgb,var(--sunken) 40%,var(--raised))}
.opt .top{display:flex;align-items:flex-start;gap:10px}
.opt .rd{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px;box-shadow:inset 0 0 0 1.5px var(--line2);transition:box-shadow .2s var(--spring)}
.opt[aria-checked="true"] .rd{box-shadow:inset 0 0 0 5.5px var(--ink)}
.opt b{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em}
.opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.inp{display:flex;align-items:center;gap:9px;min-height:40px;padding:0 6px 0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s;min-width:0;margin-top:10px}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp input{all:unset;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.inp input::placeholder{color:var(--faint)}
.q-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.q-f .grow{flex:1}
.q-f .hint{font-size:12.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.answered{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--sunken);font-size:13.5px;color:var(--ink2);animation:fi .3s var(--out) both}
.answered .pp{--s:22px}
.answered b{font-weight:650;color:var(--ink)}

/* ---------- final card ---------- */
.apv{margin-top:12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line2);padding:14px;position:relative;overflow:hidden}
.apv .ah{display:flex;align-items:flex-start;gap:12px}
.apv .ah .ic{width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.apv .ah .t{flex:1;min-width:0}
.apv .ah b{display:block;font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.apv .ah small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.apv .ah small code{font-size:10.5px}
.apv .stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--raised) 88%,transparent);font-weight:650;font-size:15px;animation:fi .2s var(--out) both;z-index:2}
.apv .stamp .ok{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
.diff{margin-top:12px;border-radius:12px;background:var(--sunken);padding:12px;font-family:var(--mono);font-size:10.5px;line-height:1.8;color:var(--muted);overflow:hidden;animation:fi .25s var(--out) both}
.diff div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diff .a{color:var(--ok)}
.diff .r{color:var(--danger)}
.arts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.art{border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:6px;cursor:pointer;transition:transform .22s var(--spring),box-shadow .2s var(--out);text-align:left;border:0;display:flex;flex-direction:column;min-width:0}
.art:hover{transform:translateY(-2px);box-shadow:var(--e2),var(--top)}
.art .pv{border-radius:11px;background:var(--sunken);padding:10px 10px 0;overflow:hidden}
.art .pv .web{border-radius:7px 7px 0 0;aspect-ratio:16/8.5}
.art .bd{padding:8px 6px 4px;min-width:0}
.art .bd b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .bd small{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tot div{padding:10px 12px;border-radius:12px;background:var(--sunken);min-width:0}
.tot small{display:block;font-size:11.5px;color:var(--faint);font-weight:600}
.tot b{display:block;font-size:17px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tot span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sess>svg.i{color:var(--faint)}
.sess code{font-size:10.5px;padding:2px 6px;border-radius:6px;background:var(--sunken);color:var(--ink2)}
.sess .t{flex:1 1 240px;min-width:0}

/* ---------- composer (the center of the app) ---------- */
.cwrap{position:sticky;bottom:0;z-index:9;padding:10px 24px 18px;background:linear-gradient(to bottom,transparent,var(--bg) 28%)}
.composer{max-width:812px;margin:0 auto;border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);transition:box-shadow .2s var(--out);position:relative}
.composer:focus-within{box-shadow:var(--e3),var(--top)}
.composer textarea{display:block;width:100%;border:0;outline:none;background:transparent;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);padding:14px 18px 4px;resize:none;min-height:46px;max-height:160px}
.composer textarea::placeholder{color:var(--faint)}
.cbusy{display:flex;align-items:center;gap:8px;padding:10px 16px 0;font-size:12.5px;color:var(--muted)}
.cbusy svg.i{width:13px;height:13px}
.ctools{display:flex;align-items:center;gap:6px;padding:6px 10px 10px 12px;min-width:0}
.ctools .pills{display:flex;gap:6px;min-width:0;overflow-x:auto;scrollbar-width:none}
.ctools .pills::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunken);color:var(--ink2);border:0;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap;flex:none}
.pill.np{padding-left:9px}
.pill svg.i{width:13px;height:13px;color:var(--muted)}
.pill:hover{background:rgba(127,127,127,.18)}
.send{margin-left:auto;height:34px;padding:0 12px;border-radius:11px;border:0;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s var(--spring);flex:none}
.send.off{background:var(--sunken);color:var(--faint);width:34px;padding:0;justify-content:center;cursor:default}
.send.on{background:var(--ink);color:var(--bg)}
.send .kbd{background:rgba(255,255,255,.18);box-shadow:none}
.pop{position:absolute;left:12px;bottom:calc(100% + 10px);width:340px;max-width:calc(100% - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both;transform-origin:bottom left;z-index:3}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:80;min-width:240px;max-width:calc(100vw - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;text-decoration:none}
.mi:hover,.mi.on{background:rgba(127,127,127,.12)}
.mi .sub{color:var(--faint);font-size:12.5px;margin-left:auto;padding-left:10px;white-space:nowrap}
.mi.danger{color:var(--danger)}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.mgroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px 4px}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:16px;width:380px;max-width:calc(100vw - 24px);animation:popin .25s var(--spring) both}
.toast .tic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sunken);color:var(--ink2)}
.toast .tic.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.toast .tt{flex:1;min-width:0}
.toast .tt b{display:block;font-size:14px;font-weight:600}
.toast .tt small{display:block;color:var(--muted);font-size:12.5px}
.toast .tt code{font-size:11px}
.toast.out{animation:toastout .2s var(--out) both}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .app{grid-template-columns:64px minmax(0,1fr)}
  .side{display:none}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .th{padding:12px 16px 10px}
  .feed{padding:12px 4px 16px}
  .msg{gap:10px;padding:10px 12px}
  .msg .mav{width:30px}
  .msg .pp{--s:30px}
  .replies{margin-left:52px}
  .cwrap{padding:8px 12px 12px}
  .card{padding:12px}
  .stage{padding:10px}
  .gal{grid-template-columns:repeat(3,minmax(160px,1fr));overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:0 10px}
  .gal::-webkit-scrollbar{display:none}
  .sbs{gap:8px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .arts{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .art .bd small{display:none}

    const pal = d.o.pal().map(u32), L = pal.length - 1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let f = d.o.f(x / w, y / h, t); f = f < 0 ? 0 : f > 1 ? 1 : f;
      const s2 = f * L, b = s2 | 0, idx = s2 - b > BAYER[((y & 3) << 2) | (x & 3)] ? b + 1 : b;
      d.buf[y * w + x] = pal[idx > L ? L : idx];
    }
    d.ctx.putImageData(d.img, 0, 0);
  }

/* ---------- render ---------- */
function render(opts = {}) {

  $("#feed").innerHTML = feedHTML();
  $("#steps").innerHTML = stepsHTML();
  const nx = $("#next"); const last = S.step === STEPS.length - 1;
  nx.disabled = last && S.merged; nx.textContent = last ? (S.merged ? "Fim" : "Aprovar merge") : "Próximo";
  renderComposer();
  hydrate($("#th")); hydrate($("#side")); hydrate($("#feed"));
  for (const el of $$("[data-qseg]")) seg(el, S.queueMode, (v) => { S.queueMode = v; render(); });
  for (const el of $$("[data-vseg]")) { const it = +el.dataset.vseg; seg(el, S.view[it], (v) => { S.view[it] = v; if (v !== "view" && S.sel[it] === it) S.sel[it] = it - 1; if (v === "view") S.sel[it] = it; replaceRes(it); }); }

}
function renderComposer() {

  const ta = $("#draft");

    const before = S.draft.startsWith("/"), on = S.draft.trim().length > 0;
    S.draft = ta.value;
    if (before !== S.draft.startsWith("/") || on !== (S.draft.trim().length > 0)) { const pos = ta.selectionStart; renderComposer(); const t2 = $("#draft"); t2.focus(); t2.setSelectionRange(pos, pos); }
    autoGrow();

  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } if (e.key === "Escape" && S.draft.startsWith("/")) { S.draft = ""; renderComposer(); $("#draft").focus(); } };

  if (had) ta.focus();
}
function autoGrow() { const ta = $("#draft"); if (!ta) return; ta.style.height = "auto"; ta.style.height = Math.min(160, ta.scrollHeight) + "px"; }
function replaceWork(it) {
  const el = $(`[data-work="${it}"]`); if (!el) return;
  const tmp = document.createElement("div"); tmp.innerHTML = workHTML(it);
  const nw = tmp.firstElementChild; el.replaceWith(nw); hydrate(nw);
  for (const s of $$("[data-qseg]", nw)) seg(s, S.queueMode, (v) => { S.queueMode = v; render(); });

}
function replaceRes(it) {

  st.innerHTML = stageHTML(it); hydrate(st);

}
function wireQuestion() {
  const qo = $("#qother"); if (!qo) return;
  qo.oninput = () => { S.other = qo.value; if (S.other.trim()) S.pick = null; for (const o of $$("[data-question] .opt")) o.setAttribute("aria-checked", o.dataset.pick === S.pick); const b = $("[data-answer]"); b.disabled = !(S.pick || S.other.trim()); b.innerHTML = `${I.check}${S.other.trim() ? "Responder" : S.pick ? `Responder: ${esc(QUESTION.options.find((o) => o.k === S.pick).t)}` : "Escolha uma opção"}`; };
  qo.onkeydown = (e) => { if (e.key === "Enter" && S.other.trim()) answer(); };
}

/* ---------- story ---------- */
function goStep(n, animate = true) {
  clearTimers();
  const fwd = n === S.step + 1;
  S.step = n;
  S.run2done = n > 2; S.w4 = n > 3;
  if (n < 4) { S.answered = null; S.pick = null; S.other = ""; }
  if (n === 5 && !S.answered) S.answered = { k: "later" };
  if (n < 5) { S.merged = false; S.diffOpen = false; }
  if (n < 3) S.queueMode = "include";
  S.extra = S.extra.filter((e) => e.step < n);
  S.wopen = {}; S.logOpen = {};
  for (const it of [1, 2, 3]) { S.prog[it] = ITS[it].start; S.li[it] = ITS[it].start + 1; S.started[it] = performance.now(); }
  const thinks = [0, 2, 3, 5].includes(n) && animate && fwd;
  S.hold = thinks;
  render({ scroll: true });
  if (thinks) later(1300, () => { S.hold = false; for (const it of [1, 2, 3]) S.started[it] = performance.now(); render({ scroll: true }); afterStart(n); });
  else afterStart(n, !fwd);
  if (n === 1 && fwd) toast({ icon: avIcon(), title: "Dev terminou a iteração 1", sub: "Na thread do #produto: prints, diff e preview.", action: { label: "Ver", run: () => scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }) } });
  if (n === 4 && fwd) toast({ icon: avIcon(), title: "Iteração 3 pronta", sub: "E uma pergunta para você antes de fechar." });
}
function afterStart(n, jump = false) {
  if (n === 2 && !S.run2done) later(jump ? 3500 : 6500, finishRun2);
  if (n === 3 && !S.w4) later(2600, () => { S.w4 = true; render({ scroll: true }); toast({ icon: I.queue, ok: false, title: "Mensagem na fila desta rodada", sub: "Dev não abre outra rodada: inclui o pedido na sessão que está rodando." }); });
}
function finishRun2() {
  S.run2done = true; render({ scroll: true });
  toast({ icon: avIcon(), title: "Dev terminou a iteração 2", sub: "Com a comparação v1 · v2." });
}
const avIcon = () => I.bell;
function next() {
  const s = S.step;
  if (s === 0 && S.hold) return;
  if (s === 2 && !S.run2done && !S.hold) { clearTimers(); return finishRun2(); }
  if (s === 3 && !S.w4 && !S.hold) { clearTimers(); S.w4 = true; render({ scroll: true }); return; }
  if (s === 4 && !S.answered) { S.pick = S.pick || "later"; return answer(); }
  if (s === 5) return merge();
  if (s < STEPS.length - 1) goStep(s + 1);
}
function answer() {
  if (S.answered) return;
  S.answered = S.other.trim() ? { k: "other", text: S.other.trim() } : { k: S.pick || "later" };
  render({ scroll: true });
  toast({ icon: I.resume, title: "Resposta enviada para a sessão", sub: "Dev continua de onde parou." });
}
function merge() {
  if (S.merged || S.mergeBusy) return;
  const card = $("[data-apv]");
  S.mergeBusy = true;
  if (card && !REDUCED) card.insertAdjacentHTML("beforeend", `<div class="stamp"><span class="ok">${I.check}</span>Merge aprovado</div>`);
  later(700, () => { S.merged = true; S.mergeBusy = false; render(); toast({ icon: I.merge, title: "PR #440 entrou na main", sub: "Aprovado por você. A sessão fica guardada para ajustes." }); });
}
const hhmm = () => { const d = new Date(2026, 9, 16, 10, 0); const m = [4, 10, 24, 31, 37, 42][S.step]; d.setMinutes(m); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
function send(textArg) {
  const text = (textArg ?? S.draft).trim(); if (!text) return;
  S.draft = "";
  if (text.startsWith("/")) { renderComposer(); return runCmd(text.slice(1).split(" ")[0]); }
  const run = runningIt();
  if (run) {
    S.extra.push({ step: S.step, it: run, text, time: hhmm() });
    render({ scroll: true });
    return toast({ icon: I.queue, ok: false, title: "Na fila desta rodada", sub: "A mesma sessão recebe o pedido na próxima pausa." });
  }
  if (S.step === 1) { S.w2 = text; return goStep(2); }
  if (S.step === 2) { S.w3 = text; return goStep(3); }
  if (S.step === 4 && !S.answered) { S.other = text; return answer(); }
  if (S.step === 4 && /aprov|pode|manda|ok/i.test(text)) { S.w5 = text; return goStep(5); }
  S.extra.push({ step: S.step, text, time: hhmm() });
  render({ scroll: true });
  toast({ icon: I.resume, ok: false, title: "Dev continua a mesma sessão", sub: S.step === 5 ? "Vira a iteração 4, no mesmo branch e no mesmo PR." : "No protótipo, use “Próximo” para seguir a história." });
}
function runCmd(k) {
  if (k === "parar" || k === "stop") return stopRun();
  if (k === "missão" || k === "missao" || k === "mission") return missionToast();
  if (k === "computer" || k === "pc") return toast({ icon: I.laptop, ok: false, title: "Rodar em outro computador", sub: "A sessão do Claude Code mora neste Mac; trocar começa uma sessão nova." });
  if (k === "summary" || k === "sum") return toast({ icon: I.doc, ok: false, title: "Resumo da tarefa", sub: `Iteração ${HEAD[S.step].it} · ${HEAD[S.step].min} min` });
  toast({ icon: I.ask, ok: false, title: `Comando /${k} não existe aqui` });
}
function stopRun() {
  const r = runningIt();
  if (!r) return toast({ icon: I.stop, ok: false, title: "Nada rodando agora" });
  toast({ icon: I.stop, ok: false, title: `Parar a rodada ${r}?`, sub: `O que já foi feito fica no branch <code>${BRANCH}</code>.`, action: { label: "Parar", run: () => toast({ icon: I.stop, ok: false, title: "No protótipo a história segue", sub: "No produto, Dev para no próximo passo seguro e conta o que ficou feito." }) } });
}
function missionToast() {
  toast({ icon: I.flag, ok: false, title: "Transformar em missão", sub: "Missão = uma thread com plano: esta thread vira a casa da missão e Dev propõe fases e portões a partir das 3 iterações.", action: { label: "Ver missão", run: () => { location.href = "Missao.html"; } }, ms: 6000 });
}

/* ---------- live: streamed lines and ticking time ---------- */
setInterval(() => {
  const it = runningIt(); if (!it) return;
  const D = ITS[it];
  const i = S.li[it] ?? D.start + 1;
  if (i < D.log.length) {
    S.li[it] = i + 1;
    const line = D.log[i];
    const el = $(`[data-last="${it}"]`);
    if (el && line[0] !== "cmd") { el.querySelector(".tx").textContent = line[1]; el.classList.remove("fresh"); void el.offsetWidth; el.classList.add("fresh"); }
    const lg = $(`[data-log="${it}"]`);
    if (lg) { lg.querySelector(".cur")?.insertAdjacentHTML("beforebegin", lineHTML(line)); lg.scrollTop = lg.scrollHeight; }
  }
  const want = Math.min(D.steps.length - 1, D.start + Math.floor(((S.li[it] ?? 0) - D.start - 1) / 2));
  if (want > (S.prog[it] ?? D.start)) { S.prog[it] = want; replaceWork(it); }
}, 1600);
setInterval(() => {
  const it = runningIt(); if (!it) return;
  for (const el of $$(`[data-tick="${it}"]`)) el.textContent = durS(elapsed(it));
}, 1000);

/* ---------- menus ---------- */
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(anchor, html) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu glass"; m.setAttribute("role", "menu");
  m.innerHTML = html;
  document.body.append(m); menuEl = m;
  hydrate(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let left = Math.min(Math.max(12, r.right - mw), innerWidth - mw - 12);
  let top = r.bottom + 6;
  if (top + mh > innerHeight - 12) top = Math.max(12, r.top - mh - 6);
  m.style.left = left + "px"; m.style.top = top + "px";
  m.querySelector(".mi")?.focus({ preventScroll: true });
}
const moreMenu = () => `
  <button class="mi" type="button" data-m="session">${I.term}<span>Ver a sessão do Claude Code</span></button>
  <button class="mi" type="button" data-m="machine">${I.laptop}<span>Trocar computador</span></button>
  <button class="mi" type="button" data-m="drive">${I.drive}<span>Abrir no Drive</span><span class="sub">v1–v3</span></button>
  <div class="msep"></div>
  <div class="mgroup">Isso cresceu?</div>
  <button class="mi" type="button" data-m="mission">${I.flag}<span>Transformar em missão</span><span class="sub">fases e portões</span></button>
  <div class="msep"></div><button class="mi danger" type="button" data-m="stop">${I.stop}<span>Parar a tarefa</span></button>`;

/* ---------- toasts ---------- */
function toast({ icon = I.check, ok = true, title, sub = "", action, ms = 3800 }) {
  const t = document.createElement("div");
  t.className = "toast glass"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="tic ${ok ? "ok" : ""}">${icon}</span><div class="tt"><b>${esc(title)}</b>${sub ? `<small>${sub}</small>` : ""}</div>${action ? `<button class="b bg sm" type="button">${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { action.run(); dismiss(t); };
  $("#toasts").append(t);
  setTimeout(() => dismiss(t), ms);
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add("out"); setTimeout(() => t.remove(), 200); }

/* ---------- before/after slider ---------- */
function setBA(ba, p) {
  const it = +ba.dataset.ba; p = Math.max(0, Math.min(100, p)); S.baP[it] = p;
  ba.style.setProperty("--p", p + "%");
  ba.querySelector(".hd")?.setAttribute("aria-valuenow", Math.round(p));
}
document.addEventListener("pointerdown", (e) => {
  const ba = e.target.closest(".ba"); if (!ba) return;
  e.preventDefault();
  const move = (ev) => { const r = ba.getBoundingClientRect(); setBA(ba, ((ev.clientX - r.left) / r.width) * 100); };
  move(e);
  ba.setPointerCapture?.(e.pointerId);
  const up = () => { ba.removeEventListener("pointermove", move); ba.removeEventListener("pointerup", up); ba.removeEventListener("pointercancel", up); };
  ba.addEventListener("pointermove", move); ba.addEventListener("pointerup", up); ba.addEventListener("pointercancel", up);
  ba.querySelector(".hd")?.focus({ preventScroll: true });
});

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target;
  if (menuEl && !menuEl.contains(t) && !t.closest("[data-more]")) closeMenu();
  if (menuEl && menuEl.contains(t)) {
    const m = t.closest("[data-m]"); if (!m) return; closeMenu();
    const k = m.dataset.m;
    if (k === "mission") return missionToast();
    if (k === "stop") return stopRun();
    if (k === "session") return toast({ icon: I.term, ok: false, title: "Sessão desta thread", sub: `Cada mensagem aqui continua o mesmo contexto no ${MACHINE}.` });
    if (k === "machine") return toast({ icon: I.laptop, ok: false, title: "Trocar computador", sub: "A sessão do Claude Code fica neste Mac; em outro, começa uma nova com o resumo da thread." });
    if (k === "drive") return toast({ icon: I.drive, ok: false, title: "Drive · Produto / Onboarding", sub: "As versões v1, v2 e v3 com os prints." });
    return;
  }
  const st = t.closest("[data-step]"); if (st) return goStep(+st.dataset.step, +st.dataset.step === S.step + 1);
  if (t.closest("#next")) return next();
  const mo = t.closest("[data-more]"); if (mo) return menuEl ? closeMenu() : openMenu(mo, moreMenu());
  const wo = t.closest("[data-wopen]"); if (wo) { const it = +wo.dataset.wopen; S.wopen[it] = !(S.wopen[it] ?? workState(it) === "run"); return replaceWork(it); }
  const lt = t.closest("[data-logt]"); if (lt) { const it = +lt.dataset.logt; S.logOpen[it] = !S.logOpen[it]; return replaceWork(it); }
  const sp = t.closest("[data-stop]"); if (sp) return stopRun();
  const sl = t.closest("[data-sel]"); if (sl) { const it = +sl.dataset.sel, v = +sl.dataset.v; if (S.view[it] !== "view" && v === it) { S.view[it] = "view"; render(); return; } S.sel[it] = v; return replaceRes(it); }
  const qk = t.closest("[data-quick]"); if (qk) return send(qk.dataset.quick);
  const pk = t.closest("[data-pick]"); if (pk) { S.pick = pk.dataset.pick; S.other = ""; render(); return; }
  if (t.closest("[data-answer]")) return answer();
  if (t.closest("[data-merge]")) return merge();
  if (t.closest("[data-diff]")) { S.diffOpen = !S.diffOpen; render(); return; }
  if (t.closest("[data-hint-x]")) { S.hintGone = true; render(); return toast({ icon: I.flag, ok: false, title: "Fica no ⋯ da thread", sub: "“Transformar em missão” continua lá se precisar." }); }
  const mi = t.closest("[data-mission]"); if (mi) { e.preventDefault(); return missionToast(); }
  const lk = t.closest("[data-like]"); if (lk) { S.liked[lk.dataset.like] = !S.liked[lk.dataset.like]; lk.classList.toggle("on"); lk.setAttribute("aria-pressed", S.liked[lk.dataset.like]); lk.lastChild.textContent = String(+lk.lastChild.textContent + (S.liked[lk.dataset.like] ? 1 : -1)); return; }
  const ar = t.closest("[data-art]"); if (ar) return toast({ icon: I.drive, ok: false, title: `Onboarding · v${ar.dataset.art}`, sub: "Abre no Drive, com os prints e o diff dessa versão." });
  if (t.closest("[data-send]")) return send();
  const cm = t.closest("[data-cmd]"); if (cm) { S.draft = ""; renderComposer(); const k = cm.dataset.cmd; return k === "stop" ? stopRun() : k === "mission" ? missionToast() : runCmd(k === "pc" ? "pc" : "resumo"); }
  const ts = t.closest("[data-toast]"); if (ts) return toast({ icon: I.open, ok: false, title: ts.dataset.toast });
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && menuEl) return closeMenu();
  const hd = e.target.closest?.(".hd");
  if (hd && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Home" || e.key === "End")) {
    e.preventDefault(); const ba = hd.closest(".ba"), it = +ba.dataset.ba;
    const p = e.key === "Home" ? 0 : e.key === "End" ? 100 : S.baP[it] + (e.key === "ArrowLeft" ? -5 : 5);

  }
});

/* ---------- segmented controls and theme ---------- */
function seg(el, value, on) {
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); if (!b) return; pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; e.stopPropagation(); if (b.dataset.v === value) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });

$("#logo").append(makeAgent("theo", 30));
goStep(0, true);
</script>
