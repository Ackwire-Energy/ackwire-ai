<style>
/*
  Prototype v3: the whole agent profile. Round 2 approved the "Frase" (2026-10-19): the agent's setup as a
  sentence with tappable words, each opening one simple question; changes apply at once with Desfazer; the
  page solves dependencies (Claude Code moves the agent to the computer that has it) and says it BEFORE.
  This round takes that to the rest of the profile.

  v4 (2026-10-19, feedback "a frase podia ficar em cima do conteúdo; exagerou nas frases, nem tudo são frases"):
  only the Work sentence stays a sentence, right under the name, on every tab. The rest of Perfil is plain UI:
  apps as tiles (level on each, + Liberar app), skills as toggles, people as rows with avatars, cost as a big
  number + pixel meter (the limit is a link), routines with on/off switches. The v3 notes below describe the
  popovers, which stay the same.

  Today: 6 tabs, and Visão geral repeats Configurações and Ferramentas e acesso read-only ("Mudar acessos"
  jumps to another tab). Now: 4 tabs.
    Perfil      what was Visão geral + Configurações + Ferramentas e acesso, as one sheet of sentences:
                Trabalho  "Pensa com [Claude Code] no [MacBook do Walter] e [navega em sites]."
                Pessoas   "Responde a [todos da organização] em [#conteudo e #geral]. [Você] é responsável…"
                Acesso    "Pode usar [GitHub], [Notion · só lê] e [Google Drive] [+]." + "Sabe [roteiros…]."
                Custo     "Gasta até [US$ 40 por mês]." + a pixel meter, the 80% mark
                Rotinas   "Tem 2 rotinas: [Resumo da semana · segunda, 9h] e … [+]"
                Above: "Esperando você" (approvals, proposals) only when there is something. No recent work: that is Atividade.
    Instruções  the text as a document; the agent's proposal on top (Ver → Acrescentar / Recusar). Long text
                keeps an explicit Salvar (⌘S), only shown when something changed.
    Memória, Atividade  unchanged this round.
  Identity lives on the hero: click the name or the role to rename; click the agent for "Mudar o jeito"
  (color, head, eyes, drawn by the engine). "…": copy @, pause, archive.
  Per-app access is one question per app (Ler e mudar / Só ler / Nada); the fine tuning per tool stays a link.
  Members see the same sentences as plain text (no buttons) and who can change them.

  Prototype bar: Admin | Membro, "No Mac, navegador" off/on (watch the page update), Recomeçar, theme.
  Deep links: #tab=perfil|instrucoes &role=admin|member &mac=off|on &theme=light|dark.
  Agents come only from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#fff;--sunken:#ebebe7;--glass:rgba(255,255,255,.72);--line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b4352b;--danger-soft:#fbe6e3;
  --agent:#0063d1;--agent-soft:#e3eefd;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 8px 20px -6px rgba(23,23,22,.12),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sky-ink:#04203f;--sky-ink2:rgba(4,32,63,.74);--sky-glass:rgba(241,248,255,.76);--sky-line:rgba(4,32,63,.12);
  --term:#141413;--term-ink:#d6d6d2;--term-dim:#8b8b85;--term-ok:#5fc48a;--term-sel:rgba(255,255,255,.08);
  --sans:"Onest",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",monospace;--mono:"Martian Mono",ui-monospace,monospace;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--glass:rgba(30,30,28,.72);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#ef7c70;--danger-soft:#3a1714;
  --agent:#5aa8ff;--agent-soft:#11253f;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --term:#080807;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{overflow-anchor:none}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";overflow-x:hidden}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
canvas.av{display:block;flex:none}
canvas.orbit{display:inline-block;flex:none;image-rendering:pixelated;vertical-align:middle}
:focus-visible{outline:2px solid #3d8bff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes blinkc{50%{opacity:0}}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- Prototype bar (not product) ---------- */
.pbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pbar .lbl{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.pbar .grow{flex:1}
.views{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.views::-webkit-scrollbar{display:none}
.stp{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 6px;border-radius:999px;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none;transition:background .15s,color .15s}
.stp .n{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--sunken);color:var(--faint)}
.stp:hover{background:var(--plate);color:var(--ink)}
.stp[aria-current="step"]{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.stp[aria-current="step"] .n{background:var(--ink);color:var(--bg)}
.pbar .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- Shell: sidebar | page ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 45px)}
.app.bare{grid-template-columns:minmax(0,1fr)}
.app.bare .side{display:none}
.side{position:sticky;top:45px;height:calc(100vh - 45px);overflow:hidden;padding:18px 12px;display:flex;flex-direction:column;gap:14px;background:var(--sunken);border-right:1px solid var(--line);isolation:isolate}
.side canvas.sky{position:absolute;inset:auto 0 0 0;width:100%;height:22%;image-rendering:pixelated;pointer-events:none;z-index:-1}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:300;font-size:20px;letter-spacing:-.02em;padding:0 6px}
.brand i{font-style:normal;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:.62em;color:var(--muted)}
.find{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:11px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);font-size:13px}
.find .kbd{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--plate);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top);font-weight:600}
.nav a .n{margin-left:auto;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;color:var(--muted)}
.nav .agent-slot{width:18px;height:18px;display:grid;place-items:center;flex:none}
.page{min-width:0;display:flex;flex-direction:column;align-items:center;padding:0 clamp(16px,3vw,36px) 120px}
.wrap{width:100%;max-width:1080px}
.topbar{display:flex;align-items:center;gap:10px;height:58px}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;min-width:0;flex-wrap:nowrap;overflow:hidden}
.crumbs a{text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .18s var(--spring)}
.iconbtn:hover{background:var(--plate);color:var(--ink)}
.iconbtn:active{transform:scale(.94)}

/* ---------- Controls (design system v2, from AgentePerfil) ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:-.005em;background:var(--raised);box-shadow:var(--e1),var(--top);white-space:nowrap;transition:transform .18s var(--spring),box-shadow .18s var(--out),filter .15s,background .15s,color .15s,opacity .15s}
.btn:hover{box-shadow:var(--e2),var(--top)}
.btn:active{transform:scale(.97) translateY(.5px)}
.btn.primary{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)),var(--ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-disabled="true"]{opacity:.45;cursor:default;transform:none;filter:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{color:#fff;background:linear-gradient(180deg,#c9473c,#a8322a);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px -6px rgba(168,50,42,.6)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.btn.icon{width:40px;padding:0}
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.22);opacity:.8;box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)}
.card{background:var(--raised);border-radius:20px;box-shadow:var(--e1),var(--top);padding:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.label{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.help{color:var(--muted);font-size:12.5px}
.faint{color:var(--faint)}
.input{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s}
.input:focus-within{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.input input{all:unset;flex:1;min-width:0;height:100%}
.input.mono input{font-family:var(--mono);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;max-width:100%}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.busy{background:var(--agent-soft);color:var(--agent)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tog{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 10px;border-radius:999px;font-weight:600;font-size:13px;background:var(--raised);color:var(--muted);box-shadow:var(--e1),var(--top);transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s;flex:none}
.tog:hover{color:var(--ink)}
.tog:active{transform:scale(.96)}
.tog .box{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);transition:background .15s}
.tog .box svg{width:11px;height:11px;stroke-width:2.6;opacity:0}
.tog[aria-pressed="true"]{color:var(--ink);box-shadow:0 0 0 1.5px var(--ink),var(--top)}
.tog[aria-pressed="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.tog[aria-pressed="true"] .box svg{opacity:1}
.tog.sm{height:30px;font-size:12.5px;padding:0 11px 0 8px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%}
.seg button{all:unset;position:relative;z-index:1;cursor:pointer;height:30px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:hover{color:var(--ink)}
.seg .pill{position:absolute;top:0;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.seg.sm button{height:26px;padding:0 10px;font-size:12.5px}
.seg.sm .pill{height:26px}
.seg.xs button{height:24px;padding:0 9px;font-size:12px}
.seg.xs .pill{height:24px}
.menu{position:fixed;z-index:60;min-width:220px;border-radius:16px;padding:6px;background:color-mix(in srgb,var(--raised) 92%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3);animation:popin .22s var(--spring) both}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:6px 10px;border-radius:10px}
.mi:hover{background:rgba(127,127,127,.13)}
.mi.danger{color:var(--danger)}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.pa{width:30px;height:30px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:650;font-size:12px;background:linear-gradient(160deg,#e9e9e5,#d9d9d4);color:#2a2a28}
:root[data-theme="dark"] .pa{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.pa.sm{width:22px;height:22px;font-size:10px}
.ib{width:30px;height:30px;border-radius:10px 10px 10px 4px;display:grid;place-items:center;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);flex:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--plate);color:var(--muted);font-size:13px}
.note b{color:var(--ink);font-weight:600}
.note svg{margin-top:2px}
.logo{width:36px;height:36px;border-radius:11px 11px 11px 4px;display:grid;place-items:center;flex:none;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
.logo.soft{background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h2{font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;min-width:0}
.ch .act{margin-left:auto;display:flex;gap:6px;align-items:center}
.ch .help{margin-left:auto}
.eyebrow{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap}
.readonly{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:13px;margin-bottom:14px}
.readonly svg{margin-top:2px}
.readonly b{color:var(--ink);font-weight:600}
.crow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap;min-width:0}
.crow:first-child{border-top:0;padding-top:2px}
.crow:last-child{padding-bottom:2px}
.crow .t{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.crow .n{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crow .d{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.crow .end{display:flex;gap:6px;align-items:center;margin-left:auto}
.crow.nw{flex-wrap:nowrap}
.crow.nw .t{flex:1 1 auto}
.crow .under{flex-basis:100%;padding-left:48px;display:flex;flex-direction:column;gap:8px}
.crow.changed{margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:12px;background:var(--plate);border-top-color:transparent}
.crow.changed + .crow{border-top-color:transparent}
.crow.gone{opacity:.55}
.more{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--muted);margin-top:12px}
.more:hover{color:var(--ink)}
.kv{display:flex;flex-direction:column;gap:12px}
.kv > div{display:flex;flex-direction:column;gap:3px}
.kv .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.kv .v{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kv .v span{font-weight:500;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--ink);color:var(--bg);white-space:nowrap}
.tag svg{width:11px;height:11px;stroke-width:2.2}
.undo{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);padding:2px 6px;border-radius:7px}
.undo:hover{background:var(--plate);color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0}
.who .avs{display:inline-flex;align-items:center}
.who .avs{gap:4px}
/* Rows with a description of several lines: the tile sits with the name, not in the middle. */
.crow.top{align-items:flex-start}
.crow.top .logo{margin-top:2px}
.crow.top .end{align-self:center}
.crow .d.ag{margin-top:4px}

/* ---------- Paths and commands (the only mono on the page) ---------- */
.path{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--ink2);overflow-wrap:anywhere;border-radius:6px;padding:1px 4px;margin:0 -4px;transition:background .15s}
.path:hover{background:var(--plate)}
code{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:6px;background:var(--sunken);color:var(--ink2);white-space:nowrap}
code.wrap{white-space:normal;overflow-wrap:anywhere}
.cmd{display:flex;align-items:flex-start;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.cmd .tx{flex:1;min-width:0;font-family:var(--mono);font-size:12px;line-height:1.75;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;padding-top:3px}
.cmd .tx .pr{color:var(--faint);user-select:none}
.cmd .tx .arg{color:var(--muted);white-space:nowrap}
.cmd .btn{flex:none}
.cmd.copied .btn{color:var(--ok)}
.cmdlbl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.cmdlbl svg{color:var(--faint)}

/* ---------- Computer page ---------- */
.cfg{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.subnav{position:sticky;top:110px;display:flex;flex-direction:column;gap:2px}
.subnav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13.5px}
.subnav a:hover{background:var(--plate);color:var(--ink)}
.subnav a[aria-current="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top);font-weight:600}
.mhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.mhead .big{width:56px;height:56px;border-radius:17px 17px 17px 6px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--e2),var(--top);color:var(--ink2);flex:none}
.mhead .big svg{width:26px;height:26px;stroke-width:1.5}
.mhead .t{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px}
.mhead h1{font-family:var(--display);font-weight:300;font-size:40px;letter-spacing:-.03em;line-height:1}
.mhead .acts{display:flex;gap:8px;align-items:center}
.tools .crow .logo svg{width:18px;height:18px}
.honest{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink2)}
.honest svg{color:var(--warn);margin-top:2px}

/* ---------- Agent page (from AgentePerfil, trimmed) ---------- */
.cover{position:relative;height:190px;border-radius:24px;overflow:hidden;isolation:isolate;box-shadow:var(--e1)}
.cover canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
.state{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:7px;min-height:28px;padding:4px 11px 4px 9px;border-radius:999px;font-size:12.5px;font-weight:650;color:var(--sky-ink);background:var(--sky-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--sky-line);max-width:calc(100% - 28px)}
.state .sub{font-weight:500;color:var(--sky-ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ident{display:flex;align-items:flex-end;gap:16px;padding:16px 4px 4px;flex-wrap:wrap}
.ident .whoami{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:6px}
.ident h1{font-family:var(--display);font-weight:300;font-size:44px;letter-spacing:-.03em;line-height:1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ident h1 .handle{font-family:var(--sans);font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted)}
.ident .acts{display:flex;gap:8px;align-items:center}
.tabsbar{position:sticky;top:45px;z-index:20;margin:14px -8px 0;padding:0 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:48px;padding:0 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.view{padding-top:22px;animation:fi .3s var(--out) both}
.pend{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--sunken);margin-top:4px}
.waitline{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.shimmer{background:linear-gradient(90deg,var(--faint) 0%,var(--ink2) 50%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}


/* ---------- This prototype ---------- */
:root{--bg:#fff;--sunken:#f6f6f3;--sel:#2f7cf6;
  --card-face-top:#fff;--card-shadow:0 0 0 1px rgba(23,23,22,.08),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(23,23,22,.06),0 1px 2px rgba(23,23,22,.06),0 12px 28px -14px rgba(23,23,22,.18);
  --card-key-bottom:#f5f5f2;--card-key:0 0 0 1px rgba(23,23,22,.09),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(23,23,22,.08),0 1px 2px rgba(23,23,22,.08);
  --card-well:#f6f6f3;--card-well-shadow:inset 0 1px 2px rgba(23,23,22,.07),inset 0 0 0 1px rgba(23,23,22,.05),0 1px 0 #fff}
:root[data-theme="dark"]{--bg:#0f0f0e;--sunken:#0a0a09;
  --card-face-top:#232322;--card-shadow:0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.5),0 14px 30px -12px rgba(0,0,0,.75);
  --card-key-bottom:#1f1f1e;--card-key:0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.5);
  --card-well:#121211;--card-well-shadow:inset 0 1px 3px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04),0 1px 0 rgba(255,255,255,.05)}
.app{min-height:calc(100vh - 45px)}
.card{border-radius:20px 20px 20px 4px;background:linear-gradient(180deg,var(--card-face-top),var(--raised) 64px);box-shadow:var(--card-shadow);padding:20px}
.key{width:32px;height:32px;border-radius:10px 10px 10px 3px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,var(--raised),var(--card-key-bottom));box-shadow:var(--card-key);color:var(--ink2)}
.col1{max-width:840px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.gtitle{font-size:12.5px;font-weight:600;color:var(--faint);padding:10px 4px 0}

/* ---------- The sentence ---------- */
.scard{padding:28px 28px 22px}
.sentence{font-family:var(--display);font-weight:300;font-size:30px;line-height:1.75;letter-spacing:-.02em;color:var(--ink2);text-wrap:pretty}
.tok{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 11px;margin:0 2px;border-radius:13px 13px 13px 4px;vertical-align:3px;background:linear-gradient(180deg,var(--raised),var(--card-key-bottom));box-shadow:var(--card-key);font-family:var(--sans);font-size:18px;font-weight:600;letter-spacing:-.015em;color:var(--ink);white-space:nowrap;transition:transform .2s var(--spring),box-shadow .2s var(--out)}
.tok:hover{transform:translateY(-1px);box-shadow:var(--card-key),0 6px 14px -6px rgba(0,0,0,.18)}
.tok:active{transform:translateY(0) scale(.98)}
.tok svg.i{width:18px;height:18px}
.tok .cv{width:14px;height:14px;color:var(--faint);margin-left:-2px}
.tok[aria-expanded="true"]{box-shadow:0 0 0 2px var(--ink),var(--card-key)}
.tok.off{color:var(--muted);font-weight:500}
.tok.wait{color:var(--ink2)}
.tok.glow{animation:glow 1.4s var(--out)}
@keyframes glow{0%{box-shadow:0 0 0 3px var(--ok),var(--card-key)}100%{box-shadow:0 0 0 0 transparent,var(--card-key)}}
.sline{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted)}
.sline svg{color:var(--faint)}
.sline.warn svg{color:var(--warn)}

/* ---------- Rows (settings, direction lista) ---------- */
.rows{display:flex;flex-direction:column;margin:-6px -8px}
.rowb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 10px;border-radius:12px;transition:background .15s}
.rowb + .rowb,.rowb + .rowx,.rowx + .rowb{box-shadow:0 -1px 0 var(--line)}
.rowb:hover{background:var(--plate);box-shadow:none}
.rowb:hover + .rowb{box-shadow:none}
.rowb[aria-expanded="true"]{background:var(--plate)}
.rowb .k{font-weight:600;font-size:14.5px;letter-spacing:-.01em;flex:none}
.rowb .ic{width:30px;height:30px;border-radius:9px 9px 9px 3px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,var(--raised),var(--card-key-bottom));box-shadow:var(--card-key);color:var(--ink2)}
.rowb .v{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;min-width:0;text-align:right}
.rowb .v b{color:var(--ink);font-weight:600}
.rowb .v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowb .chev{color:var(--faint);flex:none}
.rowb.danger .k{color:var(--danger)}
.rowb.glow{animation:rglow 1.4s var(--out)}
@keyframes rglow{0%{background:var(--ok-soft)}100%{}}
.rowx{padding:4px 10px 12px 52px}

/* ---------- Popover / sheet ---------- */
.pscrim{position:fixed;inset:0;z-index:55;background:transparent;animation:fade .2s both}
.pop{position:fixed;z-index:60;width:400px;max-width:calc(100vw - 32px);border-radius:18px 18px 18px 5px;background:color-mix(in srgb,var(--raised) 96%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3);padding:8px;animation:popin .22s var(--spring) both}
.pop h3{font-size:15px;font-weight:650;letter-spacing:-.01em;padding:10px 12px 8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;width:100%;padding:11px 12px;border-radius:12px;transition:background .12s}
.opt:hover{background:var(--plate)}
.opt .ic{width:34px;height:34px;border-radius:10px 10px 10px 3px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,var(--raised),var(--card-key-bottom));box-shadow:var(--card-key);color:var(--ink2)}
.opt .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:1px}
.opt .t b{font-weight:600;font-size:14.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.opt .t span{color:var(--muted);font-size:13px;line-height:1.4}
.opt .t .also{display:flex;align-items:center;gap:5px;color:var(--ink2);font-weight:500}
.opt .t .also svg{color:var(--faint)}
.opt .t .also.warn{color:var(--warn)}
.opt .t .also.warn svg{color:var(--warn)}
.opt .rad{width:20px;height:20px;border-radius:50%;flex:none;margin-top:7px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--bg);transition:background .15s}
.opt .rad svg{width:12px;height:12px;stroke-width:2.8;opacity:0}
.opt[aria-checked="true"] .rad{background:var(--ink);box-shadow:none}
.opt[aria-checked="true"] .rad svg{opacity:1}
.opt[aria-disabled="true"]{cursor:default}
.opt[aria-disabled="true"]:hover{background:transparent}
.opt[aria-disabled="true"] .ic,.opt[aria-disabled="true"] .t b{opacity:.45}
.opt[aria-disabled="true"] .rad{opacity:.35}
.osub{margin:0 12px 8px 58px;display:flex;flex-direction:column;gap:10px;animation:fi .2s var(--out) both}
.osub .ln{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.osub .ln .seg{margin-left:auto}
.ask{padding:12px;border-radius:12px 12px 12px 3px;background:var(--warn-soft);display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.45;color:var(--ink2)}
.ask b{color:var(--ink);font-weight:650}
.ask .row{gap:8px}
.pop.sheet{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-width:none;border-radius:24px 24px 0 0;padding:6px 8px 28px;animation:sheet .32s var(--out) both}
.pop.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:99px;background:var(--line2);margin:4px auto 6px}
@keyframes sheet{from{transform:translateY(100%)}}
.pscrim.dim{background:rgba(0,0,0,.32)}

/* ---------- The Mac guide (show, don't tell) ---------- */
.guide{margin-top:20px;padding:16px;border-radius:16px 16px 16px 4px;background:var(--card-well);box-shadow:var(--card-well-shadow);animation:fi .3s var(--out) both}
.guide .gh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.guide .gh b{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.guide .gh .live{margin-left:auto}
.gsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gs{display:flex;flex-direction:column;gap:8px;min-width:0}
.gs p{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
.gs p i{font-style:normal;width:18px;height:18px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:11px;font-weight:650;background:var(--ink);color:var(--bg);transform:translateY(-1px)}
.shot{position:relative;height:118px;border-radius:12px 12px 12px 3px;background:var(--raised);box-shadow:var(--e1);overflow:hidden;font-size:11px;color:var(--ink2)}
.gs.on .shot{box-shadow:0 0 0 2px var(--sel),var(--e1)}
.mbar{display:flex;align-items:center;justify-content:flex-end;gap:9px;height:24px;padding:0 10px;background:color-mix(in srgb,var(--ink) 6%,var(--raised));font-weight:600;font-size:10.5px;color:var(--muted)}
.mbar .sq{width:11px;height:11px;border-radius:3px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.mbar .me{display:grid;place-items:center;width:20px;height:18px;border-radius:5px}
.gs.on .mbar .me,.mbar .me.hit{background:color-mix(in srgb,var(--sel) 25%,transparent);box-shadow:0 0 0 1.5px var(--sel)}
.mmenu{position:absolute;right:30px;top:28px;width:128px;padding:4px;border-radius:8px;background:var(--raised);box-shadow:var(--e2)}
.mmenu div{padding:3px 7px;border-radius:5px;white-space:nowrap}
.mmenu .hl{background:var(--sel);color:#fff}
.mmenu hr{border:0;height:1px;background:var(--line);margin:3px 4px}
.mwin{position:absolute;inset:10px;border-radius:9px;background:var(--raised);box-shadow:var(--e2);overflow:hidden}
.mwin .bar{display:flex;align-items:center;gap:4px;height:18px;padding:0 7px;background:color-mix(in srgb,var(--ink) 5%,var(--raised));font-size:9.5px;font-weight:600;color:var(--muted)}
.mwin .bar i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--ink) 20%,transparent)}
.mwin .bar span{margin-left:6px}
.mwin .r{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;border-top:1px solid var(--line)}
.mwin .r:first-of-type{border-top:0}
.msw{width:22px;height:13px;border-radius:99px;background:color-mix(in srgb,var(--ink) 18%,transparent);position:relative;flex:none}
.msw::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.2);transition:transform .3s var(--spring)}
.msw.on{background:var(--ok)}
.msw.on::after{transform:translateX(9px)}
.mwin .r.hl{background:color-mix(in srgb,var(--sel) 10%,transparent);font-weight:600}
.r.hl .msw.flip{animation:flip 3s infinite}
.r.hl .msw.flip::after{animation:flipk 3s infinite}
@keyframes flip{0%,40%{background:color-mix(in srgb,var(--ink) 18%,transparent)}55%,100%{background:var(--ok)}}
@keyframes flipk{0%,40%{transform:none}55%,100%{transform:translateX(9px)}}
.cursor{position:absolute;width:12px;height:12px;pointer-events:none}
.cursor svg{width:14px;height:14px;fill:var(--ink);stroke:var(--raised);stroke-width:1.5}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--faint)}
.gfoot{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted)}

/* Toast with undo */
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);bottom:22px;z-index:50;display:flex;gap:10px;align-items:center;padding:8px 8px 8px 14px;border-radius:14px 14px 14px 4px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;box-shadow:var(--e3);animation:popin .25s var(--spring) both}
.toast svg{color:var(--term-ok)}
.toast .u{all:unset;cursor:pointer;padding:5px 10px;border-radius:9px;background:color-mix(in srgb,var(--bg) 16%,transparent);font-weight:650}
.toast .u:hover{background:color-mix(in srgb,var(--bg) 26%,transparent)}
.toast.noundo{padding-right:14px}
.ph-out{color:var(--muted);text-align:center;padding:60px 0;font-size:13.5px}
.chip .dotc{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip .dotc.on{background:var(--ok)}

@media (max-width:860px){
  .gsteps{grid-template-columns:minmax(0,1fr)}
  .shot{height:110px}
}
@media (max-width:640px){
  .page{padding:0 16px 120px}
  .cover{height:140px;border-radius:20px}
  .ident h1{font-size:34px}
  .card{padding:16px}
  .scard{padding:20px 18px 16px}
  .sentence{font-size:23px;line-height:1.85}
  .tok{height:38px;font-size:16px;padding:0 8px 0 9px;white-space:normal;text-align:left}
  .pbar .grow{display:none}
  .rowb .v{max-width:55%}
}

/* ---------- v3: the whole profile ---------- */
.ficha{padding:4px 28px}
.fb{display:grid;align-items:start;grid-template-columns:104px minmax(0,1fr);gap:8px 16px;padding:24px 0;border-top:1px solid var(--line)}
.fb:first-child{border-top:0}
.fb .lbl2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--faint);padding-top:10px}
.fb .lbl2 svg{color:var(--faint)}
.fb .sentence{font-size:23px;line-height:1.9}
.fb .sline{margin-top:6px}
.tok{height:36px;font-size:16px}
.tok.add{width:38px;padding:0;justify-content:center;color:var(--muted)}
.tok.add svg.i{width:16px;height:16px}
.tok.ro{cursor:default;background:transparent;box-shadow:none;padding:0;margin:0;height:auto;vertical-align:baseline;font-size:inherit;font-family:var(--display);font-weight:400;color:var(--ink)}
.tok.ro:hover{transform:none;box-shadow:none}
.tok.ro svg.i{display:none}
.tok .lvl{font-weight:500;color:var(--muted)}
.meter{display:grid;grid-template-columns:repeat(40,1fr);gap:2px;max-width:420px;margin-top:4px}
.meter i{height:8px;border-radius:2px;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.meter i.on{background:var(--amber,#c07d0b)}
.meter i.mk{box-shadow:inset 0 0 0 1px var(--warn)}
.note-ro{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px 14px 14px 4px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);font-size:13.5px}
.note-ro b{color:var(--ink);font-weight:600}

/* Waiting for you + recent work */
.wrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.wrow:first-of-type{border-top:0}
.wrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wrow .t b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .t span{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chd h2{font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.chd .act{margin-left:auto}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:650}

/* Hero inline editing */
.editable{all:unset;cursor:text;border-radius:10px;padding:0 6px;margin:0 -6px;transition:background .15s;display:inline-flex;align-items:baseline;gap:10px}
.editable:hover{background:var(--plate)}
.editable .pen{opacity:0;color:var(--faint);transition:opacity .15s;align-self:center}
.editable:hover .pen{opacity:1}

/* Popover extras */

/* Instructions */

@media (max-width:640px){

.apptile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px 14px 14px 4px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .18s var(--spring),box-shadow .15s;min-width:0}

.apptile .lv.write{color:var(--ok)}
.apptile.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--muted);justify-content:center;align-items:center;min-height:0;gap:6px}
.apptile.add:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink2)}

.prows{display:flex;flex-direction:column;margin:0 -8px}
.prow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:50px;padding:8px;border-radius:12px;transition:background .15s}

.prow .v b{font-weight:600;font-size:14px}
.prow .chev{color:var(--faint);flex:none}
.prow.glow{animation:rglow 1.4s var(--out)}
.avs{display:inline-flex;flex:none;flex-wrap:nowrap;align-items:center}
.avs .pa{width:26px;height:26px;font-size:9.5px;border-radius:50%;flex:none;letter-spacing:-.02em;white-space:nowrap;box-shadow:0 0 0 2px var(--raised)}
.avs .pa + .pa{margin-left:-5px}

.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
.big .num{font-family:var(--display);font-weight:300;font-size:44px;letter-spacing:-.03em;line-height:1}
.big .of{color:var(--muted);font-size:14px;display:inline-flex;align-items:baseline;gap:4px}
.lnk{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--ink);border-radius:7px;padding:1px 5px;margin:0 -2px;box-shadow:inset 0 -1.5px 0 var(--line2)}

.rrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}

.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}

/* The model inside the chosen brain: a label and a segmented control that fills the text column. */
.mrow{display:flex;align-items:center;gap:12px}

/* ---------- v5: dialogs for the three big choices ---------- */
.dscrim{position:fixed;inset:0;z-index:70;background:rgba(10,10,9,.36);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s both}
.dlg{position:fixed;z-index:71;left:0;right:0;top:6vh;margin:0 auto;width:min(760px,calc(100% - 32px));max-height:88vh;display:flex;flex-direction:column;border-radius:24px 24px 24px 6px;background:var(--raised);box-shadow:var(--e3);animation:popin .26s var(--spring) both;overflow:hidden}
.dh{display:flex;align-items:flex-start;gap:14px;padding:22px 20px 14px 24px}

.eng{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ec{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:16px 16px 16px 4px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .18s var(--spring),box-shadow .15s}
.ec:hover{transform:translateY(-1px);box-shadow:var(--e2),var(--top)}
.ec[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink),var(--e2)}
.ec b{font-weight:650;font-size:15px;letter-spacing:-.01em;margin-top:6px;display:flex;align-items:center;gap:6px}
.ec .d{color:var(--muted);font-size:13px;line-height:1.4}
.ec .chip.where{margin-top:auto}
.ec .ok,.pcc .ok{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);opacity:0;transform:scale(.6);transition:opacity .15s,transform .25s var(--spring)}
.ec .ok svg,.pcc .ok svg{width:13px;height:13px;stroke-width:2.6}
.ec[aria-checked="true"] .ok,.pcc[aria-checked="true"] .ok{opacity:1;transform:none}
.ekey{width:44px;height:44px;border-radius:13px 13px 13px 4px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,var(--raised),var(--card-key-bottom));box-shadow:var(--card-key);color:var(--ink2)}
.ekey svg{width:22px;height:22px;stroke-width:1.6}
.detail{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:16px 16px 16px 4px;background:var(--card-well);box-shadow:var(--card-well-shadow);animation:fi .25s var(--out) both}
.mg{display:flex;flex-direction:column;gap:4px}
.mg.off{opacity:.8}
.mgh{display:flex;align-items:center;gap:8px;padding:0 2px 6px}
.mgh b{font-weight:650;font-size:13.5px}
.mr{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--raised);box-shadow:var(--e1);transition:box-shadow .15s}
.mr:hover{box-shadow:var(--e2)}
.mr[aria-checked="true"]{box-shadow:0 0 0 1.5px var(--ink),var(--e1)}
.mr .rad{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--bg)}
.mr .rad svg{width:12px;height:12px;stroke-width:2.8;opacity:0}
.mr[aria-checked="true"] .rad{background:var(--ink);box-shadow:none}
.mr[aria-checked="true"] .rad svg{opacity:1}
.mr .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mr .t b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.mr .t span{color:var(--muted);font-size:12.5px}
.rec{font-size:11px;font-weight:650;color:var(--ok);background:var(--ok-soft);padding:1px 7px;border-radius:99px}
.tier{display:inline-flex;align-items:center;gap:3px;flex:none}

.tier span{margin-left:5px;font-size:12px;color:var(--muted);width:40px}
.pcs{display:flex;flex-direction:column;gap:8px}
.pcc{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;align-items:flex-start;gap:14px;padding:14px 48px 14px 14px;border-radius:16px 16px 16px 4px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:box-shadow .15s}
.pcc:hover{box-shadow:var(--e2),var(--top)}
.pcc[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink),var(--e2)}
.pcc .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pcc .t b{font-weight:650;font-size:15px}

.has{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px}
.has span{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600}

.has .y svg{color:var(--ok)}
.has .w{color:var(--warn)}
.has .n{color:var(--faint);font-weight:500;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--faint) 50%,transparent)}
.sites{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sites .chip{height:30px;padding-right:4px}
.sites .x{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.sites .x:hover{background:var(--plate);color:var(--ink)}
.detail .guide{margin-top:0;background:var(--raised);box-shadow:var(--e1)}

@media (max-width:640px){
  .dlg{top:auto;bottom:0;width:100%;max-height:92vh;border-radius:24px 24px 0 0;animation:sheet .32s var(--out) both}
  .eng{grid-template-columns:minmax(0,1fr)}
  .ec{flex-direction:row;flex-wrap:wrap;align-items:center}

/* Connector list (v5) */
.clist{display:flex;flex-direction:column}
.crow2{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}

/* Avatar stack */
.stk{display:inline-flex;align-items:center;flex:none}
.stk i{font-style:normal;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:650;line-height:1;letter-spacing:-.02em;color:var(--person-ink,#2a2a28);background:linear-gradient(160deg,#e9e9e5,#d9d9d4);box-shadow:0 0 0 2px var(--raised);position:relative}
:root[data-theme="dark"] .stk i{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.stk i + i{margin-left:-4px}
.stk i.more{background:var(--sunken);color:var(--muted);font-weight:600}
.ec .chip.where{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stk i.more{padding-bottom:1px;font-size:9px}
.dotc{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}

/* v6: portraits in the dialogs, tiles in the detail */
canvas.port{image-rendering:pixelated;display:block;flex:none}
.eport{display:grid;place-items:center;width:84px;height:84px;margin:-4px 0 0 -6px;border-radius:18px 18px 18px 5px;background:var(--card-well);box-shadow:var(--card-well-shadow)}
.eport.sm{width:64px;height:64px;margin:0;border-radius:15px 15px 15px 4px}

.mtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mtile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:14px 14px 14px 4px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:box-shadow .15s,transform .18s var(--spring);min-width:0}
.mtile:hover{transform:translateY(-1px);box-shadow:var(--e2),var(--top)}
.mtile[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink),var(--e2)}
.mtile canvas.port{margin:-4px -2px -4px -6px}
.mtile .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mtile .t b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mtile .t span{color:var(--muted);font-size:12.5px;line-height:1.35}
.mtile .rad{width:20px;height:20px;border-radius:50%;flex:none;align-self:flex-start;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--bg)}
.mtile .rad svg{width:12px;height:12px;stroke-width:2.8;opacity:0}
.mtile[aria-checked="true"] .rad{background:var(--ink);box-shadow:none}
.mtile[aria-checked="true"] .rad svg{opacity:1}
.pnote{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:var(--muted)}
.pnote svg{color:var(--warn);margin-top:1px;flex:none}
.pnote b{color:var(--ink);font-weight:600}
@media (max-width:640px){.mtiles{grid-template-columns:minmax(0,1fr)}}

/* Chosen = relief, never a dark border (packages/ui tokens.css --chosen-*): sinks in light, rises in dark,
   and in dark the other options of the group step back. */
:root{--chosen-bg:var(--sunken);--chosen-shadow:inset 0 2px 5px rgba(23,23,22,.16),inset 0 1px 1.5px rgba(23,23,22,.12),inset 0 0 0 1px var(--line),0 1px 0 rgba(255,255,255,.7);--chosen-lift:none;--unchosen-shadow:inset 0 0 0 1px var(--line)}
:root[data-theme="dark"]{--chosen-bg:color-mix(in srgb,#fff 7%,var(--raised));--chosen-shadow:0 0 0 1px rgba(255,255,255,.1),0 14px 28px -8px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12);--chosen-lift:translateY(-2px)}
.ec[aria-checked="true"],.mtile[aria-checked="true"],.mr[aria-checked="true"],.pcc[aria-checked="true"],
.tok[aria-expanded="true"],.apptile[aria-expanded="true"]{background:var(--chosen-bg);box-shadow:var(--chosen-shadow);transform:var(--chosen-lift)}
.ec[aria-checked="true"]:hover,.mtile[aria-checked="true"]:hover,.pcc[aria-checked="true"]:hover{box-shadow:var(--chosen-shadow);transform:var(--chosen-lift)}
/* Side by side, a lifted tile would leave its row. */
.mtiles .mtile[aria-checked="true"]{transform:none}
:root[data-theme="dark"] :is(.eng,.mtiles,.pcs,.mg):has(> [aria-checked="true"]) > :is(.ec,.mtile,.pcc,.mr):not([aria-checked="true"]){background:transparent;box-shadow:var(--unchosen-shadow)}
.ec b .chip{margin:0}
/* The status chip sits on each card's floor, on one line across the row; on the sunk (chosen) card it stays raised. */
.eng{align-items:stretch}
.ec{height:100%}
.ec .chip.where{margin-top:auto;position:relative;top:4px}
.ec .d{margin-bottom:8px}
.ec[aria-checked="true"] .chip.where:not(.warn){background:var(--raised);box-shadow:var(--e1)}
/* The pencil shows on hover without taking room: the name and the handle keep their normal gap. */
.editable{position:relative;gap:0}
.editable .pen{position:absolute;left:100%;top:50%;margin:-8px 0 0 6px;pointer-events:none}
.ident h1{gap:14px}
/* The name: the hover background says it is editable; a pencil there would sit on the handle. */
[data-edit="name"] .pen{display:none}
/* Connector mark (CatalogoConectores.html): neutral tile, radius 30%, the brand logo as a mask in its color. */
.ci{--s:40px;position:relative;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .3);flex:none;display:grid;place-items:center;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line),var(--top)}
.ci i{width:calc(var(--s) * .5);height:calc(var(--s) * .5);background:var(--c,var(--ink));-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
/* Name and handle stacked: the big name, the handle and role right under it (side by side never lined up). */
.ident h1{flex-direction:column;align-items:flex-start;gap:6px}
.ident h1 .handle{display:block;line-height:1.3}
.ident h1 .handle .editable{font-size:15px}
.ident{padding-top:18px}
.crow2.add .key{border-radius:30%}
/* v7: one pattern for every setting */
.dlg.sm{width:min(560px,calc(100% - 32px))}
.dh .ci{margin-top:0}
.sbody{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.sbody .opt[aria-checked="true"]{background:var(--chosen-bg);box-shadow:var(--chosen-shadow)}
.sbody .swatches,.sbody .looks,.sbody .psec{padding-left:8px;padding-right:8px}
.lookprev{display:grid;place-items:end center;height:150px;margin:0 8px 8px;border-radius:16px 16px 16px 4px;background:var(--card-well);box-shadow:var(--card-well-shadow);overflow:hidden;padding-bottom:10px}
.btnrow{cursor:pointer;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px;transition:background .15s}
.btnrow:hover{background:var(--plate)}
.crow2 .chev{color:var(--faint);flex:none}
.lvchip{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.lvchip.write{color:var(--ink2)}
.sens{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);padding:4px 2px}
.sens svg{color:var(--ok)}
.mtile .key{width:34px;height:34px}
.btn.danger{color:var(--danger)}
.df .pv .btn{margin-left:-8px}
/* Actions live on the sky, next to the agent: one group in the cover's corner. */
.coveracts{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:2}
.coveracts .btn{height:36px}
.coveracts .btn.icon{width:36px}
.coveracts .glass{color:var(--sky-ink);background:var(--sky-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--sky-line)}
.coveracts .glass:hover{background:color-mix(in srgb,var(--sky-glass) 70%,#fff)}
/* Framed list, as in the workspace settings (.ac-list / .ac-list__row) */
.alist{display:flex;flex-direction:column;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.arow{display:flex;align-items:center;gap:12px;padding:10px 16px;min-width:0}
.arow + .arow{border-top:1px solid var(--line)}
.arow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.arow .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.arow .t > span:last-child{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .acts{display:flex;gap:6px;flex:none}
.arow .ci svg.i{width:18px;height:18px;color:var(--ink2)}
.arow.glow{animation:rglow 1.4s var(--out)}
.ci.pa40{--s:40px;font-size:12px;font-weight:650;color:var(--ink2)}
.card > .chd + .alist{margin-top:4px}
/* Exactly the workspace settings list (packages/ui .ac-list/.ac-list__row, layout.css .connected-row,
   .connector-icon--lg, .ac-chip): no variations of our own. */
.alist{border-radius:14px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.arow{gap:14px;padding:10px 16px;min-height:64px}
.arow .ci{--s:44px;width:44px;height:44px;border-radius:10px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2)}
.arow .ci i{width:58%;height:58%}
.arow .ci svg.i{width:20px;height:20px}
.arow .nm{font-size:14.5px;font-weight:600;gap:8px}
.arow .t > span:last-child{font-size:13px}
.achip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:var(--sunken);color:var(--ink);font-size:12px;font-weight:600;white-space:nowrap}
.achip svg.i{width:14px;height:14px}
.arow .acts .btn.ghost{color:var(--muted)}
/* Connector rows as in the app today */
.lvrow{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.card > .chd + .lvrow{border-top:0;padding-top:4px}
.lvrow .ci{--s:40px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line2)}
.lvrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lvrow .t b{font-weight:600;font-size:15px}
.lvrow .tools{color:var(--muted);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lvrow .asks{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:6px}
.askchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600}
.lvrow .seg{flex:none}
.lvrow.glow{animation:rglow 1.4s var(--out)}
.connmore{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:14px 16px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line2);border:0;outline:1.5px dashed var(--line2);outline-offset:-1.5px;color:var(--muted);font-weight:600;font-size:14px}
.connmore{box-shadow:none}
.connmore span{margin-left:auto;font-weight:500;font-size:13px}
.connmore:hover{color:var(--ink);background:var(--plate)}
@media (max-width:640px){.lvrow{flex-wrap:wrap}.lvrow .seg{margin-left:54px}}
/* Dialogs stay neutral: every chip is the app's neutral chip; state is said in words and icons, not colors. */
.dlg .chip,.dlg .chip.ok,.dlg .chip.warn,.dlg .chip.line{background:var(--sunken);color:var(--ink2);box-shadow:none}
.dlg .ec[aria-checked="true"] .chip.where{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.dlg .rec{background:var(--sunken);color:var(--muted)}
.dlg .has .y svg,.dlg .has .w,.dlg .has .w svg{color:var(--ink2)}
.dlg .has .w{color:var(--muted)}
.dlg .pcc .also,.dlg .pcc .also svg,.dlg .opt .t .also.warn,.dlg .opt .t .also.warn svg{color:var(--ink2)}
.dlg .sens svg{color:var(--muted)}
.dlg .pnote svg{color:var(--muted)}
.dlg .tier i.on{background:var(--muted)}
</style>

  if (el.dataset.budget) { const v = el.dataset.budget === "org" ? null : Number(el.dataset.budget); apply({ budget: v }, `Limite: US$ ${v ?? ORG_BUDGET} por mês.`, "budget"); return; }
  if (el.dataset.routine) { const i = Number(el.dataset.routine); S.routinesOff.has(i) ? S.routinesOff.delete(i) : S.routinesOff.add(i); render(); toast(S.routinesOff.has(i) ? `${ROUTINES[i][0]} pausada.` : `${ROUTINES[i][0]} voltou.`); return; }
  /* look */
  if (el.dataset.color) { apply({ look: { ...C().look, color: el.dataset.color } }, null, null, true); return; }
  if (el.dataset.acc) { apply({ look: { ...C().look, accessory: el.dataset.acc } }, null, null, true); return; }
  if (el.dataset.eyes) { apply({ look: { ...C().look, eyes: el.dataset.eyes } }, null, null, true); return; }
  /* more */
  if (el.matches("[data-copy]")) { S.pop = null; render(); toast("@bento copiado."); return; }
  if (el.matches("[data-pause]")) { apply({ paused: !C().paused }, C().paused ? `O ${nm()} voltou a trabalhar.` : `O ${nm()} está pausado.`); return; }
  /* instructions */
  if (el.matches("[data-propopen]")) { S.prop = "open"; render(); return; }
  if (el.matches("[data-propno]")) { S.prop = "done"; S.waiting = false; render(); toast(`Recusado. O ${nm()} guardou o motivo.`); return; }
  if (el.matches("[data-propyes]")) { S.instr = S.instrSaved = S.instrSaved + "\n" + PROPOSAL.join("\n"); S.prop = "done"; S.waiting = false; render(); toast("2 linhas acrescentadas às instruções.", false); return; }
  if (el.matches("[data-instrsave]")) { S.instrSaved = S.instr; render(); toast("Instruções salvas."); return; }
  if (el.matches("[data-instrundo]")) { S.instr = S.instrSaved; render(); return; }
  if (el.matches("[data-undo]")) { const prev = S.hist.pop(); if (prev) { S.cur = prev; S.toast = null; render(); } return; }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "dsite" && S.dlg) { S.dlg.site = e.target.value; return; }
  if (e.target.id === "instr") { const was = S.instr === S.instrSaved; S.instr = e.target.value; if (was !== (S.instr === S.instrSaved)) { const pos = e.target.selectionStart; render(); const t = $("#instr"); t.focus(); t.setSelectionRange(pos, pos); } }
});
document.addEventListener("keydown", (e) => {
  if (S.editing && e.key === "Enter") { e.preventDefault(); commitEdit(); return; }
  if (S.editing && e.key === "Escape") { S.editing = null; render(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s" && S.tab === "instrucoes" && S.instr !== S.instrSaved) { e.preventDefault(); $("[data-instrsave]")?.click(); return; }
  if (S.dlg && e.key === "Enter" && e.target.id === "dsite") { e.preventDefault(); addSite(); return; }
  if (e.key === "Escape" && S.dlg) { S.dlg = null; renderLayer(); return; }
  if (e.key === "Escape" && S.pop) { S.pop = null; S.ask = null; render(); }
});
addEventListener("hashchange", () => { fromHash(); render(); });
addEventListener("resize", () => { placePills(); if (S.pop) renderLayer(); });
addEventListener("scroll", () => positionPop(), { passive: true });
fromHash();
render();
document.fonts?.ready.then(() => placePills());
</script>
</body>
</html>
