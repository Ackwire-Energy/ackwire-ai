<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novo agente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Doto:ROND,wght@100,600&display=swap">
<style>
/*
  Prototype: "Criar agente", redesigned as a stepped flow (same shell as OnboardingV2).
  Papel → Identidade → Instruções → Ferramentas e acesso → Onde e quem → Modelo e orçamento → Revisar e criar → criado.
  A live preview of the agent (engine avatar on its own sky) follows every step on the right.
  Deep links: #step=papel|identidade|instrucoes|ferramentas|onde|modelo|revisar, #created; add &theme=light, &role=dev|ops|qa|pm|custom.
  Agents come only from the agent engine (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#fff;--sunken:#ebebe7;--glass:rgba(255,255,255,.72);--line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b4352b;--danger-soft:#fbe6e3;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 8px 20px -6px rgba(23,23,22,.12),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sky-ink:#04203f;--sky-ink2:rgba(4,32,63,.78);--sky-glass:rgba(241,248,255,.74);--sky-line:rgba(4,32,63,.12);
  --sans:"Onest",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",monospace;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--glass:rgba(30,30,28,.7);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#ef7c70;--danger-soft:#3a1714;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
canvas.av{display:block;flex:none}

/* ---------- Shell: rail | work (main + preview) ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:hidden;padding:22px 16px;display:flex;flex-direction:column;gap:18px;background:var(--sunken);border-right:1px solid var(--line);isolation:isolate}
.rail canvas.sky{position:absolute;inset:auto 0 0 0;width:100%;height:44%;image-rendering:pixelated;pointer-events:none;z-index:-1}
.rhead{display:flex;align-items:center;gap:2px}
.rhead .brand{margin-right:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:300;font-size:21px;letter-spacing:-.02em;flex:1;min-width:0}
.brand i{font-style:normal;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:.62em;color:var(--muted)}
.rtitle{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.rtitle b{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.rtitle span{color:var(--muted);font-size:12.5px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.steps button:hover:not([disabled]){background:var(--plate);color:var(--ink)}
.steps button[disabled]{cursor:default;opacity:.55}
.shell.done .steps button[disabled]{opacity:1}
.steps button[aria-current="step"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top);font-weight:600}
.steps .n{width:24px;height:24px;border-radius:8px 8px 8px 3px;display:grid;place-items:center;font-family:var(--dot);font-variation-settings:"ROND" 100;font-size:13px;font-weight:600;background:var(--plate);flex:none}
.steps li[data-done] .n{background:var(--ink);color:var(--bg)}
.steps li[data-done] .n svg{width:13px;height:13px;stroke-width:2.4}
.rfoot{margin-top:auto;display:flex;gap:6px;align-items:center}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .18s var(--spring)}
.iconbtn:hover{background:var(--plate);color:var(--ink)}
.iconbtn:active{transform:scale(.94)}
.iconbtn.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--e1)}

.work{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:28px;padding:0 clamp(18px,3.4vw,40px);max-width:1160px;width:100%}
.main{display:flex;flex-direction:column;min-height:100vh;padding-top:38px;min-width:0}
.content{flex:1;padding-bottom:28px;max-width:660px;width:100%}
.content > *{animation:fi .32s var(--out) both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,3.6vw,40px);letter-spacing:-.03em;line-height:1.08;margin:8px 0}
.lead{color:var(--muted);max-width:58ch;margin-bottom:22px}

/* The bar at the bottom: glass, floating, sticky. */
.foot{position:sticky;bottom:16px;z-index:4;display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:10px 10px 10px 16px;margin:0 0 16px;max-width:660px;border-radius:18px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--e2),var(--top)}
.foot .hint{margin-right:auto;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.foot .hint.bad{color:var(--danger)}

/* ---------- Controls (design system v2) ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:-.005em;background:var(--raised);box-shadow:var(--e1),var(--top);white-space:nowrap;transition:transform .18s var(--spring),box-shadow .18s var(--out),filter .15s,background .15s,color .15s}
.btn:hover{box-shadow:var(--e2),var(--top)}
.btn:active{transform:scale(.97) translateY(.5px)}
.btn.primary{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)),var(--ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary[aria-disabled="true"]{filter:saturate(.4);opacity:.55}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.btn.on-sky{background:var(--sky-glass);color:var(--sky-ink);box-shadow:0 0 0 1px var(--sky-line),0 8px 20px -10px rgba(4,32,63,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn.on-sky.primary{background:linear-gradient(180deg,#0b2d55,#04203f);color:#eef7ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 20px -8px rgba(4,32,63,.7)}
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.22);opacity:.8;box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)}
:focus-visible{outline:2px solid #3d8bff;outline-offset:2px}

.card{background:var(--raised);border-radius:20px;box-shadow:var(--e1),var(--top);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.label .optl{font-weight:500;color:var(--faint);font-size:12px}
.help{color:var(--muted);font-size:12.5px}
.err{color:var(--danger);font-size:12.5px;display:flex;gap:6px;align-items:center}
.input{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s}
.input:focus-within{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.input.bad{box-shadow:inset 0 0 0 1px var(--danger)}
.input input{all:unset;flex:1;min-width:0;height:100%}
.input .pre{color:var(--faint);font-weight:600}
.input.big{height:52px;font-size:18px;font-weight:500}
textarea.ta{width:100%;min-height:230px;resize:vertical;border:0;border-radius:14px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px;line-height:1.6;font-size:15px;outline:none}
textarea.ta:focus{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip .lg{width:13px;height:13px}
/* Toggle pills (no native checkboxes) */
.tog{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 10px;border-radius:999px;font-weight:600;font-size:13px;background:var(--raised);color:var(--muted);box-shadow:var(--e1),var(--top);transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.tog:hover{color:var(--ink)}
.tog:active{transform:scale(.96)}
.tog .box{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2);transition:background .15s}
.tog .box svg{width:11px;height:11px;stroke-width:2.6;opacity:0}
.tog[aria-pressed="true"]{color:var(--ink);box-shadow:0 0 0 1.5px var(--ink),var(--top)}
.tog[aria-pressed="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.tog[aria-pressed="true"] .box svg{opacity:1}
.tog .sub{color:var(--faint);font-weight:500;font-size:12px}
/* Segmented control with a sliding pill */
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{all:unset;position:relative;z-index:1;cursor:pointer;height:30px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:hover{color:var(--ink)}
.seg .pill{position:absolute;top:0;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.seg.lv button[aria-pressed="true"][data-l="write"]{color:var(--bg)}
.seg.lv .pill[data-l="write"]{background:var(--ink)}
.seg.lv .pill[data-l="none"]{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
/* Custom select: a button and a glass menu */
.sel{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 12px 6px 8px;border-radius:13px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);width:100%}
.sel:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.sel .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.sel .t b{font-weight:600;font-size:14px}
.sel .t span{color:var(--muted);font-size:12px}
.sel .chev{color:var(--faint)}
.menu{position:fixed;z-index:30;min-width:240px;max-height:340px;overflow:auto;border-radius:16px;padding:6px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3);animation:popin .22s var(--spring) both;transform-origin:top left}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
.mi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border-radius:10px}
.mi:hover,.mi[data-active]{background:rgba(127,127,127,.13)}
.mi[aria-disabled="true"]{opacity:.5;cursor:default}
.mi .t{flex:1;display:flex;flex-direction:column;line-height:1.3}
.mi .t span{color:var(--faint);font-size:12.5px}
.mi .ck{opacity:0}
.mi[aria-selected="true"] .ck{opacity:1}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.pa{width:30px;height:30px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:650;font-size:12px;background:linear-gradient(160deg,#e9e9e5,#d9d9d4);color:#2a2a28}
:root[data-theme="dark"] .pa{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.pa.sm{width:22px;height:22px;font-size:10px}
.pa.none{background:var(--plate);color:var(--muted)}
.ib{width:30px;height:30px;border-radius:10px 10px 10px 4px;display:grid;place-items:center;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);flex:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--plate);color:var(--muted);font-size:13px}
.note b{color:var(--ink);font-weight:600}
.note svg{margin-top:2px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.sect h2{font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.sect .help{text-align:right}

/* ---------- Step: Papel ---------- */
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.role{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);position:relative;transition:transform .2s var(--spring),box-shadow .2s}
.role:hover{transform:translateY(-2px);box-shadow:var(--e2),var(--top)}
.role[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink),var(--e2)}
.role .top{display:flex;align-items:flex-end;gap:12px;min-height:58px}
.role .nm{display:flex;flex-direction:column}
.role .nm b{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.02em;line-height:1}
.role .nm span{font-size:12.5px;color:var(--faint)}
.role p{color:var(--muted);font-size:13.5px}
.role .kit{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.role .ck{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);opacity:0;transform:scale(.6);transition:all .25s var(--spring)}
.role .ck svg{width:13px;height:13px;stroke-width:2.6}
.role[aria-pressed="true"] .ck{opacity:1;transform:none}
.role.blank{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);border:0}
.role.blank[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.role.blank .ib{width:46px;height:46px;border-radius:15px 15px 15px 5px;background:transparent;border:1.5px dashed var(--line2);box-shadow:none}

/* ---------- Step: Identidade ---------- */
.look{display:flex;flex-direction:column;gap:16px}
.look .lrow{display:flex;flex-direction:column;gap:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{all:unset;cursor:pointer;width:34px;height:34px;border-radius:29% 29% 29% 6%;background:linear-gradient(170deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s var(--spring);position:relative}
.sw:hover{transform:translateY(-2px)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;width:72px;height:82px;padding:4px 4px 7px;border-radius:14px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);font-size:11.5px;font-weight:600;color:var(--muted);transition:transform .18s var(--spring),background .15s}
.opt:hover{color:var(--ink);transform:translateY(-1px)}
.opt[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink),var(--e1)}
.opt .stage{flex:1;display:grid;place-items:end center;width:100%}
.opt.none .stage{place-items:center;color:var(--faint)}
.opts.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.opts.acc .opt{width:auto}

/* ---------- Step: Instruções ---------- */
.ta-wrap{position:relative}
.ta-meta{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:8px}
.count{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12.5px;color:var(--faint)}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tip{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .2s var(--spring),box-shadow .2s}
.tip:hover{transform:translateY(-1px);box-shadow:var(--e2),var(--top)}
.tip b{font-size:13.5px;display:flex;align-items:center;gap:6px}
.tip span{color:var(--muted);font-size:12.5px}

/* ---------- Step: Ferramentas ---------- */
.list{display:flex;flex-direction:column}
.crow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.crow:first-child{border-top:0;padding-top:2px}
.crow:last-child{padding-bottom:2px}
.crow .t{flex:1 1 180px;min-width:0}
.crow .n{font-weight:600}
.crow .d{color:var(--muted);font-size:12.5px}
.crow .ask{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.logo{width:36px;height:36px;border-radius:11px 11px 11px 4px;display:grid;place-items:center;flex:none;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2)}
.logo .ic,.lg{display:inline-block;background:var(--c,var(--ink));-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.logo .ic{width:58%;height:58%}
.quick{display:flex;gap:4px;align-items:center;color:var(--faint);font-size:12.5px}
.addrow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;margin-top:10px;border-radius:16px;border:1.5px dashed var(--line2);color:var(--muted);font-weight:600;font-size:13.5px;width:100%}
.addrow:hover{background:var(--plate);color:var(--ink)}
.skills{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Step: Onde e quem ---------- */
.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- Step: Modelo ---------- */
.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.model{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);position:relative;transition:transform .2s var(--spring),box-shadow .2s}
.model:hover{transform:translateY(-1px);box-shadow:var(--e2),var(--top)}
.model[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink),var(--e2)}
.model[aria-disabled="true"]{opacity:.55;cursor:default;transform:none;box-shadow:inset 0 0 0 1.5px var(--line2);background:transparent}
.model .h{display:flex;align-items:center;gap:8px}
.model .h b{font-size:15px}
.model .prov{color:var(--faint);font-size:12px;margin-left:auto}
.model .d{color:var(--muted);font-size:13px}
.model .cost{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.meter{display:inline-flex;gap:3px}
.meter i{width:6px;height:12px;border-radius:2px;background:var(--line2)}
.meter i.on{background:var(--ink)}
.num{font-weight:650;color:var(--ink)}
.money{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.money .input{width:170px}
.money .input input{font-weight:600;font-size:17px}
.money .tog{padding:0 13px}

/* ---------- Step: Revisar ---------- */
.review{padding:6px 18px}
.rv{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv .k{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center;padding-top:2px}
.rv .v{display:flex;flex-direction:column;gap:6px;min-width:0}
.rv .v .chips{display:flex;gap:6px;flex-wrap:wrap}
.rv .quote{color:var(--ink2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}

.aside{position:sticky;top:0;height:100vh;padding:38px 0 16px;display:flex;flex-direction:column;gap:10px;min-width:0}

.pv{border-radius:22px;background:var(--raised);box-shadow:var(--e2),var(--top);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.pv-cover{position:relative;height:148px;flex:none;overflow:hidden;transition:height .45s var(--out);isolation:isolate}
.pv.big .pv-cover{height:236px}
.pv-cover canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
.pv-cover canvas.av{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
.pv-state{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:650;color:var(--sky-ink);background:var(--sky-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 0 1px var(--sky-line)}
.pv-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.pv-name{display:flex;flex-direction:column}
.pv-name b{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.pv-name b.ph{color:var(--faint)}
.pv-name span{color:var(--muted);font-size:13px}
.pv-instr{color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pv-sec{display:flex;flex-direction:column;gap:6px}
.pv-sec .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.pv-sec .chips{display:flex;gap:5px;flex-wrap:wrap}
.pv-sec .empty{color:var(--faint);font-size:12.5px}
.pv-sec[data-hl]{animation:hl 1s var(--out)}

.pv-head{display:none}
.hop{animation:hop .7s var(--spring)}

/* ---------- Created ---------- */
.born{position:relative;overflow:hidden;border-radius:26px;min-height:440px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;color:var(--sky-ink);isolation:isolate}

.born .eyebrow{color:var(--sky-ink2)}

  .pv.open .pv-body > .pv-instr{display:-webkit-box}
  .pv-head{display:flex;align-items:flex-start;gap:8px}
  .pv-head .pv-name{flex:1;min-width:0}
  .pv-name b{font-size:22px}
  .pv-state{display:none}
}
@media (max-width:820px){

  .rail{position:sticky;top:0;z-index:10;height:auto;padding:10px 14px;gap:8px;border-right:0;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--sunken) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .rail canvas.sky,.rtitle{display:none}
  .rhead{order:0}
  .steps{flex-direction:row;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
  .steps li{flex:none}
  .steps button{padding:5px;gap:6px;border-radius:10px}
  .steps button .t{display:none}
  .steps button[aria-current="step"]{padding-right:10px}
  .steps button[aria-current="step"] .t{display:inline;font-size:13px}
  .work{padding:0 16px}
  .roles,.models,.grid2,.nexts{grid-template-columns:1fr}
  .tips{display:flex;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:2px 16px 4px}
  .tip{flex:none;padding:10px 14px}
  .tip span{display:none}
  .rv{grid-template-columns:1fr auto}
  .rv .k{grid-column:1/-1;padding:0}
  .rv .v{grid-column:1}
  .born{min-height:520px;padding:22px;justify-content:flex-end}
  .born .agent{left:50%;right:auto;top:26%;transform:translate(-50%,-50%)}
  .foot{bottom:10px;margin-bottom:10px}

  .foot .btn.primary{flex:1}
  .sect{flex-wrap:wrap;gap:4px 12px}

  .crow .seg{width:100%}
  .money .input{flex:1 1 100%;width:auto}

  .crow .seg button{flex:1}
  .pv-cover,.pv.big .pv-cover{width:92px;min-height:68px}
  h1{font-size:30px}
}

const errLine = (m) => (m ? `<span class="err" role="alert">${I("info", "sm")}${esc(m)}</span>` : "");
const E = () => (S.err[S.step] ? stepErrors(S.step) : {});

const VIEWS = {
  papel() {
    const kit = (r) => {
      const on = CONNECTORS.filter((c) => (r.levels[c.id] ?? "none") !== "none").slice(0, 3);
      return on.map((c) => `<span class="chip">${mini(c)}${c.name}</span>`).join("") + r.channels.slice(0, 1).map((c) => `<span class="chip">${I("hash", "sm")}${c}</span>`).join("");
    };
    return head("Qual vai ser o papel?", "Um colega novo para o time. Escolha um ponto de partida: preenchemos nome, jeito, instruções e acessos. Você ajusta tudo nos próximos passos.") + `
      <div class="roles" role="group" aria-label="Papel">
        ${["dev", "ops", "qa", "pm"].map((id) => { const r = ROLES[id]; return `<button class="role" data-role="${id}" aria-pressed="${S.role === id}">
          <span class="ck">${I("check")}</span>
          <span class="top"><span data-av="preset:${id}" data-size="44"></span><span class="nm"><b>${r.name}</b><span>começa como ${r.agent}</span></span></span>
          <p>${r.desc}</p><span class="kit">${kit(r)}</span></button>`; }).join("")}
        <button class="role blank" data-role="custom" aria-pressed="${S.role === "custom"}" style="grid-column:1/-1;flex-direction:row;align-items:center;gap:14px">
          <span class="ck">${I("check")}</span>
          <span class="ib">${I("plus")}</span><span class="nm" style="display:flex;flex-direction:column"><b style="font-family:var(--display);font-weight:300;font-size:22px">Do zero</b><span style="color:var(--muted);font-size:13.5px">Você escreve tudo. Sem acessos até você liberar.</span></span></button>
      </div>
      <div style="margin-top:12px">${errLine(E().role)}</div>`;
  },
  identidade() {
    const e = E();
    return head("Quem é", "Como o time vai chamar e reconhecer no chat. O jeito aparece no avatar, nos canais e no perfil.") + `
      <div class="card stack">
        <div class="grid2">
          <div class="field"><label class="label" for="name">Nome</label>
            <div class="input big ${e.name ? "bad" : ""}"><input id="name" autocomplete="off" placeholder="Ex.: Iris" value="${esc(S.name)}" maxlength="32"></div>${errLine(e.name)}</div>
          <div class="field"><label class="label" for="handle">No chat</label>
            <div class="input big ${e.handle ? "bad" : ""}"><span class="pre">@</span><input id="handle" autocomplete="off" placeholder="iris" value="${esc(S.handle)}" maxlength="24"></div>
            ${e.handle ? errLine(e.handle) : `<span class="help" id="handleHelp">${S.handle ? `Mencione <b style="color:var(--ink)">@${esc(S.handle)}</b> para chamar.` : "Sai do nome; dá para mudar."}</span>`}</div>
        </div>
      </div>
      <div class="sect"><h2>Jeito</h2><button class="btn sm" data-shuffle>${I("dice", "sm")}Sortear</button></div>
      <div class="card look">
        <div class="lrow"><span class="label">Cor <span class="optl">${COLORS[S.look.color]}</span></span>
          <div class="swatches" role="group" aria-label="Cor">${Object.keys(COLORS).map((c) => `<button class="sw" data-color="${c}" aria-label="${COLORS[c]}" aria-pressed="${S.look.color === c}" style="--a:${AGENT_GRADIENTS[c][0]};--b:${AGENT_GRADIENTS[c][1]}"></button>`).join("")}</div></div>
        <div class="lrow"><span class="label">Olhos</span>
          <div class="opts" role="group" aria-label="Olhos">${Object.keys(EYES).map((k) => `<button class="opt" data-eyes="${k}" aria-pressed="${S.look.eyes === k}"><span class="stage"><span data-av="eyes:${k}" data-size="36"></span></span>${EYES[k]}</button>`).join("")}</div></div>
        <div class="lrow"><span class="label">Acessório <span class="optl">opcional</span></span>
          <div class="opts acc" role="group" aria-label="Acessório">${Object.keys(ACCS).map((k) => `<button class="opt ${k === "none" ? "none" : ""}" data-acc="${k}" aria-pressed="${S.look.accessory === k}"><span class="stage">${k === "none" ? I("ban") : `<span data-av="acc:${k}" data-size="30"></span>`}</span>${ACCS[k]}</button>`).join("")}</div></div>
      </div>`;
  },
  instrucoes() {
    const r = S.role ? ROLES[S.role] : null;
    const changed = r && S.role !== "custom" && S.instructions !== r.instructions;
    return head(`O que ${esc(display())} faz`, "Escreva como para um colega novo: o que fazer, o que evitar, a quem pedir ajuda.") + `
      <div class="ta-wrap">
        <textarea class="ta" id="instr" aria-label="Instruções" placeholder="Ex.: Responde dúvidas de clientes no #suporte com base na documentação. Quando não souber, chama alguém do time.">${esc(S.instructions)}</textarea>
        <div class="ta-meta">
          <span class="help" style="display:flex;gap:6px;align-items:center">${r && S.role !== "custom" ? `${I(r.icon, "sm")}Começou com o texto de ${r.name}` : I("pen", "sm") + "Do zero"}${changed ? ` · <button class="btn ghost sm" data-restore style="height:24px;padding:0 6px">${I("undo", "sm")}Voltar ao original</button>` : ""}</span>
          <span class="count" id="count">${S.instructions.length}</span>
        </div>
      </div>
      <div class="tips">${TIPS.map((t, i) => `<button class="tip" data-tip="${i}"><b>${I("plus", "sm")}${t.t}</b><span>${t.d}</span></button>`).join("")}</div>
      <div class="note" style="margin-top:14px">${I("info", "sm")}<span>O contexto da <b>Acme</b> (o que a empresa faz, regras da casa) já entra em toda conversa. Aqui vai só o que é de ${esc(display())}.</span></div>
      ${S.instructions.trim() ? "" : `<p class="help" style="margin-top:10px">Sem instruções, ${esc(display())} segue só o contexto do workspace.</p>`}`;
  },
  ferramentas() {
    const asks = (c) => (lvl(c.id) === "write" && c.ask.length ? `<div class="ask">${c.ask.map((a) => `<span class="chip warn">${I("lock", "sm")}${a} pede aprovação</span>`).join("")}</div>` : "");
    return head("Ferramentas e acesso", `Os apps que a Acme já conectou. Escolha, em cada um, até onde ${esc(display())} vai.`) + `
      <div class="card">
        <div class="sect" style="margin:0 0 6px"><span class="help">${CONNECTORS.length} conectados pela organização</span>
          <span class="quick">Todos: <button class="btn ghost sm" data-all="none">Sem acesso</button><button class="btn ghost sm" data-all="read">Ler</button></span></div>
        <div class="list">${CONNECTORS.map((c) => `<div class="crow">${logo(c)}<div class="t"><div class="n">${c.name}</div><div class="d">${c.acct}</div>${asks(c)}</div>
          ${seg("lv", Object.entries(LEVELS).map(([k, v]) => [`${c.id}:${k}`, v, `data-l="${k}"`]), `${c.id}:${lvl(c.id)}`, `aria-label="Nível em ${c.name}"`, "lv")}</div>`).join("")}</div>
        <button class="addrow" data-cancel>${I("plug")}Conectar outro app<span style="margin-left:auto;font-weight:500;color:var(--faint)">abre Conectores</span></button>
      </div>
      <div class="note" style="margin-top:12px">${I("shield", "sm")}<span><b>Merge, deploy e rollback sempre viram pedido de aprovação</b> no chat, mesmo com o conector liberado. Quem aprova é ${owner() ? esc(owner().name.split(" ")[0]) : "um admin"}.</span></div>
      <div class="sect"><h2>${I("book")}Skills <span class="optl" style="font-weight:500;color:var(--faint);font-size:12.5px">opcional</span></h2><span class="help">Manuais que ${esc(display())} abre quando precisa.</span></div>
      <div class="skills">${SKILLS.map((s) => `<button class="tog" data-skill="${s.id}" aria-pressed="${S.skills.has(s.id)}"><span class="box">${I("check")}</span>${esc(s.n)}${s.d ? `<span class="sub">${esc(s.d)}</span>` : ""}</button>`).join("")}</div>`;
  },
  onde() {
    const e = E(), o = owner();
    const ownerItems = [...MEMBERS.map((m) => ({ value: m.id, label: m.name + (m.me ? " (você)" : ""), sub: m.role, lead: `<span class="pa">${m.ini}</span>` })), { sep: true }, { value: "none", label: "Sem responsável", sub: "Os admins recebem os avisos e aprovam", lead: `<span class="pa none">${I("users", "sm")}</span>` }];
    OWNER_ITEMS = ownerItems;
    const modeText = { everyone: `Qualquer pessoa do workspace pode chamar ${esc(display())}.`, people: `Só quem você escolher fala com ${esc(display())}.`, owner: o ? `Só ${esc(o.name.split(" ")[0])} fala com ${esc(display())}.` : "Defina um responsável para usar esta opção." };
    return head("Onde trabalha e com quem", `${esc(display())} entra nos canais que você marcar e responde a uma pessoa do time.`) + `
      <div class="sect" style="margin-top:0"><h2>${I("hash")}Canais</h2><span class="help">Entra agora; dá para chamar em outros depois.</span></div>
      <div class="row" style="gap:8px">${CHANNELS.map((c) => `<button class="tog" data-ch="${c}" aria-pressed="${S.channels.has(c)}"><span class="box">${I("check")}</span>#${c}</button>`).join("")}</div>
      <div class="sect"><h2>${I("user")}Responsável</h2></div>
      <div class="card stack">
        <button class="sel" id="ownerSel" aria-haspopup="listbox" aria-expanded="false">${o ? `<span class="pa">${o.ini}</span>` : `<span class="pa none">${I("users", "sm")}</span>`}<span class="t"><b>${o ? esc(o.name) + (o.me ? " (você)" : "") : "Sem responsável"}</b><span>${o ? o.role : "Os admins recebem os avisos"}</span></span>${I("down", "chev")}</button>
        <span class="help">${o ? "Recebe os avisos de orçamento e aprova as ações sensíveis." : "Sem responsável, os admins recebem os avisos e aprovam as ações sensíveis."}</span>
      </div>
      <div class="sect"><h2>${I("chat")}Quem pode falar com ${esc(display())}</h2></div>
      <div class="card stack">
        ${seg("aud", [["everyone", "Todos do workspace"], ["people", "Algumas pessoas"], ["owner", "Só o responsável"]], S.audience, 'aria-label="Quem pode falar"')}
        <span class="help">${modeText[S.audience]} Quem não está na lista não recebe resposta.</span>
        ${S.audience === "people" ? `<div class="people">${MEMBERS.map((m) => `<button class="tog" data-person="${m.id}" aria-pressed="${S.people.has(m.id) || m.id === S.owner}" ${m.id === S.owner ? 'aria-disabled="true" title="Sempre pode, como responsável"' : ""}><span class="pa sm">${m.ini}</span>${esc(m.name.split(" ")[0])}${m.id === S.owner ? '<span class="sub">responsável</span>' : ""}</button>`).join("")}</div>` : ""}
        ${errLine(e.audience)}
      </div>`;
  },
  modelo() {
    const e = E(), k = KEYS.find((x) => x.id === S.key), m = model();
    const b = budgetValue();
    return head("Modelo e orçamento", "Quem pensa por trás e quanto pode gastar por mês. A chave fica cifrada no servidor; ninguém vê.") + `
      <div class="models" role="radiogroup" aria-label="Modelo">${MODELS.map((x) => `<button class="model" role="radio" data-model="${x.id}" aria-checked="${S.model === x.id}" aria-pressed="${S.model === x.id}" ${x.disabled ? 'aria-disabled="true"' : ""}>
        <span class="h"><b>${x.label}</b><span class="prov">${x.prov}</span></span><span class="d">${x.desc}</span>
        ${x.disabled ? `<span class="cost">${I("key", "sm")}Sem chave da ${x.prov}</span>` : `<span class="cost"><span class="meter" aria-hidden="true">${[1, 2, 3].map((n) => `<i class="${n <= x.tier ? "on" : ""}"></i>`).join("")}</span><span>US$ <span class="num">${x.price[0]}</span> / <span class="num">${x.price[1]}</span> por milhão de tokens</span></span>`}
      </button>`).join("")}</div>
      <p class="help" style="margin-top:10px">${I("sparkle", "sm")} Num mês típico, ${S.role && S.role !== "custom" ? `um agente de ${ROLES[S.role].name}` : "um agente"} com ${m.label} gasta de <b style="color:var(--ink)">${fmtUsd(m.typical?.[0] ?? 10)}</b> a <b style="color:var(--ink)">${fmtUsd(m.typical?.[1] ?? 30)}</b>.</p>
      <div class="sect"><h2>${I("key")}Chave</h2></div>
      <button class="sel" id="keySel" aria-haspopup="listbox" aria-expanded="false"><span class="ib">${I("key", "sm")}</span><span class="t"><b>${k.label}</b><span>${k.d}</span></span>${I("down", "chev")}</button>
      <div class="sect"><h2>${I("wallet")}Orçamento mensal</h2><span class="help">Ao atingir o limite, ${esc(display())} para e avisa.</span></div>
      <div class="card stack">
        <div class="money">
          <div class="input ${e.budget ? "bad" : ""}"><span class="pre">US$</span><input id="budget" inputmode="decimal" placeholder="${DEFAULT_BUDGET}" value="${esc(S.budget)}" aria-label="Orçamento mensal em dólares"></div>
          ${[10, 30, 100].map((v) => `<button class="tog" data-budget="${v}" aria-pressed="${b === v}">US$ ${v}</button>`).join("")}
        </div>
        ${e.budget ? errLine(e.budget) : `<span class="help">${S.budget.trim() === "" ? `Vazio usa o padrão do workspace: ${fmtUsd(DEFAULT_BUDGET)}.` : `Padrão do workspace: ${fmtUsd(DEFAULT_BUDGET)}.`} Avisamos ${owner() ? esc(owner().name.split(" ")[0]) : "os admins"} aos 80%.</span>`}
      </div>`;
  },
  revisar() {
    const r = ROLES[S.role ?? "custom"], o = owner(), k = KEYS.find((x) => x.id === S.key), b = budgetValue();
    const access = CONNECTORS.filter((c) => lvl(c.id) !== "none"), skills = SKILLS.filter((s) => S.skills.has(s.id));
    const row = (step, icon, k2, v) => `<div class="rv"><span class="k">${I(icon, "sm")}${k2}</span><div class="v">${v}</div><button class="btn ghost sm" data-go="${STEPS.findIndex((s) => s.id === step)}">${I("pen", "sm")}Editar</button></div>`;
    const chips = (arr, empty) => (arr.length ? `<div class="chips">${arr.join("")}</div>` : `<span class="faint">${empty}</span>`);
    const audience = S.audience === "everyone" ? "Todos do workspace" : S.audience === "owner" ? "Só o responsável" : MEMBERS.filter((m) => S.people.has(m.id)).map((m) => m.name.split(" ")[0]).join(", ");
    return head(`Tudo certo com ${esc(display())}?`, "Confira antes de criar. Depois, tudo isto fica no perfil do agente.") + `
      <div class="card review">
        ${row("papel", r.icon, "Papel", `<span>${S.role === "custom" ? "Do zero" : r.name + " · " + r.desc}</span>`)}
        ${row("identidade", "user", "Nome", `<span><b>${esc(display())}</b> <span class="faint">@${esc(S.handle)}</span></span><span class="faint" style="font-size:12.5px">${COLORS[S.look.color]} · olhos ${EYES[S.look.eyes].toLowerCase()}${S.look.accessory !== "none" ? " · " + ACCS[S.look.accessory].toLowerCase() : ""}</span>`)}
        ${row("instrucoes", "text", "Instruções", S.instructions.trim() ? `<span class="quote">${esc(S.instructions.trim())}</span>` : '<span class="faint">Só o contexto do workspace</span>')}
        ${row("ferramentas", "plug", "Ferramentas", chips([...access.map((c) => `<span class="chip">${mini(c)}${c.name} · ${lvl(c.id) === "write" ? "lê e escreve" : "lê"}</span>`), ...skills.map((s) => `<span class="chip">${I("book", "sm")}${esc(s.n)}</span>`)], "Nenhuma ferramenta"))}
        ${row("onde", "hash", "Canais", chips([...S.channels].map((c) => `<span class="chip">${I("hash", "sm")}${c}</span>`), "Nenhum canal: chame por @ ou mensagem direta"))}
        ${row("onde", "users", "Responde a", `<span>${o ? esc(o.name) : "Sem responsável (admins)"} <span class="faint">· fala com ${esc(audience)}</span></span>`)}
        ${row("modelo", "chip", "Modelo e custo", `<span>${model().label} <span class="faint">· ${k.label.toLowerCase()} · até ${fmtUsd(b && b > 0 ? b : DEFAULT_BUDGET)}/mês</span></span>`)}
      </div>
      <div class="note" style="margin-top:12px">${I("shield", "sm")}<span>Ações sensíveis sempre pedem aprovação no chat. ${o ? esc(o.name.split(" ")[0]) + " recebe" : "Os admins recebem"} os pedidos e os avisos de orçamento.</span></div>`;
  },
};
let OWNER_ITEMS = [];

function created() {
  const first = [...S.channels][0];
  const chans = [...S.channels].map((c) => "#" + c);
  const list = chans.length > 1 ? chans.slice(0, -1).join(", ") + " e " + chans.at(-1) : chans[0];
  return `<div class="born"><canvas class="sky" aria-hidden="true"></canvas><span class="agent"><span data-av="hero" data-size="${innerWidth <= 820 ? 108 : 150}" data-tight="0"></span></span>
      <p class="eyebrow">Novo no time</p>
      <h1>${esc(display())} entrou no time</h1>
      <p>${chans.length ? `Já está em ${list}. Mencione @${esc(S.handle)} numa conversa para começar.` : `Adicione ${esc(display())} a um canal e mencione @${esc(S.handle)} numa conversa para começar.`}</p>
      <div class="row">
        ${first ? `<button class="btn on-sky primary" data-noop>Ir para o #${first}${I("arrow", "sm")}</button>` : ""}
        <button class="btn on-sky ${first ? "" : "primary"}" data-noop>Abrir perfil</button>
        <button class="btn on-sky" data-again>${I("plus", "sm")}Criar outro agente</button>
      </div>
    </div>
    <div class="nexts">
      <div class="card"><b>${I("chat", "sm")}Diga oi</b><span>Peça a primeira tarefa com @${esc(S.handle)}${first ? " no #" + first : ""}.</span></div>
      <div class="card"><b>${I("bell", "sm")}Avisos com ${owner() ? esc(owner().name.split(" ")[0]) : "os admins"}</b><span>Orçamento aos 80% e pedidos de aprovação chegam no chat.</span></div>
      <div class="card"><b>${I("shield", "sm")}Acessos no perfil</b><span>Mude níveis, canais e modelo quando quiser.</span></div>
    </div>`;
}

/* ================= Render ================= */
function foot() {
  const last = S.step === STEPS.length - 1;
  const errs = S.err[S.step] ? Object.values(stepErrors(S.step)) : [];
  const hints = {
    papel: S.role ? `${ROLES[S.role].name === "Do zero" ? "Do zero" : "Começa como " + ROLES[S.role].agent}` : "Escolha um ponto de partida",
    identidade: S.handle ? `Chamado por @${esc(S.handle)}` : "",
    instrucoes: `<span class="kbd">⌘</span><span class="kbd">↵</span> continua daqui`,
    ferramentas: (() => { const n = CONNECTORS.filter((c) => lvl(c.id) !== "none").length; return n ? `${n} ${n === 1 ? "app liberado" : "apps liberados"}` : "Sem apps: só conversa"; })(),
    onde: S.channels.size ? `Entra em ${S.channels.size} ${S.channels.size === 1 ? "canal" : "canais"}` : "Nenhum canal ainda",
    modelo: model().label,
    revisar: "Dá para mudar tudo depois no perfil",
  };
  $("#foot").innerHTML = S.created ? "" : `<span class="hint ${errs.length ? "bad" : ""}">${errs.length ? I("info", "sm") + esc(errs[0]) : hints[STEPS[S.step].id]}</span>
    ${S.step > 0 ? `<button class="btn ghost" data-back>${I("left", "sm")}Voltar</button>` : `<button class="btn ghost" data-cancel>Cancelar</button>`}
    <button class="btn primary" data-next ${errs.length ? 'aria-disabled="true"' : ""}>${last ? `Criar ${esc(display())}` : "Continuar"}<span class="kbd">↵</span></button>`;
  $("#foot").style.display = S.created ? "none" : "";
}
function render(highlight) {
  closeMenu();
  renderRail();
  const c = $("#content");
  c.innerHTML = S.created ? created() : VIEWS[STEPS[S.step].id]();
  hydrate(c);
  if (S.created) { const a = live.at(-1); a.opts.hero = true; a.opts.born = true; R.bornAt = performance.now(); }
  foot();
  if (!S.created) renderPreview(highlight);
  requestAnimationFrame(() => placePills(c));
  bindInputs();
}
function bindInputs() {
  const name = $("#name"), handle = $("#handle"), instr = $("#instr"), budget = $("#budget");
  const typing = (look = [-0.45, 0.1]) => { R.writingUntil = performance.now() + 700; R.look = look; };
  if (name) name.oninput = () => {
    const had = !!S.name.trim();
    S.name = name.value; typing();
    if (!S.handleTouched) { S.handle = slug(S.name); handle.value = S.handle; }
    if (!had && S.name.trim()) react("happy", 1200, true);
    refreshLive("identidade");
  };
  if (handle) handle.oninput = () => { S.handleTouched = true; S.handle = handle.value.toLowerCase().replace(/[^a-z0-9-]/g, ""); handle.value = S.handle; typing([-0.3, 0.1]); refreshLive("identidade"); };
  if (instr) instr.oninput = () => { S.instructions = instr.value; typing([-0.5, 0.25]); $("#count").textContent = S.instructions.length; renderPreview(); };
  if (budget) budget.oninput = () => { S.budget = budget.value; renderPreview("modelo"); $$("[data-budget]").forEach((b) => b.setAttribute("aria-pressed", String(budgetValue() === Number(b.dataset.budget)))); if (S.err[S.step] && stepOk(S.step)) { S.err[S.step] = false; render(); setTimeout(() => $("#budget")?.focus()); } };
}
/* Update errors/help without losing focus while typing in Identidade. */
function refreshLive(key) {
  renderPreview(key === "identidade" ? undefined : key);
  if (STEPS[S.step].id === "identidade") {
    const e = S.err[S.step] ? stepErrors(S.step) : {};
    const hf = $("#handle").closest(".field"), nf = $("#name").closest(".field");
    $("#name").parentElement.classList.toggle("bad", !!e.name);
    $("#handle").parentElement.classList.toggle("bad", !!e.handle);
    nf.querySelector(".err")?.remove(); if (e.name) nf.insertAdjacentHTML("beforeend", errLine(e.name));
    const tail = hf.querySelector(".err, .help"); tail?.remove();
    hf.insertAdjacentHTML("beforeend", e.handle ? errLine(e.handle) : `<span class="help">${S.handle ? `Mencione <b style="color:var(--ink)">@${esc(S.handle)}</b> para chamar.` : "Sai do nome; dá para mudar."}</span>`);
    if (S.err[S.step] && !Object.keys(e).length) S.err[S.step] = false;
    foot();
  }
}

/* ================= Navigation ================= */
function setHash() { history.replaceState(null, "", S.created ? "#created" : `#step=${STEPS[S.step].id}`); }
function go(i) {
  if (!S.visited.has(i) || S.created) return;
  S.step = i; render(); setHash(); scrollTo({ top: 0 });
}
function next() {
  const errs = stepErrors(S.step);
  if (Object.keys(errs).length) {
    S.err[S.step] = true; render(); react("surprised", 1100);
    setTimeout(() => $(".bad input, .err")?.closest(".field, .card, .content")?.querySelector(".bad input")?.focus());
    return;
  }
  S.err[S.step] = false;
  if (S.step === STEPS.length - 1) { S.created = true; render(); setHash(); scrollTo({ top: 0 }); return; }
  S.step++; S.visited.add(S.step);
  react("happy", 900);
  render(); setHash(); scrollTo({ top: 0 });
}
function back() { if (S.created) return; if (S.step > 0) { S.step--; render(); setHash(); scrollTo({ top: 0 }); } }
function reset() {
  Object.assign(S, { step: 0, visited: new Set([0]), created: false, err: {}, role: null, name: "", handle: "", handleTouched: false, look: { color: "sky", eyes: "round", accessory: "none" }, instructions: "", levels: {}, skills: new Set(SKILLS.filter((s) => s.def).map((s) => s.id)), channels: new Set(), owner: "walt", audience: "everyone", people: new Set(), model: "sonnet", key: "default", budget: "" });
  render(); setHash(); scrollTo({ top: 0 });
}

document.addEventListener("click", (e) => {
  if (openMenu && !e.target.closest(".menu") && !e.target.closest("#ownerSel, #keySel")) closeMenu();
  const el = e.target.closest("button"); if (!el) return;
  const d = el.dataset;
  if (d.go != null) return go(Number(d.go));
  if ("next" in d) return next();
  if ("back" in d) return back();
  if ("again" in d) return reset();
  if ("cancel" in d || "noop" in d) { el.animate([{ transform: "scale(.97)" }, { transform: "none" }], { duration: 200 }); return; }
  if (el.id === "themeBtn") { const dark = document.documentElement.dataset.theme !== "dark"; document.documentElement.dataset.theme = dark ? "dark" : "light"; renderRail(); return; }
  if ("pvtoggle" in d) { S.pvOpen = !S.pvOpen; return renderPreview(); }
  if (d.role) {
    const changed = S.role !== d.role; applyRole(d.role);
    if (changed) react(d.role === "custom" ? "wink" : "happy", 1400, true);
    S.err[S.step] = false; return render();
  }
  if (d.color) { S.look.color = d.color; react("happy", 1100, true); return render(); }
  if (d.eyes) { S.look.eyes = d.eyes; react("wink", 700); return render(); }
  if (d.acc) { S.look.accessory = d.acc; if (d.acc !== "none") react("happy", 900, true); return render(); }
  if ("shuffle" in d) {
    const pick = (o) => { const k = Object.keys(o); return k[Math.floor(Math.random() * k.length)]; };
    S.look = { color: pick(COLORS), eyes: pick(EYES), accessory: pick(ACCS) }; react("dizzy", 1000, true); return render();
  }
  if ("restore" in d) { S.instructions = ROLES[S.role].instructions; return render(); }
  if (d.tip != null) {
    const t = TIPS[Number(d.tip)], ta = $("#instr");
    S.instructions = (S.instructions.trim() ? S.instructions.replace(/\s+$/, "") + "\n" : "") + t.text;
    render(); const ta2 = $("#instr"); ta2.focus(); ta2.setSelectionRange(ta2.value.length, ta2.value.length); return;
  }
  if (d.lv) { const [c, l] = d.lv.split(":"); S.levels[c] = l; if (l === "write") react("star", 900); return render("ferramentas"); }
  if (d.all) { for (const c of CONNECTORS) S.levels[c.id] = d.all; return render("ferramentas"); }
  if (d.skill) { S.skills.has(d.skill) ? S.skills.delete(d.skill) : S.skills.add(d.skill); return render("ferramentas"); }
  if (d.ch) { S.channels.has(d.ch) ? S.channels.delete(d.ch) : S.channels.add(d.ch); if (S.channels.has(d.ch)) react("happy", 700); return render("onde"); }
  if (d.aud) { S.audience = d.aud; if (S.err[S.step] && stepOk(S.step)) S.err[S.step] = false; return render("quem"); }
  if (d.person) { if (el.getAttribute("aria-disabled")) return; S.people.has(d.person) ? S.people.delete(d.person) : S.people.add(d.person); if (S.err[S.step] && stepOk(S.step)) S.err[S.step] = false; return render("quem"); }
  if (d.model) { if (el.getAttribute("aria-disabled")) return; S.model = d.model; react(d.model === "opus" ? "star" : "happy", 800); return render("modelo"); }
  if (d.budget) { S.budget = d.budget; if (S.err[S.step] && stepOk(S.step)) S.err[S.step] = false; return render("modelo"); }
  if (el.id === "ownerSel") { if (openMenu?.btn === el) return closeMenu(); return showMenu(el, OWNER_ITEMS, S.owner, (v) => { S.owner = v; S.people.delete(v); if (S.err[S.step] && stepOk(S.step)) S.err[S.step] = false; render("quem"); }); }
  if (el.id === "keySel") { if (openMenu?.btn === el) return closeMenu(); return showMenu(el, KEYS.map((k) => ({ value: k.id, label: k.label, sub: k.d, lead: `<span class="ib">${I("key", "sm")}</span>` })), S.key, (v) => { S.key = v; render("modelo"); }); }
});

/* Keyboard: Enter continues (⌘↵ in the instructions), Esc goes back (or closes a menu). */
document.addEventListener("keydown", (e) => {
  if (openMenu && openMenu.key(e)) return;
  const tag = e.target.tagName;
  if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
    if (tag === "TEXTAREA" && !(e.metaKey || e.ctrlKey)) return;
    if (tag === "BUTTON" && !("next" in e.target.dataset)) return;
    e.preventDefault(); if (!S.created) next();
  }
  if (e.key === "Escape") {
    if (tag === "INPUT" || tag === "TEXTAREA") { e.target.blur(); return; }
    back();
  }
});
addEventListener("resize", () => { pvAvatar = null; $$("#pvCover canvas.av").forEach((c) => c.remove()); if (!S.created) renderPreview(); placePills(); });

/* ================= Deep links ================= */
function fromHash() {
  const q = new URLSearchParams(location.hash.slice(1).replace(/^created$/, "created=1"));
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme") === "light" ? "light" : "dark";
  const role = ROLES[q.get("role")] ? q.get("role") : null;
  const stepId = q.get("step"), at = STEPS.findIndex((s) => s.id === stepId);
  const isCreated = q.has("created");
  if (at > 0 || isCreated || role) applyRole(role ?? "qa");
  if (!role && at === 0) { S.role = null; }
  if (at >= 0 || isCreated) {
    const to = isCreated ? STEPS.length - 1 : at;
    for (let i = 0; i <= to; i++) S.visited.add(i);
    S.step = to;
  }
  S.created = isCreated;
}
fromHash();
render();
// Pills follow layout changes (fonts arriving, wrapping, resizes).
document.fonts?.ready.then(() => placePills());
new ResizeObserver(() => placePills()).observe($("#content"));
</script>
