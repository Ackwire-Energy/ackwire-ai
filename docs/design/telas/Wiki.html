<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Doto:ROND,wght@100,600;100,700&family=Martian+Mono:wght@400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: the org wiki (D34) on the approved design system (Proposta 2, Componentes.dc.html).
  Home with recents, folders and what the agents read most; a reading page with outline, backlinks,
  "agents that use this page" and history; inline editing with [[ autocomplete; the graph;
  and importing an Obsidian vault (.zip, folder or .md files, read for real in the browser).
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;--dot:"Doto",monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
.sr{position:absolute;left:-9999px}
.dot{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:700}

/* ---------- design system bits ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.seg button:focus-visible,.tn:focus-visible,.pc:focus-visible,.mi:focus-visible,.fc:focus-visible,.drop-zone:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b1[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.ib.sm{width:28px;height:28px;border-radius:8px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
button.chip{cursor:pointer}
button.chip:hover{color:var(--ink)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes bob{to{transform:translateY(-4px)}}
.obs{width:18px;height:18px;flex:none}

/* People: a circle with the initial. Agents: the engine's body (canvas). */
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .46);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.stack{display:inline-flex}
.stack > *{margin-left:-6px;box-shadow:0 0 0 2px var(--bg);border-radius:50%}
.stack > *:first-child{margin-left:0}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}
.proto .b.sm{height:30px}

/* ---------- app frame: rail | wiki nav | content ---------- */
.app{display:grid;grid-template-columns:64px 268px minmax(0,1fr);min-height:calc(100vh - 51px)}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}

/* nav */
.nav{position:sticky;top:0;height:calc(100vh - 51px);overflow-y:auto;padding:18px 12px 18px 16px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line);scrollbar-width:thin}
.nav-hd{display:flex;align-items:center;gap:8px}
.nav-hd b{font-family:var(--display);font-weight:300;font-size:24px;letter-spacing:-.02em;flex:1}
.search{display:flex;align-items:center;gap:9px;height:38px;padding:0 8px 0 11px;border-radius:12px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);transition:box-shadow .2s var(--out)}
.search:focus-within{box-shadow:var(--e2),0 0 0 1.5px var(--ink)}
.search input{all:unset;flex:1;min-width:0;color:var(--ink);font-size:14px}
.search input::placeholder{color:var(--faint)}
.navl{display:flex;flex-direction:column;gap:1px}
.tn{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 8px;border-radius:9px;border:0;background:transparent;color:var(--ink2);font-size:13.5px;cursor:pointer;text-align:left;transition:background .12s}
.tn:hover{background:rgba(127,127,127,.1)}
.tn[aria-current="page"]{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink);font-weight:600}
.tn .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn .n{color:var(--faint);font-size:12px;font-weight:500}
.tn svg.i{color:var(--faint)}
.tn[aria-current="page"] svg.i{color:var(--ink2)}
.tn .car{transition:transform .2s var(--out);color:var(--faint)}
.tn[aria-expanded="false"] .car{transform:rotate(-90deg)}
.tn .new{height:18px;padding:0 6px;font-size:10.5px}
.sub{padding-left:14px;margin-left:8px;border-left:1px solid var(--line)}
.nlabel{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:0 8px;margin-bottom:4px}
.nlabel .grow{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:0 4px}
.tg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 1px var(--line2);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tg:hover{color:var(--ink);background:rgba(127,127,127,.08)}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.tg svg{width:12px;height:12px}
.nav-ft{margin-top:auto;padding-top:6px}
.imp{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);cursor:pointer;text-align:left;transition:box-shadow .15s,transform .18s var(--spring)}
.imp:hover{box-shadow:var(--e2),var(--top)}
.imp:active{transform:scale(.98)}
.imp b{display:block;font-size:13px}
.imp small{display:block;color:var(--muted);font-size:12px}

/* ---------- content ---------- */
.main{min-width:0;padding:26px 32px 120px}
.hd{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.hd h1{font-family:var(--display);font-weight:300;font-size:clamp(32px,4vw,44px);letter-spacing:-.03em;line-height:1.05}
.hd p{color:var(--muted);margin-top:6px;max-width:62ch}
.hd .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{margin-bottom:30px;animation:fi .3s var(--out) both}
.sh{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.sh h2{font-size:13px;font-weight:650;color:var(--ink2)}
.sh .n{font-size:12px;color:var(--faint);font-weight:600}
.sh .grow{flex:1}

/* page cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:12px}
.pc{position:relative;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);border:0;text-align:left;cursor:pointer;min-height:168px;transition:box-shadow .2s var(--out),transform .25s var(--spring)}
.pc:hover{box-shadow:var(--e2),var(--top);transform:translateY(-2px)}
.pc .where{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);font-weight:600}
.pc b{font-size:16px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.pc p{color:var(--muted);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc .by{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint)}
.pc .by .who{color:var(--ink2);font-weight:600}
.pc .src{position:absolute;top:14px;right:14px}

.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.panel{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:6px;overflow:hidden}
.lr{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;border:0;background:transparent;cursor:pointer;text-align:left}
.lr:hover{background:rgba(127,127,127,.08)}
.lr .t{flex:1;min-width:0}
.lr .t b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .t small{display:block;color:var(--faint);font-size:12px}
.bar{width:84px;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;flex:none}
.bar i{display:block;height:100%;border-radius:99px;background:color-mix(in srgb,var(--agent) 70%,var(--raised))}
.cnt{font-size:17px;min-width:30px;text-align:right;color:var(--ink)}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px}
.fd{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:0;background:var(--sunken);cursor:pointer;text-align:left;transition:background .15s}
.fd:hover{background:color-mix(in srgb,var(--sunken) 70%,var(--plate))}
.fd .fi{width:34px;height:34px;border-radius:10px 10px 10px 3px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.fd b{display:block;font-size:13.5px}
.fd small{color:var(--faint);font-size:12px}
.mini-graph{position:relative;height:172px;border-radius:14px;margin:8px;overflow:hidden;background:var(--sunken);cursor:pointer}
.mini-graph canvas{position:absolute;inset:0;width:100%;height:100%}
.mini-graph span{position:absolute;left:12px;bottom:10px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2);padding:5px 10px;border-radius:999px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 1px var(--line)}

/* search results */
.results{display:flex;flex-direction:column;gap:6px}
.res{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;background:var(--raised);box-shadow:var(--e1);border:0;text-align:left;cursor:pointer}
.res:hover{box-shadow:var(--e2)}
.res b{font-size:14.5px}
.res small{color:var(--faint);font-size:12px}
.res p{color:var(--muted);font-size:13px}
mark{background:color-mix(in srgb,var(--warn) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- reading page ---------- */
.page{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:40px;align-items:start;max-width:1180px}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--faint);font-size:13px;margin-bottom:12px}
.crumbs button:not(.navbtn){all:unset;cursor:pointer;color:var(--muted);font-weight:500;border-radius:6px;padding:1px 4px;margin:0 -4px}
.crumbs button:not(.navbtn):hover{color:var(--ink);background:rgba(127,127,127,.1)}
.ptop{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.ptitle{font-family:var(--display);font-weight:300;font-size:clamp(34px,4.4vw,50px);letter-spacing:-.035em;line-height:1.04;word-break:break-word}
.ptitle-in{all:unset;display:block;width:100%;font-family:var(--display);font-weight:300;font-size:clamp(34px,4.4vw,50px);letter-spacing:-.035em;line-height:1.1}
.ptitle-in::placeholder{color:var(--faint)}
.pacts{display:flex;gap:6px;flex:none;padding-top:6px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:16px 0 26px;color:var(--muted);font-size:13px}
.meta .by{display:inline-flex;align-items:center;gap:8px}
.meta .by b{color:var(--ink2);font-weight:600}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--faint);opacity:.6}
.meta .tagrow{display:inline-flex;gap:5px;flex-wrap:wrap}

/* article typography */
.md{font-size:16px;line-height:1.72;color:var(--ink2);max-width:72ch}
.md > *{margin:0 0 14px}
.md h2{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:-.02em;line-height:1.2;color:var(--ink);margin:34px 0 10px;scroll-margin-top:20px}
.md h3{font-size:17px;font-weight:650;letter-spacing:-.01em;color:var(--ink);margin:24px 0 8px;scroll-margin-top:20px}
.md h2:first-child,.md h3:first-child{margin-top:0}
.md p{margin:0 0 14px}
.md ul,.md ol{padding-left:22px;margin:0 0 14px}
.md li{margin:3px 0}
.md li::marker{color:var(--faint)}
.md ul.tasks{list-style:none;padding-left:2px}
.md ul.tasks li{display:flex;gap:10px;align-items:flex-start}
.md .cb{width:18px;height:18px;border-radius:6px;flex:none;margin-top:4px;box-shadow:inset 0 0 0 1.5px var(--line2);display:inline-flex;align-items:center;justify-content:center;color:transparent}
.md .cb.on{background:var(--ink);color:var(--bg);box-shadow:none}
.md .cb svg{width:12px;height:12px;stroke-width:2.6}
.md li.done{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line2)}
.md strong{color:var(--ink);font-weight:650}
.md code{font-family:var(--mono);font-size:.8em;padding:2px 6px;border-radius:6px;background:var(--sunken)}
.md pre{font-family:var(--mono);font-size:12.5px;line-height:1.7;padding:14px 16px;border-radius:14px;background:var(--sunken);overflow-x:auto;color:var(--ink2)}
.md pre code{padding:0;background:none;font-size:inherit}
.md pre .lang{display:block;font-family:var(--sans);font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.md hr{border:0;height:1px;background:var(--line2);margin:26px 0}
.md blockquote{margin:0 0 14px;padding:2px 0 2px 16px;border-left:2px solid var(--line2);color:var(--muted)}
.md table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.md th,.md td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.md th{font-weight:650;color:var(--ink);background:var(--sunken);font-size:12.5px}
.md tr:last-child td{border-bottom:0}
.md a.wl{color:var(--ink);font-weight:600;text-decoration:none;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--agent) 18%,transparent) 62%);border-radius:2px;cursor:pointer;padding:0 1px}
.md a.wl:hover{background:color-mix(in srgb,var(--agent) 16%,transparent)}
.md a.wl.missing{color:var(--muted);font-weight:500;background:none;text-decoration:underline dashed;text-decoration-color:var(--faint);text-underline-offset:3px}
.md a.ext{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}

  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
}
function embed(name) {
  const isImg = /\.(png|jpe?g|gif|webp|svg)$/i.test(name);
  return `<div class="embed"><span class="th">${isImg ? I.image : I.file}</span><span><b>${esc(name)}</b><small>Anexo · no Drive em Wiki/anexos</small></span></div>`;

function md(src) {
  const lines = src.replace(/^---\n[\s\S]*?\n---\n?/, "").split("\n");
  const out = [];
  const heads = [];
  let i = 0;
  const para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para.length = 0; } };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      flush();
      const lang = l.slice(3).trim();
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      if (lang === "dataview") out.push(`<div class="dv">${I.info}<span>Consulta Dataview do Obsidian. Fica guardada como texto; os agentes podem montar a tabela se você pedir.</span></div>`);
      else out.push(`<pre>${lang ? `<span class="lang">${esc(lang)}</span>` : ""}<code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    let m;
    if ((m = /^(#{1,3})\s+(.*)$/.exec(l))) {
      flush();
      const lv = Math.max(2, m[1].length);
      const id = "h-" + slugify(m[2]);
      if (m[1].length === 1 && heads.length === 0 && out.length === 0) { i++; continue; } // the title line
      heads.push({ lv, text: m[2], id });
      out.push(`<h${lv} id="${id}">${inline(m[2])}</h${lv}>`);
      i++; continue;
    }
    if ((m = /^>\s*\[!(\w+)\][+-]?\s*(.*)$/.exec(l))) {
      flush();
      const kind = low(m[1]);
      const body = [];
      i++;
      while (i < lines.length && /^>/.test(lines[i])) body.push(lines[i++].replace(/^>\s?/, ""));
      const ic = kind === "warning" || kind === "caution" ? I.warn : kind === "tip" ? I.tip : I.note;
      out.push(`<div class="callout ${kind === "caution" ? "warning" : kind}"><span class="ci">${ic}</span><div><b>${inline(m[2] || kind)}</b>${body.length ? `<p>${inline(body.join(" "))}</p>` : ""}</div></div>`);
      continue;
    }
    if (/^>/.test(l)) {
      flush();
      const body = [];
      while (i < lines.length && /^>/.test(lines[i])) body.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${inline(body.join(" "))}</blockquote>`);
      continue;
    }
    if (/^\s*[-*]\s+\[[ xX]\]/.test(l)) {
      flush();
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+\[[ xX]\]/.test(lines[i])) { const on = /\[[xX]\]/.test(lines[i]); items.push(`<li class="${on ? "done" : ""}"><span class="cb ${on ? "on" : ""}">${I.check}</span><span>${inline(lines[i].replace(/^\s*[-*]\s+\[[ xX]\]\s*/, ""))}</span></li>`); i++; }
      out.push(`<ul class="tasks">${items.join("")}</ul>`);
      continue;
    }
    if (/^\s*[-*]\s+/.test(l)) {
      flush();
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i]) && !/^\s*[-*]\s+\[[ xX]\]/.test(lines[i])) items.push(`<li>${inline(lines[i++].replace(/^\s*[-*]\s+/, ""))}</li>`);
      out.push(`<ul>${items.join("")}</ul>`);
      continue;
    }
    if (/^\s*\d+\.\s+/.test(l)) {
      flush();
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) items.push(`<li>${inline(lines[i++].replace(/^\s*\d+\.\s+/, ""))}</li>`);
      out.push(`<ol>${items.join("")}</ol>`);
      continue;
    }
    if (/^\|/.test(l)) {
      flush();
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const [h, , ...rest] = rows;
      out.push(`<table><thead><tr>${cells(h).map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rest.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if ((m = /^!\[\[([^\]|]+)(\|[^\]]*)?\]\]\s*$/.exec(l))) { flush(); out.push(embed(m[1])); i++; continue; }
    if (/^(-{3,}|\*{3,})$/.test(l.trim())) { flush(); out.push("<hr>"); i++; continue; }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l.trim());
    i++;
  }
  flush();
  return { html: out.join(""), heads };
}

/* ---------- tree ---------- */
function tree(pages) {
  const root = { name: "", path: "", kids: new Map(), pages: [] };
  for (const p of pages) {
    let n = root;
    if (p.folder) for (const part of p.folder.split("/")) {
      const path = n.path ? `${n.path}/${part}` : part;
      if (!n.kids.has(part)) n.kids.set(part, { name: part, path, kids: new Map(), pages: [] });
      n = n.kids.get(part);
    }
    n.pages.push(p);
  }
  return root;
}

function treeHTML(n, filtering) {

/* outline follows the scroll */
let outlineObs;
function watchOutline() {
  outlineObs?.disconnect();
  const hs = $$("#md h2, #md h3");
  if (!hs.length || !$("#outline")) return;
  outlineObs = new IntersectionObserver((es) => {
    const vis = es.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (!vis) return;
    $$("#outline button").forEach((b) => b.setAttribute("aria-current", String(b.dataset.jump === vis.target.id)));
  }, { rootMargin: "0px 0px -70% 0px" });
  hs.forEach((h) => outlineObs.observe(h));
}

      <div class="dlg-bd">
        <div class="stats">${statHTML(r.notes.length, "notas")}${statHTML(r.folders.filter((f) => f.name).length, "pastas")}${statHTML(r.links, "links")}${statHTML(r.attachments.length, "anexos")}</div>
        <div class="blk"><div class="blk-hd">O que importar<span class="grow"></span><span class="muted-s">${chosen.length} de ${r.notes.length}</span></div>${rowsF}</div>
        <div class="blk"><div class="blk-hd">Onde colocar</div>
          <div class="frow"><div class="dest"><div class="seg" id="destSeg" role="group" aria-label="Destino"><span class="pill" aria-hidden="true"></span><button type="button" data-dest="root" aria-pressed="${IMP.dest === "root"}">Mesclar com a wiki</button><button type="button" data-dest="folder" aria-pressed="${IMP.dest === "folder"}">Numa pasta própria</button></div>${IMP.dest === "folder" ? `<input id="destName" value="${esc(IMP.destName)}" aria-label="Nome da pasta">` : ""}</div></div>
          ${r.conflicts.length && IMP.dest === "root" ? `<div class="frow"><span class="wn">${I.merge}</span><span class="t">${r.conflicts.length} ${r.conflicts.length === 1 ? "nota tem" : "notas têm"} o nome de uma página que já existe<small>${r.conflicts.map(esc).join(", ")}</small></span><div class="seg" id="confSeg" role="group" aria-label="Conflitos"><span class="pill" aria-hidden="true"></span><button type="button" data-conf="both" aria-pressed="${IMP.conflict === "both"}">Manter as duas</button><button type="button" data-conf="skip" aria-pressed="${IMP.conflict === "skip"}">Pular</button></div></div>` : ""}
        </div>
        <div class="blk"><div class="blk-hd">Como fica aqui</div>
          ${ok("<b>[[Links]]</b>, <b>[[nota|apelido]]</b> e <b>[[nota#seção]]</b> continuam funcionando", "A wiki usa a mesma sintaxe. Backlinks e grafo saem prontos.")}
          ${r.tags.length ? ok(`<b>${r.tags.length} tags</b> do frontmatter e do texto`, r.tags.slice(0, 8).map((t) => "#" + esc(t)).join(" ") + (r.tags.length > 8 ? " …" : "")) : ""}
          ${r.attachments.length ? ok(`<b>${r.attachments.length} anexos</b> vão para o Drive, em Wiki/anexos`, `${fmtBytes(r.bytes)}. Os <b>![[embeds]]</b> viram cartões na página.`) : ""}
          ${r.callouts ? ok(`<b>${r.callouts} callouts</b> (&gt; [!note]) ficam como destaques`) : ""}
          ${r.broken.length ? wn(`<b>${r.broken.length} ${r.broken.length === 1 ? "link aponta" : "links apontam"}</b> para notas que não existem`, `Ficam como “página para criar”: ${r.broken.slice(0, 4).map(esc).join(", ")}${r.broken.length > 4 ? "…" : ""}`) : ""}
          ${r.dataview ? wn(`<b>${r.dataview} ${r.dataview === 1 ? "consulta" : "consultas"} Dataview</b> entram como texto`, "Não rodam aqui. Peça a um agente para montar a tabela.") : ""}
          ${r.canvases.length ? no(`<b>${r.canvases.length} ${r.canvases.length === 1 ? "canvas" : "canvases"}</b> ficam de fora`, "Ainda não lemos .canvas.") : ""}
          ${r.skipped.config ? no(`Configuração do Obsidian ignorada`, `${r.skipped.config} arquivos em .obsidian (plugins, temas, workspace)${r.skipped.trash ? ` e ${r.skipped.trash} na lixeira` : ""}`) : ""}
        </div>
      </div>
      <div class="dlg-ft"><span class="hint">Cada página entra como v1, “importada por Walter”.</span><button class="b bg sm" type="button" data-again>Trocar arquivo</button><button class="b b1 sm" type="button" data-go ${chosen.length ? "" : "disabled"}>Importar ${chosen.length} ${chosen.length === 1 ? "nota" : "notas"}</button></div>`;
    placePill($("#destSeg"));
    const cs = $("#confSeg"); if (cs) placePill(cs);
    const dn = $("#destName"); if (dn) dn.oninput = () => { IMP.destName = dn.value; };
    return;
  }
  if (IMP.step === "importing") {
    box.innerHTML = head("Importando", "Criando as páginas, ligando os links e mandando os anexos para o Drive.") + `<div class="dlg-bd"><div class="reading" id="impRead"><span class="num dot">0</span><span style="color:var(--muted)">páginas criadas</span><div class="prog"><i></i></div><small></small></div></div>`;
    return;
  }
  if (IMP.step === "done") {
    box.innerHTML = head("Pronto", "") + `
      <div class="dlg-bd">
        <div class="done-hero"><canvas class="sky" data-surface="--raised"></canvas><div class="who">${avHTML(A("theo"), 44, "data-happy")}${avHTML(A("lia"), 36, "data-happy")}</div><b>${IMP.count} páginas na wiki</b><span>Theo e Lia já podem consultar. As novas aparecem marcadas como “novo”.</span></div>
        ${IMP.res.attachments.length ? `<div class="notice">${I.info}<span>${IMP.res.attachments.length} anexos estão em <b>Drive → Wiki/anexos</b>.</span></div>` : ""}
      </div>
      <div class="dlg-ft"><span class="hint"></span><button class="b b2 sm" type="button" data-act="graph" data-close>Ver no grafo</button><button class="b b1 sm" type="button" data-open-first data-close>Abrir ${esc(IMP.first)}</button></div>`;
    hydrate(box);
  }
}
async function doImport() {
  const r = IMP.res;
  const prefix = IMP.dest === "folder" ? (IMP.destName.trim() || "Obsidian") : "";
  let notes = r.notes.filter((n) => IMP.pick.has(n.folder.split("/")[0] || ""));
  if (S.empty) PAGES = [];
  const existing = new Set(PAGES.map((p) => low(p.title)));
  if (IMP.dest === "root" && IMP.conflict === "skip") notes = notes.filter((n) => !existing.has(low(n.title)));
  IMP.step = "importing"; drawImporter();
  IMP.total = notes.length;
  const made = [];
  for (let k = 0; k < notes.length; k++) {
    const n = notes[k];
    let title = n.title;
    if (existing.has(low(title))) title = `${title} (Obsidian)`;
    const p = { id: PAGES.length + 1, title, slug: slugify(title), folder: [prefix, n.folder].filter(Boolean).join("/"), tags: n.tags, aliases: n.aliases, body: n.body.replace(/^#\s+.*\n+/, ""), by: P("walter"), at: 0, v: 1, reads: {}, source: "obsidian" };
    PAGES.push(p); made.push(p); S.fresh.add(p.slug);
    IMP.progress = k + 1; IMP.cur = n.path; drawReading();
    await new Promise((res) => setTimeout(res, Math.min(60, 1400 / notes.length)));
  }
  if (prefix) S.open.add(prefix);
  for (const p of made) { const top = p.folder.split("/"); for (let i = 1; i <= top.length; i++) S.open.add(top.slice(0, i).join("/")); }
  S.empty = false;
  $('[data-proto="empty"]').setAttribute("aria-pressed", "false");
  IMP.count = made.length;
  const home = made.find((p) => /^(início|inicio|home|index|readme|mapa)/i.test(p.title)) ?? made[0];
  IMP.first = home?.title ?? "";
  IMP.firstSlug = home?.slug;
  IMP.step = "done";
  drawImporter();
  render();
}

/* ---------- dialogs, menus, toasts ---------- */
function dialog(inner, cls = "") {
  closeDialog();
  const sc = document.createElement("div");
  sc.className = "scrim";
  sc.innerHTML = `<div class="dlg ${cls}" role="dialog" aria-modal="true">${inner}</div>`;
  sc.addEventListener("mousedown", (e) => { if (e.target === sc) closeDialog(); });
  $("#layer").append(sc);
  hydrate(sc);
  return sc.querySelector(".dlg");
}
function closeDialog() { $("#layer").innerHTML = ""; }
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
function openMenu(anchor, html) {
  closeMenu();
  menuEl = document.createElement("div");
  menuEl.className = "menu glass";
  menuEl.innerHTML = html;
  document.body.append(menuEl);
  const r = anchor.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  menuEl.style.left = Math.max(12, Math.min(r.right - mw, innerWidth - mw - 12)) + "px";
  menuEl.style.top = (r.bottom + 6 + mh > innerHeight ? r.top - mh - 6 : r.bottom + 6) + "px";
}
function toast({ icon = I.check, ok = true, title, sub = "", ms = 3800 }) {
  const t = document.createElement("div");
  t.className = "toast glass";
  t.innerHTML = `<span class="ti ${ok ? "ok" : ""}">${icon}</span><span class="tt"><b>${title}</b>${sub ? `<small>${sub}</small>` : ""}</span><button class="ib sm" type="button" aria-label="Fechar">${I.x}</button>`;
  t.querySelector("button").onclick = () => dismiss(t);
  $("#toasts").append(t);
  setTimeout(() => dismiss(t), ms);
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add("out"); setTimeout(() => t.remove(), 200); }

/* ---------- segmented pills ---------- */
function placePill(seg) {
  if (!seg) return;
  const on = seg.querySelector('button[aria-pressed="true"]'), pill = seg.querySelector(".pill");
  if (!on || !pill) return;
  pill.style.width = on.offsetWidth + "px";
  pill.style.transform = `translateX(${on.offsetLeft}px)`;
}

/* ---------- routing ---------- */
function render() {
  renderNav();
  if (S.view === "page") renderPage();
  else if (S.view === "graph") renderGraph();
  else renderHome();
}
function openPage(slug) {
  if (S.editing && !confirmLeave()) return;
  S.view = "page"; S.slug = slug; S.editing = false;
  $("#nav").classList.remove("open");
  render();
  window.scrollTo({ top: 0 });
}
function confirmLeave() { S.editing = false; acClose(); toast({ icon: I.info, ok: false, title: "Rascunho descartado", sub: "No app, o rascunho fica salvo até você voltar." }); return true; }
function go(view) { if (S.editing) confirmLeave(); S.view = view; S.editing = false; $("#nav").classList.remove("open"); render(); window.scrollTo({ top: 0 }); }

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, a, [data-act], [data-open], [data-tag]");
  if (menuEl && !e.target.closest(".menu")) closeMenu();
  if (!el) return;
  const d = el.dataset;
  if ("close" in d && !d.act && !("openFirst" in d)) return closeDialog();
  if ("openFirst" in d) { closeDialog(); return openPage(IMP.firstSlug); }
  if (d.open) return openPage(d.open);
  if (d.create != null) { S.folderHint = cur()?.folder ?? ""; return newPage(d.create); }
  if (d.folder != null) { S.open.has(d.folder) ? S.open.delete(d.folder) : S.open.add(d.folder); return renderNav(); }
  if (d.folderOpen != null) { S.open.add(d.folderOpen); $("#nav").classList.add("open"); renderNav(); const b = $(`[data-folder="${CSS.escape(d.folderOpen)}"]`); b?.scrollIntoView({ block: "center" }); b?.focus(); return; }
  if (d.tag && !el.closest(".md, .menu")) { S.tag = S.tag === d.tag ? null : d.tag; return render(); }
  if (d.tag && el.closest(".md")) { S.tag = d.tag; return render(); }
  if (d.jump) { document.getElementById(d.jump)?.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth" }); return; }
  if (d.gf) { S.graphFilter = d.gf; $$("[data-gf]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.gf === d.gf))); graphs.forEach((g) => (g.alpha = Math.max(g.alpha, .2))); return; }
  if (d.ins) return insert(d.ins);
  if (el.closest("#edMode") && d.v) { S.draft.body = $("#ed")?.value ?? S.draft.body; S.edMode = d.v; return renderPage(); }
  if (el.closest("#theme") && d.v) return setTheme(d.v);
  if (d.pick === "zip") return $("#fZip").click();
  if (d.pick === "dir") return $("#fDir").click();
  if ("sample" in d) return read(Promise.resolve(sampleVault()));
  if ("again" in d) { IMP.step = "pick"; return drawImporter(); }
  if ("go" in d) return doImport();
  if (d.fpick != null) { IMP.pick.has(d.fpick) ? IMP.pick.delete(d.fpick) : IMP.pick.add(d.fpick); return drawImporter(); }
  if (d.dest) { IMP.dest = d.dest; return drawImporter(); }
  if (d.conf) { IMP.conflict = d.conf; return drawImporter(); }
  if (d.proto === "drop") { showDrop(true); setTimeout(() => { showDrop(false); openImporter(Promise.resolve(sampleVault())); }, 1300); return; }
  if (d.proto === "empty") { S.empty = !S.empty; el.setAttribute("aria-pressed", String(S.empty)); S.view = "home"; S.editing = false; return render(); }
  if (d.menu) return menuAct(d.menu);
  switch (d.act) {
    case "home": return go("home");
    case "graph": closeDialog(); return go("graph");
    case "new": S.folderHint = S.view === "page" ? cur()?.folder ?? "" : ""; return newPage();
    case "new-from-q": { const q = S.q; S.q = ""; return newPage(q); }
    case "import": $("#nav").classList.remove("open"); return openImporter();
    case "edit": return startEdit(cur());
    case "save": return save();
    case "cancel": {
      const p = cur();
      if (p.v === 0) { PAGES = PAGES.filter((x) => x !== p); S.view = "home"; }
      S.editing = false; S.draft = null; acClose(); return render();
    }
    case "history": return openHistory(d.v ? +d.v : undefined);
    case "nav": return $("#nav").classList.toggle("open");
    case "starter": return starter();
    case "pick-folder": {
      const fs = ["", ...new Set(PAGES.flatMap((p) => p.folder.split("/").map((_, i, a) => a.slice(0, i + 1).join("/"))).values())].filter((f, i, a) => a.indexOf(f) === i).sort();
      return openMenu(el, fs.map((f) => `<button class="mi" type="button" data-menu="folder:${esc(f)}">${I.folder}${esc(f || "Raiz")}${S.draft.folder === f ? `<span class="sub">${I.check}</span>` : ""}</button>`).join(""));
    }
    case "more": {
      const p = cur();
      return openMenu(el, `
        <button class="mi" type="button" data-menu="copy">${I.link}Copiar link<span class="sub">[[${esc(p.title)}]]</span></button>
        <button class="mi" type="button" data-menu="ask">${I.chat}Perguntar ao Theo sobre esta página</button>
        <button class="mi" type="button" data-menu="history">${I.history}Histórico</button>
        <div class="msep"></div>
        <button class="mi" type="button" data-menu="rename">${I.pen}Renomear</button>
        <button class="mi" type="button" data-menu="move">${I.move}Mover para pasta</button>
        <button class="mi" type="button" data-menu="pin">${I.home}${p.pinned ? "Desafixar" : "Fixar no topo"}</button>
        <button class="mi" type="button" data-menu="lock">${I.lock}${p.locked ? "Destrancar" : "Trancar"}<span class="sub">admins</span></button>
        <div class="msep"></div>
        <button class="mi danger" type="button" data-menu="delete">${I.trash}Mover para a lixeira</button>`);
    }
  }
});
function menuAct(a) {
  const p = cur();
  closeMenu();
  if (a.startsWith("folder:")) { S.draft.folder = a.slice(7); return renderPage(); }
  if (a === "copy") return toast({ icon: I.link, title: "Link copiado", sub: `Cole [[${p.title}]] em qualquer página, mensagem ou issue.` });
  if (a === "ask") return toast({ icon: I.chat, ok: false, title: "Abrindo o chat com Theo", sub: "A página já vai anexada como contexto." });
  if (a === "history") return openHistory();
  if (a === "rename") { startEdit(p); setTimeout(() => $("#tIn")?.select(), 30); return; }
  if (a === "move") { startEdit(p); return; }
  if (a === "pin") { p.pinned = !p.pinned; return render(); }
  if (a === "lock") { p.locked = !p.locked; render(); return toast({ icon: I.lock, title: p.locked ? "Trancada" : "Destrancada", sub: p.locked ? "Agora só admins editam." : "Membros voltam a editar." }); }
  if (a === "delete") { PAGES = PAGES.filter((x) => x !== p); S.view = "home"; render(); return toast({ icon: I.trash, title: `“${p.title}” foi para a lixeira`, sub: "Links para ela viram “página para criar”." }); }
}
function starter() {
  S.empty = false;
  $('[data-proto="empty"]').setAttribute("aria-pressed", "false");
  render();
  toast({ title: "3 páginas criadas", sub: "Visão geral, Como trabalhamos e Glossário. Edite à vontade." });
}
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; renderNav(); if (S.view === "home") renderHome(); }
});
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); $("#nav").classList.add("open"); $("#q")?.focus(); $("#q")?.select(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === "s" && S.editing) { e.preventDefault(); return save(); }
  if (e.key === "Escape") {
    if (menuEl) return closeMenu();
    if ($("#layer").children.length) return closeDialog();
    if (document.activeElement?.id === "q" && S.q) { S.q = ""; return render(); }
    if (S.editing && !AC.el) { S.editing = false; return render(); }
    $("#nav").classList.remove("open");
    return;
  }
  if (document.activeElement?.id === "q" && e.key === "Enter") { const p = visiblePages()[0]; if (p) { S.q = ""; openPage(p.slug); } return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "n" || e.key === "N") { e.preventDefault(); S.folderHint = S.view === "page" ? cur()?.folder ?? "" : ""; return newPage(); }
  if ((e.key === "e" || e.key === "E") && S.view === "page" && !S.editing) { e.preventDefault(); return startEdit(cur()); }
  if (e.key === "g") return go("graph");
});
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("a.wl, [role=button][data-act]")) { e.preventDefault(); e.target.click(); } });

/* real files: the pickers and dropping anywhere on the page */
$("#fZip").onchange = (e) => { const f = e.target.files; if (f?.length) { if (!$("#imp")) openImporter(); read(filesFromList(f)); } e.target.value = ""; };
$("#fDir").onchange = (e) => { const f = e.target.files; if (f?.length) { if (!$("#imp")) openImporter(); read(filesFromList(f), f[0].webkitRelativePath.split("/")[0]); } e.target.value = ""; };
let depth = 0;
function showDrop(on) { $("#drop").hidden = !on; if (!on) depth = 0; }
addEventListener("dragenter", (e) => { if (!looksLikeVault(e.dataTransfer) || $("#imp")) return; e.preventDefault(); depth++; showDrop(true); });
addEventListener("dragover", (e) => { if (looksLikeVault(e.dataTransfer)) e.preventDefault(); });
addEventListener("dragleave", () => { if (--depth <= 0) showDrop(false); });
addEventListener("drop", (e) => {
  if (e.target.closest?.(".drop-zone")) return;
  e.preventDefault(); showDrop(false);
  if (!e.dataTransfer?.files?.length) return;
  const files = filesFromDrop(e.dataTransfer);
  if (!$("#imp")) openImporter();
  read(files);
});

/* ---------- theme + boot ---------- */
function setTheme(v) {
  document.documentElement.dataset.theme = v;
  varCache = {};
  $$("#theme button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  placePill($("#theme"));
}
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
addEventListener("resize", () => $$(".seg").forEach(placePill));
$("#logo").append(makeAgent("theo", 30));
$("#dropIc").innerHTML = OBS();
document.fonts?.ready.then(() => $$(".seg").forEach(placePill));
// Direct links for review: #pagina=arquitetura, #grafo, #vazia, #importar, #exemplo, #editar, #escuro
const HS = location.hash.slice(1).split(",");
const HP = HS.find((x) => x.startsWith("pagina="));
if (HP) { S.view = "page"; S.slug = HP.slice(7); }
if (HS.includes("grafo")) S.view = "graph";
if (HS.includes("vazia")) { S.empty = true; $('[data-proto="empty"]').setAttribute("aria-pressed", "true"); }
if (HS.includes("escuro")) setTheme("dark");
render();
if (HS.includes("editar") && S.view === "page") startEdit(cur());
if (HS.includes("importar")) openImporter();
if (HS.includes("exemplo")) openImporter(Promise.resolve(sampleVault()));
</script>
