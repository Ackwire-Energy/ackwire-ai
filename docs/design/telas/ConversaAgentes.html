<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversa entre agentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Doto:ROND,wght@100,600&display=swap">
<script>
  { const q = new URLSearchParams(location.search).get("theme");
    document.documentElement.dataset.theme = q || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
</script>
<style>
/*
  Prototype: agents that feel alive in the room (sibling of ReacoesAgente.html: same tokens, messages,
  reaction pills and the shared agent engine). Backend already shipped: one message can wake up to 4
  agents (no @ needed); an agent can privately ask another agent and continue with the answer
  (meta.consulted: answered | expired | failed); after a reply, one other agent may chime in on its own.
  Each scenario in the prototype bar resets the conversation and plays once (Repetir replays).
  1  Vários agentes na sala (#marketing): Walter asks the room to congratulate Theo. One grouped working
     line under the message: the working agents' live mini bodies stacked + "Theo, Iris e mais 2 estão
     trabalhando…" (names in ink). Nina only reacts 🎉 (agent pill), Theo explains the campaign, Bento
     has nothing to add and just leaves the line, Iris replies short. The line shrinks to nothing.
  2  Um agente consulta outro (#produto): "@Dev sobe o fix do login em staging". The working line shows
     the consultation live: Dev → Infra (Infra thinking) "Dev está perguntando ao Infra…" with a Doto
     clock. Two variants (A/B in the bar):
     A  Grokbot style: a small centered "Mensagem de [Infra] Infra" above Dev's reply.
     B  A neutral one-line card at the top of Dev's reply, "Infra respondeu", that opens to show what Dev
        asked and Infra's full answer ("Conversa só entre o Dev e o Infra").
  3  Agente entra na conversa sozinho (thread in #marketing): Theo answers Ana; Iris, not called, adds one
     useful point. Cue: her working line first, then a faint "entrou na conversa" next to the time, with
     a tooltip that says why (no internal names).
  4  Sem resposta a tempo: like 2, but Infra does not answer in 15 min (the clock runs fast). Dev says so
     and asks how to go on. A: centered icon chip "O Infra não respondeu a tempo". B: the same card, calm,
     with a clock icon, opening to the question Dev asked.
  URL params for QA: ?s=1..4&v=a|b&theme=light|dark&fast=1 (fast jumps to the end state).
  Rules: neutral cards (raised + hairline), icon chips without dots, blue only for agent identity, names
  in ink, counts in Doto (ROND 100), no jargon. Agents only via packages/ui/src/agent/engine.js (serve
  the repo root over http). The working cue is the 3×3 pixel orbit from Carregando.html (direction A).
  prefers-reduced-motion: everything static (no orbit walk, no hop, no fade).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--warn:#9a5b00;--danger:#b42a20;
  --plate:rgba(127,127,127,.1);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",var(--sans);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--warn:#e0a84a;--danger:#f08a80;
  --plate:rgba(127,127,127,.14);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum";display:flex;flex-direction:column;height:100vh;height:100dvh}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:14px;line-height:1}
.num{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}

/* ---------- design system bits (verbatim from ReacoesAgente.html / Componentes.dc.html) ---------- */
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.seg button:focus-visible,.react:focus-visible,.send:focus-visible,.stp:focus-visible,.sb-item:focus-visible,.cs-h:focus-visible,.joined:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--raised);box-shadow:var(--e1),var(--top)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.12)}100%{transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* Agents: the engine's body (canvas). People: a circle with the initial. */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
canvas.orb{display:block;flex:none;image-rendering:pixelated}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .42);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}

/* ---------- prototype bar (not product) ---------- */
.proto{position:relative;z-index:75;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex:none}
.proto b{color:var(--ink);font-weight:650}
.proto .seg button{height:26px;font-size:12px;padding:0 10px}
.steps{display:flex;gap:3px;flex-wrap:wrap}
.stp{height:26px;min-width:26px;padding:0 8px;border-radius:8px;border:0;background:var(--sunken);color:var(--muted);font-size:12px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .18s var(--spring)}
.stp:hover{color:var(--ink)}
.stp:active{transform:scale(.95)}
.stp[aria-current="step"]{background:var(--ink);color:var(--bg)}
.proto .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.proto .acts .b{height:26px;font-size:12px;padding:0 9px;border-radius:8px}
.proto .now{flex-basis:100%;color:var(--ink2);font-weight:500;font-size:12.5px}
.proto .grow{flex:1}
.proto [hidden]{display:none}

/* ---------- app frame ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr)}
.apane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.phd{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 18px;border-bottom:1px solid var(--line);min-height:58px;flex:none}
.phd .t{flex:1;min-width:0}
.phd h1{font-size:16px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phd h1 svg.i{color:var(--faint)}
.phd small{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px 18px;min-height:0}
.thread{max-width:760px;margin:0 auto}

/* ---------- sidebar ---------- */
.sb{background:var(--sunken);display:flex;flex-direction:column;gap:16px;padding:14px 12px;overflow-y:auto;border-right:1px solid var(--line);min-height:0}
.org-in{display:flex;align-items:center;gap:10px;padding:4px 6px}
.org-in .lg{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.org-in b{display:block;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.org-in small{display:block;color:var(--muted);font-size:12px}
.sb-group{display:flex;flex-direction:column;gap:1px}
.sb-label{font-size:12px;font-weight:650;color:var(--faint);padding:0 8px 4px}
.sb-item{display:flex;align-items:center;gap:10px;min-height:34px;padding:4px 8px;border-radius:10px;color:var(--ink2);font-size:14.5px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer}
.sb-item:hover{background:var(--plate)}
.sb-item.on{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.sb-item svg.i{color:var(--faint)}
.sb-item small{margin-left:auto;font-size:12px;color:var(--faint)}

/* ---------- messages (ReacoesAgente.html) ---------- */
.day{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:650;color:var(--faint);margin:14px 12px 6px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{position:relative;display:flex;gap:12px;padding:10px 12px;border-radius:14px;transition:background .15s}
.msg.in{animation:fi .3s var(--out) both}
.msg:hover{background:rgba(127,127,127,.05)}
.av-col{width:34px;flex:none;display:flex;justify-content:center;align-items:flex-start}
.msg .body{flex:1;min-width:0}
.mhdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mt{font-size:12px;color:var(--faint)}
.mx{font-size:14.5px;line-height:1.6;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.mx p+p{margin-top:6px}
.mx b{color:var(--ink);font-weight:650}
.mention{display:inline;white-space:nowrap;font-weight:600;color:var(--ink);background:var(--sunken);padding:1px 6px 1px 3px;border-radius:7px}
.mention .agw{display:inline-flex;vertical-align:-3px;margin-right:4px}
.plan{margin-top:8px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:10px 12px;border-radius:12px;background:var(--sunken);font-size:13.5px;max-width:460px}
.plan span{color:var(--faint);font-weight:600}
.plan div{color:var(--ink2)}
.plan b{color:var(--ink);font-weight:650}

/* ---------- reactions (one pill for everybody; an agent's has its mini body where the count goes) ---------- */
.reacts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.react{height:26px;padding:0 9px;border-radius:999px;border:0;background:var(--sunken);font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:transform .2s var(--spring),background .15s,box-shadow .15s}
.react:hover{transform:translateY(-1px)}
.react .num{font-size:13px;color:var(--ink2)}
.react.fresh{animation:pop .45s var(--spring) both}
.react.ag{padding:0 8px 0 9px;gap:5px}
.react.ag .agw{margin-right:-1px}

/* ---------- the working line: who is on it right now (one line for the whole room) ---------- */
.work{display:flex;gap:12px;align-items:center;padding:4px 12px 6px;min-height:34px;animation:fi .3s var(--out) both}
.work .av-col{align-items:center;height:22px}
.wk{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.wk b{color:var(--ink);font-weight:650}
.wk .wt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .num{font-size:13px;color:var(--muted);flex:none}
/* Stacked mini bodies: each sits on a plate of the page color, so overlaps stay readable. */
.stack{display:inline-flex;align-items:center;flex:none}
.stack .tok{display:inline-flex;padding:1.5px;border-radius:7px;background:var(--bg);position:relative}
.stack .tok+.tok{margin-left:-5px}
.stack .tok.in{animation:pop .4s var(--spring) both}
.stack .to{display:inline-flex;color:var(--faint);margin:0 1px}
.stack .to svg.i{width:12px;height:12px;stroke-width:2}

/* ---------- variant A: a small centered label above the reply (Grokbot style) ---------- */
.from{display:flex;justify-content:center;align-items:center;gap:6px;margin:12px 12px 0;font-size:12.5px;color:var(--faint);animation:fi .3s var(--out) both}
.from b{color:var(--ink2);font-weight:650}
.from .agw{margin:0 -1px}
.from.chip{height:26px;padding:0 10px;width:max-content;max-width:calc(100% - 24px);margin:12px auto 0;font-size:12.5px;color:var(--muted)}
.from.chip svg.i{width:13px;height:13px}
.from.chip span{overflow:hidden;text-overflow:ellipsis}

/* ---------- variant B: what the other agent said, folded into one line at the top of the reply ---------- */
.cs{margin:6px 0 8px;max-width:520px;border-radius:12px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.cs-h{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 8px 6px 10px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:13px;color:var(--ink2);border-radius:12px}
.cs-h:hover{background:rgba(127,127,127,.05)}
.cs-h b{font-weight:650;color:var(--ink);flex:none}
.cs-h .pv{flex:1;min-width:0;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-h .chev{color:var(--faint);transition:transform .2s var(--out)}
.cs.open .chev{transform:rotate(180deg)}
.cs.open .pv{visibility:hidden}
.cs-h .ic{width:20px;height:20px;border-radius:7px;background:var(--sunken);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.cs-h .ic svg.i{width:13px;height:13px}
.cs-b{padding:2px 12px 12px 38px;font-size:13.5px;line-height:1.55;animation:fi .22s var(--out) both}
.cs-b small{display:block;font-size:12px;font-weight:600;color:var(--faint);margin-top:8px}
.cs-b small:first-child{margin-top:0}
.cs-b p{color:var(--ink2);margin-top:1px}
.cs-b .q{color:var(--muted)}
.cs-b .foot{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;color:var(--faint)}
.cs-b .foot svg.i{width:12px;height:12px}

/* ---------- scenario 3: a faint word next to the time, a glass tip on hover/focus says why ---------- */
.joined{position:relative;font-size:12px;color:var(--faint);border-bottom:1px dotted var(--line2);cursor:default}
.joined .tipx{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:min(260px,70vw);border-radius:12px;padding:7px 11px;font-size:12.5px;line-height:1.45;color:var(--ink2);display:none;z-index:20}
.joined:hover .tipx,.joined:focus .tipx{display:block;animation:popin .18s var(--spring) both}

/* ---------- composer ---------- */
.cmpw{padding:0 14px 14px;flex:none}
.composer{max-width:760px;margin:0 auto;border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px}
.composer:focus-within{box-shadow:var(--e3),var(--top)}
.composer input{all:unset;flex:1;min-width:0;font-size:15px;color:var(--ink);height:34px}
.composer input::placeholder{color:var(--faint)}
.send{height:34px;width:34px;border-radius:11px;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:var(--sunken);color:var(--faint);transition:all .25s var(--spring)}
.send.on{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{display:none}
  .phd{padding:8px 10px 8px 16px}
  .scroll{padding:6px 4px 16px}
  .msg{gap:10px;padding:10px 12px}
  .work{gap:10px}
  .av-col{width:28px}
  .cmpw{padding:0 12px 12px}
  .cs-b{padding-left:12px}
  .proto .stp .l{display:none}
  .proto .stp[aria-current="step"] .l{display:inline}
}
</style>
</head>
<body>
<div class="proto" role="region" aria-label="Barra do protótipo">
  <b>Conversa entre agentes</b>
  <div class="steps" id="steps"></div>
  <div class="acts">
    <div class="seg" id="variant" role="group" aria-label="Variante">
      <button type="button" data-v="a">A · Rótulo</button><button type="button" data-v="b">B · Cartão</button>
    </div>
    <button class="b bg" type="button" id="replay"></button>
  </div>
  <span class="grow"></span>
  <div class="seg" id="theme" role="group" aria-label="Tema">
    <button type="button" data-th="light">Claro</button><button type="button" data-th="dark">Escuro</button>
  </div>
  <div class="now" id="now"></div>
</div>
<div class="app">
  <nav class="sb" aria-label="Navegação">
    <div class="org-in"><span class="lg">A</span><div><b>Acme</b><small>8 pessoas · 6 agentes</small></div></div>
    <div class="sb-group"><div class="sb-label">Canais</div><div id="sbChans"></div></div>
    <div class="sb-group"><div class="sb-label">Agentes</div><div id="sbAgents"></div></div>
  </nav>
  <main class="apane">
    <header class="phd">
      <div class="t"><h1 id="thTitle"></h1><small id="thSub"></small></div>
    </header>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <div class="cmpw">
      <form class="composer" id="composer" autocomplete="off">
        <input id="cmpIn" aria-label="Escrever mensagem">
        <button class="send" id="send" type="submit" aria-label="Enviar"></button>
      </form>
    </div>
  </main>
</div>

<script type="module">
import { drawAgent, idlePose, drawAccessory, bodyTones, mixHex } from "../../../packages/ui/src/agent/engine.js";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const Q = new URLSearchParams(location.search);
const FAST = Q.get("fast") === "1";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ---------- icons ---------- */

/* ---------- live agents: the engine, drawn every frame ---------- */
const live = [];
let varCache = {};
const cssVar = (n) => varCache[n] || (varCache[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim());
const avHTML = (id, size = 20, mode = "idle") => `<span class="avs" data-a="${id}" data-s="${size}" data-m="${mode}"></span>`;
const ppHTML = (id, size = 20) => `<span class="pp" style="--s:${size}px" role="img" aria-label="${esc(nameOf(id))}">${esc(nameOf(id)[0])}</span>`;
const mentionHTML = (id) => `<span class="mention">${avHTML(id, 16)}${AGENTS[id].name}</span>`;
const orbHTML = (color, size = 14) => `<canvas class="orb" data-c="${color}" data-s="${size}" aria-hidden="true"></canvas>`;
function makeAgent(id, size, mode) {

  w.className = "agw";
  const cv = document.createElement("canvas"), dpr = Math.min(2, devicePixelRatio || 1);
  cv.className = "av"; cv.width = cv.height = Math.round(size * dpr); cv.style.width = cv.style.height = size + "px";

  w.append(cv);

  return w;
}
const orbs = [];
function hydrate(root = document) {
  for (const el of $$(".avs", root)) el.replaceWith(makeAgent(el.dataset.a, +el.dataset.s, el.dataset.m));
  for (const cv of $$("canvas.orb:not([data-on])", root)) {
    cv.dataset.on = "1";

}
function poseFor(it, t) {
  // run: eyes as dashes (writing); think: looking up and aside (waiting on an answer); late: eyes closed.
  if (it.mode === "run") { const p = idlePose(t, it.seed, { active: true, expressions: [] }); p.writing = true; return p; }
  if (it.mode === "think") { const p = idlePose(t, it.seed, { every: 99, expressions: [] }); const g = Math.sin(t * .6 + it.seed); p.turn = [g * .45, -.3]; p.look = [g * .12, -.14]; return p; }

}
function drawLive(t) {

    if (!it.cv.isConnected) { live.splice(i, 1); continue; }
    const ctx = it.cv.getContext("2d"), s = it.cv.width;
    ctx.clearRect(0, 0, s, s);

/* The 3×3 pixel orbit (Carregando.html, direction A), in the agent's own tones. */
const RING = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
function drawOrbs(now) {
  for (let i = orbs.length - 1; i >= 0; i--) {
    const c = orbs[i]; if (!c.isConnected) { orbs.splice(i, 1); continue; }
    const ctx = c.getContext("2d"), cell = c.width / 3, gap = Math.max(1, Math.round(cell * .14));
    const tn = bodyTones(c.dataset.c), faint = mixHex(tn.at(-1), cssVar("--bg"), .55);

    RING.forEach(([x, y], k) => {
      const age = (head - k + 8) % 8;
      ctx.fillStyle = age === 0 ? tn[0] : age === 1 ? tn[1] : age === 2 ? tn[2] : faint;
      ctx.globalAlpha = age <= 2 ? 1 : .5;

/* What the agent heard from the other one (meta.consulted). A = label above, B = card inside. */
function consultAbove(m) {

  if (c.status === "answered") return `<div class="from" title="${a.name} respondeu ao ${AGENTS[m.who].name} numa conversa só entre eles">Mensagem de ${avHTML(c.agent, 16)}<b>${a.name}</b></div>`;
  return `<div class="from chip">${I.clock}<span>${a.art === "a" ? "A" : "O"} ${a.name} não respondeu a tempo</span></div>`;
}
function consultCard(m) {
  const c = m.consulted; if (!c || S.v !== "b") return "";
  const a = AGENTS[c.agent], me = AGENTS[m.who], open = S.open.has(m.id), ok = c.status === "answered";

}

const listNames = (ids) => {

function workHTML() {

document.addEventListener("click", (ev) => {
  const t = ev.target;
  const st = t.closest("[data-scn]"); if (st) return goScn(+st.dataset.scn);
  const v = t.closest("[data-v]"); if (v) return setVariant(v.dataset.v);
  const th = t.closest("[data-th]"); if (th) return setTheme(th.dataset.th);
  if (t.closest("#replay")) return goScn(S.scn);
  const cs = t.closest("[data-cs]"); if (cs) { const id = cs.dataset.cs; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); $(`[data-cs="${id}"]`)?.focus({ preventScroll: true }); }
});

/* ---------- chrome ---------- */
function sidebar(n) {
  const on = n === 1 || n === 3 ? "marketing" : "produto";
  $("#sbChans").innerHTML = ["geral", "marketing", "produto"].map((c) => `<button class="sb-item${c === on ? " on" : ""}" type="button">${I.hash}<span>${c}</span>${c === on && n === 3 ? "<small>1 thread</small>" : ""}</button>`).join("");
  $("#sbAgents").innerHTML = Object.entries(AGENTS).map(([id, a]) => `<button class="sb-item" type="button">${avHTML(id, 20)}<span>${a.name}</span><small>${a.role}</small></button>`).join("");
  hydrate($(".sb"));
}
$("#replay").innerHTML = `${I.undo} Repetir`;
setTheme(document.documentElement.dataset.theme);
setVariant(S.v);
goScn(Math.min(4, Math.max(1, +Q.get("s") || 1)));
</script>
</body>
