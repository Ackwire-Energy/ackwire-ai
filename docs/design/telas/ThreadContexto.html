<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread a partir daqui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: organizing a conversation AFTER the fact (sibling of MissaoChat.html and TarefaLonga.html,
  same tokens, sidebar, messages, composer, menus, glass toasts and agent engine).
  Problem: a subject starts in #produto, grows, and floods the channel. The answer is a ladder that is
  always offered and never forced: channel conversation -> thread -> (thread with work) -> own channel.
  Guided story (prototype bar, steps + "Próximo"; every step is also reachable from the UI):
  1  #produto is busy; a discreet inline hint "Isso virou um assunto. Levar para uma thread?" (Criar thread /
     Agora não). Every message's ⋯ also has "Criar thread a partir daqui".
  2  One click: the thread is created with the suggested range as context (a reference; the messages stay in
     the channel), an auto title, and opens. Toast "Thread criada com 10 mensagens · Ajustar · Desfazer".
  3  "Ajustar trecho" (context block): selection mode in place on the channel (checkboxes, draggable Início /
     Fim handles, off-topic rows collapsed), then Salvar.
  4  "Tirar do canal" (context block): the messages leave #produto; a stub with the link stays; Desfazer.
  5  The thread: Walter asks "@dev continua daqui"; Dev quotes the range and starts the live work card.
     The title is edited inline by clicking it.
  6  Adjusting the range and opening private #diretoria: blocked inline ("Ana não está em #diretoria"),
     locked messages, or "Criar thread em #diretoria" instead.
  7  Next rung: thread ⋯ › Mover para canal novo (name, who joins); #produto keeps a line with the link.
  Scenario "App mobile" (A1..A7): the conversation becomes a thread; the Claude Code explores the repo and Dev
  posts a short plan card (checklist, computer, Começar / Mudar algo). The plan is a living checklist in
  .agentes/mission.md, no phases or gates; the pinned card shows "N de 12 itens" as a pixel strip; reviews
  arrive when there is something to see ("Pronto para você ver", Aprovar / Pedir ajustes). One row per
  session; a question from a session updates decisions.md; a local edit keeps the approved version; Mac
  offline -> resume. A mission has no budget of its own (the executor runs on the person's plan).
  Neutral selection (ink/gray), brand blue only for agents (avatar, running ring, streaming cursor).
  Mono only for paths, branches and commands. Agents come from packages/ui/src/agent/engine.js (serve the
  repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --plate:rgba(127,127,127,.1);
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --plate:rgba(127,127,127,.14);
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum";display:flex;flex-direction:column;height:100vh;height:100dvh}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
code,.mono{font-family:var(--mono);font-size:.84em;letter-spacing:-.01em}

/* ---------- design system bits (verbatim from MissaoChat.html) ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.seg button:focus-visible,.mi:focus-visible,.opt:focus-visible,.workh:focus-visible,.sb-item:focus-visible,.react:focus-visible,.send:focus-visible,.stp:focus-visible,.ck:focus-visible,.hp:focus-visible,.who-row:focus-visible,.qt:focus-visible,.cxb-h:focus-visible,.tsum:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.b:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.ink{background:var(--ink);color:var(--bg)}
.chip.okc{color:var(--ok)}
.chip.dang{color:var(--danger)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.spin{animation:spin 1.2s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blinkc{50%{opacity:0}}
.hint{font-size:12.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.hint svg.i{width:14px;height:14px}
.inp{display:flex;align-items:center;gap:9px;min-height:38px;padding:0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s;min-width:0}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp input{all:unset;flex:1;min-width:0;font-size:14.5px;color:var(--ink)}
.inp .pre{color:var(--faint);font-weight:600}
.where-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--sunken);font-size:13.5px;min-width:0;border:0;text-align:left;color:inherit}
.where-row .ic{width:28px;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.where-row .t{flex:1;min-width:0}
.where-row b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-row small{display:block;color:var(--faint);font-size:12px}
.q-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.q-f .grow{flex:1}

/* Agents: the engine's body (canvas). People: a circle with the initial. */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .42);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}

/* ---------- prototype bar (not product) ---------- */
.proto{position:relative;z-index:75;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex:none}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px;padding:0 10px}
.proto .seg .pill{height:26px}
.proto .lab{font-size:12px;color:var(--faint)}
.steps{display:flex;gap:3px;flex-wrap:wrap}
.stp{height:26px;min-width:26px;padding:0 8px;border-radius:8px;border:0;background:var(--sunken);color:var(--muted);font-size:12px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .18s var(--spring)}
.stp:hover{color:var(--ink)}
.stp:active{transform:scale(.95)}
.stp[aria-current="step"]{background:var(--ink);color:var(--bg)}
.stp .l{display:none}
.stp[aria-current="step"] .l{display:inline}
.proto .now{color:var(--ink2);font-weight:600;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- app frame ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:248px minmax(0,1fr)}
.app.th{grid-template-columns:248px minmax(0,1fr) minmax(0,1.05fr)}
.apane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.thpane{border-left:1px solid var(--line);display:none}
.app.th .thpane{display:flex}
.phd{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 18px;border-bottom:1px solid var(--line);min-height:58px;flex:none}
.phd .t{flex:1;min-width:0}
.phd h1{font-size:16px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phd h1 svg.i{color:var(--faint)}
.phd small{display:block;color:var(--faint);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phd .back{display:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 10px 18px;min-height:0}

/* ---------- sidebar ---------- */
.sb{position:relative;background:var(--sunken);display:flex;flex-direction:column;gap:16px;padding:14px 12px;overflow-y:auto;border-right:1px solid var(--line);min-height:0}
.org-in{display:flex;align-items:center;gap:10px;padding:4px 6px}
.org-in .tx{min-width:0}
.org-in b{display:block;font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.org-in small{display:block;color:var(--muted);font-size:12px}
.sb-jump{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--faint);font-size:13.5px;flex:none;border:0;cursor:pointer;width:100%;text-align:left}
.sb-jump span:not(.kbd){flex:1}
.sb-group{display:flex;flex-direction:column;gap:1px}
.sb-label{font-size:12px;font-weight:650;color:var(--faint);padding:0 8px 4px}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;min-height:34px;padding:4px 8px;border-radius:10px;color:var(--ink2);font-size:14.5px;cursor:pointer;user-select:none;border:0;background:transparent;width:100%;text-align:left}
.sb-item:hover{background:var(--plate)}
.sb-item.on{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.sb-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .meta{font-size:12px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.sb-item .meta svg.i{width:12px;height:12px}
.sb-item svg.i{color:var(--faint)}
.sb-item.on svg.i{color:var(--ink2)}
.sb-item.fresh{animation:popin .35s var(--spring) both}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.me .tx{flex:1;min-width:0}
.me b{display:block;font-size:13.5px;font-weight:650}
.me small{display:block;font-size:12px;color:var(--muted)}

/* ---------- messages (MissaoChat.html) ---------- */
.day{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:650;color:var(--faint);margin:14px 12px 6px}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{position:relative;display:flex;gap:12px;padding:10px 12px;border-radius:14px;transition:background .15s,opacity .2s;animation:fi .3s var(--out) both}
.msg:hover{background:rgba(127,127,127,.05)}
.msg.flash,.cx-row.flash{animation:flash 1.6s var(--out)}
@keyframes flash{0%{background:color-mix(in srgb,var(--ink) 12%,transparent)}100%{background:transparent}}
.msg .av-col{width:34px;flex:none;display:flex;justify-content:center;align-items:flex-start}
.msg .body{flex:1;min-width:0}
.mhdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:20px}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mt{font-size:12px;color:var(--faint)}
.mx{font-size:14.5px;line-height:1.6;margin-top:2px;color:var(--ink2);overflow-wrap:anywhere}
.mx p+p{margin-top:6px}
.mx b{color:var(--ink);font-weight:650}
.mention{display:inline;white-space:nowrap;font-weight:600;color:var(--ink);background:var(--sunken);padding:1px 6px 1px 3px;border-radius:7px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mention .agw{display:inline-flex;vertical-align:-3px;margin-right:4px}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--faint);font-size:13.5px}
.curs{display:inline-block;width:7px;height:15px;background:var(--agent);vertical-align:-2px;margin-left:2px;animation:blinkc 1s steps(1) infinite}
.macts{position:absolute;top:-12px;right:12px;display:none;gap:2px;padding:3px;border-radius:12px;z-index:4}
.macts .ib{width:28px;height:28px;border-radius:8px}
.macts .ib svg.i{width:15px;height:15px}
.msg:hover .macts,.macts.show{display:flex}
.wake{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted)}
.wake svg.i{width:12px;height:12px}
.sysline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);padding:4px 12px 4px 58px}
.sysline svg.i{width:13px;height:13px}
.sysline b{color:var(--ink2);font-weight:600}
.sysline>span{flex:0 1 auto;min-width:0}
.tsum{margin-top:8px;display:inline-flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border-radius:12px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;color:var(--muted);cursor:pointer;text-align:left;max-width:100%;transition:box-shadow .15s}
.tsum:hover{box-shadow:var(--e2),var(--top)}
.tsum b{color:var(--ink);font-weight:650}
.tsum .who{display:flex}
.tsum .who>*+*{margin-left:-6px}
.tsum .who .pp{box-shadow:0 0 0 2px var(--raised)}
.react{height:26px;padding:0 9px;border-radius:999px;border:0;background:var(--sunken);font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer}

/* ---------- the system hint: discreet, inline, not a card ---------- */
.ahint{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin:6px 12px 6px 58px;padding:5px 6px 5px 10px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--muted);animation:fi .4s var(--out) both;max-width:640px}
.ahint>svg.i{width:14px;height:14px;color:var(--faint)}
.ahint .t{flex:1 1 220px;min-width:0}
.ahint .t b{color:var(--ink2);font-weight:600}
.ahint .acts{display:flex;gap:4px}

/* ---------- selection mode (neutral: ink and gray only) ----------
   The range is one continuous surface: rows in range share a band (raised + hairline, radius only at the
   outer corners, no gaps), a thin ink rail in the gutter joins them, and the start/end are small bracket
   caps on the rail. Excluded rows collapse to one quiet line; the rail goes dashed there. */
.selr{--rx:16px;--rail:color-mix(in srgb,var(--ink) 55%,transparent);cursor:pointer;user-select:none;-webkit-user-select:none;gap:10px;padding-left:34px;border-radius:14px;animation:none}
.selr .mx{pointer-events:none}
.selr:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.selr.out{opacity:.5}
.selr.out:hover{opacity:.8}
.selr.inr{border-radius:0;background:var(--raised);box-shadow:inset 1px 0 0 var(--line),inset -1px 0 0 var(--line)}
.selr.inr:hover{background:color-mix(in srgb,var(--ink) 2.5%,var(--raised))}
.selr.inr.first{border-top-left-radius:20px;border-top-right-radius:20px;box-shadow:inset 1px 0 0 var(--line),inset -1px 0 0 var(--line),inset 0 1px 0 var(--line);padding-top:32px}
.selr.inr.last{border-bottom-left-radius:20px;border-bottom-right-radius:20px;box-shadow:inset 1px 0 0 var(--line),inset -1px 0 0 var(--line),inset 0 -1px 0 var(--line),0 6px 16px -10px rgba(0,0,0,.18);padding-bottom:32px}
.selr.inr.first.last{box-shadow:inset 0 0 0 1px var(--line)}
.selr.inr::before{content:"";position:absolute;left:var(--rx);top:0;bottom:0;width:1.5px;background:var(--rail)}
.selr.inr.first::before{top:16px}
.selr.inr.last::before{bottom:16px}
.selr.inr.exc::before{background:repeating-linear-gradient(to bottom,var(--rail) 0 3px,transparent 3px 7px)}
.grp-row.selr{margin:0;padding-left:34px}
/* small outline checkbox; on desktop it shows on hover, always for excluded rows and on touch */
.ck{width:16px;height:16px;border-radius:5px;border:0;padding:0;flex:none;margin-top:9px;background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 30%,transparent);display:inline-flex;align-items:center;justify-content:center;color:transparent;cursor:pointer;transition:background .15s,box-shadow .15s,color .15s,opacity .15s,transform .2s var(--spring)}
.ck svg.i{width:11px;height:11px;stroke-width:2.8}
.ck[aria-checked="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.ck.lk,.ck.lk[aria-checked="true"]{background:transparent;color:var(--muted);box-shadow:none}
.ck.lk svg.i{stroke-width:1.9;width:13px;height:13px}
.ck:active{transform:scale(.88)}
.selr>.ck{opacity:0}
.selr:hover>.ck,.selr>.ck:focus-visible,.selr.exc>.ck,.selr>.ck.lk{opacity:1}
@media (hover:none),(max-width:760px){.selr>.ck{opacity:1}}
.grp-row.selr>.ck{margin-top:0}
/* excluded rows: one compact line inside the band; consecutive ones grouped */
.exl{display:none;align-items:center;gap:8px;min-width:0;flex:1;font-size:12.5px;color:var(--faint)}
.exl .ck{margin-top:0;opacity:1}
.exl .eo{display:inline-flex;align-items:center;gap:4px;min-width:0;border:0;background:transparent;padding:2px 0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exl .eo:hover{color:var(--ink2)}
.exl .eo span{overflow:hidden;text-overflow:ellipsis}
.exl .b{margin-left:auto;flex:none}
.selr.exc:not(.open){padding-top:5px;padding-bottom:5px}
.selr.exc.first:not(.open){padding-top:32px}
.selr.exc.last:not(.open){padding-bottom:32px}
.selr.exc:not(.open)>:not(.exl):not(.cap){display:none}
.selr.exc:not(.open)>.exl{display:flex}
.selr.exc-hid:not(.open){display:none}
.selr.exc.open>.av-col,.selr.exc.open>.body,.selr.exc.open>.gi,.selr.exc.open>.t{opacity:.55}
.selr .offt{display:none}
.selr.exc.open .offt{display:inline-flex}
/* bracket caps on the rail: the time, draggable */
.cap{position:absolute;left:var(--rx);display:flex;align-items:center;gap:8px;z-index:3;pointer-events:none}
.cap.ca{top:7px}
.cap.cb{bottom:7px}
.cap::before{content:"";width:8px;height:1.5px;background:var(--rail);flex:none;margin-right:-6px}
.hp{pointer-events:auto;display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px 0 3px;border-radius:6px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),0 1px 2px rgba(0,0,0,.06);color:var(--ink2);font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s var(--spring),box-shadow .15s}
.hp svg.i{width:11px;height:11px;color:var(--faint)}
.hp:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.cap.drag .hp{transform:scale(1.06);box-shadow:inset 0 0 0 1.5px var(--ink)}
.hn{pointer-events:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.hn button{border:0;background:transparent;padding:0;font:inherit;font-weight:650;color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.grp-row{position:relative;display:flex;align-items:center;gap:12px;margin:2px 0;padding:10px 12px;border-radius:14px;font-size:13.5px;color:var(--muted);animation:fi .3s var(--out) both}
.grp-row .gi{width:34px;display:flex;justify-content:center;color:var(--faint);flex:none}
.grp-row .t{flex:1;min-width:0}
.grp-row b{color:var(--ink2);font-weight:600}
.selbar{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:8px 8px 8px 14px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);animation:popin .28s var(--spring) both}
.selbar .t{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.selbar b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.selbar .sp{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.selbar .acts{display:flex;gap:6px;margin-left:auto}

/* results in the channel: the stub (Mover) and the quiet mark (Levar como contexto) */
.stub{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:6px 12px 6px 58px;padding:8px 8px 8px 10px;border-radius:14px;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13.5px;color:var(--ink2);animation:popin .32s var(--spring) both;max-width:640px}
.stub .ic{width:28px;height:28px;border-radius:9px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.stub .t{flex:1 1 200px;min-width:0}
.stub b{font-weight:650;color:var(--ink)}
.stub small{display:block;font-size:12px;color:var(--faint)}
.msg.ctxm::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:2px;border-radius:2px;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.ctxl{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);padding:0 12px 8px 58px;animation:fi .35s var(--out) both}
.ctxl svg.i{width:13px;height:13px}
.ctxl b{color:var(--ink2);font-weight:600}

/* ---------- side panel: new thread ---------- */
.pn{padding:14px 16px 18px}
.fs{padding:0 0 18px}
.fl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--faint);margin-bottom:8px}
.fs .hint{margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border-radius:16px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;transition:box-shadow .18s var(--out),transform .2s var(--spring),background .15s}
.opt:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.opt:active{transform:scale(.985)}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:color-mix(in srgb,var(--sunken) 40%,var(--raised))}
.opt .top{display:flex;align-items:flex-start;gap:10px}
.opt .rd{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px;box-shadow:inset 0 0 0 1.5px var(--line2);transition:box-shadow .2s var(--spring)}
.opt[aria-checked="true"] .rd{box-shadow:inset 0 0 0 5.5px var(--ink)}
.opt b{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:650;letter-spacing:-.01em}
.opt b svg.i{color:var(--muted)}
.opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.pv{border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.pv-h{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.pv-h b{flex:1 1 140px;font-size:13.5px;font-weight:650;min-width:0}
.pv-b{max-height:320px;overflow:auto;padding:4px 0}
.pv-f{display:flex;align-items:flex-start;gap:7px;padding:9px 12px 10px;font-size:12.5px;color:var(--faint);border-top:1px solid var(--line)}
.pv-f svg.i{width:13px;height:13px;margin-top:3px}
.pv-f b{color:var(--ink2);font-weight:600}
.cx-row{display:grid;grid-template-columns:20px minmax(0,1fr);gap:9px;padding:6px 12px;font-size:13px;color:var(--ink2);border-radius:10px;animation:fi .25s var(--out) both}
.cx-row .cxa{display:flex;justify-content:center;padding-top:1px;color:var(--faint)}
.cx-row .h{display:flex;align-items:baseline;gap:6px}
.cx-row .h b{font-weight:650;font-size:12.5px;color:var(--ink)}
.cx-row .h span{font-size:11.5px;color:var(--faint)}
.cx-row .h svg.i{width:12px;height:12px;color:var(--muted);align-self:center}
.cx-row p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);line-height:1.45}
.cx-row.lk p{color:var(--faint)}
.cx-row.grp .h b{font-weight:600}
.sumy{padding:10px 12px 6px}
.sumy ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
.sumy li{display:flex;gap:8px;align-items:flex-start}
.sumy li svg.i{width:13px;height:13px;color:var(--faint);margin-top:3px}
.sumy .by{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);margin-bottom:8px}
.more-row{padding:2px 8px 8px}
.npf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px 14px;border-top:1px solid var(--line);flex:none;background:var(--bg)}
.npf .grow{flex:1}
.blk{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--sunken);font-size:13.5px;color:var(--ink2);margin-bottom:18px;animation:popin .3s var(--spring) both}
.blk .ic{width:30px;height:30px;border-radius:10px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--danger);flex:none}
.blk .t{flex:1;min-width:0}
.blk b{display:block;color:var(--ink);font-weight:650;font-size:14px}
.blk p{margin-top:2px;color:var(--muted)}
.blk .q-f{margin-top:10px}

/* ---------- thread: context block, quote ---------- */
.cxb{border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);margin:6px 2px 10px;overflow:hidden;animation:popin .3s var(--spring) both}
.cxb-h{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:16px}
.cxb-h:hover{background:rgba(127,127,127,.05)}
.cxb-h .ic{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.cxb-h .t{flex:1;min-width:0}
.cxb-h b{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em}
.cxb-h small{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);margin-top:1px}
.cxb-b{border-top:1px solid var(--line);padding:4px 0 0}
.cxb-a{display:flex;flex-wrap:wrap;gap:4px 16px;padding:0 12px 10px 52px;font-size:12.5px}
.cxb-a .tlink{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--muted)}
.cxb-a .tlink:hover{color:var(--ink)}
.cxb-a svg.i{width:13px;height:13px}
.ttl-b{min-width:0;padding:0 4px;margin:0 -4px;border:0;border-radius:6px;background:transparent;font:inherit;color:inherit;letter-spacing:inherit;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl-b:hover{background:var(--sunken)}
.ttl-i{min-width:0;flex:1;height:28px;padding:0 6px;border:0;border-radius:8px;background:var(--sunken);font:inherit;color:var(--ink);outline:none;box-shadow:inset 0 0 0 1.5px var(--line2)}
.cxb-b .pv-f{margin-top:4px}
.chev{transition:transform .25s var(--out);flex:none;color:var(--faint)}
[aria-expanded="true"]>.chev{transform:rotate(90deg)}
.qt{display:block;width:100%;max-width:560px;text-align:left;margin:8px 0;padding:8px 12px;border:0;border-left:2px solid color-mix(in srgb,var(--ink) 22%,transparent);background:var(--sunken);border-radius:4px 12px 12px 4px;cursor:pointer;color:var(--ink2);font-size:13.5px;line-height:1.5;transition:background .15s}
.qt:hover{background:color-mix(in srgb,var(--ink) 8%,var(--sunken))}
.qt .qs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);margin-bottom:3px}
.qt .qs svg.i{width:12px;height:12px}

/* ---------- the live work card (verbatim from TarefaLonga.html) ---------- */
.wk{margin-top:10px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden;position:relative;max-width:640px}
.wk-h{display:flex;align-items:center;gap:10px;padding:12px 12px 0 14px}
.wk-h .ic{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.wk-h .t{flex:1;min-width:0}
.wk-h b{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-h small{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--faint);font-size:12px}
.wk-h small .tick{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
.wk-m{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0 54px}
.wk-m code{font-size:10.5px;color:var(--ink2)}
.wk-o{display:flex;align-items:flex-start;gap:7px;margin:8px 14px 0 54px;font-size:12.5px;color:var(--muted)}
.wk-o svg.i{width:13px;height:13px;margin-top:3px;color:var(--faint)}
.wk-o code{font-size:10.5px;color:var(--ink2)}
.wk-last{display:flex;align-items:center;gap:8px;margin:10px 14px 0;padding:8px 10px;border-radius:10px;background:var(--sunken);min-width:0}
.wk-last .tx{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);min-width:0}
.wk-last.fresh .tx{animation:fi .35s var(--out)}
.cur{display:inline-block;width:7px;height:13px;background:var(--agent);vertical-align:-2px;animation:blinkc 1s steps(1) infinite;flex:none}
.workh{display:flex;align-items:center;gap:10px;width:100%;margin-top:6px;padding:9px 14px;border:0;background:transparent;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.workh:hover{background:rgba(127,127,127,.06)}
.workh b{color:var(--ink2);font-weight:600}
.wsteps{padding:0 0 6px}
.wstep{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 16px;font-size:13px;color:var(--ink2);animation:fi .25s var(--out) both;min-width:0}
.wstep>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wstep .t{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap;padding-left:8px}
.wstep.now{color:var(--ink)}
.wstep.todo{color:var(--faint)}
.tk{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);flex:none}
.tk svg.i{width:11px;height:11px;stroke-width:2.4}
.tk.now{background:transparent;color:var(--muted)}
.tk.now svg.i{width:16px;height:16px}
.tk.todo{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.wk-f{display:flex;align-items:center;gap:6px;padding:8px 12px 14px 14px;flex-wrap:wrap}
.wk-f .grow{flex:1}
.wk-f .hint{font-size:12px}
.wk-f .hint svg.i{width:13px;height:13px}
canvas.strip{position:absolute;left:0;right:0;bottom:0;width:100%;height:3px;image-rendering:pixelated;pointer-events:none}
.log{margin:0 12px 6px;padding:12px 14px;border-radius:12px;background:var(--sunken);font-family:var(--mono);font-size:11px;line-height:1.8;color:var(--ink2);max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.log .ln{display:block;animation:fi .25s var(--out) both}
.log .cmd{color:var(--ink)}
.log .dim{color:var(--faint)}
.log .okl{color:var(--ok)}

/* ---------- composer ---------- */
.cmpw{padding:0 14px 14px;flex:none;position:relative}
.composer{border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);transition:box-shadow .2s var(--out);position:relative}
.composer:focus-within{box-shadow:var(--e3),var(--top)}
.composer textarea{display:block;width:100%;border:0;outline:none;background:transparent;font-size:15px;color:var(--ink);padding:14px 16px 4px;resize:none;line-height:1.5;min-height:48px;max-height:160px}
.composer textarea::placeholder{color:var(--faint)}
.ctools{display:flex;align-items:center;gap:6px;padding:6px 8px 8px 10px;flex-wrap:wrap}
.cpill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunken);color:var(--ink2);border:0;white-space:nowrap}
.cpill.np{padding-left:9px}
.cpill svg.i{width:13px;height:13px;color:var(--muted)}
.send{margin-left:auto;height:34px;padding:0 12px;border-radius:11px;border:0;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .25s var(--spring);flex:none}
.send.off{background:var(--sunken);color:var(--faint);width:34px;padding:0;justify-content:center}
.send.on{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.send.on .kbd{background:rgba(255,255,255,.18)}

/* ---------- menus, dialog, toasts ---------- */
.menu{position:fixed;z-index:80;min-width:240px;max-width:calc(100vw - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.mi:hover,.mi.on{background:rgba(127,127,127,.12)}
.mi .sub{color:var(--faint);font-size:12.5px;margin-left:auto;padding-left:10px;white-space:nowrap}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.mgroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px 4px}
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s var(--out) both}
.dlg{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:22px;background:var(--raised);box-shadow:var(--e3),var(--top);padding:18px;animation:popin .28s var(--spring) both}
.dlg-h{display:flex;align-items:flex-start;gap:10px}
.dlg-h .t{flex:1;min-width:0}
.dlg h3{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.dlg-h p{color:var(--muted);font-size:13.5px;margin-top:4px}
.dlg .fs{padding:14px 0 0}
.who{display:flex;flex-direction:column;gap:2px}
.who-row{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:4px 8px;border-radius:12px;border:0;background:transparent;text-align:left;cursor:pointer;font-size:14px;color:var(--ink2)}
.who-row:hover{background:var(--plate)}
.who-row .ck{margin-top:0}
.who-row .tx{flex:1;min-width:0}
.who-row small{display:block;font-size:12px;color:var(--faint)}
.who-row[aria-disabled="true"]{cursor:default}
.dlg .notes{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--sunken);font-size:13px;color:var(--ink2)}
.dlg .notes div{display:flex;gap:8px;align-items:flex-start}
.dlg .notes svg.i{width:14px;height:14px;color:var(--faint);margin-top:2px}
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:16px;width:380px;max-width:calc(100vw - 24px);animation:popin .25s var(--spring) both}
.toast .tic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--sunken);color:var(--ink2)}
.toast .tic.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.toast .tt{flex:1;min-width:0}
.toast .tt b{display:block;font-size:14px;font-weight:600}
.toast .tt small{display:block;color:var(--muted);font-size:12.5px}
.toast.out{animation:toastout .2s var(--out) both}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}


/* ===================== Scenario B: App mobile (a real code task with progress) ===================== */
/* proposal / plan card (MissaoChat.html) */
.prop{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);margin-top:10px;max-width:640px;position:relative;overflow:hidden;animation:popin .32s var(--spring) both}
.prop-h{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 4px}
.prop-h .t{flex:1;min-width:0}
.prop-h h3{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.prop-h p{color:var(--muted);font-size:13.5px;margin-top:4px}
.prop-b{padding:10px 16px 2px;display:flex;flex-direction:column;gap:12px}
.pf{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:13.5px}
.pf>.k{font-size:12.5px;font-weight:650;color:var(--faint)}
.pf>.v{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink2)}
.pf>.v small{color:var(--faint);font-size:12.5px}
.pf>.v code{font-size:10.5px}
.phs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.phs .pc{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:10px;background:var(--sunken);font-size:13px;font-weight:600;color:var(--ink2)}
.phs .pc .n{color:var(--faint);font-weight:500;font-size:12px}
.phs .gt{color:var(--faint);display:inline-flex}
.phs .gt svg.i{width:13px;height:13px}
.whyp{display:flex;align-items:flex-start;gap:8px;margin:12px 16px 0;padding:10px 12px;border-radius:14px;background:var(--sunken);font-size:13px;color:var(--ink2)}
.whyp svg.i{width:14px;height:14px;color:var(--faint);margin-top:3px}
.prop-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 16px 16px}
.prop-f .grow{flex:1}
.created{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding:10px 12px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:640px;animation:popin .3s var(--spring) both}
.created .fl{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.created .t{flex:1;min-width:0}
.created b{display:block;font-weight:650;font-size:14.5px}
.created small{display:block;color:var(--faint);font-size:12.5px}
.stamp{position:absolute;inset:0;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--raised) 86%,transparent);font-weight:650;font-size:15px;animation:fi .2s var(--out) both;z-index:2}
.stamp .ok{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}
/* decision card */
.card{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:16px;position:relative;margin-top:10px;max-width:680px;animation:popin .3s var(--spring) both}
.card.flash{animation:cflash 1.4s var(--out)}
@keyframes cflash{0%{box-shadow:0 0 0 2px var(--ink),var(--top)}100%{box-shadow:var(--e1),var(--top)}}
.q-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.q-h h3{font-size:16.5px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.q-h p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:70ch}
.card .opts{margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.opt .othumb{display:flex;justify-content:center;padding:10px 0 0;border-radius:12px;background:var(--sunken);overflow:hidden;height:112px}
.why{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sunken);font-size:13.5px;color:var(--ink2)}
.why .k{font-size:12px;font-weight:650;color:var(--faint);padding-top:1px;white-space:nowrap;display:flex;align-items:flex-start;gap:6px}
.decided{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.decided .ok{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.decided .t{flex:1;min-width:0}
.decided b{display:block;font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.decided small{display:block;color:var(--muted);font-size:12.5px}
.decided small code{font-size:10.5px}
/* fake phone screens (Missao.html) */
.phone{--w:108px;width:var(--w);height:calc(var(--w) * 2.05);flex:none;border-radius:calc(var(--w) * .16) calc(var(--w) * .16) 0 0;background:#151514;padding:calc(var(--w) * .035) calc(var(--w) * .035) 0;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
.phone .scr{width:100%;height:100%;border-radius:calc(var(--w) * .13) calc(var(--w) * .13) 0 0;background:#fbfbf9;overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:calc(var(--w) * .062);color:#2a2a28;line-height:1.3}
:root[data-theme="dark"] .phone{background:#2c2c2a}
:root[data-theme="dark"] .phone .scr{background:#141413;color:#d6d6d2}
.phone .isl{width:32%;height:calc(var(--w) * .06);border-radius:99px;background:#151514;margin:calc(var(--w) * .04) auto calc(var(--w) * .03)}
:root[data-theme="dark"] .phone .isl{background:#000}
.phone .ttl{font-weight:700;font-size:calc(var(--w) * .095);padding:0 9% 4%;letter-spacing:-.02em}
.phone .rw{display:flex;align-items:center;gap:6%;padding:3.5% 9%}
.phone .ln{display:block;height:calc(var(--w) * .03);border-radius:3px;background:color-mix(in srgb,currentColor 18%,transparent)}
.phone .ln.s{width:55%}
.phone .ln.m{width:75%}
.phone .lns{display:flex;flex-direction:column;gap:calc(var(--w) * .025);flex:1}
.phone .hashc{width:calc(var(--w) * .1);height:calc(var(--w) * .1);border-radius:30%;background:color-mix(in srgb,currentColor 12%,transparent);flex:none}
.phone .tabs{margin-top:auto;display:flex;justify-content:space-around;padding:5% 6% 9%;border-top:1px solid color-mix(in srgb,currentColor 10%,transparent)}
.phone .tabs i{width:calc(var(--w) * .085);height:calc(var(--w) * .085);border-radius:28%;background:color-mix(in srgb,currentColor 22%,transparent)}
.phone .tabs i.on{background:currentColor}
.phone .bub{max-width:72%;padding:4% 6%;border-radius:calc(var(--w) * .06);margin:2% 7%;background:color-mix(in srgb,currentColor 9%,transparent);display:flex;flex-direction:column;gap:calc(var(--w) * .02)}
.phone .bub.me{align-self:flex-end;background:#151514;color:#fbfbf9}
:root[data-theme="dark"] .phone .bub.me{background:#efefec;color:#141413}
.phone .cmp{margin:auto 7% 8%;height:calc(var(--w) * .13);border-radius:99px;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}
.phone .drw{position:absolute;inset:0;display:flex}
.phone .drw .pane{width:68%;height:100%;background:color-mix(in srgb,#ebebe7 90%,transparent);padding-top:22%;display:flex;flex-direction:column;box-shadow:6px 0 14px -6px rgba(0,0,0,.3)}
:root[data-theme="dark"] .phone .drw .pane{background:#0a0a09}
.phone .drw .dim{flex:1;background:rgba(0,0,0,.18)}
/* pinned live card (MissaoChat.html) */
.pinned{position:sticky;top:-8px;z-index:6;margin:0 2px 8px;border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:12px 14px 0;overflow:hidden;animation:popin .32s var(--spring) both}
.pin-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pin-h .t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pin-h .t b{font-weight:650;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap}
.pin-h .t .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600}
.pin-stage{position:relative;height:46px;margin-top:6px}
.pin-ps{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--ink2);min-width:0}
.pin-ps b{font-weight:650;white-space:nowrap}
canvas.ps{height:14px;max-width:100%;image-rendering:pixelated;flex:none}
.pl-cap{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--faint);margin-bottom:6px}
.pl-cap svg.i{width:13px;height:13px}
.pl-list{list-style:none;margin:10px 16px 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--ink2)}
.pl-list li{display:flex;align-items:center;gap:10px}
.pl-list .bx{width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line2);flex:none}
.pl-note{margin:8px 16px 0 40px;font-size:12.5px;color:var(--faint)}
.pl-meta{display:flex;align-items:center;gap:7px;margin:12px 16px 0;font-size:12.5px;color:var(--muted)}
.pl-meta svg.i{width:14px;height:14px;color:var(--faint)}
.rv-shots{display:flex;gap:12px;margin-top:12px;height:120px;overflow:hidden}
.cpill .x{display:inline-flex;border:0;background:transparent;padding:0;margin-left:2px;color:var(--faint);cursor:pointer}
.md .l.ckl{position:relative;padding-left:30px}
.md .ckl .bx{position:absolute;left:6px;top:.32em;width:13px;height:13px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;justify-content:center}
.md .ckl .bx svg.i{width:10px;height:10px;stroke-width:2.6}
.md .ckl.on .bx{background:var(--ink);box-shadow:none;color:var(--bg)}
.md .ckl.on{color:var(--muted)}
.md .ckl small{margin-left:8px;font-size:12px;color:var(--faint)}
.pin-ph{display:grid;font-size:11.5px;color:var(--faint);padding:2px 0 0}
.pin-ph span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;border-left:1px dashed var(--line2)}
.pin-ph span:first-child{border-left:0;padding-left:0}
.pin-ph span.on{color:var(--ink);font-weight:650}
.pin-ph span.done{color:var(--muted)}
.pin-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0 12px}
.pm{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:999px;background:var(--sunken);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;border:0}
button.pm{cursor:pointer}
.pm svg.i{width:13px;height:13px;color:var(--muted)}
.pm .run{color:var(--agent);display:inline-flex}
.pm small{color:var(--faint);font-weight:500;font-size:12px}
.pm .bar{width:40px;height:5px;border-radius:5px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.pm .bar i{display:block;height:100%;background:var(--ink);border-radius:5px}
/* work steps: one row per Claude Code session (status, title, one human line, time, PR) */
.mw{margin-top:10px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;max-width:640px}
.mwh{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:0;background:transparent;font-size:13px;color:var(--muted);cursor:pointer;text-align:left}
.mwh:hover{background:rgba(127,127,127,.06)}
.mwh b{color:var(--ink2);font-weight:600}
.ms{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:start;gap:10px;padding:9px 14px;font-size:13px;color:var(--ink2);border-top:1px solid var(--line)}
.ms:hover{background:rgba(127,127,127,.05)}
.ms .wi{width:20px;height:20px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--ink2);margin-top:1px}
.ms .wi svg.i{width:12px;height:12px;stroke-width:2.2}
.ms .wi.done{background:var(--ink);color:var(--bg)}
.ms .wi.run{color:var(--agent);background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--agent) 30%,transparent)}
.ms .wi.fail{color:var(--danger)}
.ms-t{display:block;min-width:0;width:100%;padding:0;border:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ms-t b{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.ms-t b>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ms-t b svg.chev{width:13px;height:13px;color:var(--faint);flex:none;transition:transform .2s var(--out)}
.ms-t[aria-expanded="true"] b svg.chev{transform:rotate(90deg)}
.ms .sl{display:flex;align-items:center;gap:6px;min-width:0;margin-top:2px;font-size:12.5px;color:var(--muted)}
.ms .sl>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ms .sl.fresh>span:first-child{animation:fi .35s var(--out)}
.ms .sl .cur{height:11px;width:6px}
.ms .br{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:11px;color:var(--faint);min-width:0}
.ms .br svg.i{width:11px;height:11px;flex:none}
.ms .br code{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ms-r{display:flex;align-items:center;gap:6px;padding-top:1px}
.ms .wd{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.ms .wd.live{color:var(--ink2);font-weight:600}
.prc{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:0;border-radius:999px;background:var(--sunken);font:inherit;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;cursor:pointer}
.prc:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.prc svg.i{width:12px;height:12px;color:var(--muted)}
.sx{margin:0 14px 10px 44px;padding:10px 12px;border-radius:12px;background:var(--sunken);display:flex;flex-direction:column;gap:8px;animation:fi .25s var(--out) both;min-width:0}
.sx h4{margin:0;display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:650;color:var(--ink2)}
.sx h4 span{font-weight:500;color:var(--faint)}
.sx ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;min-width:0}
.sx li{min-width:0}
.sx li code{display:block;font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx .more{align-self:flex-start;padding:0;border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.sx .more:hover{color:var(--ink)}
.sx .none{font-size:12.5px;color:var(--faint)}
.sx .log{margin:0}
.sx-f{display:flex;gap:6px;flex-wrap:wrap}
.mwf{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 14px 10px;font-size:12px;color:var(--faint);border-top:1px solid var(--line)}
.mwf svg.i{width:13px;height:13px}
/* thread events (automatic, not a voice) */
.evt{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;margin:4px 12px 4px 58px;font-size:12.5px;color:var(--faint);animation:fi .35s var(--out) both}
.evt>svg.i{width:13px;height:13px}
.evt b{color:var(--ink2);font-weight:600}
.evt code{font-size:10.5px;color:var(--ink2)}
.evt .chip{height:20px;font-size:11px}
/* mission files drawer: side panel on desktop, bottom sheet on phone */
.drawer{position:fixed;z-index:60;top:64px;right:12px;bottom:12px;width:min(460px,calc(100vw - 24px));border-radius:22px;background:var(--raised);box-shadow:var(--e3),var(--top);display:flex;flex-direction:column;overflow:hidden;animation:popin .3s var(--spring) both}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 12px 10px 16px}
.dr-h .t{flex:1;min-width:0}
.dr-h b{display:block;font-size:16px;font-weight:650;letter-spacing:-.015em}
.dr-h small{display:block;font-size:12.5px;color:var(--faint)}
.dr-h small code{font-size:10.5px}
.dr-tabs{padding:0 16px 10px}
.dr-tabs .seg button{font-family:var(--mono);font-size:11.5px;font-weight:400;padding:0 10px}
.dr-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--faint)}
.dr-meta code{font-size:10.5px;color:var(--ink2)}
.dr-b{flex:1;overflow:auto;padding:14px 18px 20px;min-height:0}
.md{font-size:13.5px;color:var(--ink2);line-height:1.55}
.md .l{padding:1px 8px;margin:0 -8px;border-radius:6px}
.md .h1{font-family:var(--display);font-weight:300;font-size:24px;letter-spacing:-.03em;color:var(--ink);margin:2px -8px 6px}
.md .h2{font-weight:650;font-size:14px;color:var(--ink);margin-top:12px}
.md .li{position:relative;padding-left:22px}
.md .li::before{content:"";position:absolute;left:10px;top:.72em;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.md .p{margin-top:4px}
.md .q{color:var(--muted);box-shadow:inset 2px 0 0 color-mix(in srgb,var(--ink) 18%,transparent);margin-top:6px}
.md code{font-size:.8em;color:var(--ink)}
.md .add.new{animation:mdin .35s var(--out) both}
.md .at{margin-left:8px;font-size:12px;color:var(--faint);font-weight:400;white-space:nowrap}
@keyframes mdin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.dr-foot{display:flex;align-items:flex-start;gap:7px;padding:10px 16px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.dr-foot svg.i{width:13px;height:13px;margin-top:2px}
.cfl{flex-basis:100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.cfl>svg.i{width:12px;height:12px;color:var(--faint);flex:none}
.tlink{padding:0;border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink2);cursor:pointer}
.tlink:hover{text-decoration:underline;text-underline-offset:2px}
.difw{margin:0 0 16px;display:flex;flex-direction:column;gap:6px;animation:mdin .3s var(--out) both}
.difw>small{font-size:12px;color:var(--faint)}
.diff{font-family:var(--mono);font-size:10.5px;line-height:1.8;padding:8px 10px;border-radius:10px;background:var(--sunken);white-space:pre-wrap;overflow-wrap:anywhere}
.diff .d{display:block;color:var(--danger)}
.diff .a{display:block;color:var(--ok)}
.diff .c{display:block;color:var(--faint)}
body[data-scn="onb"] .app-only,body[data-scn="app"] .onb-only{display:none !important}
@media (max-width:760px){
  .pf{grid-template-columns:minmax(0,1fr);gap:4px}
  .prop-h,.prop-b{padding-left:14px;padding-right:14px}
  .card{padding:14px}
  .card .opts{grid-template-columns:minmax(0,1fr)}
  .opt .othumb{height:96px}
  .why{grid-template-columns:minmax(0,1fr);gap:4px}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  .app.th{grid-template-columns:248px minmax(0,1fr)}

}
@media (max-width:760px){
  .app,.app.th{grid-template-columns:minmax(0,1fr)}
  .sb{display:none}
  .proto{padding:8px 16px}

  .phd{padding:8px 10px 8px 16px}
  .scroll{padding:6px 4px 16px}

}

<body data-scn="onb">
<div class="proto">
  <b>Protótipo · Thread a partir daqui</b>

  if (silent) { S.th.push(reply); return; }
  return reply;
}
function goApp(k) {
  closeMenu();
  for (const el of $$("#toasts .toast")) el.remove();
  clearTimeout(goApp.tm);
  reset({ scn: "app", mode: "ctx" });
  S.step = k;
  if (k === "A1") { render(); return; }
  if (k === "A2") { S.title = "App mobile"; startSel("produto"); silentCreate(); S.thread = "onb"; S.drafts.th = ASK_APP; render(); return; }
  seedApp(k === "A7" ? "A6" : k);
  if (k === "A3") A().drawer = "mission";
  if (k === "A6") { A().drawer = "notes"; const n = A().files.notes; A().files.notes = n.slice(0, -2); goApp.tm = setTimeout(() => { A().files.notes = n; renderDrawer(); }, REDUCED ? 0 : 900); }
  render();
  if (k === "A4") pendingScroll = null;
  if (k === "A7") goApp.tm = setTimeout(() => macOff(), REDUCED ? 0 : 700);
}
function nextApp() {
  const k = S.step, a = A();
  if (k === "A1") {
    if (!S.ctx) return quickCreate();
    return goApp("A2");
  }
  if (k === "A2") {
    if (!S.th.length) { if (!S.drafts.th.trim()) S.drafts.th = ASK_APP; return send("th"); }
    if (a.plan !== "ok") return planOk();
    return goApp("A3");
  }
  if (k === "A3") return goApp("A4");
  if (k === "A4") { if (a.review === "pending") return reviewOk(); return goApp("A5"); }
  if (k === "A5") { if (a.decision === "pending") { a.pick = a.pick || "tabs"; return decideApp(); } return goApp("A6"); }
  if (k === "A6") return goApp("A7");
  if (k === "A7") { if (!a.offline && !a.back) return macOff(); if (a.offline) return macOn(); }
}
function planOk() {
  const a = A(), p = $("#prop");
  if (p && !REDUCED) p.insertAdjacentHTML("beforeend", `<div class="stamp"><span class="ok">${I.check}</span>Começou</div>`);
  setTimeout(() => {
    a.plan = "ok"; a.pinned = true; a.sess = [SESS().plan];
    devReply(S.th, { mode: "run", html: START_MSG, card: () => sessionsHTML("m-plan", ["plan"], false) }, 700);
    toast({ icon: I.check, title: "Plano começou", sub: "O plano fica fixado no topo da thread e em .agentes/mission.md.", action: { label: "Ver plano", run: () => { S.step = "A3"; renderSteps(); openFiles("mission"); } } });
  }, REDUCED ? 0 : 600);
}
function reviewOk() {
  const a = A(), card = $("#card-rv");
  if (card && !REDUCED) card.insertAdjacentHTML("beforeend", `<div class="stamp"><span class="ok">${I.check}</span>Aprovado</div>`);
  setTimeout(() => { a.review = "ok"; render(); toast({ icon: I.check, title: "Protótipos aprovados", sub: "O Claude Code segue; falta escolher a navegação." }); }, REDUCED ? 0 : 500);
}
function replyTo(label, text = "") {
  S.reply = label; S.drafts.th = text; render();
  setTimeout(() => { const ta = $("#ta-th"); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 40);
}
function decideApp() {
  const a = A(); if (!a.pick) return;
  const card = $("#card-nav");
  if (card && !REDUCED) card.insertAdjacentHTML("beforeend", `<div class="stamp"><span class="ok">${I.check}</span>Decidido</div>`);
  setTimeout(() => {
    const reply = takeDecision(a.pick);
    const { id: _id, ...r } = reply; render(); devReply(S.th, r, 700);
    openFiles("decisions");
    toast({ icon: I.doc, title: "decisions.md atualizado", sub: "A entrada nova está destacada no arquivo; a sessão retomou com a decisão." });
  }, REDUCED ? 0 : 600);
}
function macOff() {
  const a = A(); if (a.offline) return;
  S.step = "A7"; a.offline = true; a.back = false;
  for (const x of a.sess) if (x.state === "run") x.state = "int";
  S.th.push({ id: "o1", evt: () => `<div class="evt">${I.laptop}<span><b>${esc(MACHINE)}</b> ficou offline · 14:32</span></div>` });
  devReply(S.th, { at: t(14, 32), html: "<p>O MacBook do Walter ficou offline. 2 tarefas ficaram interrompidas: <b>Tela de chat</b> e <b>Navegação e shell</b>. Nada se perde: o Mac guarda o que cada tarefa já fez e eu retomo quando ele voltar.</p>", card: () => sessionsHTML("m-off", a.sess.filter((x) => x.state === "int" || x.id === "api").map((x) => x.id), false) }, 700);
  clearTimeout(goApp.tm);
  goApp.tm = setTimeout(() => macOn(), REDUCED ? 0 : 4200);
}
function macOn() {
  const a = A(); if (!a.offline) return;
  clearTimeout(goApp.tm);
  a.offline = false; a.back = true;
  const resumed = a.sess.filter((x) => x.state === "int");
  for (const x of resumed) { x.state = "run"; x.started = nowMs() - 30e3; x.hold = 3; a.live[x.id] = ["", "Retomando de onde parou"]; }
  a.files.notes = [...a.files.notes.map((x) => x.startsWith("+") ? x.slice(1) : x), "+- 14:51: retomei depois da queda do Mac; `git status` limpo em chat-screen, 2 arquivos pendentes em nav-shell"];
  a.sync.notes = "14:52";
  S.th.push({ id: "o2", evt: () => `<div class="evt">${I.laptop}<span><b>${esc(MACHINE)}</b> voltou · 14:51</span></div>` });
  devReply(S.th, { at: t(14, 51), mode: "run", html: `<p>Retomei ${resumed.length} tarefas de onde pararam (li <code>.agentes/notes.md</code> e o <code>git status</code>). Cada uma continuou a própria sessão, com o que já tinha feito.</p>`, card: () => sessionsHTML("m-back", resumed.map((x) => x.id), false) }, 900);
  toast({ icon: I.laptop, title: "Mac de volta", sub: `${resumed.length} tarefas retomadas da mesma sessão.` });
}
function appClick(tg) {
  if (S.scn !== "app") return false;
  const a = A();
  if (tg.closest("[data-sim]")) { if (a.offline) macOn(); else if (S.step !== "A7" || a.back) goApp("A7"); else macOff(); return true; }
  if (tg.closest("[data-plan-ok]")) { planOk(); return true; }
  if (tg.closest("[data-plan-edit]")) { replyTo("Plano"); return true; }
  if (tg.closest("[data-rv-ok]")) { reviewOk(); return true; }
  if (tg.closest("[data-rv-adj]")) { replyTo("Protótipos de navegação"); return true; }
  const fo = tg.closest("[data-files]"); if (fo) { if (fo.hasAttribute("data-diffopen")) a.diff = true; openFiles(fo.dataset.files); return true; }
  if (tg.closest("[data-fclose]")) { a.drawer = null; renderDrawer(); return true; }
  if (tg.closest("[data-diff]")) { a.diff = !a.diff; renderDrawer(); return true; }
  const mw = tg.closest("[data-mw]"); if (mw) { a.open[mw.dataset.mw] = !(a.open[mw.dataset.mw] ?? true); render(); return true; }
  const ms = tg.closest("[data-ms]"); if (ms) { a.lay[ms.dataset.ms] = !a.lay[ms.dataset.ms]; render(); return true; }
  const sm = tg.closest("[data-smore]"); if (sm) { a.more[sm.dataset.smore] = !a.more[sm.dataset.smore]; render(); return true; }
  const sl = tg.closest("[data-slog]"); if (sl) { a.logs[sl.dataset.slog] = !a.logs[sl.dataset.slog]; render(); return true; }
  const pk = tg.closest("[data-apick]"); if (pk) { a.pick = pk.dataset.apick; render(); return true; }
  if (tg.closest("[data-adecide]")) { decideApp(); return true; }
  return false;
}
// the live last line of each running session (commands stay in the output view)
setInterval(() => {
  if (S.scn !== "app" || A().offline) return;
  const a = A();
  for (const x of a.sess) {
    if (x.state !== "run" || !x.log) continue;
    if (x.hold) { x.hold--; continue; }
    const L = ALOGS[x.log]; x.li = (x.li || 0) + 1; const line = L[x.li % L.length]; if (line[0] === "cmd") continue; a.live[x.id] = line;
    for (const el of $$(`[data-alive="${x.id}"]`)) { el.innerHTML = `<span>${esc(line[1])}</span><span class="cur" aria-hidden="true"></span>`; el.classList.remove("fresh"); void el.offsetWidth; el.classList.add("fresh"); }
  }
}, 1700);
setInterval(() => { if (S.scn !== "app") return; for (const x of A().sess) if (x.state === "run") for (const el of $$(`[data-atick="${x.id}"]`)) el.textContent = dur(nowMs() - x.started); }, 1000);

/* ---------- segmented controls: theme and trecho ---------- */
function seg(el, value, on) {
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); if (!b) return; pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });
seg($("#scnSeg"), "onb", (v) => { reset({ scn: v }); goStep(v === "app" ? "A1" : "1"); });
seg($("#longSeg"), "short", (v) => {
  S.long = v === "long";
  if (S.sel && S.sel.ch === "produto") { if (S.long && S.sel.a === "p3") S.sel.a = "grp"; if (!S.long && S.sel.a === "grp") S.sel.a = "p3"; S.pvAll = false; }
  S.ctxAll = false;

});

reset();
render();
