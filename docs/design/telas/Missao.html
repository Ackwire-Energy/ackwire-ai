<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Funnel+Display:wght@300;400&family=Martian+Mono:wght@400&display=swap">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
<style>
/*
  Prototype: Missões (long-running missions), on the approved design system (Proposta 2, Componentes.dc.html).
  A mission is a long project handed to an agent that outlives a single run. Here: "@dev constrói o app
  mobile do agentes.chat (Expo/React Native), base no web atual". Dev is the project manager: Claude Code
  runs on the person's connected computer and codes; Dev splits the work in phases, launches background
  tasks (one git worktree/branch each), wakes when they finish, reviews, records decisions in
  docs/decisoes.md, publishes artifacts to the Drive and stops at phase gates for human approval.
  The page: a header (agent, owner, status, computer, time; no budget: the executor runs on the person's plan); the phase horizon in pixel/dither in
  the agent's own tones with gates and the agent's sprite where it stands; "Precisa de você" (blocking
  decisions with options and a recommendation, the gate review package, provisional decisions to approve
  one by one or all at once); tasks as one human line each (summary, or the live last line), time and PR; the
  decision log; artifacts (fake phone screens, Expo QR, PRs, docs); activity with the agent waking on
  events and a daily digest; a details panel; "Nova missão". Mono only for branches, commands, logs, paths.
  Agents come from packages/ui/src/agent/engine.js (serve the repo root over http).
*/
:root{
  --bg:#f4f4f1;--raised:#ffffff;--sunken:#ebebe7;--paper:#ffffff;--glass:rgba(255,255,255,.72);
  --line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;
  --agent:#0063d1;--agent2:#3d8bff;
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b42a20;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 6px 16px -4px rgba(23,23,22,.10),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(20,20,18,.28);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sans:"Onest","Segoe UI",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--mono:"Martian Mono",ui-monospace,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--paper:#1f1f1d;--glass:rgba(30,30,28,.66);
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;
  --agent:#5aa8ff;--agent2:#8cc3ff;
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#f08a80;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","tnum"}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
code,.mono{font-family:var(--mono);font-size:.84em;letter-spacing:-.01em}

/* ---------- design system bits ---------- */
.kbd{font-family:var(--sans);font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:rgba(127,127,127,.14);color:inherit;opacity:.75;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12);flex:none}
.b{font:inherit;font-size:14px;font-weight:600;letter-spacing:-.005em;height:40px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s var(--spring),box-shadow .18s var(--out),background .15s,color .15s,filter .15s;white-space:nowrap;color:var(--ink);background:transparent}
.b:active{transform:scale(.97) translateY(.5px)}
.b:focus-visible,.ib:focus-visible,.fc:focus-visible,.seg button:focus-visible,.row:focus-visible,.mi:focus-visible,.sw:focus-visible,.opt:focus-visible,.art:focus-visible,.hzp:focus-visible{outline:none;box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.b1{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)) 0%,var(--ink) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.b1:hover{filter:brightness(1.08)}
.b2{background:var(--raised);box-shadow:var(--e1),var(--top)}
.b2:hover{box-shadow:var(--e2),var(--top)}
.bg{color:var(--muted)}
.bg:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.b.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px;gap:7px}
.b.xs{height:28px;padding:0 10px;font-size:12.5px;border-radius:9px;gap:6px}
.b:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,color .15s,transform .18s var(--spring)}
.ib:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.ib:active{transform:scale(.94)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:600;height:30px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;transition:color .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;flex:none}
.chip svg.i{width:12px;height:12px}
.chip.ink{background:var(--ink);color:var(--bg)}
.chip.okc{color:var(--ok)}
.chip.dang{color:var(--danger)}
.chip.wrn{color:var(--warn)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--e3)}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sw{position:relative;width:36px;height:22px;border-radius:999px;border:0;padding:0;cursor:pointer;flex:none;background:color-mix(in srgb,var(--ink) 16%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.12);transition:background .2s var(--out)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 2px 6px -2px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]::after{transform:translateX(14px)}
:root[data-theme="dark"] .sw[aria-checked="true"]::after{background:var(--bg)}
.sw:active::after{width:21px}
.sw[aria-checked="true"]:active::after{transform:translateX(11px)}

/* Agents: the engine's body (canvas). People: a circle with the initial. */
.agw{position:relative;display:inline-flex;flex:none}
canvas.av{display:block}
.agw.run::after{content:"";position:absolute;inset:-3px;border-radius:32% 32% 32% 12%;border:1.5px solid color-mix(in srgb,var(--agent) 55%,transparent);animation:halo 1.6s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}100%{opacity:0;transform:scale(1.14)}}
.pp{--s:20px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:650;font-size:calc(var(--s) * .46);background:linear-gradient(160deg,#e9e9e5,#d4d4cf);color:#2a2a28;line-height:1}
:root[data-theme="dark"] .pp{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}

/* ---------- prototype bar (not product) ---------- */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.proto b{color:var(--ink);font-weight:650}
.proto .grow{flex:1}
.proto .seg button{height:26px;font-size:12px}
.proto .seg .pill{height:26px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 49px)}
.app.with-panel{grid-template-columns:64px minmax(0,1fr) 420px}
.rail{background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid var(--line)}
.rail .logo{margin-bottom:10px}
.rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail button:hover{background:rgba(127,127,127,.12);color:var(--ink)}
.rail button[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top)}
.rail svg.i{width:19px;height:19px}
.main{min-width:0;padding:22px 28px 120px;max-width:1120px;width:100%;margin:0 auto}
.panel{display:none;padding:12px 12px 12px 0;position:sticky;top:0;height:100vh;overflow:auto}

/* ---------- header ---------- */
.crumb{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--faint);margin-bottom:14px}
.crumb button{border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;padding:2px 6px;border-radius:7px;margin-left:-6px}
.crumb button:hover{background:rgba(127,127,127,.1);color:var(--ink)}
.mhd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start;margin-bottom:18px}
.mhd .who{padding-top:4px}
.mhd h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.05}
.mhd .goal{color:var(--muted);margin-top:6px;max-width:62ch;font-size:14px}
.mhd .goal b{color:var(--ink2);font-weight:600}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.mc{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;border-radius:999px;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.mc svg.i{width:14px;height:14px;color:var(--muted)}
.mc small{font-weight:500;color:var(--faint);font-size:12px}
.mc .bar{width:46px;height:5px;border-radius:5px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.mc .bar i{display:block;height:100%;background:var(--ink);border-radius:5px}
.mc.state{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mc.state svg.i{color:var(--bg)}
.mhd .acts{display:flex;gap:8px;align-items:center}

/* ---------- phase horizon ---------- */
.hz{position:relative;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:14px 16px 0;margin-bottom:24px;overflow:hidden}
.hz-h{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.hz-h h2{font-size:13px;font-weight:650;color:var(--ink2)}
.hz-h .sub{font-size:12.5px;color:var(--faint)}
.hz-h .grow{flex:1}
.hz-h .legend{display:flex;gap:12px;font-size:12px;color:var(--faint)}
.hz-h .legend span{display:inline-flex;align-items:center;gap:5px}
.hz-key{display:inline-block;width:9px;height:12px;image-rendering:pixelated;vertical-align:-1px}
.hz-stage{position:relative;height:84px}
canvas.mh{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:default}
.gtag{position:absolute;top:2px;transform:translateX(-4px);display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--ink);color:var(--bg);white-space:nowrap;pointer-events:none;animation:fi .3s var(--out) both}
.gtag svg.i{width:12px;height:12px}
.gtag.ok{background:var(--sunken);color:var(--muted)}
.hz-phases{position:relative;display:grid;gap:0;padding:6px 0 26px}
.hzp{min-width:0;text-align:left;border:0;background:transparent;cursor:pointer;padding:6px 8px 4px;border-radius:10px;border-left:1px dashed var(--line2)}
.hzp:first-child{border-left:0}
.hzp:hover{background:color-mix(in srgb,var(--sunken) 55%,transparent)}
.hzp b{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hzp b .n{font-weight:500;color:var(--faint);font-size:12px}
.hzp small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hzp.cur b{color:var(--ink)}
.hzp.cur small{color:var(--ink2);font-weight:600}
.hzp.fut b{color:var(--muted)}
.hzp[aria-pressed="true"]{background:var(--sunken)}
canvas.horizon{position:absolute;left:0;right:0;bottom:0;width:100%;height:14px;image-rendering:pixelated;pointer-events:none}

/* ---------- sections ---------- */
.sec{margin-bottom:28px;animation:fi .3s var(--out) both}
.sh{display:flex;align-items:center;gap:10px;margin:0 4px 10px;min-height:30px;flex-wrap:wrap}
.sh h2{font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.sh .n{font-size:12.5px;color:var(--faint)}
.sh .grow{flex:1}
.sh .sub{font-size:12.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.sh .sub svg.i{width:14px;height:14px}
.list{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);overflow:hidden}
.card{border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:18px;position:relative}
.stack{display:flex;flex-direction:column;gap:12px}
.sublab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:6px 4px 0;display:flex;align-items:center;gap:8px}

/* ---------- "precisa de você" ---------- */
.need{position:relative}
.q-h{display:flex;gap:12px;align-items:flex-start}
.q-h .t{flex:1;min-width:0}
.q-h h3{font-size:17px;font-weight:650;letter-spacing:-.015em;line-height:1.3}
.q-h p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:70ch}
.q-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.opt{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border-radius:16px;border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;transition:box-shadow .18s var(--out),transform .2s var(--spring),background .15s}
.opt:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.opt:active{transform:scale(.985)}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:color-mix(in srgb,var(--sunken) 40%,var(--raised))}
.opt .top{display:flex;align-items:flex-start;gap:10px}
.opt .rd{width:18px;height:18px;border-radius:50%;flex:none;margin-top:1px;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;justify-content:center;transition:box-shadow .2s var(--spring)}
.opt[aria-checked="true"] .rd{box-shadow:inset 0 0 0 5.5px var(--ink)}
.opt b{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em}
.opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.opt .thumb{display:flex;justify-content:center;padding:10px 0 0;border-radius:12px;background:var(--sunken);overflow:hidden;height:118px}
.opt .chip{align-self:flex-start}
.why{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sunken);font-size:13.5px;color:var(--ink2)}
.why .k{font-size:12px;font-weight:650;color:var(--faint);padding-top:1px;white-space:nowrap}
.why .k.ag{display:flex;align-items:flex-start;gap:6px}
.q-f{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.q-f .grow{flex:1}
.q-f .hint{font-size:12.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.need.taking{animation:taken .7s var(--out) forwards}
@keyframes taken{0%{opacity:1;transform:none}40%{opacity:1;transform:scale(.99)}100%{opacity:0;transform:translateY(-6px) scale(.98)}}
.need .stamp{position:absolute;inset:0;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--raised) 86%,transparent);font-weight:650;font-size:15px;animation:fi .2s var(--out) both;z-index:2}
.need .stamp .ok{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center}

/* gate review package */
.gate .gl{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:14px}
.gate ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--ink2)}
.gate li{display:flex;gap:9px;align-items:flex-start}
.gate li svg.i{width:15px;height:15px;color:var(--faint);margin-top:2px}
.gate .shots{display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:12px 10px 0;border-radius:16px;background:var(--sunken);overflow:hidden;height:176px}
.gfacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gfacts .where-row{flex:1 1 200px}
.adj{margin-top:12px;display:flex;flex-direction:column;gap:8px;animation:fi .25s var(--out) both}
/* provisional decisions */
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-top:1px solid var(--line);transition:background .15s}
.prow:first-child{border-top:0}
.prow .ic{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.prow b{display:block;font-weight:600;font-size:14px;letter-spacing:-.01em}
.prow b .pre{font-weight:500;color:var(--muted)}
.prow small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.prow .acts{display:flex;gap:6px}
.prow.taking{animation:rowtaken .65s var(--out) forwards}
.prow.taking .ic{background:var(--ink);color:var(--bg);transition:background .2s}
@keyframes rowtaken{0%{background:transparent}30%{background:color-mix(in srgb,var(--sunken) 80%,transparent)}100%{opacity:0;transform:translateX(10px)}}
.calm{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 18px 22px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.calm .glow{position:relative;width:100%;height:150px;margin-bottom:-10px}
.calm .glow canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.calm .glow .agw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.calm b{font-family:var(--display);font-weight:300;font-size:24px;letter-spacing:-.03em}
.calm p{color:var(--muted);max-width:48ch;font-size:13.5px}

/* ---------- tasks ---------- */
.slots{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
canvas.slots{height:12px;image-rendering:pixelated}
.row{position:relative;display:grid;grid-template-columns:30px minmax(0,1.1fr) minmax(0,1.3fr) 84px auto;align-items:center;gap:14px;padding:13px 12px 13px 14px;border-top:1px solid var(--line);cursor:pointer;outline:none;transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--sunken) 45%,transparent)}
.row.on{background:color-mix(in srgb,var(--sunken) 80%,transparent)}
.row.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ink)}
.row .st{width:30px;height:30px;border-radius:10px;background:var(--sunken);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.row .st.run{color:var(--agent)}
.row .st.fail{color:var(--danger)}
.row .st.done{background:var(--ink);color:var(--bg)}
.row .st svg.i{width:15px;height:15px}
.spin{animation:spin 1.2s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.ti{min-width:0}
.ti b{display:block;font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti small{display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;min-width:0}
.ti small svg.i{width:13px;height:13px;color:var(--faint)}
.ti small code{overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--ink2)}
.last{min-width:0;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.last code{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2);min-width:0}
.last .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last.fresh code{animation:fi .35s var(--out)}
.el{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.el.live{color:var(--ink2);font-weight:600}
.row .acts{display:flex;align-items:center;justify-content:flex-end;gap:4px}
canvas.strip{position:absolute;left:0;right:0;bottom:0;width:100%;height:3px;image-rendering:pixelated;pointer-events:none}
.row[data-dim] .ti b{color:var(--muted)}
.row.trow{grid-template-columns:30px minmax(0,1fr) auto auto}
.trow .hl{display:flex;align-items:center;gap:6px;min-width:0;margin-top:2px;font-size:12.5px;color:var(--muted)}
.trow .hl>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trow .hl.fresh>span:first-child{animation:fi .35s var(--out)}
.curs{display:inline-block;width:6px;height:11px;background:var(--agent);flex:none;animation:blinkc 1s steps(1) infinite}
.trow .ti small.br{margin-top:3px;font-size:11px;color:var(--faint);gap:4px}
.trow .ti small.br svg.i{width:11px;height:11px}
.trow .ti small.br code{font-size:10px;color:var(--faint)}
.trow .rt{display:flex;align-items:center;gap:8px}
.trow .acts:empty{display:none}
.prc{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:0;border-radius:999px;background:var(--sunken);font:inherit;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;cursor:pointer}
.prc:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.prc svg.i{width:12px;height:12px;color:var(--muted)}
.chg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.chg code{display:block;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- decisions log ---------- */
.tb{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 0 10px}
.tb::-webkit-scrollbar{display:none}
.fc{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;border:0;background:var(--raised);box-shadow:var(--e1),var(--top);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none;transition:transform .18s var(--spring),background .15s,color .15s,box-shadow .15s}
.fc:hover{box-shadow:var(--e2),var(--top)}
.fc:active{transform:scale(.96)}
.fc .n{font-weight:500;color:var(--faint);font-size:12px}
.fc svg.i{width:14px;height:14px}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.fc[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.drow{grid-template-columns:132px minmax(0,1fr) minmax(0,190px) 24px}
.drow .file{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);min-width:0}
.drow .file code{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.drow .file svg.i{width:13px;height:13px}
.drow .chev{color:var(--faint)}
.row.new{animation:landed .8s var(--spring) both}
@keyframes landed{0%{opacity:0;transform:translateY(8px) scale(.98);background:var(--sunken)}100%{opacity:1;transform:none}}

/* ---------- artifacts ---------- */
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:12px}
.art{border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:7px;cursor:pointer;transition:transform .22s var(--spring),box-shadow .2s var(--out);text-align:left;border:0;display:flex;flex-direction:column;min-width:0}
.art:hover{transform:translateY(-2px);box-shadow:var(--e2),var(--top)}
.art .pv{height:172px;border-radius:13px;background:var(--sunken);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;padding:14px 10px 0}
.art .pv.center{align-items:center;padding:12px}
.art .bd{padding:10px 7px 5px;min-width:0}
.art .bd b{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .bd b svg.i{width:14px;height:14px;color:var(--faint)}
.art .bd small{display:block;font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .links{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
canvas.qr{width:112px;height:112px;image-rendering:pixelated;border-radius:8px;background:var(--paper);padding:6px;box-shadow:var(--e1)}
.qrw{display:flex;flex-direction:column;align-items:center;gap:8px}
.qrw code{font-size:10px;color:var(--muted)}
.diff{width:100%;align-self:stretch;border-radius:10px 10px 0 0;background:var(--paper);box-shadow:var(--e1);padding:10px;font-family:var(--mono);font-size:9.5px;line-height:1.75;color:var(--muted);overflow:hidden}
.diff .a{color:var(--ok)}
.diff .r{color:var(--danger)}
.diff .h{color:var(--ink2);font-family:var(--sans);font-weight:650;font-size:11px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.docpv{width:86%;align-self:stretch;border-radius:10px 10px 0 0;background:var(--paper);box-shadow:var(--e1);padding:12px;display:flex;flex-direction:column;gap:6px}
.docpv .t{font-size:11px;font-weight:650;color:var(--ink2)}
.docpv i{display:block;height:4px;border-radius:3px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.docpv i.s{width:60%}
.docpv i.h{height:5px;width:42%;background:color-mix(in srgb,var(--ink) 22%,transparent);margin-top:4px}

/* fake phone screens */
.phone{--w:108px;width:var(--w);height:calc(var(--w) * 2.05);flex:none;border-radius:calc(var(--w) * .16) calc(var(--w) * .16) 0 0;background:#151514;padding:calc(var(--w) * .035) calc(var(--w) * .035) 0;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
.phone .scr{width:100%;height:100%;border-radius:calc(var(--w) * .13) calc(var(--w) * .13) 0 0;background:#fbfbf9;overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:calc(var(--w) * .062);color:#2a2a28;line-height:1.3}
:root[data-theme="dark"] .phone{background:#2c2c2a}
:root[data-theme="dark"] .phone .scr{background:#141413;color:#d6d6d2}
.phone .isl{width:32%;height:calc(var(--w) * .06);border-radius:99px;background:#151514;margin:calc(var(--w) * .04) auto calc(var(--w) * .03)}
:root[data-theme="dark"] .phone .isl{background:#000}
.phone .ttl{font-weight:700;font-size:calc(var(--w) * .095);padding:0 9% 4%;letter-spacing:-.02em}
.phone .rw{display:flex;align-items:center;gap:6%;padding:3.5% 9%}
.phone .rw .ln{flex:1}
.phone .ln{display:block;height:calc(var(--w) * .03);border-radius:3px;background:color-mix(in srgb,currentColor 18%,transparent)}
.phone .ln.s{width:55%}
.phone .ln.m{width:75%}
.phone .lns{display:flex;flex-direction:column;gap:calc(var(--w) * .025);flex:1}
.phone .hashc{width:calc(var(--w) * .1);height:calc(var(--w) * .1);border-radius:30%;background:color-mix(in srgb,currentColor 12%,transparent);flex:none}
.phone .tabs{margin-top:auto;display:flex;justify-content:space-around;padding:5% 6% 9%;border-top:1px solid color-mix(in srgb,currentColor 10%,transparent)}
.phone .tabs i{width:calc(var(--w) * .085);height:calc(var(--w) * .085);border-radius:28%;background:color-mix(in srgb,currentColor 22%,transparent)}
.phone .tabs i.on{background:currentColor}
.phone .bub{max-width:72%;padding:4% 6%;border-radius:calc(var(--w) * .06);margin:2% 7%;background:color-mix(in srgb,currentColor 9%,transparent);display:flex;flex-direction:column;gap:calc(var(--w) * .02)}
.phone .bub.me{align-self:flex-end;background:#151514;color:#fbfbf9}
:root[data-theme="dark"] .phone .bub.me{background:#efefec;color:#141413}
.phone .bub .ln{background:color-mix(in srgb,currentColor 30%,transparent)}
.phone .agl{display:flex;align-items:flex-start;gap:4%;padding:0 7%;margin-top:2%}
.phone .agl .bub{margin:0}
.phone .cur{display:inline-block;width:calc(var(--w) * .03);height:calc(var(--w) * .06);background:var(--agent);animation:blinkc 1s steps(1) infinite;vertical-align:middle}
.phone .cmp{margin:auto 7% 8%;height:calc(var(--w) * .13);border-radius:99px;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}
.phone .drw{position:absolute;inset:0;display:flex}
.phone .drw .pane{width:68%;height:100%;background:color-mix(in srgb,#ebebe7 90%,transparent);padding-top:22%;display:flex;flex-direction:column;box-shadow:6px 0 14px -6px rgba(0,0,0,.3)}
:root[data-theme="dark"] .phone .drw .pane{background:#0a0a09}
.phone .drw .dim{flex:1;background:rgba(0,0,0,.18)}
.phone .sky{position:relative;height:44%;margin:0 6%;border-radius:calc(var(--w) * .08);overflow:hidden;display:flex;align-items:center;justify-content:center}
.phone .sky canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.phone .sky .agw{position:relative}
.phone .btn{margin:auto 9% 10%;height:calc(var(--w) * .13);border-radius:calc(var(--w) * .04);background:#151514}
:root[data-theme="dark"] .phone .btn{background:#efefec}
.phone .apr{margin:4% 7%;padding:6%;border-radius:calc(var(--w) * .06);box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 14%,transparent);display:flex;flex-direction:column;gap:calc(var(--w) * .03)}
.phone .apr .bt{display:flex;gap:6%;margin-top:4%}
.phone .apr .bt i{flex:1;height:calc(var(--w) * .1);border-radius:calc(var(--w) * .03);background:color-mix(in srgb,currentColor 12%,transparent)}
.phone .apr .bt i.p{background:currentColor}
@keyframes blinkc{50%{opacity:0}}

/* ---------- activity ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.digest{display:flex;flex-direction:column;gap:12px}
.digest .dh{display:flex;align-items:center;gap:10px}
.digest .dh b{font-size:14.5px;font-weight:650}
.digest .dh small{display:block;color:var(--faint);font-size:12px}
.digest .blk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:13.5px;color:var(--ink2);padding-top:10px;border-top:1px solid var(--line)}
.digest .blk .k{font-size:12px;font-weight:650;color:var(--faint);padding-top:1px}
.digest .blk ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.digest .blk button{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.digest .blk button:hover{text-decoration-color:var(--ink)}
.vt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vt li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;position:relative;padding:6px 6px 12px 2px;border-radius:12px}
.vt li::before{content:"";position:absolute;left:12px;top:28px;bottom:-6px;width:1.5px;background:var(--line2)}
.vt li:last-child::before{display:none}
.vt li.new{animation:landed .8s var(--spring) both}
.vt .node{width:20px;height:20px;border-radius:7px;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--ink2);position:relative;z-index:1}
.vt .node svg.i{width:12px;height:12px;stroke-width:2.2}
.vt .node.ok{background:var(--ink);color:var(--bg)}
.vt .node.failed{background:var(--danger);color:#fff}
.vt .node.run{background:var(--agent);color:#fff}
.vt .vh{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vt .vn{color:var(--muted);font-size:13px;margin-top:2px}
.vt .vw{color:var(--faint);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.wake{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted)}
.wake svg.i{width:12px;height:12px}

/* ---------- details panel ---------- */
.with-panel .panel{display:block}
.pin{border-radius:20px;background:var(--raised);box-shadow:var(--e2),var(--top);padding:16px;display:flex;flex-direction:column;gap:16px;animation:slidein .32s var(--spring) both;min-height:100%}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;gap:8px}
.ph .grow{flex:1}
.pin h2{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.25;word-break:break-word}
.pin .pm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:8px}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.pacts .b{flex:1 1 auto}
.ps{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ps h3{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;align-items:center;gap:8px}
.ps h3 .grow{flex:1}
.prompt{padding:12px 14px;border-radius:14px;background:var(--sunken);font-size:13.5px;line-height:1.55;color:var(--ink2)}
.ps .opts{grid-template-columns:minmax(0,1fr);margin-top:0}
.ps .opt .thumb{display:none}
.where-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--sunken);font-size:13.5px;min-width:0}
.where-row .ic{width:28px;height:28px;border-radius:9px;background:var(--raised);box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.where-row .t{flex:1;min-width:0}
.where-row b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-row b code{font-weight:400}
.where-row small{display:block;color:var(--faint);font-size:12px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;margin:0}
.facts dt{color:var(--faint)}
.facts dd{margin:0;color:var(--ink2);min-width:0;overflow-wrap:anywhere}
.facts code{font-size:11px}
.md{margin:0;padding:12px 14px;border-radius:14px;background:var(--sunken);font-family:var(--mono);font-size:11px;line-height:1.75;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.md .h{color:var(--ink);font-weight:400}
.md .c{color:var(--faint)}
.log{margin:0;padding:12px 14px;border-radius:14px;background:var(--sunken);font-family:var(--mono);font-size:11px;line-height:1.8;color:var(--ink2);max-height:340px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.log .ln{display:block;animation:fi .25s var(--out) both}
.log .cmd{color:var(--ink)}
.log .dim{color:var(--faint)}
.log .okl{color:var(--ok)}
.log .err{color:var(--danger)}
.log .cur{display:inline-block;width:7px;height:13px;background:var(--agent);vertical-align:-2px;animation:blinkc 1s steps(1) infinite}
.meter{height:6px;border-radius:6px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:var(--ink)}
.mrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow b{color:var(--ink);font-weight:600}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:none;animation:fi .2s var(--out)}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:80;min-width:220px;max-width:calc(100vw - 24px);border-radius:16px;padding:6px;animation:popin .22s var(--spring) both}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 10px;border-radius:10px;border:0;background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.mi:hover,.mi.on{background:rgba(127,127,127,.12)}
.mi .sub{color:var(--faint);font-size:12.5px;margin-left:auto;padding-left:10px}
.mi.danger{color:var(--danger)}
.mi .tick{margin-left:auto;color:var(--ink);visibility:hidden}
.mi[aria-checked="true"] .tick{visibility:visible}
.msep{height:1px;margin:6px 8px;background:var(--line)}
.mgroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px 4px}

/* ---------- dialog: new mission ---------- */
.dlg-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim);animation:fi .2s var(--out)}
.dlg{width:min(660px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:24px;background:var(--raised);box-shadow:var(--e3),var(--top);animation:popin .28s var(--spring) both;display:flex;flex-direction:column}
.dlg-h{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 6px}
.dlg-h .t{flex:1}
.dlg-h h2{font-size:20px;font-weight:650;letter-spacing:-.02em}
.dlg-h p{color:var(--muted);font-size:13.5px;margin-top:2px}
.dlg-b{padding:12px 20px 4px;display:flex;flex-direction:column;gap:16px}
.dlg-f{display:flex;align-items:center;gap:8px;padding:16px 20px 20px;flex-wrap:wrap}
.dlg-f .grow{flex:1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.lb{font-size:13px;font-weight:600;color:var(--ink2)}
.fld .hint{font-size:12px;color:var(--faint)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.inp{display:flex;align-items:center;gap:9px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),inset 0 1px 2px rgba(0,0,0,.04);transition:box-shadow .15s;min-width:0}
.inp:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp input,.inp textarea{all:unset;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.inp textarea{padding:10px 0;line-height:1.5;min-height:66px;white-space:pre-wrap}
.inp.ta{align-items:flex-start}
.sel{justify-content:space-between;cursor:pointer;border:0;width:100%;text-align:left}
.sel .v{display:flex;align-items:center;gap:9px;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden}
.sel svg.chev{color:var(--faint)}
.phs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.phs .pc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:10px;background:var(--sunken);font-size:13px;font-weight:600;color:var(--ink2)}
.phs .pc .n{color:var(--faint);font-weight:500;font-size:12px}
.phs .pc button{width:20px;height:20px;border-radius:6px;border:0;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.phs .pc button:hover{background:rgba(127,127,127,.15);color:var(--ink)}

function taskRow(t) {

/* ---------- live: streamed lines and ticking time ---------- */
setInterval(() => {
  if (S.paused) return;
  for (const t of running()) {
    const L = LOGS[t.id]; if (!L) continue;
    const line = L[t.i % L.length]; t.i++;
    t.log.push(line);
    if (t.log.length > 60) t.log.shift();
    const el = $(`[data-last="${t.id}"]`);
    if (el && line[0] !== "cmd") { el.innerHTML = `<span>${esc(line[1])}</span><span class="curs" aria-hidden="true"></span>`; el.classList.remove("fresh"); void el.offsetWidth; el.classList.add("fresh"); }
    if (S.open?.kind === "task" && S.open.id === t.id) {
      const lg = $("#log");
      if (lg) { const cur = lg.querySelector(".cur"); cur?.insertAdjacentHTML("beforebegin", lineHTML(line)); const near = lg.scrollHeight - lg.scrollTop - lg.clientHeight < 60; if (near) lg.scrollTop = lg.scrollHeight; }
    }
  }
  S.ahead = Math.min(.92, S.ahead + .002);
}, 1500);
setInterval(() => {
  if (S.paused) return;
  for (const t of running()) for (const el of $$(`[data-el="${t.id}"]`)) el.textContent = dur(nowMs() - t.started);
  const e = $("[data-elapsed]"); if (e) e.textContent = elapsedMission();
}, 1000);

function openMenu(anchor, html, align = "end") {

  m.style.left = left + "px"; m.style.top = top + "px";
  m.querySelector(".mi")?.focus({ preventScroll: true });
}

/* ---------- toasts ---------- */
function toast({ icon = I.check, ok = true, title, sub = "", action, ms = 3800 }) {
  const t = document.createElement("div");
  t.className = "toast glass"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="tic ${ok ? "ok" : ""}">${icon}</span><div class="tt"><b>${esc(title)}</b>${sub ? `<small>${sub}</small>` : ""}</div>${action ? `<button class="b bg sm" type="button">${esc(action.label)}</button>` : ""}`;
  if (action) t.querySelector("button").onclick = () => { action.run(); dismiss(t); };
  $("#toasts").append(t);
  setTimeout(() => dismiss(t), ms);
}
function dismiss(t) { if (!t.isConnected) return; t.classList.add("out"); setTimeout(() => t.remove(), 200); }

/* ---------- actions ---------- */
function addAct(x) { ACT.unshift({ at: new Date(nowMs()), ...x }); S.freshAct = true; }
function startQueued() {
  if (running().length >= MISSION.machine.slots) return null;
  const q = TASKS.find((t) => t.state === "queue"); if (!q) return null;
  q.state = "run"; q.started = nowMs(); q.note = ""; q.log = (LOGS[q.id] || []).slice(0, 1); q.i = 1; S.fresh.add(q.id);
  return q;
}
function takeDecision(d, choiceText, viaPanel = false) {
  d.status = "taken"; d.by = "Walter"; d.choice = choiceText; d.date = new Date(nowMs());
  S.fresh.add(d.id);
  let sub = "Escrita em <code>docs/decisoes.md</code>.";
  const waiting = TASKS.find((t) => t.waitFor === d.id && t.state === "wait");
  if (waiting) {
    waiting.state = "queue"; waiting.note = "Destravada: começa quando abrir uma vaga"; waiting.waitFor = null;
    sub += ` “${esc(waiting.name)}” foi para a fila.`;
  }
  addAct({ node: "", icon: "chat", h: `Você decidiu: ${choiceText}`, wake: "você respondeu", n: `${d.title} Registrei em docs/decisoes.md${waiting ? ` e destravei “${waiting.name}”` : ""}.` });
  return sub;
}
function animateOut(el, cls, then) {
  if (!el || REDUCED) return then();
  el.classList.add(cls);
  setTimeout(then, 650);
}
function decideBlocking(id) {
  const d = D.find((x) => x.id === id), k = S.pick[id]; if (!d || !k) return;
  const opt = d.options.find((o) => o.k === k);
  const card = $(`[data-need="${id}"]`);
  if (card && !REDUCED) card.insertAdjacentHTML("beforeend", `<div class="stamp"><span class="ok">${I.check}</span>Tomada: ${esc(opt.t)}</div>`);
  setTimeout(() => animateOut(card, "taking", () => {
    const sub = takeDecision(d, opt.t);
    if (S.open?.id === id) S.open = null;
    render();
    toast({ title: "Decisão registrada", sub, action: { label: "Ver", run: () => { S.open = { kind: "dec", id }; render(); } } });
  }), REDUCED ? 0 : 450);
}
function approveProv(ids) {
  const rows = ids.map((id) => $(`[data-prow="${id}"]`)).filter(Boolean);
  rows.forEach((r, i) => setTimeout(() => r.classList.add("taking"), REDUCED ? 0 : i * 90));
  setTimeout(() => {
    for (const id of ids) { const d = D.find((x) => x.id === id); d.status = "taken"; d.by = "Walter"; d.date = new Date(nowMs()); S.fresh.add(id); }
    addAct({ node: "ok", icon: "check", h: ids.length > 1 ? `Você aprovou ${ids.length} decisões provisórias` : `Você aprovou: ${D.find((x) => x.id === ids[0]).title}`, wake: "você respondeu", n: "Registrei em docs/decisoes.md." });
    if (S.open && ids.includes(S.open.id)) S.open = null;
    render();
    toast({ title: ids.length > 1 ? `${ids.length} decisões aprovadas` : "Decisão aprovada", sub: "Escritas em <code>docs/decisoes.md</code>. Novas sessões já começam sabendo." });
  }, REDUCED ? 0 : 650 + ids.length * 90);
}
function approveGate() {
  const card = $("[data-gate]");
  if (card && !REDUCED) card.insertAdjacentHTML("beforeend", `<div class="stamp"><span class="ok">${I.check}</span>Portão ${S.cur + 1} aprovado</div>`);
  setTimeout(() => animateOut(card, "taking", () => {
    S.gates[S.cur] = "ok"; S.cur += 1;
    addAct({ node: "ok", icon: "flag", h: `Você aprovou o portão ${S.cur}`, wake: "você respondeu", n: "Fiz o merge do PR #431. A fase Base do app começou; o que eu tinha adiantado em branches entra na fila de revisão." });
    render();

}
function finishOne() {
  if (S.paused) return toast({ icon: I.pause, ok: false, title: "A missão está pausada", sub: "Retome para as tarefas andarem." });
  const t = running().sort((a, b) => a.started - b.started)[0];
  if (!t) return toast({ icon: I.queue, ok: false, title: "Nada rodando agora" });
  t.state = "done"; t.took = dur(nowMs() - t.started).replace(/:(\d+)$/, " min"); t.note = "Dev está revisando o que mudou…"; t.log.push(["okl", "✓ done"]);
  S.fresh.add(t.id);
  addAct({ node: "ok", icon: "check", h: `“${t.name}” terminou`, wake: "tarefa terminou", n: "Acordei para revisar o diff." });
  const q = startQueued();
  render();
  toast({ icon: I.sun, title: `“${t.name}” terminou`, sub: `Dev acordou para revisar.${q ? ` “${esc(q.name)}” pegou a vaga livre.` : ""}` });
  setTimeout(() => {
    t.note = "Revisado pelo Dev: pronto para o próximo portão"; t.pr = `#${434 + TASKS.indexOf(t)}`;
    addAct({ node: "", icon: "pr", h: `Revisei “${t.name}”`, n: `Testes passam e segue os tokens. Abri o PR como rascunho; ele entra no pacote do próximo portão.` });
    render();
  }, 2600);
}

    const rm = t.closest("[data-rm]"); if (rm) { f.phases.splice(+rm.dataset.rm, 1); draw(); return; }
    if (t.closest("[data-addph]")) { f.phases.push(`Fase ${f.phases.length + 1}`); draw(); return; }
    const pa = t.closest("[data-pick-agent]"); if (pa) { e.stopPropagation(); openMenu(pa, Object.keys(AGENTS).map((id) => `<button class="mi" type="button" role="menuitemradio" aria-checked="${f.agent === id}" data-set-agent="${id}">${avHTML(id, 22)}<span>${AGENTS[id].name}</span><span class="sub">${AGENTS[id].role}</span></button>`).join(""), "start"); menuEl.onclick = (ev) => { const b = ev.target.closest("[data-set-agent]"); if (b) { f.agent = b.dataset.setAgent; closeMenu(); draw(); } }; return; }
    const pm = t.closest("[data-pick-machine]"); if (pm) { e.stopPropagation(); openMenu(pm, [["MacBook do Walter", "online"], ["Mac mini do escritório", "offline"]].map(([n, s]) => `<button class="mi" type="button" role="menuitemradio" aria-checked="${f.machine === n}" data-set-machine="${n}">${I.laptop}<span>${n}</span><span class="sub">${s}</span></button>`).join("") + `<div class="msep"></div><button class="mi" type="button" data-set-machine="">${I.plus}<span>Conectar um computador</span></button>`, "start"); menuEl.onclick = (ev) => { const b = ev.target.closest("[data-set-machine]"); if (b) { if (b.dataset.setMachine) f.machine = b.dataset.setMachine; closeMenu(); draw(); } }; return; }
    const ph = t.closest("[data-pick-home]"); if (ph) { e.stopPropagation(); openMenu(ph, [["#produto", "canal"], ["#engenharia", "canal"], [`DM com ${AGENTS[f.agent].name}`, "conversa direta"]].map(([n, s2]) => `<button class="mi" type="button" role="menuitemradio" aria-checked="${f.home === n}" data-set-home="${esc(n)}">${n.startsWith("#") ? I.hash : I.chat}<span>${esc(n)}</span><span class="sub">${s2}</span></button>`).join(""), "start"); menuEl.onclick = (ev) => { const b = ev.target.closest("[data-set-home]"); if (b) { f.home = b.dataset.setHome; closeMenu(); draw(); } }; return; }
    if (t.closest("[data-create]")) { closeNew(); toast({ icon: I.flag, title: "Missão criada", sub: `Mora numa thread nova em ${esc(f.home)}. ${AGENTS[f.agent].name} está escrevendo o plano da fase 1 e te chama lá para aprovar.` }); }
  };
  document.body.append(dlg); draw(); $("#fg", dlg).focus();
}
function closeNew() { dlg?.remove(); dlg = null; closeMenu(); }

/* ---------- events ---------- */
function openTask(id, log = false) { S.open = S.open?.id === id && !log ? null : { kind: "task", id, log }; render(); }
function openDec(id) { S.open = S.open?.id === id ? null : { kind: "dec", id }; render(); }
function gotoDec(id) {
  S.open = null; render();
  const el = $(`[data-need="${id}"]`);
  if (el) { el.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "center" }); el.animate?.([{ boxShadow: "0 0 0 2px var(--ink)" }, { boxShadow: "0 0 0 0 transparent" }], { duration: 1200 }); }
  else { S.open = { kind: "dec", id }; render(); }
}
document.addEventListener("click", (e) => {
  if (dlg && dlg.contains(e.target)) return;
  const t = e.target;
  if (menuEl && !menuEl.contains(t) && !t.closest("[data-more]")) closeMenu();
  if (menuEl && menuEl.contains(t)) {
    const m = t.closest("[data-m]"); if (!m) return; closeMenu();
    const k = m.dataset.m;
    if (k === "new") return openNew();
    if (k === "edit") return toast({ icon: I.edit, ok: false, title: "Editar a missão", sub: "Mudar objetivo ou fases vira uma decisão registrada." });
    if (k === "machine") return toast({ icon: I.laptop, ok: false, title: "Trocar computador", sub: "As tarefas rodando terminam antes da troca." });
    if (k === "archive") return toast({ icon: I.archive, ok: false, title: "Encerrar missão", sub: "Pede confirmação; branches e decisões ficam no repositório." });
    return;
  }
  const p = t.closest("[data-proto]");
  if (p) { if (p.dataset.proto === "finish") finishOne(); if (p.dataset.proto === "new") openNew(); return; }
  const pk = t.closest("[data-pick]");
  if (pk) {
    S.pick[pk.dataset.pick] = pk.dataset.k;
    const card = pk.closest("[data-need]");
    if (card && !pk.closest(".panel")) {
      // Update in place so the card does not jump.
      for (const o of $$("[data-pick].opt", card)) o.setAttribute("aria-checked", o.dataset.k === pk.dataset.k);
      const d = D.find((x) => x.id === pk.dataset.pick), btn = $("[data-decide]", card);
      btn.disabled = false; btn.innerHTML = `${I.check}Decidir: ${esc(d.options.find((o) => o.k === pk.dataset.k).t)}`;
      if (S.open?.id === d.id) renderPanel();
    } else render();
    return;
  }
  const dc = t.closest("[data-decide]"); if (dc) return decideBlocking(dc.dataset.decide);
  const pd = t.closest("[data-panel-decide]");
  if (pd) {
    const d = D.find((x) => x.id === pd.dataset.panelDecide), k = S.pick[d.id] ?? "cur";
    if (d.options) { S.pick[d.id] = k; S.open = null; render(); return decideBlocking(d.id); }
    if (k === "cur") { S.open = null; render(); return approveProv([d.id]); }
    const choice = d.alt[+k.replace("alt", "")];
    d.title = `${choice} (em vez de ${d.choice})`; S.open = null;
    const sub = takeDecision(d, choice);
    render(); return toast({ title: "Decisão mudada", sub: `${sub} Dev ajusta o que já tinha feito.` });
  }
  const ap = t.closest("[data-approve]"); if (ap) return approveProv([ap.dataset.approve]);
  if (t.closest("[data-approve-all]")) return approveProv(provs().map((d) => d.id));
  if (t.closest("[data-gate-ok]")) return approveGate();
  if (t.closest("[data-adj]")) { S.adjusting = true; render(); $("#adj")?.focus(); return; }
  if (t.closest("[data-adj-cancel]")) { S.adjusting = false; render(); return; }
  if (t.closest("[data-adj-send]")) {
    S.adjusting = false; S.gates[S.cur] = "adjust";
    addAct({ node: "", icon: "edit", h: "Você pediu ajustes nos protótipos", wake: "você respondeu", n: S.adjText.trim() ? `“${S.adjText.trim()}” Vou refazer e trago um pacote novo.` : "Vou refazer e trago um pacote novo." });
    S.adjText = ""; render();
    toast({ icon: I.edit, title: "Ajustes enviados", sub: "Dev volta com um pacote novo neste portão." });
    setTimeout(() => { S.gates[S.cur] = "wait"; addAct({ node: "ok", icon: "flag", h: "Pacote novo pronto", wake: "tarefa terminou", n: "Ajustei os protótipos e atualizei o PR #431." }); render(); toast({ icon: I.flag, title: "Protótipos ajustados", sub: "O portão está esperando você de novo." }); }, 6000);
    return;
  }
  if (t.closest("[data-pause]")) {
    S.paused = !S.paused; render();
    return toast(S.paused ? { icon: I.pause, ok: false, title: "Missão pausada", sub: "As tarefas param no próximo passo seguro. Nada é perdido.", action: { label: "Desfazer", run: () => { S.paused = false; render(); } } } : { icon: I.play, title: "Missão retomada", sub: `${running().length} tarefas continuam de onde pararam.` });
  }
  const mo = t.closest("[data-more]"); if (mo) return menuEl ? closeMenu() : openMenu(mo, moreMenu());
  const rt = t.closest("[data-retry]");
  if (rt) { const x = TASKS.find((y) => y.id === rt.dataset.retry); x.state = "queue"; x.note = "Na fila: Dev vai tentar com um development build"; x.took = null; S.fresh.add(x.id); const q = startQueued(); render(); return toast({ icon: I.refresh, title: "Tentando de novo", sub: q ? `“${esc(q.name)}” começou.` : "Entra quando abrir uma vaga na máquina." }); }
  const stp = t.closest("[data-stop]");
  if (stp) { const x = TASKS.find((y) => y.id === stp.dataset.stop); x.state = "queue"; x.note = "Parada por você; volta para a fila"; S.fresh.add(x.id); const q = startQueued(); render(); return toast({ icon: I.stop, ok: false, title: `“${x.name}” parada`, sub: `O worktree fica como está.${q ? ` “${esc(q.name)}” pegou o slot.` : ""}` }); }
  const lg = t.closest("[data-log]"); if (lg) return openTask(lg.dataset.log, true);
  const gd = t.closest("[data-goto-dec]"); if (gd) return gotoDec(gd.dataset.gotoDec);
  if (t.closest("[data-goto-gate]")) { $("[data-gate]")?.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "center" }); return; }
  const sc = t.closest("[data-scroll]"); if (sc) { $("#" + sc.dataset.scroll)?.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" }); return; }
  const od = t.closest("[data-open-dec]"); if (od) return openDec(od.dataset.openDec);
  const prl = t.closest("[data-prlink]"); if (prl) return toast({ icon: I.pr, ok: false, title: `Abre o PR ${prl.dataset.prlink} no GitHub` });
  if (t.closest("[data-plog]") && S.open) { S.open.log = !S.open.log; render(); return; }
  if (t.closest("[data-pmore]") && S.open) { S.open.more = !S.open.more; render(); return; }
  const tk = t.closest("[data-task]"); if (tk) return openTask(tk.dataset.task);
  const ph = t.closest("[data-phase]"); if (ph) { const i = +ph.dataset.phase; S.decPhase = S.decPhase === i ? null : i; render(); if (S.decPhase != null) $("#decs").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" }); return; }
  if (t.closest("[data-phase-clear]")) { S.decPhase = null; render(); return; }
  const df = t.closest("[data-dfilter]"); if (df) { S.decFilter = df.dataset.dfilter; render(); return; }
  const ar = t.closest("[data-art]"); if (ar) { const a = ARTS.find((x) => x.id === ar.dataset.art); return toast({ icon: a.kind === "pr" ? I.pr : a.kind === "qr" ? I.qr : I.open, ok: false, title: `${a.t}`, sub: a.kind === "qr" ? "Abre no Expo Go: aponte a câmera do celular." : "Abre no Drive, com a fase e a decisão ligadas." }); }
  const ts = t.closest("[data-toast]"); if (ts) return toast({ icon: I.open, ok: false, title: ts.dataset.toast });
  if (t.closest("[data-close]") || t.id === "scrim") { S.open = null; render(); return; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (menuEl) return closeMenu(); if (dlg) return closeNew(); if (S.open) { S.open = null; render(); } return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("row")) { e.preventDefault(); e.target.click(); }
});

/* ---------- theme ---------- */
function seg(el, value, on) {
  const pill = el.querySelector(".pill");
  const place = () => { const b = el.querySelector(`[data-v="${value}"]`); if (!b) return; pill.style.width = b.offsetWidth + "px"; pill.style.transform = `translateX(${b.offsetLeft}px)`; for (const x of el.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
  el.onclick = (e) => { const b = e.target.closest("button"); if (!b) return; value = b.dataset.v; place(); on(value); };
  requestAnimationFrame(place);
}
seg($("#theme"), document.documentElement.dataset.theme, (v) => { document.documentElement.dataset.theme = v; varCache = {}; render(); });

$("#logo").append(makeAgent("theo", 30));
render();
</script>
</body>
