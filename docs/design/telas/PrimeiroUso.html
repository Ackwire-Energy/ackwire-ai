<style>
/*
  Prototype: "as easy as Grok Bot", pé no chão: only what the product does today, simplified, plus a few
  SMALL changes on top of the existing backend. Each small change is tagged "novo (pequeno)" in the
  prototype bar (second row), never in the product UI.

  1. Primeiro uso (replaces OnboardingV2.html, 7 steps). Sign in → name the team → we create the first
     agent ourselves and open its conversation → the agent offers 3 first jobs → one runs in front of you
     → the agent offers a routine.
  2. Agente novo por uma frase (replaces NovoAgente.html, 7 steps). One question; the sentence becomes the
     agent's instructions; the name and a role preset are suggested from it; everything else is today's
     wizard, closed under "Avançado". "Criar" opens its conversation.

  EXISTS today (reused as is):
    - Sign in with Google, Apple or e-mail + password (Better Auth). Org creation with a name.
    - Agents: name, look (engine allow-list), instructions, role presets (Dev, Ops, QA, PM, Do zero) with
      their connector levels and model, connector levels (sem acesso / consulta / consulta e muda), brain
      (API, Claude Code, Codex), computer (cloud or a connected one), channels, owner, monthly budget.
      The wizard already has a live preview.
    - Platform key (shared, no credit metering): an agent with no credential runs on it.
    - DMs with an agent; attach files in the composer (web and phone); files become artifacts in the Drive;
      the agent reads them and saves a result with create_artifact.
    - ask_user with choice buttons (web). Tool steps shown while a run works.
    - Catalog connectors GitHub, Sentry, Linear, Drive (org connects once in Conectores; levels per agent).
      GitHub PR comments through the connector. Merge, deploy and rollback always ask for approval.
    - Issues created by the agent (create_issue). Routines via create_routine: schedule, once, or events
      (GitHub PR, issue created, Sentry, deploy); results posted to the DM.
    - Company context, OpenMausBot/OpenBot import, invitations: all exist, now only in Configurações.
  NOVO (PEQUENO):
    - First agent created automatically (name and look drawn) with the internal scopes (Drive, Issues,
      Rotinas, computador na nuvem), and its DM opened. Today onboarding requires choosing agents.
    - The first agent's opening message with 3 first jobs (an ask_user right after creation).
    - Team name prefilled from the e-mail domain.
    - Phone: the same short first use (today mobile has no onboarding) and ask_user choices in the chat.
    - Two dismissible hints at the end of the first conversation (invite people, new agent).
    - New agent: role preset picked from the sentence (keywords or the cheap router model), name suggested
      (the preset's default name, or a drawn one), DM opened after "Criar" with a greeting.
  NOT here on purpose: browser, screen or computer use; voice; charts; share extension; credit amounts;
  web search (there is no web search tool); Gmail (not in the catalog).

  The second row of the prototype bar ("Antes → agora") says where each of today's settings went.
  It is prototype-only, never product.

  Views and deep links (#view=…&step=…):
    #view=first   &step=entrar|time|nascendo|ola|tarefa|trabalhando|resultado|rotina
                  &task=doc|code|notes            (which suggestion was picked; default doc)
                  &mail=company|gmail             (team name from the domain, or "Time da Marina")
                  &agent=0..3                     (which generated agent)
    #view=new     &step=vazio|frase|avancado|criado
    Everywhere:   &device=web|phone   &theme=light|dark
  Clicking through works: from "entrar" the flow advances by itself (the working step finishes alone).

  Web uses Onest; the phone frame (390 × 844) uses the system font at native sizes (body 17), like the app.
  Agents come only from packages/ui/src/agent/engine.js; brains and computers from packages/ui/src/brain
  and packages/ui/src/computer portraits (serve the repo root over http). Mono only for code.
*/
:root{
  --bg:#f4f4f1;--raised:#fff;--sunken:#ebebe7;--glass:rgba(255,255,255,.72);--line:rgba(23,23,22,.08);--line2:rgba(23,23,22,.14);
  --ink:#151514;--ink2:#2a2a28;--muted:#5c5c58;--faint:#76766f;--plate:rgba(127,127,127,.1);
  --ok:#1f7a45;--ok-soft:#e3f2e8;--warn:#9a5b00;--warn-soft:#fbeed5;--danger:#b4352b;--danger-soft:#fbe6e3;
  --agent:#0063d1;--agent-soft:#e3eefd;
  --e1:0 1px 1px rgba(23,23,22,.04),0 2px 4px -1px rgba(23,23,22,.05),0 0 0 1px var(--line);
  --e2:0 1px 1px rgba(23,23,22,.04),0 8px 20px -6px rgba(23,23,22,.12),0 0 0 1px var(--line);
  --e3:0 2px 4px rgba(23,23,22,.04),0 24px 56px -16px rgba(23,23,22,.30),0 0 0 1px var(--line2);
  --top:inset 0 1px 0 rgba(255,255,255,.9);
  --spring:cubic-bezier(.34,1.4,.5,1);--out:cubic-bezier(.2,.8,.2,1);
  --sky-ink:#04203f;--sky-ink2:rgba(4,32,63,.74);--sky-glass:rgba(241,248,255,.78);--sky-line:rgba(4,32,63,.12);
  --sans:"Onest",system-ui,sans-serif;--display:"Funnel Display",var(--sans);--dot:"Doto",monospace;--mono:"Martian Mono",ui-monospace,monospace;color-scheme:light;
  --frame:#1b1b1a;
}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--raised:#191918;--sunken:#0a0a09;--glass:rgba(30,30,28,.72);--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --ink:#efefec;--ink2:#d6d6d2;--muted:#a3a39e;--faint:#8b8b85;--plate:rgba(127,127,127,.14);
  --ok:#5fc48a;--ok-soft:#14281c;--warn:#e0a84a;--warn-soft:#33260e;--danger:#ef7c70;--danger-soft:#3a1714;
  --agent:#5aa8ff;--agent-soft:#11253f;
  --e1:0 1px 2px rgba(0,0,0,.5),0 0 0 1px var(--line);--e2:0 8px 20px -6px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --e3:0 28px 64px -16px rgba(0,0,0,.8),0 0 0 1px var(--line2);--top:inset 0 1px 0 rgba(255,255,255,.06);color-scheme:dark;
  --frame:#000;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";overflow-x:hidden}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
svg.i.lg{width:20px;height:20px}
canvas.av{display:block;flex:none}
canvas.orbit{display:inline-block;flex:none;image-rendering:pixelated;vertical-align:middle}
canvas.port{display:block;flex:none;image-rendering:pixelated}
:focus-visible{outline:2px solid #3d8bff;outline-offset:2px}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes blinkc{50%{opacity:0}}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- Prototype bar (not product) ---------- */
.pbar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pbar .r1{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 16px}
.pbar .lbl{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.pbar .grow{flex:1}
.views{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.views::-webkit-scrollbar{display:none}
.stp{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 6px;border-radius:999px;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none;transition:background .15s,color .15s}
.stp .n{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:var(--sunken);color:var(--faint)}
.stp:hover{background:var(--plate);color:var(--ink)}
.stp[aria-current="step"]{background:var(--raised);box-shadow:var(--e1),var(--top);color:var(--ink)}
.stp[aria-current="step"] .n{background:var(--ink);color:var(--bg)}
.pbar .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pbar .r2{display:flex;gap:10px;align-items:flex-start;padding:7px 16px 8px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.45}
.pbar .r2 .tg{flex:none;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding-top:1px}
.pbar .r2 .bf{color:var(--faint);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--faint) 50%,transparent)}
.pbar .r2 .nw{color:var(--ink2)}
.pbar .r2 .ar{color:var(--faint);padding:0 4px}
.pbar .r2 .nv{display:block;margin-top:3px;color:var(--ink2)}
.pbar .r2 .nv b{display:inline-flex;align-items:center;height:18px;padding:0 7px;margin-right:7px;border-radius:999px;font-size:10.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .18s var(--spring)}
.iconbtn:hover{background:var(--plate);color:var(--ink)}
.iconbtn:active{transform:scale(.94)}

/* ---------- Controls (design system v2) ---------- */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;letter-spacing:-.005em;background:var(--raised);box-shadow:var(--e1),var(--top);white-space:nowrap;transition:transform .18s var(--spring),box-shadow .18s var(--out),filter .15s,background .15s,color .15s,opacity .15s}
.btn:hover{box-shadow:var(--e2),var(--top)}
.btn:active{transform:scale(.97) translateY(.5px)}
.btn.primary{color:var(--bg);background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 82%,var(--bg)),var(--ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.18),0 6px 14px -6px rgba(0,0,0,.45)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-disabled="true"]{opacity:.42;cursor:default;transform:none;filter:none}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--plate);color:var(--ink)}
.btn.lg{height:48px;padding:0 20px;font-size:15px;border-radius:14px}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px;gap:6px}
.btn.wide{width:100%}
.card{background:var(--raised);border-radius:20px;box-shadow:var(--e1),var(--top);padding:18px;min-width:0}
.help{color:var(--muted);font-size:12.5px}
.faint{color:var(--faint)}
.input{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:13px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .15s}
.input:focus-within{box-shadow:inset 0 0 0 1px var(--line2),0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.input input{all:unset;flex:1;min-width:0;height:100%}
.input.big{height:56px;font-size:18px;border-radius:15px;padding:0 16px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;max-width:100%}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.busy{background:var(--agent-soft);color:var(--agent)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);position:relative;flex:none;max-width:100%;flex-wrap:nowrap}
.seg button{all:unset;position:relative;z-index:1;cursor:pointer;height:30px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button:hover{color:var(--ink)}
.seg .pill{position:absolute;top:0;left:0;height:30px;border-radius:9px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:transform .32s var(--spring),width .32s var(--spring)}
.seg.xs button{height:24px;padding:0 9px;font-size:12px}
.seg.xs .pill{height:24px}
.seg.sm button{height:28px;padding:0 11px;font-size:12.5px}
.seg.sm .pill{height:28px}
.tog{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 9px;border-radius:999px;font-weight:600;font-size:12.5px;background:var(--raised);color:var(--muted);box-shadow:var(--e1),var(--top);transition:transform .18s var(--spring),color .15s,box-shadow .15s;flex:none}
.tog:hover{color:var(--ink)}
.tog:active{transform:scale(.96)}
.tog .box{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line2)}
.tog .box svg{width:11px;height:11px;stroke-width:2.6;opacity:0}
.tog[aria-pressed="true"]{color:var(--ink);box-shadow:0 0 0 1.5px var(--ink),var(--top)}
.tog[aria-pressed="true"] .box{background:var(--ink);color:var(--bg);box-shadow:none}
.tog[aria-pressed="true"] .box svg{opacity:1}
.tile{width:34px;height:34px;border-radius:11px 11px 11px 4px;display:grid;place-items:center;flex:none;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);font-weight:700;font-size:13px}
.pa{width:34px;height:34px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-weight:650;font-size:13px;background:linear-gradient(160deg,#e9e9e5,#d9d9d4);color:#2a2a28}
:root[data-theme="dark"] .pa{background:linear-gradient(160deg,#3a3a37,#2a2a28);color:#efefec}
.pa.sm{width:22px;height:22px;font-size:10px}
.eyebrow{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dot{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600}
.shimmer{background:linear-gradient(90deg,var(--faint) 0%,var(--ink2) 50%,var(--faint) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:300;font-size:20px;letter-spacing:-.02em}
.brand i{font-style:normal;font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:.62em;color:var(--muted)}
code{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:6px;background:var(--sunken);color:var(--ink2)}
.toast{position:fixed;left:50%;top:96px;transform:translate(-50%,-20px);opacity:0;z-index:80;display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13.5px;box-shadow:var(--e3);transition:transform .35s var(--spring),opacity .2s;pointer-events:none;max-width:calc(100vw - 24px)}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ---------- Stage: web fills the page; phone is a 390 × 844 frame ---------- */
#stage{min-height:calc(100vh - var(--pbh,90px))}
.devwrap{display:flex;justify-content:center;padding:28px 16px 60px}
.device{width:390px;height:844px;border-radius:56px;padding:12px;background:var(--frame);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 30px 80px -24px rgba(0,0,0,.45);flex:none;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:40}
.sbar{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-weight:600;font-size:16px;position:relative;z-index:30}
.sbar .ic{display:flex;gap:6px;align-items:center}
.sbar .bat{width:25px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.2px currentColor;position:relative;opacity:.9}
.sbar .bat::after{content:"";position:absolute;inset:2.5px 6px 2.5px 2.5px;border-radius:2px;background:currentColor}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:40}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}

/* Phone type: the system font at native sizes (body 17), like the mobile app. */
.ph{--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;font-family:var(--sans);font-size:17px;line-height:1.35;letter-spacing:-.01em}
.ph .btn{font-size:17px;height:50px;border-radius:14px}
.ph .btn.sm{font-size:15px;height:36px;border-radius:11px;padding:0 14px}
.ph .help{font-size:13px}
.ph .chip{font-size:13px;height:26px}
.ph .input{height:50px;font-size:17px}
.ph .input.big{height:56px;font-size:19px}
.ph .bigt{font-family:var(--sans);font-weight:700;font-size:34px;letter-spacing:.005em;line-height:1.12}

/* ---------- Auth (sign in, team name) ---------- */
.auth{position:relative;min-height:calc(100vh - var(--pbh,90px));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px 34vh;isolation:isolate;overflow:hidden}
.auth canvas.sky{position:absolute;left:0;right:0;bottom:0;width:100%;height:42%;image-rendering:pixelated;z-index:-1;pointer-events:none}
.auth .box{width:min(420px,100%);display:flex;flex-direction:column;gap:22px;animation:fi .35s var(--out) both}
.auth .mark{display:flex;align-items:center;gap:10px}
.bigt{font-family:var(--display);font-weight:300;font-size:46px;letter-spacing:-.035em;line-height:1.02}
.auth .lead{color:var(--muted);font-size:15.5px;margin-top:-8px}
.auth .opts{display:flex;flex-direction:column;gap:10px}
.auth .or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);font-weight:600}
.auth .or::before,.auth .or::after{content:"";flex:1;height:1px;background:var(--line2)}
.auth .legal{font-size:12px;color:var(--faint);text-align:center}
.auth .stepn{display:flex;align-items:center;gap:8px}
.gl{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line2);font-size:11px;font-weight:700;color:var(--ink2)}
.ph .auth{min-height:0;height:100%;padding:24px 20px 0;justify-content:flex-start}
.ph .auth canvas.sky{height:24%}
.ph .auth .box{gap:20px;flex:1}
.ph .auth .lead{font-size:17px;margin-top:-6px}
.ph .auth .push{margin-top:auto;padding-bottom:150px;display:flex;flex-direction:column;gap:10px}

/* ---------- The agent being born (on its own sky) ---------- */
.born{position:relative;min-height:calc(100vh - var(--pbh,90px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:40px 16px;isolation:isolate;overflow:hidden;text-align:center}
.born canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
.born .say{display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--sky-ink);animation:fi .4s var(--out) both;padding:18px 26px 20px;border-radius:24px;background:var(--sky-glass);box-shadow:0 0 0 1px var(--sky-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:520px}
.born .say .bigt{color:var(--sky-ink)}
.born .say p{color:var(--sky-ink2);font-size:15.5px;max-width:40ch}
.born .glassrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.born .btn.glass{background:var(--sky-glass);color:var(--sky-ink);box-shadow:0 0 0 1px var(--sky-line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.born .btn.ink{color:#fff;background:linear-gradient(180deg,#0b3566,#04203f);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 18px -8px rgba(4,32,63,.6)}
.born .status{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:4px 12px 4px 10px;border-radius:999px;font-size:13px;font-weight:650;color:var(--sky-ink);background:var(--sky-glass);box-shadow:0 0 0 1px var(--sky-line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ph .born{min-height:0;height:100%;padding:24px 20px 44px}
.ph .born .say p{font-size:17px}

/* ---------- App shell (web): sidebar | page ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - var(--pbh,90px))}
.side{position:sticky;top:var(--pbh,90px);height:calc(100vh - var(--pbh,90px));overflow:hidden;padding:16px 12px;display:flex;flex-direction:column;gap:12px;background:var(--sunken);border-right:1px solid var(--line);isolation:isolate}
.side canvas.sky{position:absolute;inset:auto 0 0 0;width:100%;height:20%;image-rendering:pixelated;pointer-events:none;z-index:-1}
.ws{display:flex;align-items:center;gap:9px;padding:4px 6px}
.ws .wl{width:28px;height:28px;border-radius:9px 9px 9px 3px;display:grid;place-items:center;background:var(--raised);box-shadow:var(--e1),var(--top);font-weight:700;font-size:12px}
.ws b{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:9px;height:32px;padding:0 8px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;font-size:13.5px;cursor:pointer}
.nav a:hover{background:var(--plate);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--e1),var(--top);font-weight:600}
.nav .agent-slot{width:18px;height:18px;display:grid;place-items:center;flex:none}
.nav a.add{color:var(--faint)}

/* ---------- Chat ---------- */
.thread{min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - var(--pbh,90px))}
.th{position:sticky;top:var(--pbh,90px);z-index:10;padding:12px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--line)}
.th-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px}
.th h1{font-family:var(--display);font-weight:300;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.th .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.feed{flex:1;width:100%;max-width:820px;margin:0 auto;padding:18px 24px 24px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:14px;padding:10px 12px;border-radius:14px;animation:fi .35s var(--out) both;min-width:0}
.msg .mav{width:34px;flex:none;display:flex;justify-content:center;padding-top:2px}
.mb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mn{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.mr{font-size:12px;color:var(--faint)}
.mx{font-size:15px;line-height:1.62;color:var(--ink2);overflow-wrap:anywhere}
.mx b{color:var(--ink);font-weight:650}
.mx p + p{margin-top:6px}
.gap{display:flex;align-items:center;gap:10px;margin:8px 12px;font-size:12px;color:var(--faint);font-weight:600}
.gap::before,.gap::after{content:"";flex:1;height:1px;background:var(--line)}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sug{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:9px;min-height:40px;padding:8px 14px 8px 10px;border-radius:14px;background:var(--raised);box-shadow:var(--e1),var(--top);font-weight:600;font-size:14px;transition:transform .18s var(--spring),box-shadow .18s}
.sug:hover{box-shadow:var(--e2),var(--top);transform:translateY(-1px)}
.sug:active{transform:scale(.97)}
.sug .gi{width:26px;height:26px;border-radius:8px 8px 8px 3px;display:grid;place-items:center;background:var(--sunken);color:var(--ink2)}
.sug[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--ink),var(--top)}
.sugs.used .sug:not([aria-pressed="true"]){opacity:.45}
.ask{margin-top:10px;border-radius:20px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:560px;overflow:hidden;animation:popin .3s var(--spring) both}
.ask-h{display:flex;align-items:center;gap:12px;padding:14px 14px 0}
.ask-h .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ask-h b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.ask-h small{color:var(--muted);font-size:12.5px}
.ask-b{padding:12px 14px 0;display:flex;flex-direction:column;gap:10px}
.ask-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px 14px;margin-top:12px;border-top:1px solid var(--line)}
.ask-f .hint{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-right:auto;min-width:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 14px;border-radius:16px;background:var(--sunken);box-shadow:inset 0 0 0 1.5px var(--line2);text-align:center;color:var(--muted);font-size:13.5px}
.drop b{color:var(--ink);font-weight:650}
.drop svg{color:var(--faint)}
.file{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:100%;margin-top:6px}
.file .tile{width:36px;height:36px}
.file .t{display:flex;flex-direction:column;min-width:0}
.file b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file small{color:var(--muted);font-size:12px}
.file .btn{margin-left:10px}
.me .mx{color:var(--ink)}
.work{margin-top:8px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:560px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.work .wh{display:flex;align-items:center;gap:10px;min-width:0}
.work .wh .tx{flex:1;min-width:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work .wh .tm{font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:13px;color:var(--muted)}
.work ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.work li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.work li.done{color:var(--ink2)}
.work li.done svg{color:var(--ok)}
.work li.todo{color:var(--faint)}
.work li .sl{width:16px;height:16px;display:grid;place-items:center;flex:none}
.work .bar{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.work .bar i{display:block;height:100%;background:var(--ink2);border-radius:2px;transition:width .5s var(--out)}
.res{margin-top:4px;display:flex;flex-direction:column;gap:9px;max-width:620px}
.res h3{font-weight:650;font-size:15px;letter-spacing:-.01em}
.res ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:b}
.res li{position:relative;padding-left:28px;font-size:15px;line-height:1.55;color:var(--ink2);counter-increment:b}
.res li::before{content:counter(b);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:7px 7px 7px 3px;display:grid;place-items:center;background:var(--sunken);font-family:var(--dot);font-variation-settings:"ROND" 100;font-weight:600;font-size:12px;color:var(--muted)}
.cite{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:650;background:var(--sunken);color:var(--muted);vertical-align:1px;margin-left:4px;white-space:nowrap;transition:background .15s,color .15s}
.cite:hover,.cite[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.cite.mono{font-family:var(--mono);font-size:10.5px;font-weight:400}
.quote{display:block;margin-top:6px;padding:8px 12px;border-radius:12px;background:var(--plate);font-size:13px;color:var(--muted);line-height:1.5;animation:popin .2s var(--spring) both}
.quote b{color:var(--ink2);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.done-card{margin-top:10px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);max-width:560px;animation:popin .3s var(--spring) both}
.done-card .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.done-card b{font-weight:650;font-size:14px}
.done-card small{font-size:12.5px;color:var(--muted)}
.invite{margin:14px 12px 4px 60px;display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line2);max-width:560px;animation:fi .4s var(--out) both}
.invite .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.invite b{font-weight:650;font-size:14px}
.invite p{color:var(--muted);font-size:13px}
.invite .acts{margin-top:8px}
.hintline{margin:10px 12px 0 60px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);animation:fi .4s var(--out) both}
.composer{max-width:772px;width:calc(100% - 48px);margin:0 auto 18px;border-radius:18px;background:var(--raised);box-shadow:var(--e2),var(--top);display:flex;align-items:center;gap:6px;padding:8px 8px 8px 8px;color:var(--faint);position:sticky;bottom:14px}
.composer span.ph-t{flex:1;font-size:14.5px;padding-left:4px}
.composer .send{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--sunken);color:var(--faint)}
.composer .send.on{all:unset;cursor:pointer;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.composer .ph-t.draft,.pcomp .fld.draft{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nudge{position:relative;color:var(--ink) !important;background:var(--plate)}
.nudge::after{content:"";position:absolute;inset:-4px;border-radius:inherit;box-shadow:0 0 0 2px var(--agent);opacity:.7;animation:nudge 1.6s var(--out) infinite;pointer-events:none}
@keyframes nudge{0%{opacity:.8;transform:scale(.92)}70%{opacity:0;transform:scale(1.18)}100%{opacity:0}}
.res .ref{font-size:12.5px;color:var(--faint);white-space:nowrap}

/* Phone chat: native header, no sidebar, bigger type. */
.nh{flex:none;display:flex;align-items:center;gap:8px;padding:2px 12px 10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:relative;z-index:5}
.nh .back{all:unset;cursor:pointer;display:flex;align-items:center;color:var(--ink);width:56px}
.nh .back svg{width:24px;height:24px;stroke-width:2}
.nh .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.nh .mid b{font-size:15px;font-weight:600}
.nh .mid small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.nh .end{width:56px;display:flex;justify-content:flex-end;color:var(--ink)}
.ph .feed{padding:10px 6px 18px;max-width:none}
.ph .msg{gap:10px;padding:8px 8px}
.ph .msg .mav{width:30px}
.ph .mn{font-size:15px}
.ph .mr{font-size:12px}
.ph .mx{font-size:17px;line-height:1.42}
.ph .res li{font-size:16px;line-height:1.45}
.ph .res h3{font-size:17px}
.ph .sug{font-size:16px;min-height:44px;width:100%}
.ph .sugs{flex-direction:column;gap:8px}
.ph .ask,.ph .work,.ph .done-card{border-radius:18px}
.ph .ask-h b,.ph .done-card b{font-size:16px}
.ph .ask-h small,.ph .done-card small,.ph .ask-f .hint{font-size:13px}
.ph .ask-f .hint{flex-basis:100%;margin-right:0}
.ph .ask-f .btn{flex:1}
.ph .work .wh .tx{font-size:15px}
.ph .work li{font-size:14px}
.ph .cite{font-size:12px;height:22px}
.ph .invite{margin:12px 8px 4px 48px}
.ph .invite b{font-size:16px}
.ph .invite p{font-size:14px}
.ph .hintline{margin:10px 8px 0 48px;font-size:14px}
.ph .gap{font-size:12px}
.ph .choice .btn{flex:1 1 auto}
.pcomp{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 30px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent)}
.pcomp .plus{all:unset;box-sizing:border-box;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);color:var(--muted);flex:none}
.pcomp .psend{all:unset;cursor:pointer;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);flex:none}
.pcomp .fld{flex:1;height:38px;border-radius:19px;box-shadow:inset 0 0 0 1px var(--line2);display:flex;align-items:center;padding:0 14px;color:var(--faint);font-size:17px}

/* ---------- New agent by one sentence ---------- */
.np{display:flex;justify-content:center;padding:0 clamp(16px,3vw,36px) 120px}
.np .wrap{width:100%;max-width:1060px}
.np .topbar{display:flex;align-items:center;gap:6px;height:58px;color:var(--muted);font-size:13.5px}
.np .topbar b{color:var(--ink);font-weight:600}
.ngrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;margin-top:8px}
.nform{display:flex;flex-direction:column;gap:20px;min-width:0}
.nform h1{font-family:var(--display);font-weight:300;font-size:44px;letter-spacing:-.035em;line-height:1.02}
.q{display:flex;flex-direction:column;gap:10px}
.q label{font-weight:650;font-size:17px;letter-spacing:-.01em}
.ta{border-radius:18px;background:var(--raised);box-shadow:var(--e1),var(--top);padding:4px;transition:box-shadow .15s}
.ta:focus-within{box-shadow:0 0 0 1.5px var(--ink),var(--top)}
.ta textarea{all:unset;box-sizing:border-box;display:block;width:100%;min-height:104px;padding:14px 16px;font-size:19px;line-height:1.45;letter-spacing:-.01em;resize:none;white-space:pre-wrap}
.ta textarea::placeholder{color:var(--faint)}
.ta .tb{display:flex;align-items:center;gap:8px;padding:4px 8px 6px 14px;color:var(--faint);font-size:12.5px}
.ta .tb .grow{flex:1}
.exs{display:flex;flex-wrap:wrap;gap:6px}
.ex{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 9px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--line2);font-size:13px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.ex:hover{background:var(--plate);color:var(--ink)}
.nm{display:flex;flex-direction:column;gap:8px;max-width:360px}
.nm label{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:baseline}
.nm label span{font-weight:500;color:var(--faint);font-size:12.5px}
.adv{border-radius:20px;box-shadow:inset 0 0 0 1px var(--line2);overflow:hidden}
.adv-h{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px}
.adv-h .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.adv-h b{font-weight:650;font-size:14.5px}
.adv-h small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adv-h .chev{transition:transform .25s var(--spring);color:var(--muted)}
.adv[data-open="1"] .adv-h .chev{transform:rotate(180deg)}
.adv-b{display:none;padding:4px 16px 18px;flex-direction:column;gap:22px;border-top:1px solid var(--line)}
.adv[data-open="1"] .adv-b{display:flex;animation:fi .3s var(--out) both}
.sec{display:flex;flex-direction:column;gap:10px;padding-top:14px}
.sec .sh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec .sh b{font-weight:650;font-size:14px}
.sec .sh span{font-size:12.5px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--raised);box-shadow:var(--e1),var(--top);transition:box-shadow .15s,transform .18s var(--spring);min-width:0}
.opt:hover{box-shadow:var(--e2),var(--top)}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--ink),var(--top)}
.opt .ot{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.opt b{font-weight:650;font-size:13.5px}
.opt small{font-size:12px;color:var(--muted);line-height:1.4}
.opt .tag{font-size:11px;font-weight:650;height:20px;padding:0 7px;border-radius:999px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;white-space:nowrap}
.opt .auto{width:48px;height:48px;border-radius:14px 14px 14px 5px;display:grid;place-items:center;background:var(--sunken);color:var(--ink2)}
.opt .auto svg{width:22px;height:22px}
.opt.dim{opacity:.55}
.opts.roles{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.lv{display:flex;flex-direction:column}
.lv .r{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lv .r:first-child{border-top:0;padding-top:2px}
.lv .r .t{flex:1 1 160px;min-width:0;display:flex;flex-direction:column}
.lv .r b{font-weight:600;font-size:13.5px}
.lv .r small{font-size:12px;color:var(--muted)}
.nfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}
.nfoot .help{margin-right:auto}

/* Live preview: the agent on its own sky, and what it inferred. */
.pv{position:sticky;top:110px;border-radius:24px;background:var(--raised);box-shadow:var(--e2),var(--top);overflow:hidden;min-width:0}
.pv .cv{position:relative;height:132px;isolation:isolate;overflow:hidden}
.pv .cv canvas.sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:-1}
.pv .cv .slot{position:absolute;left:14px;bottom:-4px}
.pv .cv .st{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:650;color:var(--sky-ink);background:var(--sky-glass);box-shadow:0 0 0 1px var(--sky-line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pv .bd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.pv .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pv .who h2{font-family:var(--display);font-weight:300;font-size:30px;letter-spacing:-.03em;line-height:1}
.pv .blk{display:flex;flex-direction:column;gap:7px}
.pv .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.pv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.pv li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink2);line-height:1.45}
.pv li svg{margin-top:2px;color:var(--faint)}
.pv .papp{display:flex;align-items:center;gap:10px}
.pv .papp .tile{width:28px;height:28px;font-size:11px;border-radius:9px 9px 9px 3px}
.pv .papp .t{display:flex;flex-direction:column;min-width:0}
.pv .papp b{font-weight:600;font-size:13px}
.pv .papp small{font-size:12px;color:var(--muted)}
.pv .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.pv .meta > div{display:flex;flex-direction:column;gap:3px;min-width:0}
.pv .meta .v{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.pv .qt{font-size:14px;line-height:1.5;color:var(--ink2)}
.pv .help{display:flex;gap:6px;align-items:flex-start}
.pv .help svg,.sec .help svg{margin-top:2px;flex:none}
.sec .help{display:flex;gap:6px;align-items:flex-start}
.ph .pv .qt{font-size:16px}

.sheetbg{position:absolute;inset:0;background:#000;opacity:.0}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);margin-top:6px;border-radius:12px 12px 0 0;box-shadow:0 -1px 0 var(--line2);position:relative}
.ph .sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line2);margin:6px auto 0}
.snav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 8px;font-size:17px}
.snav b{font-weight:600}
.snav button{all:unset;cursor:pointer;color:var(--muted)}
.snav button.go{font-weight:600;color:var(--ink)}
.snav button.go[aria-disabled="true"]{opacity:.35;cursor:default}
.ph .sbody{padding:4px 16px 40px;display:flex;flex-direction:column;gap:18px}
.ph .q label{font-size:20px;font-weight:700;letter-spacing:-.01em}
.ph .ta textarea{font-size:19px;min-height:96px}
.ph .exs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.ph .exs::-webkit-scrollbar{display:none}
.ph .ex{height:34px;font-size:14px;flex:none}
.ph .nm{max-width:none}
.ph .nm label{font-size:15px}
.ph .pv{position:static;border-radius:20px}
.ph .pv .who h2{font-family:var(--sans);font-weight:700;font-size:26px}
.ph .pv li{font-size:15px}
.ph .pv .papp b,.ph .pv .meta .v{font-size:15px}
.ph .pv .papp small{font-size:13px}
.ph .adv-h b{font-size:17px}
.ph .adv-h small{font-size:13px;white-space:normal}
.ph .opts{grid-template-columns:1fr 1fr}
.ph .opt b{font-size:15px}
.ph .opt small{font-size:13px}
.ph .sec .sh b{font-size:16px}
.ph .sec .sh span{font-size:13px}
.ph .lv .r b{font-size:15px}
.ph .lv .r small{font-size:13px}
.ph .seg.sm button{font-size:14px;height:30px}
.ph .seg.sm .pill{height:30px}
.ph .tog{font-size:14px;height:34px}

/* ---------- Responsive (web) ---------- */
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .ngrid{grid-template-columns:minmax(0,1fr)}
  .pv{position:static}
}
@media (max-width:640px){
  .pbar .r1{padding:8px 12px;gap:6px 8px}

  .invite,.hintline{margin-left:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  });
  if (!picked) return h;

  h += lia(t.ask, { after: needAfter(t, asking) });

  if (!decided) return h;
  if (S.routine) {
    h += mine(esc(t.yes) + ".");
    h += lia(`<p>Feito. Criei a rotina <b>${esc(t.routine)}</b>: ${esc(t.when)}, aqui nesta conversa. O primeiro resultado chega ${esc(t.first)}.</p>`, {
      after: `<div class="acts"><button class="btn sm" data-noop>${I("routine", "sm")}Ver em Rotinas</button></div>`,
    });
  } else {
    h += mine("Agora não.");
    h += lia("Tudo bem. Quando quiser, é só me pedir de novo.");
  }
  if (!S.inviteGone) h += `<div class="invite"><span class="tile">${I("users")}</span><div class="t"><b>Chamar o seu time?</b><p>Quem você convidar também pode pedir coisas ${g(a, "à", "ao")} ${a.name}. Sem pressa: fica em Configurações → Membros.</p>

  h += `<div class="hintline">${I("sparkle", "sm")}Quer outro agente para outra coisa? É só descrever em uma frase.<button class="btn sm" data-tonew>${I("plus", "sm")}Novo agente</button></div>`;
  return h;
}

function needAfter(t, open) {

function workCard(t) {

    <ol id="wkSteps">${t.work.map((w, k) => `<li class="${k < 1 ? "done" : k === 1 ? "now" : "todo"}"><span class="sl">${k < 1 ? I("check", "sm") : k === 1 ? orbit(A().look.color, 10) : I("clock", "sm")}</span>${esc(w)}</li>`).join("")}</ol></div>`;

/* The run's tool steps while it works; interactive runs finish by themselves. */
let workTimer = 0;
function startWork() {
  clearInterval(workTimer);
  if (S.step !== "trabalhando") return;
  const t = T(), dur = 5200, start = S.workAt || performance.now() - 2100;
  workTimer = setInterval(() => {
    const el = $("#work"); if (!el) return clearInterval(workTimer);
    const e = performance.now() - start, k = S.auto ? Math.min(1, e / dur) : 0.4 + ((e / dur) % 1) * 0.35;
    const now = Math.min(t.work.length - 1, Math.floor(k * t.work.length));
    $("#wkLine").textContent = t.work[now];
    $$("#wkSteps li").forEach((li, j) => {
      const st = j < now ? "done" : j === now ? "now" : "todo";
      if (li.className === st) return;
      li.className = st;
      li.querySelector(".sl").innerHTML = st === "done" ? I("check", "sm") : st === "now" ? orbit(A().look.color, 10) : I("clock", "sm");
      hydrate(li);
    });
    if (S.auto && k >= 1) { clearInterval(workTimer); setStep("resultado"); }
  }, 300);
}
