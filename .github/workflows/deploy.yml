name: Deploy

# Production follows main: once CI passes on a push to main, the server deploys that commit with
# deploy/deploy.sh, over SSH. Nothing runs until the DEPLOY_HOST variable exists. Settings:
# - variables DEPLOY_HOST (user@host) and DEPLOY_KNOWN_HOSTS (the server's lines from ssh-keyscan);
# - secret DEPLOY_SSH_KEY, the private key whose authorized_keys line runs deploy/deploy.sh alone;
# - when the server takes SSH only inside a tailnet, secrets TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET: a
#   Tailscale OAuth client that can create auth keys for tag:ci, which joins each run to the tailnet.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# One deploy at a time, never cancelled midway; a newer commit waiting replaces an older one.
concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy main
    if: >-
      vars.DEPLOY_HOST != '' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - name: Join the tailnet
        if: env.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Run deploy/deploy.sh on the server
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$HOST" "$SHA"
