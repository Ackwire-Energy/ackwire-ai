name: Desktop

# The macOS app (ADR 0036): compile the runner for both architectures, build a universal .app + .dmg
# with Tauri (ad-hoc signed, not notarized, no updater), and on a `desktop-v*` tag publish a GitHub
# Release with `agentes_<version>_universal.dmg` and its `.sha256` (the server reads those names).
# Nothing runs on a developer's machine: testing means installing this build.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/server/runner/**"
      - "packages/adapters/**"
      - "packages/ui/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BIN_DIR: apps/desktop/src-tauri/binaries
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: bun install --frozen-lockfile

      - name: Version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          PKG=$(jq -r .version apps/desktop/package.json)
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Versions differ: tauri.conf.json $VERSION, package.json $PKG, Cargo.toml $CARGO"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]] && [ "${GITHUB_REF#refs/tags/desktop-v}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match the app version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The runner ships inside the app as a Tauri sidecar: `binaries/agentes-runner-<target triple>`.
      # A universal build needs both arch binaries (one per cargo build) and the lipo'd universal one.
      - name: Compile the runner
        shell: bash
        run: |
          mkdir -p "$BIN_DIR"
          bun build --compile --target=bun-darwin-arm64 apps/server/runner/main.ts \
            --outfile "$BIN_DIR/agentes-runner-aarch64-apple-darwin"
          bun build --compile --target=bun-darwin-x64 apps/server/runner/main.ts \
            --outfile "$BIN_DIR/agentes-runner-x86_64-apple-darwin"
          lipo -create -output "$BIN_DIR/agentes-runner-universal-apple-darwin" \
            "$BIN_DIR/agentes-runner-aarch64-apple-darwin" "$BIN_DIR/agentes-runner-x86_64-apple-darwin"
          chmod +x "$BIN_DIR"/agentes-runner-*
          lipo -info "$BIN_DIR/agentes-runner-universal-apple-darwin"

      - name: Icons
        working-directory: apps/desktop
        run: |
          bun scripts/icons.ts
          bun run tauri icon app-icon.png

      - name: Build the app (universal, ad-hoc signed)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --target universal-apple-darwin

      - name: Name the dmg and its checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_DIR=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg
          SRC=$(ls "$DMG_DIR"/*.dmg | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::No .dmg in $DMG_DIR"
            exit 1
          fi
          NAME="agentes_${VERSION}_universal.dmg"
          mkdir -p out
          cp "$SRC" "out/$NAME"
          (cd out && shasum -a 256 "$NAME" > "$NAME.sha256")
          cat "out/$NAME.sha256"

      - name: Keep the build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: agentes-${{ steps.version.outputs.version }}-universal
          path: out/*
          retention-days: 14

      # Release notes = the annotated tag's message (`git tag -a desktop-v0.2.0 -m "- Pastas…"`).
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${{ steps.version.outputs.version }}"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.txt
          if [ ! -s notes.txt ] || ! grep -q '[^[:space:]]' notes.txt; then echo "agentes $VERSION" > notes.txt; fi
          gh release create "$TAG" \
            "out/agentes_${VERSION}_universal.dmg" \
            "out/agentes_${VERSION}_universal.dmg.sha256" \
            --title "agentes $VERSION" \
            --notes-file notes.txt
