name: Desktop

# The macOS app (ADR 0036): compile the runner for both architectures, fetch the pinned agent-browser
# (ADR 0040), build a universal .app + .dmg
# with Tauri, signed with our Developer ID and notarized, plus the updater bundle
# signed with the updater key. Started by hand on a `desktop-v*` tag, it publishes a GitHub Release with
# `agentes_<version>_universal.dmg`, its `.sha256`, `…universal.app.tar.gz` and its `.sig`
# (the server reads those names).
# Testing means installing this build.
# macOS runners cost about 10x Linux minutes: this runs only by hand, never per PR; pushing a tag starts nothing.
# Run by hand on main with `release` = fix/feature/major: bumps the version (patch/minor/major) in
# tauri.conf.json, package.json, Cargo.toml and Cargo.lock, commits and tags `desktop-v<version>` on main,
# then builds and publishes the release. `none` only builds the current version as an artifact.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "fix = 0.0.x, feature = 0.x.0, major = x.0.0; none = build only, no release"
        type: choice
        options: [fix, feature, major, none]
        default: fix
      notes:
        description: "Release notes (optional; default = commit subjects since the last release)"
        type: string
        required: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Intel: the Apple silicon runners often sit in the queue (capacity); the build is universal either way.
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BIN_DIR: apps/desktop/src-tauri/binaries
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: bun install --frozen-lockfile

      # Signing and notarization (Developer ID .p12 + App Store Connect API key) and the updater key.
      - name: Signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_API_KEY_P8 TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing"
              exit 1
            fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Before any build step, so a failed bump costs no macOS minutes. Pushes made with the workflow token
      # don't start other workflows.
      - name: Bump the version, commit and tag
        if: ${{ inputs.release && inputs.release != 'none' }}
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main (this run is on $GITHUB_REF); pick release = none for a test build"
            exit 1
          fi
          CURRENT=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$RELEASE" in
            fix) PATCH=$((PATCH + 1)) ;;
            feature) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          esac
          NEXT="$MAJOR.$MINOR.$PATCH"
          TAG="desktop-v$NEXT"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 --match 'desktop-v*' 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES=$(git log --no-merges --format='- %s' ${PREV:+"$PREV"..HEAD} | head -40)
          fi
          # Only the version line changes (jq would reformat the whole file).
          for f in apps/desktop/src-tauri/tauri.conf.json apps/desktop/package.json; do
            perl -0pi -e "s/\"version\": \"\Q$CURRENT\E\"/\"version\": \"$NEXT\"/" "$f"
          done
          perl -0pi -e "s/^version = \"\Q$CURRENT\E\"/version = \"$NEXT\"/m" apps/desktop/src-tauri/Cargo.toml
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(desktop): $NEXT"
          # main may move while this runs: rebase onto it and retry. Commit and tag go up
          # together (--atomic), so a rejected push never leaves a tag outside main.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git tag -f -a "$TAG" -m "$NOTES"
            if git push --atomic origin HEAD:main "refs/tags/$TAG"; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::Couldn't push the version to main"; exit 1; fi
          done
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          PKG=$(jq -r .version apps/desktop/package.json)
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Versions differ: tauri.conf.json $VERSION, package.json $PKG, Cargo.toml $CARGO"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -n "$RELEASE_TAG" ] && [ "${RELEASE_TAG#desktop-v}" != "$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG doesn't match the app version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The runner ships inside the app as a Tauri sidecar: `binaries/agentes-runner-<target triple>`.
      # A universal build needs both arch binaries (one per cargo build) and the lipo'd universal one.
      - name: Compile the runner
        shell: bash
        run: |
          mkdir -p "$BIN_DIR"
          bun build --compile --target=bun-darwin-arm64 apps/server/runner/main.ts \
            --outfile "$BIN_DIR/agentes-runner-aarch64-apple-darwin"
          bun build --compile --target=bun-darwin-x64 apps/server/runner/main.ts \
            --outfile "$BIN_DIR/agentes-runner-x86_64-apple-darwin"
          lipo -create -output "$BIN_DIR/agentes-runner-universal-apple-darwin" \
            "$BIN_DIR/agentes-runner-aarch64-apple-darwin" "$BIN_DIR/agentes-runner-x86_64-apple-darwin"
          chmod +x "$BIN_DIR"/agentes-runner-*
          lipo -info "$BIN_DIR/agentes-runner-universal-apple-darwin"

      # agent-browser ships next to the runner as a second sidecar (ADR 0040): the pinned release, checked
      # against the SHA-256 in machine-protocol.ts (the one source of the version and the hashes), lipo'd
      # for the universal build. Tauri re-signs it with the Developer ID and the hardened runtime.
      - name: Fetch agent-browser
        shell: bash
        run: |
          bun -e '
            import { AGENT_BROWSER_SHA256, AGENT_BROWSER_VERSION, agentBrowserAsset } from "./packages/adapters/src/machine-protocol.ts";
            for (const target of ["darwin-arm64", "darwin-x64"]) {
              console.log([AGENT_BROWSER_VERSION, agentBrowserAsset(target), AGENT_BROWSER_SHA256[target]].join(" "));
            }
          ' > "$RUNNER_TEMP/agent-browser.txt"
          while read -r VERSION ASSET SHA; do
            case "$ASSET" in
              *darwin-arm64) TRIPLE=aarch64-apple-darwin ;;
              *darwin-x64) TRIPLE=x86_64-apple-darwin ;;
            esac
            OUT="$BIN_DIR/agent-browser-$TRIPLE"
            curl -fsSL --retry 3 -o "$OUT" \
              "https://github.com/vercel-labs/agent-browser/releases/download/v$VERSION/$ASSET"
            echo "$SHA  $OUT" | shasum -a 256 -c -
          done < "$RUNNER_TEMP/agent-browser.txt"
          lipo -create -output "$BIN_DIR/agent-browser-universal-apple-darwin" \
            "$BIN_DIR/agent-browser-aarch64-apple-darwin" "$BIN_DIR/agent-browser-x86_64-apple-darwin"
          chmod +x "$BIN_DIR"/agent-browser-*
          lipo -info "$BIN_DIR/agent-browser-universal-apple-darwin"

      - name: Icons
        working-directory: apps/desktop
        run: |
          bun scripts/icons.ts
          bun run tauri icon app-icon.png

      - name: Build the app (universal, signed, notarized)
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --target universal-apple-darwin

      - name: Check the signature and the notarization
        shell: bash
        run: |
          APP=$(ls -d apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/agentes-runner"
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/agent-browser"
          "$APP/Contents/MacOS/agent-browser" --version
          test -s "$APP/Contents/Resources/licenses/agent-browser/LICENSE"
          test -s "$APP/Contents/Resources/licenses/bun/LICENSE.md"
          test -s "$APP/Contents/Resources/LICENSE"
          test -s "$APP/Contents/Resources/NOTICE"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Name the build files and the checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          DMG_DIR=$BUNDLE/dmg
          SRC=$(ls "$DMG_DIR"/*.dmg | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::No .dmg in $DMG_DIR"
            exit 1
          fi
          NAME="agentes_${VERSION}_universal.dmg"
          mkdir -p out
          cp "$SRC" "out/$NAME"
          (cd out && shasum -a 256 "$NAME" > "$NAME.sha256")
          cat "out/$NAME.sha256"
          TGZ=$(ls "$BUNDLE"/macos/*.app.tar.gz | head -1)
          if [ -z "$TGZ" ] || [ ! -s "$TGZ.sig" ]; then
            echo "::error::No signed updater bundle in $BUNDLE/macos"
            exit 1
          fi
          cp "$TGZ" "out/agentes_${VERSION}_universal.app.tar.gz"
          cp "$TGZ.sig" "out/agentes_${VERSION}_universal.app.tar.gz.sig"

      - name: Keep the build
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: agentes-${{ steps.version.outputs.version }}-universal
          path: out/*
          retention-days: 14

      # Release notes = the annotated tag's message (`git tag -a desktop-v0.2.0 -m "- Pastas…"`).
      - name: Publish the release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${{ steps.version.outputs.version }}"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.txt
          if [ ! -s notes.txt ] || ! grep -q '[^[:space:]]' notes.txt; then echo "agentes $VERSION" > notes.txt; fi
          gh release create "$TAG" \
            "out/agentes_${VERSION}_universal.dmg" \
            "out/agentes_${VERSION}_universal.dmg.sha256" \
            "out/agentes_${VERSION}_universal.app.tar.gz" \
            "out/agentes_${VERSION}_universal.app.tar.gz.sig" \
            --title "agentes $VERSION" \
            --notes-file notes.txt
