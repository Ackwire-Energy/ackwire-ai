name: CI

# All verification runs here, never on the developer's machine.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bun run lint
      - name: Boundaries (core must not import cloud/ or ee/)
        if: success() || failure()
        run: bun run check:boundaries
      - name: Typecheck
        if: success() || failure()
        run: bun run typecheck
      - name: Test
        if: success() || failure()
        run: bun test
      - name: Build web and server
        if: success() || failure()
        run: bun run build
      - name: Isolated new-event test (diagnostic, non-blocking)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          RUN_NEW_EVENT: "1"
        run: test -f apps/web/test/new-event.test.tsx && bun test --timeout 20000 apps/web/test/new-event.test.tsx || true
