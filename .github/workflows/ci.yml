name: CI

# All verification runs here, never on the developer's machine.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bun run lint
      - name: Boundaries (core must not import cloud/ or ee/)
        run: bun run check:boundaries
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build web and server
        run: bun run build
