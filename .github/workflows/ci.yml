name: CI

# All verification runs here, never on the developer's machine.
# Manual only (Actions minutes cost money): run it from the Actions tab or `gh workflow run ci.yml --ref main`.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # A manual run checks everything (the groups below stay so a filter can come back later).
      - name: What runs
        id: changed
        run: |
          for g in shared backend web mobile desktop; do echo "$g=true" >> "$GITHUB_OUTPUT"; done
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bun run lint
      - name: Boundaries (core must not import cloud/ or ee/)
        if: success() || failure()
        run: bun run check:boundaries
      - name: Typecheck
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck.log
      # Two processes: the browser-DOM tests (web app, design system) never share one with the
      # backend tests (PGlite, servers). In one process the first PGlite database after the DOM
      # files sometimes never came up, and the whole step hung until the timeout.
      - name: Test (backend)
        if: (success() || failure()) && (steps.changed.outputs.shared == 'true' || steps.changed.outputs.backend == 'true')
        # The backend suite takes about 15 minutes on a runner (2026-10-20) and grows.
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          bun test packages/adapters packages/config packages/db packages/engine packages/modules packages/providers packages/client packages/i18n packages/tokens apps/server 2>&1 | tee test.log
      - name: Test (web and design system)
        if: (success() || failure()) && (steps.changed.outputs.shared == 'true' || steps.changed.outputs.web == 'true' || steps.changed.outputs.mobile == 'true' || steps.changed.outputs.desktop == 'true')
        timeout-minutes: 10
        shell: bash
        env:
          SHARED: ${{ steps.changed.outputs.shared }}
          WEB: ${{ steps.changed.outputs.web }}
          MOBILE: ${{ steps.changed.outputs.mobile }}
          DESKTOP: ${{ steps.changed.outputs.desktop }}
        run: |
          set -o pipefail
          # Only the groups whose code changed (shared packages change them all).
          paths=()
          if [ "$SHARED" = true ] || [ "$WEB" = true ]; then paths+=(apps/web packages/ui); fi
          if [ "$SHARED" = true ] || [ "$MOBILE" = true ]; then paths+=(apps/mobile/test); fi
          if [ "$SHARED" = true ] || [ "$DESKTOP" = true ]; then paths+=(apps/desktop/test); fi
          bun test "${paths[@]}" 2>&1 | tee -a test.log
      # GitHub's log storage sometimes loses logs; keep the errors as an artifact and in the summary.
      - name: Keep errors
        if: always()
        shell: bash
        run: |
          {
            echo '### Typecheck errors'; echo '```'; grep -E 'error TS' typecheck.log 2>/dev/null | head -80 || true; echo '```'
            echo '### Failed tests'; echo '```'; grep -E '\(fail\)|error:' test.log 2>/dev/null | head -80 || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            typecheck.log
            test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build web and server
        if: (success() || failure()) && (steps.changed.outputs.shared == 'true' || steps.changed.outputs.backend == 'true' || steps.changed.outputs.web == 'true')
        run: bun run build
      - name: Isolated new-event test (diagnostic, non-blocking)
        if: always() && (steps.changed.outputs.shared == 'true' || steps.changed.outputs.web == 'true')
        continue-on-error: true
        timeout-minutes: 3
        env:
          RUN_NEW_EVENT: "1"
        run: test -f apps/web/test/new-event.test.tsx && bun test --timeout 20000 apps/web/test/new-event.test.tsx || true
