[test]
# Browser DOM for the web app and design system tests, attached only while
# those files run (see packages/ui/testing/dom.ts). The db preload raises the
# default test timeout (first PGlite migration of each file).
preload = ["./packages/db/test/preload.ts", "./packages/ui/testing/preload.ts", "./packages/ui/testing/preload-done.ts"]

[install]
# Each package sees only its own dependencies. Bun picks this for workspaces only in lockfiles
# made from Bun 1.3.2 on; ours is older, so without this line it would hoist everything.
linker = "isolated"
