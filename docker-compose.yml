# agentes.chat: the app and Postgres with pgvector. To set it up, in an empty directory:
#   npx @agenteschat/setup
# By hand, and everything else: SELF_HOSTING.md.
#
# How people reach it, by COMPOSE_PROFILES in .env:
#   tailscale  private HTTPS on your tailnet at https://<TS_HOSTNAME>.<tailnet>.ts.net, no domain and no
#              open port (the setup's default; TS_AUTHKEY joins it to the tailnet on the first start)
#   https      a public DOMAIN with a Let's Encrypt certificate (Caddy), on ports 80 and 443
#   neither    http://localhost:3000 on this machine only
#
# Upgrade: download this file again (settings live in .env, never here), then docker compose pull
# && docker compose up -d (migrations run on boot). To hold a version, set AGENTES_IMAGE in .env to
# a version tag or an @sha256 digest.
services:
  postgres:
    # pgvector: the first migration creates the vector extension.
    image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_USER: agentes
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: agentes
    volumes:
      # Postgres 18 images keep their data in /var/lib/postgresql/18/docker, under this mount.
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      # Over TCP: on first start the init server listens only on the Unix socket, then restarts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentes -d agentes"]
      interval: 5s
      timeout: 5s
      retries: 10

  agentes:
    image: "${AGENTES_IMAGE:-ghcr.io/agentes-chat/agentes:latest}"
    env_file: .env
    environment:
      DATABASE_URL: "postgres://agentes:${POSTGRES_PASSWORD}@postgres:5432/agentes"
      FILES_DIR: /data/files
    volumes:
      - files:/data/files
    ports:
      # Loopback by default: Docker publishes ports through iptables, past any host firewall.
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Above the 20 s that runs in progress get to finish on SIGTERM (RUN_DRAIN_MS, apps/server/src/start.ts).
    stop_grace_period: 40s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    profiles: ["tailscale"]
    # Joins the tailnet as TS_HOSTNAME and serves HTTPS with Tailscale's certificate, proxied to the app
    # (WebSockets included), with X-Forwarded-For set to the client alone. Userspace networking: no
    # /dev/net/tun, no NET_ADMIN, nothing published on this machine.
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_HOSTNAME: "${TS_HOSTNAME:-agentes}"
      TS_EXTRA_ARGS: "${TS_EXTRA_ARGS:-}"
      TS_STATE_DIR: /var/lib/tailscale
      # The key logs in once; after that the node logs in from its state in the volume.
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
    configs:
      - source: tailscale-serve-${TAILSCALE_FUNNEL:-false}
        target: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
    restart: unless-stopped
    healthcheck:
      # 200 once the node has a tailnet address.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: ["https"]
    # Certificate for DOMAIN, http → https redirect, WebSockets, and X-Forwarded-For set to the client alone.
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to agentes:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The caddy binary has this file capability; without it in the bounding set, exec fails.
    cap_add:
      - NET_BIND_SERVICE

configs:
  # Tailscale's serve config. The container fills in TS_CERT_DOMAIN, its ts.net name ($$ keeps it from
  # Compose). TAILSCALE_FUNNEL in .env picks one: true opens it to the internet (SELF_HOSTING.md). Two
  # configs rather than the variable inside the JSON: any other value then fails at docker compose up,
  # where invalid JSON would make the container exit at every start.
  tailscale-serve-false:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": { "$${TS_CERT_DOMAIN}:443": { "Handlers": { "/": { "Proxy": "http://agentes:3000" } } } }
      }
  tailscale-serve-true:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": { "$${TS_CERT_DOMAIN}:443": { "Handlers": { "/": { "Proxy": "http://agentes:3000" } } } },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": true }
      }

volumes:
  pgdata:
  files:
  caddy-data:
  tailscale-state:
