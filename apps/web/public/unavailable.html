<script>
// Before the first paint, as index.html does. Mirrors the app's choices: STORAGE_KEYS.theme
// (apps/web/src/lib/storage.ts), savedLocale (apps/web/src/i18n/index.ts) and appLocale
// (packages/i18n/src/locale.ts), plus the landing's agentes_locale cookie. index.html's boot box picks the same way, from the same 14 languages.
(() => {
  const html = document.documentElement;
  const saved = (key) => {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  };
  try {
    let theme = saved("agentes.theme");
    if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    html.dataset.theme = theme;
  } catch {}
  const CODES = ["en", "pt-BR", "es", "fr", "de", "it", "nl", "ja", "ko", "zh-Hans", "id", "tr", "pl", "ru"];
  const known = (tag) => {
    const base = String(tag || "").toLowerCase().replace(/_/g, "-").split("-")[0];
    const code = base === "pt" ? "pt-BR" : base === "zh" ? "zh-Hans" : base === "in" ? "id" : base;
    return CODES.includes(code) ? code : null;
  };
  const lang = () => {
    const stored = saved("agentes.locale");
    if (stored && stored !== "auto" && known(stored)) return known(stored);
    const cookie = /(?:^|;\s*)agentes_locale=([\w-]+)/.exec(document.cookie);
    if (stored !== "auto" && cookie && known(cookie[1])) return known(cookie[1]);
    const tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
    for (const tag of tags) if (known(tag)) return known(tag);
    return "en";
  };
  html.lang = lang();
  const app = window.__agentesDesktop;
  if (app) html.dataset.desktop = app.platform === "windows" || app.platform === "linux" ? app.platform : "mac";
})();
</script>

    pl: ["Ackwire AI zaraz wróci", "Serwer teraz nie odpowiada. Ta strona otworzy się sama, gdy tylko wróci.", "Jeśli płatność właśnie została zrealizowana, nie trzeba płacić ponownie.", "Spróbuj teraz"],

  };
  const MISS = [502, 503, 504, 520, 521, 522, 523, 524, 525, 526, 527, 530];
  const byId = (id) => document.getElementById(id);
  const words = WORDS[document.documentElement.lang];
  if (words) {
    document.title = words[0];
    ["title", "text", "paid", "retry"].forEach((id, i) => {
      byId(id).textContent = words[i];
    });
  }
  if (location.pathname === "/done") byId("paid").hidden = false;
  const target = location.pathname === "/unavailable.html" ? "/" : location.pathname + location.search;
  const probe = target.startsWith("/api/") ? "/api/health" : target;
  const retry = byId("retry");
  retry.href = target;
  retry.addEventListener("click", (event) => {
    event.preventDefault();
    location.replace(target);
  });
  let wait = 3000;
  let timer = 0;
  let asking = false;
  const later = () => {
    asking = false;
    clearTimeout(timer);
    timer = setTimeout(ask, wait);
    wait = Math.min(wait * 1.5, 30000);
  };
  function ask() {
    clearTimeout(timer);
    if (asking || document.visibilityState === "hidden") return;
    asking = true;
    fetch(probe, { cache: "no-store", credentials: "same-origin", redirect: "manual" }).then(
      (res) => (MISS.includes(res.status) ? later() : location.replace(target)),
      later,

  }

  addEventListener("online", ask);
