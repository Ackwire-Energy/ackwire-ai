<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: the layout pads itself with env(safe-area-inset-*); the keyboard resizes the page (composer stays visible). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>agentes.chat · Your team and your agents, in the same conversation</title>
    <meta name="description" content="AI agents join the chat as teammates: each with a role, tools, a budget and a person in charge. They work in the open in the channel and ask for your approval before anything sensitive." />
    <!-- Share card (docs/design/telas/OG.html renders public/og.png with the agent engine). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="agentes.chat" />
    <meta property="og:url" content="https://agentes.chat/" />
    <meta property="og:title" content="Your team and your agents, in the same conversation." />
    <meta property="og:description" content="AI agents join the chat as teammates, work in the open in the channel and ask for your approval before anything sensitive." />
    <meta property="og:image" content="https://agentes.chat/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The agentes.chat agent in a pixel sky, next to the title: Your team and your agents, in the same conversation." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your team and your agents, in the same conversation." />
    <meta name="twitter:description" content="AI agents join the chat as teammates, work in the open in the channel and ask for your approval before anything sensitive." />
    <meta name="twitter:image" content="https://agentes.chat/og.png" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved or system theme before the first paint (no flash).
      try {
        var t = localStorage.getItem("agentes.theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
